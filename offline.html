1", "title": "免费的建议，值你付的价", "grade": "C", "impact": "自己", "cost_money": "无", "cost_time": "低", "cost_will": "无", "three_zero": false, "spend": "对“免费荐股/免费带单”的戒心。", "gain": "任何免费的投资建议，背后都有人在别处赚钱——流量、开户返佣、抬轿、卖课。把它当成“广告”而不是“善意”，能过滤掉绝大多数噪音。", "source": "利益冲突与信息中介研究；金融监管总局投资者教育材料。", "plain": "天上不会掉免费且靠谱的致富信息。对方不收你钱，是因为你本身就是他的产品。先想他赚谁的钱，再决定听不听。", "notes": []}, {"chapter": 16, "num": 2, "id": "16-2", "title": "谁在给你建议，他赚谁的钱", "grade": "C", "impact": "自己", "cost_money": "无", "cost_time": "低", "cost_will": "无", "three_zero": false, "spend": "轻信权威光环的本能。", "gain": "把每条建议重写成“这条建议让谁受益”。卖方研究员靠分仓佣金、大V靠流量、理财师靠产品返点、自媒体靠带货——他们的利益和你并不天然一致。", "source": "证券研究利益冲突监管（研究报告隔离墙/适当性管理）；行为金融利益偏差研究。", "plain": "别问“他说得对不对”，先问“他靠这个赚谁的钱”。利益一致的才值得听，利益对立的自动打折。", "notes": []}, {"chapter": 16, "num": 3, "id": "16-3", "title": "基金经理的过往业绩，不预示未来", "grade": "A", "impact": "自己", "cost_money": "无", "cost_time": "低", "cost_will": "无", "three_zero": false, "spend": "追“去年冠军基”的冲动。", "gain": "标普 SPIVA 与多项学术研究一致显示，当年排名靠前的基金，次年大概率回归平庸甚至落后；业绩持续性极弱。追涨明星基金，本质是买过去、赌未来。", "source": "S&P SPIVA 系列报告；基金业绩持续性文献（如 Carhart 1997 动量三因子）。", "plain": "去年涨得最好的基金，今年往往不行。业绩榜是“回放”不是“预告”。真要看，看长期、看风格、看费率，别看排名。", "notes": []}, {"chapter": 16, "num": 4, "id": "16-4", "title": "财经大V的幸存者偏差", "grade": "C", "impact": "自己", "cost_money": "无", "cost_time": "低", "cost_will": "无", "three_zero": false, "spend": "对“他每次都对”的迷信。", "gain": "喊对方向的博主被算法推上热门，喊错的无声消失，你看到的永远是“幸存者”。这让人系统性高估他人的预测能力。", "source": "媒体与算法幸存者偏差研究；行为金融。", "plain": "你刷到的“神预测”博主，只是运气好没被淹死的那个。沉默的大多数喊错了就删帖，你看不见。", "notes": []}, {"chapter": 16, "num": 5, "id": "16-5", "title": "媒体头条制造焦虑，但不制造 alpha", "grade": "C", "impact": "自己", "cost_money": "无", "cost_time": "低", "cost_will": "低", "three_zero": false, "spend": "被新闻牵着交易的手。", "gain": "新闻天生偏好负面与极端（注意力经济），而市场已大概率 price in 已知信息。据头条买卖，等于用最贵的情绪买最旧的消息。", "source": "新闻情绪与资产价格研究（如 Tetlock 媒体情绪指数）；市场有效性文献。", "plain": "头条越吓人越想操作，但吓你的消息市场早就知道了。盯着新闻做交易，长期稳定亏。", "notes": []}, {"chapter": 16, "num": 6, "id": "16-6", "title": "研报看结论，也要看屁股坐在哪", "grade": "C", "impact": "自己", "cost_money": "无", "cost_time": "低", "cost_will": "低", "three_zero": false, "spend": "把卖方“买入”评级当圣旨。", "gain": "卖方研究与投行承销高度绑定，“买入”评级占比长期畸高、中性/卖出极少。看研报学框架和数据，别直接抄结论和评级。", "source": "证券分析师利益冲突与评级偏差研究；适当性管理规则。", "plain": "全市场 90% 都是“买入”评级，那评级本身就没什么信息量。研报当资料库用，结论自己判断。", "notes": []}, {"chapter": 16, "num": 7, "id": "16-7", "title": "回测漂亮的策略，实盘常崩", "grade": "B", "impact": "自己", "cost_money": "低", "cost_time": "低", "cost_will": "低", "three_zero": false, "spend": "迷信“年化 30%、回撤 5%”的策略书。", "gain": "过度拟合让策略在历史上完美、在未来失效——调参数直到曲线好看，等于作弊。业内估计大量“亮眼回测”无法样本外复现。", "source": "Bailey & López de Prado 系列（回测过拟合/概率夏普比）；P-hacking 文献。", "plain": "凡是把历史曲线做得特别漂亮的“圣杯策略”，多半是把过去的数据调到刚好贴合。真金要看来未知的实盘。", "notes": []}, {"chapter": 16, "num": 8, "id": "16-8", "title": "用“我有没有反向证据”代替“我是不是对的”", "grade": "C", "impact": "自己", "cost_money": "无", "cost_time": "低", "cost_will": "中", "three_zero": false, "spend": "为已有观点找佐证的惯性。", "gain": "确认偏误让你只看支持自己的信息。强制自己找“如果我是错的，证据在哪”，可显著降低踩坑率。这是性价比最高的认知升级。", "source": "认知偏差与科学方法论研究（确认偏误 / 证伪主义）。", "plain": "别总在证明自己对，那太容易了。逼自己找“我可能错了”的证据，找不到再说“我大概率对”——这才值钱。", "notes": []}, {"chapter": 16, "num": 9, "id": "16-9", "title": "小道消息到你耳朵时，已经 price in", "grade": "C", "impact": "自己", "cost_money": "无", "cost_time": "无", "cost_will": "无", "three_zero": true, "spend": "根据“内部消息”下注的幻想。", "gain": "真有信息优势的人，自己悄悄赚完了；等传到群里、饭局上，市场早把那点预期消化了。听消息买，通常是接最后一棒。", "source": "信息不对称与有效市场半强式有效假说。", "plain": "群里“稳赚”的消息，传到你这层已经不知道几手了。真有肉，轮不到你。靠消息炒股，长期是给先手送钱。", "notes": []}, {"chapter": 16, "num": 10, "id": "16-10", "title": "订阅越少越好，信息过载是隐性成本", "grade": "C", "impact": "自己", "cost_money": "低", "cost_time": "中", "cost_will": "中", "three_zero": false, "spend": "减少信息源、关掉推送的克制。", "gain": "信息越多，交易冲动与过度自信越强，决策质量反而下降。固定几个权威源（官方、年报、指数公司），其余默认屏蔽。", "source": "信息过载与决策质量研究；注意力经济学。", "plain": "你亏钱很多时候是因为“看太多了”。关掉推送、少看群，反而更赚。信息不是越多越好。", "notes": []}, {"chapter": 16, "num": 11, "id": "16-11", "title": "学会计看三张表，比听人荐股靠谱", "grade": "C", "impact": "自己", "cost_money": "低", "cost_time": "中", "cost_will": "中", "three_zero": false, "spend": "学财务基础的时间。", "gain": "能自己读利润表/资产负债表/现金流量表，你就有了过滤噪音的底层能力，不再依赖别人的“解读”。这是一次投入、长期复利的护城河。", "source": "投资者教育与财务素养研究；基本面分析框架。", "plain": "别人给你“利好”，你能翻开财报自己看赚不赚钱、钱从哪来，就不会被话术牵着走。这是最硬的自保技能。", "notes": []}, {"chapter": 16, "num": 12, "id": "16-12", "title": "把每句“推荐”翻译成“他在赚什么”", "grade": "C", "impact": "自己", "cost_money": "无", "cost_time": "低", "cost_will": "低", "three_zero": false, "spend": "一句思维习惯的切换。", "gain": "荐股群、直播间、理财课、银行推销——统一套用“他靠这条建议赚谁的钱”模型，90% 的推销会自动现形，决策噪音断崖下降。", "source": "利益冲突分析框架；行为金融。", "plain": "这是一条万能滤网。任何“为你好”的理财建议，先翻译成“他赚谁的钱”。翻译完，该信的不用劝，不该信的也不用烦。", "notes": []}, {"chapter": 17, "num": 1, "id": "17-1", "title": "利率是资产价格的引力", "grade": "B", "impact": "自己", "cost_money": "无", "cost_time": "低", "cost_will": "无", "three_zero": false, "spend": "理解折现模型的一课。", "gain": "股票、债券、房产的价值都来自未来现金流的折现；利率上升，分母变大，几乎所有资产价格承压；反之亦然。这是理解“为什么加息市场跌”的底层逻辑。", "source": "资产定价与久期理论；贴现现金流模型。", "plain": "利率就像资产的引力。加息=引力变大，价格往下掉；降息=引力变小，价格往上飘。别只盯消息，看利率方向。", "notes": []}, {"chapter": 17, "num": 2, "id": "17-2", "title": "收益率曲线倒挂预示衰退，但不是闹钟", "grade": "B", "impact": "自己", "cost_money": "无", "cost_time": "低", "cost_will": "无", "three_zero": false, "spend": "对“倒挂就立刻崩”的误读。", "gain": "纽约联储用长短期利差构建的模型显示，曲线倒挂后未来 12 个月衰退概率显著上升，但领先时间不确定（常滞后 6–18 个月），且会误报。它是预警，不是指令。", "source": "New York Fed “Probability of US Recession Predicted by Treasury Spread”；利差-衰退文献。", "plain": "短债利率高过长债（倒挂），历史上常是衰退前兆，但“多久后、会不会来”没人精确知道。当警报看，别当扳机用。", "notes": []}, {"chapter": 17, "num": 3, "id": "17-3", "title": "通胀高时，现金和长债都受伤", "grade": "B", "impact": "自己", "cost_money": "无", "cost_time": "低", "cost_will": "无", "three_zero": false, "spend": "通胀期的资产配置意识。", "gain": "高通胀侵蚀现金购买力，也压低长久期债券价格（利率上行）。能对抗的往往是股票、通胀保值债（TIPS）、部分实物资产——但都不是完美对冲。", "source": "通胀与资产回报长期研究（如 Siegel, Stocks for the Long Run）；债券久期。", "plain": "钱放着不动，通胀帮你悄悄贬值；长债在加息抗通胀时也会跌。想扛通胀，得持有一点能跟物价走的资产。", "notes": []}, {"chapter": 17, "num": 4, "id": "17-4", "title": "别试图择时宏观，专业机构也常错", "grade": "A", "impact": "自己", "cost_money": "无", "cost_time": "低", "cost_will": "无", "three_zero": false, "spend": "根据“专家说要崩/要涨”调仓的冲动。", "gain": "大量研究表明，即便是专业策略师与基金经理，宏观与市场方向预测准确率也仅略高于随机；据此频繁调仓，交易成本与踏空损失远超预测收益。", "source": "宏观预测准确度研究（如利率/汇率预测偏差文献）；SPIVA 择时相关。", "plain": "连拿高薪的首席经济学家都猜不准拐点。你根据“感觉要跌”反复进出，基本是在给券商打工。定好配置，少动。", "notes": []}, {"chapter": 17, "num": 5, "id": "17-5", "title": "美元强弱，直接乘在你的海外回报上", "grade": "B", "impact": "自己", "cost_money": "无", "cost_time": "低", "cost_will": "无", "three_zero": false, "spend": "算海外资产时把汇率算进去。", "gain": "买美股/美债/港股，最终本币回报 = 资产收益 × 汇率变动。美元走弱，你的外币收益会被吃掉一截；反之加成。汇率是看不见的第二层收益或亏损。", "source": "汇率风险与跨国投资回报研究；外汇敞口文献。", "plain": "你美股赚了 10%，美元跌了 5%，回到人民币只赚 5%。汇率这道乘法，很多人买完才想起来。", "notes": []}, {"chapter": 17, "num": 6, "id": "17-6", "title": "衰退里好公司也被错杀，是机会也是陷阱", "grade": "C", "impact": "自己", "cost_money": "低", "cost_time": "低", "cost_will": "中", "three_zero": false, "spend": "区分“暂时下跌”和“基本面坏掉”的功课。", "gain": "系统性下跌时，优质资产常被无差别抛售，提供买入机会；但同样有很多是基本面真出问题。关键看下跌是“市场恐慌”还是“公司变差”。", "source": "市场微观结构与错杀研究；价值投资框架。", "plain": "崩盘时好股票也会跟着跌，那是便宜捡筹的机会；但别把“跌得多”当“便宜”，有些是真的烂了。分清暂时和永久。", "notes": []}, {"chapter": 17, "num": 7, "id": "17-7", "title": "加息周期末端，债券往往先企稳", "grade": "B", "impact": "自己", "cost_money": "无", "cost_time": "低", "cost_will": "无", "three_zero": false, "spend": "对债券“跌了就不敢买”的误判。", "gain": "债券价格与利率反向；当市场预期加息接近尾声，长债价格常提前见底回升，早于股市情绪反转。它是利率周期的“领先指标”之一。", "source": "利率周期与债券价格关系研究；久期。", "plain": "大家都在怕加息时，债券可能已经跌到头了。利率一旦见顶回落，债比股更早企稳——别等所有人都乐观了才想起来买。", "notes": []}, {"chapter": 17, "num": 8, "id": "17-8", "title": "黄金是保险，不是主食", "grade": "C", "impact": "自己", "cost_money": "无", "cost_time": "低", "cost_will": "无", "three_zero": false, "spend": "把黄金当“稳赚投资”的预期。", "gain": "长期看，黄金实际回报接近零甚至为负，不产生现金流；它的价值是极端风险（货币信用危机、地缘冲突）时的对冲，配置 5–10% 即可，别重仓当增值主力。", "source": "黄金长期实际回报研究（如 IMF/世界黄金协会长期数据）。", "plain": "黄金不生息、长期不怎么涨，它的用处是“世界乱了它顶一下”。配一点当保险就行，别拿来当主要资产。", "notes": []}, {"chapter": 17, "num": 9, "id": "17-9", "title": "汇率对你的最终回报有乘数效应", "grade": "B", "impact": "自己", "cost_money": "无", "cost_time": "低", "cost_will": "无", "three_zero": false, "spend": "跨境投资前评估汇率敞口。", "gain": "本币计价的海外资产回报，会被投资期汇率变动放大或缩水。无对冲的单一外币重仓，等于额外押了一把汇率方向的注。", "source": "汇率风险与对冲研究；跨国组合配置。", "plain": "同一条海外资产，汇率能让你多赚也能让你白干。重仓外币前，先想清楚你是看好资产还是顺带赌了汇率。", "notes": []}, {"chapter": 17, "num": 10, "id": "17-10", "title": "听“末日预言”要打折，预言家靠频率取胜", "grade": "C", "impact": "自己", "cost_money": "无", "cost_time": "低", "cost_will": "无", "three_zero": false, "spend": "对“崩盘将至”文章的恐慌。", "gain": "常年喊崩的人，总有一次喊对；一次对足以封神，但此前的数十次错无人记得。用基础概率想：喊了十年崩，蒙对一次不代表有预测力。", "source": "预测准确度研究（如 Tetlock 专家判断）；基础概率谬误。", "plain": "那些“马上崩盘”的预言家，喊得够久总会对一次。别被一次蒙对吓到，看他过去十年错了多少次。", "notes": []}, {"chapter": 17, "num": 11, "id": "17-11", "title": "放水推高资产，也稀释币值，是双刃", "grade": "C", "impact": "自己", "cost_money": "无", "cost_time": "低", "cost_will": "无", "three_zero": false, "spend": "对“央行印钱=股市必涨”的简化理解。", "gain": "宽松货币抬升资产价格，但同样削弱本币购买力、推高未来通胀。短期利多风险资产，长期用通胀把收益部分收回。理解这层，才不会被“放水叙事”单向绑架。", "source": "货币政策与资产价格研究；量化宽松传导机制。", "plain": "央行放水，股票房子涨，但钱也毛了。这是两头下注——你资产涨了，购买力也在悄悄缩水。别只看见一边。", "notes": []}, {"chapter": 17, "num": 12, "id": "17-12", "title": "经济新闻的“好于/差于预期”，才是真信号", "grade": "C", "impact": "自己", "cost_money": "无", "cost_time": "低", "cost_will": "无", "three_zero": false, "spend": "被标题“GDP 增速 X%”本身带节奏。", "gain": "市场反应看的是“实际 vs 预期差”，不是绝对数字。一个数字“差但好于恐慌预期”，资产反而涨。盯“预期差”比盯“数字”更接近市场逻辑。", "source": "预期差与市场反应研究（盈利惊喜/宏观惊喜文献）。", "plain": "新闻说“经济差”，但没大家想的那么差，股市可能涨。市场炒的是“超出或低于预期”，不是数字本身。", "notes": []}, {"chapter": 18, "num": 1, "id": "18-1", "title": "你的工资，是人生最大的一笔本金", "grade": "C", "impact": "自己/家庭", "cost_money": "无", "cost_time": "低", "cost_will": "无", "three_zero": false, "spend": "把“投资”只理解为买股票基金的窄视角。", "gain": "年轻时是人力资本（未来收入能力）主导家庭资产负债表，远超已有金融资产。提升收入能力的复利，远大于同等时间研究基金。先把自己这头资产做大。", "source": "人力资本与生命周期投资理论（如 Bodie, Merton, Samuelson）。", "plain": "二十来岁你最大的资产不是那点存款，是“未来几十年能赚钱的自己”。把提升收入能力当第一笔投资，回报远超研究基金。", "notes": []}, {"chapter": 18, "num": 2, "id": "18-2", "title": "谈一次薪，可能抵一年理财", "grade": "C", "impact": "自己/家庭", "cost_money": "低", "cost_time": "低", "cost_will": "中", "three_zero": false, "spend": "谈薪前做功课与演练的精力。", "gain": "薪资差距会被每年复利放大——多谈下的 10%，十年累计远高于同等资金买基金的增值，且零风险。多数人不谈薪，等于每年白送复利。", "source": "薪酬谈判实验与收入差异研究；复利测算。", "plain": "入职/调薪时多谈 10%，是零风险、且年年复利的收益。很多人羞于谈薪，等于每年主动放弃一笔钱。", "notes": []}, {"chapter": 18, "num": 3, "id": "18-3", "title": "主业技能是复利，别只盯着副业", "grade": "C", "impact": "自己", "cost_money": "无", "cost_time": "低", "cost_will": "低", "three_zero": false, "spend": "对“搞副业才叫搞钱”的执念。", "gain": "把时间砸在主业纵深（成为前 20%）带来的升职加薪，复利远高于分散做多个浅层副业。主业是基本盘，副业是锦上添花而非替代。", "source": "人力资本回报与专长溢价研究。", "plain": "与其摊薄精力做十个浅副业，不如把主业做到前 20%，升职加薪的复利更猛。基本盘厚了，副业才稳。", "notes": []}, {"chapter": 18, "num": 4, "id": "18-4", "title": "职业中断的成本，被严重低估", "grade": "C", "impact": "自己/家庭", "cost_money": "无", "cost_time": "低", "cost_will": "无", "three_zero": false, "spend": "评估离职/长期 gap 的真实代价。", "gain": "空窗期不止损失当期收入，还打断资历累积、社保连续性与行业人脉，复出常面临降档。重大决定前把这笔隐性减值算进账。", "source": "职业中断与收入恢复研究（如产假/失业后收入轨迹）。", "plain": "辞职躺平或长期脱产，亏的不止那几个月工资，是资历、社保和圈子的断档。复出常要降档，这笔账很多人没算。", "notes": []}, {"chapter": 18, "num": 5, "id": "18-5", "title": "把“自己”当一家小公司经营", "grade": "C", "impact": "自己", "cost_money": "无", "cost_time": "低", "cost_will": "低", "three_zero": false, "spend": "用经营者视角审视自己。", "gain": "你这家“公司”有收入（工资）、成本（开销）、资产（技能）、负债（贷款）。定期复盘“毛利率”和“竞争力”，比追涨杀跌更能决定财务上限。", "source": "个人商业模式/职业生涯管理框架。", "plain": "把你当一家公司：工资是营收，技能是资产，贷款是负债。定期看“我这家公司竞争力在升还是降”——这比盯大盘更能决定你能赚多少。", "notes": []}, {"chapter": 18, "num": 6, "id": "18-6", "title": "过度跳槽与从不跳槽，都亏", "grade": "C", "impact": "自己", "cost_money": "无", "cost_time": "低", "cost_will": "无", "three_zero": false, "spend": "对“跳槽涨薪”或“忠诚留任”的极端化。", "gain": "频繁跳槽显出不稳定性、打断积累；长期不挪又易被内部定价压低、错过市场价位。研究普遍认为存在“适度区间”，且行业差异大〔争议〕。", "source": "履历连续性/跳槽与收入关系研究〔争议：最优频次因行业与层级而异〕。", "plain": "一年一跳显得漂，十年不跳容易被压价。中间有个甜区——该跳时跳，该沉淀时沉淀。别走极端。", "notes": []}, {"chapter": 18, "num": 7, "id": "18-7", "title": "行业 Beta，比你在哪家强更重要", "grade": "B", "impact": "自己", "cost_money": "无", "cost_time": "低", "cost_will": "无", "three_zero": false, "spend": "只盯公司、忽略赛道的选择。", "gain": "收入增长中，行业整体景气度（Beta）往往解释比公司个体（Alpha）更大份额。选对上升赛道，个人努力的回报被放大；选错下行赛道，努力被抵消。", "source": "行业薪资差异与赛道效应研究。", "plain": "在风口行业，普通人也能涨薪；在衰退行业，高手也难。选对赛道，你的努力才不被埋没。", "notes": []}, {"chapter": 18, "num": 8, "id": "18-8", "title": "技能过时风险，要用持续学习对冲", "grade": "C", "impact": "自己", "cost_money": "低", "cost_time": "中", "cost_will": "中", "three_zero": false, "spend": "持续更新的时间投入。", "gain": "技术替代与岗位重构在加速，单一技能的半衰期缩短。保持“可迁移能力+新工具”的更新，是人力资本不贬值的唯一办法。", "source": "技术替代与技能半衰期研究；劳动经济。", "plain": "你现在的本事，十年后可能不值钱。定期学点新东西、尤其是可迁移的能力，才是不让“自己这家公司”贬值的法子。", "notes": []}, {"chapter": 18, "num": 9, "id": "18-9", "title": "健康是人力资本的地基，病倒=资产减值", "grade": "C", "impact": "自己/家庭", "cost_money": "低", "cost_time": "中", "cost_will": "中", "three_zero": false, "spend": "作息、运动、体检的日常投入。", "gain": "重大疾病会直接打断收入现金流、吞噬储蓄，是家庭财务最贵的“折旧”。保持可工作年限，是比任何理财都确定的高回报投资。", "source": "健康与收入/就业研究；健康经济学。", "plain": "一场大病，不只是医药费，更是收入断流。把身体当资产保养，能多干几年赚的钱，远超任何基金收益。", "notes": []}, {"chapter": 18, "num": 10, "id": "18-10", "title": "别用“投资自己”为名，买无用课", "grade": "C", "impact": "自己", "cost_money": "低", "cost_time": "低", "cost_will": "低", "three_zero": false, "spend": "对“知识付费焦虑”的清醒。", "gain": "大量“理财课/认知课”是消费而非投资，既不教你可验证技能，也不改善收入。判断标准：学完能否带来可量化的收入或能力增量。", "source": "消费者教育与知识付费乱象研究；金融监管风险提示。", "plain": "“投资自己”被很多课拿来当收款码。真能提升收入的才算投资，否则就是消费。下单前问：这课能让收入多几个点？说不清就是坑。", "notes": []}, {"chapter": 18, "num": 11, "id": "18-11", "title": "副业的前提，是不影响主业复利", "grade": "C", "impact": "自己", "cost_money": "低", "cost_time": "中", "cost_will": "中", "three_zero": false, "spend": "副业占用主业精力的权衡。", "gain": "副业若拖垮主业表现、耽误升职，机会成本极高。用“是否损害基本盘”作为副业的上限开关，而非盲目铺开。", "source": "时间分配与机会成本框架。", "plain": "副业赚了点外快，却耽误了主业升职，那是亏的。副业不能伤基本盘，这是红线。", "notes": []}, {"chapter": 18, "num": 12, "id": "18-12", "title": "社保公积金是隐性薪酬，离职要算清", "grade": "C", "impact": "自己/家庭", "cost_money": "无", "cost_time": "低", "cost_will": "低", "three_zero": false, "spend": "把福利算进总包的视角。", "gain": "五险一金、补充医疗、年金是薪酬的重要组成部分（单位缴纳部分常等于工资的 30%+）。比较 offer 或评估离职成本时，只看到手工资会严重低估。", "source": "薪酬结构与员工福利研究；社保缴费规则。", "plain": "谈工资别只看“到手多少”，单位给你缴的社保公积金常是工资的 30% 以上。离职或比 offer，漏算这截会吃大亏。", "notes": []}, {"chapter": 19, "num": 1, "id": "19-1", "title": "省下的，就是税后收益", "grade": "C", "impact": "自己/家庭", "cost_money": "无", "cost_time": "低", "cost_will": "低", "three_zero": false, "spend": "对“开源才是硬道理”的偏重。", "gain": "省下 100 元，等于赚了 100 元税后收入；而靠投资赚 100 元，得先有本金且承担波动。对本金有限的人，节流是确定且零风险的“收益率”。", "source": "消费与储蓄的家庭财务研究；边际储蓄率。", "plain": "省 100 块，比投资赚 100 块更确定——不用本金、不担风险、还免税。本金少时，省比赚更划算。", "notes": []}, {"chapter": 19, "num": 2, "id": "19-2", "title": "生活方式通胀，悄悄吃掉本金", "grade": "C", "impact": "自己/家庭", "cost_money": "无", "cost_time": "低", "cost_will": "中", "three_zero": false, "spend": "收入涨一级、开销跟一级的惯性。", "gain": "收入提高后，消费同步升级（更大的房、更贵的车、更频繁的消费），储蓄率原地踏步，财务自由永远差一步。把新增收入的一部分“锁”进投资，而非全升级生活。", "source": "收入与消费同步性研究（收入效应）；储蓄率研究。", "plain": "工资涨了，开销也跟着涨，最后还是存不下钱。想财务自由，收入涨的那块得分一部分进投资，别全拿去升级生活。", "notes": []}, {"chapter": 19, "num": 3, "id": "19-3", "title": "大额支出前，强制冷静期", "grade": "C", "impact": "自己/家庭", "cost_money": "无", "cost_time": "低", "cost_will": "中", "three_zero": false, "spend": "等待 24–72 小时的克制。", "gain": "冲动消费在情绪高点决策，冷静后后悔率极高。设“超过 X 元必须等一天”的规则，能拦下大量非理性支出，且零成本。", "source": "冲动消费与决策降温研究；行为经济学。", "plain": "想买贵东西？先等一天。第二天还想要再买，大概率是真需要；等完不想买了，就是省下的钱。", "notes": []}, {"chapter": 19, "num": 4, "id": "19-4", "title": "记账不为省钱，为看见漏洞", "grade": "C", "impact": "自己/家庭", "cost_money": "低", "cost_time": "中", "cost_will": "中", "three_zero": false, "spend": "每月记账的十几分钟。", "gain": "记账的价值不是“省”，是暴露“钱去哪了”的结构——订阅、外卖、打车、小额高频，这些漏水点不记账永远看不见。看见才能堵。", "source": "家庭预算与消费追踪研究。", "plain": "记账不是为了抠门，是看清钱从哪漏的。那些几十块的外卖打车订阅，加起来可能是你最大的窟窿。", "notes": []}, {"chapter": 19, "num": 5, "id": "19-5", "title": "订阅制是慢性漏水", "grade": "C", "impact": "自己/家庭", "cost_money": "低", "cost_time": "低", "cost_will": "低", "three_zero": false, "spend": "定期清理订阅的几分钟。", "gain": "视频、会员、工具、自动续费，单价低但累积可观，且“默认续费”让人忘记取消。季度清理一次，常能省下月度现金流的几个百分点。", "source": "订阅经济与隐性支出研究。", "plain": "每个月那几十块的会员，忘了取消就一直扣。每季度清一遍自动续费，省下的常被低估。", "notes": []}, {"chapter": 19, "num": 6, "id": "19-6", "title": "买体验比买东西更值", "grade": "C", "impact": "自己/家庭", "cost_money": "低", "cost_time": "低", "cost_will": "低", "three_zero": false, "spend": "把钱从囤物挪到经历。", "gain": "研究显示，体验型消费（旅行、课程、聚会）带来的长期幸福感与记忆，通常高于同等金额的实物消费（后者很快适应、边际效用递减）。", "source": "幸福经济学研究（如 Gilovich, “Experiential purchases”）。", "plain": "同样花钱，去一趟旅行留下的快乐，常比买个包更久。东西买完就习惯了，经历会陪你更长时间。", "notes": []}, {"chapter": 19, "num": 7, "id": "19-7", "title": "量力而行的“贵”，比将就的“便宜”更省", "grade": "C", "impact": "自己/家庭", "cost_money": "低", "cost_time": "低", "cost_will": "低", "three_zero": false, "spend": "为耐用品买对版本一次到位的判断。", "gain": "关键耐用品（鞋、家电、工具）买便宜的次品，往往很快坏、反复换，总成本高；买对一次用多年的，长期更省。区分“该省”和“该花”。", "source": "耐用消费品总拥有成本（TCO）研究。", "plain": "有些东西买便宜的反复换，反而更贵；买对一次用多年才省。关键用品别将就，非关键的才该抠。", "notes": []}, {"chapter": 19, "num": 8, "id": "19-8", "title": "炫耀性消费，是负收益投资", "grade": "C", "impact": "自己/家庭", "cost_money": "低", "cost_time": "低", "cost_will": "中", "three_zero": false, "spend": "为“面子”买单的冲动。", "gain": "为展示地位而买的东西（名包、豪车、超出需要的排场），既不产生现金流，还加速消耗本金，且在熟人圈外的“信号”价值极低。", "source": "凡勃伦《有闲阶级论》与地位消费研究。", "plain": "买来显摆的东西，不赚钱还烧钱，真正懂的人也不看你这个。为面子花的钱，是财务上的负收益。", "notes": []}, {"chapter": 19, "num": 9, "id": "19-9", "title": "大件决策，用“每小时工资”换算", "grade": "C", "impact": "自己", "cost_money": "无", "cost_time": "低", "cost_will": "低", "three_zero": false, "spend": "把价格换成工时的习惯。", "gain": "把一个 3000 元的消费除以时薪（如 100 元/时）= 30 小时生命。用“我愿不愿意为它干 30 小时”衡量，能过滤大量伪需求。", "source": "时间价值与消费决策框架。", "plain": "东西不贵 3000，但你时薪 100，等于要干 30 小时。问自己：为它干 30 小时值不值？很多伪需求瞬间现形。", "notes": []}, {"chapter": 19, "num": 10, "id": "19-10", "title": "延保、会员保险，大多负期望", "grade": "C", "impact": "自己", "cost_money": "低", "cost_time": "低", "cost_will": "低", "three_zero": false, "spend": "对“加钱买安心”的警惕。", "gain": "商家敢卖延保，是因为精算上它稳赚——多数商品的故障率与维修成本，算进延保价后是负期望（买家净亏）。真正该保的是低概率高损失的（医疗、定寿）。", "source": "延保与保修的精算期望研究；消费者保护研究。", "plain": "商家敢卖延保，是因为算过你大概率用不上、钱白给。小家电加延保基本是送钱；真该买保险的是病、死这种扛不住的。", "notes": []}, {"chapter": 19, "num": 11, "id": "19-11", "title": "债务消费，是给未来的自己加税", "grade": "C", "impact": "自己/家庭", "cost_money": "低", "cost_time": "低", "cost_will": "中", "three_zero": false, "spend": "为当下快感透支未来的克制。", "gain": "信用卡/消费贷买非必要品，等于用高息（常 10%+）把未来的收入提前花掉，且复利滚利息。它直接侵蚀本可用于投资的本金。", "source": "消费信贷与家庭财务研究；复利。", "plain": "刷信用卡买不急需的东西，等于借 10% 以上的高利，花掉未来的钱。这比不投资还糟——你是在倒贴利息。", "notes": []}, {"chapter": 19, "num": 12, "id": "19-12", "title": "区分“需要 / 想要 / 跟风”三栏", "grade": "C", "impact": "自己/家庭", "cost_money": "无", "cost_time": "低", "cost_will": "中", "three_zero": false, "spend": "下单前的三秒归类。", "gain": "把每笔支出归到三栏：生存必须的“需要”、提升质量的“想要”、纯粹被氛围带的“跟风”。跟风栏越多，财富漏得越快；定期复盘这栏比例。", "source": "消费心理学与需求分层框架。", "plain": "买之前停三秒：是必须、是想要、还是被人带节奏？跟风那栏占比越高，钱漏得越快。定期看这栏。", "notes": []}, {"chapter": 20, "num": 1, "id": "20-1", "title": "应急金是投资的前提，不是可选项", "grade": "B", "impact": "家庭", "cost_money": "低", "cost_time": "低", "cost_will": "低", "three_zero": false, "spend": "预留 3–6 个月支出的现金/货基。", "gain": "没有应急金，任何一次失业、疾病、意外都会逼你在低点卖资产或借高息债，把“暂时的账面亏损”变成“永久的本金损失”。它是所有投资的安全垫。", "source": "家庭财务韧性与应急储蓄研究；流动性缓冲文献。", "plain": "没留应急金，一失业就得低点割肉或借高利贷，把浮亏变真亏。先留 3–6 个月生活费，再谈投资。这是地基。", "notes": []}, {"chapter": 20, "num": 2, "id": "20-2", "title": "市场暴跌时，现金是唯一 Option", "grade": "C", "impact": "自己", "cost_money": "无", "cost_time": "低", "cost_will": "低", "three_zero": false, "spend": "保持一部分随时能动用的现金。", "gain": "别人都没钱时，手里有现金的人能捡便宜、也能扛过难关。现金在平静时看似“浪费收益”，在危机时价值连城。", "source": "流动性与危机定价研究；现金作为战略储备。", "plain": "平时觉得持现金亏利息，崩盘时才知它是王。别人都没钱，你有现金就能捡便宜、也能活下去。", "notes": []}, {"chapter": 20, "num": 3, "id": "20-3", "title": "崩盘时，别卖也别 All-in 抄底", "grade": "C", "impact": "自己", "cost_money": "无", "cost_time": "低", "cost_will": "中", "three_zero": false, "spend": "暴跌中的情绪定力。", "gain": "恐慌抛售把“暂时亏损”变“永久亏损”；一次性 All-in 抄底则赌错了就满仓接刀。最稳的是按计划分批、不慌不卖，让时间修复。", "source": "行为金融（处置效应/恐慌抛售）研究。", "plain": "暴跌最忌两件事：吓得割肉（亏变真），和一把梭抄底（接飞刀）。按原计划分批、拿住，比赌方向靠谱。", "notes": []}, {"chapter": 20, "num": 4, "id": "20-4", "title": "失业先砍支出到骨头，再谈投资", "grade": "C", "impact": "家庭", "cost_money": "无", "cost_time": "低", "cost_will": "中", "three_zero": false, "spend": "断粮期的极致节流。", "gain": "收入中断时，第一优先级是把支出压到生存线，保住应急金与投资本金不被挪用；投资增值是“有余力”时才做的事，顺序不能反。", "source": "家庭财务复原力研究；收入冲击应对。", "plain": "失业了先砍开销、保住本金，别想着靠投资翻本。本金是你能翻身的本钱，乱动就真没了。", "notes": []}, {"chapter": 20, "num": 5, "id": "20-5", "title": "多元收入来源，降低单一雇主风险", "grade": "C", "impact": "自己/家庭", "cost_money": "低", "cost_time": "中", "cost_will": "中", "three_zero": false, "spend": "开拓第二收入渠道的精力。", "gain": "只靠一份工资，等于把全部人力资本押在一个雇主上；被裁或行业收缩时毫无缓冲。哪怕很弱的第二来源，也能在极端时托底。", "source": "收入风险与多元化研究（劳动收入风险）。", "plain": "全家的钱靠一份工资，等于把命押在一个老板身上。哪怕有个很弱的第二来源，关键时刻也能托底。", "notes": []}, {"chapter": 20, "num": 6, "id": "20-6", "title": "受益人、遗嘱、授权，提前定", "grade": "C", "impact": "家庭/后代", "cost_money": "低", "cost_time": "低", "cost_will": "低", "three_zero": false, "spend": "把身后与失能安排写清楚的半小时。", "gain": "保单受益人写谁、账户继承、医疗授权、遗嘱——这些不提前定，出事时家人要在混乱中面对法律摩擦与拖延，甚至争产。一次厘清，省下后代无数麻烦。", "source": "遗产规划与授权（POA）研究；继承纠纷数据。", "plain": "受益人写谁、遗嘱怎么分、万一昏迷谁替你决定——现在花半小时定好，真出事家人少踩无数坑。别等出事才想。", "notes": []}, {"chapter": 20, "num": 7, "id": "20-7", "title": "杠杆在极端行情会清零你", "grade": "B", "impact": "自己/家庭", "cost_money": "低", "cost_time": "低", "cost_will": "中", "three_zero": false, "spend": "对“加杠杆博收益”的警惕。", "gain": "2008、2020 等极端行情中，高杠杆账户因保证金追缴被强制平仓，本金归零甚至倒欠。杠杆放大收益也放大归零概率，普通人远离。", "source": "杠杆与强制平仓案例（2008 危机、2020 流动性冲击）；保证金机制。", "plain": "平时杠杆让你赚得快，极端时一个反向波动就强制平仓、本金归零还倒欠。普通人家别碰杠杆，那是专业玩家的高压线。", "notes": []}, {"chapter": 20, "num": 8, "id": "20-8", "title": "流动性危机里，谁有现金谁定价", "grade": "C", "impact": "自己", "cost_money": "无", "cost_time": "低", "cost_will": "无", "three_zero": false, "spend": "理解危机时现金的话语权。", "gain": "危机中资产抛售、价格失灵，只有手握现金的人能从容接货或周转；被动抛售者被迫接受最差价格。现金在危机中从“低收益”变为“高权力”。", "source": "2008 流动性危机与资产定价研究。", "plain": "危机时大家都缺钱、都在甩卖，有现金的人说了算，能捡最便宜的。没现金的只能贱卖。这就是现金在危机里的真价值。", "notes": []}, {"chapter": 20, "num": 9, "id": "20-9", "title": "恐慌时远离屏幕，回归计划", "grade": "C", "impact": "自己", "cost_money": "无", "cost_time": "低", "cost_will": "中", "three_zero": false, "spend": "暴跌期少看盘的定力。", "gain": "频繁盯盘在恐慌时会放大情绪、诱发误操作；你的长期计划不会因为一天涨跌而变。关掉行情软件，回到既定配置与再平衡纪律。", "source": "盯盘频率与决策质量/过度交易研究。", "plain": "越跌越想看，越看越想动，一动就亏。关掉软件，回到你早就定好的计划——它不会因为今天跌了就失效。", "notes": []}, {"chapter": 20, "num": 10, "id": "20-10", "title": "把“最坏情况我能活”写进计划", "grade": "C", "impact": "家庭", "cost_money": "无", "cost_time": "低", "cost_will": "低", "three_zero": false, "spend": "事前做最坏情景推演。", "gain": "预案里写明：若收入断 6 个月、若本金回撤 30%、若重病，分别怎么应对（砍哪笔支出、动哪笔储备）。想清楚“活下去”的路径，恐慌时就不用临场决策。", "source": "风险管理与情景规划框架。", "plain": "提前写清楚：失业半年、本金跌三成、重病，分别怎么扛。把“活下去”的路想明白，真出事就不慌、不瞎操作。", "notes": []}, {"chapter": 20, "num": 11, "id": "20-11", "title": "灾后复原靠现金+不欠债，不靠抄底", "grade": "C", "impact": "家庭", "cost_money": "无", "cost_time": "低", "cost_will": "无", "three_zero": false, "spend": "对“危机是机会”叙事的冷静。", "gain": "对普通人，危机后的复原力来自“有现金、没杠杆、没断收入”，而非精准抄底。保住不负债的资产负债表，比赌反弹更可靠。", "source": "家庭资产负债表韧性与复苏研究。", "plain": "危机后谁能站起来，靠的是有现金、没欠债，不是抄到底。先把资产负债表保住不爆雷，比赌反弹实在。", "notes": []}, {"chapter": 20, "num": 12, "id": "20-12", "title": "重大利空，区分“暂时”与“永久”", "grade": "B", "impact": "自己", "cost_money": "低", "cost_time": "低", "cost_will": "中", "three_zero": false, "spend": "对坏消息做性质判断的功课。", "gain": "价格下跌分两种：市场情绪造成的“暂时”波动（会回），和基本面永久恶化的“永久”损失（不回）。前者该拿甚至加，后者该砍。混为一谈最致命。", "source": "价值投资框架（永久 vs 暂时损失；Buffett/Munger 表述）；行为金融。", "plain": "跌了先判断：是市场吓跌（会回来）还是公司真坏了（回不来）。吓跌的该拿，真坏的该砍。把两者搞混，最亏。", "notes": []}, {"chapter": 21, "num": 1, "id": "21-1", "title": "选指数基金三看：费率、规模、跟踪误差", "grade": "A", "impact": "自己", "cost_money": "低", "cost_time": "低", "cost_will": "低", "three_zero": false, "spend": "对比三只同类基金的费率与误差。", "gain": "同样的 Beta，费用低 0.5%/年、30 年就是终值差约 14%。宽基 ETF 管理费已卷到 0.03%–0.5%/年。", "source": "晨星基金费率研究；Carhart (1997)；SPIVA。", "plain": "指数基金同质化严重，拼的就是费率与跟踪误差。选规模大、费率低、误差小的，别的都是虚的。", "notes": []}, {"chapter": 21, "num": 2, "id": "21-2", "title": "基金规模的两个极端都要躲", "grade": "B", "impact": "自己", "cost_money": "低", "cost_time": "低", "cost_will": "低", "three_zero": false, "spend": "避开迷你基（清盘风险）与超大基（难超额）。", "gain": "迷你基有清盘线（净资产＜5000 万或持有人＜200 人连续 60 日）；超大规模主动基难再跑赢。", "source": "《公募基金运作管理办法》第 41 条；规模与业绩负相关研究。", "plain": "小于 2 亿警惕、小于 5000 万躲开；指数基可放宽，主动基过大也别追。", "notes": []}, {"chapter": 21, "num": 3, "id": "21-3", "title": "A 类 vs C 类：持有期决定谁更省", "grade": "A", "impact": "自己", "cost_money": "低", "cost_time": "低", "cost_will": "低", "three_zero": false, "spend": "按预计持有期算一笔账。", "gain": "持有＜1–2 年常 C 类划算（免申购费、收销售服务费）；持有＞2 年常 A 类划算（免销售服务费）。临界点因基金而异。", "source": "基金费用结构披露；费率临界点测算。", "plain": "别听“A 类永远好”。打算拿三年以上选 A，短炒选 C，先把临界点算出来。", "notes": []}, {"chapter": 21, "num": 4, "id": "21-4", "title": "ETF 溢价买入＝先亏一道", "grade": "B", "impact": "自己", "cost_money": "低", "cost_time": "低", "cost_will": "低", "three_zero": false, "spend": "交易前看盘口折溢价（IOPV）。", "gain": "避开“市价高于净值”时追高。主流宽基 ETF 折溢价多在 ±0.1%–0.5%，极端时可到数个百分点。", "source": "ETF 申购赎回与套利机制；交易所披露。", "plain": "ETF 有两个价：净值（IOPV）和市价。市价比净值高就是溢价，这时候买等于先送钱。", "notes": []}, {"chapter": 21, "num": 5, "id": "21-5", "title": "QDII 额度紧时溢价可高达 5%–20%", "grade": "B", "impact": "自己", "cost_money": "低", "cost_time": "低", "cost_will": "低", "three_zero": false, "spend": "避开额度暂停、高溢价时的 QDII。", "gain": "2020–2021 额度紧时，部分 QDII 溢价 5%–20%，追高者等于白送。", "source": "QDII 额度管理与溢价案例；外管局额度公告。", "plain": "想买海外基金却碰上“暂停申购＋高溢价”，宁可等额度放开，别在溢价顶端接盘。", "notes": []}, {"chapter": 21, "num": 6, "id": "21-6", "title": "基金经理变更是隐性风险", "grade": "B", "impact": "自己", "cost_money": "低", "cost_time": "低", "cost_will": "低", "three_zero": false, "spend": "关注持仓基金的经理变动公告。", "gain": "主动基的“阿尔法”常绑定具体人，换帅后历史业绩失效概率高。", "source": "基金经理变更与业绩持续性研究。", "plain": "你买的是“某个人能赚钱”，不是“某只代码能赚钱”。基金经理一换，过往业绩参考性骤降。", "notes": []}, {"chapter": 21, "num": 7, "id": "21-7", "title": "基金风格漂移：看持仓别看名字", "grade": "B", "impact": "自己", "cost_money": "低", "cost_time": "低", "cost_will": "低", "three_zero": false, "spend": "定期看前十大持仓。", "gain": "名曰“蓝筹”实则炒小票，会破坏你的资产配置。名字是营销，持仓才是真相。", "source": "基金风格漂移实证（名字 vs 实际持仓偏差）。", "plain": "别信基金名字。每季度点开持仓，发现“蓝筹基满手新能源”就该警惕——它已偏离你的配置本意。", "notes": []}, {"chapter": 21, "num": 8, "id": "21-8", "title": "打新／套利基金收益不可持续", "grade": "C", "impact": "自己", "cost_money": "低", "cost_time": "低", "cost_will": "低", "three_zero": false, "spend": "不为“过去一年的打新收益”买单。", "gain": "打新收益随新股节奏与制度变化，高收益期过后归零甚至回吐。", "source": "打新收益衰减研究；注册制后破发率上升（2022 约 28%、2024 约 3%）。", "plain": "某基去年因打新多赚 3%，今年可能倒贴。把一次性红利当永久能力，是常见误判。", "notes": []}, {"chapter": 21, "num": 9, "id": "21-9", "title": "FOF：双层收费，慎选", "grade": "B", "impact": "自己／后代", "cost_money": "低", "cost_time": "低", "cost_will": "低", "three_zero": false, "spend": "看清 FOF 的“母基金费率＋子基金费率”叠加。", "gain": "FOF 收一层管理费，底层基金再收一层，综合费率常偏高，需其选基/配置能力值回票价。", "source": "FOF 费率结构与收益研究。", "plain": "FOF 帮你选基，但收两次费。如果你自己能买两三只低费率指数，FOF 多半是纯加价。", "notes": []}, {"chapter": 21, "num": 10, "id": "21-10", "title": "债券基金也分三六九等", "grade": "B", "impact": "自己", "cost_money": "低", "cost_time": "低", "cost_will": "低", "three_zero": false, "spend": "分清纯债／一级债／二级债／可转债基。", "gain": "纯债波动小、二级债含股性、可转债基弹性大且风险高，风险收益天差地别。", "source": "债券基金分类与风险收益特征；监管分类规则。", "plain": "“稳健”两个字覆盖不了债基的全部。纯债近乎稳，可转债基可能一年波动 20%，买前看清含多少权益。", "notes": []}, {"chapter": 21, "num": 11, "id": "21-11", "title": "定期报告披露的“实际持仓”比宣传靠谱", "grade": "C", "impact": "自己", "cost_money": "低", "cost_time": "低", "cost_will": "低", "three_zero": false, "spend": "每年看季报/年报的持仓与运作分析。", "gain": "识别“言行不一”的基金，及时纠偏你的配置。", "source": "基金信息披露规则；定期报告强制披露。", "plain": "宣传页会说漂亮话，季报只说真话。花十分钟翻季报，比看十篇软文有用。", "notes": []}, {"chapter": 22, "num": 1, "id": "22-1", "title": "国债几乎零违约，利率是机会成本锚", "grade": "A", "impact": "自己", "cost_money": "无", "cost_time": "低", "cost_will": "低", "three_zero": false, "spend": "零（国家信用）。", "gain": "极安全的现金/短期配置；其收益率是你衡量一切“无风险回报”的基准。", "source": "主权信用研究；国债发行与定价机制。", "plain": "国债利息还免个税。它的意义不是赚多少，是给你一个“不冒风险能拿多少”的标尺。", "notes": []}, {"chapter": 22, "num": 2, "id": "22-2", "title": "存款保险 50 万上限：单家银行本息 50 万内全额保", "grade": "A", "impact": "自己／家庭", "cost_money": "无", "cost_time": "低", "cost_will": "低", "three_zero": false, "spend": "大额存款分散到不同银行。", "gain": "同一存款人在同一家银行本息合计 50 万元以内全额保障，超出部分看银行清算。", "source": "《存款保险条例》（国务院令第 660 号）第 5 条。", "plain": "钱多别全放一家银行。超过 50 万的部分，理论上要看那家银行会不会倒。分散到几家，睡得着。", "notes": []}, {"chapter": 22, "num": 3, "id": "22-3", "title": "货币基金不是存款，不保本但风险极低", "grade": "B", "impact": "自己", "cost_money": "无", "cost_time": "无", "cost_will": "无", "three_zero": true, "spend": "理解它不保本、有 T+0 赎回限额。", "gain": "相比活期存款收益更高、风险极低，适合放应急金；但极端流动性事件中也可能亏损（罕见）。", "source": "货币基金运作与风险揭示；监管 T+0 限额规定（单日快赎≤1 万）。", "plain": "货基不是活期、不保本金，但历史上极少亏损。应急金放这里合适，别指望它跑赢通胀。", "notes": []}, {"chapter": 22, "num": 4, "id": "22-4", "title": "债券基金有波动，不是“稳赚”", "grade": "B", "impact": "自己", "cost_money": "低", "cost_time": "低", "cost_will": "低", "three_zero": false, "spend": "承受利率上行时的账面回撤。", "gain": "票息提供缓冲，但久期越长、利率上行时跌越多；纯债年波动也可达 2%–5%。", "source": "利率与债券价格反向关系；债券基金回撤实证。", "plain": "债基不是存款的平替。利率一涨，债基净值就跌。它的“稳”是相对的，不是绝对的。", "notes": []}, {"chapter": 22, "num": 5, "id": "22-5", "title": "可转债：下有债底、上不封顶，但不是保本", "grade": "B", "impact": "自己", "cost_money": "低", "cost_time": "低", "cost_will": "低", "three_zero": false, "spend": "理解“债底＋转股期权”的双面性。", "gain": "熊市有债底托底、牛市可转股跟涨；但高溢价转债遇正股大跌仍可能腰斩。", "source": "可转债定价与风险研究；监管适当性提示。", "plain": "可转债听着“进可攻退可守”，但高位接溢价转债一样亏。它比股票稳一点，比纯债野很多。", "notes": []}, {"chapter": 22, "num": 6, "id": "22-6", "title": "高收益债＝高风险，信用利差不是白给的", "grade": "B", "impact": "自己", "cost_money": "低", "cost_time": "低", "cost_will": "低", "three_zero": false, "spend": "警惕“收益率明显偏高”的债/债基。", "gain": "信用利差补偿的是违约风险；低评级债一旦违约，回收率常不足面值一半。", "source": "信用利差与违约率研究；Moody's 回收率统计。", "plain": "为什么它利息比国债高那么多？因为市场怕它不还。高那截利息，是给你承担“可能血本无归”的补偿。", "notes": []}, {"chapter": 22, "num": 7, "id": "22-7", "title": "久期：衡量利率敏感度的一把尺", "grade": "B", "impact": "自己", "cost_money": "低", "cost_time": "低", "cost_will": "低", "three_zero": false, "spend": "看债券/债基的久期指标。", "gain": "久期越长，利率每变动 1% 价格反向变动约“久期”个百分点；用它预估债基对加息的敏感度。", "source": "债券久期定义（Macaulay/Modified Duration）。", "plain": "久期就是“利率涨 1%，我这债跌几个点”。买长债基前看久期，心里才有底。", "notes": []}, {"chapter": 22, "num": 8, "id": "22-8", "title": "永续债／优先股：条款复杂，默认谨慎", "grade": "C", "impact": "自己", "cost_money": "低", "cost_time": "低", "cost_will": "低", "three_zero": false, "spend": "不熟条款不碰。", "gain": "无固定到期、可递延付息，收益率高对应的是条款不确定性。", "source": "永续债条款设计与风险研究。", "plain": "它叫“债”但不一定还你本金、利息还能递延。条款比普通债复杂一圈，看不懂就别买。", "notes": []}, {"chapter": 22, "num": 9, "id": "22-9", "title": "债券回购加杠杆是机构玩法，散户慎碰", "grade": "C", "impact": "自己／家庭", "cost_money": "低", "cost_time": "低", "cost_will": "低", "three_zero": false, "spend": "放弃“回购放大收益”。", "gain": "杠杆在利率反转时会放大亏损，且需持续滚动融资，流动性脆弱。", "source": "回购杠杆与流动性风险研究。", "plain": "机构用回购借钱买债放大收益，散户跟风容易在资金面紧张时被打爆。普通配置用不上。", "notes": []}, {"chapter": 22, "num": 10, "id": "22-10", "title": "地方债与国债的税后差异", "grade": "C", "impact": "自己", "cost_money": "低", "cost_time": "无", "cost_will": "无", "three_zero": false, "spend": "比较同期限地方债与国债的税后收益。", "gain": "地方债利息也免个税，但流动性与信用略弱于国债，溢价部分需权衡。", "source": "地方债免税政策；利率与流动性溢价。", "plain": "地方债利息同样免税，比同期限国债收益略高一点，代价是流动性稍差、信用略弱。大额稳健资金可适度配。", "notes": []}, {"chapter": 23, "num": 1, "id": "23-1", "title": "美股长牛，但也会腰斩", "grade": "A", "impact": "自己", "cost_money": "低", "cost_time": "低", "cost_will": "低", "three_zero": false, "spend": "接受“长期向上、中途腰斩”的现实。", "gain": "标普 500 长期年化约 10%，但 2000–2002 跌约 49%、2008 跌约 50%、2020 新冠跌约 34%——扛得住回撤才拿得到收益。", "source": "S&P 500 历史回报与回撤数据（多源年鉴）。", "plain": "美股不是只涨不跌。它的好是“跌完还能创新高”，前提是你没在腰斩时割肉。", "notes": []}, {"chapter": 23, "num": 2, "id": "23-2", "title": "跨市场配置降低单一经济体风险", "grade": "B", "impact": "自己", "cost_money": "低", "cost_time": "低", "cost_will": "低", "three_zero": false, "spend": "拿一小部分配海外/全球指数。", "gain": "不同市场周期不同步，组合波动低于单一市场；长期回报不低。", "source": "全球分散化实证（多市场相关性低于 1）。", "plain": "A 股跌的时候美股可能涨，反过来也一样。各放一点，谁崩都不至于全场归零。", "notes": []}, {"chapter": 23, "num": 3, "id": "23-3", "title": "汇率是双刃剑，别当纯增强", "grade": "B", "impact": "自己", "cost_money": "低", "cost_time": "低", "cost_will": "低", "three_zero": false, "spend": "接受汇率双向波动。", "gain": "海外资产既对冲本币风险，也可能因本币升值吃掉收益；长期持有应忽略短期汇率噪声。", "source": "汇率与跨国投资收益研究；央行汇率风险研究。", "plain": "买美股基金不只是赚美股，也赌了人民币。汇率能帮你也能坑你，别把它当稳定加成。", "notes": []}, {"chapter": 23, "num": 4, "id": "23-4", "title": "黄金是保险，不是主食", "grade": "B", "impact": "自己", "cost_money": "低", "cost_time": "低", "cost_will": "低", "three_zero": false, "spend": "小比例（5%–10%）长期持有。", "gain": "危机时与股债负相关、对冲恐慌；但长期实际回报跑输股票，过量持有拖累收益。", "source": "黄金避险属性实证（危机期负相关）；长期实际回报研究。", "plain": "黄金不是用来发财的，是用来“市场崩盘时还有东西涨”的保险。配一点，别当主力。", "notes": []}, {"chapter": 23, "num": 5, "id": "23-5", "title": "REITs：把地产变成可交易的现金流", "grade": "B", "impact": "自己", "cost_money": "低", "cost_time": "低", "cost_will": "低", "three_zero": false, "spend": "理解其高分红、利率敏感的特性。", "gain": "提供稳定分红与通胀对冲，但利率上行时价格下跌明显，波动大于债、小于股。", "source": "REITs 收益与利率敏感性研究。", "plain": "REITs 像“用股票账户买收租房产”，分红高。但它是利率的敌人——加息时价格常跌，别当债基用。", "notes": []}, {"chapter": 23, "num": 6, "id": "23-6", "title": "新兴市场高波动高潜在回报", "grade": "B", "impact": "自己", "cost_money": "低", "cost_time": "低", "cost_will": "低", "three_zero": false, "spend": "承受更高波动。", "gain": "增长潜力高于成熟市场，但政策、汇率、流动性风险也更高，适合小比例长期。", "source": "新兴市场股权风险溢价研究。", "plain": "新兴市场可能一年涨 50% 也可能跌 40%。配一点博弹性，别重仓赌国运。", "notes": []}, {"chapter": 23, "num": 7, "id": "23-7", "title": "港股估值常偏低，但有制度与流动性差异", "grade": "C", "impact": "自己", "cost_money": "低", "cost_time": "低", "cost_will": "低", "three_zero": false, "spend": "了解港股做空机制、流动性与 A 股差异。", "gain": "估值洼地提供机会，但流动性分化、波动大，且受海外资金流向影响。", "source": "港股估值与流动性研究。", "plain": "港股便宜有便宜的道理——流动性、做空、外资主导。别只因“便宜”就重仓，先懂它的玩法。", "notes": []}, {"chapter": 23, "num": 8, "id": "23-8", "title": "VIX／恐慌指数不能长期持有", "grade": "C", "impact": "自己", "cost_money": "低", "cost_time": "低", "cost_will": "低", "three_zero": false, "spend": "明白期货升水会持续损耗。", "gain": "VIX 相关产品设计上长期因展期损耗而贬值，只适合极短的对冲，不适合当资产。", "source": "VIX 期货升水与产品损耗研究（如“VXX 长期下跌”）。", "plain": "恐慌指数产品是“短期保险”，长期拿几乎必亏——展期损耗像漏水的水桶。别当长期配置。", "notes": []}, {"chapter": 23, "num": 9, "id": "23-9", "title": "跨境 ETF 有“时差＋溢价”双重坑", "grade": "B", "impact": "自己", "cost_money": "低", "cost_time": "低", "cost_will": "低", "three_zero": false, "spend": "避开境内外交易时段错位时的高溢价。", "gain": "因时差，跨境 ETF 在 A 股交易时净值已“冻结”，情绪化时溢价可拉大，追高易亏。", "source": "跨境 ETF 折溢价与套利机制；监管提示。", "plain": "美股休市时你还能在 A 股炒美股的 ETF，这时价格是“情绪价”。溢价高时买，等美股开盘就挨宰。", "notes": []}, {"chapter": 23, "num": 10, "id": "23-10", "title": "全球配置用一两只宽基就够，别贪多", "grade": "C", "impact": "自己", "cost_money": "低", "cost_time": "低", "cost_will": "低", "three_zero": false, "spend": "克制“每个市场都买一只”的冲动。", "gain": "一只全球/全市场 ETF 已含数千家公司，过度细分只增成本、不增收益。", "source": "全球宽基覆盖度研究（单只覆盖多数市值）。", "plain": "想全球配置，一只 MSCI 全球/ACWI 类 ETF 就覆盖绝大多数上市公司。加十只不如守一只。", "notes": []}, {"chapter": 24, "num": 1, "id": "24-1", "title": "期权买方：时间价值每天都在流失", "grade": "A", "impact": "自己／家庭", "cost_money": "低", "cost_time": "低", "cost_will": "低", "three_zero": false, "spend": "理解 Theta（时间衰减）。", "gain": "期权买方支付的时间价值随到期线性流失，多数期权到期归零或大幅贬值，长期买方多为净亏损。", "source": "Hull《Options, Futures and Other Derivatives》；期权定价与时间衰减。", "plain": "买期权像买快过期的门票，时间每过一天就贬一点。你赌对方向还得赌对时机，难度翻倍。", "notes": []}, {"chapter": 24, "num": 2, "id": "24-2", "title": "融资融券：利息＋强平，把波动变死亡", "grade": "A", "impact": "自己／家庭", "cost_money": "低", "cost_time": "低", "cost_will": "低", "three_zero": false, "spend": "放弃杠杆放大。", "gain": "无杠杆跌 50% 还在牌桌、回本需 +100%；加杠杆可能在跌 50% 前已被强平，永久出局。", "source": "SEC 保证金规则警示；Barber & Odean 高频+杠杆最致命。", "plain": "融资就是借钱炒股。涨时多赚、跌时先死。普通人的资金经不起一次强平。", "notes": []}, {"chapter": 24, "num": 3, "id": "24-3", "title": "股指期货：保证金与贴水双重考验", "grade": "B", "impact": "自己", "cost_money": "低", "cost_time": "低", "cost_will": "低", "three_zero": false, "spend": "理解保证金变动与贴水成本。", "gain": "杠杆高、贴水（远月低于近月）长期侵蚀收益，不适合单纯“长期持有”思维。", "source": "股指期货保证金与基差/贴水研究。", "plain": "期指不是“便宜的股票”。它的贴水像持续漏水，且保证金会随波动追加，逼你在低点补钱。", "notes": []}, {"chapter": 24, "num": 4, "id": "24-4", "title": "雪球：敲入后亏损无底，绝非“保本”", "grade": "A", "impact": "自己／家庭", "cost_money": "低", "cost_time": "低", "cost_will": "低", "three_zero": false, "spend": "看清“非保本、有敲入”的本质。", "gain": "2022–2024 中证 500/1000 雪球多次敲入，部分投资者本金亏损 30%–70%；收益封顶、风险敞口巨大。", "source": "监管对雪球类产品的适当性警示；敲入案例统计。", "plain": "雪球宣传“高票息”，但那是你卖出一个看跌期权的报酬。市场大跌敲入，你接的是真金白银的亏损。", "notes": []}, {"chapter": 24, "num": 5, "id": "24-5", "title": "结构化产品：收益封顶、风险敞口说不清", "grade": "B", "impact": "自己／家庭", "cost_money": "低", "cost_time": "低", "cost_will": "低", "three_zero": false, "spend": "拒绝嵌套条款看不懂的产品。", "gain": "收益上限被封死、下行风险可能全担，复杂结构利于卖方隐藏不利条款。", "source": "证监会复杂产品适当性；SEC 复杂产品警示。", "plain": "产品越花哨，越利于卖方藏对你不利那条。看不懂第七层嵌套的，默认不买。", "notes": []}, {"chapter": 24, "num": 6, "id": "24-6", "title": "分级基金已退场，是活教材", "grade": "C", "impact": "自己", "cost_money": "低", "cost_time": "低", "cost_will": "低", "three_zero": false, "spend": "记住这段历史。", "gain": "2015 牛市分级 B 加杠杆暴涨、股灾连跌停无法卖出、最终监管清退，无数人损失惨重。", "source": "分级基金运作与退场监管文件；2015 案例。", "plain": "曾经“加杠杆神器”的分级 B，在股灾里让散户几天亏光。它已被清退，但教训常换新装出现。", "notes": []}, {"chapter": 24, "num": 7, "id": "24-7", "title": "杠杆 ETF 不适合长期持有", "grade": "B", "impact": "自己", "cost_money": "低", "cost_time": "低", "cost_will": "低", "three_zero": false, "spend": "明白“每日再平衡”的损耗。", "gain": "杠杆 ETF 为每日盯住倍数，长期因波动损耗（volatility decay）跑输简单“持有标的×倍数”。", "source": "杠杆 ETF 路径依赖与损耗研究。", "plain": "2 倍杠杆 ETF 持有一年，不等于“标的涨 10% 你赚 20%”。震荡市里损耗会偷偷吃掉收益。", "notes": []}, {"chapter": 24, "num": 8, "id": "24-8", "title": "备兑／保护性策略仅对专业持股者有用", "grade": "C", "impact": "自己", "cost_money": "低", "cost_time": "低", "cost_will": "低", "three_zero": false, "spend": "承认自己不是那类人。", "gain": "备兑开仓、保护性认沽对长期持股、能持续管理的人或小有用处，但对普通散户净负且费精力。", "source": "期权策略适用人群研究。", "plain": "卖方爱讲“备兑增收”，但那要求你本来就有股票、还天天管。普通人图省心，别碰为妙。", "notes": []}], "lists": [{"chapter": 10, "title": "十、反面清单（直接不做）", "items": ["集中持有一两只股票／一个行业", "任何形式高杠杆（含场外配资）", "每月频繁买卖、把基金当股票炒", "付费加荐股群／老师带单", "追热点题材、炒概念、炒消息", "买“保证收益／保本高息”产品", "用短期要用的钱（房贷学费生活费）投资", "听“内部消息”“原始股”下单", "试图择时加减仓、猜顶抄底", "把加密投机当主仓重仓赌方向", "亏损死扛不审视、盈利秒卖", "不分散、不配置、不看费用", "每天盯盘、情绪化操作", "借钱／套信用卡／消费贷去投资", "把结构性存款当高息存款", "把年金保险当高收益理财买（不算 IRR）", "把“拉人头返利”当投资", "在来源不明 APP 里充值“投资”", "把账户交给无资质个人“代客理财保底”", "用“可解释测试”答不上来的东西也买"]}]};</script>
<script>
(function(){
  var D = window.BOOK_DATA || {chapters:[],entries:[],lists:[]};
  var byId={}; D.entries.forEach(function(e){byId[e.chapter+'-'+e.num]=e;});
  var ev='all', zero=false;
  var fM='all', fT='all', fW='all', sec='all';
  var q='';

  // 章节下拉
  var secSel=document.getElementById('sec');
  D.chapters.forEach(function(c){
    var o=document.createElement('option');
    o.value=c.num; o.textContent='第'+c.num+'章·'+c.title.replace(/^[^、]+、/,'');
    secSel.appendChild(o);
  });

  // 徽章
  var g={A:0,B:0,C:0}; var tz=0;
  D.entries.forEach(function(e){g[e.grade]=(g[e.grade]||0)+1; if(e.three_zero)tz++;});
  document.getElementById('badges').innerHTML =
    '<span>'+D.entries.length+' 条条目</span>'+
    '<span>'+D.chapters.length+' 章</span>'+
    '<span>A级 '+g.A+'</span><span>B级 '+g.B+'</span><span>C级 '+g.C+'</span>'+
    '<span>三零 '+tz+'</span>'+
    '<span>更新 '+D.updated+'</span>'+
    '<span>许可 CC BY 4.0</span>';

  function esc(s){return (s||'').replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;');}
  function linkify(s){
    return esc(s).replace(/第(\d+)章第(\d+)条/g,
      '<a class="ref" data-c="$1" data-n="$2">第$1章第$2条</a>');
  }
  function costTag(label,val){
    var cls = val==='无' ? 'cost no' : 'cost';
    return '<span class="'+cls+'">'+label+'·'+val+'</span>';
  }

  function pass(e){
    if(ev!=='all' && e.grade!==ev) return false;
    if(zero && !e.three_zero) return false;
    if(fM!=='all' && (fM==='无'? e.cost_money!=='无' : e.cost_money==='无')) return false;
    if(fT!=='all' && (fT==='无'? e.cost_time!=='无'  : e.cost_time==='无'))  return false;
    if(fW!=='all' && (fW==='无'? e.cost_will!=='无' : e.cost_will==='无')) return false;
    if(sec!=='all' && String(e.chapter)!==String(sec)) return false;
    if(q){
      var hay=(e.title+e.spend+e.gain+e.source+e.plain).toLowerCase();
      if(hay.indexOf(q)<0) return false;
    }
    return true;
  }

  function card(e){
    var tags='<span class="tag t'+e.grade+'">'+e.grade+'</span>'+
      '<span class="imp">影响：'+esc(e.impact)+'</span>'+
      costTag('花费',e.cost_money)+costTag('时间',e.cost_time)+costTag('毅力',e.cost_will);
    if(e.three_zero) tags+='<span class="cz">三零</span>';
    var notes = (e.notes||[]).map(function(n){
      return '<div class="note"><b>〔'+esc(n.type)+'〕</b> '+linkify(n.text)+'</div>';
    }).join('');
    return '<div class="card" id="e-'+e.chapter+'-'+e.num+'">'+
      '<div class="head"><span class="id">第 '+e.chapter+' 章第 '+e.num+' 条</span>'+
        '<h3>'+esc(e.title)+'</h3>'+tags+'</div>'+
      '<div class="row"><span class="k">花掉</span><span>'+linkify(e.spend)+'</span></div>'+
      '<div class="row"><span class="k">换回</span><span>'+linkify(e.gain)+'</span></div>'+
      '<div class="row"><span class="k">出处</span><span>'+esc(e.source)+'</span></div>'+
      '<div class="plain"><b>说人话：</b>'+linkify(e.plain)+'</div>'+
      notes+'<span class="copy" data-c="'+e.chapter+'" data-n="'+e.num+'">📋 复制引用</span></div>';
  }

  function render(){
    var out=document.getElementById('out');
    var html=''; var shown=0;
    D.chapters.forEach(function(c){
      if(sec!=='all' && String(c.num)!==String(sec)) return;
      if(c.type==='list'){
        var lst=D.lists.filter(function(l){return l.chapter===c.num;})[0];
        if(!lst) return;
        var items=lst.items.filter(function(it){
          if(q){return it.toLowerCase().indexOf(q)>=0;} return true;
        });
        if(!items.length) return;
        shown+=items.length;
        html+='<h2 class="ch-head">第 '+c.num+' 章 · '+esc(c.title.replace(/^[^、]+、/,''))+'</h2>'+
          '<p class="ch-sub">直接不做的动作（性价比为负），出现一个划掉一个。</p>'+
          '<ul class="neglist">'+items.map(function(it){return '<li>❌ '+esc(it)+'</li>';}).join('')+'</ul>';
        return;
      }
      var es=D.entries.filter(function(e){return e.chapter===c.num;});
      var vis=es.filter(pass);
      if(!vis.length) return;
      shown+=vis.length;
      html+='<h2 class="ch-head">第 '+c.num+' 章 · '+esc(c.title.replace(/^[^、]+、/,''))+'</h2>'+
        '<p class="ch-sub">本章 '+es.length+' 条，显示 '+vis.length+' 条。</p>'+
        vis.map(card).join('');
    });
    if(!shown) html='<div class="empty">没有匹配条目，试着放宽筛选条件。</div>';
    out.innerHTML=html;
    document.getElementById('stat').textContent=
      '显示 '+shown+' / '+D.entries.length+' 条 ｜ 当前筛选：'+
      (ev==='all'?'证据全部':('证据'+ev))+
      (zero?' ＋三零':'')+
      (fM!=='all'?' ＋花费'+fM:'')+(fT!=='all'?' ＋时间'+fT:'')+(fW!=='all'?' ＋毅力'+fW:'')+
      (sec!=='all'?' ＋第'+sec+'章':'');
  }

  // 事件
  document.getElementById('q').addEventListener('input',function(){q=this.value.trim().toLowerCase();render();});
  document.querySelectorAll('.btn.ev').forEach(function(b){
    b.addEventListener('click',function(){
      document.querySelectorAll('.btn.ev').forEach(function(x){x.classList.remove('on');});
      b.classList.add('on'); ev=b.dataset.ev; render();
    });
  });
  document.getElementById('zeroBtn').addEventListener('click',function(){
    zero=!zero; this.classList.toggle('on',zero); render();
  });
  document.getElementById('fM').addEventListener('change',function(){fM=this.value;render();});
  document.getElementById('fT').addEventListener('change',function(){fT=this.value;render();});
  document.getElementById('fW').addEventListener('change',function(){fW=this.value;render();});
  secSel.addEventListener('change',function(){sec=this.value;render();});

  // 随机一条
  document.getElementById('randBtn').addEventListener('click',function(){
    if(!D.entries.length) return;
    q=''; document.getElementById('q').value='';
    ev='all'; zero=false; sec='all'; fM='all'; fT='all'; fW='all';
    document.querySelectorAll('.btn.ev').forEach(function(x){x.classList.remove('on');});
    document.querySelector('.btn.ev[data-ev="all"]').classList.add('on');
    document.getElementById('zeroBtn').classList.remove('on');
    document.getElementById('fM').value='all';
    document.getElementById('fT').value='all';
    document.getElementById('fW').value='all';
    document.getElementById('sec').value='all';
    render();
    var e=D.entries[Math.floor(Math.random()*D.entries.length)];
    var el=document.getElementById('e-'+e.chapter+'-'+e.num);
    if(el){el.scrollIntoView({behavior:'smooth',block:'center'});
      el.classList.add('flash'); setTimeout(function(){el.classList.remove('flash');},1600);}
  });

  // 复制引用
  function toast(msg){
    var t=document.getElementById('toast'); t.textContent=msg; t.classList.add('show');
    setTimeout(function(){t.classList.remove('show');},1400);
  }
  document.getElementById('out').addEventListener('click',function(ev3){
    var a=ev3.target.closest&&ev3.target.closest('.copy');
    if(!a) return;
    var e=byId[a.dataset.c+'-'+a.dataset.n]; if(!e) return;
    var txt='《高性价比投资指南》第'+e.chapter+'章第'+e.num+'条「'+e.title+'」\n'+
      '花掉：'+e.spend+'\n换回：'+e.gain+'\n证据：'+e.grade+'｜出处：'+e.source;
    if(navigator.clipboard&&navigator.clipboard.writeText){
      navigator.clipboard.writeText(txt).then(function(){toast('已复制引用 ✓');},
        function(){toast('复制失败，请手动选择');});
    } else { toast('当前环境不支持自动复制'); }
  });

  // 交叉引用跳转
  document.getElementById('out').addEventListener('click',function(ev2){
    var a=ev2.target.closest&&ev2.target.closest('a.ref');
    if(!a) return;
    var id='e-'+a.dataset.c+'-'+a.dataset.n;
    var el=document.getElementById(id);
    if(el){el.scrollIntoView({behavior:'smooth',block:'center'});
      el.classList.add('flash'); setTimeout(function(){el.classList.remove('flash');},1600);}
  });

  document.getElementById('foot').innerHTML=
    '本《高性价比投资指南》为方法论手册，非投资建议，不构成对任何金融产品或策略的推荐。市场有风险，决策需独立判断并咨询持牌专业人士。'+
    '所有引用以各机构最新官方发布为准。本指南模仿《高性价比人生指南》(eternity4719/HowToLiveBetter) 的“成本-收益-证据等级”框架创作，向其致敬。';

  render();
})();
</script>
</body>
</html>
