品风险收益特征的常用评价指标（年化波动率/最大回撤）. <https://stcn.com/article/detail/1322422.html>", "note": "最大回撤定义——选定周期内产品净值从最高点回落到最低点的最大跌幅（证券时报, 2024）；可转债基金的最大回撤可数倍于纯债，配置时须按“权益敞口”而非“债基”标签来定仓位。"}, {"chapter": 21, "num": 11, "id": "21-11", "title": "定期报告披露的“实际持仓”比宣传靠谱", "grade": "C（披露为强制、信息真实，但“如何解读”需投资者能力，定级 C）", "tags": {"钱": "少", "时间": "少", "毅力": "些", "收益": "中", "口径": "金钱", "影响": "自己"}, "impact": "自己", "cost_money": "少", "cost_time": "少", "cost_will": "些", "benefit": "中", "scope": "金钱", "three_zero": false, "cost": "每年看季报/年报的“投资组合报告”与“运作分析”（证监会信披平台 eid.csrc.gov.cn）。", "plain": "宣传页会说漂亮话，季报只说真话。花十分钟翻季报，比看十篇软文有用。", "gain": "基金定期报告（季报/半年报/年报）是监管强制披露、审计过的“真话”来源，包含前十大重仓、全部持仓（半年报/年报）、债券久期、股票行业分布、份额变动与运作回顾，足以识别“言行不一”：比如宣称“价值投资”却重仓抱团成长、宣称“低波动”却可转债满仓。对比之下，宣传材料与销售页可选择性展示，参考性低。识别路径：①在中国证监会资本市场电子化信息披露平台（eid.csrc.gov.cn）或基金公司官网下载最新报告；②重点看“投资组合报告”前十重仓与“行业分类股票投资组合”；③读“管理人报告”里的运作分析与市场展望，判断经理是否知行合一。每年花十分钟翻一次，能及时纠偏——发现风格漂移（见条目 7）、规模萎缩（见条目 2）或经理变更（见条目 6），都该回到报告里验证。这是选基后“持续跟踪”成本最低、信息最硬的一环。", "source": "中国证监会 (2014/2026). 公开募集证券投资基金运作管理办法（信息披露相关章节）. <https://www.csrc.gov.cn/csrc/c106256/c1653978/content.shtml>; 资本市场电子化信息披露平台 (eid.csrc.gov.cn). 基金定期报告披露. <http://eid.csrc.gov.cn/fund/disclose/>", "note": "季报仅披露前十大重仓、半年报/年报才披露全持仓，因此半年报后核对最完整；报告有滞后（季报约在季末 15 个工作日内），用于“趋势跟踪”而非“实时交易”决策。"}, {"chapter": 22, "num": 1, "id": "22-1", "title": "国债几乎零违约，利率是机会成本锚", "grade": "A", "tags": {"钱": "0", "时间": "少", "毅力": "些", "收益": "中", "口径": "金钱", "影响": "自己"}, "impact": "自己", "cost_money": "0", "cost_time": "少", "cost_will": "些", "benefit": "中", "scope": "金钱", "three_zero": false, "cost": "零（国家信用）。", "plain": "国债利息还免个税。它的意义不是赚多少，是给你一个\"不冒风险能拿多少\"的标尺。", "gain": "国债以国家信用为背书，理论上违约概率极低，其收益率被视作\"无风险利率\"，是你衡量一切投资是否值得冒风险的标尺——只有当某资产预期收益明显高于同期限国债时，承担额外风险才说得通。以10年期国债为例，其收益率从1996年的约14%、2008年的3%—4%区间，一路\"下台阶\"至2020年的2.5%、2022年的2.7%，到2024年12月末已降至1.7%附近、创2002年以来历史新低，2024年12月2日更一度跌破2%。这意味着2024年买入长期国债的人拿到的无风险票息比十年前低了一大截，但反向衬托出\"安全资产荒\"——钱越多，越要接受一个较低的保底回报。此外，个人持有国债利息免征个税（《个人所得税法》第四条第（二）项），同等名义利率下到手更多。", "source": "国家税务总局 (2019). 国债利息收入是否免征个人所得税（个人所得税法第四条第（二）项）. <https://liaoning.chinatax.gov.cn/art/2019/8/30/art_1991_23923.html>; 中央国债登记结算有限责任公司 (2025). 2024年利率债市场回顾与2025年展望. <https://www.ccdc.com.cn/Fmi/Thinktank/Article/cb2025/cb202501/cb20250103/202501/t20250126_854519784.html>", "note": "国债免个税针对个人持有财政部发行的债券；政策性金融债利息同样免个税，但地方政府债仅2012年后发行的部分免税（见条目10）。无风险利率是理论锚，实操中短融、货基收益常因免税与流动性差异而低于同期限国债。交叉见条目3、10。"}, {"chapter": 22, "num": 2, "id": "22-2", "title": "存款保险 50 万上限：单家银行本息 50 万内全额保", "grade": "A", "tags": {"钱": "0", "时间": "少", "毅力": "些", "收益": "中", "口径": "金钱", "影响": "自己／家庭"}, "impact": "自己／家庭", "cost_money": "0", "cost_time": "少", "cost_will": "些", "benefit": "中", "scope": "金钱", "three_zero": false, "cost": "大额存款分散到不同银行。", "plain": "钱多别全放一家银行。超过 50 万的部分，理论上要看那家银行会不会倒。分散到几家，睡得着。", "gain": "同一存款人在同一家投保机构的所有被保险存款账户，本金和利息合并计算在50万元以内的，实行全额偿付；超出部分依法从投保机构清算财产中受偿。据央行披露，50万元限额可覆盖我国99.6%以上存款人的全部存款。注意三点：一是\"同一家银行\"而非\"同一个账户\"，你在A行不同分行的存款合并计算；二是保障的是\"存款\"（本外币、个人与单位存款），同业存款、高管在本机构的存款不在内；三是理财、基金、结构性存款不算存款，不保。对普通家庭，把超过50万的闲钱分散到2—3家不同银行，比追求某家高息小行更稳。存款保险由银行缴费，你不用交钱，触发偿付情形后7个工作日内足额偿付。", "source": "中国人民银行 (2024). 存款保险条例修改了保障额度吗（最高偿付限额为人民币50万元）. <https://wzdt.pbc.gov.cn/eportal/ui?pageId=77c3557bd521439ea5cd869f5393ba98&msgDataId=d3f5c72a0157407e97b4998676c34ef2>; 中国人民银行福州中心支行 (2015). 积极有效实施存款保险制度 充分保障存款人合法权益（偿付限额）. <https://fuzhou.pbc.gov.cn/fuzhou/126870/4011508/index.html>", "note": "50万是\"同一家投保机构\"合并计算，不是按账户、也不是按家庭；夫妻分名可提升家庭保障上限。理财、结构性存款、国债不在保障范围。定级A因出自国务院条例与央行官方解读，权威性强。"}, {"chapter": 22, "num": 3, "id": "22-3", "title": "货币基金不是存款，不保本但风险极低", "grade": "B", "tags": {"钱": "0", "时间": "0", "毅力": "否", "收益": "中", "口径": "金钱", "影响": "自己"}, "impact": "自己", "cost_money": "0", "cost_time": "0", "cost_will": "否", "benefit": "中", "scope": "金钱", "three_zero": true, "cost": "理解它不保本、有 T+0 赎回限额。", "plain": "货基不是活期、不保本金，但历史上极少亏损。应急金放这里合适，别指望它跑赢通胀。", "gain": "货币基金主要投资于短期限、高信用等级的货币工具（同业存单、短期国债、银行存款等），不保本但历史上极少亏损，是应急金的好去处——比活期存款收益高、取用灵活。但要注意它的两条边界：第一，它不是存款，不受存款保险保障，极端流动性事件中也可能单日收益转负（如2022年11月债市波动时货基收益明显走低、个别产品破净）；第二，2018年证监会与央行联合发布《关于进一步规范货币市场基金互联网销售、赎回相关服务的指导意见》，规定单只货基在单一销售机构的\"T+0赎回提现\"单日上限为1万元，超出部分只能走普通赎回（T+1甚至更久）。所以不要把全部应急金压在一只货基，也不要指望它跑赢通胀——它的定位是\"现金管理\"而非\"增值\"。", "source": "中国证监会、中国人民银行 (2018). 关于进一步规范货币市场基金互联网销售、赎回相关服务的指导意见（第二条：T+0赎回提现单日不高于1万元）. <https://www.chinanews.com.cn/fortune/2018/06-01/8528372.shtml>; 中国网 (2018). 央行、证监会：规范货币市场基金互联网赎回服务. <https://news.china.com.cn/2018-06/01/content_51567187.htm>", "note": "货基不保本，2022年11月波动虽未大面积亏损，但收益骤降、个别破净，证明极端情形存在。T+0限额仅限\"快赎提现\"，普通赎回额度不受1万限制但到账慢。定级B因源于监管规则与行业普遍低风险特征，并非零风险。交叉见条目4。"}, {"chapter": 22, "num": 4, "id": "22-4", "title": "债券基金有波动，不是\"稳赚\"", "grade": "B", "tags": {"钱": "少", "时间": "少", "毅力": "些", "收益": "中", "口径": "金钱", "影响": "自己"}, "impact": "自己", "cost_money": "少", "cost_time": "少", "cost_will": "些", "benefit": "中", "scope": "金钱", "three_zero": false, "cost": "承受利率上行时的账面回撤。", "plain": "债基不是存款的平替。利率一涨，债基净值就跌。它的\"稳\"是相对的，不是绝对的。", "gain": "债券基金的\"稳\"是相对的，不是绝对的。2022年11月债市急跌是最好的教材：11月14日中债-综合财富（总值）指数单日下跌0.41%，创2017年以来最大单日跌幅；据Wind，截至11月17日全市场1752只纯债基金中仅61只近一周为正收益，亏损占比高达96%，平均跌幅约0.54%，665只（占38%）创下成立以来最大回撤；个别基金近一周回撤超1%，有转债基金回撤达3%以上。同期银行理财破净数量快速攀升，多只产品触碰巨额赎回上限。原因链条是：利率上行→债基净值下跌→客户赎回→被迫卖券→进一步砸低价格。结论：纯债基金年波动也可达2%—5%，利率上行周期里它一样会亏，把它当\"存款平替\"是认知误区。", "source": "中国经济网 (2022). 债市连续下挫 多只债基单日跌近1%（中债-综合财富指数单日跌0.41%）. <https://finance.ce.cn/jjpd/jjpdgd/202211/17/t20221117_38234646.shtml>; 券商中国 (2022). 债市跌到哪了？创两年来最大调整（96%纯债基金近一周为负）. <https://www.toutiao.com/article/7167252372152910388>", "note": "2022年11月是单一极端样本，平时纯债年化波动更小；但\"债基不是存款\"的认知纠偏价值高。纯债基金久期越长跌得越狠，见条目7。定级B：有公开实证（Wind、媒体统计）支撑，但非学术长期样本。"}, {"chapter": 22, "num": 5, "id": "22-5", "title": "可转债：下有债底、上不封顶，但不是保本", "grade": "B", "tags": {"钱": "少", "时间": "少", "毅力": "些", "收益": "中", "口径": "金钱", "影响": "自己"}, "impact": "自己", "cost_money": "少", "cost_time": "少", "cost_will": "些", "benefit": "中", "scope": "金钱", "three_zero": false, "cost": "理解\"债底＋转股期权\"的双面性。", "plain": "可转债听着\"进可攻退可守\"，但高位接溢价转债一样亏。它比股票稳一点，比纯债野很多。", "gain": "可转债=\"债券+转股期权\"，熊市有债底托底、牛市可转成股票跟涨，因此常被宣传为\"进可攻退可守\"。但2022—2023年的现实泼了冷水：齐鲁转债2022年12月19日上市即破发，是当年唯一破发的银行转债；2023年搜特转债跌到31.666元/张的历史最低，蓝盾转债更成为首例退市转债，持有人面临重整清算下更高损失。截至2022年末全市场可转债平均价格约127元、平均转股溢价率约46%，意味着多数转债以远高于\"债底+转股价值\"在交易，溢价里含着对期权的过度定价。结论：可转债比股票波动小、比纯债野得多；高位接盘高溢价转债（转股溢价率超100%）一样可以腰斩，绝不是\"保本\"品种。", "source": "21世纪经济报道 (2023). 齐鲁银行拟下修可转债转股价 机构称2023年战略性看多银行转债（齐鲁转债破发）. <https://m.21jingji.com/article/20230110/herald/fa4be95a86a78df0cc1fa5225141b084_ths.html>; 网易/证券时报 (2023). 可转债投资价值仍存比较优势（首例退市、搜特转债31.666元）. <https://www.163.com/dy/article/I4IVE71U053469RG.html>", "note": "可转债风险与其溢价率高度相关，低溢价（接近债底）时下行有限，高溢价时与股票趋同。首例退市（蓝盾、搜特）打破\"必转必还\"幻觉。定级B：案例来自监管与市场报道，属个体风险而非系统性。交叉见条目6（信用）、7（久期）。"}, {"chapter": 22, "num": 6, "id": "22-6", "title": "高收益债＝高风险，信用利差不是白给的", "grade": "B", "tags": {"钱": "少", "时间": "少", "毅力": "些", "收益": "中", "口径": "金钱", "影响": "自己"}, "impact": "自己", "cost_money": "少", "cost_time": "少", "cost_will": "些", "benefit": "中", "scope": "金钱", "three_zero": false, "cost": "警惕\"收益率明显偏高\"的债/债基。", "plain": "为什么它利息比国债高那么多？因为市场怕它不还。高那截利息，是给你承担\"可能血本无归\"的补偿。", "gain": "信用利差=某信用债收益率−同期限国债收益率，高出的那一截利息，是对\"它可能违约\"的补偿，不是白送的收益。以海外高收益债（junk bond）为参照：据Moody's长期统计，高收益债年均违约率中位数约3.4%，危机年份（2008、2001—2002、2015—2016）可骤升至8%以上；一旦违约，高级无担保债的历史平均回收率仅约35%—40%（2022年通胀冲击期低至22.85%），即每100元面值平均只能拿回35—40元，损失约60%。国内低评级信用债（如AA、AA-乃至违约主体）逻辑相同：票息越高的债，市场给它定的违约概率越大。所以看到\"收益率明显偏高\"的债基或私募债，先问\"它凭什么比国债高这么多\"，而不是\"我能多赚多少\"。", "source": "New Capital (2025). Managing Defaults in a High Yield Portfolio（引用Moody's数据：回收率35.63、违约率中位数3.41%）. <https://www.newcapital.com/en/singapore/insights/Managing-Defaults-in-a-High-Yield-Portfolio.html>; 信报 (2024). 高收益债券为何叫垃圾债券？一文看清回报、风险与投资级别债券分别（穆迪年均违约率3.4%、回收率35%—40%）. <https://www.hkej.com/wm/article/id/4344326>", "note": "引用的Moody's为海外市场数据，国内信用债回收率统计口径不一、披露少，直接套用需打折；但\"高票息=高风险补偿\"逻辑普适。国内已有多起信用债违约且回收率低（部分不足面值一半）。定级B因以海外样本+逻辑推演为主。"}, {"chapter": 22, "num": 7, "id": "22-7", "title": "久期：衡量利率敏感度的一把尺", "grade": "B", "tags": {"钱": "少", "时间": "少", "毅力": "些", "收益": "中", "口径": "金钱", "影响": "自己"}, "impact": "自己", "cost_money": "少", "cost_time": "少", "cost_will": "些", "benefit": "中", "scope": "金钱", "three_zero": false, "cost": "看债券/债基的久期指标。", "plain": "久期就是\"利率涨 1%，我这债跌几个点\"。买长债基前看久期，心里才有底。", "gain": "久期（Duration）衡量债券/债券组合价格对利率变动的敏感度，可以理解为\"利率每变动1%，我的债大概反向变几个百分点\"。严格地说，修正久期D*满足近似式 ΔP/P ≈ −D*×Δy：若组合修正久期为5，利率上行1%价格约跌5%；久期为12，则约跌12%。现实中差异极大——以中债30年期国债财富指数为例，其久期约18，利率每变动1个基点（0.01%）指数就反向变约0.18%；2024年3月11日该指数收益率上行4bp，指数下跌0.69%，直观展示了\"久期越长、利率越敏感\"。对散户而言，买长债基前看它的久期：久期越长，加息/利率上行时跌得越狠，但也意味着利率下行时涨得越多。久期是你预判债基波动的第一把尺。", "source": "Morningstar. Duration | Investing Terms and Definitions（修正久期：利率变1%价格约变久期%）. <https://www.morningstar.com/investing-terms/duration>; 东方财富/鹏扬基金 (2024). 玩转30年国债ETF——债券波动看久期（30年国债指数久期约18）. <https://caifuhao.eastmoney.com/news/20240402162021292243230>", "note": "修正久期是线性近似，利率大幅变动时需叠加\"凸性\"修正；含权债（可赎回/可回售）要用有效久期。散户买债基看季报披露的\"久期\"或组合加权剩余期限即可。定级B：定义源自金融学标准方法与指数机构测算。"}, {"chapter": 22, "num": 8, "id": "22-8", "title": "永续债／优先股：条款复杂，默认谨慎", "grade": "C", "tags": {"钱": "少", "时间": "少", "毅力": "些", "收益": "中", "口径": "金钱", "影响": "自己"}, "impact": "自己", "cost_money": "少", "cost_time": "少", "cost_will": "些", "benefit": "中", "scope": "金钱", "three_zero": false, "cost": "不熟条款不碰。", "plain": "它叫\"债\"但不一定还你本金、利息还能递延。条款比普通债复杂一圈，看不懂就别买。", "gain": "永续债（无固定期限资本债券）名义叫\"债\"，却有鲜明的股权特征：没有固定到期日，发行人可自主将当期及已递延利息推迟到下一付息日支付且不视为违约；含减记或转股条款，触发事件（如核心偿付能力充足率低于30%）发生时可能直接减记或转股，投资人无权申请发行人破产。以保险版永续债为例，其偿付顺序先于普通股和优先股、后于一般债券和次级债券，属于\"次级中的次级\"。所以它收益率高于普通债，对应的是条款不确定性：利息可能被取消、本金可能被减记、永远不赎回。优先股类似，分红可累积可非累积、公司可决定不派。对散户的建议是\"看不懂条款就不碰\"，这类工具主要面向机构与合格投资者。", "source": "中国人民银行、中国银行保险监督管理委员会 (2022). 关于保险公司发行无固定期限资本债券有关事项的通知（第七、十条：利息取消、减记/转股风险）. <https://big5.nfra.gov.cn/cn/view/pages/rulesDetail.html?docId=1066561>; 人民日报 (2022). 险企永续债9月开闸，保险业再添\"补血\"新工具（无固定期限、可递延付息）. <https://www.peopleapp.com/rmharticle/30029808433>", "note": "银行版永续债2019年已开闸，保险版2022年9月落地；多为机构间市场，散户直接参与渠道有限，常以\"固收+\"产品间接持有。定级C因条款复杂、散户数据稀缺、违约样本极少。交叉见条目6（次级风险）。"}, {"chapter": 22, "num": 9, "id": "22-9", "title": "债券回购加杠杆是机构玩法，散户慎碰", "grade": "C", "tags": {"钱": "少", "时间": "少", "毅力": "些", "收益": "中", "口径": "金钱", "影响": "自己／家庭"}, "impact": "自己／家庭", "cost_money": "少", "cost_time": "少", "cost_will": "些", "benefit": "中", "scope": "金钱", "three_zero": false, "cost": "放弃\"回购放大收益\"。", "plain": "机构用回购借钱买债放大收益，散户跟风容易在资金面紧张时被打爆。普通配置用不上。", "gain": "债券回购（质押式回购）是机构\"押券借钱\"加杠杆的工具：正回购方把债券质押给逆回购方融入短期资金，买更多债，放大票息收益。但杠杆是双刃剑——利率反转时，负债成本上升、质押券估值下跌，叠加\"滚动续借\"被打断，会迅速放大亏损，甚至触发被动抛售。监管对此有明确红线（《关于规范债券市场参与者债券交易业务的通知》，银发〔2017〕302号）：存款类机构自营正/逆回购余额不得超过上季度末净资产80%，其他金融机构（券商、基金等）不超过上月末净资产120%，公募基金等公募非法人产品不超过上一日净资产40%（封闭运作、避险策略基金不超过100%）。普通投资者既难获得回购资格，也扛不住流动性冲击，这项\"收益增强\"基本与散户无关，别盲目模仿。", "source": "中国人民银行、银保监会、证监会、外汇局 (2017). 关于规范债券市场参与者债券交易业务的通知（银发〔2017〕302号，第九条：杠杆比率红线）. <https://neris.csrc.gov.cn/falvfagui/rdqsHeader/mainbody?navbarId=3&secFutrsLawId=745777672752458084>; 新浪财经 (2026). 一文看懂银行间债券回购（杠杆红线与期限上限）. <https://finance.sina.cn/2026-09-17/detail-iniscekk9292068.d.html?vt=4>", "note": "302号文同时要求回购纳入表内核算、最长期限不超365天、严禁抽屉协议。散户通过场内逆回购（如GC001）是\"借出\"方而非加杠杆方，风险很低。定级C因针对机构行为，与多数读者直接关联弱。交叉见条目4（波动）、7（久期）。"}, {"chapter": 22, "num": 10, "id": "22-10", "title": "地方债与国债的税后差异", "grade": "C", "tags": {"钱": "少", "时间": "0", "毅力": "否", "收益": "中", "口径": "金钱", "影响": "自己"}, "impact": "自己", "cost_money": "少", "cost_time": "0", "cost_will": "否", "benefit": "中", "scope": "金钱", "three_zero": false, "cost": "比较同期限地方债与国债的税后收益。", "plain": "地方债利息同样免税，比同期限国债收益略高一点，代价是流动性稍差、信用略弱。大额稳健资金可适度配。", "gain": "地方政府债与国债同属主权/准主权信用，关键税务差异在：根据《财政部 国家税务总局关于地方政府债券利息免征所得税问题的通知》（财税〔2013〕5号），企业和个人取得2012年及以后年度发行的地方政府债券利息收入，免征企业所得税和个人所得税——和国债利息一样免税（《个人所得税法》第四条第（二）项）。因此同期限下，地方债因流动性稍差、信用略弱于国债，票面通常比国债高几个到十几个BP，税后到手反而可能更优。代价是：地方债二级市场成交不如国债活跃，急用钱时折价变现概率更高；且不同省份财政实力差异大，虽违约极罕见但信用分化客观存在。大额稳健资金可适度增配，但别为那点溢价牺牲流动性。", "source": "财政部、国家税务总局 (2013). 关于地方政府债券利息免征所得税问题的通知（财税〔2013〕5号，第一条）. <https://fgk.chinatax.gov.cn/zcfgk/c102416/c5204397/content.html>; 国家税务总局 (2019). 国债利息收入是否免征个人所得税（个人所得税法第四条第（二）项）. <https://liaoning.chinatax.gov.cn/art/2019/8/30/art_1991_23923.html>", "note": "免税仅限\"地方政府债券\"（省级政府发行），城投债、国企债不在其列，后者仍要缴税且信用风险不同。同期限地方债与国债的税后差通常仅几个BP，对小额资金意义有限。定级C因差异偏小、需结合税额判断。交叉见条目1。"}, {"chapter": 23, "num": 1, "id": "23-1", "title": "美股长牛，但也会腰斩", "grade": "A", "tags": {"钱": "少", "时间": "少", "毅力": "些", "收益": "中", "口径": "金钱", "影响": "自己"}, "impact": "自己", "cost_money": "少", "cost_time": "少", "cost_will": "些", "benefit": "中", "scope": "金钱", "three_zero": false, "cost": "接受\"长期向上、中途腰斩\"的现实，用闲钱、能扛回撤的钱去买，且优先选费率≤0.03%的宽基 ETF 而非个股。", "plain": "美股不是只涨不跌的印钞机。它的好在于\"跌完还能创新高\"，前提是你没在腰斩时割肉。2008 年从高点腰斩近一半，但拿到现在早已数倍。", "gain": "标普 500 长期（1928–2026）年化总回报约 10%（含股息再投资）。但回撤凶猛：2000–2002 年累计跌约 49%、2008 年年内最深回撤约 -47.7%、2020 年新冠年内科创 -33.9%。据 Oppenheimer 统计，1988 年以来平均每年年内回撤约 14%，27 年中有 10 年以收跌告终。也就是说，用 ETF 拿住这 10% 的前提是扛得住动辄三到五成的浮亏——多数人在腰斩时割肉，把\"长期回报\"变成了\"别人的回报\"。", "source": "Oppenheimer Asset Management (2025). A Record of Resilience（图表：S&P 500 年内最深回撤，2008 -47.71%、2020 -33.92%）. <https://www.oppenheimer.com/_assets/docs/pdf/2025/oam/record-of-resilience.pdf>; SlickCharts (数据). S&P 500 Total Returns by Year（1928–2026，2008 -37.00%、2020 +18.40%）. <https://www.slickcharts.com/sp500/returns>; S&P Dow Jones Indices. S&P 500 Index Fact Sheet（长期年化回报约 10%）. <https://www.spglobal.com/spdji/en/indices/equity/sp-500/#overview>", "note": "年化 10% 是含股息再投资的历史均值，不代表未来；个股波动大于指数。通过美股账户（富途/老虎等）或 QDII/跨境 ETF 参与，注意 2026 年起境内对非法跨境证券业务收紧，优先选港股通、QDII、跨境理财通等合规渠道。"}, {"chapter": 23, "num": 2, "id": "23-2", "title": "跨市场配置降低单一经济体风险", "grade": "B", "tags": {"钱": "少", "时间": "少", "毅力": "些", "收益": "中", "口径": "金钱", "影响": "自己"}, "impact": "自己", "cost_money": "少", "cost_time": "少", "cost_will": "些", "benefit": "中", "scope": "金钱", "three_zero": false, "cost": "拿一小部分（如权益资产的 20%–40%）配海外/全球指数，作为组合的稳定器而非主攻。", "plain": "A 股跌的时候美股可能涨，反过来也一样。各放一点，谁崩都不至于全场归零。全球配置不是\"更刺激\"，是帮你少做噩梦。", "gain": "不同市场周期不同步，组合波动低于单一市场。MSCI 研究显示，以 MSCI ACWI（含新兴市场，同期波动约 21%）构建的全球组合，长期历史波动约 15.1%，低于 MSCI USA 的 15.6%；在 2000 年科技泡沫、2008 金融危机、2020 疫情三次危机中，全球组合的最大回撤均小于纯本土组合。State Street 数据亦显示，2010 年代以来美股与日本、欧洲的日常相关性已从 0.82、0.93 降至 0.47、0.63，分散价值重新上升。代价是放弃单一市场牛市时的\"满仓弹性\"，换来更平滑的回撤曲线。", "source": "MSCI (2020). Can diversification help weather the coronavirus storm?（MSCI ACWI 历史波动低于多数单一国家；三次危机回撤更低）. <https://www.msci.com/www/blog-posts/can-diversification-help/01778632038>; State Street Global Advisors (2026). Global diversification is regaining value（MSCI ACWI 中美股权重从 53% 升至 63%，区域相关性下降）. <https://www.ssga.com/us/en/individual/insights/mind-on-the-market-07-september-2026>", "note": "分散降低的是波动与尾部风险，不保证更高收益；近年美股占比升高（ACWI 中约 63%），纯\"全球\"组合已含较高美国暴露，需心中有数。"}, {"chapter": 23, "num": 3, "id": "23-3", "title": "汇率是双刃剑，别当纯增强", "grade": "B", "tags": {"钱": "少", "时间": "少", "毅力": "些", "收益": "中", "口径": "金钱", "影响": "自己"}, "impact": "自己", "cost_money": "少", "cost_time": "少", "cost_will": "些", "benefit": "中", "scope": "金钱", "three_zero": false, "cost": "接受汇率双向波动，别把它当稳定加成；长期持有忽略短期汇率噪声。", "plain": "买美股基金不只是赚美股，也顺手押了人民币。汇率能帮你也能坑你——人民币升值会吃掉你的美元收益，贬值则额外送你一段。别把汇率当\"白送的增强\"。", "gain": "海外资产既对冲本币贬值风险，也可能因本币升值而吃掉收益。MSCI 研究（1969–2009）显示，美国投资者投资非美股票的\"对冲\"与\"不对冲\"长期年化回报相近（MSCI ACWI 未对冲 9.5% vs 对冲 9.0%），对冲成本约 -26bp 至 +10bp，说明汇率长期趋于均衡、并非持续拖累。短期上，2022 年美元走强曾让以人民币计价的 QDII 美股基金出现额外汇兑损耗。正确姿势是：把汇率当\"随机项\"，长期忽略；若极度厌恶波动可部分对冲，但别为短期波动频繁择时。另需注意税务：经 CRS，中国税收居民境外金融账户信息会每年自动交换回国内（见备注来源）。", "source": "MSCI (2009). Globalization of Equity Policy Portfolios（Exhibit 14–15：对冲/不对冲回报相近，对冲成本 -26bp~+10bp）. <https://www.econ.puc-rio.br/mgarcia/Seminario/textos_preliminares/MSCI_Subramanian_Globalization_of_Equity_Policy_Portfolios_Oct_2009.pdf>; 国家税务总局黑龙江省税务局 (2026). 什么是金融账户涉税信息自动交换标准?（OECD 2014 发布 CRS，170 国承诺，2024 年交换 1.71 亿账户）. <http://heilongjiang.chinatax.gov.cn/art/2026/9/10/art_7578_597977.html>", "note": "汇率影响以人民币计价的 QDII/跨境 ETF 净值；直接美股账户还涉及换汇额度与合规。CRS（共同申报准则）下，中国税收居民在境外券商/银行的存款账户、证券账户、现金价值保单等信息，由对方税务机关每年自动交换给国家税务总局——正常投资无碍，但隐匿境外收入不可行。"}, {"chapter": 23, "num": 4, "id": "23-4", "title": "黄金是保险，不是主食", "grade": "B", "tags": {"钱": "少", "时间": "少", "毅力": "些", "收益": "中", "口径": "金钱", "影响": "自己"}, "impact": "自己", "cost_money": "少", "cost_time": "少", "cost_will": "些", "benefit": "中", "scope": "金钱", "three_zero": false, "cost": "小比例（5%–10%）长期持有，用黄金 ETF 或实物金，而非杠杆金矿股。", "plain": "黄金不是用来发财的，是用来\"市场崩盘时还有东西涨\"的保险。配一点，别当主力；多了会拖累长期收益。", "gain": "世界黄金协会 2026 版研究显示，在\"50%股票+40%债券+10%另类\"的典型组合中加入 5% 黄金，过去 20 年年化回报由 6.3% 微升至 6.4%，年化波动由 9.9% 降至 9.6%，风险调整回报由 0.635 升至 0.668，最大回撤由 -35.3% 改善至 -33.0%——小幅但确定地\"降波动、抗尾部\"。危机期黄金与股债多为负相关，是对冲恐慌的保险。但代价明显：黄金长期实际回报跑输股票（无现金流、无股息），过量持有（如 >10%–15%）会拖累复利。结论：5%–10% 是经实证反复出现的\"甜点区间\"，多了边际效用递减。", "source": "World Gold Council (2026). Gold as a strategic asset: 2026 edition（5% 黄金使 20 年风险调整回报 0.635→0.668、最大回撤 -35.3%→-33.0%）. <https://www.gold.org/goldhub/research/gold-strategic-asset-2026-edition/20450>; 世界黄金协会(中国) (2026). 黄金对投资组合的影响——风险/回报表现. <https://china.gold.org/goldhub/research/publication/2026/02/04/19500/19527>", "note": "黄金不付息、不分红，长期跑输权益；它的值是\"保险\"而非\"收益\"。配置用低费率黄金 ETF（如境内黄金 ETF）即可，避免金矿股（带股市 β）和杠杆产品。"}, {"chapter": 23, "num": 5, "id": "23-5", "title": "REITs：把地产变成可交易的现金流", "grade": "B", "tags": {"钱": "少", "时间": "少", "毅力": "些", "收益": "中", "口径": "金钱", "影响": "自己"}, "impact": "自己", "cost_money": "少", "cost_time": "少", "cost_will": "些", "benefit": "中", "scope": "金钱", "three_zero": false, "cost": "理解其\"高分红、利率敏感\"的双重性格，用闲钱、以收息心态持有。", "plain": "REITs 像\"用股票账户买收租房产\"，分红高（2024 年股息率约 3.96%）。但它是利率的敌人——加息时价格常跌，别把它当债基用。", "gain": "REITs 提供稳定分红与通胀对冲，但价格对利率高度敏感。Nareit 数据：FTSE Nareit All Equity REITs 指数 2024 年总回报 +4.9%，但 2022 年因加息大跌 -24.9%；2024 年股息率 3.96%，远高于 S&P 500 的 1.22%。该指数与 10 年期美债收益率呈明显负相关——2024 年 10 月后美债收益率上行期，REITs 回落约 8.9%，而同期 Russell 1000 涨 5.1%。长期看（过去 25 年）REITs 年化约 11.4%，跑赢 S&P 500 的 7.6%，但波动大于债、小于股，且\"利率上行→价格下跌\"的规律使其不适合当作稳健债基。以南向/跨境 REITs ETF 或境内 REITs 参与即可。", "source": "Nareit (2024). REITs Gain 4.9% in 2024 as December Headwinds Trim Earlier Gains（2024 +4.9%、2022 -24.9%；股息率 3.96% vs 标普 1.22%）. <https://www.reit.com/news/blog/market-commentary/reits-gain-49-2024-december-headwinds-trim-earlier-gains>; Nareit (2026). REITWatch（REITs 股息率与 10 年期美债收益率负相关）. <https://www.reit.com/sites/default/files/reitwatch/RW2602.pdf>", "note": "REITs 不是债券，利率敏感性强；优先选分散化的 REITs ETF 而非单只物业 REIT，避免办公室/商业地产等特定板块风险。"}, {"chapter": 23, "num": 6, "id": "23-6", "title": "新兴市场高波动高潜在回报", "grade": "B", "tags": {"钱": "少", "时间": "少", "毅力": "些", "收益": "中", "口径": "金钱", "影响": "自己"}, "impact": "自己", "cost_money": "少", "cost_time": "少", "cost_will": "些", "benefit": "中", "scope": "金钱", "three_zero": false, "cost": "承受更高波动，只用小比例（如权益资产的 5%–15%）长期配，别重仓赌国运。", "plain": "新兴市场可能一年涨 50% 也可能跌 40%。配一点博弹性，别把身家押在\"某国崛起\"的故事上。", "gain": "新兴市场增长潜力高于成熟市场，但风险同步更高。MSCI 数据显示，MSCI Emerging Markets 指数同期年化波动约 21%，高于全球组合的 15.1%；伴随更高的政策、汇率、流动性风险。其长期回报并不稳定跑赢发达市场——2008–2020 年间多次大幅跑输，且单一国家回撤常超 40%。因此定位应是\"组合的卫星仓\"：用小比例（5%–15%）获取更高潜在回报与地域分散，而非核心。对多数投资者，通过新兴市场 ETF（如 MSCI EM）而非个股/单国基金参与，并作好\"坐过山车\"的心理与资金准备。", "source": "MSCI (2020). Can diversification help weather the coronavirus storm?（MSCI EM 同期波动 21%，高于全球组合）. <https://www.msci.com/www/blog-posts/can-diversification-help/01778632038>; MSCI (2009). Globalization of Equity Policy Portfolios（非美股票更高潜在回报伴随更高风险）. <https://www.econ.puc-rio.br/mgarcia/Seminario/textos_preliminares/MSCI_Subramanian_Globalization_of_Equity_Policy_Portfolios_Oct_2009.pdf>", "note": "新兴市场内部分化极大（中国、印度、巴西各不相同）；避免押单一国家，优先宽基 EM ETF。QDII 中有多只新兴市场/单国基金，注意额度限购。"}, {"chapter": 23, "num": 7, "id": "23-7", "title": "港股估值常偏低，但有制度与流动性差异", "grade": "C", "tags": {"钱": "少", "时间": "少", "毅力": "些", "收益": "中", "口径": "金钱", "影响": "自己"}, "impact": "自己", "cost_money": "少", "cost_time": "少", "cost_will": "些", "benefit": "中", "scope": "金钱", "three_zero": false, "cost": "先搞懂港股通门槛与玩法，再决定配多少；别只因\"便宜\"就重仓。", "plain": "港股便宜有便宜的道理——流动性、做空机制、外资主导、无涨跌幅限制。想买港股，最合规的渠道是港股通（证券+资金账户合计≥50 万元人民币）。", "gain": "港股常因流动性折价与风险偏好低而估值偏低，提供\"估值洼地\"机会；但规则差异显著：T+0、无涨跌幅限制、可能长期停牌乃至直接退市。参与主渠道是互联互通下的港股通——据港交所投资者资料文件，沪港通 2014-11-17 推出、深港通 2016-12-05 推出，内地个人投资者需证券及资金账户余额合计不低于人民币 50 万元（不含融资融券融入部分）。截至 2026 年中，港股通累计净买入已超 5 万亿港元，成港股重要买方。结论：可用港股通小比例配置港股低估蓝筹/高股息，但须先理解其流动性分化与制度差异，而非把\"便宜\"当安全垫。", "source": "香港交易所(HKEX). 深港通滬港通投資者資料文件（个人投资者账户合计不低于人民币 50 万元；沪港通 2014-11-17、深港通 2016-12-05）. <https://www.hkex.com.hk/-/media/HKEX-Market/Mutual-Market/Stock-Connect/Getting-Started/Information-Booklet-and-FAQ/Information-Book-for-Investors/Investor_Book_Cn_(May).pdf>; 经济参考报 (2016). 关于深港通实操，这14个问题你必须了解（港股通 50 万门槛、T+0、无涨跌幅）. <https://www.jjckb.cn/2016-11/26/c_135859995.htm>", "note": "除港股通外，也可通过 QDII 港股基金参与；直接港美股账户受 2026 年跨境证券业务整治影响，内地居民优先走合规渠道。港股通以人民币交收、港币报价，含汇兑成本。"}, {"chapter": 23, "num": 8, "id": "23-8", "title": "VIX／恐慌指数不能长期持有", "grade": "C", "tags": {"钱": "少", "时间": "少", "毅力": "些", "收益": "中", "口径": "金钱", "影响": "自己"}, "impact": "自己", "cost_money": "少", "cost_time": "少", "cost_will": "些", "benefit": "中", "scope": "金钱", "three_zero": false, "cost": "明白期货升水的持续损耗，只把它当\"极短期保险\"，绝不长期持有。", "plain": "恐慌指数产品是\"短期保险\"，长期拿几乎必亏——展期损耗像漏水的水桶。VXX 这类产品，几年能跌掉九成以上。", "gain": "VIX 相关产品（如 VXX）追踪短期 VIX 期货，而 VIX 期货多数时间处于\"升水\"(contango)——远期合约更贵。Whaley(2013) 指出 VIX 期货约 80% 的交易日处于升水，展期损耗使买入持有策略长期几乎必亏；Eraker & Wu 测算，2006-01 至 2013-03 投资 VIX 期货亏损超 97%，年化约 -30%。学术结论一致：VIX ETP\"不适合买入持有\"，仅在市场恐慌、曲线转 backwardation 的极短窗口能提供对冲。对普通投资者，正确用法是\"不碰\"，或仅用极少量、极短期表达避险观点，绝不把它当资产长期配置。", "source": "Whaley, R. (2013). Trading Volatility: At What Cost?（VIX 期货 80% 交易日升水，买入持有几乎必亏）. <https://www.researchgate.net/publication/256062271_Trading_Volatility_At_What_Cost>; Eraker, B. & Wu, Y. (2013). Explaining the Negative Returns to Volatility Claims: An Equilibrium Approach（2006-2013 亏损 >97%，年化约 -30%）. <https://wsbfiles.bus.wisc.edu/digital/ywu98/intellcont_journal/VIXETNs_ErakerWu-3.pdf>", "note": "VIX 产品是择时工具而非配置资产；杠杆反向产品风险更高。绝大多数长期持有者亏损，列入\"禁长期\"清单。"}, {"chapter": 23, "num": 9, "id": "23-9", "title": "跨境 ETF 有\"时差＋溢价\"双重坑", "grade": "B", "tags": {"钱": "少", "时间": "少", "毅力": "些", "收益": "中", "口径": "金钱", "影响": "自己"}, "impact": "自己", "cost_money": "少", "cost_time": "少", "cost_will": "些", "benefit": "中", "scope": "金钱", "three_zero": false, "cost": "避开境内外交易时段错位时的高溢价，买前看溢折率（现价 vs IOPV）。", "plain": "美股休市时你还能在 A 股炒美股的 ETF，这时价格是\"情绪价\"。溢价高时买，等美股开盘/套利生效就挨宰。", "gain": "因时差，跨境 ETF 在 A 股交易时其底层（美股/日股）净值已\"冻结\"，情绪化时溢价可拉大。2023 年 5 月日经 225 ETF 被爆炒：易方达日经 225 ETF 溢价一度达 22.44%、华夏 17.34%，两个交易日即回落 16.61%/13.97%，追高者巨亏。华宝证券统计，国内 ETF 溢价率破 15% 的情况平均仅维持 1.7 天。根因是 QDII 外汇额度紧张→一级市场申购受限→套利机制失效（据外汇局，截至 2024-05 末 QDII 累计获批 1678 亿美元、189 家机构，仍常不够用）。所以买跨境 ETF 先看溢折率，溢价 >3%–5% 即为警示，优先选折价或接近净值的品种。", "source": "中国证券网 (2023). 跨境ETF持续高溢价 基金公司警示声不断（2023-05-19 日经 ETF 溢价 22.44%，两日回落 16.61%）. <https://www.cnstock.com/commonDetail/19741>; 国家外汇管理局 (2024). 统筹推进资本项目高质量开放与高水平安全（截至 2024-05 末 QDII 累计获批 1678 亿美元、189 家机构）. <https://www.safe.gov.cn/safe/2024/0627/24669.html>; 中国证券报 (2023). 高溢价难持久 日经ETF坐上过山车. <https://www.cs.com.cn/hw2020/202305/t20230524_6346145.html>", "note": "溢价≠收益，是\"情绪税\"；额度放开或热度退潮后溢价迅速收敛。跨境 ETF 还含汇率风险（见第 3 条）。合规渠道还包括港股通、QDII 基金、跨境理财通。"}, {"chapter": 23, "num": 10, "id": "23-10", "title": "全球配置用一两只宽基就够，别贪多", "grade": "C", "tags": {"钱": "少", "时间": "少", "毅力": "些", "收益": "中", "口径": "金钱", "影响": "自己"}, "impact": "自己", "cost_money": "少", "cost_time": "少", "cost_will": "些", "benefit": "中", "scope": "金钱", "three_zero": false, "cost": "克制\"每个市场都买一只\"的冲动，用一两只宽基覆盖全球。", "plain": "想全球配置，一只 MSCI 全球/ACWI 类 ETF 就覆盖绝大多数上市公司。加十只不如守一只——多只只增成本、不增收益。", "gain": "一只全球/全市场 ETF 已含数千家公司、数十国。MSCI ACWI 覆盖 23 个发达+24 个新兴市场（约 47 国），State Street 数据显示其美国权重约占 63%，足以表达\"全球\"敞口；晨星统计 Vanguard S&P 500 ETF(VOO) 费率仅 0.03%/年，而老牌 SPY 为 0.0945%——10 年每 10 万元费用差约 550 元，长期复利差距可观。据此，普通投资者用\"1 只本国宽基(如沪深 300 ETF)+1 只全球宽基(如 MSCI ACWI/ACWI ex-China ETF)\"即可完成配置，无需堆砌行业/国家 ETF。注意非美居民买美上市 ETF 面临 30% 股息预扣税（爱尔兰注册 UCITS 可降至 15%），应选合税收/注册地的产品。", "source": "MSCI (2020). Can diversification help weather the coronavirus storm?（MSCI ACWI 覆盖全球、无本土偏好）. <https://www.msci.com/www/blog-posts/can-diversification-help/01778632038>; State Street Global Advisors (2026). Global diversification is regaining value（ACWI 约 47 国、美国权重 63%）. <https://www.ssga.com/us/en/individual/insights/mind-on-the-market-07-september-2026>; Vanguard. Understanding the total cost of ETF ownership（VOO 费率 0.03% vs SPY 0.0945%，10 年每 10 万省约 550 元）. <https://www.vanguardmexico.com/content/dam/intl/americas/documents/latam/en/2025/06/understanding-the-total-cost-of-etf-ownership.pdf>", "note": "宽基≠无风险；ACWI 中美国占比已高，若想降美国暴露可选 ACWI ex-USA。ETF 费率、跟踪误差、折溢价、注册地税务都应纳入选择。"}, {"chapter": 24, "num": 1, "id": "24-1", "title": "期权买方：时间价值每天都在流失", "grade": "A", "tags": {"钱": "少", "时间": "少", "毅力": "些", "收益": "中", "口径": "金钱", "影响": "自己／家庭"}, "impact": "自己／家庭", "cost_money": "少", "cost_time": "少", "cost_will": "些", "benefit": "中", "scope": "金钱", "three_zero": false, "cost": "理解 Theta（θ，时间衰减），知道权利金=内在价值＋时间价值，时间价值会随到期归零。", "plain": "买期权像买快过期的门票，时间每过一天就贬一点，且越临近到期贬得越快。你不仅要赌对方向，还要赌对幅度和时机，难度翻倍——\"对了方向仍亏钱\"是常态。", "gain": "期权买方支付的权利金=内在价值+时间价值，时间价值由 Theta 量化，单位为元/天，对买方为负。CBOE 期权学院材料显示，平值期权在剩余 60 天时每日 Theta 约 -0.10，到期前 7 天骤升至约 -0.55，最后一周时间价值以数倍速度蒸发；业界经验法则为期权在最后 30 天流失约 1/3、最后 14 天再流失约 1/3 的总时间价值。到期日时间价值归零、仅剩内在价值，故\"买在到期前 30 天内\"的虚值合约大多归零或大幅贬值。Black-Scholes（1973）理论亦表明，平值期权 Theta 近似按 1/√T 加速。结果是：买方需同时赌对方向、幅度与时机，长期买方多为净亏损，交易所/券商披露数据普遍显示多数零售期权买方亏损。", "source": "CBOE Options Institute (2017). Using the Option Greeks（时间价值与时间衰减，平值 40 Call 60 天 Theta 0.10、7 天 Theta 0.55）. <https://www.interactivebrokers.com/webinars/2017-WB-2719_CBOE-UsingOptionGreeks.pdf>; Black, F. & Scholes, M. (1973). The Pricing of Options and Corporate Liabilities, Journal of Political Economy 81(3):637–654（Theta 与 1/√T 加速）. <https://doi.org/10.1086/260062>; 叩富网/期货姜经理 (2024). 期权的时间价值是什么？为什么会归零？（到期日时间价值必然归零、买方 Theta 为负）. <https://licai.cofool.com/ask/qa_7465568.html>", "note": "局限：Theta 是\"平均\"衰减，实际受隐含波动率（Vega）、Gamma 影响，临近到期 Gamma 飙升使方向风险骤增；买方胜率多来自交易所/券商风险揭示，非本章测算。交叉参考：第 7 条（杠杆 ETF 的波动损耗是另一种\"路径/时间\"损耗）、第 8 条（备兑开仓是反过来\"赚\" Theta 的一方）。"}, {"chapter": 24, "num": 2, "id": "24-2", "title": "融资融券：利息＋强平，把波动变成死亡", "grade": "A", "tags": {"钱": "少", "时间": "少", "毅力": "些", "收益": "中", "口径": "金钱", "影响": "自己／家庭"}, "impact": "自己／家庭", "cost_money": "少", "cost_time": "少", "cost_will": "些", "benefit": "中", "scope": "金钱", "three_zero": false, "cost": "放弃\"无杠杆\"的安全垫；借入资金按日计息（当前美股券商保证金利率约 5%–12%），利息按月复利计入负债。", "plain": "融资就是借钱炒股。涨时多赚、跌时先死——更可怕的是券商能在你来不及反应时直接卖掉你的股票还债，且不用通知你、不用问你想卖哪只。", "gain": "融资融券（保证金交易）把收益与亏损同时放大。美联储 Regulation T 规定券商最多借出买入价的 50%，即你出 1 元可买 2 元（约 2 倍杠杆）；股价涨 50% 本金翻倍，跌 50% 本金归零且仍欠利息。更危险的是\"维持保证金\"：FINRA 规则 4210 下限 25%，券商内部常设 30%–40%，且可随时上调、不提前通知。账户权益跌破维持线即触发追保，未按时限补足，券商有权不经你同意、自选品种强平，常卖在最低点，且强平本身制造应税事件。极端历史案例：LTCM（1998）以约 30 倍杠杆交易，8 月单月亏 44%、9 月净值仅余约 6 亿美元（亏超 90%），美联储协调 14 家机构注资 36 亿美元才避免连锁崩盘——证明\"模型+高杠杆\"在尾部行情也会瞬间爆掉。对普通人，一次强平即永久出局。", "source": "SEC 投资者教育与倡导办公室 (投资者公告). Investor Bulletin: Understanding Margin Accounts（\"you can lose more money than you have invested\"、券商可不经通知强平）. <https://www.sec.gov/answers/marsell.htm>; 美国联邦储备委员会 (Regulation T, 12 CFR Part 220). Credit by Brokers and Dealers（初始保证金 50%）. <https://www.ecfr.gov/current/title-12/chapter-II/subchapter-A/part-220>; 美联储历史项目 (1999). Near Failure of Long-Term Capital Management（LTCM 约 30 倍杠杆、1998 年 9 月 14 家机构注资 36 亿美元）. <https://www.federalreservehistory.org/-/media/Project/FedHistory/FedHistory/Documents/essaysPDFs/Near-Failure-of-Long-Term-Capital-Management-_-Federal-Reserve-History.pdf>", "note": "局限：Reg T 仅约束\"初始\"50%，维持保证金由 FINRA 规则 4210（下限 25%）与券商\"内部规则\"（常 30%–40%）另行设定，券商可随时上调且不提前通知。LTCM 为机构案例，说明再精密的模型也扛不住流动性枯竭与相关性挤兑。交叉参考：第 7 条（杠杆 ETF 同理放大多空波动）。"}, {"chapter": 24, "num": 3, "id": "24-3", "title": "股指期货：保证金与贴水双重考验", "grade": "A", "tags": {"钱": "少", "时间": "少", "毅力": "些", "收益": "中", "口径": "金钱", "影响": "自己"}, "impact": "自己", "cost_money": "少", "cost_time": "少", "cost_will": "些", "benefit": "中", "scope": "金钱", "three_zero": false, "cost": "理解保证金变动与\"贴水\"（远月低于近月）的移仓成本；期货保证金随市场波动被交易所/期货公司上调。", "plain": "期指不是\"便宜的股票\"。它的贴水像持续漏水，且保证金会随波动追加，逼你在低点补钱——既考验判断，更考验现金流。", "gain": "股指期货实行保证金交易，中金所最低交易保证金 12%（即约 8 倍杠杆），价格 ±10% 涨跌停，且交易所/期货公司可随风险上调保证金比例。杠杆意味着指数小幅波动即放大为本金大波动：以 12% 保证金计，指数反向波动约 12% 即击穿保证金、可能强平。更复杂的是\"贴水\"（基差为负，远月低于近月）：长期持有贴水合约需逐月移仓，每次把近月换成远月都\"低卖高买\"，贴水持续则形成稳定磨损，长期收益显著低于标的涨幅。中金所《风险控制管理办法》明确强行平仓制度——保证金不足且未在约定时限补足即被强平，损失与费用自负；期货业协会亦提示\"损失的总额可能超过存放在期货公司的全部初始保证金以及追加保证金\"。因此期指不适合\"买入长期持有\"思维，它是风险管理/对冲工具而非\"便宜的股票\"。", "source": "中国金融期货交易所 (2026). 中国金融期货交易所交易规则（第五章 风险控制：保证金制度、持仓限额、强行平仓制度；最低交易保证金 12%）. <http://www.cffex.com/cn/gzjygz/20260410/43076.html>; 中国金融期货交易所 (风险控制管理办法). 股指期货合约最低交易保证金标准 12%、涨跌停板 ±10%、强行平仓制度（第四十六条）. <http://www.cffex.com.cn/u/cms/www/oldsys/P020120530563270334416.pdf>; 中国期货业协会 (2021). 《期货经纪合同》指引（2021年修订，保证金交易具杠杆性、损失可超初始及追加保证金）. <https://www.cfachina.org/governmentrules/selfdisciplinerules/businessspecificationclass/202101/t20210125_15136.html>", "note": "局限：贴水（基差）非交易所明文\"损耗\"、而由市场供需决定，长期持有贴水合约须逐月移仓，移仓成本随贴水幅度变化；保证金比例可由交易所/期货公司随风险上调。交叉参考：第 1 条（时间价值）、第 7 条（杠杆 ETF 的路径损耗同理）。"}, {"chapter": 24, "num": 4, "id": "24-4", "title": "雪球：敲入后亏损无底，绝非\"保本\"", "grade": "A", "tags": {"钱": "少", "时间": "少", "毅力": "些", "收益": "中", "口径": "金钱", "影响": "自己／家庭"}, "impact": "自己／家庭", "cost_money": "少", "cost_time": "少", "cost_will": "些", "benefit": "中", "scope": "金钱", "three_zero": false, "cost": "看清\"非保本、有敲入\"的本质，确认自己不是以私募通道绕开适当性管理的自然人。", "plain": "雪球宣传\"高票息\"，但那是你卖出一个看跌期权的报酬。市场大跌敲入，你接的是真金白银的亏损——所谓\"稳赚\"在极端行情下变成\"本金腰斩\"。", "gain": "雪球（自动敲入敲出类期权）本质是你向券商卖出一只带敲入、敲出障碍的场外看跌期权，票息 12%–22% 是其\"看跌期权卖方\"报酬，收益封顶而下行敞口巨大。挂钩标的多为中证 500/1000 指数，敲入线常为期初价 70%–80%。2022–2024 市场深度回调，中证 500/1000 多次触发敲入，存量规模峰值约 5000 亿元（2021），2024 年初券商敲入占比约 7%；部分投资者本金亏损 30%–70%。真实判例：费某通过私募通道购入 23 份雪球，2023–2024 标的大跌触发敲入，净亏损约 1434 万元，上海金融法院（2026）沪 74 民终 527 号判机构连带赔偿 1004 万元，但投资者仍自担部分亏损。结论：雪球绝非\"保本高息\"，敲入后接的是真金白银的亏损，且自然人本就被禁止作为直接交易对手方。", "source": "中国证监会 (2023). 关于《衍生品交易监督管理办法（征求意见稿）》公开征求意见的通知（将自动敲入敲出类期权产品纳入规制）. <https://www.csrc.gov.cn/csrc/c101981/c7326196/content.shtml>; 中国经济网 (2024). 雪球产品，对股市影响大吗？（挂钩中证 500/1000 存量约 2000 亿元、2024 年初券商敲入占比约 7%）. <http://m.ce.cn/bwzg/202401/30/t20240130_38886503.shtml>; 百度百科 (2021). 雪球（本质为卖出带敲入敲出障碍的奇异看跌期权；2021 年 8 月证监会提示风险、存续规模峰值约 5000 亿元）. <https://baike.baidu.com/item/%E9%9B%AA%E7%90%83/63994128>", "note": "局限：雪球本金亏损取决于\"敲入后到期价低于期初价\"的幅度，并非固定金额；票息高对应的是\"看跌期权卖方\"尾部风险。2022–2024 中证 500/1000 多次敲入，部分本金亏损 30%–70%（华泰案例费某净亏约 1434 万元，上海金融法院（2026）沪 74 民终 527 号）。交叉参考：第 8 条（保护性认沽是反向的\"买保险\"操作）。"}, {"chapter": 24, "num": 5, "id": "24-5", "title": "结构化产品：收益封顶、风险敞口说不清", "grade": "A", "tags": {"钱": "少", "时间": "少", "毅力": "些", "收益": "中", "口径": "金钱", "影响": "自己／家庭"}, "impact": "自己／家庭", "cost_money": "少", "cost_time": "少", "cost_will": "些", "benefit": "中", "scope": "金钱", "three_zero": false, "cost": "拒绝嵌套条款看不懂的产品；买入前索要并通读募集说明书的\"偿付结构\"章节。", "plain": "产品越花哨，越利于卖方藏对你不利那条。看不懂第七层嵌套的，默认不买——你省下的可能不是收益，而是本金。", "gain": "结构化产品（如结构化票据、雪球类、保本/部分保本票据）把\"债券+内嵌衍生品\"打包，收益封顶、结构多层：含参与率、障碍、敲入、封顶收益等条款，普通人难算清真实概率。SEC 投资者公告指出，结构化票据结构复杂、发行价常高于公允价值（含销售/对冲成本），二级流动性极差、提前赎回可能大幅折价；所谓\"本金保护\"仅取决于发行方信用——雷曼破产后其结构化票据持有人作为无担保债权人几乎血本无归。多数结构化票据并不保本，且收益上限被封死（如参与率 50% 时指数涨 20% 你仅得 10%），下行却可能全担。复杂结构利于卖方隐藏不利条款。证监会《衍生品交易监督管理办法（二次征求意见稿）》已明确\"限制开发结构过度复杂的衍生品合约\"。看不懂第七层嵌套的，默认不买。", "source": "SEC 投资者教育与倡导办公室 (投资者公告). Investor Bulletin: Structured Notes（结构复杂、发行价高于公允价值、流动性差、发行方信用风险）. <https://www.investor.gov/introduction-investing/general-resources/news-alerts/alerts-bulletins/investor-bulletins-76>; SEC 投资者教育与倡导办公室 (投资者公告). Structured Notes with Principal Protection: Note the Terms（\"本金保护\"取决于发行方信用、雷曼破产案例）. <http://www.investor.gov/news-alerts/investor-bulletins/structured-notes-principal-protection-note-terms-your-investment>; 人民网 (2023). 衍生品交易多类行为将被禁止 确保\"看得穿 管得住\"（《二次征求意见稿》限制开发结构过度复杂的衍生品合约）. <https://finance.people.com.cn/n1/2023/1120/c1004-40122013.html>", "note": "局限：多数结构化票据不保本，收益封顶且含参与率、障碍、敲入等条款，发行价常高于公允价值（含销售/对冲成本）。交叉参考：第 4 条（雪球本质也是结构化/奇异期权，看跌期权卖方）。"}, {"chapter": 24, "num": 6, "id": "24-6", "title": "分级基金已退场，是活教材", "grade": "A", "tags": {"钱": "少", "时间": "少", "毅力": "些", "收益": "中", "口径": "金钱", "影响": "自己"}, "impact": "自己", "cost_money": "少", "cost_time": "少", "cost_will": "些", "benefit": "中", "scope": "金钱", "three_zero": false, "cost": "记住这段历史；识别\"披着基金外衣的杠杆结构\"新变种（高溢价行业 LOF、杠杆 ETF 等）。", "plain": "曾经\"加杠杆神器\"的分级 B，在股灾里让散户几天亏光、下折归零。它已被清退，但\"杠杆+高溢价\"的套路常换新装出现，遇着先警惕。", "gain": "分级基金（2007 年诞生、峰值规模约 5000 亿元）将母基金拆为 A（稳健）/B（进取），B 借 A 的钱形成杠杆，净值上涨时杠杆减弱、下跌时杠杆倍数骤增，呈现\"慢涨快跌\"。2015 股灾中分级 B 连续跌停无法卖出、多次下折使溢价瞬间归零，不少散户几天亏光、折价亏损可达 90%；监管遂于 2018 年《资管新规》要求公募不得分级，存量 2020 年底前整改。证监会 2020 年明确\"公募分级基金规范整改不作延期\"，2021 年起分级基金退出历史舞台、转型 LOF 或清盘。它是最生动的\"加杠杆散户陷阱\"教材：高溢价 B 在转型/清盘时泡沫破灭，溢价超 100% 者（如生物药 B 溢价 235%）买入即可能巨亏。教训是——披着\"基金\"外衣的杠杆结构，普通人不碰。", "source": "中国证监会 (2020). 新闻发言人答记者问：公募分级基金的规范整改不作延期（2020 年底前完成）. <https://cs.com.cn/xwzx/hg/202007/t20200731_6081783.html>; 中国航空报 (2020). 再见，分级基金！（诞生 2007、峰值规模约 5000 亿元、2021 年起退出；极端行情折价亏损可达 90%）. <https://ep.cannews.com.cn/index.php?banmianid=2331&c=PhonePaper&id=87682&m=showWen&paperid=7>; 21 世纪经济报道 (2020). 分级基金生死劫（2015 股灾下折巨额亏损、高溢价 B 面临泡沫破灭）. <https://m.21jingji.com/article/20200807/456e86dfba19b8578b7e02f1d6d42424_zaker.html>", "note": "局限：已清退，但\"加杠杆基金/高溢价 B\"以新形式再现（如部分行业 LOF、杠杆 ETF），教训是\"看不懂的杠杆结构不碰\"。交叉参考：第 7 条（杠杆 ETF 是当代\"加杠杆\"载体）。"}, {"chapter": 24, "num": 7, "id": "24-7", "title": "杠杆 ETF 不适合长期持有", "grade": "A", "tags": {"钱": "少", "时间": "少", "毅力": "些", "收益": "中", "口径": "金钱", "影响": "自己"}, "impact": "自己", "cost_money": "少", "cost_time": "少", "cost_will": "些", "benefit": "中", "scope": "金钱", "three_zero": false, "cost": "明白\"每日再平衡\"的损耗（volatility decay），放弃\"持有一年=标的×倍数\"的错觉。", "plain": "2 倍杠杆 ETF 持有一年，不等于\"标的涨 10% 你赚 20%\"。震荡市里波动损耗会偷偷吃掉收益，你可能\"指数没跌、钱却少了\"。", "gain": "杠杆/反向 ETF 为\"每日重置\"（daily reset），目标是盯住当天的倍数（如 2 倍、3 倍），而非持有期累计倍数。因每日复利+再平衡，长期表现会显著偏离\"标的×倍数\"，震荡市产生\"波动损耗\"（volatility decay）。SEC 实例：4 个月某指数仅 +2%，2 倍杠杆 ETF 却 -6%，3 倍杠杆 ETF（不同指数）-53% 而标的 +8%；两日情景：指数 -10%/+10% 回到 99（-1%），3 倍杠杆 ETF 回到 91（-9%）。原理是指数单日波动被平方式放大后，下跌日的亏损基数大于上涨日的盈利基数。单边上涨时杠杆 ETF 可跑赢，但\"长期持有\"假设不成立——持有一年≠标的涨 10% 你赚 20%。FINRA 亦警示其不适合买入持有型投资者。结论：杠杆 ETF 只适合日内/短波段交易，长期持有会被波动偷偷吃掉收益。", "source": "SEC 投资者教育与倡导办公室 (投资者公告). Updated Investor Bulletin: Leveraged and Inverse ETFs（每日重置、长期表现可显著偏离倍数；4 个月指数 +2% 而 2 倍杠杆 ETF -6%）. <https://sec.gov/investor/pubs/leveragedetfs-alert.htm>; SEC/FINRA (投资者警示). Leveraged and Inverse ETFs: Specialized Products with Extra Risks for Buy-and-Hold Investors. <https://www.investor.gov/introduction-investing/general-resources/news-alerts/alerts-bulletins/investor-alerts/sec>; FINRA. Non-Traditional ETFs FAQ（每日再平衡、波动损耗）. <https://www.finra.org/investors/learn-to-invest/types-investments/exchange-traded-funds/etfs-leveraged-inverse>", "note": "局限：波动损耗在震荡市最严重；单边上涨时杠杆 ETF 可跑赢，但\"长期持有\"假设不成立。示例：指数两日 -10%/+10% 回到 99（-1%），3 倍杠杆 ETF 回到 91（-9%）。交叉参考：第 1 条（时间/路径损耗的对偶）。"}, {"chapter": 24, "num": 8, "id": "24-8", "title": "备兑／保护性策略仅对专业持股者有用", "grade": "B", "tags": {"钱": "少", "时间": "少", "毅力": "些", "收益": "中", "口径": "金钱", "影响": "自己"}, "impact": "自己", "cost_money": "少", "cost_time": "少", "cost_will": "些", "benefit": "中", "scope": "金钱", "three_zero": false, "cost": "承认自己不是那类人；若硬要试，先有股票底仓、能持续盯市管理行权/展期/被指派。", "plain": "卖方爱讲\"备兑增收\"，但那要求你本来就有股票、还天天管。普通人图省心，别碰为妙——你既缺标的、又缺时间，还担被行权/追保的执行风险。", "gain": "备兑开仓（持有股票并卖出看涨期权收权利金）与保护性认沽（持股并买入看跌期权作保险）对\"已长期持股、能持续盯市管理\"的专业投资者有小用：备兑在震荡市增收、认沽在暴跌时保底。但这是对卖方/买方角色的专业运作，要求你本就有股票底仓、且每天管理行权/展期/被指派。CBOE 材料显示备兑是\"Level 1\"基础策略，但其收益封顶（股票被 calls away 后错过上方涨幅）、认沽要持续付保费（Theta 对你不利）。期货业协会风险揭示明确\"卖出期权可能发生巨额损失、超全部保证金\"。对图省心、无底仓、无时间管理的普通散户，这类策略净负且费精力——你既缺标的、又缺时间，还承担被行权/追保的执行风险。普通人若想\"省心\"，不应以期权策略替代资产配置。", "source": "CBOE Options Institute (2016). Equity Option Selling Strategies（备兑开仓、现金担保看跌；Theta 对卖方有利）. <https://www.interactivebrokers.com/webinars/2016_WB_2545_CBOE_Equity_Option_Selling_Strategies.pdf>; 中国期货业协会 (2021). 《期货经纪合同》指引（2021年修订，卖出期权可能发生巨额损失、超保证金）. <https://www.cfachina.org/governmentrules/selfdisciplinerules/businessspecificationclass/202101/t20210125_15136.html>; The Options Clearing Corporation. Characteristics and Risks of Standardized Options（标准期权风险揭示文件）. <https://www.theocc.com/about/publications/characteristics-and-risks-of-standardized-options>", "note": "局限：备兑收益封顶、认沽持续耗保费；期权卖方理论亏损可超保证金。普通散户无底仓、无时间管理，净负且费精力。交叉参考：第 1 条（Theta 对买方不利、对卖方有利）、第 4 条（保护性认沽是雪球\"卖看跌\"的反向保险）。"}], "lists": [{"chapter": 10, "title": "十、反面清单（直接不做）", "items": ["集中持有一两只股票／一个行业 —— 单点黑天鹅可让身家归零，分散到 20–30 只不同行业才能消除约 90% 个股风险（见第 2 条、第一章第 2 条）。", "任何形式高杠杆（含场外配资） —— 跌 50% 不杠杆还在牌桌，加了杠杆可能已被强平出局，底部割在最低点（见第一章第 3 条、第 6 条、第 24 章）。", "每月频繁买卖、把基金当股票炒 —— 上交所 5340 万账户显示频繁交易者亏损概率最高，年换手 300% 以上成本可吞掉 15%–18% 本金（见第三章、第 12 章）。", "付费加荐股群／老师带单 —— 无牌照荐股违法，收费带单＝先收你的钱再拿你当流动性（见第一章第 13 条、第 6 章第 2 条）。", "追热点题材、炒概念、炒消息 —— 你听到的消息往往已是别人要找下家接盘的时点（见第一章第 10 条、第 16 章）。", "买\"保证收益／保本高息\"产品 —— 资管新规已禁止保本保收益，收益超 10% 就要准备损失全部本金（见第 6 章第 1、4 条）。", "用短期要用的钱（房贷学费生活费）投资 —— 市场不配合你的用钱时间表，熊市低点被迫卖出是散户跑输指数的头号原因（见第一章第 4 条、第 13 章）。", "听\"内部消息\"\"原始股\"下单 —— 内幕交易是刑事红线，未上市股权骗局多（见第一章第 11 条、第 6 章第 7 条）。", "试图择时加减仓、猜顶抄底 —— 宏观预测长期接近随机，错过最佳交易日对回报的杀伤远大于选错标的（见第一章第 7 条、第 17 章、第四章）。", "把加密投机当主仓重仓赌方向 —— 境内虚拟货币交易炒作明确不受合法保护，易归零、平台易跑路（见第 6 章第 5 条）。", "亏损死扛不审视、盈利秒卖 —— 这就是处置效应，散户系统性地砍掉最好的仓位、抱着最差的（见第三章第 1 条）。", "不分散、不配置、不看费用 —— 费用是少数可预测的收益变量，1.5% 与 0.15% 费率 20 年可差约 22%（见第二章、第四章、第 21 章）。", "每天盯盘、情绪化操作 —— 看得越多越容易在高点买低点卖，DALBAR 显示投资者连续多年跑输指数（见第三章、第四章第 3 条）。", "借钱／套信用卡／消费贷去投资 —— 信用卡分期年化约 13.8%，消费贷成本远高于权益长期回报，利息先吃掉你（见第 2 章、第 12 章）。", "把结构性存款当高息存款 —— 复杂结构化产品读不懂第 7 层嵌套就默认不买（见第一章第 8 条）。", "把年金保险当高收益理财买（不算 IRR） —— 预定利率仅 2.5%–3.0%，要用 IRR 算真实回报而非看演示利率（见第 14 章）。", "把\"拉人头返利\"当投资 —— 传销式拉下线本质是庞氏，崩盘后本金自行承担（见第 6 章第 3、11 条）。", "在来源不明 APP 里充值\"投资\" —— 虚假平台／虚拟盘对赌，钱进去就出不来（见第 6 章第 9、13、15 条）。", "把账户交给无资质个人\"代客理财保底\" —— 承诺保底本身违法，代客理财跑路无保障（见第一章第 13 条、第 6 章）。", "用\"可解释测试\"答不上来的东西也买 —— 写不清\"钱从谁口袋来、我比市场多知道什么\"的，就是赌（见第一章第 1、9 条）。"]}]};</script>
<script>
(function(){
  var D = window.BOOK_DATA || {chapters:[],entries:[],lists:[]};
  var byId={}; D.entries.forEach(function(e){byId[e.chapter+'-'+e.num]=e;});
  var ev='all', zero=false;
  var fM='all', fT='all', fW='all', fB='all', sec='all';
  var q='';

  var secSel=document.getElementById('sec');
  D.chapters.forEach(function(c){
    var o=document.createElement('option');
    o.value=c.num; o.textContent='第'+c.num+'章·'+c.title.replace(/^[^、]+、/,'');
    secSel.appendChild(o);
  });

  var g={A:0,B:0,C:0}; var tz=0;
  D.entries.forEach(function(e){g[e.grade]=(g[e.grade]||0)+1; if(e.three_zero)tz++;});
  document.getElementById('badges').innerHTML =
    '<span>'+D.entries.length+' 条条目</span>'+
    '<span>'+D.chapters.length+' 章</span>'+
    '<span>A级 '+g.A+'</span><span>B级 '+g.B+'</span><span>C级 '+g.C+'</span>'+
    '<span>三零 '+tz+'</span>'+
    '<span>更新 '+D.updated+'</span>'+
    '<span>许可 CC BY 4.0</span>';

  function esc(s){return (s||'').replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;');}
  function linkify(s){
    return esc(s).replace(/第(\d+)章第(\d+)条/g,
      '<a class="ref" data-c="$1" data-n="$2">第$1章第$2条</a>');
  }
  function chip(label,val){
    var cls = (val==='0'||val==='否') ? 'cost no' : (val==='多'?'cost big':'cost');
    return '<span class="'+cls+'">'+label+'·'+esc(val)+'</span>';
  }

  function pass(e){
    if(ev!=='all' && e.grade!==ev) return false;
    if(zero && !e.three_zero) return false;
    if(fM!=='all' && e.cost_money!==fM) return false;
    if(fT!=='all' && e.cost_time!==fT) return false;
    if(fW!=='all' && e.cost_will!==fW) return false;
    if(fB!=='all' && e.benefit!==fB) return false;
    if(sec!=='all' && String(e.chapter)!==String(sec)) return false;
    if(q){
      var hay=(e.title+e.cost+e.gain+e.source+e.plain+e.note+e.impact).toLowerCase();
      if(hay.indexOf(q)<0) return false;
    }
    return true;
  }

  function card(e){
    var tags='<span class="tag t'+e.grade+'">证据 '+e.grade+'</span>'+
      chip('花钱',e.cost_money)+chip('时间',e.cost_time)+chip('毅力',e.cost_will)+
      '<span class="imp">收益·'+esc(e.benefit)+'</span>';
    if(e.impact) tags+='<span class="imp">影响：'+esc(e.impact)+'</span>';
    if(e.three_zero) tags+='<span class="cz">三零</span>';
    var note = e.note ? '<div class="note"><b>备注：</b>'+linkify(e.note)+'</div>' : '';
    return '<div class="card" id="e-'+e.chapter+'-'+e.num+'">'+
      '<div class="head"><span class="id">第 '+e.chapter+' 章第 '+e.num+' 条</span>'+
        '<h3>'+esc(e.title)+'</h3>'+tags+'</div>'+
      '<div class="row"><span class="k">成本</span><span>'+linkify(e.cost)+'</span></div>'+
      '<div class="plain"><b>说人话：</b>'+linkify(e.plain)+'</div>'+
      '<div class="row"><span class="k">收益</span><span>'+linkify(e.gain)+'</span></div>'+
      '<div class="row"><span class="k">来源</span><span>'+esc(e.source)+'</span></div>'+
      note+
      '<span class="copy" data-c="'+e.chapter+'" data-n="'+e.num+'">📋 复制引用</span></div>';
  }

  function render(){
    var out=document.getElementById('out');
    var html=''; var shown=0;
    D.chapters.forEach(function(c){
      if(sec!=='all' && String(c.num)!==String(sec)) return;
      var cname='第 '+c.num+' 章 · '+esc(c.title.replace(/^[^、]+、/,''));
      if(c.type==='list'){
        var lst=D.lists.filter(function(l){return l.chapter===c.num;})[0];
        if(!lst) return;
        var items=lst.items.filter(function(it){
          if(q){return it.toLowerCase().indexOf(q)>=0;} return true;
        });
        if(!items.length) return;
        shown+=items.length;
        html+='<h2 class="ch-head">'+cname+'</h2>'+
          '<p class="ch-sub">直接不做的动作（性价比为负），出现一个划掉一个。</p>'+
          '<ul class="neglist">'+items.map(function(it){return '<li>❌ '+esc(it)+'</li>';}).join('')+'</ul>';
        return;
      }
      var es=D.entries.filter(function(e){return e.chapter===c.num;});
      var vis=es.filter(pass);
      if(!vis.length) return;
      shown+=vis.length;
      var intro = (c.intro&&c.intro.length) ? '<p class="ch-sub">'+esc(c.intro.join(' '))+'</p>' : '';
      html+='<h2 class="ch-head">'+cname+'</h2>'+intro+
        '<p class="ch-sub">本章 '+es.length+' 条，显示 '+vis.length+' 条。</p>'+
        vis.map(card).join('');
    });
    if(!shown) html='<div class="empty">没有匹配条目，试着放宽筛选条件。</div>';
    out.innerHTML=html;
    document.getElementById('stat').textContent=
      '显示 '+shown+' / '+D.entries.length+' 条 ｜ 当前筛选：'+
      (ev==='all'?'证据全部':('证据'+ev))+
      (zero?' ＋三零':'')+
      (fM!=='all'?' ＋花钱'+fM:'')+(fT!=='all'?' ＋时间'+fT:'')+(fW!=='all'?' ＋毅力'+fW:'')+
      (fB!=='all'?' ＋收益'+fB:'')+
      (sec!=='all'?' ＋第'+sec+'章':'');
  }

  document.getElementById('q').addEventListener('input',function(){q=this.value.trim().toLowerCase();render();});
  document.querySelectorAll('.btn.ev').forEach(function(b){
    b.addEventListener('click',function(){
      document.querySelectorAll('.btn.ev').forEach(function(x){x.classList.remove('on');});
      b.classList.add('on'); ev=b.dataset.ev; render();
    });
  });
  document.getElementById('zeroBtn').addEventListener('click',function(){
    zero=!zero; this.classList.toggle('on',zero); render();
  });
  ['fM','fT','fW','fB'].forEach(function(id){
    document.getElementById(id).addEventListener('change',function(){
      if(id==='fM')fM=this.value; if(id==='fT')fT=this.value;
      if(id==='fW')fW=this.value; if(id==='fB')fB=this.value; render();
    });
  });
  secSel.addEventListener('change',function(){sec=this.value;render();});

  document.getElementById('randBtn').addEventListener('click',function(){
    if(!D.entries.length) return;
    q=''; document.getElementById('q').value='';
    ev='all'; zero=false; sec='all'; fM='all'; fT='all'; fW='all'; fB='all';
    document.querySelectorAll('.btn.ev').forEach(function(x){x.classList.remove('on');});
    document.querySelector('.btn.ev[data-ev="all"]').classList.add('on');
    document.getElementById('zeroBtn').classList.remove('on');
    ['fM','fT','fW','fB'].forEach(function(id){document.getElementById(id).value='all';});
    document.getElementById('sec').value='all';
    render();
    var e=D.entries[Math.floor(Math.random()*D.entries.length)];
    var el=document.getElementById('e-'+e.chapter+'-'+e.num);
    if(el){el.scrollIntoView({behavior:'smooth',block:'center'});
      el.classList.add('flash'); setTimeout(function(){el.classList.remove('flash');},1600);}
  });

  function toast(msg){
    var t=document.getElementById('toast'); t.textContent=msg; t.classList.add('show');
    setTimeout(function(){t.classList.remove('show');},1400);
  }
  document.getElementById('out').addEventListener('click',function(ev3){
    var a=ev3.target.closest&&ev3.target.closest('.copy');
    if(!a) return;
    var e=byId[a.dataset.c+'-'+a.dataset.n]; if(!e) return;
    var txt='《高性价比投资指南》第'+e.chapter+'章第'+e.num+'条「'+e.title+'」\n'+
      '成本：'+e.cost+'\n收益：'+e.gain+'\n证据等级：'+e.grade+'\n来源：'+e.source;
    if(navigator.clipboard&&navigator.clipboard.writeText){
      navigator.clipboard.writeText(txt).then(function(){toast('已复制引用 ✓');},
        function(){toast('复制失败，请手动选择');});
    } else { toast('当前环境不支持自动复制'); }
  });

  document.getElementById('out').addEventListener('click',function(ev2){
    var a=ev2.target.closest&&ev2.target.closest('a.ref');
    if(!a) return;
    var id='e-'+a.dataset.c+'-'+a.dataset.n;
    var el=document.getElementById(id);
    if(el){el.scrollIntoView({behavior:'smooth',block:'center'});
      el.classList.add('flash'); setTimeout(function(){el.classList.remove('flash');},1600);}
  });

  document.getElementById('foot').innerHTML=
    '本《高性价比投资指南》为方法论手册，非投资建议，不构成对任何金融产品或策略的推荐。市场有风险，决策需独立判断并咨询持牌专业人士。'+
    '所有引用以各机构最新官方发布为准。本指南模仿《高性价比人生指南》(eternity4719/HowToLiveBetter) 的“成本-收益-证据等级”框架创作，向其致敬。';

  render();
})();
</script>
</body>
</html>
