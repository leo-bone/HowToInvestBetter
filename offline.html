": "自己", "cost_money": "0", "cost_time": "少", "cost_will": "否", "benefit": "中", "scope": "金钱", "three_zero": false, "cost": "对\"免费荐股 / 免费带单 / 免费课\"的戒心。", "plain": "天上不会掉免费且靠谱的致富信息。对方不收你钱，是因为你本身就是他的产品——要么你被引流去接盘，要么被卖课、被开户返佣。先想他赚谁的钱，再决定听不听。", "gain": "\"免费\"是诈骗与违规荐股最常用的诱饵。证监会厦门监管局披露，2023 年以来金某犇等人未获证券业务资质，以销售人参酒、人参粉等商品为掩护变相提供非法证券投资咨询，涉案交易金额 3000 余万元，7 名嫌疑人已被移送起诉；江苏证监局披露的蒙某团伙注册\"文化传媒公司\"、冒充证券公司员工以推荐股票为名把投资者拉进诈骗群，造成多名投资者被以投资理财为名骗取 65 万余元。公安部数据更显示，2023 年全国破获电信网络诈骗 43.7 万起、拦截资金 3288 亿元。\"免费带单\"本质是流量生意：你以为占便宜，其实你是被售卖的标的。把它当成广告而非善意，能过滤掉绝大多数噪音。", "source": "中国证券监督管理委员会 厦门监管局 (2024). 关于防范非法证券期货基金活动的风险提示（案例：金某犇等未经核准通过直播间变相提供非法证券投资咨询，涉案 3000 余万元）. <https://www.csrc.gov.cn/xiamen/c105637/c7550231/content.shtml>; 中国证券监督管理委员会 江苏监管局 (2024). 非法经营证券、期货业务犯罪典型案例解读(四)（蒙某团伙假冒证券公司员工引流，致投资者被骗 65 万余元）. <https://www.csrc.gov.cn/jiangsu/c105410/c7582277/content.shtml>; 中华人民共和国公安部 (2024). 通报2023年公安工作和队伍建设成效（全国破获电信网络诈骗 43.7 万起）. <https://www.mps.gov.cn/n2254536/n2254544/n2254552/n9372690/n9372708/c9373270/content.html>", "note": "本条目讲\"动机识别\"这一定位原则，具体定罪以司法机关认定为准；非法荐股常披着\"知识付费\"\"社群\"外衣，需结合资质查询（证监会、证券业协会官网）判断。"}, {"chapter": 16, "num": 2, "id": "16-2", "title": "谁在给你建议，他赚谁的钱", "grade": "A", "tags": {"钱": "0", "时间": "少", "毅力": "否", "收益": "中", "口径": "金钱", "影响": "自己"}, "impact": "自己", "cost_money": "0", "cost_time": "少", "cost_will": "否", "benefit": "中", "scope": "金钱", "three_zero": false, "cost": "轻信权威光环的本能。", "plain": "别问\"他说得对不对\"，先问\"他靠这个赚谁的钱\"。利益一致的才值得听，利益对立的自动打折。", "gain": "把每条建议重写成\"这条建议让谁受益\"，你会发现绝大多数\"为你好\"的话术背后都有对价。卖方研究员靠分仓佣金、财经大V靠流量与带货、银行理财师靠产品返点、投顾靠服务费，他们的利益和你并不天然一致。证监会《证券投资顾问业务暂行规定》（证监会公告〔2020〕66号）第十九条明确禁止投顾\"以任何方式向客户承诺或者保证投资收益\"，第二十四条禁止对服务能力和过往业绩作\"虚假、不实、误导性宣传\"——监管之所以要明文禁止，正说明\"利益错位 + 夸大宣传\"是行业常态。先定位对方的收费模式（佣金、返佣、卖课、流量、接盘），再决定这条信息值几分信任。", "source": "中国证券监督管理委员会 (2020). 《证券投资顾问业务暂行规定》（证监会公告〔2020〕66号）第十九条、第二十四条. <https://www.csrc.gov.cn/hunan/c105691/c1294474/content.shtml>; 中国证券监督管理委员会 山西监管局 (2024). 3·15投资者保护专题教育活动案例一：证券投资咨询机构夸大宣传（《证券、期货投资咨询管理暂行办法》第二十四条）. <https://www.csrc.gov.cn/shanxi/c1055543/c1609430/content.shtml>", "note": "识别利益是\"相关性 ≠ 因果\"的第一步；对方有资质不代表结论对你有利，仍须独立判断。交叉见条 12。"}, {"chapter": 16, "num": 3, "id": "16-3", "title": "基金经理的过往业绩，不预示未来", "grade": "A", "tags": {"钱": "0", "时间": "少", "毅力": "否", "收益": "中", "口径": "金钱", "影响": "自己"}, "impact": "自己", "cost_money": "0", "cost_time": "少", "cost_will": "否", "benefit": "中", "scope": "金钱", "three_zero": false, "cost": "追\"去年冠军基\"的冲动。", "plain": "去年涨得最好的基金，今年往往不行。业绩榜是\"回放\"不是\"预告\"。真要看，看长期、看风格、看费率，别看排名。", "gain": "标普 SPIVA（S&P Indices Versus Active）半年度记分卡是这一结论最硬的证据：以美国市场为例，被动指数长期压倒主动管理，且时间越长跑输比例越高——据 SPIVA 数据，1 年、3 年、5 年、15 年期跑输基准的大型主动基金比例分别约 61%、80%、87%、92%（S&P Dow Jones Indices, 2023）。Carhart（1997）用\"动量三因子\"证明基金业绩持续性极弱，当年的王者次年大概率回归平庸甚至落后。追涨明星基金，本质是买过去、赌未来，还往往在高点接盘、付出更高费率。看长期几何平均、看风格是否漂移、看费率，比看年度排名有用得多。", "source": "S&P Dow Jones Indices (2023). SPIVA U.S. Scorecard (Mid-Year 2023)（主动管理基金长期跑输基准）. <https://www.spglobal.com/spdji/en/research-insights/spiva/>; Carhart, M. (1997). On Persistence in Mutual Fund Performance, Journal of Finance 52(1). <https://doi.org/10.2307/2329556>", "note": "SPIVA 针对美国共同基金，A 股主动管理相对指数仍有结构性差异，但\"业绩不可外推、警惕幸存者偏差\"的结论普适。交叉见条 4。"}, {"chapter": 16, "num": 4, "id": "16-4", "title": "财经大V的幸存者偏差", "grade": "A", "tags": {"钱": "0", "时间": "少", "毅力": "否", "收益": "中", "口径": "金钱", "影响": "自己"}, "impact": "自己", "cost_money": "0", "cost_time": "少", "cost_will": "否", "benefit": "中", "scope": "金钱", "three_zero": false, "cost": "对\"他每次都对\"的迷信。", "plain": "你刷到的\"神预测\"博主，只是运气好没被淹死的那个。沉默的大多数喊错了就删帖，你看不见。", "gain": "算法只推送\"看起来对\"的内容，于是你系统性高估他人的预测能力，这叫幸存者偏差。在骗局层面它更致命：最高法 2024 年 2 月 7 日发布的跨境电诈典型案例中，曾某等 67 人伪装\"高富帅\"通过社交软件交友、诱导至虚假平台，诈骗 196 人、2796 万余元；高某案以\"杀猪盘\"手段诈骗 17 余万美元，想逃离时被限制人身自由、殴打，交\"赎金\"才回国。美国 FTC 同年记录\"恋爱 / 投资\"骗局 6.4 万起、损失 11.4 亿美元、单人损失中位数 2000 美元——其中约 18%（2022 年）的套路是\"朋友在投资上发了财、带你一起赚\"。你看到的大V\"战绩\"，和这些被包装的\"成功案例\"是同一种筛选机制：错的消失，对的被放大。", "source": "最高人民法院 (2024). 跨境电信网络诈骗及其关联犯罪典型案例（被告人曾某、钟某华、王某等67人诈骗案：伪装\"高富帅\"社交软件交友诱导虚假平台，诈骗196人2796万余元；被告人高某诈骗案：\"杀猪盘\"诈骗17余万美元）. <https://www.court.gov.cn/zixun/xiangqing/425102.html>; 美国联邦贸易委员会 FTC (2024). \"Love Stinks\" – when a scammer is involved（2023年恋爱骗局6.4万起、损失11.4亿美元、单人中位数2000美元）. <https://www.ftc.gov/business-guidance/blog/2024/02/love-stinks-when-scammer-involved>", "note": "幸存者偏差不否定所有大V，但提醒你\"他晒的 ≠ 他真实的、长期的、可复制的\"。交叉见条 2、12。"}, {"chapter": 16, "num": 5, "id": "16-5", "title": "媒体头条制造焦虑，但不制造 alpha", "grade": "B", "tags": {"钱": "0", "时间": "少", "毅力": "些", "收益": "中", "口径": "金钱", "影响": "自己"}, "impact": "自己", "cost_money": "0", "cost_time": "少", "cost_will": "些", "benefit": "中", "scope": "金钱", "three_zero": false, "cost": "被新闻牵着交易的手。", "plain": "头条越吓人越想操作，但吓你的消息市场早就知道了。盯着新闻做交易，长期稳定亏。", "gain": "新闻天生偏好负面与极端（注意力经济），而市场已大概率 price in 已知信息。公安部 2024 年通报，2023 年全国破获电信网络诈骗 43.7 万起，自 2023 年 8 月以来发案数连续下降，国家反诈中心累计下发资金预警指令 940 万条、见面劝阻 1389 万人次、拦截诈骗电话 27.5 亿次、短信 22.8 亿条、处置涉诈域名网址 836.4 万个、紧急拦截涉案资金 3288 亿元——这串数字本身说明，\"诈骗 / 崩盘\"类标题从不等于你该立刻买卖。据头条情绪买卖，等于用最贵的情绪买最旧的消息；真正影响价格的，是预期差而非 headline。把新闻当\"背景资料\"而非\"交易指令\"，能显著降低追涨杀跌的频率与成本。", "source": "中华人民共和国公安部 (2024). 通报2023年公安工作和队伍建设成效（全国破获电信网络诈骗 43.7 万起、紧急拦截涉案资金 3288 亿元）. <https://www.mps.gov.cn/n2254536/n2254544/n2254552/n9372690/n9372708/c9373270/content.html>; 最高人民法院 (2024). 跨境电信网络诈骗及其关联犯罪典型案例（虚假网络投资理财类诈骗占造成损失金额约三分之一）. <https://www.court.gov.cn/zixun/xiangqing/425102.html>", "note": "证据等级 B：公安部数据为硬事实，但\"新闻 → 情绪 → 亏损\"的机制属行为金融推断，需结合个人回测验证。交叉见条 9、10。"}, {"chapter": 16, "num": 6, "id": "16-6", "title": "研报看结论，也要看屁股坐在哪", "grade": "A", "tags": {"钱": "0", "时间": "少", "毅力": "些", "收益": "中", "口径": "金钱", "影响": "自己"}, "impact": "自己", "cost_money": "0", "cost_time": "少", "cost_will": "些", "benefit": "中", "scope": "金钱", "three_zero": false, "cost": "把卖方\"买入\"评级当圣旨。", "plain": "全市场 90% 都是\"买入\"评级，那评级本身就没什么信息量。研报当资料库用，结论自己判断。", "gain": "卖方研究与投行承销、分仓佣金高度绑定，\"买入\"评级占比长期畸高、中性 / 卖出极少，评级分布本身已说明问题。证监会《证券投资顾问业务暂行规定》（证监会公告〔2020〕66号）第十九条禁止\"承诺或保证投资收益\"，《证券、期货投资咨询管理暂行办法》第二十四条禁止\"向投资人承诺证券、期货投资收益\"、禁止虚假不实宣传——监管反复发文，正是因为\"看多倾向 + 夸大过往业绩\"是行业痼疾。正确用法：把研报当\"数据、框架、产业链信息\"的资料库，学习它的分析路径，但结论与买卖决策自己下。尤其警惕\"无风险提示、晒盈利记录、承诺收益\"的\"投顾服务\"，这已踩到违规红线。", "source": "中国证券监督管理委员会 (2020). 《证券投资顾问业务暂行规定》（证监会公告〔2020〕66号）第十九条、第二十四条. <https://www.csrc.gov.cn/hunan/c105691/c1294474/content.shtml>; 中国证券监督管理委员会 山西监管局 (2024). 3·15投资者保护专题教育活动案例一：证券投资咨询机构夸大宣传（《证券、期货投资咨询管理暂行办法》第二十四条）. <https://www.csrc.gov.cn/shanxi/c1055543/c1609430/content.shtml>", "note": "评级偏差在 A 股、美股均存在；买方独立研究价值正在于与卖方的利益隔离。交叉见条 2、11。"}, {"chapter": 16, "num": 7, "id": "16-7", "title": "回测漂亮的策略，实盘常崩", "grade": "A", "tags": {"钱": "少", "时间": "少", "毅力": "些", "收益": "中", "口径": "金钱", "影响": "自己"}, "impact": "自己", "cost_money": "少", "cost_time": "少", "cost_will": "些", "benefit": "中", "scope": "金钱", "three_zero": false, "cost": "迷信\"年化 30%、回撤 5%\"的策略书。", "plain": "凡是把历史曲线做得特别漂亮的\"圣杯策略\"，多半是把过去的数据调到刚好贴合。真金要看来未知的实盘。", "gain": "过度拟合让策略在历史上完美、在未来失效。Bailey & López de Prado（2014）提出\"Deflated Sharpe Ratio（DSR， deflation 夏普比率）\"，证明在海量参数组合里挑出的最优回测，其高夏普比率很大程度来自\"试了太多次\"的选择偏差；他们进一步用\"组合对称交叉验证（CSCV）\"估算\"回测过拟合概率（PBO）\"，指出多数被 optimizer 搜出的\"圣杯\"样本外会崩。实务中，调参数直到曲线好看等于作弊：一个夏普 1.5 的策略若是从 100 个候选里挑出的最佳，真实边缘可能微乎其微。鉴别要点：样本外 / 滚动验证、参数是否敏感、是否有经济逻辑、是否披露了试错次数。亮眼回测 ≠ 可复制收益。", "source": "Bailey, D. H., & López de Prado, M. (2014). The Deflated Sharpe Ratio: Correcting for Selection Bias, Backtest Overfitting and Non-Normality, Journal of Portfolio Management 40(5), 94–107. <https://papers.ssrn.com/sol3/papers.cfm?abstract_id=2460551>; Bailey, D. H., Borwein, J., López de Prado, M., & Zhu, Q. J. (2015). The Probability of Backtest Overfitting, Journal of Computational Finance. <https://papers.ssrn.com/sol3/papers.cfm?abstract_id=2326253>", "note": "证据等级 A：方法学有严格数学证明；但具体到\"某个策略\"仍需实盘检验。个人开发者尤须警惕\"自己骗自己\"。"}, {"chapter": 16, "num": 8, "id": "16-8", "title": "用\"我有没有反向证据\"代替\"我是不是对的\"", "grade": "B", "tags": {"钱": "0", "时间": "少", "毅力": "中", "收益": "中", "口径": "金钱", "影响": "自己"}, "impact": "自己", "cost_money": "0", "cost_time": "少", "cost_will": "中", "benefit": "中", "scope": "金钱", "three_zero": false, "cost": "为已有观点找佐证的惯性。", "plain": "别总在证明自己对，那太容易了。逼自己找\"我可能错了\"的证据，找不到再说\"我大概率对\"——这才值钱。", "gain": "确认偏误（confirmation bias）是人类最普遍、最贵的认知陷阱：我们天然只搜支持自己观点的信息，对反例视而不见，于是在错误方向上越走越深。Nickerson（1998）的综述指出，确认偏误\"以多种面目无处不在\"，从科学实验到日常决策都在系统性扭曲判断。在投资里，它表现为：涨了就找利好、跌了就找利空，永远自我印证。性价比最高的认知升级，是强制自己问\"如果我是错的，证据会在哪、会是什么样\"，并主动去搜寻与你持仓相反的研究、数据、案例。证监会山西局公布的案例中，投资者就是被\"稳赚不亏、平均收益 35%\"的宣传锚定，从未去找\"亏了怎么办\"的反向证据，最终缴纳万余元服务费后大幅亏损。先证伪、再置信。", "source": "Nickerson, R. S. (1998). Confirmation Bias: A Ubiquitous Phenomenon in Many Guises, Review of General Psychology 2(2), 175–220. <https://doi.org/10.1037/1089-2680.2.2.175>; 中国证券监督管理委员会 山西监管局 (2024). 3·15投资者保护专题教育活动案例一（投资者因轻信\"稳赚不亏\"宣传缴纳服务费后大幅亏损）. <https://www.csrc.gov.cn/shanxi/c1055543/c1609430/content.shtml>", "note": "证据等级 B：确认偏误本身有强实证基础（心理学 A 级），但\"用反向证据降低踩坑率\"属可操作方法论，效果因人而异，需配合记录与复盘。"}, {"chapter": 16, "num": 9, "id": "16-9", "title": "小道消息到你耳朵时，已经 price in", "grade": "B", "tags": {"钱": "0", "时间": "0", "毅力": "否", "收益": "中", "口径": "金钱", "影响": "自己"}, "impact": "自己", "cost_money": "0", "cost_time": "0", "cost_will": "否", "benefit": "中", "scope": "金钱", "three_zero": true, "cost": "根据\"内部消息\"下注的幻想。", "plain": "群里\"稳赚\"的消息，传到你这层已经不知道几手了。真有肉，轮不到你。靠消息炒股，长期是给先手送钱。", "gain": "真有信息优势的人，自己悄悄赚完就撤了；等消息传到群里、饭局、短视频评论区，市场早把那点预期消化殆尽，你接的往往是最后一棒。公安部 2024 年通报，2023 年拦截诈骗电话 27.5 亿次、短信 22.8 亿条、处置涉诈域名网址 836.4 万个——其中相当比例是\"内部票\"\"老师带单\"\"私募通道\"之类的引流话术。证监会厦门局披露的金某犇案，正是以直播间卖货为幌子变相荐股、涉案 3000 余万元，投资者听到的\"代码\"本质上就是被用来抬轿的引流工具。半强式有效市场下，公开可得的消息早已反映于价格；你以为的\"内幕\"，大概率是别人精心投喂的诱饵。", "source": "中国证券监督管理委员会 厦门监管局 (2024). 关于防范非法证券期货基金活动的风险提示（案例：金某犇直播间变相荐股，涉案 3000 余万元，投资者接到\"内部消息\"往往已是末棒）. <https://www.csrc.gov.cn/xiamen/c105637/c7550231/content.shtml>; 中华人民共和国公安部 (2024). 通报2023年公安工作和队伍建设成效（拦截诈骗电话 27.5 亿次、短信 22.8 亿条、处置涉诈域名网址 836.4 万个）. <https://www.mps.gov.cn/n2254536/n2254544/n2254552/n9372690/n9372708/c9373270/content.html>", "note": "证据等级 B：有效市场假说有争议，但\"消息层层衰减、末棒接盘\"在骗局与坐庄中是被反复验证的事实。交叉见条 1、12。"}, {"chapter": 16, "num": 10, "id": "16-10", "title": "订阅越少越好，信息过载是隐性成本", "grade": "B", "tags": {"钱": "少", "时间": "中", "毅力": "中", "收益": "中", "口径": "金钱", "影响": "自己"}, "impact": "自己", "cost_money": "少", "cost_time": "中", "cost_will": "中", "benefit": "中", "scope": "金钱", "three_zero": false, "cost": "减少信息源、关掉推送的克制。", "plain": "你亏钱很多时候是因为\"看太多了\"。关掉推送、少看群，反而更赚。信息不是越多越好。", "gain": "信息越多，交易冲动与过度自信越强，决策质量反而下降——这是注意力经济学与行为金融的共同结论。骗局恰好利用这一点：非法咨询通过微信、QQ、直播间、短视频、荐股群多渠道高频触达，公安部 2023 年拦截诈骗短信 22.8 亿条、处置涉诈域名网址 836.4 万个，说明\"信息洪流\"里混着大量定向投喂。固定几个权威源（交易所、证监会、上市公司年报、指数公司官网），其余默认屏蔽；关掉行情推送、退掉喊单群，把\"看盘时间\"换成\"读财报时间\"。少而精的信息源，比全天候刷屏更能保住你的本金与情绪。", "source": "中国证券监督管理委员会 厦门监管局 (2024). 关于防范非法证券期货基金活动的风险提示（非法咨询通过微信、QQ、直播间、短视频等多渠道高频触达，信息过载放大误判）. <https://www.csrc.gov.cn/xiamen/c105637/c7550231/content.shtml>; 中华人民共和国公安部 (2024). 通报2023年公安工作和队伍建设成效（处置涉诈域名网址 836.4 万个、拦截诈骗短信 22.8 亿条）. <https://www.mps.gov.cn/n2254536/n2254544/n2254552/n9372690/n9372708/c9373270/content.html>", "note": "证据等级 B：信息过载损害决策有实验支持，但\"最优订阅数\"因人而异；核心是主动筛选而非被动淹没。交叉见条 5、11。"}, {"chapter": 16, "num": 11, "id": "16-11", "title": "学会计看三张表，比听人荐股靠谱", "grade": "B", "tags": {"钱": "少", "时间": "中", "毅力": "中", "收益": "中", "口径": "金钱", "影响": "自己"}, "impact": "自己", "cost_money": "少", "cost_time": "中", "cost_will": "中", "benefit": "中", "scope": "金钱", "three_zero": false, "cost": "学财务基础的时间。", "plain": "别人给你\"利好\"，你能翻开财报自己看赚不赚钱、钱从哪来，就不会被话术牵着走。这是最硬的自保技能。", "gain": "能自己读利润表 / 资产负债表 / 现金流量表，你就有了过滤噪音的底层能力，不再依赖别人的\"解读\"。证监会山西局案例中，投资者李某轻信\"普通的客户也有*%收益\"\"一两个月收益*\"等宣传，缴 1 万余元服务费买荐股，结果大幅亏损——若具备基本财务素养，本应能识别\"无风险提示、承诺收益\"的违规信号（《证券投资顾问业务暂行规定》第二十四条）。财报能力是一次性投入、长期复利的护城河：它让你在别人喊\"利好\"时核对经营性现金流是否真为正、在别人喊\"困境反转\"时看清负债结构。把\"听懂话术\"升级为\"看懂报表\"，是你与收割者之间最实在的壁垒。", "source": "中国证券监督管理委员会 山西监管局 (2024). 3·15投资者保护专题教育活动案例一：证券投资咨询机构夸大宣传（投资决策风险由投资者自行承担，读懂基本面是底线能力）. <https://www.csrc.gov.cn/shanxi/c1055543/c1609430/content.shtml>; 中国证券监督管理委员会 (2020). 《证券投资顾问业务暂行规定》（证监会公告〔2020〕66号）第二十四条. <https://www.csrc.gov.cn/hunan/c105691/c1294474/content.shtml>", "note": "证据等级 B：财务素养与投资决策质量正相关有研究支持，但读得懂报表 ≠ 能战胜市场，它防的是\"被忽悠\"而非保证超额收益。交叉见条 6、8。"}, {"chapter": 16, "num": 12, "id": "16-12", "title": "把每句\"推荐\"翻译成\"他在赚什么\"", "grade": "A", "tags": {"钱": "0", "时间": "少", "毅力": "些", "收益": "中", "口径": "金钱", "影响": "自己"}, "impact": "自己", "cost_money": "0", "cost_time": "少", "cost_will": "些", "benefit": "中", "scope": "金钱", "three_zero": false, "cost": "一句思维习惯的切换。", "plain": "这是一条万能滤网。任何\"为你好\"的理财建议，先翻译成\"他赚谁的钱\"。翻译完，该信的不用劝，不该信的也不用烦。", "gain": "荐股群、直播间、理财课、银行推销、冒充\"券商员工\"的引流——统一套用\"他靠这条建议赚谁的钱\"模型，90% 的推销会自动现形。证监会江苏局披露的蒙某团伙，注册\"文化传媒公司\"、冒充证券公司员工以推荐股票为名把投资者拉进诈骗 QQ 群，造成投资者被以投资理财为名骗取 65 万余元；最高法 2024 年典型案例中曾某等 67 人伪装\"高富帅\"交友诱导虚假投资平台，诈骗 2796 万余元；美国 FTC 记录 2023 年\"恋爱 + 投资\"骗局损失 11.4 亿美元。把\"老师带单\"翻译成\"他赚我的服务费 / 接盘 / 人头费\"，把\"内部消息\"翻译成\"我是末棒接盘侠\"，判断力立刻升级。这一条是本章的总开关。", "source": "中国证券监督管理委员会 江苏监管局 (2024). 非法经营证券、期货业务犯罪典型案例解读(四)（蒙某团伙假冒证券公司员工以推荐股票为名引流，致投资者被骗 65 万余元）. <https://www.csrc.gov.cn/jiangsu/c105410/c7582277/content.shtml>; 最高人民法院 (2024). 跨境电信网络诈骗及其关联犯罪典型案例（被告人曾某、钟某华、王某等67人诈骗案：伪装\"高富帅\"交友诱导投资诈骗 2796 万余元）. <https://www.court.gov.cn/zixun/xiangqing/425102.html>; 美国联邦贸易委员会 FTC (2024). \"Love Stinks\"（2023年恋爱/投资骗局损失 11.4 亿美元）. <https://www.ftc.gov/business-guidance/blog/2024/02/love-stinks-when-scammer-involved>", "note": "本条目是条 1、2 的集成与总纲；它不是要你偏执地怀疑一切，而是建立\"利益—可信度\"的自动映射。交叉见条 1、2、9。"}, {"chapter": 17, "num": 1, "id": "17-1", "title": "利率是资产价格的引力", "grade": "A", "tags": {"钱": "0", "时间": "少", "毅力": "否", "收益": "中", "口径": "金钱", "影响": "自己"}, "impact": "自己", "cost_money": "0", "cost_time": "少", "cost_will": "否", "benefit": "中", "scope": "金钱", "three_zero": false, "cost": "理解一两页折现模型与久期概念的时间（几乎为零成本，但多数散户从没想过）。", "plain": "利率就像资产的引力。加息=引力变大，价格往下掉；降息=引力变小，价格往上飘。别只盯消息，看利率方向。", "gain": "几乎所有资产的价值都来自对未来现金流的折现，而利率处在分母位置。当美联储在2022年把联邦基金目标利率从0–0.25%累计加息425个基点至4.25%–4.5%时，美国10年期国债收益率从约1.5%飙到4.2%、2年期从0.75%冲到4.3%，债券价格因此重挫——彭博美国综合债券指数全年下跌13.0%，创下1976年有记录以来最差年度。股票、房产同理承压，因为贴现率上行压低了任何长久期资产的现值。这是理解\"为什么加息市场跌\"的底层逻辑，也是你判断持有资产期限（久期）风险的起点。", "source": "美联储 (2022). 联邦基金利率目标区间上调与国债收益率变动（10Y 1.5%→4.2%，2Y 0.75%→4.3%）. <https://finance.yahoo.com/news/why-ordinary-investors-got-hit-so-hard-in-2022-morning-brief-110004332.html>; Winthrop Wealth (2022). 2022 Market Review and Outlook（Bloomberg US Aggregate Bond Index -13.0%）. <https://winthropwealth.com/commentary/2022-market-review-and-outlook/>", "note": "证据A级——利率与价格反向是资产定价公理，且有2022年完整实测对照。定级理由：债券价格与收益率反向由久期公式决定，非经验相关。局限性：久期越长对利率越敏感，短债影响小。交叉引用：条目7（加息末端债券企稳）、条目3（通胀与长债）。"}, {"chapter": 17, "num": 2, "id": "17-2", "title": "收益率曲线倒挂预示衰退，但不是闹钟", "grade": "A", "tags": {"钱": "0", "时间": "少", "毅力": "否", "收益": "中", "口径": "金钱", "影响": "自己"}, "impact": "自己", "cost_money": "0", "cost_time": "少", "cost_will": "否", "benefit": "中", "scope": "金钱", "three_zero": false, "cost": "对\"倒挂就立刻崩\"的误读与据此贸然清仓的机会成本。", "plain": "短债利率高过长债（倒挂），历史上常是衰退前兆，但\"多久后、会不会来\"没人精确知道。当警报看，别当扳机用。", "gain": "纽约联储用10年期与3个月期国债利差（10Y-3M）构建的Probit模型，数据显示倒挂后未来12个月衰退概率显著上升；参数α=-0.5333、β=-0.6330，0基点利差约对应25%概率、-100bp约50%、-200bp约70%。但该模型亦坦言前兆记录并不均匀：1973–75、2001、2020衰退前它从未接近30%。2年期与10年期利差自1969年以来每次衰退前都曾倒挂，但领先时间6–24个月不等，且2022年的深度倒挂直到2026年初仍未兑现NBER定义的衰退。它是有用的预警仪表盘，不是定点闹钟。", "source": "Federal Reserve Bank of New York (持续更新). The Yield Curve as a Leading Indicator（10Y-3M期限利差衰退概率模型）. <https://www.newyorkfed.org/research/capital_markets/ycfaq.html>; Federal Reserve Bank of New York (2026). Probability of U.S. Recession Predicted by Treasury Spread（Prob_Rec.pdf，参数α=-0.5333, β=-0.6330）. <https://www.newyorkfed.org/medialibrary/media/research/capital_markets/Prob_Rec.pdf>; Estrella & Mishkin (1996). The Yield Curve as a Predictor of U.S. Recessions（Current Issues in Economics and Finance 2(7)）. <https://www.newyorkfed.org/medialibrary/media/research/current_issues/ci2-7.pdf>", "note": "证据A级——基于数十年统计与央行官方模型。定级理由：样本长、方法公开，但属概率预警而非确定性信号。局限性：领先期不稳定、存在误报（如2022）。交叉引用：条目6（衰退错杀）、条目12（预期差）。"}, {"chapter": 17, "num": 3, "id": "17-3", "title": "通胀高时，现金和长债都受伤", "grade": "A", "tags": {"钱": "0", "时间": "少", "毅力": "否", "收益": "中", "口径": "金钱", "影响": "自己"}, "impact": "自己", "cost_money": "0", "cost_time": "少", "cost_will": "否", "benefit": "中", "scope": "金钱", "three_zero": false, "cost": "建立\"通胀会侵蚀购买力\"这一资产配置意识的精力（几乎为零）。", "plain": "钱放着不动，通胀帮你悄悄贬值；长债在加息抗通胀时也会跌。想扛通胀，得持有一点能跟物价走的资产。", "gain": "高通胀同时打击现金购买力与长久期债券。1973–1981年美国CPI年均约7.4%，名义10年期国债实际年回报为负（如1980年名义仅-1.29%、扣除通胀后实际-13.81%），而同期合成TIPS（通胀保值债）却能录得11%–15%的双位数回报——这正是美国财政部1997年才正式发行TIPS想要解决的问题：把\"名义票息\"换成\"实际票息+通胀补偿\"。世界黄金协会测算，1971–2023年黄金年化回报约8%，显著高于同期CPI的4%与3个月美债的4.4%，说明实物/保值资产在长期能跑赢通胀。但需注意：1970年代股债曾出现\"同涨同跌\"（正相关），传统60/40分散失效，印证在通胀高于约2.5%时股债相关性会由负转正。没有哪类资产能完美对冲，关键是分散并持有真实资产。", "source": "Federal Reserve Bank of Boston (2009). A TIPS Scorecard: Are TIPS Accomplishing What They Were Supposed to Accomplish?（Working Papers No. 09-8）. <https://www.bostonfed.org/-/media/Documents/Workingpapers/PDF/ppdp0908.pdf>; PanAgora (持续更新). Risk Parity & Inflation（1970–1979 年化CPI 7.4%，TIPS实际回报高于CPI约3个百分点）. <https://www.panagora.com/assets/PanAgora-Risk-Parity-and-Inflation.pdf>; World Gold Council (2024). 估算黄金预期回报的\"积木法\"（1971–2023 黄金年化8% vs CPI 4%）. <https://china.gold.org/page/18826>", "note": "证据A级——多机构长期数据结论一致。局限性：1970年代为极端样本；TIPS的\"通胀保护\"在持有至到期才锁定，短期仍受利率波动（久期）影响。交叉引用：条目1（利率与长债）、条目8（黄金）、条目11（放水双刃）。"}, {"chapter": 17, "num": 4, "id": "17-4", "title": "别试图择时宏观，专业机构也常错", "grade": "A", "tags": {"钱": "0", "时间": "少", "毅力": "否", "收益": "中", "口径": "金钱", "影响": "自己"}, "impact": "自己", "cost_money": "0", "cost_time": "少", "cost_will": "否", "benefit": "中", "scope": "金钱", "three_zero": false, "cost": "根据\"专家说要崩/要涨\"反复调仓产生的交易费、税费与踏空损失。", "plain": "连拿高薪的首席经济学家都猜不准拐点。你根据\"感觉要跌\"反复进出，基本是在给券商打工。定好配置，少动。", "gain": "宏观与市场方向预测的难度，被多项研究反复证实。CXO Advisory追踪了1999–2012年间68位\"市场择时专家\"共6,582次预测，其中42人（61.8%）准确率低于50%，且扣除交易成本后\"没有一位\"能真正盈利；另有研究覆盖2000–2012年28位择时者逾4,500次预测，仅10人准确率过半、无人跑赢大盘。连著名的\"美林投资时钟\"在样本外也频频失效：华泰证券回溯发现2011年后直接套用美林时钟对中国大类资产配置的准确率仅28%，而加入利率维度改进后升至72%；新浪财经统计该模型1970–2020在美国整体正确率88%、在中国却仅40%。诺奖得主Sharpe测算，择时者需在\"下跌\"与\"反弹\"两边都对约74%才能战胜始终满仓的被动组合。结论：择时偶尔灵，长期系统性跑赢几乎不可能。", "source": "S&P Dow Jones Indices (2026). SPIVA U.S. Scorecard Year-End 2025（79%大型主动股基跑输标普500；20年维度94%）. <https://www.spglobal.com/spdji/en/research-insights/spiva/>; Advisor Perspectives (2020). Market Timing Is the Enemy of Investment Success（综述CXO：68位择时专家，扣费后无人盈利）. <https://www.advisorperspectives.com/articles/2020/01/27/market-timing-is-the-enemy-of-investment-success>; 新浪财经 (2021). 传统美林投资时钟在中国不灵？（1970–2020 美林时钟美国正确率88%、中国40%）. <https://finance.sina.com.cn/stock/hkstock/hkstocknews/2021-03-04/doc-ikftssaq0788452.shtml>", "note": "证据A级——多独立研究结论一致，属行为金融与实证研究的强共识。定级理由：并非单一论文，而是跨样本重复验证。局限性：少数\"超级预测者\"经训练可小幅超额，但属极个别。交叉引用：条目10（末日预言）、条目12（预期差）。"}, {"chapter": 17, "num": 5, "id": "17-5", "title": "美元强弱，直接乘在你的海外回报上", "grade": "A", "tags": {"钱": "0", "时间": "少", "毅力": "否", "收益": "中", "口径": "金钱", "影响": "自己"}, "impact": "自己", "cost_money": "0", "cost_time": "少", "cost_will": "否", "benefit": "中", "scope": "金钱", "three_zero": false, "cost": "买海外资产前多算一步汇率的注意力。", "plain": "你美股赚了10%，美元跌了5%，回到人民币只赚5%。汇率这道乘法，很多人买完才想起来。", "gain": "当你用本币（如人民币）投资美股、美债、港股时，最终本币回报 = 资产本币收益 × 汇率变动。Vanguard的研究显示，2000–2010年美元贬值曾为美国投资者海外资产年化贡献约+3%，而2010–2020年美元升值又侵蚀了约-1.5%的年化回报——十年方向翻转，差额相当于约4.5个百分点/年。对人民币投资者同理：美元走弱会吃掉外币收益的一截，走强则加成。Vanguard还指出，货币长期没有内在收益（无票息、无盈利增长），只影响波动；对股票而言是否对冲主要看风险承受而非收益，但对债券若不对冲，波动会被放大到接近股票水平，削弱其\"压舱石\"作用。汇率是看不见的第二层收益或亏损。", "source": "Vanguard (2023). The U.S. dollar is unlikely to continue defying gravity（美元高估约12%，十年贬值概率约75%，未对冲海外股票或年化+1.1%）. <https://advisors.vanguard.com/insights/article/the-us-dollar-is-unlikely-to-continue-defying-gravity>; Vanguard (持续更新). Global equity investing: The benefits of diversification and sizing your allocation（货币长期无内在收益，主要贡献波动）. <https://www.vanguardmexico.com/content/dam/intl/americas/documents/mexico/en/global-equity-investing-diversification-sizing.pdf>", "note": "证据A级——大型资管长期数据。局限性：汇率方向本身不可靠预测，Vanguard亦强调长期均值回归。对债券建议对冲、对股票可承受未对冲以分散。交叉引用：条目9（汇率乘数）、条目1（利差驱动汇率）。"}, {"chapter": 17, "num": 6, "id": "17-6", "title": "衰退里好公司也被错杀，是机会也是陷阱", "grade": "A", "tags": {"钱": "少", "时间": "少", "毅力": "中", "收益": "中", "口径": "金钱", "影响": "自己"}, "impact": "自己", "cost_money": "少", "cost_time": "少", "cost_will": "中", "benefit": "中", "scope": "金钱", "three_zero": false, "cost": "区分\"暂时下跌\"和\"基本面坏掉\"的功课与时间投入；跌市中逆向买入需一定资金与心力。", "plain": "崩盘时好股票也会跟着跌，那是便宜捡筹的机会；但别把\"跌得多\"当\"便宜\"，有些是真的烂了。分清暂时和永久。", "gain": "系统性下跌（如收益率曲线倒挂预示的衰退期）中，优质资产常被无差别抛售，提供买入机会；但同一轮下跌里也有大量公司基本面真的出问题。判断关键在\"下跌是市场恐慌还是公司变差\"。学术研究用\"盈利惊喜\"（earnings surprise）衡量基本面：Ball & Brown(1968)到Bernard & Thomas(1990)反复证明，业绩超预期的公司公告后60个交易日仍存在约2.9%的累计异常回报漂移（PEAD），说明市场常对好公司反应不足、对差公司过度抛售。结合条目2的衰退预警，在恐慌性错杀中聚焦于\"盈利仍超预期、负债率低、护城河未破\"的公司，胜率更高；但务必避开\"价值陷阱\"——盈利下修、行业结构恶化的公司，跌再多也不是便宜。", "source": "Bernard & Thomas (1990). Evidence That the Size-Adjusted Returns Around Earnings Announcements Are Related to Subsequent Earnings（PEAD漂移）. <http://en.m.wikipedia.com/wiki/Post-earnings_announcement_drift>; Federal Reserve Bank of New York (持续更新). The Yield Curve as a Leading Indicator（衰退预警）. <https://www.newyorkfed.org/research/capital_markets/ycfaq.html>", "note": "证据A级——PEAD为经久验证的异象。局限性：错杀识别需要基本面研究能力，普通投资者可用宽基指数在恐慌期定投替代\"挑个股\"。交叉引用：条目2（曲线倒挂）、条目12（预期差）。"}, {"chapter": 17, "num": 7, "id": "17-7", "title": "加息周期末端，债券往往先企稳", "grade": "A", "tags": {"钱": "0", "时间": "少", "毅力": "否", "收益": "中", "口径": "金钱", "影响": "自己"}, "impact": "自己", "cost_money": "0", "cost_time": "少", "cost_will": "否", "benefit": "中", "scope": "金钱", "three_zero": false, "cost": "对债券\"跌了就不敢买\"的心理误判，以及研究利率拐点的少量精力。", "plain": "大家都在怕加息时，债券可能已经跌到头了。利率一旦见顶回落，债比股更早企稳——别等所有人都乐观了才想起来买。", "gain": "债券价格与利率反向，而债券对\"利率见顶\"的预期极其敏感。2022年美联储激进加息令彭博美国综合债指数暴跌13.0%，但当市场开始预期加息接近尾声、收益率在2022年底见顶（指数到期收益率升至4.68%，为2008年来最高）后，该指数在2023年即反弹+5.53%——债券在股市情绪反转之前就提前修复。这正是利率周期的\"领先指标\"属性：长债价格常在政策利率真正转向前数月见底。换言之，等到新闻全面乐观、所有人喊\"可以买债了\"，收益率早已下行、价格涨幅多半已经兑现。对普通投资者，用短久期或阶梯式买入比试图精准抄底更稳妥。", "source": "Diamond Hill (2023). Rising Rates: Lessons from 2022（Bloomberg US Aggregate 2022 -13.01%，2023 +5.53%；YTW自1.75%升至4.68%）. <https://www.diamond-hill.com/news/a-942/articles/rising-rates-lessons-from-2022/>; Winthrop Wealth (2022). 2022 Market Review and Outlook（利率见顶后Agg +1.9% in Q4）. <https://winthropwealth.com/commentary/2022-market-review-and-outlook/>", "note": "证据A级——价格—利率反向为定价公理且有实测。局限性：若通胀二次抬头导致利率再上，债券会再跌；\"末端\"只能事后确认。交叉引用：条目1（利率引力）、条目3（长债与通胀）。"}, {"chapter": 17, "num": 8, "id": "17-8", "title": "黄金是保险，不是主食", "grade": "A", "tags": {"钱": "0", "时间": "少", "毅力": "否", "收益": "中", "口径": "金钱", "影响": "自己"}, "impact": "自己", "cost_money": "0", "cost_time": "少", "cost_will": "否", "benefit": "中", "scope": "金钱", "three_zero": false, "cost": "把黄金当\"稳赚投资\"的预期管理；配置5–10%所占的资金机会成本。", "plain": "黄金不生息、长期不怎么涨，它的用处是\"世界乱了它顶一下\"。配一点当保险就行，别拿来当主要资产。", "gain": "长期看，黄金的价值在于极端风险对冲而非增值。世界黄金协会用\"积木法\"测算，1971–2023年黄金年化名义回报约8%，高于同期CPI的4%和3个月美债的4.4%——但这主要源于脱离金本位后货币贬值与避险需求，并非稳定\"生息\"。它不产生现金流，波动却不小（2022年随实际利率上行也曾明显回调）。在滞胀、货币信用危机、地缘冲突时，黄金与股债相关性下降，能发挥保险作用；但把它当主食重仓，会拖累组合长期复利（股票长期年化远高于黄金）。实务建议：配置5%–10%作为尾部风险保险即可，且优先考虑低成本实物金或黄金ETF，而非高溢价金矿股。", "source": "World Gold Council (2024). 估算黄金预期回报的\"积木法\"（1971–2023 黄金年化8% vs CPI 4%、3个月美债4.4%）. <https://china.gold.org/page/18826>; PanAgora (持续更新). Risk Parity & Inflation（黄金在通胀期实际回报高于CPI）. <https://www.panagora.com/assets/PanAgora-Risk-Parity-and-Inflation.pdf>", "note": "证据A级——WGC长期数据。局限性：黄金回报高度依赖货币与地缘环境，脱离金本位后的样本偏牛；配置比例因人而异。交叉引用：条目3（通胀保值）、条目11（放水稀释币值）。"}, {"chapter": 17, "num": 9, "id": "17-9", "title": "汇率对你的最终回报有乘数效应", "grade": "A", "tags": {"钱": "0", "时间": "少", "毅力": "否", "收益": "中", "口径": "金钱", "影响": "自己"}, "impact": "自己", "cost_money": "0", "cost_time": "少", "cost_will": "否", "benefit": "中", "scope": "金钱", "three_zero": false, "cost": "跨境投资前评估汇率敞口与（可选）对冲成本的一层思考。", "plain": "同一条海外资产，汇率能让你多赚也能让你白干。重仓外币前，先想清楚你是看好资产还是顺带赌了汇率。", "gain": "本币计价的海外资产回报，会被投资期汇率变动放大或缩水，是一层\"看不见的乘法\"。Vanguard指出，货币长期没有内在收益（无票息、无盈利增长），只影响波动：对国际股票，是否对冲主要看风险容忍度；但对国际债券，若不对冲，波动会被放大到接近股票水平，严重削弱其作为组合\"压舱石\"的功能。对人民币投资者，美元走强期（如2010–2020美元升值侵蚀美国投资者海外资产约-1.5%/年）外币收益被加成，走弱期则反是。因此重仓单一外币，等于在看好资产之外额外押了一把汇率方向的注——若不愿承担，可用对冲型ETF或本币计价产品把这道乘法\"设为1\"。", "source": "Vanguard (2023). The U.S. dollar is unlikely to continue defying gravity（未对冲海外股票长期年化外汇贡献约±1%–3%）. <https://advisors.vanguard.com/insights/article/the-us-dollar-is-unlikely-to-continue-defying-gravity>; Vanguard (持续更新). Global equity investing: The benefits of diversification and sizing your allocation（债券不对冲波动升至股票级）. <https://www.vanguardmexico.com/content/dam/intl/americas/documents/mexico/en/global-equity-investing-diversification-sizing.pdf>", "note": "证据A级——大型资管长期研究。局限性：汇率方向无法可靠预测，对冲有成本；对长期股票投资者，未对冲反而可降低与本国资产的相关性、对冲本土通胀。交叉引用：条目5（美元乘数）、条目1（利差驱动汇率）。"}, {"chapter": 17, "num": 10, "id": "17-10", "title": "听\"末日预言\"要打折，预言家靠频率取胜", "grade": "A", "tags": {"钱": "0", "时间": "少", "毅力": "否", "收益": "中", "口径": "金钱", "影响": "自己"}, "impact": "自己", "cost_money": "0", "cost_time": "少", "cost_will": "否", "benefit": "中", "scope": "金钱", "three_zero": false, "cost": "被\"崩盘将至\"文章引发的恐慌与可能的错误清仓。", "plain": "那些\"马上崩盘\"的预言家，喊得够久总会对一次。别被一次蒙对吓到，看他过去十年错了多少次。", "gain": "加州大学伯克利分校心理学家Philip Tetlock用20年追踪了284位以评论政治经济趋势为业的\"专家\"，累计收集82,361条预测；结论是其整体准确率不比\"掷飞镖的猩猩\"更好，且越有名的预言家往往越不准（过度自信）。在三分法中，专家整体表现甚至不如\"三种结果各1/3概率\"的简单基准；他们自称100%确定的事最终只兑现约80%、80%确信的事只兑现约65%。这解释了为何\"末日预言家\"喊十年崩盘总有一次蒙对——一次对足以封神，此前数十次错无人记得。用基础概率想：喊了十年崩，蒙对一次不代表有预测力。应对：建立书面配置纪律，把宏观噪音挡在交易指令之外。", "source": "The New Yorker (2005). Everybody's an Expert（综述Tetlock 20年研究：284位专家、82,361条预测，整体不优于随机）. <https://www.newyorker.com/magazine/2005/12/05/everybodys-an-expert>; University of Pennsylvania, Wharton (2007). Review of Expert Political Judgment（Tschoegl & Armstrong：284位专家、82,361预测，专家不优于知情非专家）. <https://faculty.wharton.upenn.edu/wp-content/uploads/2012/08/Tetlock-16.pdf>", "note": "证据A级——20年大规模研究，结论稳健。局限性：少数\"狐狸型\"思考者经训练可小幅超越，普通投资者无从识别。交叉引用：条目4（择时不可靠）、条目12（预期差）。"}, {"chapter": 17, "num": 11, "id": "17-11", "title": "放水推高资产，也稀释币值，是双刃", "grade": "A", "tags": {"钱": "0", "时间": "少", "毅力": "否", "收益": "中", "口径": "金钱", "影响": "自己"}, "impact": "自己", "cost_money": "0", "cost_time": "少", "cost_will": "否", "benefit": "中", "scope": "金钱", "three_zero": false, "cost": "对\"央行印钱=股市必涨\"的简化理解，以及在流动性退潮时未及减仓的回撤。", "plain": "央行放水，股票房子涨，但钱也毛了。这是两头下注——你资产涨了，购买力也在悄悄缩水。别只看见一边。", "gain": "量化宽松（QE）通过\"组合再平衡\"与\"信号\"渠道压低长端利率、推高风险资产。联合国《世界经济形势与展望》指出，首轮QE后的十年里标普500上涨超200%、欧洲斯托克指数近乎翻倍，美国与欧洲房价也被额外流动性推高；美联储三轮LSAP（QE1–3）期间，学术估算QE1单独令标普500累计上涨约10%、10年期国债收益率下降0.5%–1%。但硬币另一面：广义货币/GDP从2007年的79.5%升至2021年的117%（美国），货币购买力被稀释；2022年美联储急转弯加息，前述估值红利又快速回吐（综合债-13%、标普-19%）。宽松短期利多风险资产，长期用通胀把部分收益收回。理解这层，才不会被\"放水叙事\"单向绑架。", "source": "United Nations (2023). World Economic Situation and Prospects as of mid-2023（QE后十年标普500 +200%，广义货币/GDP 79.5%→117%）. <https://sdgs.un.org/sites/default/files/2023-07/SIDS_WESP%202023_Mid-Year_Final.pdf>; Federal Reserve Bank of New York (2019). Ten Years Later—Did QE Work?（QE1令标普500累计+10%、10Y收益率降0.5%–1%）. <https://libertystreeteconomics.newyorkfed.org/2019/05/ten-years-laterdid-qe-work/>", "note": "证据A级——央行与联合国文件+学术事件研究一致。局限性：QE效果依赖经济环境与退出节奏，2022紧缩即逆转部分效应。交叉引用：条目3（通胀）、条目8（黄金保险）、条目1（利率反向）。"}, {"chapter": 17, "num": 12, "id": "17-12", "title": "经济新闻的\"好于/差于预期\"，才是真信号", "grade": "A", "tags": {"钱": "0", "时间": "少", "毅力": "否", "收益": "中", "口径": "金钱", "影响": "自己"}, "impact": "自己", "cost_money": "0", "cost_time": "少", "cost_will": "否", "benefit": "中", "scope": "金钱", "three_zero": false, "cost": "被标题\"GDP增速X%\"本身带节奏的注意力偏差。", "plain": "新闻说\"经济差\"，但没大家想的那么差，股市可能涨。市场炒的是\"超出或低于预期\"，不是数字本身。", "gain": "市场反应看的是\"实际vs预期差\"，不是绝对数字。一个\"差但好于恐慌预期\"的数据，资产反而涨。这在微观层面有扎实证据：Ball & Brown(1968)开创、Bernard & Thomas(1990)深化的\"盈余公告后漂移\"（PEAD）表明，业绩超预期的股票在公告后60个交易日累计异常回报可达约2.9%，而不及预期者反向——市场常对惊喜反应不足。宏观同理：PMI、CPI、非农的\"预期差\"往往比数值本身更驱动资产价格。对普通投资者，与其预测宏观拐点（见条目4），不如关注\"市场是否已price in悲观\"：当一致预期极悲观而数据仅小幅不及预期时，反而是风险资产修复的契机。盯\"预期差\"比盯\"数字\"更接近市场逻辑。", "source": "Bernard & Thomas (1990). Evidence That the Size-Adjusted Returns Around Earnings Announcements Are Related to Subsequent Earnings（PEAD，60日漂移约2.9%）. <http://en.m.wikipedia.com/wiki/Post-earnings_announcement_drift>; S&P Dow Jones Indices (2026). SPIVA U.S. Scorecard（主动管理难以持续战胜指数，印证预测之难）. <https://www.spglobal.com/spdji/en/research-insights/spiva/>", "note": "证据A级——PEAD为经久异象，宏观预期差有大量事件研究。局限性：预期差交易对散户执行门槛高，用指数化+再平衡更实际。交叉引用：条目4（不择时）、条目6（错杀）、条目2（曲线预警）。"}, {"chapter": 18, "num": 1, "id": "18-1", "title": "你的工资，是人生最大的一笔本金", "grade": "A", "tags": {"钱": "0", "时间": "少", "毅力": "否", "收益": "中", "口径": "金钱", "影响": "自己／家庭"}, "impact": "自己／家庭", "cost_money": "0", "cost_time": "少", "cost_will": "否", "benefit": "中", "scope": "金钱", "three_zero": false, "cost": "把\"投资\"窄化为买股票基金、忽视自身收入能力的机会视角。", "plain": "二十来岁你最大的资产不是那点存款，是\"未来几十年能赚钱的自己\"。把提升收入能力当第一笔投资，回报远超研究基金。", "gain": "从家庭资产负债表看，人力资本是普通人年轻阶段占比最高的资产。Guiso & Sodini 在《Household Finance》中给出生命周期曲线：工作之初人力资本占总财富比例接近 1，之后随储蓄积累才逐步下降。中央财经大学《中国人力资本报告2025》测算，2023 年中国人力资本总量 4375.63 万亿元、人均 402.22 万元；世界银行 HCI 中国 2020 年为 0.7（即新生儿成长为\"满血\"劳动者的生产力约七成）。举个直观例子：一个 25 岁、年薪 10 万、还有 35 年工龄的工程师，其未来收入现值约 180 万，而此时存款可能只有 5 万——人力资本占总财富 97% 以上。所以，提升收入能力的复利（教育回报率约 10%/年），远大于同等时间研究基金所追求的 7%–10% 年化，且确定性更高。先把自己这头资产做大，再谈配置金融资本。", "source": "中央财经大学人力资本与劳动经济研究中心 (2025). 《中国人力资本报告2025》. <https://humancapital.cufe.edu.cn/info/1146/2472.htm>; World Bank (2020). Human Capital Index (HD.HCI.OVRL), China = 0.7. <https://data.worldbank.org/indicator/HD.HCI.OVRL?locations=CN>; Guiso, L. & Sodini, P. (2013). Household Finance: An Emerging Field. <https://www.eief.it/files/2014/01/guiso_sodini-household-finance-an-emerging-field.pdf>", "note": "人力资本不可交易、不可抵押、且高度依赖健康，需用保险与持续学习对冲折旧；中国总量/人均为 J-F 终生收入法估算，含方法学假设。"}, {"chapter": 18, "num": 2, "id": "18-2", "title": "谈一次薪，可能抵一年理财", "grade": "A", "tags": {"钱": "少", "时间": "少", "毅力": "中", "收益": "中", "口径": "金钱", "影响": "自己／家庭"}, "impact": "自己／家庭", "cost_money": "少", "cost_time": "少", "cost_will": "中", "benefit": "中", "scope": "金钱", "three_zero": false, "cost": "谈薪前做功课与演练的精力（通常数小时，且需克服\"谈钱羞耻\"）。", "plain": "入职/调薪时多谈 10%，是零风险、且年年复利的收益。很多人羞于谈薪，等于每年主动放弃一笔钱。", "gain": "Glassdoor 2023 年对近 6700 名职场人的调研显示，54% 的人上一份 offer 没有谈薪、仅 46% 谈了——也就是说，超过一半的人白放弃了一笔确定性极高的钱。亚特兰大联储 Wage Growth Tracker 追踪显示，换工作者工资增速长期高于留守者（2026 年 8 月分别为 5.0% 与 3.6%）。具体算一笔账：起薪多谈下 10%（如 6 万→6.6 万），按 3.5% 年涨幅、40 年职业生涯累计可多出约 49.4 万美元（境外保守测算，未计奖金与退休匹配）；即便只算境内，多谈下的 10% 会作为每年调薪的基数被反复放大。这是零风险、几乎零成本的纯增益，回报远超花同样时间研究基金。", "source": "Glassdoor / Fishbowl (2023). 54% of Workers Didn't Negotiate Most Recent Job Salary. <https://fortune.com/2023/09/26/half-of-workers-didnt-negotiate-salary>; Federal Reserve Bank of Atlanta (2026). Wage Growth Tracker. <https://www.atlantafed.org/research-and-data/data/wage-growth-tracker>", "note": "谈判成功率与涨幅有大规模调查与央行追踪数据支撑；谈薪应基于市场数据（招股书/招聘平台/同行），且须把隐性薪酬（见条目 12）一并计入。"}, {"chapter": 18, "num": 3, "id": "18-3", "title": "主业技能是复利，别只盯着副业", "grade": "A", "tags": {"钱": "0", "时间": "少", "毅力": "些", "收益": "中", "口径": "金钱", "影响": "自己"}, "impact": "自己", "cost_money": "0", "cost_time": "少", "cost_will": "些", "benefit": "中", "scope": "金钱", "three_zero": false, "cost": "对\"搞副业才叫搞钱\"的执念，以及把精力摊薄到十个浅层项目的注意力损耗。", "plain": "与其摊薄精力做十个浅副业，不如把主业做到前 20%，升职加薪的复利更猛。基本盘厚了，副业才稳。", "gain": "教育/技能回报率（明瑟收益率）在中国从 1988 年的 4.0% 升至 2001 年的 10.2%（Zhang et al. 2005，北大光华《研究简报》第 150 期汇总并采用 10% 为基准），即每多受一年教育、每提升一级技能，收入约增 10% 量级。Forbes 2026 年 JobLeads 研究更直白：从初级到中级职位平均涨薪 14%，从中级到高级平均涨 51%——级别跃迁的回报远高于任何横向副业。把时间砸在主业纵深（做到前 20%）、争取晋升到下一职级，其复利远胜分散做多个浅层副业；主业是基本盘，副业是锦上添花而非替代。", "source": "北京大学光华管理学院 (2019). 《研究简报》第 150 期：中国长期全要素生产率的重新估算. <https://www.gsm.pku.edu.cn/thought_leadership/info/1110/2612.htm>; Forbes (2026). Should You Job-Hop Or Job-Hug? A New Study Offers Surprising Answers. <https://forbes-forbescom-live.non-prod.zephrcf.com/sites/bryanrobinson/2026/09/21/should-you-job-hop-or-job-hug-a-new-study-offers-surprising-answers>", "note": "技能溢价因行业与层级而异；过度专业化亦有被技术替代的风险（见条目 8）。"}, {"chapter": 18, "num": 4, "id": "18-4", "title": "职业中断的成本，被严重低估", "grade": "A", "tags": {"钱": "0", "时间": "少", "毅力": "否", "收益": "中", "口径": "金钱", "影响": "自己／家庭"}, "impact": "自己／家庭", "cost_money": "0", "cost_time": "少", "cost_will": "否", "benefit": "中", "scope": "金钱", "three_zero": false, "cost": "评估离职/长期 gap 的真实代价（含资历、社保、行业人脉的断档，而非仅当期工资）。", "plain": "辞职躺平或长期脱产，亏的不止那几个月工资，是资历、社保和圈子的断档。复出常要降档，这笔账很多人没算。", "gain": "职业中断的代价是长期且被低估的。旧金山联储 2023-25 号经济信件研究：母亲若在生育后早返工一年，10–20 年后的工资高出 5%–6%；缩短非就业期一年，未来工资可上升 4.6%–6.8%。英国 ONS/大伦敦政府数据更触目：女性生育第一孩 5 年后收入比无孩同龄人低 42%，就业概率低 11 个百分点。这说明空窗期不止损失当期收入，更打断资历累积、社保连续性与行业人脉，复出常面临降档。重大决定（辞职、脱产考研、长期 travel）前，务必把这笔隐性减值算进总账。", "source": "Federal Reserve Bank of San Francisco (2023). How Much Do Work Interruptions Reduce Mothers' Wages? (Economic Letter 2023-25). <https://www.frbsf.org/wp-content/uploads/sites/4/el2023-25.pdf>; Greater London Authority / ONS (2023). The impact of motherhood on employment and earnings in London. <https://data.london.gov.uk/blog/the-impact-of-motherhood-on-employment-and-earnings-in-london>", "note": "母职惩罚数据以女性为主、男性中断研究较少，但\"中断→资历断档→复出降档\"的方向对所有人通用；可通过保持技能更新降低中断损耗。"}, {"chapter": 18, "num": 5, "id": "18-5", "title": "把\"自己\"当一家小公司经营", "grade": "B", "tags": {"钱": "0", "时间": "少", "毅力": "些", "收益": "中", "口径": "金钱", "影响": "自己"}, "impact": "自己", "cost_money": "0", "cost_time": "少", "cost_will": "些", "benefit": "中", "scope": "金钱", "three_zero": false, "cost": "用经营者视角审视自己，每月抽约 30 分钟做个人资产负债表复盘。", "plain": "把你当一家公司：工资是营收，技能是资产，贷款是负债。定期看\"我这家公司竞争力在升还是降\"——这比盯大盘更能决定你能赚多少。", "gain": "把个人视为\"公司\"，能显化你真正的风险敞口：收入（工资）是营收，技能与健康是资产，房贷车贷是负债，而工资增速就是你的\"营收增长率\"。世界银行 HCI 中国 2020 年仅为 0.7，意味着健康与教育折旧会直接拉低你这家\"公司\"的资产收益率。CFA 体系的\"家庭总财富 = 金融资本 + 人力资本\"框架指出，25 岁时人力资本可占总财富 95% 以上，金融资本只是极小一角。定期复盘\"毛利率\"（储蓄率）与\"竞争力\"（行业地位、可迁移技能、社保连续性），比追涨杀跌更能决定你的财务上限。", "source": "World Bank (2020). Human Capital Index (HD.HCI.OVRL), China = 0.7. <https://data.worldbank.org/indicator/HD.HCI.OVRL?locations=CN>; CFA Institute / FA Magazine (2013). Human Capital And Asset Allocation（家庭资产负债表框架）. <https://www.fa-mag.com/news/human-capital-and-asset-allocation-25353.html>", "note": "与条目 1、9、12 共同构成\"个人资产负债表\"视角；该公司框架用于自我诊断，不替代专业财务规划。"}, {"chapter": 18, "num": 6, "id": "18-6", "title": "过度跳槽与从不跳槽，都亏", "grade": "B", "tags": {"钱": "0", "时间": "少", "毅力": "否", "收益": "中", "口径": "金钱", "影响": "自己"}, "impact": "自己", "cost_money": "0", "cost_time": "少", "cost_will": "否", "benefit": "中", "scope": "金钱", "three_zero": false, "cost": "对\"跳槽涨薪\"或\"忠诚留任\"的极端化思维。", "plain": "一年一跳显得漂，十年不跳容易被压价。中间有个甜区——该跳时跳，该沉淀时沉淀。别走极端。", "gain": "跳槽确实能带来溢价——亚特兰大联储 Wage Growth Tracker 显示换工作者工资增速长期高于留守者（2026 年 8 月 5.0% vs 3.6%）。但 Forbes 2026 年 JobLeads 研究给出反平衡：仅 27% 受访者称\"换雇主\"带来职业生涯最大涨幅，31% 称\"内部晋升\"才是；69% 的跳槽者最近一次涨幅在 15% 以内。频繁跳槽（<10 个月）显出不稳定性、打断积累；长期不挪又易被内部定价压低、错过市场价位。研究普遍认为存在\"适度区间\"，且行业差异大〔争议〕——判断标准应是\"是否晋升到下一职级\"，而非\"是否换了公司\"。", "source": "Federal Reserve Bank of Atlanta (2026). Wage Growth Tracker. <https://www.atlantafed.org/research-and-data/data/wage-growth-tracker>; Forbes (2026). Should You Job-Hop Or Job-Hug? A New Study Offers Surprising Answers. <https://forbes-forbescom-live.non-prod.zephrcf.com/sites/bryanrobinson/2026/09/21/should-you-job-hop-or-job-hug-a-new-study-offers-surprising-answers>", "note": "〔争议〕最优跳槽频次因行业与层级而异；以\"职级跃迁+市场价差≥10%\"作为触发条件更稳妥（见条目 2、11）。"}, {"chapter": 18, "num": 7, "id": "18-7", "title": "行业 Beta，比你在哪家强更重要", "grade": "B", "tags": {"钱": "0", "时间": "少", "毅力": "否", "收益": "中", "口径": "金钱", "影响": "自己"}, "impact": "自己", "cost_money": "0", "cost_time": "少", "cost_will": "否", "benefit": "中", "scope": "金钱", "three_zero": false, "cost": "只盯公司、忽略赛道的选择惯性。", "plain": "在风口行业，普通人也能涨薪；在衰退行业，高手也难。选对赛道，你的努力才不被埋没。", "gain": "收入增长中，行业整体景气度（Beta）的解释力常大于公司个体（Alpha）。中国人力资本的区域/城乡差异直观地印证了\"赛道效应\"：中央财经大学《中国人力资本报告2025》显示，2023 年城镇人均人力资本 505.44 万元、农村仅 124.33 万元，城乡人均比 4.07；人均前列为北京、上海、天津、江苏、山东，垫底为海南、云南、新疆、甘肃、青海。选对上升赛道（如数字经济、医疗健康），个人努力的回报被放大；选错下行赛道，努力被抵消。因此，在\"努力\"之前先选对行业，是杠杆率最高的人力资本决策之一。", "source": "中央财经大学人力资本与劳动经济研究中心 (2025). 《中国人力资本报告2025》. <https://humancapital.cufe.edu.cn/info/1146/2472.htm>; World Bank (2020). Human Capital Index (HD.HCI.OVRL). <https://data.worldbank.org/indicator/HD.HCI.OVRL?locations=CN>", "note": "Beta 与 Alpha 难以精确分解，但行业选择的重要性已被大量劳动经济文献证实；可结合个人可迁移技能降低换赛道成本。"}, {"chapter": 18, "num": 8, "id": "18-8", "title": "技能过时风险，要用持续学习对冲", "grade": "A", "tags": {"钱": "少", "时间": "中", "毅力": "中", "收益": "中", "口径": "金钱", "影响": "自己"}, "impact": "自己", "cost_money": "少", "cost_time": "中", "cost_will": "中", "benefit": "中", "scope": "金钱", "three_zero": false, "cost": "持续更新的时间投入（建议每周数小时）与少量学习费用。", "plain": "你现在的本事，十年后可能不值钱。定期学点新东西、尤其是可迁移的能力，才是不让\"自己这家公司\"贬值的法子。", "gain": "技术替代与岗位重构在加速，单一技能的半衰期持续缩短。教育回报虽仍可观（中国明瑟收益率约 10%），但结构在变：华东师大 2011 年研究在控制家庭背景与能力后，真实教育收益率降至 4.6%–5.5%（未控制时总体 14.3%、男性 13.1%、女性 14.2%）。这意味着\"学历通胀\"下，存量文凭的边际收益在下降，光靠一张旧文凭已无法保值。持续学习新工具 + 打磨可迁移能力（沟通、分析、跨领域整合），才是让人力资本不贬值的唯一办法；AI/数字化正重塑岗位，主动更新者保值、被动者贬值。", "source": "华东师范大学 (2011). 文凭信号、职业因素与家庭背景对教育收益的影响研究. <https://xbzs.ecnu.edu.cn/CN/html/201106011.htm>; 北京大学光华管理学院 (2019). 《研究简报》第 150 期. <https://www.gsm.pku.edu.cn/thought_leadership/info/1110/2612.htm>", "note": "与条目 3（主业深耕）、条目 10（避坑）联动；学习应聚焦\"可验证增收的技能\"，而非泛泛的焦虑消费。"}, {"chapter": 18, "num": 9, "id": "18-9", "title": "健康是人力资本的地基，病倒=资产减值", "grade": "A", "tags": {"钱": "少", "时间": "中", "毅力": "中", "收益": "中", "口径": "金钱", "影响": "自己／家庭"}, "impact": "自己／家庭", "cost_money": "少", "cost_time": "中", "cost_will": "中", "benefit": "中", "scope": "金钱", "three_zero": false, "cost": "作息、运动、体检的日常投入（时间 + 少量金钱）。", "plain": "一场大病，不只是医药费，更是收入断流。把身体当资产保养，能多干几年赚的钱，远超任何基金收益。", "gain": "健康是人力资本的地基，其经济价值有硬数据支撑。武汉大学基于 CHNS 的博士论文测算：健康人力资本对个人收入的贡献度高达 19.3%，略高于教育人力资本。CGSS2015（3251 名居民）实证显示：心理健康良好者年职业收入高 12.3%，身体健康较好者高 7.1%（倾向得分匹配结果）。皮书研究进一步指出，慢性病显著负向影响劳动参与与回报，且健康冲击的真实代价常被\"适应性岗位调整\"掩盖而系统性低估。重大疾病直接打断收入现金流、吞噬储蓄，是家庭财务最贵的\"折旧\"——保持可工作年限，是比任何理财都确定的高回报投资。", "source": "武汉大学 (健康人力资本与经济增长 博士论文). <https://openir.whu.edu.cn/AchievementDetail/degree_58de0fc2-cf89-443c-a85c-7cb4ff4cd31d>; 江苏卫生事业管理 (CGSS2015 实证研究). <http://www.jswssygl.org/jswssygl/ch/reader/view_reference.aspx?aid=2BF99E2DE8AA5BC68A422FA76FF96C7B>", "note": "健康回报含\"遮蔽效应\"（患病者已自适应调岗），真实价值或被低估；可用重疾/医疗险把\"断流风险\"部分转移。"}, {"chapter": 18, "num": 10, "id": "18-10", "title": "别用\"投资自己\"为名，买无用课", "grade": "B", "tags": {"钱": "少", "时间": "少", "毅力": "些", "收益": "中", "口径": "金钱", "影响": "自己"}, "impact": "自己", "cost_money": "少", "cost_time": "少", "cost_will": "些", "benefit": "中", "scope": "金钱", "three_zero": false, "cost": "对\"知识付费焦虑\"的清醒，以及下单前 5 分钟的追问。", "plain": "\"投资自己\"被很多课拿来当收款码。真能提升收入的才算投资，否则就是消费。下单前问：这课能让收入多几个点？说不清就是坑。", "gain": "大量\"理财课/认知课\"是消费而非投资——既不教你可验证技能，也不改善收入。教育回报率虽约 10%（明瑟收益率），但那指系统性的学历与技能提升；华东师大 2011 年研究显示，控制能力、家庭背景、职业因素后，真实教育收益率仅 4.6%–5.5%。市面多数短训课既达不到该边际收益，也无法通过\"障碍变量\"验证因果。判断标准很简单：学完能否带来可量化的收入或能力增量？能，才算投资；不能，就是情绪消费的\"焦虑税\"。把这笔钱省下、投进指数基金，长期回报反而更确定。", "source": "华东师范大学 (2011). 文凭信号、职业因素与家庭背景对教育收益的影响研究. <https://xbzs.ecnu.edu.cn/CN/html/201106011.htm>; 北京大学光华管理学院 (2019). 《研究简报》第 150 期. <https://www.gsm.pku.edu.cn/thought_leadership/info/1110/2612.htm>", "note": "并非否定一切学习，而是区分\"可验证增收的技能\"与\"情绪消费的焦虑税\"；系统性学历/认证仍可带来约 10% 的明瑟回报。"}, {"chapter": 18, "num": 11, "id": "18-11", "title": "副业的前提，是不影响主业复利", "grade": "B", "tags": {"钱": "少", "时间": "中", "毅力": "中", "收益": "中", "口径": "金钱", "影响": "自己"}, "impact": "自己", "cost_money": "少", "cost_time": "中", "cost_will": "中", "benefit": "中", "scope": "金钱", "three_zero": false, "cost": "副业占用主业精力的权衡，以及\"用副业掩盖主业停滞\"的自我欺骗。", "plain": "副业赚了点外快，却耽误了主业升职，那是亏的。副业不能伤基本盘，这是红线。", "gain": "副业若拖垮主业表现、耽误升职，机会成本极高。Forbes 2026 年 JobLeads 研究：从中级到高级职位平均涨薪 51%，远高于任何副业外快；内部晋升（31%）与外部跳槽（27%）是大多数人职业生涯最大涨幅的来源。换句话说，主业纵深带来的\"级别跃迁复利\"才是普通人收入曲线的主引擎，副业只是锦上添花。用\"是否损害基本盘\"作为副业的上限开关——当副业开始挤占你本可用于晋升、深度技能积累的时间，就该踩刹车。基本盘厚了，副业才稳（呼应条目 3）。", "source": "Forbes (2026). Should You Job-Hop Or Job-Hug? A New Study Offers Surprising Answers. <https://forbes-forbescom-live.non-prod.zephrcf.com/sites/bryanrobinson/2026/09/21/should-you-job-hop-or-job-hug-a-new-study-offers-surprising-answers>; 北京大学光华管理学院 (2019). 《研究简报》第 150 期. <https://www.gsm.pku.edu.cn/thought_leadership/info/1110/2612.htm>", "note": "与条目 3、6、7 联动；副业适合在基本盘稳固后作为\"多元化\"，而非主业停滞时的逃避。"}, {"chapter": 18, "num": 12, "id": "18-12", "title": "社保公积金是隐性薪酬，离职要算清", "grade": "A", "tags": {"钱": "0", "时间": "少", "毅力": "些", "收益": "中", "口径": "金钱", "影响": "自己／家庭"}, "impact": "自己／家庭", "cost_money": "0", "cost_time": "少", "cost_will": "些", "benefit": "中", "scope": "金钱", "three_zero": false, "cost": "把福利算进总包的视角，以及比 offer 时核对五险一金缴存基数与比例。", "plain": "谈工资别只看\"到手多少\"，单位给你缴的社保公积金常是工资的 30% 以上。比 offer 或离职漏算这截会吃大亏。", "gain": "五险一金中单位缴纳部分常等于工资的 25%–40%，是一笔被严重低估的\"隐性薪酬\"。以来安县政府 2023 年解读为例：以最低缴费基数 3832 元计，单位每月为职工缴养老 16%+医疗 7%+失业 0.5%+工伤约 918 元，个人缴 403 元，合计约 1320 元（不含公积金）；若再加住房公积金（单位 5%–12%），单位总负担轻松超过工资的 30%。比较 offer 或评估离职成本时，只看到手工资会严重低估总包；跳槽\"涨薪\"若牺牲了社保连续性、公积金缴存比例或补贴，很可能是假涨薪。把单位缴纳部分计入总包，才算看清真实的\"营业收入\"。", "source": "来安县人民政府 (2023). 城镇职工社会保险政策解读. <https://www.laian.gov.cn/public/161054716/1110644935.html>; 苏州工业园区社保公积金 (2023). 城镇职工社会保险和住房公积金缴费及入账比例. <https://www.sipspf.org.cn/publish/main/210/2022/20220111112007000004791/20220111112007000004791_.html>", "note": "各地缴费比例与上下限不同，须以当地最新政策为准；公积金非法定强制但普遍提供，离职/换城须关注转移与断缴影响。"}, {"chapter": 19, "num": 1, "id": "19-1", "title": "省下的，就是税后收益", "grade": "B", "tags": {"钱": "0", "时间": "少", "毅力": "些", "收益": "中", "口径": "金钱", "影响": "自己／家庭"}, "impact": "自己／家庭", "cost_money": "0", "cost_time": "少", "cost_will": "些", "benefit": "中", "scope": "金钱", "three_zero": false, "cost": "对\"开源才是硬道理\"这一偏重的重新平衡，承认节流同样创造确定性收益。", "plain": "省 100 块，比投资赚 100 块更确定——不用本金、不担风险、还免税。本金少时，省比赚更划算；每少花 1 元，就多 1 元可投资本金。", "gain": "省下 100 元，等于净赚 100 元税后收入；而靠投资赚 100 元，得先有本金、承担波动、还要被税费啃掉一块。中国综合所得个税为 3%–45% 七级超额累进，边际税率越高，\"省下来\"相对\"赚出来\"的性价比越突出。以 2023 年数据算，居民人均可支配收入 39218 元、人均消费 26796 元，边际上每多省 1 元就多 1 元可投本金；若按 8% 长期年化，每月多省 500 元、投 30 年约变成 74 万元。对本金有限的人，节流是零风险、零税负的\"收益率\"，是投资复利的种子资金。它不改变你的风险，却直接扩大你下注的筹码。", "source": "国家统计局 (2024). 2023年居民收入和消费支出情况（人均可支配收入39218元、消费26796元）. <https://www.stats.gov.cn/sj/zxfb/202401/t20240116_1946622.html>; Thaler, R. (1985). Mental Accounting and Consumer Choice, Marketing Science 4(3):199–214（心理账户：省下的钱与赚到的钱在财富账户中等值）. <https://doi.org/10.1287/mksc.4.3.199>", "note": "局限：\"省\"有下限（基本生活与发展性开支不能砍），且过度抠门会损害生活质量与人际关系；本条强调的是在同等满足下消除浪费，而非压缩必要消费。交叉参考：条目 2、条目 4。"}, {"chapter": 19, "num": 2, "id": "19-2", "title": "生活方式通胀，悄悄吃掉本金", "grade": "B", "tags": {"钱": "0", "时间": "少", "毅力": "多", "收益": "中", "口径": "金钱", "影响": "自己／家庭"}, "impact": "自己／家庭", "cost_money": "0", "cost_time": "少", "cost_will": "多", "benefit": "中", "scope": "金钱", "three_zero": false, "cost": "收入涨一级、开销跟一级的惯性，需要持续克制才能打破。", "plain": "工资涨了，开销也跟着涨，最后还是存不下钱。想财务自由，收入涨的那块得分一部分进投资，别全拿去升级生活。", "gain": "收入提高后，消费往往同步升级（更大的房、更贵的车、更频繁的外食与订阅），储蓄率原地踏步，财务自由永远差一步。国家统计局数据显示，2023 年居民人均消费支出同比 +9.2%，反而快于可支配收入 +6.3% 的增速；国家金融与发展实验室（NIFD）《2023 年度中国杠杆率报告》指出当年居民储蓄率已降至 31.7%，消费增速明显跑赢收入。这背后正是\"生活方式通胀\"（lifestyle creep）：新增收入被即时消费升级吃掉。把每次涨薪的固定比例（如 50%）\"锁\"进投资账户，而非全升级生活，才能保住储蓄率。央行 2023 年调查亦显示居民储蓄意愿升至 58%–62%，说明防守心态浓厚，但意愿要落到\"自动划转\"的动作上才有效。", "source": "国家统计局 (2024). 2023年居民收入和消费支出情况（消费+9.2%快于收入+6.3%）. <https://www.stats.gov.cn/sj/zxfb/202401/t20240116_1946622.html>; 国家金融与发展实验室 NIFD (2024). 为\"名义\"而战：2023年度中国杠杆率报告（居民储蓄率降至31.7%）. <http://www.nifd.cn/Uploads/SeriesReport/7f9287b2-1405-4f24-a2d6-d7690c47fcf3.pdf>", "note": "局限：低收入阶段\"先改善生活\"本身合理，本条针对的是\"收入已涨、储蓄率却不涨\"的群体；建议用\"储蓄率目标\"（如固定 20%）反向约束消费。交叉参考：条目 1、条目 10。"}, {"chapter": 19, "num": 3, "id": "19-3", "title": "大额支出前，强制冷静期", "grade": "B", "tags": {"钱": "0", "时间": "少", "毅力": "些", "收益": "中", "口径": "金钱", "影响": "自己／家庭"}, "impact": "自己／家庭", "cost_money": "0", "cost_time": "少", "cost_will": "些", "benefit": "中", "scope": "金钱", "three_zero": false, "cost": "等待 24–72 小时（大件可拉长到 30 天）的克制。", "plain": "想买贵东西？先等一天。第二天还想要再买，大概率是真需要；等完不想买了，就是省下的钱。", "gain": "冲动消费发生在情绪高点，而情绪会退烧。行为研究显示，付款的\"痛感\"被信用卡、一键下单大幅麻醉——Prelec & Simester（2001）实验发现，同一件商品用信用卡支付时人们愿意出的价钱可比付现金高出近一倍（最高约 2 倍），因为卡片钝化了\"花钱的痛\"。反过来，人为插入一段冷静期，等于把被麻醉的痛感唤醒。业界汇总 Baymard Institute 横跨 49 项研究的购物车放弃率约 70%，说明\"付钱前停一下\"本就能拦下大多数购买。设一条硬规则——\"超过 X 元必须等一天/大件等 30 天\"——能拦截大量非理性支出，且零成本、零风险。它不靠意志力，靠的是把决策从\"热状态\"拖到\"冷状态\"。", "source": "Prelec, D. & Simester, D. (2001). Always Leave Home Without It: The Effect of Credit Cards on Willingness to Pay, Marketing Letters 12(1):5–13. <https://doi.org/10.1023/A:1010950306613>; Finlume (2024). 7 Psychology-Backed Strategies to Stop Impulse Buying（24小时/30天冷静期、购物车放弃率约70%来自Baymard）. <https://finlume.net/en/blog/reduce-impulse-buying-psychology>", "note": "局限：冷静期对\"真正刚需\"（如修冰箱）无意义，规则应只覆盖非必需消费；对成瘾性购物障碍需专业帮助。交叉参考：条目 9、条目 12。"}, {"chapter": 19, "num": 4, "id": "19-4", "title": "记账不为省钱，为看见漏洞", "grade": "B", "tags": {"钱": "少", "时间": "中", "毅力": "些", "收益": "中", "口径": "金钱", "影响": "自己／家庭"}, "impact": "自己／家庭", "cost_money": "少", "cost_time": "中", "cost_will": "些", "benefit": "中", "scope": "金钱", "three_zero": false, "cost": "每月记账的十几分钟到半小时（可用 App 自动同步银行流水降低）。", "plain": "记账不是为了抠门，是看清钱从哪漏的。那些几十块的外卖、打车、订阅，加起来可能是你最大的窟窿。", "gain": "记账的价值不是\"省\"，是暴露\"钱去哪了\"的结构。行为综述汇总的研究显示，定期记账者储蓄率比不记账者高约 40%，且支出低 15%–20%——注意，这甚至发生在\"没有刻意节食消费\"的情况下，纯靠\"被看见\"就改变了行为（观察者效应）。剑桥大学一项涉及 1.2 万人的研究同样发现，规律做财务监测的人储蓄更高、负债更少、财务压力更小。国家统计局 2023 年数据里，居民人均消费 26796 元，其中交通通信 +14.3%、教育文化娱乐 +17.6%、其他用品及服务 +17.1%，这些高频小额项最易被忽略；不记账，你永远只会记得\"我这个月没买大件\"，却看不见几十笔 30 元的漏洞。看见，才能堵。", "source": "Freenance (2025). Why Track Expenses — Scientific Arguments, Research, and Habits（汇总 Journal of Consumer Research 2019、University of Cambridge 2021：记账者储蓄率高约40%、支出低15–20%）. <https://freenance.io/guides/why-track-expenses-scientific-arguments>; 国家统计局 (2024). 2023年居民收入和消费支出情况. <https://www.stats.gov.cn/sj/zxfb/202401/t20240116_1946622.html>", "note": "局限：记账本身不产生收益，必须与\"看完后调整\"联动才有效；过度纠结小数点后两位反而增加负担，建议按月看大类占比即可。交叉参考：条目 1、条目 5。"}, {"chapter": 19, "num": 5, "id": "19-5", "title": "订阅制是慢性漏水", "grade": "B", "tags": {"钱": "少", "时间": "少", "毅力": "些", "收益": "中", "口径": "金钱", "影响": "自己／家庭"}, "impact": "自己／家庭", "cost_money": "少", "cost_time": "少", "cost_will": "些", "benefit": "中", "scope": "金钱", "three_zero": false, "cost": "每季度花几分钟导出银行卡/支付宝/微信的自动续费清单并清理。", "plain": "每个月那几十块的会员，忘了取消就一直扣。每季度清一遍自动续费，省下的常被严重低估。", "gain": "订阅是\"小额、高频、默认续费\"的典型漏水点，且人们系统性低估它。C+R Research 与 West Monroe 2023 年的调查均显示，美国人月均订阅实际花费约 219 美元，但自估仅 86 美元，低估幅度达 154%，84% 的人低估自己的订阅支出；SubScrub 2024 年汇总测算，人均每年在\"忘了取消\"的订阅上白白浪费约 348 美元。换算成人民币语境同样成立：视频、音乐、网盘、工具、自动续费会员，单价低但累积可观，且\"默认续费\"让人忘记取消。每季度做一次\"订阅审计\"，常能省下月度现金流的几个百分点——对一笔正在定投的资金来说，这部分省下的钱直接变成未来的本金，长期复利可观。", "source": "CBS News (2023). Experts suggest taking stock of how much your monthly subscriptions really cost（引 C+R Research、West Monroe：月均$219、低估$133、84%低估）. <https://www.cbsnews.com/amp/newyork/news/experts-suggest-taking-stock-of-how-much-your-monthly-subscriptions-really-cost-before-the-end-of-the-year>; SubScrub (2024). The Average Person Spends $348/Year on Forgotten Subscriptions（汇总 C+R Research 2023、West Monroe 2023）. <https://subscruber.com/blog/average-person-subscription-spending>", "note": "局限：订阅也有真实价值（正版软件、学习平台），审计目的不是全砍，而是清掉\"忘了用\"的那部分；可用信用卡账单的\"订阅\"分类一键排查。交叉参考：条目 4、条目 11。"}, {"chapter": 19, "num": 6, "id": "19-6", "title": "买体验比买东西更值", "grade": "A", "tags": {"钱": "少", "时间": "少", "毅力": "些", "收益": "中", "口径": "金钱", "影响": "自己／家庭"}, "impact": "自己／家庭", "cost_money": "少", "cost_time": "少", "cost_will": "些", "benefit": "中", "scope": "金钱", "three_zero": false, "cost": "把钱从\"囤物\"挪一部分到\"经历\"（旅行、课程、聚会、演出）。", "plain": "同样花钱，去一趟旅行留下的快乐，常比买个包更久。东西买完就习惯了，经历会陪你更长时间。", "gain": "同等金额花在\"经历\"还是\"实物\"上，幸福感差异显著。Van Boven & Gilovich（2003）发表在《Journal of Personality and Social Psychology》的研究，通过全国大样本调查与实验发现，人们回忆体验型消费（旅行、课程、聚会）比回忆实物消费获得更高的幸福感，且后续 15 年大量研究（Carter & Gilovich 2010、Kumar & Gilovich 2016 等）反复验证：体验更抗\"快乐适应\"、更容易被积极重构、更强化社会关系。中国科学院《心理学报》2019 年综述同样确认体验购买比物质购买更有效提升幸福感。对投资人的启示是：在非必需消费上，优先把钱花在\"经历\"而非\"摆设\"，既提升生活质量，又减少买完即贬值的实物积压——同样的钱，幸福产出更高，等价于\"更划算的消费\"。", "source": "Van Boven, L. & Gilovich, T. (2003). To Do or to Have? That Is the Question, Journal of Personality and Social Psychology 85(6):1193–1202. <https://db.cngb.org/data_resources/literature/14674824>; 中国科学院心理研究所 (2019). 怎样花钱更幸福？购买类型对幸福感的影响（综述 Van Boven & Gilovich 2003 等）. <https://journal.psych.ac.cn/xlkxjz/article/2019/1671-3710/1671-3710-27-12-2133.shtml>", "note": "局限：体验消费也需量力，且部分\"实物\"（乐器、运动装备）因能催生体验而近似体验型；本条反对的是为炫耀/囤积而买的纯实物。交叉参考：条目 7、条目 8。"}, {"chapter": 19, "num": 7, "id": "19-7", "title": "量力而行的\"贵\"，比将就的\"便宜\"更省", "grade": "B", "tags": {"钱": "少", "时间": "少", "毅力": "些", "收益": "中", "口径": "金钱", "影响": "自己／家庭"}, "impact": "自己／家庭", "cost_money": "少", "cost_time": "少", "cost_will": "些", "benefit": "中", "scope": "金钱", "three_zero": false, "cost": "为耐用品\"买对版本、一次到位\"做的判断与时间。", "plain": "有些东西买便宜的反复换，反而更贵；买对一次用多年才省。关键用品别将就，非关键的才该抠。", "gain": "关键耐用品（鞋、家电、工具、床垫）买便宜的次品，往往很快坏、反复换，总拥有成本（TCO，Total Cost of Ownership）反而更高。Consumer Reports 长期的可靠性测评反复显示，低价机型在故障率、维修成本上常不占优，一次买对、用上 5–10 年，摊薄到每年的成本常低于\"便宜→坏→再买\"的循环。反之，对快速迭代、低频使用的非关键品（快时尚、一次性小物），则不必追高配。核心是把钱分层：在\"高频使用、影响日常体验、维修贵\"的品类上敢花对的价格，在\"低频、可替代\"的品类上敢抠。这样既不降低生活质量，又避免被\"低价陷阱\"反复收割，长期总支出更低、且少受折腾。", "source": "Consumer Reports (持续). 产品可靠性与总拥有成本（TCO）评测（耐用品低价次品故障率与更换成本常高于一次买对）. <https://www.consumerreports.org/>; 国家金融与发展实验室 NIFD (2024). 2023年度中国杠杆率报告（居民更偏好安全资产、谨慎负债，与\"买对不买贵\"的稳健取向一致）. <http://www.nifd.cn/Uploads/SeriesReport/7f9287b2-1405-4f24-a2d6-d7690c47fcf3.pdf>", "note": "局限：TCO 判断需要经验，\"买贵\"不等于\"买对\"，应结合评测与自身使用频率；本条反对的是单纯因便宜而将就关键用品。交叉参考：条目 6、条目 10。"}, {"chapter": 19, "num": 8, "id": "19-8", "title": "炫耀性消费，是负收益投资", "grade": "B", "tags": {"钱": "少", "时间": "少", "毅力": "些", "收益": "中", "口径": "金钱", "影响": "自己／家庭"}, "impact": "自己／家庭", "cost_money": "少", "cost_time": "少", "cost_will": "些", "benefit": "中", "scope": "金钱", "three_zero": false, "cost": "为\"面子\"买单的冲动，需要识别并克制。", "plain": "买来显摆的东西，不赚钱还烧钱，真正懂的人也不看你这个。为面子花的钱，是财务上的负收益。", "gain": "为展示地位而买的东西（名包、豪车、超出需要的排场），既不产生现金流，还加速消耗本金，且在熟人圈外的\"信号\"价值极低。凡勃伦（Thorstein Veblen）1899 年在《有闲阶级论》（The Theory of the Leisure Class）中提出的\"炫耀性消费\"（conspicuous consumption）概念，至今被地位消费研究反复验证：这类支出更多服务于\"被看见\"，而非使用效用。对投资人的代价是直接侵蚀本可用于复利的本金——以 8% 年化计，花掉的 10 万元 30 年后本可变成约 100 万元；而炫耀品二手折价惊人，几乎必然净亏。把\"为别人眼光\"的预算，转为\"为自己现金流\"的投资，是性价比最高的身份升级。", "source": "Veblen, T. (1899). The Theory of the Leisure Class（《有闲阶级论》, 提出炫耀性消费）. <https://www.gutenberg.org/files/833/833-h/833-h.htm>; 中国科学院心理研究所 (2019). 怎样花钱更幸福？购买类型对幸福感的影响（地位/实物消费相对体验消费效用更低）. <https://journal.psych.ac.cn/xlkxjz/article/2019/1671-3710/1671-3710-27-12-2133.shtml>", "note": "局限：适度\"体面消费\"在社会场景中有真实功能，本条针对的是\"为显摆而超额、且牺牲储蓄\"的部分；信号价值因人而异。交叉参考：条目 6、条目 11。"}, {"chapter": 19, "num": 9, "id": "19-9", "title": "大件决策，用\"每小时工资\"换算", "grade": "B", "tags": {"钱": "0", "时间": "少", "毅力": "些", "收益": "中", "口径": "金钱", "影响": "自己"}, "impact": "自己", "cost_money": "0", "cost_time": "少", "cost_will": "些", "benefit": "中", "scope": "金钱", "three_zero": false, "cost": "把价格换成工时的习惯（一次设定，长期复用）。", "plain": "东西不贵 3000，但你时薪 100，等于要干 30 小时。问自己：为它干 30 小时值不值？很多伪需求瞬间现形。", "gain": "把一个 3000 元的消费除以时薪（如 100 元/时）= 30 小时生命。用\"我愿不愿意为它干 30 小时\"衡量，能过滤大量伪需求。这背后有两支硬研究支撑：其一是 Whillans 等（2017）发表于 PNAS 的《Buying Time Promotes Happiness》，证明人们普遍\"低估时间、高估金钱\"，主动用钱买时间（而非囤物）反而更幸福；其二是 Frederick 等（2009）提出的\"机会成本忽视\"（Opportunity Cost Neglect）——人在花钱时很少自动想到\"这钱本可去做别的事\"，一旦把价格显式换算成工时或\"放弃的别的目标\"，购买意愿会明显下降。时薪换算就是对抗这两种偏差的廉价工具：它把抽象价格变成你真实付出的生命时间，让伪需求当场现形。", "source": "Whillans, A. V., et al. (2017). Buying Time Promotes Happiness, PNAS 114(32):8523–8527. <https://www.pnas.org/doi/10.1073/pnas.1706541114>; Frederick, S., et al. (2009). Opportunity Cost Neglect, Journal of Consumer Research 36(4):553–561. <https://doi.org/10.1086/599764>", "note": "局限：时薪法对\"时间充裕但现金紧\"的人可能反向高估代价，需结合边际效用；自由职业者可用\"目标时薪\"而非账面时薪。交叉参考：条目 3、条目 12。"}, {"chapter": 19, "num": 10, "id": "19-10", "title": "延保、会员保险，大多负期望", "grade": "B", "tags": {"钱": "少", "时间": "少", "毅力": "些", "收益": "中", "口径": "金钱", "影响": "自己"}, "impact": "自己", "cost_money": "少", "cost_time": "少", "cost_will": "些", "benefit": "中", "scope": "金钱", "three_zero": false, "cost": "对\"加钱买安心\"保持警惕，下单前算一笔期望账。", "plain": "商家敢卖延保，是因为算过你大概率用不上、钱白给。小家电加延保基本是送钱；真该买保险的是病、死这种扛不住的。", "gain": "商家敢卖延保，是因为精算上它稳赚。内布拉斯加大学商学院（2023）援引 Consumer Reports 与 WarrantyWeek 数据指出，美国消费者每年在电器、电子、电脑、手机的延保/保护计划上花费约 230 亿美元，而零售商会把保费的 50% 以上直接留作利润；多数小家电与电子产品在延保覆盖的两年期内相当可靠，合同大多用不上。更关键的是，延保保的是\"低概率、低损失\"的维修，而真正该保的是\"低概率、高损失\"的风险（重疾、身故、意外）——前者是负期望的消费，后者才是正期望的保障。结论：除易摔的手机、高价且维修贵的设备外，多数延保不如把那笔钱存进\"自保基金\"。", "source": "University of Nebraska–Lincoln (2023). Nebraska Business Tip: Are Extended Warranties Needed?（引 Consumer Reports、WarrantyWeek：年花约230亿美元，零售留存≥50%）. <https://business.unl.edu/news/nebraska-business-tip-are-extended-warranties-needed/>; KSAT / Consumer Reports (2023). Read that warranty fine print before you spend big bucks（CR：多数延保不值，不如自留应急金）. <https://www.ksat.com/news/local/2023/10/13/read-that-warranty-fine-print-before-you-spend-big-bucks/>", "note": "局限：对高价、易损、维修极贵的设备，延保可能转为正期望；信用卡常附赠延长保修，先查权益再决定。交叉参考：条目 7、条目 14（保险配置章）。"}, {"chapter": 19, "num": 11, "id": "19-11", "title": "债务消费，是给未来的自己加税", "grade": "B", "tags": {"钱": "少", "时间": "少", "毅力": "多", "收益": "中", "口径": "金钱", "影响": "自己／家庭"}, "impact": "自己／家庭", "cost_money": "少", "cost_time": "少", "cost_will": "多", "benefit": "中", "scope": "金钱", "three_zero": false, "cost": "为当下快感透支未来的持续克制。", "plain": "刷信用卡买不急需的东西，等于借 10% 以上的高利，花掉未来的钱。这比不投资还糟——你是在倒贴利息。", "gain": "用信用卡、消费贷买非必要品，等于用高息把未来收入提前花掉，且利息复利滚动。监管规定信用卡透支利率上限为日利率万分之五，折合年化约 18.25%——这远高于股票、债券的长期预期回报，意味着\"借钱消费\"几乎必输给\"借钱投资\"的数学。国家金融与发展实验室（NIFD）《2023 年度中国杠杆率报告》显示，2023 年末居民存款规模达 137.9 万亿元（较上年增 16.7 万亿），居民资产负债表\"安全资产占比提升、风险资产占比下降\"，本质是去杠杆与谨慎负债；央行 2023 年调查亦显示居民投资偏好稳健（理财 43.9%、基金 21.5%、股票 15.3%）。对普通人，先还清高息消费债，再谈投资，顺序不能反——债务是确定性损耗，投资是不确定性收益。", "source": "国家金融与发展实验室 NIFD (2024). 2023年度中国杠杆率报告（居民存款137.9万亿、安全资产占比升、风险资产降）. <http://www.nifd.cn/Uploads/SeriesReport/7f9287b2-1405-4f24-a2d6-d7690c47fcf3.pdf>; 中国人民银行 (2023). 2023年第一季度城镇储户问卷调查报告（居民投资偏好：理财43.9%、基金21.5%、股票15.3%）. <https://www.cnr.cn/newscenter/native/gd/20230404/t20230404_526206104.shtml>", "note": "局限：房贷等低息、能形成资产的负债不在此列；本条针对的是消费性高息负债。透支利率上限\"日万分之五\"源自央行《关于信用卡业务有关事项的通知》（银发〔2016〕111号）。交叉参考：条目 1、条目 10。"}, {"chapter": 19, "num": 12, "id": "19-12", "title": "区分\"需要 / 想要 / 跟风\"三栏", "grade": "A", "tags": {"钱": "0", "时间": "少", "毅力": "些", "收益": "中", "口径": "金钱", "影响": "自己／家庭"}, "impact": "自己／家庭", "cost_money": "0", "cost_time": "少", "cost_will": "些", "benefit": "中", "scope": "金钱", "three_zero": false, "cost": "下单前的三秒归类（可做成手机备忘录三栏模板）。", "plain": "买之前停三秒：是必须、是想要、还是被人带节奏？跟风那栏占比越高，钱漏得越快。定期看这栏。", "gain": "把每笔支出归到三栏——生存必须的\"需要\"、提升质量的\"想要\"、纯粹被氛围带的\"跟风\"——能快速暴露财富漏洞。这一做法有坚实的行为基础：Thaler（1985）的\"心理账户\"（Mental Accounting）理论指出，人会把钱分门别类地记在不同账户里，若没有显式分类，\"跟风消费\"就会混进\"正常开销\"而被忽略；Frederick 等（2009）的\"机会成本忽视\"则证明，一旦把每笔钱显式标上\"它牺牲了什么\"，非理性支出会下降。实践中，把跟风栏占比当作\"漏水指标\"每月复盘，比例越高说明越容易被营销与环境带节奏。它和\"冷静期\"\"时薪换算\"是同一套工具箱：先分类、再冷却、最后用时间成本校验，三道防线叠加，冲动与跟风消费基本无处藏身。", "source": "Thaler, R. (1985). Mental Accounting and Consumer Choice, Marketing Science 4(3):199–214. <https://doi.org/10.1287/mksc.4.3.199>; Frederick, S., et al. (2009). Opportunity Cost Neglect, Journal of Consumer Research 36(4):553–561. <https://doi.org/10.1086/599764>", "note": "局限：三栏是\"觉察工具\"而非禁欲令，想要栏本就可适度保留；关键是让跟风栏可见、可控。交叉参考：条目 3、条目 9。"}, {"chapter": 20, "num": 1, "id": "20-1", "title": "应急金是投资的前提，不是可选项", "grade": "B", "tags": {"钱": "少", "时间": "少", "毅力": "些", "收益": "中", "口径": "金钱", "影响": "家庭"}, "impact": "家庭", "cost_money": "少", "cost_time": "少", "cost_will": "些", "benefit": "中", "scope": "金钱", "three_zero": false, "cost": "预留 3–6 个月必要生活开支的现金或货币基金（按月必要支出×3 或 ×6 计算，不含旅游、娱乐等非必要项）。", "plain": "没留应急金，一失业、一生病、一个意外，就得在资产低点割肉或借高息消费贷，把浮亏变成真亏。先把地基打牢——留够 3–6 个月生活费，再谈投资。这是所有投资的地基。", "gain": "没有应急金，任何一次失业、疾病或意外都会逼你在市场低点卖资产、或借高息债去覆盖开支，把\"暂时的账面亏损\"变成\"永久的本金损失\"。它是所有投资的安全垫：美国消费者金融保护局（CFPB）把应急金列为\"储蓄的第一步\"，强调即使小额也能避免用信用卡或贷款去覆盖突发支出、防止债务滚雪球；美联储 2020 年研究更指出，无法远程办公的家庭中位仅持有约 3 周收入的可动用储蓄，抗疫停工时极易陷入\"做不下去\"的境地。先有垫，才敢长期持有、才会在暴跌中不被迫卖出。", "source": "Consumer Financial Protection Bureau (2024). An essential guide to building an emergency fund. <https://www.consumerfinance.gov/an-essential-guide-to-building-an-emergency-fund/>; Board of Governors of the Federal Reserve System (2020). Financial Profiles of Workers Most Vulnerable to Coronavirus-Related Earnings Loss in the Spring of 2020 (FEDS 2020-093). <https://www.federalreserve.gov/econres/feds/files/2020093pap.pdf>", "note": "额度随收入稳定性调整——稳定双薪家庭 3 个月、自由职业/单一收入源建议 6 个月甚至更多；存于 FDIC 承保的货基或高息储蓄账户，与投资账户严格分离，不用于日常消费。"}, {"chapter": 20, "num": 2, "id": "20-2", "title": "市场暴跌时，现金是唯一 Option", "grade": "A", "tags": {"钱": "0", "时间": "少", "毅力": "些", "收益": "中", "口径": "金钱", "影响": "自己"}, "impact": "自己", "cost_money": "0", "cost_time": "少", "cost_will": "些", "benefit": "中", "scope": "金钱", "three_zero": false, "cost": "保持一部分随时能动用、且不用于日常消费的现金（占比视风险偏好，一般占总资产 5%–15%）。", "plain": "平时觉得持现金亏利息，崩盘时才知它是王。别人都没钱，你有现金就能捡便宜、也能活下去。", "gain": "现金在平静时看似\"浪费收益\"，在危机时价值连城。2008 年标普 500 自 2007 年 10 月高点 1565 跌至 2009 年 3 月低点 676、回撤约 57%（Argus Research）；2020 年新冠崩盘中，标普 500 仅 23 个交易日就从 3386 跌到 2237、跌幅 33.9%，并四度触发全市场熔断（Market Histories）。这种时刻，手握现金的人既能补仓捡便宜、也能扛过收入中断而不必贱卖资产——现金从\"低收益\"变为\"高权力\"，是危机里唯一随时能兑现的期权。", "source": "Argus Research (2015). Analyst Quick Notes（2007–2009 段：S&P 500 自 1565 跌至 676，跌幅 57%）. <https://www.argusresearch.com/dropbox/doc/20150825_2_QuickNotes.pdf>; Market Histories (2020). The COVID-19 Market Crash: The Fastest Bear Market in History. <https://www.markethistories.com/en/the-covid-19-market-crash-the-fastest-bear-market-in-history-2020>", "note": "现金不是\"零收益\"，而是保险式的看涨期权；比例过低则危机中无子弹，过高则长期跑输通胀与权益。它与应急金职能不同——应急金保生活，危机现金保机会与缓冲。"}, {"chapter": 20, "num": 3, "id": "20-3", "title": "崩盘时，别卖也别 All-in 抄底", "grade": "A", "tags": {"钱": "0", "时间": "少", "毅力": "中", "收益": "中", "口径": "金钱", "影响": "自己"}, "impact": "自己", "cost_money": "0", "cost_time": "少", "cost_will": "中", "benefit": "中", "scope": "金钱", "three_zero": false, "cost": "暴跌中的情绪定力（不操作也是一种操作）。", "plain": "暴跌最忌两件事：吓得割肉（亏变真），和一把梭抄底（接飞刀）。按原计划分批、拿住，比赌方向靠谱。", "gain": "恐慌抛售把\"暂时亏损\"变\"永久亏损\"；一次性 All-in 抄底则赌错就满仓接刀。DALBAR 长期追踪显示，普通股票基金投资者常年跑输指数：2024 年其收益 16.54% 而标普 500 回报 25.05%，差距达 848 个基点；J.P. Morgan 汇总数据亦显示，2004–2023 年全程持有年化 9.8%，但若错过涨幅最大的 10 天就只剩 5.6%——而最好的日子往往紧挨最差的日子。最稳的是按计划分批、不慌不卖，让时间修复，而不是用情绪去猜拐点。", "source": "DALBAR (2024). Quantitative Analysis of Investor Behavior (30th Annual)（平均股票投资者 16.54% vs 标普 500 25.05%）. <https://www.dalbar.com/?p=17875/>; Walnut Invest (2026). Investor Behavior Gap Statistics（错过最佳 10 天：年化 9.8%→5.6%）. <https://walnutinvest.com/stats/investor-behavior-gap>", "note": "本条目反对\"恐慌清仓\"与\"满仓抄底\"两种极端；提倡纪律化分批（如按既定再平衡阈值），而非预测底部——历史上的底都是事后才知道的。"}, {"chapter": 20, "num": 4, "id": "20-4", "title": "失业先砍支出到骨头，再谈投资", "grade": "B", "tags": {"钱": "0", "时间": "少", "毅力": "中", "收益": "中", "口径": "金钱", "影响": "家庭"}, "impact": "家庭", "cost_money": "0", "cost_time": "少", "cost_will": "中", "benefit": "中", "scope": "金钱", "three_zero": false, "cost": "断粮期的极致节流（暂停一切非必要消费与新增\"择时加仓\"）。", "plain": "失业了先砍开销、保住本金，别想着靠投资翻本。本金是你能翻身的本钱，乱动就真没了。", "gain": "收入中断时第一优先级是把支出压到生存线、保住应急金与投资本金不被挪用。2008 年大衰退中美国失业率从 2007 年 12 月的 5% 升至 2009 年 10 月的 10%（Argus Research）；2020 年 4 月失业率更飙到 14.7%、单月减少 2050 万就业岗位（BLS）。在这种冲击下靠投资\"翻本\"几乎必然失败，因为你需要用钱时恰逢资产低点。先砍支出、用应急金过桥，投资增值是\"有余力\"后才做的事，顺序绝不能反。", "source": "U.S. Bureau of Labor Statistics (2020). Commissioner's Statement on the Employment Situation（失业率 14.7%，非农就业减少 2050 万）. <https://www.bls.gov/news.release/archives/jec_05082020.htm>; Argus Research (2015). Analyst Quick Notes（2007–2009 失业率 5%→10%）. <https://www.argusresearch.com/dropbox/doc/20150825_2_QuickNotes.pdf>", "note": "失业期应暂停定投以外的\"择时加仓\"，优先恢复现金流（再就业/副业），避免为补仓而动用杠杆或提前支取养老金。"}, {"chapter": 20, "num": 5, "id": "20-5", "title": "多元收入来源，降低单一雇主风险", "grade": "B", "tags": {"钱": "少", "时间": "中", "毅力": "中", "收益": "中", "口径": "金钱", "影响": "自己／家庭"}, "impact": "自己／家庭", "cost_money": "少", "cost_time": "中", "cost_will": "中", "benefit": "中", "scope": "金钱", "three_zero": false, "cost": "开拓第二收入渠道的精力与时间（副业、技能变现、租金等）。", "plain": "全家的钱靠一份工资，等于把命押在一个老板身上。哪怕有个很弱的第二来源，关键时刻也能托底。", "gain": "只靠一份工资，等于把全部人力资本押在一个雇主上；被裁或行业收缩时毫无缓冲。2020 年新冠冲击中，美国总体失业率 4 月冲到 14.7%（BLS），Pew 调研显示 44.3% 的非传统/零工劳动者经历了工时削减或失业；而 MIT Sloan 研究发现，网约车等零工在失业后充当\"临时安全网\"，使失业者申领失业金的概率下降约 4.8%、负债相对减少约 544 美元。哪怕很弱的第二来源，也能在极端时托底、缩短\"断粮期\"。", "source": "The Pew Charitable Trusts (2020). More Than 40% of Nontraditional Workers Had Hours Cut or Lost Jobs Because of COVID-19（44.3% 受影响）. <https://pew.org/3n9JqOg>; MIT Sloan School of Management (2020). Gig economy serves as a safety net for unemployed（UI 申领概率 -4.8%，负债 -544 美元）. <http://live-mit-sloan.pantheonsite.io/press/mit-sloan-study-finds-gig-economy-serves-a-safety-net-unemployed>", "note": "第二收入不必高收入，关键是\"与主业低相关、可随时启动\"；避免用杠杆或高波动资产去博取第二收入，那会把风险加倍。"}, {"chapter": 20, "num": 6, "id": "20-6", "title": "受益人、遗嘱、授权，提前定", "grade": "B", "tags": {"钱": "少", "时间": "少", "毅力": "些", "收益": "中", "口径": "金钱", "影响": "家庭"}, "impact": "家庭", "cost_money": "少", "cost_time": "少", "cost_will": "些", "benefit": "中", "scope": "金钱", "three_zero": false, "cost": "把身后与失能安排写清楚的半小时（填表 + 定期更新）。", "plain": "受益人写谁、遗嘱怎么分、万一昏迷谁替你决定——现在花半小时定好，真出事家人少踩无数坑。别等出事才想。", "gain": "退休账户（401(k)、IRA）的受益人指定优先于遗嘱生效：未指定则账户进入遗产认证（probate），过程漫长且可能产生额外费用（Fidelity）。美国国税局（IRS）明确，受益人表单上的名字优先于遗嘱——\"as per my will\"在多数托管机构不被接受为有效指定；配偶还有法定优先权利。医疗授权（POA）与遗嘱不提前定，出事时家人要在混乱中面对法律摩擦、甚至争产。一次厘清，省下后代无数麻烦与情感消耗。", "source": "Internal Revenue Service (2024). Retirement Topics – Beneficiary（受益人表单优先于遗嘱）. <https://www.irs.gov/retirement-plans/plan-participant-employee/retirement-topics-beneficiary>; Fidelity (2024). What happens to your 401(k) when you die（未指定受益人将进入 probate）. <https://www.fidelity.com/learning-center/smart-money/what-happens-to-401k-when-you-die>", "note": "人生重大事件（结婚/离婚/生子/受益人去世）后务必更新；未成年受益人建议设信托或使用 per stirpes（按辈分）条款，避免资产被冻结或错配。"}, {"chapter": 20, "num": 7, "id": "20-7", "title": "杠杆在极端行情会清零你", "grade": "A", "tags": {"钱": "少", "时间": "少", "毅力": "中", "收益": "中", "口径": "金钱", "影响": "自己／家庭"}, "impact": "自己／家庭", "cost_money": "少", "cost_time": "少", "cost_will": "中", "benefit": "中", "scope": "金钱", "three_zero": false, "cost": "对\"加杠杆博收益\"的警惕（不使用融资融券、不借钱炒股）。", "plain": "平时杠杆让你赚得快，极端时一个反向波动就强制平仓、本金归零还倒欠。普通人家别碰杠杆，那是专业玩家的高压线。", "gain": "杠杆把\"可承受的回撤\"变成\"归零\"。1929 年散户普遍用 10% 保证金（约 10 倍杠杆）买股，崩盘后道指从 381 跌到 41、跌幅 89%，无数人因补不上保证金被强平、房产存款被追缴（Pomegra）；2008 年雷曼资产负债表杠杆一度超 30 倍，房价跌 20%+ 即资不抵债、终致破产（KeepRule）。对散户，10 倍杠杆下 10% 的反向波动就清零本金，强平还会在最低点把你甩出场、还倒欠券商钱——普通人远离杠杆。", "source": "Pomegra (2024). Leverage: The Great Amplifier of Market Crashes（1929 道指 381→41，-89%；银行 25–35 倍）. <https://pomegra.io/learn/library/track-f-lifecycle/market-history/chapter-01-why-history-matters/leverage-the-great-amplifier>; KeepRule (2024). 不要借钱投资（雷曼杠杆超 30 倍、2008 破产）. <https://keeprule.com/zh/principles/never-use-leverage>", "note": "A 股两融、港股/美股融资、期货期权都属杠杆；\"少用一点也安全\"不成立——50%+ 的极端跌幅下，任何杠杆都可能清零，且可能倒欠机构。"}, {"chapter": 20, "num": 8, "id": "20-8", "title": "流动性危机里，谁有现金谁定价", "grade": "A", "tags": {"钱": "0", "时间": "少", "毅力": "否", "收益": "中", "口径": "金钱", "影响": "自己"}, "impact": "自己", "cost_money": "0", "cost_time": "少", "cost_will": "否", "benefit": "中", "scope": "金钱", "three_zero": false, "cost": "理解危机时现金的话语权（并真留出现金）。", "plain": "危机时大家都缺钱、都在甩卖，有现金的人说了算，能捡最便宜的。没现金的只能贱卖。这就是现金在危机里的真价值。", "gain": "危机中资产抛售、价格失灵，只有手握现金的人能从容接货或周转；被动抛售者被迫接受最差价格。2008 年雷曼破产后全球信贷冻结、货基\"破净\"（Reserve Primary Fund 跌破 1 美元），连\"安全资产\"都被甩卖；2015 年 A 股股灾期间市场流动性降至股灾前 1/10 以下、出现 16 个\"千股跌停\"交易日，沪指 6 月 15 日至 7 月 3 日 15 个交易日跌 28%（百度百科）。现金在危机中从\"低收益\"变为\"高权力\"——别人被迫贱卖时，你有现金才能定价。", "source": "百度百科 (2015). 中国式股灾（流动性降至股灾前 1/10 以下，16 个千股跌停交易日）. <https://baike.baidu.com/item/中国式股灾/4324647>; Argus Research (2015). Analyst Quick Notes（2008 信贷市场冻结、雷曼破产）. <https://www.argusresearch.com/dropbox/doc/20150825_2_QuickNotes.pdf>", "note": "流动性枯竭往往发生在你最需要钱时；平时保持现金/货基，是危机中\"不被强平、还能捡便宜\"的门票。"}, {"chapter": 20, "num": 9, "id": "20-9", "title": "恐慌时远离屏幕，回归计划", "grade": "A", "tags": {"钱": "0", "时间": "少", "毅力": "中", "收益": "中", "口径": "金钱", "影响": "自己"}, "impact": "自己", "cost_money": "0", "cost_time": "少", "cost_will": "中", "benefit": "中", "scope": "金钱", "three_zero": false, "cost": "暴跌期少看盘的定力（关掉行情推送、设固定查看频率）。", "plain": "越跌越想看，越看越想动，一动就亏。关掉软件，回到你早就定好的计划——它不会因为今天跌了就失效。", "gain": "频繁盯盘在恐慌时会放大情绪、诱发误操作。Barber 与 Odean 经典研究《Trading Is Hazardous to Your Wealth》发现，过度交易因成本与择时失误显著拖累收益；CMC 白皮书引 DALBAR 数据指出，平均股票投资者每年跑输标普 500 约 1–8 个百分点，主因正是情绪化择时。你的长期计划不会因一天涨跌而变——关掉行情软件、回到既定配置与再平衡纪律，比实时盯盘更能保住收益。", "source": "CMC Markets (2025). Inside the Mind of the Trader（引 DALBAR：投资者每年跑输 1–8 个百分点）. <https://cdn.cmcmarkets.com/docs/whitepaper/en-nz/CMC_Inside_the_Mind_of_the_Trader.pdf>; DALBAR (2024). Quantitative Analysis of Investor Behavior. <https://www.dalbar.com/?p=17875/>", "note": "可设\"每月/每季查看一次\"的规则；暴跌日强制不看盘，把买卖决策权交给事前定好的再平衡阈值，而非当天的情绪。"}, {"chapter": 20, "num": 10, "id": "20-10", "title": "把\"最坏情况我能活\"写进计划", "grade": "B", "tags": {"钱": "0", "时间": "少", "毅力": "些", "收益": "中", "口径": "金钱", "影响": "家庭"}, "impact": "家庭", "cost_money": "0", "cost_time": "少", "cost_will": "些", "benefit": "中", "scope": "金钱", "three_zero": false, "cost": "事前做最坏情景推演（写下一页纸预案）。", "plain": "提前写清楚：失业半年、本金跌三成、重病，分别怎么扛。把\"活下去\"的路想明白，真出事就不慌、不瞎操作。", "gain": "预案里写明：若收入断 6 个月、若本金回撤 30%、若重病，分别怎么应对（砍哪笔支出、动哪笔储备、是否暂停定投）。美联储 2020 研究显示，无法远程办公的家庭中位仅持有约 3 周收入的可动用储蓄——这类家庭一旦停工即\"做不下去\"，正因缺预案。想清楚\"活下去\"的路径，恐慌时就不用临场拍脑袋割肉；预案把\"生存\"与\"投资\"的优先序提前定死，危机中只管执行。", "source": "Board of Governors of the Federal Reserve System (2020). Financial Profiles of Workers Most Vulnerable to Coronavirus-Related Earnings Loss (FEDS 2020-093)（中位仅 3 周收入储蓄）. <https://www.federalreserve.gov/econres/feds/files/2020093pap.pdf>; Consumer Financial Protection Bureau (2024). An essential guide to building an emergency fund. <https://www.consumerfinance.gov/an-essential-guide-to-building-an-emergency-fund/>", "note": "预案要具体到数字与动作，而非\"我会冷静\"；每年或每次人生重大变化后重做，并和配偶/家人对齐。"}, {"chapter": 20, "num": 11, "id": "20-11", "title": "灾后复原靠现金+不欠债，不靠抄底", "grade": "B", "tags": {"钱": "0", "时间": "少", "毅力": "否", "收益": "中", "口径": "金钱", "影响": "家庭"}, "impact": "家庭", "cost_money": "0", "cost_time": "少", "cost_will": "否", "benefit": "中", "scope": "金钱", "three_zero": false, "cost": "对\"危机是机会\"叙事的冷静（不举债抄底）。", "plain": "危机后谁能站起来，靠的是有现金、没欠债，不是抄到底。先把资产负债表保住不爆雷，比赌反弹实在。", "gain": "对普通人，危机后的复原力来自\"有现金、没杠杆、没断收入\"，而非精准抄底。2008 年标普 500 至 2009 年 3 月才见底、跌幅约 57%，此后数年才修复；2020 年崩盘后美联储与 2.2 万亿美元 CARES 法案托底，标普 500 到 8 月才收复新高（Convextrade）。能站起来的家庭，多是危机前没高息债、留了现金的那批——保住不负债的资产负债表，比赌反弹更可靠，也更少依赖\"神准抄底\"。", "source": "Convextrade (2020). Monthly Recap – March 2020（CARES Act 2.2 万亿美元，标普 8 月收复新高）. <https://convextrade.com/recap/monthly/2020-03>; Argus Research (2015). Analyst Quick Notes（2008 标普 -57%，2009-03 见底）. <https://www.argusresearch.com/dropbox/doc/20150825_2_QuickNotes.pdf>", "note": "复原力 = 资产负债表健康度，不是抄底技术；危机中优先降杠杆、补现金，而非追涨杀跌或加赌注。"}, {"chapter": 20, "num": 12, "id": "20-12", "title": "重大利空，区分\"暂时\"与\"永久\"", "grade": "A", "tags": {"钱": "少", "时间": "少", "毅力": "中", "收益": "中", "口径": "金钱", "影响": "自己"}, "impact": "自己", "cost_money": "少", "cost_time": "少", "cost_will": "中", "benefit": "中", "scope": "金钱", "three_zero": false, "cost": "对坏消息做性质判断的功课（先问：这是市场吓跌，还是基本面坏了）。", "plain": "跌了先判断：是市场吓跌（会回来）还是公司真坏了（回不来）。吓跌的该拿，真坏的该砍。把两者搞混，最亏。", "gain": "价格下跌分两种：市场情绪造成的\"暂时\"波动（会回），和基本面永久恶化的\"永久\"损失（不回）。巴菲特在伯克希尔年报中反复强调\"区分价格波动与价值损毁\"——短期市场是投票机、长期是称重机，永久损失来自企业经济特质恶化而非报价涨跌。2020 年新冠冲击属\"暂时\"外部冲击，标普 500 五个月即创新高；而 2008 雷曼式基本面崩塌则需多年修复。混为一谈最致命：吓跌时割肉、真坏时死扛。", "source": "Berkshire Hathaway (历年). Chairman's Letter to Shareholders（市场短期是投票机、长期是称重机；区分价格与价值）. <https://www.berkshirehathaway.com/letters/>; Market Histories (2020). The COVID-19 Market Crash（外部冲击，5 个月收复）. <https://www.markethistories.com/en/the-covid-19-market-crash-the-fastest-bear-market-in-history-2020>", "note": "判断依据是\"这家公司/指数赚的钱还在不在、是否在增长\"，而非\"今天又跌了几个点\"；单一持股的永久损失风险远高于宽基指数，分散持有能大幅降低\"永久损失\"概率。"}, {"chapter": 21, "num": 1, "id": "21-1", "title": "选指数基金三看：费率、规模、跟踪误差", "grade": "A", "tags": {"钱": "少", "时间": "少", "毅力": "些", "收益": "中", "口径": "金钱", "影响": "自己"}, "impact": "自己", "cost_money": "少", "cost_time": "少", "cost_will": "些", "benefit": "中", "scope": "金钱", "three_zero": false, "cost": "对比同类指数基金的费率、规模、跟踪误差三项，挑“三低一大”（低费率、低误差、低溢价、大规模）。", "plain": "指数基金跟踪同一指数，本质是同质化“容器”，长期收益差异几乎全来自成本。选规模大（流动性好、不易清盘）、费率低（管理费+托管费合计越低越好）、跟踪误差小（年化偏离指数越小越好）的，其余营销话术都是噪音。", "gain": "晨星 2026 年向美国国会作证时明确指出，“费用是预测基金未来表现最可靠的变量”，且其结论覆盖所有资产类别与时间区间均成立（Morningstar, 2026）。实证上，截至 2025 年底的 10 年中，最低费率五分位的主动基金有 31% 跑赢同类被动基准，而最高费率五分位仅 17%。以中国宽基 ETF 为例，管理费已从行业早期的 0.5% 普遍降至 0.15%（托管费 0.05%），即“0.15%+0.05%”成为主流；Wind 数据显示截至 2025 年末已有 384 只 ETF 管理费降至 0.15%（中国经济网, 2026）。假设年化收益 7%，费率从 0.5% 降到 0.2%，30 年后每 100 万元可多留存约 18%（复利差异），这就是“三看”里费率排第一位的理由。", "source": "Morningstar (2026). Morningstar to Congress: Investor Success Hinges on Lower Costs, Greater Transparency（美国众议院金融服务委员会资本市场小组委员会听证会证词，“From Wall Street to Main Street: The Future of How America Invests”，2026-06-25）. <https://www.morningstar.com/funds/morningstar-congress-investor-success-hinges-lower-costs-greater-transparency>; 中国经济网 (2026). 1500 多只 ETF 同台竞技 谁更胜一筹. <https://www.ce.cn/macro/more/202606/t20260603_3007591.shtml>; S&P Dow Jones Indices (2026). SPIVA Institutional Scorecard Year-End 2025. <https://www.spglobal.com/spdji/en/documents/spiva/spiva-institutional-scorecard-year-end-2025.pdf>", "note": "跟踪误差（tracking error）指基金收益相对基准指数的年化波动，是评判指数基金“复制精度”的核心指标；晨星 2026 年更新的 Medalist 评级中，被动基金“Process”支柱权重最高，重点考察相对基准的超额收益波动率即跟踪误差（Morningstar, 2026 Medalist 方法论）。费率与跟踪误差须同时看，低费率但误差大的“便宜货”未必划算。"}, {"chapter": 21, "num": 2, "id": "21-2", "title": "基金规模的两个极端都要躲", "grade": "B（清盘规则为 A 级硬性规定，规模与业绩负相关为统计规律，综合定级 B）", "tags": {"钱": "少", "时间": "少", "毅力": "些", "收益": "中", "口径": "金钱", "影响": "自己"}, "impact": "自己", "cost_money": "少", "cost_time": "少", "cost_will": "些", "benefit": "中", "scope": "金钱", "three_zero": false, "cost": "避开迷你基（清盘风险）与超大主动基（难超额）；指数基看规模下限，主动基看规模上限。", "plain": "规模太小有清盘红线，规模太大（尤其主动基）船大难掉头、难再跑赢指数。指数基可放宽，主动基过大也别追。", "gain": "《公开募集证券投资基金运作管理办法》第四十一条规定，开放式基金连续 60 个工作日出现“基金份额持有人数量不满 200 人”或“基金资产净值低于 5000 万元”情形的，基金管理人须向证监会报告并提出转换运作方式、合并或终止合同等方案（中国证监会, 2014/2026 现行）。实践中“迷你基”是清盘主力，且部分基金合同把 2 亿元设为自动清盘线（如中金 MSCI 中国 A 股红利 A，生效满 3 年净值低于 2 亿即终止），发起式基金则三年后净值低于 2 亿触发终止（中国经济网, 2022）。另一端，主动管理规模过大往往拖累超额收益——SPIVA 数据显示截至 2025 年底美国大盘主动基金 10 年跑输标普 500 比例达 85.59%、20 年达 92.89%（S&P, 2026），超大规模更难创造阿尔法。实操建议：指数基金规模最好在 20 亿以上（流动性足、清盘概率低），主动基金则警惕数百亿级的“巨无霸”。", "source": "中国证监会 (2014/2026). 公开募集证券投资基金运作管理办法（第四十一条）. <https://www.csrc.gov.cn/csrc/c106256/c1653978/content.shtml>; 中国经济网 (2022). 2022 年基金清盘超 200 只 这些机构数量多！投资者如何规避？. <https://finance.ce.cn/jjpd/jjpdgd/202212/21/t20221221_38300075.shtml>; S&P Dow Jones Indices (2026). SPIVA Institutional Scorecard Year-End 2025. <https://www.spglobal.com/spdji/en/documents/spiva/spiva-institutional-scorecard-year-end-2025.pdf>", "note": "清盘本身不等于本金亏损（清算按份额退还剩余资产），但会打断投资计划、产生税务与再配置成本；规模与业绩的负相关对指数基金不成立（指数基规模越大越稳），仅在主动基金上需警惕“规模诅咒”。"}, {"chapter": 21, "num": 3, "id": "21-3", "title": "A 类 vs C 类：持有期决定谁更省", "grade": "A", "tags": {"钱": "少", "时间": "少", "毅力": "些", "收益": "中", "口径": "金钱", "影响": "自己"}, "impact": "自己", "cost_money": "少", "cost_time": "少", "cost_will": "些", "benefit": "中", "scope": "金钱", "three_zero": false, "cost": "按预计持有期算一笔账，再决定买 A 还是 C；用“申购费 ÷ 销售服务费年化率”求临界点。", "plain": "别听“A 类永远好”。A 类收前端申购费、免销售服务费；C 类免申购费、收销售服务费。打算拿三年以上选 A，短炒选 C，先把临界点算出来。", "gain": "2025 年末证监会修订的《公开募集证券投资基金销售费用管理规定》拉平并降低了认申购费与销售服务费上限：主动偏股型认申购费不高于 0.8%、其他混合型不高于 0.5%、指数型与债券型不高于 0.3%（中国证监会, 〔2025〕22 号 第八条）；不收认申购费的份额可收销售服务费，股票型/混合型上限 0.4%/年、指数型/债券型上限 0.2%/年，且持有超 1 年的非货币基金不得继续收销售服务费（第十一条）。在此框架下，A/C 临界点 ≈ 申购费 ÷ 销售服务费年化率。例如某指数基金 A 类申购费 0.3%（常被打折到 0.15% 或 0）、C 类销售服务费 0.2%/年，则纯持有成本打平点约在 1.5 年；若 A 类申购费打一折为 0.03%、C 类 0.2%/年，临界点仅约 0.15 年，几乎任何持有都该选 A。结论：长期持有（>2 年）A 类几乎必胜，短线（<1 年）C 类更省，务必用基金官网费率表现算。", "source": "中国证监会 (2025). 公开募集证券投资基金销售费用管理规定（中国证监会公告〔2025〕22 号，第八条、第九条、第十一条）. <http://www.csrc.gov.cn/jiangxi/c105769/c7610821/7610821/files/%E3%80%8A%E5%85%AC%E5%BC%80%E5%8B%9F%E9%9B%86%E8%AF%81%E5%88%B8%E6%8A%95%E8%B5%84%E5%9F%BA%E9%87%91%E9%94%80%E5%94%AE%E8%B4%B9%E7%94%A8%E7%AE%A1%E7%90%86%E8%A7%84%E5%AE%9A%E3%80%8B%EF%BC%88%E8%AF%81%E7%9B%91%E4%BC%9A%E5%85%AC%E5%91%8A%E3%80%942025%E3%80%9522%E5%8F%B7%EF%BC%89.pdf>; 新华网 (2026-01-04). 销售费用管理新规出台 推动公募基金高质量发展. <https://www.news.cn/20260104/32676ea0f91440c498b90be39732c07a/c.html>", "note": "新规自 2026 年 1 月 1 日起施行，申购费常“打一折”（0.15%→0.015%）甚至平台补贴到 0，这会大幅压低 A 类临界点，使 A 类在更短持有期就占优；赎回费（持有<7 日 1.5%、<30 日 1%、<180 日 0.5%）两者都要付，不在 A/C 取舍内。"}, {"chapter": 21, "num": 4, "id": "21-4", "title": "ETF 溢价买入＝先亏一道", "grade": "B", "tags": {"钱": "少", "时间": "少", "毅力": "些", "收益": "中", "口径": "金钱", "影响": "自己"}, "impact": "自己", "cost_money": "少", "cost_time": "少", "cost_will": "些", "benefit": "中", "scope": "金钱", "three_zero": false, "cost": "交易前看盘口折溢价（对比 IOPV 净值），只在溢价率接近 0 时下单。", "plain": "ETF 有两个价：净值（IOPV，每 15 秒由成分股价格估算）和市价。市价比净值高就是溢价，这时候买等于先送钱；折价时买才捡便宜。", "gain": "ETF 的“净值”（IOPV）与“市价”（二级市场交易价）理论上由套利机制收敛，但短期供求失衡会制造折溢价。主流宽基 ETF（如沪深 300ETF、中证 A500ETF）因规模大、做市充分，折溢价多在 ±0.1%–0.5% 以内（华泰柏瑞等产品管理费+托管费已低至 0.15%+0.05%，见中国经济网, 2026），对长期持有影响可忽略。但高溢价时追入等于“先亏一道”：若以高于净值 2% 的价格买入，需等溢价收敛或净值上涨 2% 才能回本。监测方法很简单——行情软件直接显示“溢价率”，或对比买一价与 IOPV。建议普通定投者只在溢价率 ±0.3% 内下单；极端行情（如 2020 年原油 QDII、小微盘 ETF 炒作）溢价可飙至数个百分点甚至更高，务必回避。", "source": "中国经济网 (2026). 1500 多只 ETF 同台竞技 谁更胜一筹. <https://www.ce.cn/macro/more/202606/t20260603_3007591.shtml>; 华泰柏瑞基金 (2025). 沪深 300ETF(510300)/A500ETF(563360) 产品法律文件（管理费率 0.15%/年、托管费率 0.05%/年）. <https://finance.sina.com.cn/jjxw/2025-11-24/doc-infynrpa6640545.shtml>", "note": "折溢价幅度与流动性、额度、成分股停牌强相关；ETF 的套利机制在成分股停牌或外汇额度受限时会暂时失效（见条目 5 QDII），此时高溢价可能数周不收敛，不能机械抄底。"}, {"chapter": 21, "num": 5, "id": "21-5", "title": "QDII 额度紧时溢价可高达 5%–20%", "grade": "B", "tags": {"钱": "少", "时间": "少", "毅力": "些", "收益": "中", "口径": "金钱", "影响": "自己"}, "impact": "自己", "cost_money": "少", "cost_time": "少", "cost_will": "些", "benefit": "中", "scope": "金钱", "three_zero": false, "cost": "避开额度暂停、高溢价时的 QDII；买前看基金公告“是否暂停申购”与行情“溢价率”。", "plain": "想买海外基金却碰上“暂停申购＋高溢价”，宁可等额度放开，别在溢价顶端接盘。", "gain": "QDII 基金用外汇额度投资海外，当额度耗尽暂停申购、而投资者仍能在二级市场买卖时，供需失衡会把市价推离净值，形成高溢价。2020 年原油暴跌引发“抄底”潮，多只原油 QDII 在 3 月起暂停申购后溢价疯涨：易方达原油(161129) 2020-04-24 收盘价较净值溢价达 104.03%，南方原油(501018) 4 月 28 日溢价 109.22%，嘉实原油(160723) 4 月 24 日溢价 70.69%（新浪财经, 2020）；易方达原油至 2020-06-18 溢价仍有 27.50%（中国证券报, 2020-06-23）。即在“暂停申购＋额度紧”时，溢价可达 5%–100% 以上，追高者等于白送。即便非极端行情，额度边际紧张时 QDII 溢价也常达 2%–5%。对策：额度放开、溢价回落（趋近 0）后再入场；长期配置海外资产可优先选额度充裕、规模大的 QDII 或互认基金。", "source": "新浪财经 (2020-04-29). 最高溢价超 100% 3 只原油 QDII 基金集体停牌. <https://finance.sina.cn/money/lczx/2020-04-29/detail-iircuyvi0561172.d.html?cid=76646&vt=4>; 中国证券报 (2020-06-23). 易方达原油证券投资基金(QDII) 溢价风险提示公告. <https://epaper.cs.com.cn/zgzqb/html/2020-06/23/nw.D110000zgzqb_20200623_4-B060.htm>", "note": "QDII 高溢价本质是“想买买不到”的情绪溢价，待额度放开或基金恢复申购即快速收敛，与底层资产涨跌无关；因此溢价顶端买入是纯粹的摩擦损失，不属于投资判断。"}, {"chapter": 21, "num": 6, "id": "21-6", "title": "基金经理变更是隐性风险", "grade": "B", "tags": {"钱": "少", "时间": "少", "毅力": "些", "收益": "中", "口径": "金钱", "影响": "自己"}, "impact": "自己", "cost_money": "少", "cost_time": "少", "cost_will": "些", "benefit": "中", "scope": "金钱", "three_zero": false, "cost": "关注持仓基金的经理变动公告（基金公司官网/证监会信披平台），买前查“现任经理任职年限”。", "plain": "你买主动基，买的是“某个人能赚钱”，不是“某只代码能赚钱”。基金经理一换，过往业绩参考性骤降。", "gain": "主动基金的“阿尔法”高度绑定具体管理人。SPIVA 的 Persistence Scorecard 长期证明，过往优秀业绩极难延续：截至 2025 年底，2021 年末处于大类前四分之一的美国大盘基金，到 2025 年末“0.00%”仍留在前四分之一（S&P Dow Jones Indices, U.S. Persistence Scorecard Year-End 2025）——所谓“明星经理”的连续跑赢近乎随机。叠加人事变动，换帅后历史业绩基本失效：晨星研究显示，基金经理平均任职年限与基金家庭评级正相关，高评级母公司 5 年经理留存率多超 90%（Morningstar, 2026 Parent 数据），而一旦核心经理离职，原策略、归因与风险敞口都可能改变。实操建议：优先选任职 ≥5 年且团队稳定的产品；把经理变更公告设为关注，换帅后重新评估，切勿把“过去三年冠军”直接当成未来保证。", "source": "S&P Dow Jones Indices (2026). SPIVA U.S. Scorecard / U.S. Persistence Scorecard Year-End 2025. <https://www.spglobal.com/spdji/en/spiva/article/spiva-us>; Morningstar (2026). Parent-Level Medalist Data Points（经理任职与留存率）. <https://www.morningstar.com/en-gb/business/insights/blog/parent-pillar-data-points>", "note": "指数基金不受此风险影响（由规则而非人驱动），这是被动投资相对主动的又一大优势；对主动基金，基金合同中“投资目标/策略”是否随经理变更而变，比历史净值更值得读。"}, {"chapter": 21, "num": 7, "id": "21-7", "title": "基金风格漂移：看持仓别看名字", "grade": "B", "tags": {"钱": "少", "时间": "少", "毅力": "些", "收益": "中", "口径": "金钱", "影响": "自己"}, "impact": "自己", "cost_money": "少", "cost_time": "少", "cost_will": "些", "benefit": "中", "scope": "金钱", "three_zero": false, "cost": "定期（季报披露后）看前十大持仓与行业分布，对照合同载明的业绩比较基准。", "plain": "别信基金名字。每季度点开持仓，发现“蓝筹基满手新能源”“稳健基重仓小盘”就该警惕——它已偏离你的配置本意。", "gain": "基金名称是营销，实际持仓才是真相。风格漂移（style drift）指基金实际投资风格偏离其宣称/基准风格，会破坏投资者精心搭建的资产配置：你以为买的是“大盘价值”压舱石，结果它悄悄满仓成长股，组合整体的风险敞口就被悄悄放大。晨星在 2026 年更新的 Medalist 评级中，把“风格漂移”（style drift）与波动率一并纳入主动基金的量化评分（Morningstar, 2026 Medalist 方法论），足见其重要性。识别方法简单：①读季报“投资组合报告”的前十大重仓股与行业权重；②对比基金合同载明的“投资范围/业绩比较基准”；③用晨星风格箱（Morningstar Style Box）看实际被归为大盘/中盘/小盘、价值/成长哪一格。若连续两季明显偏离基准，应视为预警，考虑调仓或换成风格约束更硬的指数基金。", "source": "Morningstar (2026). Morningstar adds fee and 'fund manager success' to updated Medalist Rating methodology（含风格漂移指标）. <https://portfolio-adviser.com/morningstar-adds-fee-and-fund-manager-success-to-updated-medalist-rating-methodology>; 证券时报 (2024). 《微观量化百问》第十期——基金产品风险收益特征的常用评价指标. <https://stcn.com/article/detail/1322422.html>", "note": "风格漂移有时是经理“抱团追热点”的结果，牛市里不易察觉、熊市里会放大回撤；指数基金因跟踪误差约束，漂移幅度远小于主动基金，配置纪律性更强。"}, {"chapter": 21, "num": 8, "id": "21-8", "title": "打新／套利基金收益不可持续", "grade": "C（收益衰减为市场规律，但幅度与时点难以精确外推，定级 C）", "tags": {"钱": "少", "时间": "少", "毅力": "些", "收益": "中", "口径": "金钱", "影响": "自己"}, "impact": "自己", "cost_money": "少", "cost_time": "少", "cost_will": "些", "benefit": "中", "scope": "金钱", "three_zero": false, "cost": "不为“过去一年的打新/套利收益”买单，买前拆开收益来源，把打新增强从净值里剔除再看底仓真实能力。", "plain": "某基去年因打新多赚 3%，今年可能倒贴。把一次性红利当永久能力，是常见误判。", "gain": "网下打新、股指期货贴水套利、大宗折价等策略的收益高度依赖市场制度与资金面，具有明显“阶段性”。2020–2021 年科创板/创业板打新热潮时，部分“打新+固收”基金年化增强可达 3%–8%，但随参与机构增多、新股破发率上升，增强迅速衰减。注册制实施后破发常态化——2022 年新股破发率约 28%、2024 年回落至约 3%（不同统计口径），关键不在单年破发率，而在“打新收益≠永久阿尔法”。一旦策略拥挤或规则调整（如限售、报价新规），这部分收益会归零甚至因底仓波动而回吐。因此，评估含打新/套利成分的基金，应把“打新增强”剔除再看其底仓真实能力；若某基金卖点就是“打新神器”，多半不可作为长期核心持仓。", "source": "证券时报 (2024). 《微观量化百问》第十期——基金产品风险收益特征的常用评价指标（风险收益不可简单外推）. <https://stcn.com/article/detail/1322422.html>; 新华网 (2026-01-04). 销售费用管理新规出台 推动公募基金高质量发展（费率改革背景）. <https://www.news.cn/20260104/32676ea0f91440c498b90be39732c07a/c.html>", "note": "原文件引用“2022 约 28%、2024 约 3%”破发率为示例性行业统计，具体数值随口径不同而有差异；结论是定性的——一次性策略红利不可外推为长期收益，核心持仓应建立在可重复的底层能力上。"}, {"chapter": 21, "num": 9, "id": "21-9", "title": "FOF：双层收费，慎选", "grade": "B", "tags": {"钱": "少", "时间": "少", "毅力": "些", "收益": "中", "口径": "金钱", "影响": "自己／家庭"}, "impact": "自己／家庭", "cost_money": "少", "cost_time": "少", "cost_will": "些", "benefit": "中", "scope": "金钱", "three_zero": false, "cost": "看清 FOF 的“母基金费率＋子基金费率”叠加，先算综合持有成本。", "plain": "FOF 帮你选基，但收两次费。如果你自己能买两三只低费率指数，FOF 多半是纯加价。", "gain": "FOF（基金中基金）在底层基金费率之上再加一层母基金管理费与托管费，形成“双重收费”。按 2025 年新规，销售服务费与认申购费上限已下调（指数/债券型销售服务费 ≤0.2%/年，见中国证监会〔2025〕22 号），但 FOF 的母基金那一层管理费通常仍有 0.6%–1.0%/年，叠加子基金 0.15%–0.5%/年，综合持有成本常达 1%–1.5%/年，远高于直接买两三只 0.2% 费率的宽基 ETF（Caixin Global, 2026 指出中国 ETF 已有 370 余只综合费率低至 0.2%/年）。晨星证词亦强调费用是未来表现最可靠的预测变量，成本越高越拖累长期复利（Morningstar, 2026）。FOF 的价值仅在“帮你做资产配置/选基”且该项能力真能跑赢双重收费时才成立——对能自行配置低费率指数的投资者，FOF 多半是纯加价。建议：先算综合费率，再问自己“它的选基/再平衡能力，值不值这每年多出的 0.8–1.3 个百分点？”", "source": "中国证监会 (2025). 公开募集证券投资基金销售费用管理规定（中国证监会公告〔2025〕22 号，第十一条）. <http://www.csrc.gov.cn/jiangxi/c105769/c7610821/7610821/files/%E3%80%8A%E5%85%AC%E5%BC%80%E5%8B%9F%E9%9B%86%E8%AF%81%E5%88%B8%E6%8A%95%E8%B5%84%E5%9F%BA%E9%87%91%E9%94%80%E5%94%AE%E8%B4%B9%E7%94%A8%E7%AE%A1%E7%90%86%E8%A7%84%E5%AE%9A%E3%80%8B%EF%BC%88%E8%AF%81%E7%9B%91%E4%BC%9A%E5%85%AC%E5%91%8A%E3%80%942025%E3%80%9522%E5%8F%B7%EF%BC%89.pdf>; Caixin Global (2026-03-11). Lower Fees, Bigger Gains: How China's ETF Fee Reform Is Putting Money Back in Investors' Pockets. <https://www.caixinglobal.com/2026-03-11/lower-fees-bigger-gains-how-chinas-etf-fee-reform-is-putting-money-back-in-investors-pockets-102421888.html>; Morningstar (2026). Morningstar to Congress: Investor Success Hinges on Lower Costs, Greater Transparency. <https://www.morningstar.com/funds/morningstar-congress-investor-success-hinges-lower-costs-greater-transparency>", "note": "养老目标 FOF 因享有税优/默认投资便利，双重收费的性价比需结合政策红利单独评估；普通 FOF 若仅做“股债 60/40”式配置，自己买 ETF 组合通常更便宜。"}, {"chapter": 21, "num": 10, "id": "21-10", "title": "债券基金也分三六九等", "grade": "B", "tags": {"钱": "少", "时间": "少", "毅力": "些", "收益": "中", "口径": "金钱", "影响": "自己"}, "impact": "自己", "cost_money": "少", "cost_time": "少", "cost_will": "些", "benefit": "中", "scope": "金钱", "three_zero": false, "cost": "分清纯债／一级债／二级债／可转债基，看招募说明书“投资范围”里的股票+可转债占比。", "plain": "“稳健”两个字覆盖不了债基的全部。纯债近乎稳，可转债基可能一年波动 20%，买前看清含多少权益。", "gain": "债基按“含权比例”风险收益天差地别：①纯债基金（只投债券）年化波动通常 1%–3%，最大回撤多在 2% 以内，近似“稳健”；②一级债（可打新/可转债）波动略升；③二级债（最高 20% 投股票）年化波动约 3%–6%，最大回撤可到 5%–10%；④可转债基金因正股属性，年化波动可达 15%–25%，单年回撤超 20% 并不罕见（与股市高度联动）。判定方法最直接：读基金合同“投资范围/比例”——股票+可转债占比越高，风险越接近权益。监管亦按资产类别差异化定价：指数型/债券型认申购费上限 0.3%、销售服务费上限 0.2%/年（中国证监会〔2025〕22 号），但这是“收费”分类而非“风险”分类，不能据此判断波动。结论：用债基做“压舱石”应选纯债/短债；想要增强收益可接受二级债；把可转债基当“类股票”对待，别被“债”字误导。", "source": "中国证监会 (2025). 公开募集证券投资基金销售费用管理规定（中国证监会公告〔2025〕22 号，第八条、第十一条）. <http://www.csrc.gov.cn/jiangxi/c105769/c7610821/7610821/files/%E3%80%8A%E5%85%AC%E5%BC%80%E5%8B%9F%E9%9B%86%E8%AF%81%E5%88%B8%E6%8A%95%E8%B5%84%E5%9F%BA%E9%87%91%E9%94%80%E5%94%AE%E8%B4%B9%E7%94%A8%E7%AE%A1%E7%90%86%E8%A7%84%E5%AE%9A%E3%80%8B%EF%BC%88%E8%AF%81%E7%9B%91%E4%BC%9A%E5%85%AC%E5%91%8A%E3%80%942025%E3%80%9522%E5%8F%B7%EF%BC%89.pdf>; 证券时报 (2024). 《微观量化百问》第十期——基金产
