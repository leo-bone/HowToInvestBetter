"}, {"num": 18, "label": "人力资本", "title": "第十八章 职场与人力资本", "file": "book/18-人力资本.md", "count": 12, "type": "entries"}, {"num": 19, "label": "消费记账", "title": "第十九章 消费与记账", "file": "book/19-消费记账.md", "count": 12, "type": "entries"}, {"num": 20, "label": "极端情形", "title": "第二十章 极端情形与黑天鹅", "file": "book/20-极端情形.md", "count": 12, "type": "entries"}, {"num": 21, "label": "基金选择实操", "title": "二十一、基金选择实操（把“买什么基”拆细）", "file": "book/21-基金选择实操.md", "count": 11, "type": "entries"}, {"num": 22, "label": "固定收益细节", "title": "二十二、固定收益细节（钱的安全垫怎么放）", "file": "book/22-固定收益细节.md", "count": 10, "type": "entries"}, {"num": 23, "label": "全球与ETF配置", "title": "二十三、全球与 ETF 配置（把你从单一市场里松绑）", "file": "book/23-全球与ETF配置.md", "count": 10, "type": "entries"}, {"num": 24, "label": "衍生品杠杆风险", "title": "二十四、衍生品与杠杆工具风险（普通人最该绕开的坑）", "file": "book/24-衍生品杠杆风险.md", "count": 8, "type": "entries"}], "entries": [{"chapter": 1, "num": 1, "id": "1-1", "title": "不买说不清“钱从哪来”的东西", "grade": "A", "impact": "自己", "cost_money": "无", "cost_time": "低", "cost_will": "无", "three_zero": false, "spend": "几分钟想清底层资产与现金流。", "gain": "避开绝大多数骗局与归零标的。任何回报都必须来自真实价值创造（盈利／利息／租金／分红），答不上来源的多半是旁氏或接盘。", "source": "SEC《Ask Questions》(investor.gov)；证监会《证券期货投资者适当性管理办法》。", "plain": "你投出的每块钱都要答得上“它靠什么生钱”。答不上来的，大概率是别人的收益来自你的本金。成本近乎零，收益是“不归零”。", "notes": []}, {"chapter": 1, "num": 2, "id": "1-2", "title": "单一标的集中持仓＝邀请永久性损失", "grade": "B", "impact": "自己／家庭", "cost_money": "无", "cost_time": "低", "cost_will": "低", "three_zero": false, "spend": "放弃全仓牛股的暴富想象（机会成本）。", "gain": "把单点黑天鹅（退市／造假／倒闭）对总资产的杀伤从“可能归零”降到可承受。持有 20–30 只不同行业标的即可消除约 90% 个股特有风险。", "source": "Markowitz (1952)《Portfolio Selection》, Journal of Finance（诺奖）。", "plain": "分散不提高期望回报，但保命。一个公司可能没了，一个市场长期不会没。把身家压一只股票，是用永久损失赌超额收益，赔率极差。", "notes": []}, {"chapter": 1, "num": 3, "id": "1-3", "title": "杠杆先放大“出局”概率", "grade": "A", "impact": "自己／家庭", "cost_money": "无", "cost_time": "低", "cost_will": "低", "three_zero": false, "spend": "利息 + 强平（margin call）时割在最低点。", "gain": "理论放大收益，但实证上散户用杠杆多为净亏损，底部被强平后永久出局、连回本机会都没有。", "source": "SEC《Margin Rules》警示；Barber & Odean 高频+杠杆组合最致命。", "plain": "无杠杆，跌 50% 你还在牌桌、涨回只需 +100%；加了杠杆，跌 50% 可能已被平仓。杠杆把“波动”变成“死亡”。", "notes": []}, {"chapter": 1, "num": 4, "id": "1-4", "title": "用短期要用的钱做长期投资＝定时炸弹", "grade": "C", "impact": "自己／家庭", "cost_money": "无", "cost_time": "低", "cost_will": "低", "three_zero": false, "spend": "一点流动性规划（先留应急金）。", "gain": "避免在熊市最低点被迫卖出——散户“实际回报远低于市场”的核心原因之一。", "source": "Dalbar QAIB；IMF 家庭流动性与危机研究。", "plain": "明年后年要用的钱不该在股市。市场不配合你的用钱时间表，强行短钱长投等于把“何时卖”交给运气和熊市。", "notes": []}, {"chapter": 1, "num": 5, "id": "1-5", "title": "不熟不投，非标资产默认不碰", "grade": "C", "impact": "自己", "cost_money": "无", "cost_time": "无", "cost_will": "无", "three_zero": true, "spend": "放弃“听来的机会”。", "gain": "避开流动性为零、信息不透明的非标坑（私募瑕疵、艺术品、邮币卡、非标理财）。", "source": "SEC 私募风险披露；证监会防范非标理财警示。", "plain": "非标＝没有公开价格、难变现、信息黑箱。你图它高息，它图你本金。成本为零，收益是“不踩雷”。", "notes": []}, {"chapter": 1, "num": 6, "id": "1-6", "title": "自己不懂的衍生品（期权／期货／雪球）不开户", "grade": "B", "impact": "自己／家庭", "cost_money": "无", "cost_time": "低", "cost_will": "低", "three_zero": false, "spend": "放弃“高杠杆收益”的想象。", "gain": "避开负和博弈。多数期权买方长期亏损（时间价值持续衰减），“雪球”在敲入时亏损无底。", "source": "Hull《Options, Futures and Other Derivatives》关于时间价值衰减；监管对雪球类产品的适当性警示（2022–2024 多次敲入，部分投资者本金亏损 30%–70%）。", "plain": "衍生品是专业机构的对冲工具，不是散户的提款机。你以为在抄底，机构在收时间价值。", "notes": [{"type": "争议", "text": "极少数策略（备兑开仓、保护性认沽）对专业持股者有用，但对普通人净负，且需持续管理。"}]}, {"chapter": 1, "num": 7, "id": "1-7", "title": "不预测宏观、不赌单边方向", "grade": "C", "impact": "自己", "cost_money": "无", "cost_time": "低", "cost_will": "低", "three_zero": false, "spend": "放弃“满仓押涨跌”的刺激。", "gain": "避免在错的方向上加错仓位。宏观预测准确率长期接近随机（多家机构回测）。", "source": "多机构“宏观预测准确性”回测研究（多家机构 CPI/GDP 预测误差显著，长期接近随机）。", "plain": "连央行都预测不准利率，你凭什么赌对？把赌方向改成“无论哪种环境都有配置应对”，是把胜负手交还给概率。", "notes": []}, {"chapter": 1, "num": 8, "id": "1-8", "title": "复杂结构化产品默认不碰", "grade": "C", "impact": "自己／家庭", "cost_money": "无", "cost_time": "低", "cost_will": "无", "three_zero": false, "spend": "放弃“带杠杆的高收益”包装。", "gain": "避开条款嵌套、收益上限封死、风险敞口说不清的产品（如某些“雪球”、收益凭证、分级）。", "source": "证监会适当性管理与产品风险揭示规则；SEC 复杂产品警示。", "plain": "产品越复杂，越利于卖方隐藏对你不利的那条。看不懂第 7 层嵌套的，默认不买。", "notes": []}, {"chapter": 1, "num": 9, "id": "1-9", "title": "用“可解释测试”卡掉每笔投资", "grade": "C", "impact": "自己", "cost_money": "无", "cost_time": "低", "cost_will": "无", "three_zero": false, "spend": "下单前多问一句“我凭什么觉得能赚”。", "gain": "把“听消息、凭感觉、追热点”挡在门外，只留下能写出逻辑链的标的。", "source": "行为金融“事前检验清单”研究（checklist 降低决策错误）。", "plain": "能在一张纸上写清“买它赚的钱从谁口袋来、我比市场多知道什么”的，才值得投。写不出的，就是赌。", "notes": []}, {"chapter": 1, "num": 10, "id": "1-10", "title": "朋友／熟人荐股：你天然在信息劣势侧", "grade": "B", "impact": "自己", "cost_money": "无", "cost_time": "低", "cost_will": "低", "three_zero": false, "spend": "放弃“内部消息”的诱惑。", "gain": "避开接盘。A 股约 84.6% 的月均交易 20 次以上账户亏损、持仓不足 1 月盈利概率仅 9.3%——频繁交易与听消息是散户亏损主因。", "source": "上交所统计年鉴；施东辉／张晓燕等 5340 万账户实证研究。", "plain": "真有稳赚消息，对方凭什么告诉你而非自己重仓？你听到的“机会”，往往是别人要找下家接盘的时点。熟人背书不是安全垫。", "notes": []}, {"chapter": 1, "num": 11, "id": "1-11", "title": "内幕交易是刑事红线，不是“小聪明”", "grade": "A", "impact": "自己／家庭", "cost_money": "无", "cost_time": "低", "cost_will": "低", "three_zero": false, "spend": "放弃“提前知道消息”的捷径。", "gain": "避免没收违法所得＋1–10 倍罚款，情节严重追究刑责（刑法第 180 条，情节严重的处 5 年以下、特别严重的 5–10 年）。", "source": "《证券法》第 53 条（禁止）、第 191 条（处罚）；《刑法》第 180 条（内幕交易罪）。", "plain": "靠消息炒股，赚的是刀口钱。一旦立案，本金没收、罚款翻倍、还可能坐牢。这笔“收益”的代价是确定性坐实的风险。", "notes": []}, {"chapter": 1, "num": 12, "id": "1-12", "title": "卖方研报／评级自带立场，当信息而非结论", "grade": "B", "impact": "自己", "cost_money": "无", "cost_time": "低", "cost_will": "低", "three_zero": false, "spend": "一点独立判断，不照研报“买入”评级下单。", "gain": "避开“买在推荐高点”。卖方靠分仓佣金与承销收入，天然偏多；反向指标效应常见。", "source": "SEC 关于分析师利益冲突研究；多项“分析师推荐后超额收益为负”实证。", "plain": "研报给你的是“为什么涨”的逻辑素材，不是“该买”的指令。把它当情报，不当指令。", "notes": []}, {"chapter": 1, "num": 13, "id": "1-13", "title": "付费荐股群／直播带单是监管红线", "grade": "A", "impact": "自己", "cost_money": "无", "cost_time": "低", "cost_will": "低", "three_zero": false, "spend": "放弃“跟着老师赚”的幻想。", "gain": "避开非法荐股与杀猪盘。无牌照荐股、承诺收益均属违法，参与者本金常血本无归。", "source": "《证券法》第 120、160 条（需持牌）；证监会历年非法荐股专项整治。", "plain": "真能稳定赚钱的人不会拉群收你会员费。收费带单＝先收你的钱，再拿你当流动性。", "notes": []}, {"chapter": 1, "num": 14, "id": "1-14", "title": "先搞清楚“我是谁的交易对手”", "grade": "C", "impact": "自己", "cost_money": "无", "cost_time": "低", "cost_will": "低", "three_zero": false, "spend": "下单前想一秒对手方。", "gain": "识别自己在赌谁犯错。散户在二级市场多是对手盘博弈，机构有信息、成本、速度三重优势。", "source": "市场微观结构研究；行为金融。", "plain": "你买的，是别人卖的。问一句“对方为什么愿意卖给我”，答不上来就别买。", "notes": []}, {"chapter": 1, "num": 15, "id": "1-15", "title": "把“名人／大 V 持仓”当背书默认无效", "grade": "C", "impact": "自己", "cost_money": "无", "cost_time": "低", "cost_will": "低", "three_zero": false, "spend": "放弃“抄大佬作业”的捷径。", "gain": "避开滞后接盘与“抬轿”。公开持仓有披露时滞，且大佬的仓位、成本、久期你都不知道。", "source": "13F 等持仓披露滞后研究；行为金融“权威偏差”。", "plain": "你看到大 V 的持仓时，他可能已经在减仓。抄作业抄的是别人的历史，不是未来。", "notes": []}, {"chapter": 2, "num": 1, "id": "2-1", "title": "基金费率是确定性最高的“负回报”", "grade": "A", "impact": "自己／后代", "cost_money": "低", "cost_time": "无", "cost_will": "低", "three_zero": false, "spend": "每年 0.5%–2% 管理费／托管费，直接从资产扣。", "gain": "几乎零额外收益——费率与未来业绩显著负相关。1% 年费率在 30 年 7% 年化下吃掉约 26% 终值；2% 吃掉约 45%。", "source": "Carhart (1997)《On Persistence in Mutual Fund Performance》, Journal of Finance；SPIVA。", "plain": "费率是唯一提前确定的扣减。先把它压到最低，比挑牛基实在。", "notes": []}, {"chapter": 2, "num": 2, "id": "2-2", "title": "佣金、印花税、申赎费：复利杀手", "grade": "B", "impact": "自己", "cost_money": "低", "cost_time": "低", "cost_will": "低", "three_zero": false, "spend": "每次买卖显性费用。A 股卖出印花税 0.05%（2023.8 起减半），佣金最低约 0.025%，ETF 免印花税。", "gain": "减少无谓换手，把摩擦从“每年 1%+ ”压到近零。", "source": "财政部印花税文件；Barber & Odean (2000) 换手率与净收益。", "plain": "每月买卖几次，摩擦一年吞 1%–3%，二十年是巨大差距。你给券商和税务局打工的比例，跟换手率成正比。", "notes": []}, {"chapter": 2, "num": 3, "id": "2-3", "title": "先把钱放进税优／免税账户", "grade": "B", "impact": "自己／后代", "cost_money": "低", "cost_time": "低", "cost_will": "低", "three_zero": false, "spend": "一点开户与额度规划。中国个人养老金每年限额 12000 元，递延纳税。", "gain": "递延／免除部分税负；同时锁定“长期钱”，反向治手痒。", "source": "财政部 税务总局 2022 年第 34 号公告；IRS 关于 IRA／401(k) 说明（境外参考）。", "plain": "同样年化，税后和税前差一截。能合法递延的税就是免费复利加速器；且养老账户“取出来麻烦”，正好管住手。", "notes": []}, {"chapter": 2, "num": 4, "id": "2-4", "title": "分红再投资，别拿现金", "grade": "C", "impact": "自己", "cost_money": "无", "cost_time": "无", "cost_will": "无", "three_zero": true, "spend": "勾选一个选项（零成本）。", "gain": "分红继续滚复利。A 股持股超 1 年股息红利免税，更该复投。", "source": "财税部 税务总局股息红利差别化政策；复利理论。", "plain": "分红是资产一部分，拿现金等于自动减仓放弃后续上涨。除非靠股息生活，默认“红利再投资”。", "notes": []}, {"chapter": 2, "num": 5, "id": "2-5", "title": "ETF 优于场外申赎基金（同策略下）", "grade": "B", "impact": "自己", "cost_money": "低", "cost_time": "低", "cost_will": "低", "three_zero": false, "spend": "需要一个证券账户（一次性）。", "gain": "费率更低（宽基 ETF 0.03%–0.5%/年 vs 主动场外 1%–1.5%）、交易透明、免印花税。", "source": "基金费率对比数据；监管 ETF 运作指引。", "plain": "同样买沪深300，场内 ETF 费率常是场外基金的三分之一到一半。长期差出来的就是你的净收益。", "notes": []}, {"chapter": 2, "num": 6, "id": "2-6", "title": "QDII／海外资产的汇率与额度成本", "grade": "B", "impact": "自己", "cost_money": "低", "cost_time": "低", "cost_will": "低", "three_zero": false, "spend": "汇率摩擦 + 申赎时间长（T+数日）+ 额度紧时溢价。", "gain": "分散单一货币／经济体风险；但汇率可能吃掉或放大收益。", "source": "央行汇率风险研究；QDII 额度溢价案例（2020–2021 额度紧时部分产品溢价 5%–20%）。", "plain": "买美股基金不只为赚美股，也为对冲人民币风险。但汇率是双向的，别把它当纯增强。", "notes": [{"type": "争议", "text": "配置价值真实，但择时汇率纯属赌；多数人长期持有应忽略短期汇率波动。"}]}, {"chapter": 2, "num": 7, "id": "2-7", "title": "隐性费用比显性费用更贵", "grade": "C", "impact": "自己", "cost_money": "低", "cost_time": "低", "cost_will": "低", "three_zero": false, "spend": "一点读合同／招募说明书的精力。", "gain": "避开销售服务费、尾随佣金、申购费打折陷阱、自动投顾隐形管理费。", "source": "基金信息披露规则；SEC 关于基金费用披露要求。", "plain": "显性的管理费你看得见，隐性的“各种服务费”才咬人。费率表里每一行小字，都是你未来的负收益。", "notes": []}, {"chapter": 2, "num": 8, "id": "2-8", "title": "基金转换与赎回费的隐性损耗", "grade": "C", "impact": "自己", "cost_money": "低", "cost_time": "低", "cost_will": "低", "three_zero": false, "spend": "频繁在基金间“转换”时被收的赎回费与销售服务费。", "gain": "把“用脚投票”的成本压下来，避免被短期排名诱导反复横跳。", "source": "基金运作费用披露规则；行为金融“追逐业绩”研究。", "plain": "很多平台把“转换”包装得零成本，实际可能收赎回费+新申购费。看清算总成本再动。", "notes": []}, {"chapter": 2, "num": 9, "id": "2-9", "title": "警惕“基金超市”里的销售导向陷阱", "grade": "C", "impact": "自己", "cost_money": "无", "cost_time": "低", "cost_will": "低", "three_zero": false, "spend": "一点独立判断，不盲信平台“热销／推荐”标签。", "gain": "避开被流量推到眼前的、费率偏高或风格漂移的产品。", "source": "基金销售适当性规定；SEC 关于平台推荐利益冲突警示。", "plain": "平台“为你推荐”的第一动机是它自己的佣金，不是你的收益。排序权在自己手里。", "notes": []}, {"chapter": 2, "num": 10, "id": "2-10", "title": "真费率是“管理费＋托管费＋销售服务费”之和", "grade": "A", "impact": "自己／后代", "cost_money": "低", "cost_time": "低", "cost_will": "低", "three_zero": false, "spend": "读一眼招募说明书的“费用”一节。", "gain": "看清真实持有成本。1% 年费率在 30 年 7% 年化下吃掉约 26% 终值、2% 吃掉约 45%——费率差 1% 就是终值差近 1/4。", "source": "Carhart (1997)；晨星基金费率拆解。", "plain": "费率表有三行小字，加起来才是你每年实付。别只看醒目的“0.15% 管理费”，后面可能还藏着销售服务费。", "notes": []}, {"chapter": 2, "num": 11, "id": "2-11", "title": "申购费“打一折”仍可能为销售让利", "grade": "C", "impact": "自己", "cost_money": "低", "cost_time": "低", "cost_will": "低", "three_zero": false, "spend": "比较不同渠道的申购费与尾随。", "gain": "避开为“打折平台”多付的长期隐性成本（尾随佣金仍从你资产计提）。", "source": "基金销售费用披露规则；SEC 费用结构研究。", "plain": "1 折申购费看着香，但平台仍从你每年资产里抽尾随佣金。长期看，低管理费＋免销售服务费才是真省。", "notes": []}, {"chapter": 2, "num": 12, "id": "2-12", "title": "规模过小基金有清盘风险", "grade": "B", "impact": "自己", "cost_money": "低", "cost_time": "低", "cost_will": "低", "three_zero": false, "spend": "避开规模低于清盘线的迷你基。", "gain": "规避“被迫赎回”打断复利与择时。连续 60 日持有人不足 200 人或净资产低于 5000 万元即触发清盘条件。", "source": "《公开募集证券投资基金运作管理办法》第 41 条清盘条款。", "plain": "买基金先看规模，低于 2 亿要警惕、逼近 5000 万红线更要躲。清盘不是亏多少的问题，是被迫在不想要的时间点离场。", "notes": []}, {"chapter": 2, "num": 13, "id": "2-13", "title": "尾随佣金（客户维护费）从你资产里持续抽", "grade": "B", "impact": "自己", "cost_money": "低", "cost_time": "低", "cost_will": "低", "three_zero": false, "spend": "选不收或少收销售服务费的份额。", "gain": "减少每年从净值里悄悄计提的支付销售费用。C 类份额销售服务费常 0.2%–0.8%/年，长期可观。", "source": "基金销售费用结构披露；监管尾随佣金上限规定。", "plain": "A/C 类不是“哪个好”，是费用结构不同。短期持有 C 类免申购费或许划算，长期持有 A 类（免销售服务费）更省。", "notes": []}, {"chapter": 2, "num": 14, "id": "2-14", "title": "ETF 折溢价与跟踪误差是隐藏成本", "grade": "B", "impact": "自己", "cost_money": "低", "cost_time": "低", "cost_will": "低", "three_zero": false, "spend": "看一眼 ETF 的折溢价与跟踪误差。", "gain": "避开溢价买入（白多付）或高跟踪误差（跑偏基准）。主流宽基 ETF 跟踪误差多在 0.1%–0.5%/年。", "source": "ETF 运作与申购赎回机制；基金跟踪误差披露。", "plain": "ETF 价格是市场交易价，可能高于（溢价）或低于（折价）净值。溢价时买等于先亏一道；长期看跟踪误差小的才贴基准。", "notes": []}, {"chapter": 2, "num": 15, "id": "2-15", "title": "基金分红是“左口袋到右口袋”，不增值", "grade": "C", "impact": "自己", "cost_money": "无", "cost_time": "无", "cost_will": "无", "three_zero": true, "spend": "零。", "gain": "不被“分红噱头”误导。分红后净值同额下降，总价值不变，还可能影响税务与再投资时点。", "source": "基金分红机制；监管分红披露规范。", "plain": "基金分红不是发钱给你，是把你账户里的钱从左兜挪到右兜、净值降一截。营销爱拿“分红次数多”当卖点，别上当。", "notes": []}, {"chapter": 3, "num": 1, "id": "3-1", "title": "频繁交易：散户亏损头号内因", "grade": "A", "impact": "自己", "cost_money": "低", "cost_time": "低", "cost_will": "低", "three_zero": false, "spend": "交易快感。", "gain": "最高换手组年化净收益比最低组低约 6.5 个百分点；男性交易频率平均高 45%，年化回报低约 0.94 个百分点。", "source": "Barber & Odean (2000)《Trading Is Hazardous to Your Wealth》, Journal of Finance。", "plain": "跟踪数万户账户：买卖越勤，收益越差。你以为在“把握机会”，数据说你在“稳定失血”。", "notes": []}, {"chapter": 3, "num": 2, "id": "3-2", "title": "择时：长期持续跑赢几乎不可能", "grade": "A", "impact": "自己", "cost_money": "无", "cost_time": "低", "cost_will": "低", "three_zero": false, "spend": "判断顶底的时间与焦虑。", "gain": "标普500 20 年名义年化约 10.5%，股票基金投资者实际年化约 6.8%（差约 3.7 个百分点／年）。错过涨幅最大的少数几天，长期回报塌掉大半。", "source": "Dalbar《QAIB》年度报告；SPIVA。", "plain": "最贵的错过是市场涨最好的那几天你不在场。择时的代价是“躲过下跌”的同时几乎必然“错过上涨”。", "notes": []}, {"chapter": 3, "num": 3, "id": "3-3", "title": "追涨杀跌：在人性最弱点下单", "grade": "B", "impact": "自己", "cost_money": "低", "cost_time": "低", "cost_will": "低", "three_zero": false, "spend": "追高的高价 + 杀跌的低价，双向磨损。", "gain": "把“高买低卖”还给市场，改为纪律化“低买高卖”。", "source": "上交所《统计年鉴》散户牛熊转换净亏损；Kahneman & Tversky 前景理论。", "plain": "涨了怕错过、跌了怕更惨，于是高点冲、低点割。把恐惧贪婪直接翻译成亏损。反着做才正收益，但反人性——所以靠计划不靠感觉。", "notes": []}, {"chapter": 3, "num": 4, "id": "3-4", "title": "损失厌恶：亏的痛 ≈ 赚的乐的 2 倍", "grade": "A", "impact": "自己", "cost_money": "无", "cost_time": "低", "cost_will": "低", "three_zero": false, "spend": "承认“割肉”的不适。", "gain": "避免死扛亏损标的 + 过早卖盈利标的，二者共同拉低组合质量。", "source": "Kahneman & Tversky (1979)《Prospect Theory》, Econometrica（损失厌恶系数约 2）。", "plain": "亏 100 的难受 ≈ 赚 200 的开心。于是亏了不肯卖、赚了急着卖。这套本能是投资负资产，得用规则压着。", "notes": []}, {"chapter": 3, "num": 5, "id": "3-5", "title": "确认偏误与“听消息”", "grade": "B", "impact": "自己", "cost_money": "无", "cost_time": "低", "cost_will": "低", "three_zero": false, "spend": "一点主动找反例的精力。", "gain": "避开群内“内部消息”、大 V 喊单的一次性收割。", "source": "Nickerson (1998)《Confirmation Bias》；SEC 基于贴士交易警示。", "plain": "你看好一只股，就自动收集利好、忽略利空。消息越“内部”越紧急，越该反向警惕——真稳赚信息轮不到群里免费发给你。", "notes": []}, {"chapter": 3, "num": 6, "id": "3-6", "title": "过度自信：账户越多交易越频越觉得自己能赢", "grade": "B", "impact": "自己", "cost_money": "无", "cost_time": "低", "cost_will": "低", "three_zero": false, "spend": "一点“我可能没那么神”的自我怀疑。", "gain": "把精力从“挑下一只牛股”转向“控成本与仓位”这类真正可控的事。", "source": "Barber & Odean (2001)《Boys Will Be Boys》, QJE（男性过度自信→更频交易→更低收益）。", "plain": "牛市里人人股神，潮水退前看不出。把运气当能力，是下一轮亏损起点。承认跑不赢指数，反而做最理性选择。", "notes": []}, {"chapter": 3, "num": 7, "id": "3-7", "title": "锚定效应：被“买入价”钉死", "grade": "C", "impact": "自己", "cost_money": "无", "cost_time": "低", "cost_will": "低", "three_zero": false, "spend": "放下“回本才卖”的执念。", "gain": "按标的当前价值决策，而非按历史成本。成本已是沉没。", "source": "Tversky & Kahneman 锚定研究；行为金融教材。", "plain": "“我 10 块买的，现在 7 块卖了就是亏”——错。7 块时它的价值就是 7 块，跟 10 块无关。决策只看未来，不看的已花成本。", "notes": []}, {"chapter": 3, "num": 8, "id": "3-8", "title": "处置效应：卖盈持亏", "grade": "B", "impact": "自己", "cost_money": "无", "cost_time": "低", "cost_will": "低", "three_zero": false, "spend": "按逻辑止损／止盈的纪律。", "gain": "组合留下“涨的”、砍掉“跌的”，长期质量劣化（与正确做法相反）。", "source": "Odean (1998)《Are Investors Reluctant to Realize Their Losses?》, Journal of Finance。", "plain": "人爱卖赚钱的（落袋为安）、留亏钱的（等回本）。结果组合里全是被套的。正确的做法常常相反：让赢家跑、认错砍败者。", "notes": []}, {"chapter": 3, "num": 9, "id": "3-9", "title": "羊群效应：别人买我也买", "grade": "C", "impact": "自己／家庭", "cost_money": "无", "cost_time": "低", "cost_will": "低", "three_zero": false, "spend": "一点独立判断。", "gain": "避开泡沫顶部接盘（牛市最狂热时散户涌入，随后回撤）。", "source": "上交所年鉴散户在高位放量；行为金融羊群研究。", "plain": "当扫地阿姨都来问买哪只股，往往是最危险的时候。crowd 不是智慧，是踩踏的前奏。", "notes": []}, {"chapter": 3, "num": 10, "id": "3-10", "title": "禀赋效应：手里的就格外舍不得卖", "grade": "C", "impact": "自己", "cost_money": "无", "cost_time": "低", "cost_will": "低", "three_zero": false, "spend": "客观评估持仓的冷酷。", "gain": "不因“这是我的”而高估持仓、拒绝再平衡。", "source": "Thaler (1980) 禀赋效应；行为金融。", "plain": "同一只股票，买之前觉得一般，买之后就觉得它是宝。这是心理溢价，不是真实价值。定期问：“如果现在空仓，我还会买它吗？”", "notes": []}, {"chapter": 3, "num": 11, "id": "3-11", "title": "后悔厌恶：因怕后悔而停滞", "grade": "C", "impact": "自己", "cost_money": "无", "cost_time": "低", "cost_will": "低", "three_zero": false, "spend": "承认“之前买贵了”的心理成本。", "gain": "避免因“卖了就涨”的后悔预期而长期死扛烂标的。", "source": "行为金融“后悔理论”（regret aversion）研究。", "plain": "很多人不卖是因为怕“卖了马上涨、更后悔”。但死扛的代价是实打实的，后悔只是情绪。用规则替你做决定，把自己摘出去。", "notes": []}, {"chapter": 3, "num": 12, "id": "3-12", "title": "近因偏差：只看最近涨跌", "grade": "C", "impact": "自己", "cost_money": "无", "cost_time": "低", "cost_will": "低", "three_zero": false, "spend": "一点拉长时间看的耐心。", "gain": "避免被最近一周的暴涨暴跌吓到追或割，忽视长期趋势。", "source": "行为金融“近因偏差”研究（Kahneman 等）。", "plain": "大脑对刚发生的事权重过高。昨天大跌就觉得要崩、上周连涨就觉得永涨。把窗口拉到年甚至十年，噪声就小了。", "notes": []}, {"chapter": 3, "num": 13, "id": "3-13", "title": "心理账户：把钱分进不同“罐子”", "grade": "C", "impact": "自己", "cost_money": "无", "cost_time": "低", "cost_will": "低", "three_zero": false, "spend": "把“投资亏的钱”和“吃饭的钱”分开记账的直觉。", "gain": "避免因为某笔盈利就敢乱花、某笔亏损就死扛——钱没有标签，统一看总资产。", "source": "Thaler (1985/1999) 心理账户理论（诺奖）；行为金融研究。", "plain": "你股票赚了 1 万敢去吃大餐，基金亏了 1 万却死拿着不卖——其实是同一笔钱。打破“这笔是旅游钱、那笔是养老金”的错觉，决策才清醒。", "notes": []}, {"chapter": 3, "num": 14, "id": "3-14", "title": "控制错觉：以为自己能影响随机结果", "grade": "C", "impact": "自己", "cost_money": "无", "cost_time": "低", "cost_will": "低", "three_zero": false, "spend": "相信“我操作更及时/我选股更准”的错觉。", "gain": "少做无意义操作。大量研究：投资者的“控制感”与真实收益无关，反而增加交易频次与损耗。", "source": "Langer (1975) 控制错觉研究；行为金融实证。", "plain": "每天盯盘、频繁买卖，让你“感觉在控制”，但市场不认你的勤奋。越觉得自己能掌控，越容易被手续费和情绪收割。", "notes": []}, {"chapter": 3, "num": 15, "id": "3-15", "title": "赌徒谬误：连跌后觉得“该涨了”", "grade": "C", "impact": "自己", "cost_money": "无", "cost_time": "低", "cost_will": "低", "three_zero": false, "spend": "相信“已经跌这么多了，反弹是迟早的”。", "gain": "避免抄底垃圾股/接飞刀。股价短期走势近似随机游走，过去跌不代表未来涨。", "source": "Tversky & Kahneman 代表性偏差；随机游走实证。", "plain": "“连跌五天，第六天必涨”——这是赌徒逻辑，不是投资逻辑。跌透了的票可以继续跌透，别用“该反弹了”给自己壮胆。", "notes": []}, {"chapter": 3, "num": 16, "id": "3-16", "title": "幸存者偏差：只看见活下来/赚到的人", "grade": "C", "impact": "自己", "cost_money": "无", "cost_time": "低", "cost_will": "低", "three_zero": false, "spend": "被“谁谁炒股财务自由”的故事带节奏。", "gain": "看清样本被“活下来的赢家”污染。失败者沉默，你看到的成功率是被高估的。", "source": "Wald 二战幸存者偏差原例；行为金融对“可见样本”的批判。", "plain": "饭局上吹炒股赚了的很多，跳楼的和销户的不会出声。用“我认识谁赚了”做决策，等于只看了中奖者名单。", "notes": []}, {"chapter": 3, "num": 17, "id": "3-17", "title": "社会比较/嫉妒：别人赚了我就难受", "grade": "C", "impact": "自己", "cost_money": "无", "cost_time": "低", "cost_will": "低", "three_zero": false, "spend": "被朋友圈/群里别人的收益刺激，乱加仓。", "gain": "守住自己的节奏。追随他人收益是追涨杀跌的情绪燃料，常买在别人想卖时。", "source": "行为金融“社会偏好与攀比”研究；资产定价中的注意力效应。", "plain": "别人晒收益你焦虑，于是高位冲进去——恰好接了别人的盘。别人的账户与你无关，盯自己的计划。", "notes": []}, {"chapter": 3, "num": 18, "id": "3-18", "title": "双曲贴现/即时倾向：现在的小奖胜过未来的大奖", "grade": "C", "impact": "自己", "cost_money": "无", "cost_time": "低", "cost_will": "低", "three_zero": false, "spend": "偏好“马上能花的钱/马上能爽的交易”，轻视长期复利。", "gain": "把长期持有变成“不难受”的默认项（自动定投、少看盘），对抗人性短视。", "source": "Laibson (1997) 双曲贴现；行为经济学跨期选择研究。", "plain": "人天然高估眼前、低估未来。这就是为什么大多数人拿不住——复利是“未来的大奖”，但眼前的小波动更抓人。用规则替自己锁定长期。", "notes": []}, {"chapter": 3, "num": 19, "id": "3-19", "title": "模糊厌恶：回避看不懂的、追熟悉的", "grade": "C", "impact": "自己", "cost_money": "无", "cost_time": "低", "cost_will": "低", "three_zero": false, "spend": "只买“听过的名字/热搜上的概念”。", "gain": "承认自己认知有限，用指数覆盖全市场，而非用“熟悉感”当安全垫（熟悉≠安全）。", "source": "Ellsberg (1961) 模糊厌恶悖论；行为金融研究。", "plain": "你敢买熟知的白酒股，不敢买不懂的医药ETF——但“熟悉”常是信息差的反面。用宽基指数代替“我觉得熟”，反而更稳。", "notes": []}, {"chapter": 3, "num": 20, "id": "3-20", "title": "叙事谬误：好故事压过坏数据", "grade": "C", "impact": "自己", "cost_money": "无", "cost_time": "低", "cost_will": "低", "three_zero": false, "spend": "被“改变世界的赛道”“十年十倍逻辑”这类好故事打动。", "gain": "回到“钱从哪来、估值多少、我能验证什么”的硬问题，故事不能当现金流。", "source": "Taleb《黑天鹅》叙事谬误；行为金融对“故事驱动定价”的研究。", "plain": "好故事让人忽视贵估值和高风险。故事讲得越动听，越要问一句：它靠什么真的赚钱？讲不清的，就是赌。", "notes": []}, {"chapter": 4, "num": 1, "id": "4-1", "title": "被动指数基金：长期跑赢大多数主动", "grade": "A", "impact": "自己／后代", "cost_money": "低", "cost_time": "低", "cost_will": "低", "three_zero": false, "spend": "放弃战胜市场幻想；费率 0.03%–0.5%/年。", "gain": "拿到市场平均——过去 15 年约 90%+ 主动基金跑不赢基准。不费力赢过大多数人。", "source": "S&P SPIVA Scorecard（截至 2023 年底，15 年期美国大盘主动基金约 92% 跑输标普500）。", "plain": "专业基金经理拿最好人才数据，十之八九跑不赢指数。你凭什么觉得自己能？买最低费率全市场指数，长期排进前 10%。", "notes": []}, {"chapter": 4, "num": 2, "id": "4-2", "title": "定投：不赌“现在是不是底”", "grade": "B", "impact": "自己", "cost_money": "低", "cost_time": "低", "cost_will": "低", "three_zero": false, "spend": "每月操作琐碎；可能略低于“一次性买在最低点”。", "gain": "显著降低“一次性买在顶部”的毁灭性风险，平抑波动、降择时焦虑。", "source": "Vanguard《Dollar-Cost Averaging》（定投不保证更高收益，但显著降低择时错误）。", "plain": "没人知道底在哪。每月固定投，涨了赚份额少、跌了赚份额多，长期自动“低买多高买少”。它是后悔最小化工具，不是收益最大化工具。", "notes": [{"type": "争议", "text": "长期上涨市里一次性投入略优，但定投胜在心理与风险，对普通人更稳。"}]}, {"chapter": 4, "num": 3, "id": "4-3", "title": "少看盘：看得越多动得越多亏得越多", "grade": "A", "impact": "自己", "cost_money": "无", "cost_time": "无", "cost_will": "低", "three_zero": false, "spend": "一点“我在盯盘”的存在感（零金钱成本）。", "gain": "大幅降低交易冲动。Fidelity 统计：表现最好的账户是那些被遗忘／持有人已故、长期无人操作的。", "source": "Fidelity 投资者行为分析；Barber & Odean 查看频率与交易频率正相关。", "plain": "打开 App 就想操作，操作了就容易错。设成“季度看一次”，收益曲线大概率更好看。最好的投资者，往往是忘了密码的人。", "notes": []}, {"chapter": 4, "num": 4, "id": "4-4", "title": "资产配置：决定回报波动的绝大部分", "grade": "B", "impact": "自己", "cost_money": "低", "cost_time": "低", "cost_will": "低", "three_zero": false, "spend": "一点规划（股／债／现金比例）。", "gain": "组合总回报波动中约 90% 可由资产配置政策解释；组合间长期差异也主要由配置决定。", "source": "Brinson, Hood & Beebower (1986)《Determinants of Portfolio Performance》, FAJ；Ibbotson & Kaplan (2000)。", "plain": "选哪只基金的影响远小于“股债各占多少”。先定大类比例（稳健者股 30–50%、债 40–60%），再挑低成本工具。比例错，挑再牛的标的也救不回。", "notes": []}, {"chapter": 4, "num": 5, "id": "4-5", "title": "分散到不同资产／地域", "grade": "B", "impact": "自己", "cost_money": "低", "cost_time": "低", "cost_will": "低", "three_zero": false, "spend": "放弃押中单一牛股。", "gain": "约 20–30 只不同行业标的消除大部分个股特有风险；跨市场进一步降单一经济体冲击。", "source": "Markowitz (1952)；Evensky 分散化实证。", "plain": "你不需要知道哪只涨。买一篮子（指数就是现成篮子），把“这家公司会不会出事”的风险分散掉，只留“市场整体会成长”这条愿赌的。", "notes": []}, {"chapter": 4, "num": 6, "id": "4-6", "title": "长期持有 + 低换手：把复利留给自己", "grade": "A", "impact": "自己／后代", "cost_money": "低", "cost_time": "低", "cost_will": "低", "three_zero": false, "spend": "放弃短期刺激；承受期间 30%+ 账面回撤的心理。", "gain": "复利充分滚动 + 摩擦最小化。持有期越长，跑赢短期交易者概率越高。", "source": "Dalbar QAIB；Barber & Odean；复利数学。", "plain": "复利最强大，但需要时间。每卖出一次就打断一次复利、多付一次摩擦。买入好资产然后“什么都不做”，是最难也最赚的纪律。", "notes": []}, {"chapter": 4, "num": 7, "id": "4-7", "title": "降低查看频率，设自动提醒", "grade": "C", "impact": "自己", "cost_money": "无", "cost_time": "无", "cost_will": "低", "three_zero": false, "spend": "关掉行情推送（零成本）。", "gain": "减少情绪化操作。查看频率与交易频率正相关（见第三章第 01、本章第 03 条）。", "source": "Barber & Odean；行为金融。", "plain": "把 App 行情推送关了，每季度看一次报表。你不会因为少看而亏钱，却常因为多看而多操作而亏钱。", "notes": []}, {"chapter": 4, "num": 8, "id": "4-8", "title": "目标日期基金：一键随年龄降险", "grade": "B", "impact": "自己／后代", "cost_money": "低", "cost_time": "低", "cost_will": "低", "three_zero": false, "spend": "选一个“目标退休年份”的基金。", "gain": "内置滑梯式降风险（glide path），越临近退休股比自动降，省去自己再平衡。", "source": "生命周期基金（target-date）研究；Ibbotson 滑梯路径实证。", "plain": "如果你懒得管比例，买“20XX 目标日期基金”就行——它替你按年龄自动把股换债，到退休自然变稳健。", "notes": []}, {"chapter": 4, "num": 9, "id": "4-9", "title": "懒人“三基金”组合足够打底", "grade": "C", "impact": "自己", "cost_money": "低", "cost_time": "低", "cost_will": "低", "three_zero": false, "spend": "配一只宽基股基＋一只全债基＋一只海外指基。", "gain": "用三只低成本基金覆盖股／债／全球，长期跑赢大多数折腾的人。", "source": "Bogle“三基金组合”理念；被动投资实证。", "plain": "别被几百只基金晃花眼。一只沪深300＋一只国债/纯债＋一只美股/全球指基，足够多数人用。", "notes": []}, {"chapter": 4, "num": 10, "id": "4-10", "title": "再平衡用“阈值法”而非“日历法”", "grade": "B", "impact": "自己", "cost_money": "无", "cost_time": "低", "cost_will": "低", "three_zero": false, "spend": "设定偏离阈值（如某类资产偏离目标±5%–10% 才调）。", "gain": "减少无谓交易、天然“高抛低吸”。纪律性再平衡长期增厚收益并控波动。", "source": "Vanguard／晨星再平衡研究（阈值法优于年度法）。", "plain": "别每月机械调仓。设“股比偏离目标 10% 才动”，平时别理它。这样既控风险，又少交摩擦。", "notes": []}, {"chapter": 4, "num": 11, "id": "4-11", "title": "红利低波等因子有长期溢价，但别追热点因子", "grade": "B", "impact": "自己", "cost_money": "低", "cost_time": "低", "cost_will": "低", "three_zero": false, "spend": "理解因子的长期逻辑而非短期炒作。", "gain": "价值／红利／低波等因子长期跑赢大盘（Fama-French 等实证），可作为核心补充。", "source": "Fama & French (1993) 三因子；AQR 因子溢价研究。", "plain": "因子不是玄学，是“长期多赚一点”的来源。但别在因子火了才冲——追热门因子常买在高点。", "notes": []}, {"chapter": 4, "num": 12, "id": "4-12", "title": "投顾／智能投顾值不值，看费率是否低于它省的", "grade": "C", "impact": "自己", "cost_money": "低", "cost_time": "低", "cost_will": "低", "three_zero": false, "spend": "比较投顾费率与你自己瞎操作的成本。", "gain": "对管不住手的人，投顾的“帮你少动、做配置”可能值得；对能自律的人，纯属多一笔费用。", "source": "投顾行为增益研究（降低择时损失）。", "plain": "投顾最大的价值是“管住你的手”，不是“选股更牛”。能自己定投+少看盘的人，投顾多半是纯支出。", "notes": []}, {"chapter": 5, "num": 1, "id": "5-1", "title": "宽基指数 ETF（沪深300／中证500／标普500 等）", "grade": "A", "impact": "自己", "cost_money": "低", "cost_time": "低", "cost_will": "低", "three_zero": false, "spend": "费率 0.03%–0.5%/年 + 一次开户。", "gain": "长期真实年化约 6%–8%（通胀后），长期跑赢 90%+ 主动产品。确定性高。", "source": "SPIVA；Fama & French (1993) 市场因子正溢价；长期市场回报数据。", "plain": "旗舰资产。不挑股不择时，买覆盖全市场的低成本指数，按月投。不暴富，但稳稳站在长期赢家侧。", "notes": []}, {"chapter": 5, "num": 2, "id": "5-2", "title": "国债／利率债（无风险基准）", "grade": "B", "impact": "自己", "cost_money": "低", "cost_time": "低", "cost_will": "无", "three_zero": false, "spend": "放弃高收益；10 年期国债收益率约 2%–3%（近年区间）。", "gain": "本金安全的压舱石，用于应急金与组合降波动。", "source": "央行国债收益率曲线；财政部国债发行数据。", "plain": "国债收益是“无风险”的标尺。任何产品敢比它高一大截还说没风险，多出来的就是隐藏风险溢价。", "notes": []}, {"chapter": 5, "num": 3, "id": "5-3", "title": "货币基金（应急金容器）", "grade": "C", "impact": "自己／家庭", "cost_money": "无", "cost_time": "无", "cost_will": "无", "three_zero": true, "spend": "几乎为零（T+0 灵活）。", "gain": "年化约 1.5%–2.5% 且随时可取，用于 3–6 个月生活费。", "source": "货币基金运作规则；近年（降息周期）7 日年化约 1.2%–2.0%。", "plain": "应急金不图赚，图“随时能拿出来”。货币基金就是它的正确容器，别拿去炒股。", "notes": []}, {"chapter": 5, "num": 4, "id": "5-4", "title": "债基／固收+（波动低于股票）", "grade": "B", "impact": "自己", "cost_money": "低", "cost_time": "低", "cost_will": "低", "three_zero": false, "spend": "费率 0.3%–0.8%/年 + 信用／利率波动。", "gain": "中长期年化约 3%–6%，回撤远小于股票，用于组合减震。", "source": "债券基金长期回报数据；Vanguard 股债配置研究。", "plain": "固收+不是“稳赚”，债基也会跌（利率上行／信用违约）。但长期波动远低于股，是组合里“睡得着”的那部分。", "notes": [{"type": "争议", "text": "部分“固收+”含权益，波动被低估，需看清合同；把它当存款买是常见误判。"}]}, {"chapter": 5, "num": 5, "id": "5-5", "title": "REITs（不动产信托）", "grade": "B", "impact": "自己", "cost_money": "低", "cost_time": "低", "cost_will": "低", "three_zero": false, "spend": "费率 + 高波动（与地产周期强相关）。", "gain": "历史分红率约 3%–5%，提供股票之外的实物资产敞口。", "source": "NAREIT 数据；国内 REITs 2021 年首批上市、样本短，历史分红率约 4%–8% 但波动大。", "plain": "想配置房产又不想买整栋，REITs 是门票。但它不是债券，跌起来很凶，别当“高息存款”。", "notes": [{"type": "争议", "text": "国内 REITs 品类新、样本短，逻辑未充分验证，慎当核心仓。"}]}, {"chapter": 5, "num": 6, "id": "5-6", "title": "黄金（避险但不生息）", "grade": "B", "impact": "自己", "cost_money": "低", "cost_time": "低", "cost_will": "低", "three_zero": false, "spend": "储存／ETF 费率；无现金流（不生息不分红）。", "gain": "长期实际年化约 0.5%–1%（1800 年至今），危机时与股债低相关、提供对冲。", "source": "长期黄金实际回报研究（如 Credit Suisse《Yearbook》）；多机构避险属性研究。", "plain": "黄金几百年实际回报接近零，它的值在“别人恐慌时它涨”。配 5%–10% 当保险可以，重仓当投资是赌贬值。", "notes": []}, {"chapter": 5, "num": 7, "id": "5-7", "title": "可转债（下有债底上有股性）", "grade": "C", "impact": "自己", "cost_money": "低", "cost_time": "低", "cost_will": "低", "three_zero": false, "spend": "研究条款的精力 + 个券信用风险。", "gain": "进可攻退可守，但 2019–2022 炒作后估值分化大，破发与强赎并存。", "source": "可转债定价理论；2021–2022 炒作后估值分化，高位转债回撤可达 30%+，破发与强赎并存。", "plain": "“债底”保护不是铁底（正股大跌仍可破面）。新手打新可转债尚可，炒作高价转债是另一种赌。", "notes": []}, {"chapter": 5, "num": 8, "id": "5-8", "title": "红利低波策略", "grade": "B", "impact": "自己", "cost_money": "低", "cost_time": "低", "cost_will": "低", "three_zero": false, "spend": "费率 + 可能跑输成长股的阶段。", "gain": "股息率约 3%–5% + 低波动，长期回撤小于宽基，适合稳健者。", "source": "Fama & French 价值因子；红利因子长期溢价研究。", "plain": "挑“持续分红、波动小”的一篮子，长期体验比追热点舒服。本质是把“价值+低波”两个被验证的因子打包。", "notes": []}, {"chapter": 5, "num": 9, "id": "5-9", "title": "QDII／海外指数", "grade": "B", "impact": "自己", "cost_money": "低", "cost_time": "低", "cost_will": "低", "three_zero": false, "spend": "费率 + 汇率 + 申赎时滞 + 额度溢价风险。", "gain": "分散单一市场，分享全球增长；但汇率双向、额度紧时溢价。", "source": "央行汇率风险研究；QDII 规则。", "plain": "买美股／全球指数不只是赚海外，更是别把鸡蛋放一个经济体。但汇率是隐形手，别当纯增强。", "notes": []}, {"chapter": 5, "num": 10, "id": "5-10", "title": "国债逆回购（月末／季末捡芝麻）", "grade": "C", "impact": "自己", "cost_money": "无", "cost_time": "无", "cost_will": "无", "three_zero": true, "spend": "零（账户自带功能）。", "gain": "闲置资金短期年化偶尔冲到 3%–5%（月末／节前），本金安全。", "source": "交易所逆回购规则；GC001 等日常年化常低于 2%，月末/季末/节前偶尔冲高至 3%–5%。", "plain": "股票账户里躺着的钱，收盘前扔个一天期逆回购，白赚一晚利息。零成本动作，顺手做。", "notes": []}, {"chapter": 5, "num": 11, "id": "5-11", "title": "新股／新债打新（A股）", "grade": "C", "impact": "自己", "cost_money": "低", "cost_time": "低", "cost_will": "低", "three_zero": false, "spend": "市值门槛（沪市／深市持仓）+ 中签资金占用。", "gain": "破发率从 2022 年峰值约 28% 降至 2024 年约 3%、2025 接近 0；“无脑打新”红利回归，但仍非零风险。", "source": "新股破发率统计（2021≈4%、2022≈28%、2023≈17%、2024≈3%、2025 接近 0，券商中国/新浪财经）。", "plain": "过去“打新必赚”的红利在收窄，现在要看基本面挑着打。当成免费彩票可以，当成稳定收入已不成立。", "notes": []}, {"chapter": 5, "num": 12, "id": "5-12", "title": "期权（买方长期负和）", "grade": "B", "impact": "自己／家庭", "cost_money": "低", "cost_time": "低", "cost_will": "低", "three_zero": false, "spend": "时间价值持续衰减 + 归零风险。", "gain": "仅适合专业者做对冲／备兑；对散户多为净损耗。", "source": "Hull 期权定价；散户期权多为净损耗，多数买方到期归零。", "plain": "期权时间价值每天在漏，多数买方到期归零。它是保险／对冲工具，不是散户提款机。", "notes": [{"type": "争议", "text": "备兑开仓对持股者是可用的增强，但需专业能力，普通人慎碰。"}]}, {"chapter": 5, "num": 13, "id": "5-13", "title": "结构性存款／银行理财（净值化后）", "grade": "C", "impact": "自己", "cost_money": "低", "cost_time": "低", "cost_will": "无", "three_zero": false, "spend": "流动性（多限期）+ 隐性费用。", "gain": "比存款高一点，但资管新规后不保本、净值波动。", "source": "资管新规（打破刚兑）；银保监理财披露规则。", "plain": "别再把它当“高息存款”。它现在不保本，买前看清楚底层投了什么。比存款多那点收益，对应多那点风险。", "notes": []}, {"chapter": 5, "num": 14, "id": "5-14", "title": "保险理财／年金（锁定长期现金流）", "grade": "C", "impact": "自己／后代", "cost_money": "低", "cost_time": "低", "cost_will": "低", "three_zero": false, "spend": "流动性（早期退保亏损）+ 费用。", "gain": "确定性现金流（养老／教育），但 IRR 常被销售话术美化，真实约 2%–3.5%。", "source": "保险产品披露规则；IRR 测算方法。", "plain": "年金的价值是“强制储蓄 + 终身现金流”，不是高收益。算清 IRR 再买，别被“演示利益”晃晕。", "notes": []}, {"chapter": 5, "num": 15, "id": "5-15", "title": "信托／私募（非标流动性风险）", "grade": "C", "impact": "自己／家庭", "cost_money": "低", "cost_time": "低", "cost_will": "低", "three_zero": false, "spend": "高门槛（常 100 万起）+ 锁定期 + 信息不透明。", "gain": "可能更高收益，但违约、延期兑付、净值不透明事件频发。", "source": "信托／私募监管与风险揭示文件；2018 资管新规后违约/延期兑付事件显著增多（如 2020–2022 房地产信托风波）。", "plain": "非标“高收益”对应“低透明 + 低流动”。真出问题，你排在最后。门槛高不等于安全，反而常是信息差最大处。", "notes": [{"type": "争议", "text": "头部优质私募确有长期超额，但门槛与筛选成本极高，普通人更易踩雷。"}]}, {"chapter": 5, "num": 16, "id": "5-16", "title": "增额终身寿／护理险（当理财看 IRR）", "grade": "C", "impact": "自己／后代", "cost_money": "低", "cost_time": "低", "cost_will": "低", "three_zero": false, "spend": "长期锁定、早期退保亏损大。", "gain": "确定性的长期现金价值增长，适合做“保底压舱”，但前几年 IRR 很低、长期约 2%–3%。", "source": "保险产品现金价值与 IRR 测算；监管预定利率下行。", "plain": "它本质是“超长期、低收益、强锁定”的储蓄险。当保障或遗产规划可，当高收益理财买必亏在流动性。", "notes": []}, {"chapter": 5, "num": 17, "id": "5-17", "title": "期货（高杠杆零和）", "grade": "A", "impact": "自己／家庭", "cost_money": "低", "cost_time": "低", "cost_will": "低", "three_zero": false, "spend": "杠杆（常 5–20 倍）+ 展期成本 + 保证金追加大额。", "gain": "理论双向获利，但对散户是负和：高杠杆下小波动即爆仓，长期多为净亏损。", "source": "期货定价与杠杆风险研究；交易所适当性管理（门槛高）。", "plain": "期货是专业机构的套期保值工具，不是散户提款机。十倍杠杆下，10% 反向波动就清零。普通人碰期货，基本是给市场送保证金。", "notes": []}, {"chapter": 5, "num": 18, "id": "5-18", "title": "外汇保证金（远离）", "grade": "A", "impact": "自己／家庭", "cost_money": "低", "cost_time": "低", "cost_will": "低", "three_zero": false, "spend": "高杠杆 + 黑平台风险 + 汇率双向。", "gain": "几乎无正期望值。境内合法外汇保证金交易受限，境外平台多为对赌盘/无法出金。", "source": "外汇管理相关规定；证监会警示境外保证金交易平台风险。", "plain": "朋友圈“老师带炒外汇”九成是黑平台。合法渠道本就受限，能轻易开户炒汇的，多半是准备吞你本金的。默认不碰。", "notes": []}, {"chapter": 5, "num": 19, "id": "5-19", "title": "公募 FOF / 投顾（懒人配置）", "grade": "C", "impact": "自己", "cost_money": "低", "cost_time": "低", "cost_will": "低", "three_zero": false, "spend": "投顾费/FOF 管理费（多一层 0.3%–1%/年）。", "gain": "由专业方做股债配置与再平衡，适合不想自己管、又怕买错的人；成本换省心。", "source": "公募基金 FOF/基金投顾业务试点规则；组合配置研究。", "plain": "自己懒得配、又怕踩坑，FOF 或正规投顾是“花钱买配置纪律”。注意看清费用，别为省事反而付了多层管理费。", "notes": []}, {"chapter": 5, "num": 20, "id": "5-20", "title": "同业存单指数基金（现金升级）", "grade": "C", "impact": "自己", "cost_money": "无", "cost_time": "无", "cost_will": "无", "three_zero": true, "spend": "几乎为零（低风险、高流动）。", "gain": "比货币基金略高一点收益（约 1.5%–2.5% 区间），风险仍极低，适合放大额应急金或短期闲钱。", "source": "货币基金/同业存单指数基金运作规则；利率环境数据。", "plain": "应急金/短期钱想多赚半个点，又不敢买波动产品，同业存单指数基金是货币基金的“微升级”。仍是现金管理，不是投资。", "notes": []}, {"chapter": 6, "num": 1, "id": "6-1", "title": "“保证收益／稳赚不赔”——看见就跑", "grade": "A", "impact": "自己／家庭", "cost_money": "无", "cost_time": "低", "cost_will": "无", "three_zero": false, "spend": "可能错过的“完美机会”（实为陷阱）。", "gain": "保住本金。任何合法投资都有波动，承诺保本高收益逻辑自相矛盾。", "source": "SEC《Investor Alerts》十大红旗；证监会投保局风险提示。", "plain": "金融里没有“既要高回报又不要风险”。敢写“保证”二字的，保证的是拿走你本金。", "notes": []}, {"chapter": 6, "num": 2, "id": "6-2", "title": "荐股群、老师带单、内幕消息", "grade": "A", "impact": "自己／家庭", "cost_money": "无", "cost_time": "低", "cost_will": "无", "three_zero": false, "spend": "一点“跟大佬抄作业”的诱惑。", "gain": "避开杀猪盘与非法荐股——群内盈利截图几乎可伪造，最终接盘的是你。", "source": "SEC 基于非公开贴士交易执法案例；证监会非法证券期货活动警示。", "plain": "真能稳定赚钱的方法不会在微信群里 9.9 元卖你。喊单本质：找足够多人总有一半蒙对，对了收钱错了消失。", "notes": []}, {"chapter": 6, "num": 3, "id": "6-3", "title": "庞氏／资金盘：用后来人钱付前面人息", "grade": "A", "impact": "自己／家庭／社会", "cost_money": "无", "cost_time": "低", "cost_will": "无", "three_zero": false, "spend": "一点“早进场滚雪球”的贪念。", "gain": "避开必然崩盘、大概率血本无归。麦道夫案涉案约 650 亿美元。", "source": "SEC《Ponzi Schemes》警示；央行防范非法集资宣传。", "plain": "识别三特征：①承诺不合常理固定高息；②靠拉人头发展下线；③资金去向说不清。早进晚进都是输，区别谁接最后一棒。", "notes": []}, {"chapter": 6, "num": 4, "id": "6-4", "title": "高息理财“保本高收益”：矛盾即答案", "grade": "C", "impact": "自己／家庭", "cost_money": "无", "cost_time": "低", "cost_will": "低", "three_zero": false, "spend": "一点多赚几个点的念想。", "gain": "避开违约暴雷。无风险利率就那么高，超出的“收益”是隐藏信用风险。", "source": "资管新规（打破刚兑）；SEC 同类警示。", "plain": "国债收益是无风险标尺。任何产品敢比它高一大截还说没风险，多出来的就是它隐瞒的风险溢价，迟早用本金还。", "notes": []}, {"chapter": 6, "num": 5, "id": "6-5", "title": "加密货币投机：当赌场别当资产", "grade": "B", "impact": "自己／家庭", "cost_money": "低", "cost_time": "低", "cost_will": "低", "three_zero": false, "spend": "可能投入的本金（高波动、易归零、平台跑路）。", "gain": "对大多数人换不回稳定收益，只换回刺激。", "source": "SEC 加密资产高风险警示；央行等十部委 2021 通知（境内交易炒作不受合法保护）。", "plain": "比特币不产生现金流、不分红、波动极大，本质是投机品。小仓当彩票可，重仓当投资是赌命，且境内不受合法投资保护。", "notes": []}, {"chapter": 6, "num": 6, "id": "6-6", "title": "场外配资、非法交易平台", "grade": "A", "impact": "自己／家庭", "cost_money": "无", "cost_time": "低", "cost_will": "低", "three_zero": false, "spend": "一点放大本金的幻想。", "gain": "避开资金被挪用、平台关停、强平规则不透明等系统性陷阱。", "source": "证监会打击非法配资公告；SEC《Margin Rules》。", "plain": "正规杠杆有严格规则与强平线。场外配资规则由对方说了算，跌一点就改线吞你本金。是猎枪，枪口对着你。", "notes": []}, {"chapter": 6, "num": 7, "id": "6-7", "title": "“原始股／未上市股权”骗局", "grade": "C", "impact": "自己／家庭", "cost_money": "无", "cost_time": "低", "cost_will": "低", "three_zero": false, "spend": "一点“上市暴富”想象。", "gain": "避开流动性为零、信息黑箱、极易血本无归的非标。", "source": "证监会防范原始股诈骗投教；SEC 私募风险披露。", "plain": "真优质未上市股权轮不到陌生人。对方能卖给你的“原始股”多卖不出去，或根本假的。非标+高门槛+催你定，三者齐了就是局。", "notes": []}, {"chapter": 6, "num": 8, "id": "6-8", "title": "杀猪盘：先养后杀", "grade": "A", "impact": "自己／家庭", "cost_money": "无", "cost_time": "低", "cost_will": "低", "three_zero": false, "spend": "信任与时间（被“恋爱／友情”铺垫）。", "gain": "避开被诱导到虚假平台充值、最终无法提现。", "source": "公安部反诈预警；SEC romance scam 警示。", "plain": "对方对你越好、越催你“一起赚钱”，越要冷。真感情不会带你进投资平台。凡是“平台充值、无法提现”的模式，必杀猪。", "notes": []}, {"chapter": 6, "num": 9, "id": "6-9", "title": "虚假平台／黑 APP", "grade": "A", "impact": "自己／家庭", "cost_money": "无", "cost_time": "低", "cost_will": "低", "three_zero": false, "spend": "一点“高收益平台”的侥幸。", "gain": "避开充值即锁定、无法出金的骗局。", "source": "证监会非法平台警示；网信办 APP 治理。", "plain": "下载来源不明、承诺高息、客服催你加大充值的 APP，先假设它是假的。正规券商／基金都在官方应用商店与持牌名录。", "notes": []}, {"chapter": 6, "num": 10, "id": "6-10", "title": "代客理财承诺保底", "grade": "C", "impact": "自己／家庭", "cost_money": "无", "cost_time": "低", "cost_will": "低", "three_zero": false, "spend": "一点“交给专家”的省心。", "gain": "避开“保底协议”法律上多无效、亏了钱人难追。", "source": "证券法关于代客理财资质；司法实践保底条款效力。", "plain": "敢签“保底”的操盘手，要么违法要么准备跑。真高手不缺你的钱。把账户交给无资质个人，亏了基本自认。", "notes": []}, {"chapter": 6, "num": 11, "id": "6-11", "title": "非法集资与传销式拉人头", "grade": "A", "impact": "自己／家庭／社会", "cost_money": "无", "cost_time": "低", "cost_will": "低", "three_zero": false, "spend": "一点“发展下线赚佣金”的诱惑。", "gain": "避开“金字塔”结构——底层永远接盘，组织方涉嫌刑事犯罪。", "source": "最高法非法集资司法解释；公安部打击传销预警。", "plain": "凡是“拉人进来才有收益、层级返利”的，先当传销看。它靠人脉不靠资产增值，崩盘只是时间问题。", "notes": []}, {"chapter": 6, "num": 12, "id": "6-12", "title": "伪“区块链／元宇宙／AI”概念炒作", "grade": "C", "impact": "自己／家庭", "cost_money": "无", "cost_time": "低", "cost_will": "低", "three_zero": false, "spend": "一点蹭热点的冲动。", "gain": "避开借新概念包装、无真实现金流的炒作盘。", "source": "证监会打击“蹭热点”炒作与非法荐股警示；SEC 同类警示。", "plain": "每个风口都长出一堆“沾边就涨”的壳。真技术公司不需要在群里拉你入金。看不懂它怎么赚钱，就是赌标签。", "notes": []}, {"chapter": 6, "num": 13, "id": "6-13", "title": "虚拟盘/对赌盘：你以为在交易，其实在和庄家对赌", "grade": "A", "impact": "自己／家庭", "cost_money": "无", "cost_time": "低", "cost_will": "无", "three_zero": false, "spend": "几分钟核查平台是否接入真实交易所。", "gain": "避开“入金后赚了不能出、亏了全归你”的假盘。虚拟盘后台可随意改价，你买卖根本没进市场。", "source": "证监会打击非法证券期货活动警示；公安机关反诈预警。", "plain": "真平台你的单子进交易所；假平台只是个 App 显示数字，钱直接进骗子口袋。凡是要你下载非官方 App、不看行情只看出金速度的，先假设是虚拟盘。", "notes": []}, {"chapter": 6, "num": 14, "id": "6-14", "title": "微信/QQ 荐股群分层收割", "grade": "A", "impact": "自己／家庭", "cost_money": "无", "cost_time": "低", "cost_will": "无", "three_zero": false, "spend": "进群后“免费牛股”的诱惑。", "gain": "避开“先给甜头→带单分成→反向割韭菜”的标准剧本。群里的“老师”和“赚钱群友”多半是托。", "source": "证监会关于非法投顾/“黑群”警示；多地公安反诈案例。", "plain": "免费拉你进群、天天晒盈利，不是为了教你赚钱，是为了最后让你接盘或交会员费。真有稳定盈利术，他何必带你？", "notes": []}, {"chapter": 6, "num": 15, "id": "6-15", "title": "原油/贵金属/邮币卡现货黑平台", "grade": "A", "impact": "自己／家庭", "cost_money": "无", "cost_time": "低", "cost_will": "无", "three_zero": false, "spend": "高杠杆“炒原油/炒白银/炒邮票”的广告。", "gain": "避开后台操纵、无法出金的非法现货平台。这类平台常无真实交割、靠喊单和滑点吞金。", "source": "证监会/地方金融监管局关于非法现货交易平台整治公告；公安反诈案例。", "plain": "正规期货只在合规交易所；朋友圈/群里的“老师带炒原油贵金属”基本是黑平台。高杠杆+无监管=送钱。", "notes": []}, {"chapter": 6, "num": 16, "id": "6-16", "title": "资金盘/返利盘：拉人头发息", "grade": "A", "impact": "自己／家庭／社会", "cost_money": "无", "cost_time": "低", "cost_will": "无", "three_zero": false, "spend": "对“静态收益+动态拉人奖励”的警惕。", "gain": "避开庞氏结构。没有真实经营、靠后来人本金付前面人利息的，崩盘是时间问题。", "source": "银保监会/公安部关于防范非法集资与传销式返利警示。", "plain": "“存钱每天返息、拉人头再奖一层”——这就是庞氏的身份证。凡是收益来自新进资金而非真实利润，跑路只是早晚。", "notes": []}, {"chapter": 6, "num": 17, "id": "6-17", "title": "冒充官方/AI 换脸客服诈骗", "grade": "A", "impact": "自己／家庭", "cost_money": "无", "cost_time": "低", "cost_will": "无", "three_zero": false, "spend": "对“客服/警官/导师”视频或语音的盲信。", "gain": "避开 AI 换脸与语音克隆伪造的“熟人/官方”诈骗。涉及转账一律官方渠道二次核实。", "source": "国家反诈中心预警；公安部打击 AI 电信诈骗提示。", "plain": "现在骗子能用 AI 模仿你儿子声音、你领导脸。视频里喊你转账的，先挂断、用已知号码回拨核实。涉及钱，只信线下官方窗口。", "notes": []}, {"chapter": 6, "num": 18, "id": "6-18", "title": "养老/养生理财骗局", "grade": "C", "impact": "自己／家庭", "cost_money": "无", "cost_time": "低", "cost_will": "无", "three_zero": false, "spend": "对“高息养老公寓/养老床位/养生理财”的温情攻势。", "gain": "避开专盯老年人的“以房养老”“预付养老”类非法集资。温情牌背后常是本金消失。", "source": "民政部/银保监会关于养老服务领域非法集资风险提示。", "plain": "给父母看这条。凡是“存钱送养老服务/床位、承诺高息回购”的，先当骗子看。真养老产品不会让你把房本押出去。", "notes": []}, {"chapter": 7, "num": 1, "id": "7-1", "title": "宽基指数基金定投（旗舰动作）", "grade": "A", "impact": "自己／后代", "cost_money": "低", "cost_time": "低", "cost_will": "低", "three_zero": false, "spend": "年费率 0.03%–0.5% + 每月几分钟。", "gain": "市场长期真实年化 6%–8%，长期跑赢 90%+ 主动。确定性极高。", "source": "SPIVA；Fama & French (1993)；长期回报数据。", "plain": "全指南旗舰。不挑股不择时不盯盘，只买低成本全市场指数按月投。不暴富，但稳稳站长期赢家侧。", "notes": []}, {"chapter": 7, "num": 2, "id": "7-2", "title": "股债搭配 + 定期再平衡", "grade": "B", "impact": "自己", "cost_money": "低", "cost_time": "低", "cost_will": "低", "three_zero": false, "spend": "一年一次调整（或偏离 5% 阈值）；克制全仓股博高收益。", "gain": "相近预期回报下显著降低波动与最大回撤，并强制“高卖低买”。", "source": "Vanguard《Best Practices for Portfolio Rebalancing》(2015)；60/40 组合回测。", "plain": "股涨多了债跌了，卖股买债拉回目标比例。不是择时，是纪律——逼你贵时卖便宜时买，且不靠判断。", "notes": []}, {"chapter": 7, "num": 3, "id": "7-3", "title": "留足 3–6 个月应急金再谈投资", "grade": "C", "impact": "自己／家庭", "cost_money": "无", "cost_time": "低", "cost_will": "低", "three_zero": false, "spend": "这部分钱几乎零收益（货币基金）。", "gain": "熊市最低点“不必卖”的底气，直接避免最惨亏损场景。", "source": "CFPB 家庭应急储备建议；Dalbar 被迫卖出研究。", "plain": "应急金是投资体系的“安全气囊”。没有它，一次失业／急病逼你在最差时点清仓。先有缓冲再冒险，顺序不能反。", "notes": []}, {"chapter": 7, "num": 4, "id": "7-4", "title": "长期持有 + 低换手", "grade": "A", "impact": "自己／后代", "cost_money": "低", "cost_time": "低", "cost_will": "低", "three_zero": false, "spend": "放弃短期刺激；承受 30%+ 账面回撤心理。", "gain": "复利充分滚动 + 摩擦最小化。", "source": "Dalbar QAIB；Barber & Odean；复利数学。", "plain": "复利最强大但要时间。每卖一次打断一次复利、多付一次摩擦。买入好资产后“什么都不做”是最难也最赚的纪律。", "notes": []}, {"chapter": 7, "num": 5, "id": "7-5", "title": "投资自己：人力资本回报常最高", "grade": "C", "impact": "自己／后代", "cost_money": "低", "cost_time": "高", "cost_will": "高", "three_zero": false, "spend": "时间、学费、精力。", "gain": "主业收入提升带来“可投资本金”增长，杠杆远高于任何金融技巧。", "source": "Becker《Human Capital》；教育／技能回报率实证。", "plain": "把年化 7% 提到 8% 呕心沥血；月薪 1 万提到 1.5 万同样“回报率”却容易得多。本金变大才是普通人财富发动机，先修好它。", "notes": []}, {"chapter": 7, "num": 6, "id": "7-6", "title": "记投资日志，事后复盘", "grade": "C", "impact": "自己", "cost_money": "无", "cost_time": "低", "cost_will": "低", "three_zero": false, "spend": "每笔记一句“为什么买／卖、预期是什么”（零金钱）。", "gain": "半年后冷酷发现自己重复错误，比任何课程管用。", "source": "行为金融“决策记录复盘降低偏差”研究。", "plain": "人擅长忘错过的、放大蒙对的。白纸黑字记下来，市场替你打分。成本几乎为零、收益持续的“元动作”。", "notes": []}, {"chapter": 7, "num": 7, "id": "7-7", "title": "保险兜底（医疗／寿险／意外）", "grade": "B", "impact": "家庭", "cost_money": "低", "cost_time": "低", "cost_will": "低", "three_zero": false, "spend": "保费（家庭年收入 5%–10% 配齐基础保障）。", "gain": "防止一次大病／意外击穿投资本金与家庭现金流。", "source": "保险保障功能研究；家庭财务韧性研究。", "plain": "投资是进攻，保险是防守。没兜底就重仓投资，等于前线冲猛、后方没兵。先有医疗／寿险，再谈收益。", "notes": []}, {"chapter": 7, "num": 8, "id": "7-8", "title": "复利 + 税优账户叠加", "grade": "B", "impact": "自己／后代", "cost_money": "低", "cost_time": "低", "cost_will": "低", "three_zero": false, "spend": "账户规划（个人养老金 12000/年限额）。", "gain": "递延纳税 + 复利，长期差距可观。", "source": "2022 年第 34 号公告；复利数学。", "plain": "税优账户 + 长期持有是复利的两台加速器。能合法用就别浪费，尤其收入越高省得越多。", "notes": []}, {"chapter": 7, "num": 9, "id": "7-9", "title": "用足个税专项附加扣除", "grade": "C", "impact": "自己／家庭", "cost_money": "无", "cost_time": "低", "cost_will": "低", "three_zero": false, "spend": "填表申报（几分钟／年）。", "gain": "子女教育／房贷／赡养老人／房租等可抵税，直接增加税后收入。", "source": "个人所得税法专项附加扣除规定。", "plain": "这是国家给的“免费钱”，不领就亏。每年花几分钟核对扣除项，省下的税就是净收益。", "notes": []}, {"chapter": 7, "num": 10, "id": "7-10", "title": "指数 + 打新增强（A股）", "grade": "C", "impact": "自己", "cost_money": "低", "cost_time": "低", "cost_will": "低", "three_zero": false, "spend": "维持打新市值的波动。", "gain": "在指数底仓上顺手打新，2021 前贡献正收益，当前收益收窄但非零。", "source": "新股破发率统计（2021≈4%、2022≈28%、2023≈17%、2024≈3%、2025 接近 0）。", "plain": "底仓本来就要买，打新是顺手薅。但别为提高中签率去重仓高风险股，本末倒置。", "notes": [{"type": "争议", "text": "破发后“增强”变“拖累”，需挑着打而非无脑打。"}]}, {"chapter": 7, "num": 11, "id": "7-11", "title": "用条件单/自动定投代替手动", "grade": "C", "impact": "自己", "cost_money": "无", "cost_time": "低", "cost_will": "低", "three_zero": false, "spend": "设一次定投/条件单的时间。", "gain": "把“情绪化手动操作”自动化，错过低点也不慌、涨过头也按计划卖，纪律由系统兜底。", "source": "行为金融“自动化降低偏差”研究；券商条件单功能。", "plain": "手动定投最大的敌人是你自己（跌了不敢买、涨了想追）。设好自动扣款/条件单，让系统替你执行，手别痒。", "notes": []}, {"chapter": 7, "num": 12, "id": "7-12", "title": "设“再平衡阈值”而非择时", "grade": "C", "impact": "自己", "cost_money": "无", "cost_time": "低", "cost_will": "低", "three_zero": false, "spend": "定一个偏离阈值（如 ±5% 或每年一次）。", "gain": "股债比例偏了就拉回，天然“高卖低买”，且不需要预测市场方向。", "source": "Vanguard《Best Practices for Portfolio Rebalancing》(2015)；60/40 回测。", "plain": "别猜高低点，给组合设个“闹钟”：偏了 5% 就调回。这是唯一不需要预言能力的“低买高卖”机制。", "notes": []}, {"chapter": 7, "num": 13, "id": "7-13", "title": "关掉实时估值/少看盘", "grade": "C", "impact": "自己", "cost_money": "无", "cost_time": "无", "cost_will": "低", "three_zero": false, "spend": "关掉 App 推送、删掉自选股红绿提醒。", "gain": "看得少→动得少→亏得少（参见第十二章频繁交易数据）。信息过载是亏损的燃料。", "source": "行为金融“注意力与过度交易”研究；上交所行为数据。", "plain": "每天看十次账户的人，八成在亏钱（第十二章有数据）。把 App 通知关了，三个月看一次，收益率反而可能更好。", "notes": []}, {"chapter": 7, "num": 14, "id": "7-14", "title": "写好“卖出规则”再买", "grade": "C", "impact": "自己", "cost_money": "无", "cost_time": "低", "cost_will": "低", "three_zero": false, "spend": "买入前写清“什么情况下卖”（目标价/逻辑证伪/急用钱）。", "gain": "避免被情绪劫持。卖点提前定好，下跌时不慌、上涨时不贪，决策有据。", "source": "投资日志与交易计划研究；行为金融事前承诺机制。", "plain": "多数人只计划“买”，不计划“卖”，于是跌了死扛、涨了乱卖。买之前先写下“我什么时候卖”，等于给未来的自己上保险。", "notes": []}, {"chapter": 8, "num": 1, "id": "8-1", "title": "个人养老金账户递延纳税", "grade": "B", "impact": "自己／后代", "cost_money": "低", "cost_time": "低", "cost_will": "低", "three_zero": false, "spend": "开户 + 每年最多 12000 元额度规划，且退休前取出受限。", "gain": "缴费阶段税前扣除、投资阶段暂不征税、领取时按 3% 低税率，长期复利显著增厚。", "source": "财政部 税务总局 2022 年第 34 号公告《个人养老金有关个人所得税政策》。", "plain": "收入越高，税前扣除越值钱。这 12000 是政策给的“免税投资额度”，不用的等于白白交税。", "notes": []}, {"chapter": 8, "num": 2, "id": "8-2", "title": "股息红利差别化：长期持有免税", "grade": "C", "impact": "自己", "cost_money": "无", "cost_time": "无", "cost_will": "低", "three_zero": false, "spend": "持有股票／基金满 1 年（不是卖出）。", "gain": "持股超 1 年的股息红利免征个人所得税；不足 1 月按 20%、1 月至 1 年按 10%。", "source": "财税〔2015〕101 号《关于上市公司股息红利差别化个人所得税政策》。", "plain": "分红再投资（见第二章第 04 条）叠上“拿满一年”，股息端几乎零税。短线炒分红股反而被扣税，不划算。", "notes": []}, {"chapter": 8, "num": 3, "id": "8-3", "title": "资本利得：A股暂免，但别据此乱动", "grade": "C", "impact": "自己", "cost_money": "无", "cost_time": "低", "cost_will": "低", "three_zero": false, "spend": "一点对税制的了解。", "gain": "目前个人买卖 A 股股票的差价暂免个人所得税（政策口径）；基金分红与买卖也多在免税范畴。", "source": "个人所得税法及实施条例；财税相关口径。", "plain": "A股资本利得免税是现状，但别为了“避税”做无意义的频繁交易——摩擦和择时损耗远大于税。税不是你亏钱的主因，手痒才是。", "notes": []}, {"chapter": 8, "num": 4, "id": "8-4", "title": "家庭内部资产隔离与婚前财产", "grade": "C", "impact": "家庭", "cost_money": "低", "cost_time": "低", "cost_will": "低", "three_zero": false, "spend": "一点法律与账户规划。", "gain": "降低婚姻变动、债务牵连对投资本金的击穿风险。", "source": "民法典婚姻家庭编关于婚前财产、夫妻共同财产的规定；最高法相关解释。", "plain": "投资账户与负债账户尽量分清，大额资产留痕（转账备注、协议）。不是算计，是给家庭资产装一道防火墙。", "notes": [{"type": "争议", "text": "具体安排因人而异、涉及情感，建议咨询专业律师而非照搬网络模板。"}]}, {"chapter": 8, "num": 5, "id": "8-5", "title": "个人养老金领取按 3% 缴税", "grade": "B", "impact": "自己／后代", "cost_money": "低", "cost_time": "低", "cost_will": "低", "three_zero": false, "spend": "理解“缴费递延、领取缴 3%”的规则。", "gain": "缴费与投资环节递延个税，领取时统一按 3%（不并入综合所得），对中高收入者省税明显。", "source": "2022 年第 34 号公告《个人养老金税收政策》；个税递延规则。", "plain": "个人养老金不是“完全免税”，是“晚点交、少点交”。领取时只按 3% 缴，比多数人边际税率低，收入越高越划算。", "notes": []}, {"chapter": 8, "num": 6, "id": "8-6", "title": "国债与地方政府债利息免税", "grade": "C", "impact": "自己", "cost_money": "低", "cost_time": "无", "cost_will": "无", "three_zero": false, "spend": "零。", "gain": "国债/地方债利息收入免征个税，同等收益率下税后更优——尤其对税率高的投资者。", "source": "《个人所得税法》及实施条例（国债利息免税）；税务总局解答。", "plain": "同样拿 3% 利息，存款利息要交税（暂免但逻辑在），国债利息一分不交。对大额稳健资金，国债的“税后优势”是真金白银。", "notes": []}, {"chapter": 8, "num": 7, "id": "8-7", "title": "税优健康险：税前扣除额度", "grade": "C", "impact": "自己／家庭", "cost_money": "低", "cost_time": "低", "cost_will": "低", "three_zero": false, "spend": "每年最高 2400 元税前扣除的额度配置。", "gain": "买符合规定的税优健康险，保费可在个税税前扣除，兼得保障与节税。", "source": "财政部等《关于商业健康保险个人所得税政策的通知》（财税〔2017〕39 号）。", "plain": "每年 2400 元额度，买指定健康险能抵税。额度不大，但“保障+节税”双得，顺手配不亏。", "notes": []}, {"chapter": 8, "num": 8, "id": "8-8", "title": "专项附加扣除：人人可用的抵税额度", "grade": "B", "impact": "自己／家庭", "cost_money": "低", "cost_time": "低", "cost_will": "低", "three_zero": false, "spend": "在个税 App 填报子女教育、房贷利息、赡养父母等项。", "gain": "子女教育 1000 元/月/孩、首套房贷利息 1000 元/月、赡养老人 2000 元/月等，直接降应纳税所得额。", "source": "《个人所得税专项附加扣除暂行办法》（国发〔2018〕41 号）。", "plain": "这些扣除不用你多花钱，只是填表。不填就是白白多交税。每年汇算清缴前都核一遍。", "notes": []}, {"chapter": 8, "num": 9, "id": "8-9", "title": "企业年金／职业年金：第二支柱别漏", "grade": "C", "impact": "自己／后代", "cost_money": "低", "cost_time": "低", "cost_will": "低", "three_zero": false, "spend": "确认单位是否缴纳、个人缴费比例。", "gain": "单位和个人共同缴费并享税延，长期滚成可观的养老补充。", "source": "《企业年金办法》《职业年金办法》；税延政策。", "plain": "有单位年金的人别忽视它——这是工资外的“强制储蓄＋税优”，离职时弄明白转移接续规则。", "notes": []}, {"chapter": 8, "num": 10, "id": "8-10", "title": "个人养老金可投产品：选低费率指数为主", "grade": "C", "impact": "自己／后代", "cost_money": "低", "cost_time": "低", "cost_will": "低", "three_zero": false, "spend": "在账户内挑产品时优先低费率、宽基。", "gain": "账户本身有税优，内部产品仍分优劣；选高费率主动产品会抵消税优。", "source": "个人养老金产品名录与运作规则。", "plain": "进了养老金账户也别乱买。税优是账户的，产品费率还得自己挑低的一档，否则税省的被费吃了。", "notes": []}, {"chapter": 8, "num": 11, "id": "8-11", "title": "公益慈善捐赠可抵税，但别为抵税而捐", "grade": "C", "impact": "自己", "cost_money": "低", "cost_time": "低", "cost_will": "低", "three_zero": false, "spend": "通过有资质公益性社会组织捐赠并留票据。", "gain": "公益性捐赠在年度利润总额 12% 以内可税前扣除（个人也有相应限额）。", "source": "《企业所得税法》《个人所得税法》捐赠扣除条款。", "plain": "本就要捐的，走合规渠道留票据能抵税；为了抵税硬捐不划算。顺序永远是“先想捐不捐，再想怎么抵”。", "notes": []}, {"chapter": 8, "num": 12, "id": "8-12", "title": "继承与赠与的税务边界：目前遗产税未开征", "grade": "C", "impact": "家庭／后代", "cost_money": "低", "cost_time": "低", "cost_will": "低", "three_zero": false, "spend": "了解现行规则，不轻信“遗产税马上来”的焦虑营销。", "gain": "目前我国未开征遗产税与赠与税，但房产等过户仍有契税、印花税等交易成本。", "source": "现行税收法规；税务总局相关口径。", "plain": "别被“赶紧过户避遗产税”的话术吓着——国内暂无遗产税。但房产赠与／继承仍有交易税费，过户前算清成本。", "notes": []}, {"chapter": 8, "num": 13, "id": "8-13", "title": "海外金融资产与 CRS 信息交换", "grade": "C", "impact": "自己", "cost_money": "低", "cost_time": "低", "cost_will": "低", "three_zero": false, "spend": "开境外账户时了解 CRS 申报义务。", "gain": "避免“藏海外账户避税”的违法风险；CRS 下金融账户信息自动交换已成常态。", "source": "OECD CRS 框架；我国 CRS 申报办法。", "plain": "想靠境外账户藏钱避税，基本已不现实。CRS 让各国税务互通，合规申报才是正路。", "notes": []}, {"chapter": 9, "num": 1, "id": "9-1", "title": "年轻人（20–35）：高股比 + 砸人力资本", "grade": "C", "impact": "自己／后代", "cost_money": "低", "cost_time": "高", "cost_will": "高", "three_zero": false, "spend": "时间精力投入主业与技能，而非盯盘。", "gain": "时间长可承受高波动（股 70–90%），且本金小、人力资本杠杆最大。", "source": "生命周期投资理论（如 Bodie 等）；人力资本研究。", "plain": "年轻亏得起时间，先别怕波动，把股比拉高 + 把本事练硬。这时候你最大的资产是你自己，不是账户。", "notes": []}, {"chapter": 9, "num": 2, "id": "9-2", "title": "中年（35–55）：配置 + 保险 + 教育金", "grade": "C", "impact": "家庭／后代", "cost_money": "低", "cost_time": "低", "cost_will": "低", "three_zero": false, "spend": "保费、教育金定投、配置再平衡精力。", "gain": "责任最重期用稳健组合 + 兜底保障，避免一损俱损。", "source": "家庭财务规划研究。", "plain": "这阶段你不是一个人，是全家防线。股比降到 50–70%，保险买齐，孩子教育金单独隔离。别再 all in 赌。", "notes": []}, {"chapter": 9, "num": 3, "id": "9-3", "title": "临近退休（55–65）：逐年降波动", "grade": "C", "impact": "自己／家庭", "cost_money": "低", "cost_time": "低", "cost_will": "低", "three_zero": false, "spend": "放弃最后冲高收益。", "gain": "用 5–10 年把股比平滑降到 30–40%，躲开“退休前一年遇熊市”的致命回撤。", "source": "滑梯式降风险（glide path）研究。", "plain": "快退休时最怕“临门一脚被深套”。提前十年慢慢把股换债，用时间换安全，别赌最后一程。", "notes": []}, {"chapter": 9, "num": 4, "id": "9-4", "title": "退休后：现金流优先", "grade": "C", "impact": "自己", "cost_money": "低", "cost_time": "低", "cost_will": "低", "three_zero": false, "spend": "部分收益确定性（债／红利／年金）。", "gain": "用股息／债息／年金覆盖生活，不靠卖股度日，避免熊市被迫卖。", "source": "退休支出与可持续提取率（如 4% 法则）研究。", "plain": "退休后账户是提款机不是赌场。留 1–2 年生活费在货基，其余靠现金流，别在市场低位砍仓取钱。", "notes": []}, {"chapter": 9, "num": 5, "id": "9-5", "title": "单收入家庭：先保“顶梁柱”再谈收益", "grade": "C", "impact": "家庭", "cost_money": "低", "cost_time": "低", "cost_will": "低", "three_zero": false, "spend": "给赚钱的人配齐寿险/重疾/意外。", "gain": "避免顶梁柱倒下击穿全家现金流与投资组合。保障顺序：赚钱的人优先于不赚钱的人。", "source": "家庭财务韧性研究；保险保障功能研究。", "plain": "一家人的收入靠一个人扛，那就先把这个人保牢。别本末倒置先给孩子买一堆理财险、顶梁柱却裸奔。", "notes": []}, {"chapter": 9, "num": 6, "id": "9-6", "title": "教育孩子：财务独立先于财富传承", "grade": "C", "impact": "后代", "cost_money": "低", "cost_time": "高", "cost_will": "高", "three_zero": false, "spend": "培养其独立赚钱与理财能力的时间精力。", "gain": "比留一笔钱更抗风险。会赚钱、懂复利的孩子，比被动继承的孩子更难被坑、更扛摔。", "source": "人力资本与代际流动性研究；财商教育实证。", "plain": "留钱不如留本事。教会孩子“钱从哪来、怎么不被骗、复利怎么滚”，比塞给他一套房更保他一辈子。", "notes": []}, {"chapter": 9, "num": 7, "id": "9-7", "title": "应急金随家庭责任动态调整", "grade": "C", "impact": "家庭", "cost_money": "无", "cost_time": "低", "cost_will": "低", "three_zero": false, "spend": "按家庭责任（房贷/娃/老人）重算月数。", "gain": "责任越重，应急金要越厚（可到 6–12 个月），避免在危机点被迫卖资产。", "source": "CFPB 家庭应急储备建议；家庭流动性研究。", "plain": "单身时 3 个月够，上有老下有小、背着房贷时得 6–12 个月。责任变了，缓冲垫要跟着变厚。", "notes": []}, {"chapter": 9, "num": 8, "id": "9-8", "title": "单身无娃：高股比＋高储蓄率是黄金窗口", "grade": "C", "impact": "自己", "cost_money": "低", "cost_time": "高", "cost_will": "高", "three_zero": false, "spend": "把精力投主业，把储蓄率拉高。", "gain": "无家庭负担期可承受高波动（股 70–90%）、复利起点最高，是积累本金效率最高的十年。", "source": "生命周期投资理论；人力资本研究。", "plain": "单身时你唯一的“负担”是自己，股比可以拉满、储蓄率可以最高。这十年攒下的，是未来所有安全感的底。", "notes": []}, {"chapter": 9, "num": 9, "id": "9-9", "title": "有娃家庭：教育金单独隔离开", "grade": "C", "impact": "家庭／后代", "cost_money": "低", "cost_time": "低", "cost_will": "低", "three_zero": false, "spend": "开独立账户专存教育金。", "gain": "避免教育金被消费或投资波动挪用；用定投摊平成本、到期刚性支出匹配低风险。", "source": "家庭财务规划研究；教育金缺口测算。", "plain": "孩子的学费不能和你的炒股账户混在一起。单独账户、专款专用，到用钱那年别让它正逢熊市。", "notes": []}, {"chapter": 9, "num": 10, "id": "9-10", "title": "双收入家庭：容错更高但别一起裸奔", "grade": "C", "impact": "家庭", "cost_money": "低", "cost_time": "低", "cost_will": "低", "three_zero": false, "spend": "两人都配基础保障、应急金可略降。", "gain": "双收入降低单点失业冲击，但仍需避免“两份收入都high风险＋零保障”的脆弱结构。", "source": "家庭财务韧性研究。", "plain": "两份工资是好事，但别因此放松保障。两份都靠股市、都没保险，一旦双失业比单收入更脆。", "notes": []}, {"chapter": 9, "num": 11, "id": "9-11", "title": "自雇／创业者的现金流波动需更厚应急金", "grade": "C", "impact": "自己／家庭", "cost_money": "无", "cost_time": "低", "cost_will": "低", "three_zero": false, "spend": "把经营账户与个人账户分清，应急金提到 6–12 个月。", "gain": "收入不规律时避免被迫在低点卖投资补经营。", "source": "自雇者流动性研究；CFPB 应急储备建议。", "plain": "工资族月月有进账，创业者可能三个月没收入。你的应急垫要比上班族厚一倍才稳。", "notes": []}, {"chapter": 9, "num": 12, "id": "9-12", "title": "再婚／重组家庭：资产隔离要更前置", "grade": "C", "impact": "家庭", "cost_money": "低", "cost_time": "低", "cost_will": "低", "three_zero": false, "spend": "婚前／再婚前做财产约定与账户梳理。", "gain": "降低财产混同与继承纠纷击穿投资本金的风险。", "source": "民法典婚姻家庭编；最高法相关解释。", "plain": "重组家庭的财产边界比初婚更该厘清。提前约定、留痕，是保护双方也是保护孩子。", "notes": []}, {"chapter": 9, "num": 13, "id": "9-13", "title": "长寿风险：退休可能长达 30 年", "grade": "B", "impact": "自己／后代", "cost_money": "低", "cost_time": "低", "cost_will": "低", "three_zero": false, "spend": "按“退休后活 25–30 年”而非 10 年做规划。", "gain": "避免“钱比人先花光”。4% 法则正基于约 30 年退休期；我国人均预期寿命已近 80 岁。", "source": "Bengen (1994) 4% 法则；国家统计局预期寿命数据。", "plain": "60 岁退休、活到 90 岁很常见。别按“退休十年就够”算钱，那会让你 75 岁就坐吃山空。", "notes": []}, {"chapter": 11, "num": 1, "id": "11-1", "title": "股票交易印花税：单边万分之五（2023 减半）", "grade": "A", "impact": "自己", "cost_money": "低", "cost_time": "无", "cost_will": "无", "three_zero": false, "spend": "卖出时按成交金额 0.05% 缴纳（2023 年 8 月 28 日起减半，此前 0.1%；自 2008 年起单边向卖方征收）。", "gain": "知道这笔固定成本后，少做无意义的小额买卖——频繁交易下印花税与佣金叠加，每年可咬掉几个点。", "source": "财政部 税务总局公告 2023 年第 39 号（减半征收）；《中华人民共和国印花税法》（单边征收）。", "plain": "买卖股票唯一绕不开的税。2023 减半后每卖 1 万元交 5 元。钱不多，但它是\"交易越频亏越多\"的隐形推手——只按在卖出端，你每卖一次就先输 0.05%。", "notes": []}, {"chapter": 11, "num": 2, "id": "11-2", "title": "股息红利税：持股超 1 年免税", "grade": "A", "impact": "自己", "cost_money": "无", "cost_time": "无", "cost_will": "低", "three_zero": false, "spend": "想拿免税分红，得拿住超过 1 年（持股 1 月内 20%、1 月–1 年 10%、超 1 年 0%）。", "gain": "长期持有高股息股，分红个税从 20% 降到 0，直接增厚税后收益——对红利/股息策略者是白给的利差。", "source": "财税〔2015〕101 号《上市公司股息红利差别化个人所得税政策》；税务总局 12366 纳税服务平台解答。", "plain": "国家用税鼓励你长期拿。同一笔分红，拿 20 天交 20% 税、拿 400 天交 0。红利策略者这条必须卡死。", "notes": []}, {"chapter": 11, "num": 3, "id": "11-3", "title": "券商佣金与\"免五\"陷阱", "grade": "B", "impact": "自己", "cost_money": "低", "cost_time": "低", "cost_will": "低", "three_zero": false, "spend": "佣金（普遍万 0.854 起，多数券商默认\"每笔最低 5 元\"不免五）。", "gain": "选低佣券商 + 谈下\"免五\"，小额分批买入时单笔成本从 5 元降到按金额算，省下的就是赚的。", "source": "证监会证券公司佣金管理相关规定；行业佣金水平披露。", "plain": "很多券商默认每笔最低 5 元，你买 1000 元股票也要交 5 元（等于 0.5%）。谈下\"免五\"后按万分之几算。小额定投党尤该盯着这条。", "notes": []}, {"chapter": 11, "num": 4, "id": "11-4", "title": "交易摩擦合计：印花税+佣金+过户费", "grade": "B", "impact": "自己", "cost_money": "低", "cost_time": "无", "cost_will": "无", "three_zero": false, "spend": "单边印花税 0.05% + 双向佣金（万 0.854 起）+ 过户费（约万 0.1，沪深双向）。", "gain": "看清一次完整买卖的摩擦约 0.1%–0.2%；年换手 1000% 时摩擦吞掉 1%–2%，高频时更高。", "source": "中国结算过户费标准；前述佣金与印花税法规。", "plain": "每次买卖表面\"没花钱\"，其实先被摩擦咬一口。换手越猛，这一口越深——这是频繁交易亏损的硬成本来源之一。", "notes": []}, {"chapter": 11, "num": 5, "id": "11-5", "title": "打新规则：市值门槛 + 信用申购", "grade": "C", "impact": "自己", "cost_money": "低", "cost_time": "低", "cost_will": "低", "three_zero": false, "spend": "需持有对应市场非限售股市值（沪/深分开算）获得申购额度；中签后缴款。", "gain": "在持股市值基础上顺手参与，中签即赚价差的\"免费彩票\"（破发后仍可能亏）。", "source": "沪深交易所新股申购规则；证券业协会打新相关业务指引。", "plain": "不用额外掏钱买资格，账户里有股票市值就有额度。但别为凑市值去重仓高风险股——本末倒置。", "notes": []}, {"chapter": 11, "num": 6, "id": "11-6", "title": "打新破发率变化：从\"必赚\"到\"挑着打\"", "grade": "B", "impact": "自己", "cost_money": "低", "cost_time": "低", "cost_will": "低", "three_zero": false, "spend": "研究发行估值、挑着打的时间（避开\"三高\"发行）。", "gain": "避开破发。破发率 2022 峰值约 28%，2024 降到约 3%，2025 接近 0——但回归不代表无风险。", "source": "券商中国/新浪财经破发率统计（2021≈4%、2022≈28%、2023≈17%、2024≈3%、2025≈0）。", "plain": "注册制后\"新股不败\"被打破。现在要看发行估值，贵的不打、便宜的打。当成稳定收入已不成立，当成免费彩票可以。", "notes": []}, {"chapter": 11, "num": 7, "id": "11-7", "title": "退市与 ST：本金永久损失风险", "grade": "A", "impact": "自己／家庭", "cost_money": "无", "cost_time": "低", "cost_will": "低", "three_zero": false, "spend": "几分钟判断\"是否踩雷\"（营收/净资产/审计意见等红线）。", "gain": "避开退市股——一旦退市，流动性归零、重组渺茫，常见跌去 70%–90% 甚至归零。", "source": "沪深交易所《股票上市规则》（财务类/交易类/规范类强制退市）；退市案例统计。", "plain": "A 股退市常态化后，炒 ST、赌重组是刀口舔血。便宜≠便宜货，连续亏损/被出具非标审计意见的，先躲开。", "notes": []}, {"chapter": 11, "num": 8, "id": "11-8", "title": "融资融券（两融）：杠杆的合法外衣", "grade": "A", "impact": "自己／家庭", "cost_money": "低", "cost_time": "低", "cost_will": "低", "three_zero": false, "spend": "利息（约 5%–8%/年）+ 维持担保比例线，跌破会被强平。", "gain": "理论放大收益，但下跌时亏损同步放大，触及平仓线在最低点被清仓、永久出局。", "source": "沪深交易所融资融券业务管理办法；SEC 杠杆警示（同理适用）。", "plain": "两融就是\"向券商借钱炒股\"。牛市它让你更爽，熊市它让你在地板价被强制卖出。普通人默认不用。", "notes": []}, {"chapter": 11, "num": 9, "id": "11-9", "title": "沪深港通（北向/南向）：跨市场配置通道", "grade": "C", "impact": "自己", "cost_money": "低", "cost_time": "低", "cost_will": "低", "three_zero": false, "spend": "汇率换算成本 + 交易时段差异。", "gain": "不换汇也能买港股通标的，分散单一市场；但需注意港股无涨跌幅、交收与波动规则不同。", "source": "沪深港通业务规则；央行跨境资金安排。", "plain": "想配点腾讯、美团不用开香港户，港股通就行。但港股波动更大、没有涨跌停，别拿 A 股经验套。", "notes": []}, {"chapter": 11, "num": 10, "id": "11-10", "title": "可转债打新：近乎免费的\"彩票\"但有破发", "grade": "C", "impact": "自己", "cost_money": "低", "cost_time": "低", "cost_will": "低", "three_zero": false, "spend": "中签后缴款（常 1000–2000 元）+ 上市首日卖出的纪律。", "gain": "历史破发率低、上市多上涨；但 2019–2022 炒作后高位转债回撤可达 30%+，破发与强赎并存。", "source": "可转债发行与交易规则；交易所可转债数据。", "plain": "可转债打新几乎零门槛、中签再缴款，是少有的\"先中奖后付钱\"。但上市首日别贪，落袋为安；高位转债别当股票炒。", "notes": []}, {"chapter": 11, "num": 11, "id": "11-11", "title": "A 类/C 类基金：持有期决定选哪类", "grade": "B", "impact": "自己", "cost_money": "低", "cost_time": "低", "cost_will": "无", "three_zero": false, "spend": "A 类前端申购费（持有越久越划算）、C 类销售服务费（按日计提、短期更便宜）。", "gain": "计划持有 >1–2 年选 A 类，<1 年选 C 类，差出 0.5%–1% 费用。", "source": "公募基金费率披露规则；晨星基金成本研究。", "plain": "同一只基金的 A/C 份额，区别只在收费方式。短期炒选 C（免申购费），长期拿选 A（免销售服务费）。别拿反。", "notes": []}, {"chapter": 11, "num": 12, "id": "11-12", "title": "基金分红：选\"红利再投资\"而非现金", "grade": "B", "impact": "自己", "cost_money": "无", "cost_time": "无", "cost_will": "无", "three_zero": true, "spend": "开户/申购时改一次分红方式（默认常是现金分红）。", "gain": "红利再投资免申购费直接增份额，长期复利不被打断；现金分红反而可能打断复利、再买还收申购费。", "source": "公募基金分红与税收规则；复利数学。", "plain": "现金分红等于\"基金帮你卖一点然后给你现金\"，你再买回去还要申购费。红利再投资直接转份额，免费、连续复利。", "notes": []}, {"chapter": 12, "num": 1, "id": "12-1", "title": "1% 年费率：30 年吃掉约 26% 终值", "grade": "A", "impact": "自己／后代", "cost_money": "无", "cost_time": "无", "cost_will": "低", "three_zero": false, "spend": "选费率 1% 而非 0.1% 产品的\"省事\"。", "gain": "30 年后，1% 费率比 0.1% 少拿约 26% 的终值（2% 费率少拿约 45%）。费率是确定性最高的负回报。", "source": "Carhart (1997) 费用与长期回报研究；复利数学（(1.07/1.08)^30 量级）。", "plain": "你挑基金时纠结涨 1% 还是跌 1%，却对每年白扣的 1% 管理费视而不见。30 年复利下，这 1% 吞掉你四分之一的本金增长。", "notes": []}, {"chapter": 12, "num": 2, "id": "12-2", "title": "频繁交易：最高换手组比最低组年化低约 6.5 个百分点", "grade": "A", "impact": "自己", "cost_money": "低", "cost_time": "低", "cost_will": "低", "three_zero": false, "spend": "频繁买卖的快感。", "gain": "避免这部分损耗。Barber & Odean 研究：交易最频繁的家庭年化比最不频繁的低约 6.5 个百分点。", "source": "Barber & Odean (2000)《Trading Is Hazardous to Your Wealth》, Journal of Finance。", "plain": "越折腾越穷，不是玩笑。把换手率降到最低的那群人，长期就是比折腾的人多赚 6.5 个点/年。", "notes": []}, {"chapter": 12, "num": 3, "id": "12-3", "title": "小散最惨：10 万元以下账户平均亏 20.53%", "grade": "A", "impact": "自己", "cost_money": "无", "cost_time": "低", "cost_will": "低", "three_zero": false, "spend": "承认\"小账户追涨杀跌\"的行为模式。", "gain": "避开这个模式。施东辉/张晓燕等基于上交所 2016–2019 年 5340 万账户：10 万元以下账户平均收益 −20.53%。", "source": "Shi, Zhang et al. 上交所账户级数据研究（2016–2019）。", "plain": "钱越少、动得越凶、亏得越多。这不是运气，是被行为金融钉死的数据——小账户做动量交易年化约 −4.57%。", "notes": []}, {"chapter": 12, "num": 4, "id": "12-4", "title": "月换手超 100%：年度亏损率约 91.3%", "grade": "A", "impact": "自己", "cost_money": "低", "cost_time": "低", "cost_will": "低", "three_zero": false, "spend": "高换手的操作习惯。", "gain": "把亏损概率从九成降到可接受。公开转引的上交所行为数据：月换手率 >100% 的账户年度亏损率约 91.3%。", "source": "上交所投资者行为数据（公开转引）。", "plain": "一个月把仓位翻一遍以上的人，十个人里九个亏。换手率是最诚实的\"亏钱概率计\"。", "notes": []}, {"chapter": 12, "num": 5, "id": "12-5", "title": "月均交易超 20 次：亏损率约 84.6%", "grade": "A", "impact": "自己", "cost_money": "低", "cost_time": "低", "cost_will": "低", "three_zero": false, "spend": "每天看盘、动手指的习惯。", "gain": "减少操作次数即减亏。上交所数据：月均交易超过 20 次的账户亏损率约 84.6%。", "source": "上交所投资者行为数据（公开转引）。", "plain": "交易频率是亏损的领先指标。把\"每天看盘\"改成\"每月看一次\"，就甩掉了八成亏损人群。", "notes": []}, {"chapter": 12, "num": 6, "id": "12-6", "title": "持仓不足 1 个月：盈利概率仅约 9.3%", "grade": "A", "impact": "自己", "cost_money": "无", "cost_time": "低", "cost_will": "低", "three_zero": false, "spend": "短线快进快出的期待。", "gain": "把盈利概率从个位数拉到多数。上交所数据：持仓不足 1 个月的超短线账户盈利概率约 9.3%、年化亏损约 18.7%。", "source": "上交所投资者行为数据（公开转引）。", "plain": "拿着股票不到一个月就想卖的人，十次里只有一次赚钱。短线是散户送钱给市场的传送带。", "notes": []}, {"chapter": 12, "num": 7, "id": "12-7", "title": "基金回报差：偏股基金投资者每年少拿 2%–3.6%", "grade": "A", "impact": "自己", "cost_money": "低", "cost_time": "低", "cost_will": "低", "three_zero": false, "spend": "追涨杀跌的申赎节奏。", "gain": "管住申赎，把\"基金赚、基民不赚\"的鸿沟补回来。晨星中国：截至 2024 末五年期，偏股型回报差 −2.17%、主动股票 −2.65%、行业基金 −3.59%。", "source": "晨星（中国）《中国公募基金投资者回报差研究》（2025）。", "plain": "同样的基金，你因为高点买低点卖，每年比基金本身少赚 2–3.6 个点。这不是市场的问题，是你交易节奏的问题。", "notes": []}, {"chapter": 12, "num": 8, "id": "12-8", "title": "持有期越长亏得越少：<半年亏概率>50%，>3 年<20%", "grade": "A", "impact": "自己", "cost_money": "低", "cost_time": "低", "cost_will": "低", "three_zero": false, "spend": "拿不住的耐心。", "gain": "拉长持有期直接降亏损概率。机构数据：持有基金不足半年亏损概率 >50%，持有 3 年以上降至 <20%；但 66% 基民持有时长 <1 年。", "source": "基金业协会/平台持有人行为数据；晨星回报差研究。", "plain": "基金赚钱的秘诀就一个字：等。可惜大多数人拿不住——66% 的人持有不到一年，把\"等\"这一步自己删了。", "notes": []}, {"chapter": 12, "num": 9, "id": "12-9", "title": "黄金 1800 年实际年化约 0.5%：它是保险不是投资", "grade": "B", "impact": "自己", "cost_money": "低", "cost_time": "低", "cost_will": "低", "three_zero": false, "spend": "把黄金当\"抗通胀发财工具\"的想象。", "gain": "认清它的真实角色——危机对冲。Credit Suisse《Yearbook》：1800 年至今黄金实际年化约 0.5%–1%。", "source": "Credit Suisse《Global Investment Returns Yearbook》；长期贵金属回报研究。", "plain": "两百年下来黄金扣掉通胀几乎没涨。它的价值是\"别人 panic 时它涨\"，配 5%–10% 当保险，重仓当发财是误会。", "notes": []}, {"chapter": 12, "num": 10, "id": "12-10", "title": "主动基金 15 年约 92% 跑不赢指数", "grade": "A", "impact": "自己", "cost_money": "低", "cost_time": "低", "cost_will": "低", "three_zero": false, "spend": "花高价请基金经理打败市场的期待。", "gain": "直接买低成本指数。标普 SPIVA：过去 15 年约 92% 的美国主动基金跑输标普 500。", "source": "S&P Dow Jones Indices《SPIVA》报告。", "plain": "你付 1.5% 管理费请人打败市场，结果十五年里九成以上的人没打败。这不是个别，是统计规律。", "notes": []}, {"chapter": 12, "num": 11, "id": "12-11", "title": "资产配置解释约 90% 的回报波动", "grade": "B", "impact": "自己", "cost_money": "低", "cost_time": "低", "cost_will": "低", "three_zero": false, "spend": "花大量时间选个股/择时的精力。", "gain": "把精力放在\"股债比例\"这个真正决定波动的旋钮上。Brinson 等：资产配置解释组合回报波动的约 90%。", "source": "Brinson, Hood & Beebower (1986)《Determinants of Portfolio Performance》。", "plain": "你纠结买哪只股票，不如先定\"股几债几\"。决定你睡不睡得着的，是大类比例，不是那几只票。", "notes": []}, {"chapter": 12, "num": 12, "id": "12-12", "title": "打新破发率峰值 28%（2022）：红利会消失", "grade": "A", "impact": "自己", "cost_money": "低", "cost_time": "低", "cost_will": "低", "three_zero": false, "spend": "把\"打新必赚\"当永久常识。", "gain": "保持对规则变化的警觉。A 股破发率 2022 峰值约 28%、2024 降至约 3%、2025 接近 0——但注册制下随时可能回升。", "source": "券商中国/新浪财经破发率统计。", "plain": "没有永远的套利。2021 前闭眼打新赚钱，2022 就亏掉两成多。把\"免费午餐\"当永久福利，迟早被反噬。", "notes": []}, {"chapter": 12, "num": 13, "id": "12-13", "title": "杠杆：跌 50% 需 +100% 回本，加杠杆可归零", "grade": "A", "impact": "自己／家庭", "cost_money": "无", "cost_time": "低", "cost_will": "低", "three_zero": false, "spend": "无杠杆时用\"跌了还能回本\"的安全感。", "gain": "远离杠杆。无杠杆跌 50% 仍在牌桌（回本需 +100%）；加杠杆可能在 −50% 前就被强平，连回本机会都没有。", "source": "杠杆与强平机制；SEC 保证金警示。", "plain": "杠杆不改胜率，只把\"波动\"变成\"死亡\"。它让小回调变成灭顶之灾——普通投资者最该永久拉黑的按钮。", "notes": []}, {"chapter": 12, "num": 14, "id": "12-14", "title": "择时损耗约 3–4 个百分点/年", "grade": "A", "impact": "自己", "cost_money": "低", "cost_time": "低", "cost_will": "低", "three_zero": false, "spend": "试图高抛低吸的尝试。", "gain": "放弃择时、长期持有，省下这部分确定性损耗。Dalbar QAIB：因择时与交易，投资者实际年化比市场低约 3–4 个百分点。", "source": "Dalbar《Quantitative Analysis of Investor Behavior》(QAIB)。", "plain": "你以为自己在\"躲大跌抄底\"，数据说你每年因此少赚 3–4 个点。择时的代价，是确定且昂贵的。", "notes": []}, {"chapter": 12, "num": 15, "id": "12-15", "title": "散户贡献八成交易量、盈利不到一成", "grade": "A", "impact": "自己", "cost_money": "无", "cost_time": "低", "cost_will": "低", "three_zero": false, "spend": "把\"频繁操作\"当参与感的错觉。", "gain": "少动即少输。《上交所统计年鉴(2018)》：2017 年个人投资者交易量占比 82.01%，盈利却只占机构不到三成、总盈利不足一成。", "source": "《上海证券交易所统计年鉴(2018 卷)》。", "plain": "散户干了八成的活，赚了不到一成的钱。这不是段子，是年鉴白纸黑字。结论很清楚：少干点活，多赚点钱。", "notes": []}, {"chapter": 13, "num": 1, "id": "13-1", "title": "开个人养老金账户，先吃税优", "grade": "A", "impact": "自己/后代", "cost_money": "低", "cost_time": "低", "cost_will": "低", "three_zero": false, "spend": "每年最多缴 12000 元（2022 年起制度，可投养老理财/基金/存款/保险）；开户与操作约半小时。", "gain": "缴费阶段在综合所得或经营所得中限额税前扣除（EET：缴时免、投时免、领时征）；账户内投资收益暂不征个税；领取时仅按 3% 单独计税（不并入综合所得）。对个税边际税率 ≥10% 的人，当下即省税；对 3% 档几乎中性，仍赚长期免税复利。", "source": "国务院办公厅《关于推动个人养老金发展的意见》（国办发〔2022〕7 号）；财政部 税务总局公告 2022 年第 34 号；人社部实施办法。", "plain": "这是国家给的合法税优口子，年上限 1.2 万，领钱时只抽 3%。你税率越高越该用；税率本来就 3% 也别嫌弃，白捡免税复利。闭眼开户，挑个低费率养老目标基金或存款即可。", "notes": []}, {"chapter": 13, "num": 2, "id": "13-2", "title": "“4% 法则”能帮你估养老要攒多少", "grade": "A", "impact": "自己", "cost_money": "无", "cost_time": "低", "cost_will": "无", "three_zero": false, "spend": "理解它的前提（一次性读完即可）。", "gain": "1994 年 Bengen 研究：退休首年提取投资组合的 4%，之后按通胀逐年上调，在「约 50% 股票 + 50% 债券」组合下，历史上绝大多数 30 年区间钱花不完。即「目标年支出 ÷ 4%」≈ 需攒的本金（例：年花 12 万 → 需约 300 万）。", "source": "Bengen, W. P. (1994), \"Determining Withdrawal Rates Using Historical Data\", Journal of Financial Planning.", "plain": "一个被反复验证的经验锚：攒到「每年要花的 25 倍」基本够退休。它不是铁律——遇大萧条早期或寿命超 30 年会被击穿，但作为「我到底要攒多少」的第一近似值够用。", "notes": []}, {"chapter": 13, "num": 3, "id": "13-3", "title": "别把社保替代率当靠山", "grade": "C", "impact": "自己", "cost_money": "无", "cost_time": "无", "cost_will": "无", "three_zero": true, "spend": "接受现实的心理成本。", "gain": "世界银行建议退休收入替代率约 70% 才维持生活水准，国际劳工组织最低线 55%；我国城镇职工基本养老金平均替代率近年在 40%+ 区间波动（口径有争议）。只靠社保，退休后生活水平大概率明显下台阶。", "source": "World Bank (1994) Averting the Old Age Crisis；ILO 第 102 号公约；人社部历年统计公报〔争议：替代率口径各家算法不一〕。", "plain": "社保是「兜底不兜富」。想退休不掉档，差额得自己用个人养老金、储蓄、投资补。别等临近退休才发现窟窿。", "notes": []}, {"chapter": 13, "num": 4, "id": "13-4", "title": "养老钱先铺「安全垫」再谈增值", "grade": "B", "impact": "自己", "cost_money": "无", "cost_time": "低", "cost_will": "低", "three_zero": false, "spend": "放弃用养老本金博高收益的机会。", "gain": "临近退休（前 5–10 年）把要用的钱逐步挪到存款、国债、纯债、年金等低波动资产，降低「退休那年正好碰上大跌」的致命风险（顺序收益率风险 / sequence-of-returns risk）。", "source": "退休 glide-path 研究（target-date fund 设计逻辑）；Vanguard / Morningstar 退休支出框架。", "plain": "年轻时可以扛波动，快退休了还满仓股票，万一开局连跌三年，本金永久少一截、又没收入补，最惨。越接近退休越该把「确定要花的钱」锁进稳的。", "notes": []}, {"chapter": 13, "num": 5, "id": "13-5", "title": "长寿风险：人活着，钱没了", "grade": "C", "impact": "自己/后代", "cost_money": "无", "cost_time": "无", "cost_will": "无", "three_zero": true, "spend": "为「活太久」预留缓冲的克制。", "gain": "预期寿命持续延长，女性、城市人群尤甚；退休期可能长达 30 年。用 4% 法则时按 30–35 年算，或保留一部分终身年金/社保这类「活多久领多久」的现金流对冲。", "source": "UN World Population Prospects；各国生命表；保险精算通用假设。", "plain": "现在人越活越长，退休金按 20 年算会不够。要么多攒，要么买点「活到老领到老」的年金把尾巴风险切掉。", "notes": []}, {"chapter": 13, "num": 6, "id": "13-6", "title": "年金把「寿命不确定」变成确定现金流", "grade": "B", "impact": "自己", "cost_money": "低", "cost_time": "低", "cost_will": "低", "three_zero": false, "spend": "一笔保费（或账户转换），流动性归零。", "gain": "此后每月固定领钱、与寿命等长，专治「怕活太久」。对没有稳定养老金来源的普通人，能消除最坏的尾部风险。", "source": "年金精算原理；retirement income 文献（如 Milevsky 系列研究）。", "plain": "年金本质是你把「活太久」的风险卖给保险公司。它不性感、收益不亮眼，但能保你不会 90 岁还在为吃饭发愁。适合作为养老组合里「保底那块」，不是全部。", "notes": []}, {"chapter": 13, "num": 7, "id": "13-7", "title": "长期护理是养老最大的不确定账单", "grade": "C", "impact": "自己/家庭", "cost_money": "无", "cost_time": "无", "cost_will": "无", "three_zero": true, "spend": "提前规划的意识。", "gain": "失能后的照护成本（请人/机构）往往远超日常开销，且社保覆盖有限。提前配护理险、保留流动性、与家人约定分工，比事发后措手不及强。", "source": "老龄化研究；长期照护成本调查〔争议：地区与照护等级差异极大〕。", "plain": "养老最烧钱的不是吃饭旅游，是失能后的护理。这笔钱社保补不了多少，要么买护理险，要么留一笔随时能取的活钱，别全锁死在房产里。", "notes": []}, {"chapter": 13, "num": 8, "id": "13-8", "title": "退休年龄只会越来越晚", "grade": "C", "impact": "自己", "cost_money": "无", "cost_time": "无", "cost_will": "无", "three_zero": true, "spend": "接受延迟退休的趋势。", "gain": "多国因老龄化上调法定退休年龄；我国已明确渐进式延迟退休。意味着「领钱年份缩短、缴费年份拉长」，个人养老储备的窗口被进一步压实。", "source": "人社部延迟退休方案（2024 公布，渐进实施）；OECD Pensions at a Glance。", "plain": "别按「60 岁准时退休」算账。政策方向是往后延，你的储备计划得按更晚退休、更长退休期两边夹。", "notes": []}, {"chapter": 13, "num": 9, "id": "13-9", "title": "养老别全压在房子上", "grade": "C", "impact": "自己", "cost_money": "无", "cost_time": "无", "cost_will": "无", "three_zero": true, "spend": "分散配置的觉悟。", "gain": "房子难变现、难分割、有维护与税费摩擦；急需用钱时卖不出或贱卖。养老现金流应至少有一部分在能按月取用的金融资产上。", "source": "房产流动性研究；退休资产流动性框架〔争议：核心地段房产流动性差异大〕。", "plain": "一套房不能当养老金用——你没法按月「吃房子」。真到要用钱，卖房慢、还可能赶上低点。养老钱得分一部分在能随时取的地方。", "notes": []}, {"chapter": 13, "num": 10, "id": "13-10", "title": "通胀是养老的隐形杀手，看真实回报", "grade": "B", "impact": "自己", "cost_money": "无", "cost_time": "低", "cost_will": "无", "three_zero": false, "spend": "记账时多算一步「扣通胀」。", "gain": "长期通胀 2–3% 下，30 年购买力 silently 腰斩。养老组合必须含能跑赢通胀的资产（股票/宽基指数/REITs/TIPS），全存银行会被通胀啃。", "source": "通胀与资产回报的长期研究（如 Siegel, Stocks for the Long Run）；CPI 长期均值。", "plain": "你以为存银行稳妥，30 年后那笔钱买不了同样的东西。养老钱不能全放存款，得留一部分能跟通胀走的。", "notes": []}, {"chapter": 13, "num": 11, "id": "13-11", "title": "越老越该降波动（下滑轨道）", "grade": "B", "impact": "自己", "cost_money": "无", "cost_time": "低", "cost_will": "低", "three_zero": false, "spend": "年轻时的一部分潜在高收益。", "gain": "随年龄增长自动把股票比例调低（target-date / glide path），避免退休临界点遭遇大跌。历史回测显示，临近退休降波动能显著降低「退休即亏」的概率。", "source": "target-date fund 设计文献；glide path 回测（如 Kitces 研究）。", "plain": "25 岁满仓股票没问题，55 岁还满仓就赌命。年纪越大越要把「确定要花的钱」挪去稳的，这是用纪律换睡眠。", "notes": []}, {"chapter": 13, "num": 12, "id": "13-12", "title": "给父母和自己先配医疗险，别先理财", "grade": "C", "impact": "家庭", "cost_money": "低", "cost_time": "低", "cost_will": "低", "three_zero": false, "spend": "一年几千到上万的保费。", "gain": "一场大病自费部分可能瞬间吞掉多年积蓄；百万医疗/防癌/惠民保能把这种尾部风险拦住。保障没做足前，先别谈「养老理财增值」。", "source": "健康风险与家庭资产负债表研究；商业健康险赔付数据。", "plain": "父母一场病可能把你的养老本金掏空。先把医疗险这道防火墙立起来，剩下再谈增值。顺序错了，增值全是纸上富贵。", "notes": []}, {"chapter": 14, "num": 1, "id": "14-1", "title": "保险姓保：先保人，再保钱", "grade": "C", "impact": "家庭", "cost_money": "无", "cost_time": "低", "cost_will": "无", "three_zero": false, "spend": "放弃「用保险赚钱」的幻想。", "gain": "保险的核心功能是「转移你扛不住的风险」，不是投资。监管也反复强调「保险姓保」。把保障做足，剩下的钱才拿去投资，别让理财型保单挤占了真正需要的保障预算。", "source": "金融监管总局「保险姓保」监管导向；保险功能定位共识。", "plain": "保险是盾不是矛。先想「什么风险我能扛、什么扛不住」，扛不住的（重病、意外、早逝）才用保险转出去；别本末倒置买成储蓄。", "notes": []}, {"chapter": 14, "num": 2, "id": "14-2", "title": "保障优先级：医疗＞意外＞重疾＞定寿＞年金", "grade": "C", "impact": "家庭", "cost_money": "低", "cost_time": "低", "cost_will": "低", "three_zero": false, "spend": "按这个顺序排预算。", "gain": "先堵「高频小额+低频大额」的医疗与意外（杠杆极高、便宜）；再补重疾的收⼊补偿；家庭支柱加定期寿险（覆盖房贷与抚养）；最后才考虑年金类储蓄。顺序反了=钱花在刀刃外。", "source": "保障型保险配置通用框架；家庭风险管理共识〔争议：单身/已财务自由者优先级可调整〕。", "plain": "百万医疗一年几百块能顶几百万，比先买年金实在得多。先保「会让你一夜返贫」的风险，再想增值。", "notes": []}, {"chapter": 14, "num": 3, "id": "14-3", "title": "定期寿险是杠杆最高的「爱的保险」", "grade": "B", "impact": "家庭", "cost_money": "低", "cost_time": "低", "cost_will": "低", "three_zero": false, "spend": "年保费（30 岁健康男性，百万保额年缴常仅千元量级）。", "gain": "在责任最重的年纪（有房贷、有娃、有父母要养），万一早逝，一笔赔付替你继续履行供养义务，防止家庭因顶梁柱倒下而崩。消费型、纯保障、不返还，所以便宜。", "source": "寿险精算定价原理；家庭保障需求分析（收入替代法）。", "plain": "定寿是「用最少的钱，买最重的责任兜底」。年轻、负债多、家里靠你养——这是第一张该买的保单。别买成又贵又杂的返还型。", "notes": []}, {"chapter": 14, "num": 4, "id": "14-4", "title": "重疾险是「收入补偿」，医疗险是「报销」", "grade": "C", "impact": "自己", "cost_money": "低", "cost_time": "低", "cost_will": "低", "three_zero": false, "spend": "理解两者分工，分别配置。", "gain": "医疗险凭票报销治疗费；重疾险是确诊约定病种直接给一笔钱，用来补停工收入、康复、家庭开支——它不报销，是「得病了给你一笔周转」。两者不冲突，互补。", "source": "健康险产品形态定义；保险条款通用结构。", "plain": "别以为有医疗险就够。得场大病可能一两年不能工作，房贷娃还得还——重疾险那笔钱就是给你续命的现金流。", "notes": []}, {"chapter": 14, "num": 5, "id": "14-5", "title": "理财型保险的真实回报，多数跑不赢通胀", "grade": "B", "impact": "自己", "cost_money": "低", "cost_time": "低", "cost_will": "低", "three_zero": false, "spend": "把保费当「投资」的预期。", "gain": "分红/万能/年金类保单的演示利率常含不保证部分；按监管要求的「现金价值」倒算 IRR，长期真实水平多在 2–3% 区间，扣通胀所剩无几，且前几年退保本金都拿不回。它的卖点是「确定」不是「高收益」。", "source": "保单 IRR 测算方法；监管对演示利率的披露要求；消费者退保损失数据〔争议：具体 IRR 随产品与持有期差异大〕。", "plain": "业务员演示的「复利 4%」多半是假设。真按合同现金价值算，长期 IRR 往往 2–3 个点，还锁死流动性。要增值去投指数基金，要确定的保底才考虑它。", "notes": []}, {"chapter": 14, "num": 6, "id": "14-6", "title": "香港保险的三重坑：外汇、汇率、诉讼", "grade": "C", "impact": "自己", "cost_money": "低", "cost_time": "中", "cost_will": "中", "three_zero": false, "spend": "跨境投保的隐性成本与风险意识。", "gain": "① 续费/理赔涉及跨境资金，受外汇额度与合规约束；② 港元/美元保单，人民币升值时收益被吃；③ 真出纠纷在境外诉讼，成本与语言门槛极高。适合已有外币需求的人，不适合冲着「高收益」去。", "source": "外汇管理规定；跨境保险纠纷案例；汇率风险常识。", "plain": "香港保单演示收益好看，但钱进出不自由、汇率会反噬、打官司要跑香港。除非你本来就有美元配置需求，否则别为那点演示利差跨境折腾。", "notes": []}, {"chapter": 14, "num": 7, "id": "14-7", "title": "别把保险当投资，分开算账", "grade": "C", "impact": "自己", "cost_money": "无", "cost_time": "低", "cost_will": "无", "three_zero": false, "spend": "割裂「保障」与「收益」的思维。", "gain": "一旦把保险当投资，容易被「有病赔、没病返本」的话术带偏，花数倍保费买低保障。保障归保障（便宜的纯消费型），投资归投资（指数/存款），各自买最划算的。", "source": "保险消费误区研究；监管消费者教育材料。", "plain": "「没出事还能返钱」的保单，本质是你多交的钱被拿去投资再分你一点，保障还更薄。分开买，两边都更便宜。", "notes": []}, {"chapter": 14, "num": 8, "id": "14-8", "title": "健康告知如实填，否则白买", "grade": "C", "impact": "自己", "cost_money": "无", "cost_time": "低", "cost_will": "低", "three_zero": false, "spend": "投保时多花十分钟核对病史。", "gain": "未尽如实告知义务，出险时保险公司可拒赔并解除合同（且可能不退保费）。「两年不可抗辩」也不是万能挡箭牌，隐瞒重大病史照样扯皮。", "source": "《保险法》第十六条（如实告知与解除权）；司法实践。", "plain": "投保时瞒病史，省了十分钟，赔时丢全部。该填的填，别信业务员「不用告」的嘴。两年后也不绝对保险。", "notes": []}, {"chapter": 14, "num": 9, "id": "14-9", "title": "豁免条款是便宜的「双保险」", "grade": "C", "impact": "家庭", "cost_money": "低", "cost_time": "低", "cost_will": "无", "three_zero": false, "spend": "附加豁免的少量保费。", "gain": "投保人/被保人万一重疾或身故，后续保费免缴、保障继续。给「给家人投保」的场景（如夫妻互保、父母给娃保）尤其值。", "source": "保单豁免责任条款；家庭投保实务。", "plain": "花一点钱，万一你倒下，家人的保单不用再缴费还继续有效。给娃或配偶投保时顺手勾上，性价比很高。", "notes": []}, {"chapter": 14, "num": 10, "id": "14-10", "title": "先给家庭支柱买，不是先给孩子买", "grade": "C", "impact": "家庭", "cost_money": "无", "cost_time": "低", "cost_will": "无", "three_zero": false, "spend": "纠正「爱孩子先保孩子」的直觉。", "gain": "孩子没有收入，失去孩子经济冲击是情感性的；失去赚钱的家长才是家庭财务崩盘。预算有限时，先保收入来源者，再保依赖者。", "source": "家庭风险管理优先级共识。", "plain": "很多家长第一张保单给孩子，错了。你才是娃的「印钞机」，你倒了全家断粮。先保赚钱的那个。", "notes": []}, {"chapter": 14, "num": 11, "id": "14-11", "title": "别反复退保重买，摩擦吃掉本金", "grade": "C", "impact": "自己", "cost_money": "低", "cost_time": "低", "cost_will": "低", "three_zero": false, "spend": "换产品的冲动。", "gain": "长期险前几年现金价值极低，退保拿不回本金；年龄增长后重新投保更贵甚至可能拒保。除非产品确实坑，否则别频繁「以旧换新」。", "source": "保单现金价值曲线；退保损失数据。", "plain": "听人忽悠「旧的不如新的」就退，前几年本金打水漂，重买还更贵。保险买定离手，别当短线炒。", "notes": []}, {"chapter": 14, "num": 12, "id": "14-12", "title": "警惕「保证收益」的保险话术", "grade": "C", "impact": "自己", "cost_money": "无", "cost_time": "低", "cost_will": "低", "three_zero": false, "spend": "对高演示收益的戒心。", "gain": "凡是把「演示利率」当「保证利率」讲、把不保证分红说成确定回报的，都是红线话术。合同里只有「保证利益」那栏才是真保底的，其余都是假设。", "source": "保险销售合规要求；金融监管总局风险提示。", "plain": "业务员拿彩页上的高档演示当承诺，违法也坑你。翻合同看「保证利益」四个字，别的都是画饼。", "notes": []}, {"chapter": 15, "num": 1, "id": "15-1", "title": "房贷利率是你买房的真实成本", "grade": "B", "impact": "家庭", "cost_money": "低", "cost_time": "低", "cost_will": "低", "three_zero": false, "spend": "算账时把利息算进去。", "gain": "100 万贷 30 年，利率每差 1 个百分点，总利息可差几十万。LPR 锚定 + 加点，签之前货比三家、谈加点，长期省的是真金白银。", "source": "房贷利息计算公式；LPR 定价机制（央行 2019 起改革）。", "plain": "你以为房价是成本，利息才是大头。100 万贷 30 年，利率差 1 个点总利息差二三十万。签约前砍加点，比砍房价容易也更值。", "notes": []}, {"chapter": 15, "num": 2, "id": "15-2", "title": "租售比低于房贷利率，租房可能更划算", "grade": "C", "impact": "自己", "cost_money": "无", "cost_time": "低", "cost_will": "无", "three_zero": false, "spend": "放下「买房永远对」的执念。", "gain": "租售比 = 年租金 / 房价。若一套房租售比 2% 而房贷利率 4%，说明「买房持有成本」高于「租房成本」，差额资金拿去投资若跑赢利差就赚了。核心城市租售比普遍偏低，需算清再决定。", "source": "租售比估值框架；城市租金回报率统计〔争议：城市与地段差异极大〕。", "plain": "买房不是天然正确。租售比 2%、贷款利率 4%，你租房把买房钱拿去投，只要年化超 2% 就不亏。别被「没房不稳」的情绪替你做决定。", "notes": []}, {"chapter": 15, "num": 3, "id": "15-3", "title": "提前还贷，省的是确定性利息", "grade": "B", "impact": "家庭", "cost_money": "低", "cost_time": "低", "cost_will": "低", "three_zero": false, "spend": "一笔可动用的闲钱。", "gain": "当你没有稳定跑赢房贷利率的投资渠道时，提前还贷等于「锁定」等于利率的无风险收益。尤其高利率存量贷、等额本息前期，提前还省利息最明显。", "source": "贷款利息结构（等额本息前期利息占比高）；无风险利率比较。", "plain": "房贷利率 4–5%，你又找不到稳赚超这数的投资，提前还就是稳赚。别拿还贷的钱去赌基金，那叫用确定性换不确定性。", "notes": []}, {"chapter": 15, "num": 4, "id": "15-4", "title": "公积金低息是福利，先用满", "grade": "C", "impact": "家庭", "cost_money": "无", "cost_time": "低", "cost_will": "低", "three_zero": false, "spend": "办贷时多走一步手续。", "gain": "公积金贷款利率显著低于商业贷，能用则用、贷满额度再补商贷组合。不用的余额躺着贬值，不如抵贷省息。", "source": "住房公积金贷款利率政策；组合贷规则。", "plain": "公积金利率比商贷低一截，能贷满就贷满，别嫌麻烦用纯商贷。这是国家给的低息红包，不领白不领。", "notes": []}, {"chapter": 15, "num": 5, "id": "15-5", "title": "房产流动性极差，急用钱卖不出", "grade": "C", "impact": "家庭", "cost_money": "无", "cost_time": "无", "cost_will": "无", "three_zero": true, "spend": "留足非房产流动资产的觉悟。", "gain": "房子从挂牌到成交常需数月，且受行情、学区政策、邻里等因素影响；急用钱时要么贱卖要么借高息。家庭应急金和流动性资产不能全绑在房上。", "source": "房地产流动性研究；二手房成交周期数据〔争议：热门地段差异大〕。", "plain": "房子是「纸面富贵」，真急用钱它救不了你。应急金、能随时取的投资得另留一份，别全家身家锁在一套水泥里。", "notes": []}, {"chapter": 15, "num": 6, "id": "15-6", "title": "杠杆买房，下行时亏损被放大", "grade": "B", "impact": "家庭", "cost_money": "低", "cost_time": "低", "cost_will": "低", "three_zero": false, "spend": "对「加杠杆买房必赚」的警惕。", "gain": "首付 30% 意味着房价跌 30% 你的本金归零（负资产）；若还要抛售，亏损远超投入。杠杆在下行周期把小波动变成灭顶。", "source": "杠杆与资产回撤数学；房价下行案例（如部分城市 2021 后）。", "plain": "三成首付不是「只亏三成」。房价跌三成你本金就没了，再跌你倒欠银行。杠杆买房是双向放大镜，别只记着涨的时候。", "notes": []}, {"chapter": 15, "num": 7, "id": "15-7", "title": "经营贷/消费贷违规流入楼市，是定时炸弹", "grade": "C", "impact": "家庭", "cost_money": "低", "cost_time": "中", "cost_will": "中", "three_zero": false, "spend": "对「低息过桥买房」的诱惑的克制。", "gain": "用经营贷、消费贷套钱付首付或还房贷，违反贷款用途约定，银行抽贷时须立刻还本，资金链一断就暴雷；且涉及骗贷风险。", "source": "金融监管总局信贷资金违规流入楼市整治要求；贷款合同用途条款。", "plain": "有人教你用经营贷低息替换房贷，听着省息，实为违规。银行一旦发现抽贷，你立马要还全款，普通人扛不住。别碰。", "notes": []}, {"chapter": 15, "num": 8, "id": "15-8", "title": "月供别超家庭收入三成，留缓冲", "grade": "C", "impact": "家庭", "cost_money": "无", "cost_time": "无", "cost_will": "无", "three_zero": true, "spend": "克制「顶格贷款买大房」的欲望。", "gain": "月供占收入比过高，一旦失业/降薪/生病就断供。经验上控制在 1/3 以内，留 2/3 覆盖生活与储蓄，抗冲击能力强得多〔争议：具体比例因城市与收入弹性而异〕。", "source": "家庭负债警戒线研究；国际经验法则（如 28/36 规则）〔争议：比例因城市与收入弹性而异〕。", "plain": "银行愿意贷你月供 50% 甚至更高，但那是它的风险不是你的。月供压到三成内，失业半年也不慌。别把杠杆用到极限。", "notes": []}, {"chapter": 15, "num": 9, "id": "15-9", "title": "二手房交易税费摩擦高，别忽视", "grade": "C", "impact": "自己", "cost_money": "低", "cost_time": "低", "cost_will": "低", "three_zero": false, "spend": "买卖时算上进项税费。", "gain": "增值税、个税、契税、中介费叠加，一笔二手房交易摩擦常占房款 5–10%，短期买卖基本被摩擦吃光。持有周期越长，摩擦摊薄越划算。", "source": "二手房交易税费规则；中介费率市场水平。", "plain": "房子「买进价卖出价」中间隔着税和中介，短期炒房这点摩擦就吞了你利润。真要换手，持有久一点把摩擦摊薄。", "notes": []}, {"chapter": 15, "num": 10, "id": "15-10", "title": "学区房溢价有政策风险", "grade": "C", "impact": "家庭", "cost_money": "低", "cost_time": "低", "cost_will": "低", "three_zero": false, "spend": "为「学位」多付的溢价。", "gain": "多校划片、教师轮岗、公民同招等政策持续削弱「一套房锁定名校」的确定性，高溢价学区房可能一夜贬值。用超高溢价赌学位，风险在累积。", "source": "义务教育就近入学/多校划片政策；学区房价格波动案例〔争议：政策落地节奏城市不一〕。", "plain": "花几百万溢价买学区房，赌的是政策不变。可政策正往「多校划片」走，学位一旦不锁定，溢价说没就没。别为不确定性付天价。", "notes": []}, {"chapter": 15, "num": 11, "id": "15-11", "title": "房租收入要扣空置与维护，别算毛租", "grade": "C", "impact": "自己", "cost_money": "低", "cost_time": "低", "cost_will": "低", "three_zero": false, "spend": "记账时扣掉隐性成本。", "gain": "真实租金回报 =（租金 − 空置损失 − 维修 − 物业费 − 管理费 − 税费）/ 房价。毛租看着 3%，净回报可能只剩 1% 出头，并不比存款强。", "source": "租赁投资净收益率核算；rental yield 研究。", "plain": "中介说「租金回报率 3%」，那是毛的。扣掉空着的两月、修水管、物业、税，净的可能 1% 多点，跟存银行差不多还操心。", "notes": []}, {"chapter": 15, "num": 12, "id": "15-12", "title": "多头负债、以贷养贷，是破产前兆", "grade": "C", "impact": "家庭", "cost_money": "无", "cost_time": "低", "cost_will": "低", "three_zero": false, "spend": "直面债务、停借的自律。", "gain": "信用卡、网贷、消费贷互相填窟窿，利息复利滚雪球，最终收入覆盖不了最低还款。一旦出现「借新还旧」，必须立刻止损、盘点、砍支出，而不是再借一笔。", "source": "家庭债务危机研究；过度负债预警指标。", "plain": "以贷养贷不是解法，是坠崖前的加速。一旦要靠借新还旧过日子，马上停手盘点债务，别再借。这是家庭财务的红色警报。", "notes": []}, {"chapter": 16, "num": 1, "id": "16-
