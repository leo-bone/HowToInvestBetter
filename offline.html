source": "西南财经大学中国家庭金融调查与研究中心 (2023). 中国家庭金融调查报告（家庭金融资产中银行存款 57.75%、股票 15.45%，配置单一）. <https://www.sgpjbg.com.cn/searchtag/25973332.html>; 美联储波士顿分行 (2007). The Theory of Life-Cycle Saving and Investing（人力资本跨代视角）. <https://www.bostonfed.org/-/media/Documents/Workingpapers/PDF/ppdp0703.pdf>", "note": "定级 C，因\"财商传承\"缺乏像 4% 法则那样的可量化硬证据，更多是行为经济学与代际流动性研究的推论；与条 9 教育金规划互补——既给钱也教能力。"}, {"chapter": 9, "num": 7, "id": "9-7", "title": "应急金随家庭责任动态调整", "grade": "A", "tags": {"钱": "0", "时间": "少", "毅力": "些", "收益": "中", "口径": "金钱", "影响": "家庭"}, "impact": "家庭", "cost_money": "0", "cost_time": "少", "cost_will": "些", "benefit": "中", "scope": "金钱", "three_zero": false, "cost": "不额外花钱，只把已有储蓄中按家庭责任重算月数的部分放进高流动性账户（货基/存款）。", "plain": "单身时 3 个月够，上有老下有小、背着房贷时得 6–12 个月。责任变了，缓冲垫要跟着变厚——别在失业+生病+房贷三连击时，被迫在低点卖股票补窟窿。", "gain": "应急金是家庭财务的\"减震器\"。美国消费者金融保护局（CFPB）明确建议覆盖 3–6 个月必要支出；对收入不稳或单收入/自雇家庭进一步建议 6–12 个月。具体可操作：稳定双收入无娃→3 个月；有房贷有娃的单收入→6 个月；自雇/波动行业→6–12 个月。以月必要支出 1 万元计，6 个月即 6 万元放在货基，平时几乎不影响复利，危机时却能避免贱卖长期资产或陷入高息债。", "source": "美国消费者金融保护局 (无日期). An essential guide to building an emergency fund（建议 3–6 个月必要支出，收入不稳者更高）. <https://www.consumerfinance.gov/an-essential-guide-to-building-an-emergency-fund/>; 中国人民银行调查统计司 (2023). 2023年第二季度城镇储户问卷调查报告（居民储蓄意愿 58%、预防性储蓄高企）. <https://finance.people.com.cn/n1/2023/0629/c1004-40024314.html>", "note": "应急金与\"投资本金\"并不冲突，属现金管理而非收益工具；定级 A 基于监管机构明确指引，交叉参见条 5、11。"}, {"chapter": 9, "num": 8, "id": "9-8", "title": "单身无娃：高股比＋高储蓄率是黄金窗口", "grade": "A", "tags": {"钱": "少", "时间": "多", "毅力": "多", "收益": "中", "口径": "金钱", "影响": "自己"}, "impact": "自己", "cost_money": "少", "cost_time": "多", "cost_will": "多", "benefit": "中", "scope": "金钱", "three_zero": false, "cost": "把精力投主业提升收入，把储蓄率尽量拉高（目标 30%–50%），少做无谓消费。", "plain": "单身时你唯一的\"负担\"是自己，股比可以拉满、储蓄率可以最高。这十年攒下的本金，是未来所有安全感的底——结婚生子后这笔钱会被房贷、教育金、保险一点点分走。", "gain": "无家庭负担期是积累本金效率最高的十年。按\"100−年龄\"法则，25–35 岁对应 65%–75% 权益，且此时风险承受力最强。更关键的是储蓄率：若月薪 1.5 万、储蓄率 40%（月存 6000）、年化 7%，10 年可累积约 104 万元；同样储蓄率若等到 35 岁婚后才起步，同样 10 年仅约 104 万但已错过前十年更低支出、更高时间复利的窗口。单身期的高储蓄+高股比组合，等于用最低责任成本买下长期复利的船票。", "source": "美联储波士顿分行 (2007). The Theory of Life-Cycle Saving and Investing. <https://www.bostonfed.org/-/media/Documents/Workingpapers/PDF/ppdp0703.pdf>; Pomegra (无日期). The 100-Minus-Age Heuristic. <https://pomegra.io/learn/library/track-c-strategies/first-portfolio/chapter-03-asset-allocation-the-most-important-decision/the-100-minus-age-heuristic>", "note": "定级 A 基于生命周期理论与储蓄率对财富积累的主导作用（Brinson 等研究指资产配置解释约 80%–90% 长期回报差异）；高股比仍以能忍受波动为前提，交叉参见条 1。"}, {"chapter": 9, "num": 9, "id": "9-9", "title": "有娃家庭：教育金单独隔离开", "grade": "B", "tags": {"钱": "少", "时间": "少", "毅力": "些", "收益": "中", "口径": "金钱", "影响": "家庭／后代"}, "impact": "家庭／后代", "cost_money": "少", "cost_time": "少", "cost_will": "些", "benefit": "中", "scope": "金钱", "three_zero": false, "cost": "开立独立账户专存教育金，每月定投，不与日常消费或炒股账户混用。", "plain": "孩子的学费不能和你的炒股账户混在一起。单独账户、专款专用，到用钱那年别让它正逢熊市——教育支出是刚性时间表，等不起。", "gain": "子女教育金是\"到期日确定、金额不小\"的刚性负债。把它从主投资组合隔离，可避免三重挪用风险：被日常消费花掉、被投资波动侵蚀、或被临时急用抽走。实务上用\"目标日期\"思路——孩子 0 岁时股比可高（70%+），随年龄逼近上大学逐年降到低波动；若 18 年后需 50 万元，按年化 6% 倒推每月定投约 1300 元即可，远比临近到期一次性筹钱从容。央行 2023 年调查也显示\"教育\"连续位居居民未来三月增支首位（27.1%），印证其刚性优先级。", "source": "中国人民银行调查统计司 (2023). 2023年第二季度城镇储户问卷调查报告（教育为增支首位 27.1%）. <https://finance.people.com.cn/n1/2023/0629/c1004-40024314.html>; 美国消费者金融保护局 (无日期). An essential guide to building an emergency fund（专款专用与现金流匹配原则）. <https://www.consumerfinance.gov/an-essential-guide-to-building-an-emergency-fund/>", "note": "定级 B，因教育金规划属目标导向财务规划、缺乏单一硬核实证；隔离账户建议选低费率指数+债基组合并按到期日降波动，交叉参见条 2、6。"}, {"chapter": 9, "num": 10, "id": "9-10", "title": "双收入家庭：容错更高但别一起裸奔", "grade": "B", "tags": {"钱": "少", "时间": "少", "毅力": "些", "收益": "中", "口径": "金钱", "影响": "家庭"}, "impact": "家庭", "cost_money": "少", "cost_time": "少", "cost_will": "些", "benefit": "中", "scope": "金钱", "three_zero": false, "cost": "两人都配基础保障，应急金可略低于单收入家庭（约 3–4 个月）。", "plain": "两份工资是好事，但别因此放松保障。两份收入都靠股市、都没保险，一旦双失业（同行业周期）比单收入更脆——至少一人保底、保障别省。", "gain": "双收入降低单点失业冲击，CFPB 框架下单收入家庭建议 6 个月应急金、双收入稳定家庭可降至 3–4 个月，等于释放出一笔可投长期的资金。但结构性脆弱在于\"相关性\"：若两人均在同一行业或均高配权益、且无保险，行业下行时会同时失去收入与资产。因此双收入家庭的正确姿势是——一人偏稳（保障+低波动打底）、两人基础保障齐全、避免\"双高风险的脆弱结构\"，把容错优势真正转化为长期复利而非消费升级。", "source": "美国消费者金融保护局 (无日期). An essential guide to building an emergency fund（双收入家庭应急金可低于单收入）. <https://www.consumerfinance.gov/an-essential-guide-to-building-an-emergency-fund/>; 中国人民银行调查统计司 (2023). 2023年第二季度城镇储户问卷调查报告. <https://finance.people.com.cn/n1/2023/0629/c1004-40024314.html>", "note": "定级 B，因属家庭财务韧性常识而非严格实证；核心教训是\"降低收入与资产的相关性\"，交叉参见条 5、7。"}, {"chapter": 9, "num": 11, "id": "9-11", "title": "自雇／创业者的现金流波动需更厚应急金", "grade": "A", "tags": {"钱": "0", "时间": "少", "毅力": "些", "收益": "中", "口径": "金钱", "影响": "自己／家庭"}, "impact": "自己／家庭", "cost_money": "0", "cost_time": "少", "cost_will": "些", "benefit": "中", "scope": "金钱", "three_zero": false, "cost": "把经营账户与个人账户分清，应急金提到 6–12 个月，并优先保留低波动资产。", "plain": "工资族月月有进账，创业者可能三个月没收入。你的应急垫要比上班族厚一倍才稳，否则经营一紧张就被迫在低点卖投资补现金流。", "gain": "自雇/创业者收入不规律且常与宏观周期正相关（生意差时市场也差），这正是生命周期模型警告的\"人力资本与权益同向下行\"情形——此时不仅不能高股比，还要更厚现金。CFPB 对不稳定收入者明确建议 6–12 个月应急金，近退休者甚至建议 12 个月。以月必要支出 2 万元、取 9 个月计，需 18 万元活期/货基缓冲，虽牺牲部分收益，却换来\"不在经营低谷贱卖长期资产\"的选择权，等价于一份隐形保险。", "source": "美国消费者金融保护局 (无日期). An essential guide to building an emergency fund（不规则收入者建议 6–12 个月）. <https://www.consumerfinance.gov/an-essential-guide-to-building-an-emergency-fund/>; 美联储波士顿分行 (2007). The Theory of Life-Cycle Saving and Investing（人力资本与权益相关时股比应更低）. <https://www.bostonfed.org/-/media/Documents/Workingpapers/PDF/ppdp0703.pdf>", "note": "定级 A 基于监管指引与生命周期理论双重支撑；经营账户隔离还能降低税务与法律风险，交叉参见条 7、12。"}, {"chapter": 9, "num": 12, "id": "9-12", "title": "再婚／重组家庭：资产隔离要更前置", "grade": "A", "tags": {"钱": "少", "时间": "少", "毅力": "些", "收益": "中", "口径": "金钱", "影响": "家庭"}, "impact": "家庭", "cost_money": "少", "cost_time": "少", "cost_will": "些", "benefit": "中", "scope": "金钱", "three_zero": false, "cost": "婚前/再婚前做财产约定（书面）、梳理各自账户与既有子女继承安排，必要时设信托或单独账户。", "plain": "重组家庭的财产边界比初婚更该厘清。提前约定、留痕，是保护双方也是保护孩子——别等离婚或一方身故，才发现财产混同、继承纠纷击穿投资本金。", "gain": "《民法典》婚姻家庭编给出清晰边界：第一千零六十三条明确\"一方的婚前财产\"为个人财产、不因婚姻延续转化为共同财产；第一千零六十五条允许书面约定婚前/婚内财产归各自所有、共同所有或部分各自所有，且对双方有法律约束力。据此，再婚前用书面协议+独立账户把婚前资产、对前段婚姻子女的赠与/传承隔离，可避免混同后离婚分割或继承纠纷稀释投资本金。对高资产家庭，进一步可用保险金信托、家族信托实现定向传承，降低\"重组—纠纷—变现\"的尾部风险。", "source": "全国人民代表大会/最高检发布 (2020). 中华人民共和国民法典（第五编 婚姻家庭：第一千零六十三条、第一千零六十五条）. <https://www.spp.gov.cn/spp/ssmfdyflvdtpgz/202008/t20200831_478417.shtml>; 新疆维吾尔自治区司法厅 (2022). 民法典夫妻财产规定法条梳理与解读（个人财产与约定财产制）. <https://sft.xinjiang.gov.cn/xjsft/fzsj/202209/9abcedfd9fab4b1cb36820233a7e6ebe.shtml>", "note": "定级 A 基于成文法条；口头约定难举证，务必采用书面形式并保留证据，交叉参见条 5（保障顺序）。"}, {"chapter": 9, "num": 13, "id": "9-13", "title": "长寿风险：退休可能长达 30 年", "grade": "A", "tags": {"钱": "少", "时间": "少", "毅力": "些", "收益": "中", "口径": "金钱", "影响": "自己／后代"}, "impact": "自己／后代", "cost_money": "少", "cost_time": "少", "cost_will": "些", "benefit": "中", "scope": "金钱", "three_zero": false, "cost": "按\"退休后活 25–30 年\"而非 10 年做规划，适度延后退休、提高养老储备。", "plain": "60 岁退休、活到 90 岁很常见。别按\"退休十年就够\"算钱，那会让你 75 岁就坐吃山空，最后把压力甩给子女。", "gain": "长寿是礼物也是财务炸弹。国家统计局数据显示，2023 年我国居民人均预期寿命已达 78.6 岁，一线城市更高，60 岁退休后活 25–30 年属常态。Bengen 的 4% 法则正是基于约 30 年退休期、要求备足 25 倍年支出；若只按 10 年规划，会在第 11 年起面临\"钱比人先花光\"。对抗之道：一是社保+企业/个人养老金打底（社科院测算我国家庭私人养老金占比仅约 0.3%，远低于发达国家 20%+，是最大短板）；二是退休组合保留一定权益以抗通胀；三可考虑延退数年，既多攒又少领。", "source": "国家统计局 (2024). 新中国75年经济社会发展成就系列报告之十（2023年居民人均预期寿命 78.6 岁）. <https://www.stats.gov.cn/zt_18555/ztfx/xzg75njjshfzcj/202409/t20240913_1956439.html>; Bengen, W. (1994). Determining Withdrawal Rates Using Historical Data, Journal of Financial Planning. <https://www.bengenfs.com/the-4-percent-rule/>; 中国社会科学院国家资产负债表研究中心 (2023). 居民金融资产构成测算（私人养老金占比偏低）. <https://m.gelonghui.com/p/2017669>", "note": "定级 A 基于官方统计与经典退休研究；中国医疗自付比例高，实际长寿支出可能高于 4% 法则假设，应叠加商业医疗/长护险，交叉参见条 4。"}, {"chapter": 11, "num": 1, "id": "11-1", "title": "股票交易印花税：单边万分之五（2023 减半）", "grade": "A", "tags": {"钱": "少", "时间": "0", "毅力": "否", "收益": "中", "口径": "金钱", "影响": "自己"}, "impact": "自己", "cost_money": "少", "cost_time": "0", "cost_will": "否", "benefit": "中", "scope": "金钱", "three_zero": false, "cost": "卖出时按成交金额的 0.05% 缴纳证券交易印花税。依据财政部、税务总局公告 2023 年第 39 号，自 2023 年 8 月 28 日起由原先的 0.1% 减半至 0.05%；再往前，自 2008 年 9 月 19 日起由双边征收改为单边向卖方（出让方）征收，买入端不收。其法律框架是《中华人民共和国印花税法》（2021 年 6 月 10 日通过，2022 年 7 月 1 日施行）第三条\"证券交易印花税对证券交易的出让方征收，不对受让方征收\"，附件税目税率表明确证券交易税率为成交金额的千分之一（0.1%），减半后实际执行 0.05%。", "plain": "买卖股票唯一绕不开的税。2023 减半后，每卖出 1 万元股票交 5 元。它只咬卖出端——你每卖一次就先输 0.05%，和买了多少、买价高低无关。", "gain": "这是一笔\"确定性损耗\"，不会因为你的选股水平而消失。以 10 万元本金、全年月均全仓换股一次（年卖出约 12 次）为例，仅印花税每年就约 10 万 × 0.05% × 12 = 600 元，相当于本金的 0.6%。若交易更频繁、年换手率达到 1000%（全年买卖成交额约为持仓市值的 10 倍，卖出额约为 5 倍市值），单边印花税一项即吞噬约 0.05% × 5 = 0.25% 的本金；叠加佣金与过户费，全年摩擦成本可达 1%–2%。在 30 年复利视角下，每年稳定流失 1% 的费用，终值会比\"零摩擦\"情景少约四分之一（(1.01)^30 ≈ 1.35，相当于白白蒸发约 26% 的潜在收益）。少做无意义的小额买卖，就是最直接的增厚。", "source": "财政部 税务总局公告 2023 年第 39 号《关于减半征收证券交易印花税的公告》. <https://szs.mof.gov.cn/zhengcefabu/202308/t20230827_3904226.htm>; 中华人民共和国印花税法（2021）第三条、附件税目税率表. <https://www.szse.cn/www/lawrules/rules/law/P020220927404715268709.pdf>", "note": "证据等级 A（法规条文，可直接执行）。定级理由：税率与征收方式均来自现行法律与部委公告。局限性：印花税为宏观调控工具，历史上多次调整（2008 年改单边、2023 年减半），未来仍可能变动。交叉引用：与第 3、4 条共同构成\"交易摩擦\"三件套；上交所《上海证券市场统计年鉴》显示散户因频繁交易整体跑输，部分原因即此类刚性摩擦（详见本书其他章节）。"}, {"chapter": 11, "num": 2, "id": "11-2", "title": "股息红利税：持股超 1 年免税", "grade": "A", "tags": {"钱": "0", "时间": "0", "毅力": "些", "收益": "中", "口径": "金钱", "影响": "自己"}, "impact": "自己", "cost_money": "0", "cost_time": "0", "cost_will": "些", "benefit": "中", "scope": "金钱", "three_zero": false, "cost": "想拿\"免税分红\"，必须拿住超过 1 年。依据财税〔2015〕101 号，个人从公开发行市场取得上市公司股票，持股期限超过 1 年的，股息红利所得暂免个税；持股 1 个月以内（含）全额计税；1 个月以上至 1 年（含）的，暂减按 50% 计入应纳税所得额；上述所得统一适用 20% 税率。折算实际税负即：≤1 月 20%、1 月–1 年 10%、>1 年 0%。", "plain": "国家用税鼓励你长期拿。同一笔分红，拿 20 天交 20% 税、拿 400 天交 0。红利／高股息策略者这条必须卡死——别让到手的红利被税吃掉一大块。", "gain": "对红利策略者是\"白给\"的利差。假设一只股票每股年分红 0.5 元、你持有 1 万股（成本 10 万元），年分红 5000 元：若持股不足 1 月卖出，缴税 1000 元（20%）；若持股 1–12 月卖出，缴税 500 元（10%）；若持股满 1 年后再卖，缴税 0 元。长期持有高股息组合，仅税率一项每年就能把税后股息率从 4.0% 提升到 5.0%（以 5% 税前股息率计），相当于在不动股价的前提下多拿 25% 的现金回报。注意持股期按\"先进先出\"计算，股权登记日、转让交割日前一日是关键节点，持有期内卖出即按已持有天数计税。", "source": "财政部 国家税务总局 证监会 财税〔2015〕101 号《关于上市公司股息红利差别化个人所得税政策有关问题的通知》. <https://www.chinatax.gov.cn/chinatax/n810341/n810765/n1465977/201510/c1967339/content.html>; 国家税务总局 12366《个人取得上市公司股息红利如何征收个人所得税》. <https://12366.chinatax.gov.cn/sscx/detail?code=0000000002013050300023>", "note": "证据等级 A。定级理由：直接引用财政部、税务总局、证监会联合发文。局限性：该优惠仅适用于\"A 股上市公司股票\"的股息红利，持股期按自然日、以证券账户为单位\"先进先出\"计算；全国中小企业股份转让系统（新三板）挂牌公司参照执行。交叉引用：与第 12 条基金分红的免税规则互为补充。"}, {"chapter": 11, "num": 3, "id": "11-3", "title": "券商佣金与\"免五\"陷阱", "grade": "B", "tags": {"钱": "少", "时间": "少", "毅力": "些", "收益": "中", "口径": "金钱", "影响": "自己"}, "impact": "自己", "cost_money": "少", "cost_time": "少", "cost_will": "些", "benefit": "中", "scope": "金钱", "three_zero": false, "cost": "佣金由券商与客户约定，监管口径下行业普遍按成交金额计收、且通行\"每笔最低 5 元\"（单笔佣金不足 5 元按 5 元收取）；此外还有过户费。想要\"免五\"（取消最低 5 元限制），通常需要主动找券商谈、或选择互联网券商／特殊渠道，且\"免五\"并非所有券商都给。", "plain": "很多券商默认每笔最低 5 元，你买 1000 元股票也要交 5 元，相当于 0.5% 的隐性成本；谈下\"免五\"后按万分之几实算。小额定投、网格交易党尤其该盯着这条——你越分散买，最低 5 元越吃亏。", "gain": "小额分批买入时，\"免五\"省下的就是净赚。举例：每月定投 3000 元、分 3 笔各 1000 元买入，按\"最低 5 元\"则需交 15 元佣金（占本金 0.5%），一年 18 笔共 270 元；若谈下万 1.5 免五，一年佣金仅 3000 × 12 × 0.015% = 5.4 元。差距约 50 倍。再叠加过户费（沪深 A 股自 2022 年 4 月 29 日起由 0.02‰ 下调至 0.01‰ 双向，即十万分之一双向），小额成本结构会显著改善。对年交易几十笔的定投／量化式散户，光\"免五\"一项每年就能省下数百到上千元，且这部分节省直接计入收益、不涉税。", "source": "中国经济网 (2022). 《激发股市活力 过户费今起减半》（披露券商交易佣金最高为成交金额 3‰、单笔佣金不满 5 元按 5 元收取）. <http://m.ce.cn/cj/202204/29/t20220429_37542199.shtml>; 人民网 (2022). 《中国结算：股票交易过户费总体下调 50%》（A 股过户费统一为 0.01‰ 双向）. <https://finance.people.com.cn/BIG5/n1/2022/0428/c1004-32411381.html>", "note": "证据等级 B。定级理由：佣金具体费率属券商与客户约定、行业惯例，官方设上限与\"最低 5 元\"的经纪业务惯例；\"免五\"是否可谈取决于券商政策。局限性：不同券商、不同客户资产量差异大，勿把\"免五\"当作普适规则。交叉引用：与第 1、4 条同为交易摩擦成本。"}, {"chapter": 11, "num": 4, "id": "11-4", "title": "交易摩擦合计：印花税+佣金+过户费", "grade": "B", "tags": {"钱": "少", "时间": "0", "毅力": "否", "收益": "中", "口径": "金钱", "影响": "自己"}, "impact": "自己", "cost_money": "少", "cost_time": "0", "cost_will": "否", "benefit": "中", "scope": "金钱", "three_zero": false, "cost": "一次完整买卖的刚性摩擦 = 单边印花税 0.05%（仅卖出端）+ 双向佣金（普遍万 0.854 起，可谈至万 1–万 1.5，且含\"最低 5 元\"）+ 双向过户费（A 股 0.01‰ 即十万分之一，沪深双向）。三者相加，单次往返成本约 0.1%–0.2%。", "plain": "每次买卖表面\"没花钱\"，其实先被摩擦咬一口。换手越猛，这一口越深——这是频繁交易确定性亏损的硬成本来源，和选股对错无关。", "gain": "看清摩擦量级就能管住手。以年换手率 1000%（全年成交额约为平均持仓市值的 10 倍，其中卖出额约为 5 倍市值）估算：印花税 0.05% × 5 = 0.25%、佣金双向约 0.015% × 10 = 0.15%、过户费 0.001% × 10 = 0.01%，合计约 0.4%/年；若换手放大到 2000%，摩擦可达 0.8% 上下，高频（>3000%）时超过 1%。这些成本是\"先扣后赚\"——你必须在选股上先跑赢摩擦才谈得上净收益。与第 1、3 条合计，把年换手压到 200% 以内的保守投资者，仅摩擦一项每年就能比高频者多保留 0.5–1 个百分点的本金，长期复利可观（30 年维度对应终值差异可达两成以上）。", "source": "财政部 税务总局公告 2023 年第 39 号《关于减半征收证券交易印花税的公告》. <https://szs.mof.gov.cn/zhengcefabu/202308/t20230827_3904226.htm>; 人民网 (2022). 《中国结算：股票交易过户费总体下调 50%》. <https://finance.people.com.cn/BIG5/n1/2022/0428/c1004-32411381.html>; 中国经济网 (2022). 《激发股市活力 过户费今起减半》. <http://m.ce.cn/cj/202204/29/t20220429_37542199.shtml>", "note": "证据等级 B。定级理由：印花税、过户费为公开标准；佣金因客户而异，按行业常见区间估算。局限性：实际成本随佣金谈价、交易频率、单笔金额浮动，此处为量级参考而非精算值。交叉引用：与第 1、3 条共同量化\"交易越频亏越多\"。"}, {"chapter": 11, "num": 5, "id": "11-5", "title": "打新规则：市值门槛 + 信用申购", "grade": "A", "tags": {"钱": "少", "时间": "少", "毅力": "些", "收益": "中", "口径": "金钱", "影响": "自己"}, "impact": "自己", "cost_money": "少", "cost_time": "少", "cost_will": "些", "benefit": "中", "scope": "金钱", "three_zero": false, "cost": "A 股新股申购实行\"市值申购、信用申购\"——不需要预先缴款，但需持有对应市场非限售股市值（沪、深分开计算）以获得额度：沪市按 T-2 日前 20 个交易日日均持有市值计算，每 1 万元市值可申购 1000 股（一个申购单位），不足 1 万元部分不计入（上证发〔2025〕43 号）。中签后 T+2 日缴款即可。注意：申购科创板、创业板新股还需先开通相应板块交易权限（科创板 50 万 + 2 年、创业板 10 万 + 2 年），北交所打新同理需北交所权限。", "plain": "不用额外掏钱买\"打新资格\"，账户里有股票市值就有额度。但别为凑市值去重仓高风险股——本末倒置。中签即赚价差，本质是\"免费彩票\"。", "gain": "在持股市值基础上顺手参与，中签即赚发行价与上市价之间的价差。2024 年 A 股上市的 100 只新股中仅 1 只首日破发、2025 年上半年 45 只新股首日全部上涨（破发率约 0%），\"中一签\"收益常常数千至数万元（例如 2024 年长联科技单签浮盈近 18 万元）。但注册制下已无\"必赚\"：科创板、创业板新股上市前 5 个交易日不设涨跌幅限制、主板新股前 5 日亦放开（其后主板 ±10%、双创 ±20%、北交所 ±30%），上市首日波动极大，破发与暴涨并存。务必\"挑着打\"——回避高发行市盈率（\"三高\"）标的，而非无脑申购；同时牢记市值门槛是\"持票换额度\"，为打新而重仓垃圾股等于把低风险彩票变成高风险押注。", "source": "上海证券交易所 中国证券登记结算有限责任公司《上海市场首次公开发行股票网上发行实施细则(2025 年 3 月修订)》（上证发〔2025〕43 号，第三条、第四条）. <https://neris.csrc.gov.cn/falvfagui/rdqsHeader/mainbody?navbarId=1&secFutrsLawId=2c69d1c9563f499fb51deb51259445a4>; 上海证券交易所《股票投资一件事·新股申购》（参与条件、T+2 缴款）. <https://one.sse.com.cn/onething/gptz>; 深圳证券交易所《创业板投资者适当性管理实施办法(2020 年修订)》（10 万 + 2 年）. <https://investor.szse.cn/knowledge/t20200522_577479.html>", "note": "证据等级 A。定级理由：市值门槛、T+2 缴款、板块权限均有交易所规则支撑。局限性：打新收益随发行节奏与定价环境大幅波动，2022 年破发率曾达 28%；\"免费彩票\"不等于无风险。交叉引用：与第 6 条破发率、第 7 条退市风险、第 10 条可转债打新形成\"打新家族\"。"}, {"chapter": 11, "num": 6, "id": "11-6", "title": "打新破发率变化：从\"必赚\"到\"挑着打\"", "grade": "B", "tags": {"钱": "少", "时间": "少", "毅力": "些", "收益": "中", "口径": "金钱", "影响": "自己"}, "impact": "自己", "cost_money": "少", "cost_time": "少", "cost_will": "些", "benefit": "中", "scope": "金钱", "three_zero": false, "cost": "研究发行估值、挑着打的时间成本——重点看发行市盈率／估值是否偏高（\"三高\"发行）、行业景气与流通盘大小，避开明显贵的新股。", "plain": "注册制后\"新股不败\"被打破。现在要看发行估值，贵的不打、便宜的打。当成稳定收入已不成立，当成\"免费彩票\"可以。", "gain": "用数据看清周期：据证券时报统计，A 股新股首日破发率 2021 年约 4.2%、2022 年达 28.27%（高发年）、2023 年 16.61%、2024 年降至约 3%（全年 100 只仅 1 只破发）、2025 年上半年 45 只零破发。背后是发行市盈率回落（2022 年可比均值约 49.9 倍 → 2025 年约 22 倍）与 IPO 节奏收紧。对散户的启示：破发率随定价冷热起伏，不能刻舟求剑；但\"无脑打新\"在 2022 年曾让不少人单签亏数千元。实操上，可优先参与低估值、小流通盘、主板／北交所标的，回避发行市盈率远高于行业均值的\"三高\"新股；中签后若首日涨幅过大亦可考虑落袋，而非死扛——把打新当作概率游戏而非刚兑理财。", "source": "证券时报 (2024). 《巨变！新股涨幅翻倍，闭眼打新回来了？》（2022 破发率 28.27%、2023 为 16.61%、2024 约 3%）. <https://www.stcn.com/article/detail/1167700.html>; 新浪财经 (2025). 《新股 0 破发，再回无脑打新时代》（2025 上半年 45 只零破发，2022 破发率 >28%）. <https://finance.sina.cn/cj/2025-06-09/detail-ineznnvk9863243.d.html>", "note": "证据等级 B。定级理由：破发率为媒体依据 Wind／交易所数据的统计，非监管条文，且随样本区间变化。局限性：统计口径（是否含北交所、科创板）不同会导致数字差异；此处为主板 + 双创口径的近似值。交叉引用：与第 5 条打新规则、第 7 条注册制退市共同说明\"新股 ≠ 稳赚\"。"}, {"chapter": 11, "num": 7, "id": "11-7", "title": "退市与 ST：本金永久损失风险", "grade": "A", "tags": {"钱": "0", "时间": "少", "毅力": "些", "收益": "中", "口径": "金钱", "影响": "自己／家庭"}, "impact": "自己／家庭", "cost_money": "0", "cost_time": "少", "cost_will": "些", "benefit": "中", "scope": "金钱", "three_zero": false, "cost": "几分钟判断\"是否踩雷\"的成本——盯住四类强制退市红线（交易类、财务类、规范类、重大违法类）与风险警示（ST/*ST）标识。交易类：连续 20 个交易日收盘价低于 1 元（面值退），或连续 20 个交易日收盘总市值低于 5 亿元（沪市），或成交量、股东人数不达标（上交所 9.2.1 条）。财务类（2024 年修订、2025 年 1 月 1 日起施行）：最近一个会计年度\"净利润（扣非前后孰低）为负且营业收入低于 3 亿元（主板）／1 亿元（科创板、创业板）\"、净资产为负、或审计出具无法表示／否定意见。ST 为其他风险警示（涨跌幅 5%），*ST 为退市风险警示。", "plain": "A 股退市常态化后，炒 ST、赌重组是刀口舔血。便宜 ≠ 便宜货——连续亏损、净资产为负、被出具非标审计意见的，先躲开。一旦触发交易类退市，不进退市整理期、直接摘牌。", "gain": "避开退市股就是避免本金永久性损失。典型如 2024 年 *ST 同达因 2022 年净利润为负且营收低于 1 亿元被 *ST、2023 年报被出具无法表示意见，上交所据此终止其上市；2025 年 *ST 元成连续多日收盘价低于 1 元且总市值低于 5 亿元，触及交易类强制退市。退市股常见跌去 70%–90% 甚至归零，且流动性骤竭、重组渺茫。对散户最实用的纪律：①不碰已披星戴帽且基本面未反转的票；②股价逼近 1 元、市值逼近 5 亿警戒线的立即警惕；③财报被出具非标意见的当季规避。把\"不踩雷\"当作比\"抓牛股\"更重要的胜负手。", "source": "中国证监会宁夏监管局 (2025). 《交易类强制退市有哪些（上交所篇）》（9.2.1 条 面值 1 元／市值 5 亿等）. <https://www.csrc.gov.cn/ningxia/c104435/c7544159/content.shtml>; 上海证券交易所《关于终止上海同达创业投资股份有限公司股票上市的公告》（财务类退市实例）. <https://www.sse.com.cn/disclosure/announcement/listing/c/c_20240528_10758046.shtml>; 上海证券交易所《关于撤销规范类退市风险警示暨继续被实施财务类退市风险警示及其他风险警示的公告》（*ST 信通，营收低于 3 亿／审计非标）. <https://www.sse.com.cn/disclosure/listedinfo/announcement/c/new/2025-03-22/600289_20250322_SN4M.pdf>", "note": "证据等级 A。定级理由：退市指标来自沪深《股票上市规则》及监管问答，案例为交易所正式公告。局限性：主板与双创的财务类营收门槛不同（3 亿 vs 1 亿），且规则会随\"国九条\"修订动态调整（2024 年修订、2025 年起施行）。交叉引用：与第 5、6 条共同提示注册制下的\"出清\"风险；ST/*ST 涨跌幅仅 5% 亦属交易制度一环。"}, {"chapter": 11, "num": 8, "id": "11-8", "title": "融资融券（两融）：杠杆的合法外衣", "grade": "A", "tags": {"钱": "少", "时间": "少", "毅力": "些", "收益": "中", "口径": "金钱", "影响": "自己／家庭"}, "impact": "自己／家庭", "cost_money": "少", "cost_time": "少", "cost_will": "些", "benefit": "中", "scope": "金钱", "three_zero": false, "cost": "向券商借钱炒股需付利息（年化约 5%–8%，随信用等级与担保品浮动）+ 维持担保比例约束。规则上，维持担保比例 =（现金 + 信用账户证券市值）／（融资负债 + 利息费用）；证监会 2024 年答记者问披露全市场平均维持担保比例约 226%，最低平仓线通常约定 130%，预警线约 150%，追保期一般 1–2 个交易日，低于约定比例且未补足即被强制平仓。2019 年起已取消\"平仓线不得低于 130%\"的统一限制，改由券商与客户自主约定。", "plain": "两融就是\"向券商借钱／借券炒股\"。牛市它让你更爽，熊市它让你在地板价被强制卖出——而且跌到平仓线时你可能连补仓的机会都没有。普通人默认不用。", "gain": "杠杆理论上放大收益，但下跌时亏损同步放大，且 A 股多板块涨跌幅达 20%（双创）、30%（北交所），单日巨震极易击穿担保比例。更致命的是\"被动出局\"：当账户在最低点被强平，你不仅承担实际亏损，还丧失了后续反弹回本的可能，等于把\"暂时性浮亏\"变成\"永久性出局\"。统计上，融资余额在急跌中会因强平与主动减仓而快速下降，但被平掉的账户往往亏损惨重。对 99% 的散户，两融的期望值并不优于自有资金——它把\"慢慢亏\"变成\"瞬间没\"。除非你有成熟的仓位管理与极端行情应对经验，否则远离杠杆。", "source": "中国证监会 (2024). 《证监会新闻发言人就\"两融\"融资业务有关情况答记者问》（平均维持担保比例 226%、平仓线通常 130%）. <https://www.csrc.gov.cn/csrc/c100028/c7461992/content.shtml>; 中国证监会 (2019). 《证监会指导交易所完善融资融券交易机制》（取消平仓线不得低于 130% 统一限制）. <https://www.csrc.gov.cn/csrc/c100028/c1001080/content.shtml>; 长江证券《融资融券常见问题》（提取线 300%、警戒线 140%、平仓线 130%、追保期限）. <https://www.cjsc.com.cn/main/a/20251021/36476.shtml>", "note": "证据等级 A。定级理由：两融规则与监管口径来自证监会公开答记者问及券商业务规则。局限性：平仓线、利率为券商与客户约定值，个体差异大；追保缓冲期随券商政策不同。交叉引用：与第 7 条退市、第 4 条摩擦共同构成\"不要让自己被动出局\"的主题。"}, {"chapter": 11, "num": 9, "id": "11-9", "title": "沪深港通（北向／南向）：跨市场配置通道", "grade": "A", "tags": {"钱": "少", "时间": "少", "毅力": "些", "收益": "中", "口径": "金钱", "影响": "自己"}, "impact": "自己", "cost_money": "少", "cost_time": "少", "cost_will": "些", "benefit": "中", "scope": "金钱", "three_zero": false, "cost": "参与港股通需满足个人证券及资金账户资产合计不低于 50 万元（不含两融融入部分），并通过券商适当性评估、签署风险揭示书（沪深港通业务办法）。此外承担汇率换算成本与\"T+0 回转、T+2 交收\"带来的时段／结算差异。", "plain": "想配点腾讯、美团不用开香港户，港股通就行。但港股波动更大、没有涨跌停（个股单日可腰斩或翻倍），且实行 T+0 回转交易，别拿 A 股\"涨停板保护\"的经验去套。", "gain": "不换汇也能买港股通标的，分散单一市场、配置互联网龙头。但港股有 A 股没有的三类风险：①无涨跌幅限制，单日波动远超 A 股；②\"老千股\"风险——部分小市值港股频繁大比例折价供股／配股、分拆合股，持股数与面值可能剧变；③香港没有退市风险警示与退市整理安排，股票可能直接退市，中国结算的名义持有人服务也可能受限。2025 年南向资金全年净流入约 1.4 万亿港元、创纪录，说明港股通已成主流通道，但\"通道便利\"不等于\"标的低风险\"。建议只用闲钱、控制仓位、避开低股价高合股记录的小票。", "source": "中国证监会《沪港通问答之六：港股通股票与投资者》（个人资产 ≥50 万元、T+0 回转／T+2 交收、无涨跌幅）. <https://www.csrc.gov.cn/csrc/c100210/c1498886/content.shtml>; 深圳证券交易所《深港通业务实施办法(2024 年修订)》（第一百零五条 个人资产 ≥50 万元）. <https://neris.csrc.gov.cn/falvfagui/rdqsHeader/mainbody?navbarId=1&secFutrsLawId=f93393f6d550460d8d09aa7467c09166>; 中国证监会山西局《投资者参与港股通交易基础知识》（无涨跌幅、老千股、直接退市风险）. <https://www.csrc.gov.cn/shanxi/c1055540/c1609328/content.shtml>", "note": "证据等级 A。定级理由：准入门槛与交易机制来自证监会、交易所公开规则。局限性：50 万元为个人投资者门槛，机构不受此限；港股通标的范围动态调整，\"老千股\"与直接退市是港股特有风险。交叉引用：与第 7 条\"直接退市\"、第 8 条杠杆波动共同提示\"规则差异即风险\"。"}, {"chapter": 11, "num": 10, "id": "11-10", "title": "可转债打新：近乎免费的\"彩票\"但有破发", "grade": "B", "tags": {"钱": "少", "时间": "少", "毅力": "些", "收益": "中", "口径": "金钱", "影响": "自己"}, "impact": "自己", "cost_money": "少", "cost_time": "少", "cost_will": "些", "benefit": "中", "scope": "金钱", "three_zero": false, "cost": "可转债打新\"信用申购、零市值门槛、中签后缴款\"——空账户也能参与，T 日申购无需预缴款，T+2 日 16:00 前在账户留足资金（每签 1000 元）即可；但连续 12 个月内累计 3 次中签未足额缴款，将被限制 6 个月内参与新股、新债等网上申购（沪深合并计算）。注意：2022 年 6 月 18 日后新开通可转债权限的投资者，还需满足 24 个月交易经验 + 前 20 日日均资产不低于 10 万元 + 风险等级 C3 及以上。", "plain": "可转债打新几乎零门槛、中签再付钱，是少有的\"先中奖后付钱\"。但上市首日别贪、落袋为安；高位转债别当股票炒，警惕强赎。", "gain": "历史破发率低、上市多上涨，但绝非零风险。交易规则上，可转债 T+0、上市首日涨跌幅限制为 +57.3%/−43.3%（即最高 157.3 元、最低 56.7 元），次日起 ±20%；第三方统计显示近 3 年约 97% 新债首日上涨、61% 次日不如首日，故\"首日卖\"是常见策略。风险点：①破发（多集中于低评级、冷门行业，单签亏通常 <50 元）；②强赎——正股连续 30 日中至少 15 日高于转股价 130% 时触发，赎回价仅约 103 元，远低于市价，不及时卖／转股将大幅折价；③违约（正股退市或发行人现金流枯竭）。对散户，可转债打新是性价比极高的\"免费彩票\"，但要把\"挑着打 + 首日卖 + 防强赎\"当成纪律。", "source": "中国投资者网《可转换债券》投教（信用申购、T+2 缴款、弃购惩罚）. <https://www.investor.org.cn/xxzx/tjzl/tjnrgmjytx/bk/kj/jyxl_3803/202311/P020231123553040874862.pdf>; 新浪财经《可转债打新日历》（首日 +57.3%/−43.3%、次日 ±20%、T+0、弃购 12 月 3 次限 6 月）. <https://sina.cn/news/detail/5346220555896770.html>; 叩富问财 可转债打新规则（2022-06-18 后新增投资者需 24 个月 +10 万资产 + 风险 C3）. <https://licai.cofool.com/ask/vipqa_7626253_43251589.html>", "note": "证据等级 B。定级理由：T+0、涨跌幅、弃购惩罚、强赎为交易所／协会公开规则，但\"破发率 97%\"为第三方统计、随市场变化。局限性：可转债价格受正股与利率影响，高位转债回撤可达 30%+；2022 年后新开户门槛已抬高。交叉引用：与第 5、6 条同属\"打新家族\"，且需第 7 条退市意识防违约。"}, {"chapter": 11, "num": 11, "id": "11-11", "title": "A 类／C 类基金：持有期决定选哪类", "grade": "A", "tags": {"钱": "少", "时间": "少", "毅力": "否", "收益": "中", "口径": "金钱", "影响": "自己"}, "impact": "自己", "cost_money": "少", "cost_time": "少", "cost_will": "否", "benefit": "中", "scope": "金钱", "three_zero": false, "cost": "A 类份额收取前端申购费、不收销售服务费；C 类份额免申购费、按日计提销售服务费（依 2025 年《公开募集证券投资基金销售费用管理规定》，主动偏股／混合型基金销售服务费不高于 0.4%/年，指数／债券型不高于 0.2%/年）。管理费和托管费两类份额相同。", "plain": "同一只基金的 A/C 份额，投资标的完全一样，区别只在\"怎么收钱\"。短期炒选 C（免申购费、按天扣服务费），长期拿选 A（一次申购费后不再扣服务费）。别拿反——拿反了每年白交 0.4% 左右。", "gain": "选错份额是隐形损耗。以 10 万元股票型基金、按 4 折优惠申购费约 0.6% 计：若持有 <1 年，C 类免申购费但有销售服务费（约 0.4%/年），A 类要一次性付 0.6% 申购费，此时 C 类划算；若持有 >1 年，依 2025 年新规 C 类持有超 1 年不再计提销售服务费、且 A 类申购费已被时间摊薄，两者费用趋同甚至 A 类更优；平衡点大致在 6 个月–2 年之间（随费率与优惠而变）。对计划持有 1–2 年以上的定投／长拿者，选 A 类可省下约 0.5%–1% 的费用；对短线波段者，选 C 类更灵活。下单前务必看清份额代码，别默认买 C。", "source": "中证网 (2020). 《投资先要知：基金投资知识（下）》（A/C 类收费区别）. <https://cs.com.cn/tzjj/tjdh/202010/t20201016_6101969.html>; 中国经济网 (2026). 《基金公司加快推进存量产品费率优化》（2025《公开募集证券投资基金销售费用管理规定》：C 类持有 >1 年免收销售服务费，上限 0.4%/年）. <http://m.ce.cn/cj/gd/202608/t20260822_3164169.shtml>", "note": "证据等级 A。定级理由：份额分类与收费规则由证监会《销售费用管理规定》及基金合同约定。局限性：2025 年新规下 C 类长期持有费用改善，\"平衡点\"较旧规上移，实操需按具体产品费率表计算。交叉引用：与第 12 条基金分红共同构成\"基金端省钱\"组合。"}, {"chapter": 11, "num": 12, "id": "11-12", "title": "基金分红：选\"红利再投资\"而非现金", "grade": "A", "tags": {"钱": "0", "时间": "0", "毅力": "否", "收益": "中", "口径": "金钱", "影响": "自己"}, "impact": "自己", "cost_money": "0", "cost_time": "0", "cost_will": "否", "benefit": "中", "scope": "金钱", "three_zero": true, "cost": "开户／申购时改一次分红方式（系统默认常是现金分红），在权益登记日前一工作日交易时间结束前到销售机构办理变更即可。", "plain": "现金分红等于\"基金帮你卖一点然后给你现金\"，你再买回去还要申购费。红利再投资直接转份额，免费、连续复利，且这部分再投资免收申购费。", "gain": "红利再投资免申购费直接增份额，长期复利不被打断。依据财税字〔2002〕128 号《关于开放式证券投资基金有关税收问题的通知》，投资者从基金利润分配中取得的收入暂免征收个人所得税和企业所得税——分红本身不涉税。现金分红则把份额变现，若再买入不仅重新计申购费、还打断复利。举例：一只年分红率 3% 的基金，若每年现金分红后你手动再投，要反复承担申购费且易因拖延漏投；选红利再投资则自动转份额、零费用滚动。但注意：①红利再投资份额的持有期自确认日重新计算，7 日内赎回仍收 1.5% 赎回费；②分红后净值会除息下降，总资产不变，不是\"额外赚钱\"。看好后市、无即时用钱需求者，默认改选红利再投资。", "source": "中国证监会宁夏监管局 (2025). 《基金分红规则纠纷案例评析》（红利再投资免申购费、分红暂免所得税）. <https://www.csrc.gov.cn/ningxia/c104435/c7640238/content.shtml>; 财政部 国家税务总局 财税字〔2002〕128 号《关于开放式证券投资基金有关税收问题的通知》（基金分配收益暂免所得税）. <https://epaper.stcn.com/att/202606/03/ZQ03B061-ZN_eBook.pdf>", "note": "证据等级 A。定级理由：红利再投资免申购费为基金合同／监管明确要求，免税依据为财税字〔2002〕128 号。局限性：免税仅限\"基金利润分配\"环节，申购赎回差价收益仍按相关规定计税；默认分红方式多为现金分红，需主动修改。交叉引用：与第 2 条股票股息免税、第 11 条基金费率共同体现\"税制与费用即收益\"。"}, {"chapter": 12, "num": 1, "id": "12-1", "title": "1% 年费率：30 年吃掉约 1/4 终值", "grade": "A", "tags": {"钱": "0", "时间": "0", "毅力": "些", "收益": "中", "口径": "金钱", "影响": "自己／家庭"}, "impact": "自己／家庭", "cost_money": "0", "cost_time": "0", "cost_will": "些", "benefit": "中", "scope": "金钱", "three_zero": false, "cost": "选费率 1% 而非 0.1% 产品的\"省事\"，以及不查基金合同里那张费用表的懒惰。", "plain": "你挑基金时纠结涨 1% 还是跌 1%，却对每年白扣的 1% 管理费视而不见。复利之下，这 1% 吞掉的是你四分之一的本金增长，而且是确定性最高的\"负回报\"。", "gain": "复利终值公式 FV=PV(1+r)^n。假设本金 10 万元、毛年化收益 7%、持有 30 年：0 费率下 FV=10万×(1.07)^30≈76.1 万元；若每年被收 1% 管理费，实际年化只剩 6%，FV=10万×(1.06)^30≈57.4 万元，比 0 费率少约 24.5%。即便只差 0.9 个点（1% 与 0.1% 费率相比），前者终值也仅为后者的约 77.6%，即少拿约 22.4%。再算 1.5% 与 0.15% 费率、20 年的差距：10万×[(1.07)^20−(1.055)^20]≈38.7万−29.2万=9.5 万元差额（本书估算，毛收益假设 7%）。美国 SEC 的同口径实例：10 万美元按 4% 增长 20 年，1% 年费只值约 17.9 万，0.25% 年费值约 20.8 万，差额近 2.9 万美元。72 法则告诉我们，7% 约 10.3 年翻倍，而 1% 费率把年化拖成 6%，翻倍拉长到约 12 年——这是从不回本的确定性损耗。", "source": "中国人民银行 (2021). 中国人民银行公告〔2021〕第3号（第四条：贷款年化利率可采用复利方法即内部收益率法计算，确立年化须含全部成本的原则）. <https://www.gov.cn/zhengce/zhengceku/2021-03/31/content_5597156.htm>；SEC (无年份). Investor Bulletin: How Fees and Expenses Affect Your Investment Portfolio（10万美元、4%、20年、0.25%/0.50%/1.00% 三档费用对照表）. <https://www.sec.gov/oiea/investor-alerts-bulletins/ib_fees_expenses.html>；Investopedia (无年份). Compound Interest（FV=PV(1+i)^n 与 Rule of 72）. <https://www.investopedia.com/terms/c/compoundinterest.asp>", "note": "1.5% vs 0.15% 的 20 年差额为本书按复利公式估算，非原始统计；实际基金的隐性成本还包括交易佣金、印花税与买卖价差，真实侵蚀往往大于费率表数字。定级 A：公式与 SEC 实例均为公开可复核数据，但毛收益 7% 为假设，结论对假设敏感。"}, {"chapter": 12, "num": 2, "id": "12-2", "title": "频繁交易：最高换手组比最低组年化低约 6.5 个百分点", "grade": "A", "tags": {"钱": "少", "时间": "少", "毅力": "些", "收益": "中", "口径": "金钱", "影响": "自己"}, "impact": "自己", "cost_money": "少", "cost_time": "少", "cost_will": "些", "benefit": "中", "scope": "金钱", "three_zero": false, "cost": "频繁买卖带来的\"我在操作\"的快感，以及为此付出的佣金、印花税与滑点。", "plain": "越折腾越穷，不是玩笑。把换手率降到最低的那群人，长期就是比折腾的人多赚 6.5 个点/年——这 6.5 个点，靠选股几乎不可能稳定补回来。", "gain": "Barber & Odean 用美国券商数万户账户数据发现，交易最频繁的 20% 家庭，年化净收益比交易最不频繁的 20% 家庭低约 6.5 个百分点。把 6.5 个点放到复利里看量级：10 万元本金若年化 10%（净 3.5% 那组），20 年后约 199 万元；若能达到 10% 净收益那组，20 年后约 673 万元——6.5 个点的差距在 20 年里放大成逾 470 万元的终值差（本书按 FV=PV(1+r)^n 估算）。 SEC 也明确警示短线交易在波动市中会造成\"显著且非预期的损失\"。用 72 法则也能体会量级：若高频组把年化从 10% 拖到 3.5%，本金翻倍时间就从 7.2 年拉长到 20.6 年——同样的钱，凭空晚十三年才翻一倍，而这段时间本可用来享受复利。", "source": "Barber, B. & Odean, T. (2000). Trading Is Hazardous to Your Wealth: The Common Stock Investment Performance of Individual Investors, Journal of Finance, 55(2), 773–806；SEC (2021). Investor Alert: Thinking About Investing in the Latest Hot Stock? Understand the Risks of Short-Term Trading Based on Social Media. <https://www.sec.gov/oiea/investor-alerts-and-bulletins/risks-short-term-trading-based-social-media-investor-alert>", "note": "6.5 个百分点为美国样本结论，A 股因印花税与高波动，频繁交易的实际损耗可能更大也可能不同；本书的终值差为公式推演，非原始论文数字。定级 A：结论来自同行评审期刊与监管警示，方法可复核。"}, {"chapter": 12, "num": 3, "id": "12-3", "title": "小散最惨：10 万元以下账户平均亏 20.53%", "grade": "A", "tags": {"钱": "0", "时间": "少", "毅力": "些", "收益": "中", "口径": "金钱", "影响": "自己"}, "impact": "自己", "cost_money": "0", "cost_time": "少", "cost_will": "些", "benefit": "中", "scope": "金钱", "three_zero": false, "cost": "承认\"小账户追涨杀跌\"这一行为模式，并放弃\"钱少就要多动\"的错觉。", "plain": "钱越少、动得越凶、亏得越多。这不是运气，是被账户级数据钉死的事实——小账户做动量交易，平均就是亏。", "gain": "上海交所以及清华五道口团队基于 2016 年 1 月至 2019 年 6 月、覆盖逾 5300 万个账户的专有数据研究发现：账户市值 10 万元以下的散户平均年化收益 −20.53%，10–50 万元组 −9.98%，而机构投资者平均 +11.22%、公司法人 +6.68%。拆到每个账户：10 万元以下散户年均亏 2457 元，其中选股亏 1532 元（占 62%）、择时亏 774 元（占 31%）、交易费用 151 元（占 6%）。换言之，越小的账户，越把本金喂给了佣金和错误的时机。若把年均 2457 元亏损按 20 年、7% 的机会成本折算，相当于耗掉约 10 万元本金本可产生的可观增值中的一大部分（本书按年金机会成本估算）——小账户不是\"输得少\"，而是把本金持续喂给摩擦与错误时机。", "source": "施东辉、张晓燕等 (2020). Passive or Active? The Roles of Retail Investors and Mutual Funds in the Chinese Stock Market（基于上海证券交易所 2016–2019 年账户级数据）；转引见 长沙晚报 (2020-07-28). 《中国散户交易行为特征：爱追涨杀跌、有赌博心态 买得越少亏得越多》. <https://www.icswb.com/h/168/20200728/668963.html>；中国证券投资基金业协会投资者教育材料（含上交所不同组别投资者年度损益表）. <https://investor.amac.org.cn/community/tzzhdzthd/ylj/202304/P020230410489976164138.pdf>", "note": "−20.53% 为 2016.1–2019.6 特定震荡市区间的均值，非任何单年数字，牛市区间会显著不同；账户分类与样本期决定了量级，不代表所有小账户必亏。定级 A：基于全市场账户级数据，非抽样问卷。"}, {"chapter": 12, "num": 4, "id": "12-4", "title": "月换手超 100%：年度亏损率约 91.3%", "grade": "A", "tags": {"钱": "少", "时间": "少", "毅力": "些", "收益": "中", "口径": "金钱", "影响": "自己"}, "impact": "自己", "cost_money": "少", "cost_time": "少", "cost_will": "些", "benefit": "中", "scope": "金钱", "three_zero": false, "cost": "把\"一个月把仓位翻一遍以上\"当成的操作习惯。", "plain": "一个月把持仓全换一遍的人，十个人里九个亏。换手率是最诚实的\"亏钱概率计\"。", "gain": "同一份上交所账户级数据显示，月换手率超过 100%（即一个月内买卖金额超过持仓总额）的账户，年度亏损率约 91.3%；与之相对，低频组的亏损概率低得多。用 72 法则反推也合理：若这类账户因高换手把年化净收益拖到 −15% 左右，约 4.8 年本金就腰斩（72÷15≈4.8），十年下来所剩无几——高频不是\"赚快钱\"，而是\"亏快钱\"的传送带。把 91.3% 的亏损概率翻译成钱：若这类账户平均本金 10 万元、年化净 −15%，5 年后只剩约 4.4 万元（10万×(0.85)^5，本书估算），而同期低换手账户大概率还在牌桌上；高频不是\"技术差\"，是\"在数学上必输\"。", "source": "施东辉、张晓燕等 (2020). 同上（上交所 2016–2019 年账户级交易与持仓数据）；中国证券投资基金业协会投资者教育材料（含分组损益表）. <https://investor.amac.org.cn/community/tzzhdzthd/ylj/202304/P020230410489976164138.pdf>", "note": "91.3% 为该研究披露的高换手组亏损概率，属样本统计而非监管口径；本书用 72 法则做的\"腰斩年限\"为估算演示。定级 A：同源账户级数据，但换手分组口径以原始论文为准。"}, {"chapter": 12, "num": 5, "id": "12-5", "title": "月均交易超 20 次：亏损率约 84.6%", "grade": "A", "tags": {"钱": "少", "时间": "少", "毅力": "些", "收益": "中", "口径": "金钱", "影响": "自己"}, "impact": "自己", "cost_money": "少", "cost_time": "少", "cost_will": "些", "benefit": "中", "scope": "金钱", "three_zero": false, "cost": "每天看盘、动手指、把交易当\"参与感\"的习惯。", "plain": "交易频率是亏损的领先指标。把\"每天看盘\"改成\"每月看一次\"，就甩掉了八成亏损人群。", "gain": "上交所账户数据显示，月均交易超过 20 次的账户，亏损率约 84.6%。每笔交易都附带显性（佣金、印花税）与隐性（买卖价差、冲击成本）损耗；以 A 股单边印花税 0.05%、券商佣金约 0.025% 计，每月 20 次往返约产生 0.15% 的纯摩擦成本，年化约 1.8 个百分点直接蒸发（本书按 12 个月估算），这还没算择时错误带来的方向性亏损。降低频率，等于先把自己从\"必亏的摩擦税\"里捞回来。84.6% 的亏损率意味着每 6.5 个高频账户只有约 1 个盈利；若把每月 20 次的摩擦税（年化约 1.8 个点）省下并投入 7% 组合，10 万元 20 年后多出约 21 万元（本书按复利差估算）。", "source": "施东辉、张晓燕等 (2020). 同上；中国证券投资基金业协会投资者教育材料. <https://investor.amac.org.cn/community/tzzhdzthd/ylj/202304/P020230410489976164138.pdf>", "note": "84.6% 来自上交所账户级分组统计；本书 1.8 个百分点的摩擦成本为依据现行税费率的估算，实际因券商佣金与交易规模而异。定级 A：数据源同条目 3–4。"}, {"chapter": 12, "num": 6, "id": "12-6", "title": "持仓不足 1 个月：盈利概率仅约 9.3%", "grade": "A", "tags": {"钱": "0", "时间": "少", "毅力": "些", "收益": "中", "口径": "金钱", "影响": "自己"}, "impact": "自己", "cost_money": "0", "cost_time": "少", "cost_will": "些", "benefit": "中", "scope": "金钱", "three_zero": false, "cost": "短线快进快出、指望\"几天就赚一笔\"的期待。", "plain": "拿着股票不到一个月就想卖的人，十次里只有一次赚钱。短线是散户把钱送给市场的传送带。", "gain": "上交所账户数据显示，持仓不足 1 个月的超短线账户，盈利概率仅约 9.3%，年化亏损约 18.7%。用实际利率的视角换算：名义亏 18.7%、若当年通胀约 2%，实际购买力损失约 20.7%（实际利率≈名义利率−通胀，本书代入估算）。超短线要持续盈利，等于要求自己在每笔都几乎必输的游戏里反复下注——数学期望为负，玩得越久输得越多。9.3% 盈利概率即约 1/11 的胜率；若每月全仓换股、年均 −18.7%，10 万本金 5 年后约剩 4.1 万元（10万×(0.813)^5，本书估算）。超短线不是\"灵活\"，是把本金按负期望反复下注。", "source": "施东辉、张晓燕等 (2020). 同上；中国证券投资基金业协会投资者教育材料. <https://investor.amac.org.cn/community/tzzhdzthd/ylj/202304/P020230410489976164138.pdf>", "note": "9.3% 盈利概率为上交所超短线分组统计；实际利率的换算示例为本书按\"实际≈名义−通胀\"估算。定级 A：同源账户级数据。"}, {"chapter": 12, "num": 7, "id": "12-7", "title": "基金回报差：偏股基金投资者每年少拿 2%–3.6%", "grade": "A", "tags": {"钱": "少", "时间": "少", "毅力": "些", "收益": "中", "口径": "金钱", "影响": "自己"}, "impact": "自己", "cost_money": "少", "cost_time": "少", "cost_will": "些", "benefit": "中", "scope": "金钱", "three_zero": false, "cost": "高点申购、低点赎回的申赎节奏，以及\"追热门行业\"的冲动。", "plain": "同样的基金，你因为择时和追涨杀跌，每年比基金本身少赚 2–3.6 个点。这不是市场的问题，是你交易节奏的问题。", "gain": "晨星（中国）2025 年发布的《中国公募基金投资者回报差研究报告》显示，截至 2024 年末的五年期年化回报差全部为负：积极配置基金 −2.17%、主动非行业股票 −2.65%、行业基金 −3.59%，固收类也有 −0.62%。把 −2.65% 放进复利看：10 万元按毛年化 10% 投 20 年本该约 67.3 万元，若每年被回报差吃掉 2.65 个点（净 7.35%），终值约 42.0 万元，差额超 25 万元（本书按 FV=PV(1+r)^n 估算）。基金是赚钱的，基民不赚，缺口就在申赎行为里。行业基金 −3.59% 的回报差尤其刺眼：若投 10 万、毛 12%、20 年本该约 96.5 万，被回报差吃 3.59 个点后净 8.41%，终值约 49.9 万，差额近 47 万（本书估算）。这正是\"买对基金却卖错时点\"的典型代价。", "source": "晨星（中国）(2025). 《中国公募基金投资者回报差研究报告》（截至 2024-12-31 五年期年化回报差）；转引见 新浪财经 (2025-05-22). 《晨星中国\"劝告\"基民：应规避短期择时和情绪化决策》. <https://finance.sina.com.cn/wm/2025-05-22/doc-inexmwyy6922130.shtml>；SEC (无年份). Investor Bulletin: How Fees and Expenses Affect Your Investment Portfolio（费用与行为共同侵蚀终值）. <https://www.sec.gov/oiea/investor-alerts-bulletins/ib_fees_expenses.html>", "note": "−2.17%/−2.65%/−3.59% 为晨星披露的具体数值；25 万元差额为本书按 10% 毛收益假设估算。定级 A：来自晨星公开发布的研究，方法透明。"}, {"chapter": 12, "num": 8, "id": "12-8", "title": "持有期越长亏得越少：<半年亏概率>50%，>3 年<20%", "grade": "A", "tags": {"钱": "少", "时间": "少", "毅力": "些", "收益": "中", "口径": "金钱", "影响": "自己"}, "impact": "自己", "cost_money": "少", "cost_time": "少", "cost_will": "些", "benefit": "中", "scope": "金钱", "three_zero": false, "cost": "拿不住的耐心，以及\"早卖早安心\"的焦虑。", "plain": "基金赚钱的秘诀就一个字：等。可惜大多数人拿不住——多数持有人持有时长不到一年，把\"等\"这一步自己删了。", "gain": "机构与平台数据普遍显示，持有基金不足半年亏损概率 >50%，持有 3 年以上降至 <20%；但仍有约 2/3 的基民持有时长 <1 年。用定投终值公式可量化\"早开始\"的威力：每月定投 1000 元、年化 7%、定投 30 年，终值≈1000×[(1.07)^30−1]/(0.07/12)≈122.7 万元（本书按年金终值公式估算，含本金 36 万、利息 86.7 万）。反过来，若晚 10 年才开始同样定投，终值仅约 56.8 万元——延迟的\"机会成本\"高达 65.9 万元。持有与早投，是同一枚硬币的两面。再算一次性投入：10 万一次性按 7% 放 30 年约 76.1 万；若因拿不住而反复进出发散，回报差（条目 7）会把这个数字砍掉一大截。早投与长持，省下的都是同一类\"确定性\"。", "source": "中国证券投资基金业协会 / 各平台持有人行为数据；晨星（中国）(2025). 《中国公募基金投资者回报差研究报告》（长期持有降低回报差）. <https://finance.sina.com.cn/wm/2025-05-22/doc-inexmwyy6922130.shtml>；Investopedia (无年份). Compound Interest（年金/定投终值公式）. <https://www.investopedia.com/terms/c/compoundinterest.asp>", "note": "持有期与亏损概率的具体阈值来自行业行为统计，各平台口径略有差异；定投终值与延迟机会成本均为本书按公式估算（假设 7% 年化）。定级 A：方向与量级一致，阈值以原始披露为准。"}, {"chapter": 12, "num": 9, "id": "12-9", "title": "黄金 1900 年至今实际年化约 0.7%：它是保险不是投资", "grade": "B", "tags": {"钱": "少", "时间": "少", "毅力": "些", "收益": "中", "口径": "金钱", "影响": "自己"}, "impact": "自己", "cost_money": "少", "cost_time": "少", "cost_will": "些", "benefit": "中", "scope": "金钱", "three_zero": false, "cost": "把黄金当\"抗通胀发财工具\"的想象，以及重仓黄金错失的股权收益。", "plain": "一百多年下来，黄金扣掉通胀几乎没涨。它的价值是\"别人 panic 时它涨\"，配 5%–10% 当保险即可，重仓当发财是误会。", "gain": "Credit Suisse《Global Investment Returns Yearbook》（Dimson、Marsh、Staunton）覆盖 1900–2022 年 35 个市场，显示黄金实际年化约 0.76%——1 美元黄金在 1900 年的实际购买力到 2022 年仅变为约 2.5 美元，同期美股变为约 2024 美元。用通胀的实际利率视角：实际利率≈名义利率−通胀；当名义金价年化约 3%、长期通胀约 2.3% 时，实际仅约 0.7%。72 法则反推：实际购买力翻倍需约 72÷0.7≈103 年。黄金的角色是危机对冲，不是财富引擎。对比股票：1900–2022 全球股票实际年化约 5%，黄金仅 0.76%——同样 1 美元，股票变 2024 倍、黄金仅 2.5 倍。若把 10% 资产配置在黄金而非股票，百年维度少赚的数量级惊人（本书按实际年化差估算）。保险属性值得留，发财幻想该丢。", "source": "Dimson, E., Marsh, P. & Staunton, M. (2023). Credit Suisse Global Investment Returns Yearbook 2023（第 8 章 Commodities and Inflation：1900 年起黄金实际年化 0.76%）. <https://www.london.edu/news/commodities-offer-hedge-against-inflation-2153>；Credit Suisse Research Institute (2023). Global Investment Returns Yearbook 2023 Summary Edition. <https://www.ryt9.com/en/prg/266031>", "note": "原条目\"1800 年\"口径不严谨，Yearbook 数据自 1900 年起，故更正为\"1900 年至今\"；0.76% 为美元实际回报，其他币种/区间略有差异。定级 B：长期数据权威，但黄金短期波动大、与组合相关性随时间变化，不宜机械外推。"}, {"chapter": 12, "num": 10, "id": "12-10", "title": "主动基金 15 年约 90% 以上跑不赢指数", "grade": "A", "tags": {"钱": "少", "时间": "少", "毅力": "些", "收益": "中", "口径": "金钱", "影响": "自己"}, "impact": "自己", "cost_money": "少", "cost_time": "少", "cost_will": "些", "benefit": "中", "scope": "金钱", "three_zero": false, "cost": "花高价（1% 以上管理费）请基金经理打败市场的期待。", "plain": "你付管理费请人打败市场，结果十五年里九成以上没打败。这不是个别，是统计规律。", "gain": "标普 SPIVA 最新数据（截至 2025 年末）：美国大盘主动基金 1 年跑输标普 500 的占 78.8%，5 年 89%、10 年 85.6%、15 年约 90%、20 年 92.9%；全市场口径 15 年跑输约 90.5%。这意味着长期拿着主动基金，十之八九是在用 1%+ 的费用买一个\"大概率跑输\"的结果。费率侵蚀（见条目 1）正是主因之一：主动基金年化费率常比指数基金高 0.6–1.5 个点，而 Sharpe（1991）已证明\"主动管理整体在扣除费用前也只是市场平均\"。把 90% 跑输换算成钱：100 万投主动基金 20 年，若主动年化（费后）比指数低 1.5 个点（8% vs 9.5%），终值约 466 万 vs 615 万，差额 149 万（本书按复利估算）。选低成本指数，是用脚投票避开这个概率劣势。", "source": "S&P Dow Jones Indices (2026). SPIVA U.S. Scorecard（Year-End 2025，各期限跑输基准百分比）. <https://www.spglobal.com/spdji/tc/research-insights/spiva/>；Sharpe, W. (1991). The Arithmetic of Active Management, Financial Analysts Journal, 47(1), 7–9", "note": "90% 为 SPIVA 15 年全市场口径的近似；不同基金类别（如大盘价值）跑输率略低。定级 A：SPIVA 为全球引用最广的主动/被动对照研究，且已校正幸存者偏差。"}, {"chapter": 12, "num": 11, "id": "12-11", "title": "资产配置解释约 90% 的回报波动", "grade": "B", "tags": {"钱": "少", "时间": "少", "毅力": "些", "收益": "中", "口径": "金钱", "影响": "自己"}, "impact": "自己", "cost_money": "少", "cost_time": "少", "cost_will": "些", "benefit": "中", "scope": "金钱", "three_zero": false, "cost": "花大量时间选个股、择时，却不在\"股几债几\"这个真正的大旋钮上做功课。", "plain": "你纠结买哪只股票，不如先定\"股几债几\"。决定你睡不睡得着的，是大类比例，不是那几只票。", "gain": "Brinson、Hood & Beebower（1986）研究 91 只美国大型养老基金（1974–1983）季度数据，发现资产配置（政策权重）平均解释组合收益方差的 93.6%；1991 年更新样本（1977–1987）为 91.5%。常被转述为\"资产配置决定约 90% 的回报表现\"。换算成机会成本：把每周数小时用在挑个股上，不如用同样精力把股债比例定对、再纪律化再平衡——前者边际贡献有限，后者直接决定波动与回撤。Ibbotson & Kaplan（2000）进一步指出，配置解释了跨基金回报水平差异的约 40%、时间波动的约 90%。用数字体会：若组合 60% 股、40% 债，长期波动主要来自这两类的比例，而非\"买了哪只银行股\"。把每月盯个股的 10 小时改做再平衡与仓位校准，省下的精力是无本的机会收益。", "source": "Brinson, G., Hood, L. & Beebower, G. (1986). Determinants of Portfolio Performance, Financial Analysts Journal, 42(4), 39–44；转引见 中国证券网 (2016-02). 《中金公司：大类资产配置时代来临》（列示 93.6%/91.5% 等数值）. <https://news.cnstock.com/news,zxk-201602-3716825.htm>；Ibbotson, R. & Kaplan, P. (2000). Does Asset Allocation Policy Explain 40, 90, or 100 Percent of Performance?, Financial Analysts Journal, 56(1)", "note": "经典结论衡量的是\"收益方差/波动\"而非\"收益水平\"，常被误读为\"配置决定 90% 的收益率\"，须谨慎；且样本为美国养老基金。定级 B：学术基础扎实，但表述易被营销夸大，已注明口径。"}, {"chapter": 12, "num": 12, "id": "12-12", "title": "打新破发率峰值 28%（2022）：红利会消失", "grade": "A", "tags": {"钱": "少", "时间": "少", "毅力": "些", "收益": "中", "口径": "金钱", "影响": "自己"}, "impact": "自己", "cost_money": "少", "cost_time": "少", "cost_will": "些", "benefit": "中", "scope": "金钱", "three_zero": false, "cost": "把\"打新必赚\"当永久常识，以及为申购而长期占用资金的机会成本。", "plain": "没有永远的套利。2021 年前闭眼打新赚钱，2022 就亏掉两成多。把\"免费午餐\"当永久福利，迟早被反噬。", "gain": "注册制询价新规后，A 股破发率剧烈波动：2022 年新股破发率超 28%（部分月份超八成），2023 年约 16.6%–21.4%，2024 年上市约 100 家中仅 1 家破发（约 1%–2%），2025 年截至 6 月 45 只新股首日全部上涨、破发率为 0。用机会成本算：2022 年若闭眼打新并持有上市首日，账户可能直接浮亏超两成；而 2024–2025 的低破发更多是\"发行 PE 回到 22 倍上下 + 供给收紧\"的结果，并非制度 guarante。红利随时可能因供给放量或定价回升而反转。算笔账：2022 年若每只新股都申购并持有到首日，假设平均中签收益为负、破发 28%，本金回撤可观；而 2024–2025 低破发期的\"无脑盈利\"一旦供给放量立刻反转。套利红利的本质是阶段性定价错位，不是永久权利。", "source": "网易 (2025-06). 《新股0破发，再回无脑打新时代》（2022 破发率>28%、2024 仅 1 家、2025 零破发）. <https://m.163.com/dy/article/K1KJDE1P0530MI2R.html>；百度百科 (无年份). 破发率（2010–2025 各年 A 股首日破发率统计）. <https://baike.baidu.com/item/%E7%A0%B4%E5%8F%91%E7%8E%87/69139871>", "note": "破发率口径为\"首日破发\"，不同统计（首日/累计）会有差异；2025 零破发为阶段性现象，非稳态。定级 A：数据来自公开统计，但属市场现象描述，非监管定论。"}, {"chapter": 12, "num": 13, "id": "12-13", "title": "杠杆：跌 50% 需 +100% 回本，加杠杆可归零", "grade": "A", "tags": {"钱": "0", "时间": "少", "毅力": "些", "收益": "中", "口径": "金钱", "影响": "自己／家庭"}, "impact": "自己／家庭", "cost_money": "0", "cost_time": "少", "cost_will": "些", "benefit": "中", "scope": "金钱", "three_zero": false, "cost": "无杠杆时用\"跌了还能回本\"的安全感，以及为加杠杆支付的利息。", "plain": "杠杆不改胜率，只把\"波动\"变成\"死亡\"。它让小回调变成灭顶之灾——普通投资者最该永久拉黑的按钮。", "gain": "复利公式 FV=PV(1+r)^n 在亏损侧同样冷酷：无杠杆时本金跌 50%，需涨 +100% 才能回本（因为 0.5×2=1）；若用 2 倍杠杆，标的跌 25% 你的本金就归零（1−2×25%=0），连回本机会都没有。更隐蔽的是利息成本：按央行〔2021〕第3号，贷款年化利率须以内部收益率（IRR）法、含全部费用折算成年化披露——融资融券年化利率常在 6%–8%，用 72 法则，仅利息一项约 9–12 年就能吃掉你一半的本金（72÷7≈10.3）。SEC 警示：保证金账户\"可能亏损超过本金\"，且券商可不经通知强平。实例：2 倍杠杆下，标的跌 25% 本金归零；1.5 倍杠杆跌约 33% 归零。叠加 7% 融资利息（IRR 年化，央行公告口径），实际每年成本远超 7%——对家庭而言，强平可能把\"投资回撤\"升级为\"家庭资产负债表击穿\"。", "source": "中国人民银行 (2021). 中国人民银行公告〔2021〕第3号（第四条：年化利率可采用复利即内部收益率法计算，含全部贷款成本）. <https://www.gov.cn/zhengce/zhengceku/2021-03/31/content_5597156.htm>；SEC (无年份). Investor Bulletin: Leveraged Investing Strategies – Know the Risks（保证金可亏超本金、可能被强平）. <https://sec.gov/oiea/investor-alerts-and-bulletins/ib_leveragedinvesting>", "note": "跌 50% 需 +100% 回本为纯数学；杠杆强平与利息为机制性风险，具体利率与维持保证金比例因券商而异。定级 A：数学恒等式 + 监管警示，确定性高。"}, {"chapter": 12, "num": 14, "id": "12-14", "title": "择时损耗约 3–4 个百分点/年", "grade": "A", "tags": {"钱": "少", "时间": "少", "毅力": "些", "收益": "中", "口径": "金钱", "影响": "自己"}, "impact": "自己", "cost_money": "少", "cost_time": "少", "cost_will": "些", "benefit": "中", "scope": "金钱", "three_zero": false, "cost": "试图高抛低吸、躲大跌抄底的尝试，以及为此付出的交易税费。", "plain": "你以为自己在\"躲大跌抄底\"，数据说你每年因此少赚 3–4 个点。择时的代价，是确定且昂贵的。", "gain": "DALBAR《Quantitative Analysis of Investor Behavior》(QAIB) 追踪投资者实际回报与基准之差：2024 年普通股基民收益 16.54%，而标普 500 为 25.02%，缺口达 8.48 个百分点（过去十年第二大）；自 1985 年起，平均股票投资者已连续 15 年跑输指数。把 3–4 个点的年化损耗放进复利：10 万元按 10% 投 20 年本该约 67.3 万元，若因择时净收益降到 6.5%，终值仅约 35.7 万元，差额超 31 万元（本书按 FV=PV(1+r)^n 估算）。择时不仅亏在方向，更亏在\"错过最好的几天\"——Wells Fargo 测算去掉涨幅最大的若干交易日，长期回报会断崖式下跌。把 8.48 个点的单年缺口（2024）年化看：普通股民 16.54% vs 指数 25.02%，差 848bp；若 30 年都少赚 4 个点，100 万变 324 万而非 867 万（本书按复利估算）。择时损耗是\"隐形的、确定性的、复利放大\"的三重税。", "source": "DALBAR (2025). Quantitative Analysis of Investor Behavior (QAIB) 2025（2024 年普通股投资者 16.54% vs 标普 500 25.02%，缺口 848bp）；新闻稿. <https://www.dalbar.com/press-release/investors-missed-the-best-of-2024s-market-gains-latest-dalbar-investor-behavior-report-finds/>；Wells Fargo Advisors (无年份). The perils of trying to time volatile markets（剔除最佳交易日对长期回报的影响）. <https://www.wellsfargoadvisors.com/research-analysis/reports/policy/volatile-markets.htm>", "note": "3–4 个点为 QAIB 长期平均量级的近似；31 万元差额为本书按 10% vs 6.5% 假设估算。定级 A：DALBAR 自 1985 年连续追踪，方法公开，但样本为美国市场。"}, {"chapter": 12, "num": 15, "id": "12-15", "title": "散户贡献八成交易量、盈利不到一成", "grade": "A", "tags": {"钱": "0", "时间": "少", "毅力": "些", "收益": "中", "口径": "金钱", "影响": "自己"}, "impact": "自己", "cost_money": "0", "cost_time": "少", "cost_will": "些", "benefit": "中", "scope": "金钱", "three_zero": false, "cost": "把\"频繁操作\"当参与感的错觉，以及为此消耗的时间与精力。", "plain": "散户干了八成的活，赚了不到一成的钱。这不是段子，是年鉴白纸黑字。结论很清楚：少干点活，多赚点钱。", "gain": "《上海证券交易所统计年鉴(2018 卷)》显示，2017 年个人投资者贡献了 82.01% 的交易量，却只获得总盈利的 9.00%（机构盈利占比 32.30%、一般法人 55.70%）；个人整体盈利 3108 亿元，机构 11156 亿元，机构盈利是散户的 3.6 倍。把\"投入产出比\"算清楚：散户用 5.9 倍的交易量，换回不到三成的盈利份额——每单位操作产出极低。减少无效交易，既省税费（见条目 5），也少踩择时亏损（见条目 14），是性价比最高的\"动作\"。算产出比：散户用 82% 的交易量换 9% 的盈利，机构用 14.76% 交易量换 32.3% 盈利——散户单位交易产出约为机构的 1/20（本书按年鉴比例估算）。少交易不是\"躺平\"，是把自己从负期望的游戏中撤出。", "source": "上海证券交易所 (2018). 《上海证券交易所统计年鉴(2018 卷)》（2017 年投资者交易量与盈利结构）；转引见 21 世纪经济报道 (2018-08-30). 《上交所统计年鉴：小散贡献八成交易量，盈利却只占一成》. <https://m.21jingji.com/article/20180830/herald/3a5530ea4e34c0c8201843a2464326bc.html>；羊城晚报 (2021-01-20). 《A股加速从散户市走向机构市》（引用年鉴 82.01% 交易量）. <https://ep.ycwb.com/epaper/ywdf/html/2021-01/20/content_695_352263.htm>", "note": "82.01% 交易量、9.00% 盈利为 2017 年沪市数据，深市与近年结构已变化（机构占比上升）；结论的\"散户低产出\"方向稳健。定级 A：来自交易所年鉴，口径权威。"}, {"chapter": 13, "num": 1, "id": "13-1", "title": "开个人养老金账户，先吃税优", "grade": "A", "tags": {"钱": "少", "时间": "少", "毅力": "些", "收益": "中", "口径": "金钱", "影响": "自己／家庭"}, "impact": "自己／家庭", "cost_money": "少", "cost_time": "少", "cost_will": "些", "benefit": "中", "scope": "金钱", "three_zero": false, "cost": "每年最多缴 12000 元（2022 年起制度，可投养老理财/基金/存款/保险四类）；开户与操作约半小时，资金一般锁定至退休（极少数情形可领）。", "plain": "这是国家给的合法税优口子，年上限 1.2 万，领钱时只抽 3%。你税率越高越该用；税率本来就 3% 也别嫌弃，白捡免税复利。闭眼开户，挑个低费率养老目标基金或存款即可。", "gain": "个人养老金实行个人账户、完全积累、封闭运行，参加人需已参加城镇职工或城乡居民基本养老保险（国办发〔2022〕7号）。缴费环节按 12000 元/年限额在综合所得或经营所得中据实扣除；投资环节账户内收益暂不征个税；领取环节单独按 3% 计税、不并入综合所得（财税〔2022〕34号，2024 年第 21 号推广至全国，自 2024-12-15 全面实施）。对个税边际税率 10% 及以上者，仅缴费抵扣每年最多省 1200 元，更重要的是投资期\"免税复利\"随年限放大；3% 档几乎中性，但仍赚长期免税增值。账户\"长钱\"属性还反向抑制频繁交易。截至 2024 年 6 月全国已有超 6000 万人参加，制度已成第三支柱核心。", "source": "国务院办公厅 (2022). 关于推动个人养老金发展的意见（国办发〔2022〕7号，第三、四、五条：个人账户、年缴上限12000元、可投储蓄/理财/保险/基金）. <https://www.gov.cn/zhengce/content/2022-04/21/content_5686402.htm>；财政部 税务总局 (2022). 关于个人养老金有关个人所得税政策的公告（财政部 税务总局公告2022年第34号，第一条：缴费扣除、投资免税、领取3%）. <https://szs.mof.gov.cn/zhengcefabu/202211/t20221104_3849838.htm>；财政部 税务总局 (2024). 关于在全国范围实施个人养老金个人所得税优惠政策的公告（财政部 税务总局公告2024年第21号）. <https://shanghai.chinatax.gov.cn/gate/big5/shanghai.chinatax.gov.cn/zcfw/zcfgk/grsds/202412/t474540.html>", "note": "局限性：额度小（年 1.2 万）、领取锁定，省税力度与边际税率正相关；3% 档纯赚免税复利但抵扣无感。交叉参考：第 2、3 条。"}, {"chapter": 13, "num": 2, "id": "13-2", "title": "\"4% 法则\"能帮你估养老要攒多少", "grade": "A", "tags": {"钱": "0", "时间": "少", "毅力": "否", "收益": "中", "口径": "金钱", "影响": "自己"}, "impact": "自己", "cost_money": "0", "cost_time": "少", "cost_will": "否", "benefit": "中", "scope": "金钱", "three_zero": false, "cost": "理解它的前提（一次性读完即可）。", "plain": "一个被反复验证的经验锚：攒到「每年要花的 25 倍」基本够退休（即\"25 倍法则\"）。它不是铁律——遇大萧条早期或寿命超 30 年会被击穿，但作为「我到底要攒多少」的第一近似值够用。", "gain": "1994 年 Bengen 用美国 1926–1976 年股债历史数据回测，提出退休首年提取投资组合的 4%、之后按通胀逐年上调，在 50%–75% 股票 + 剩余债券的组合下，历史上所有 30 年区间钱都花不完，他称这一最高\"安全\"提取率为 SAFEMAX。即\"目标年支出 ÷ 4% ≈ 需攒本金\"，等价于攒够年支出的 25 倍。例：年花 12 万 → 需约 300 万。1998 年 Trinity 研究（Cooley 等）独立验证：50/50 股债、4% 提款、30 年成功率达 95%，75% 股票时达 98%。注意三点：一是未扣税费与顾问费，实际安全线更低（约 3.5%–3.8%）；二是只覆盖 30 年，若 60 岁退休、预期活到 95 岁需按 35 年算，提取率应降到约 3.3%–3.5%；三是依赖美国强市况，Pfau 估计其他国家安全线仅约 2.4%–3%。", "source": "Bengen, W. P. (1994). Determining Withdrawal Rates Using Historical Data, Journal of Financial Planning（首年 4% 通胀调整、30 年不枯竭，组合 50%–75% 股票）. <https://www.web.stanford.edu/~wfsharpe/retecon/4percent.pdf>（Sharpe 对该文的综述，含 Bengen 原话引述）；Wikipedia (无年份). 4% rule（含 Trinity Study 1998 成功率）. <https://en.wikipedia.org/wiki/4%25_rule>", "note": "局限性：美股市况特异，未计税费；寿命超 30 年或遇 1968 式高通胀开局会被击穿。定级 A：方法可复核、被 Trinity 等多次独立验证，但结论对国别与费率敏感。交叉参考：第 5、11 条。"}, {"chapter": 13, "num": 3, "id": "13-3", "title": "别把社保替代率当靠山", "grade": "C", "tags": {"钱": "0", "时间": "0", "毅力": "否", "收益": "中", "口径": "金钱", "影响": "自己"}, "impact": "自己", "cost_money": "0", "cost_time": "0", "cost_will": "否", "benefit": "中", "scope": "金钱", "three_zero": true, "cost": "接受现实的心理成本。", "plain": "社保是「兜底不兜富」。想退休不掉档，差额得自己用个人养老金、储蓄、投资补。别等临近退休才发现窟窿。", "gain": "世界银行《Averting the Old Age Crisis》(1994) 提出退休收入替代率目标约为退休前工资的 70%（净终年工资口径），OECD 亦以 70% 作为维持退休前生活水准的基准；国际劳工组织 1952 年《社会保障最低标准公约》（第 102 号）则把公共养老金替代率下限定在 40%–55%。我国制度设计目标替代率曾为 59.2%，但社科院世界社保研究中心主任郑秉文 2023 年指出，国内职工养老保险实际替代率约为 40%，5 年前约 44%、15 年前约 50%，呈持续下行；2023 年城镇职工基本养老保险参保离退休人员约 1.42 亿、基金支出约 6.38 万亿元，现收现付制下抚养比恶化（2035 年退休人口或超 4 亿）进一步压低替代率。只靠社保，退休后生活水平大概率明显下台阶——缺口需用第三支柱补。", "source": "World Bank (1994). Averting the Old Age Crisis: Policies to Protect the Old and Promote Growth（三支柱、替代率目标）. <https://www.ageing.ox.ac.uk/download/312>（综述引用该报告）；International Labour Organization (1952). 社会保障(最低标准)公约（第102号，养老金替代率下限）. <https://www.ilo.org/zh-hans/media/261486/download>；郑秉文 (2024-04). 青年人应尽早准备养老（替代率约40%、5年前44%、15年前50%）. <https://static.nfnews.com/content/202404/03/c8751084.html>", "note": "替代率口径各家算法不一（制度平均 vs 个人替代率），社科院数据偏\"在岗职工平均工资\"口径；定级 C 因口径争议大。交叉参考：第 1、8 条。"}, {"chapter": 13, "num": 4, "id": "13-4", "title": "养老钱先铺「安全垫」再谈增值", "grade": "B", "tags": {"钱": "0", "时间": "少", "毅力": "些", "收益": "中", "口径": "金钱", "影响": "自己"}, "impact": "自己", "cost_money": "0", "cost_time": "少", "cost_will": "些", "benefit": "中", "scope": "金钱", "three_zero": false, "cost": "放弃用养老本金博高收益的机会。", "plain": "年轻时可以扛波动，快退休了还满仓股票，万一开局连跌三年，本金永久少一截、又没收入补，最惨。越接近退休越该把「确定要花的钱」锁进稳的。", "gain": "临近退休（前 5–10 年）应把\"必需支出对应的钱\"逐步挪到存款、国债、纯债、年金等低波动资产，降低\"顺序收益率风险\"（sequence-of-returns risk）：同样的平均年化，若退休头几年连跌，本金被低价卖出、其后反弹也补不回，最终破产概率显著高于平稳市况。证监会在《养老目标证券投资基金指引(试行)》（证监会公告〔2018〕2号）第四条明确要求目标日期基金\"随目标日期临近逐步降低权益类资产配置比例、增加非权益类比例\"，正是用制度把这一纪律固化。换言之，下滑轨道（glide path）不是保守，而是用\"先股后债\"的时间分散，替你躲开退休临界点的致命一跌。数据上，55 岁仍满仓股票者，若遭遇 2000 或 2008 式开局，退休即亏的概率明显抬升。", "source": "中国证监会 (2018). 养老目标证券投资基金指引(试行)（证监会公告〔2018〕2号，第四条：目标日期策略随临近逐步降低权益比例）. <https://big5.www.gov.cn/gate/big5/www.gov.cn/gongbao/content/2018/content_5303451.htm>；国务院办公厅 (2022). 关于推动个人养老金发展的意见（国办发〔2022〕7号，第三支柱多支柱配置）. <https://www.gov.cn/zhengce/content/2022-04/21/content_5686402.htm>", "note": "局限性：过早降波动会牺牲长期收益，平衡点取决于退休年龄与风险承受力。交叉参考：第 2、11 条。"}, {"chapter": 13, "num": 5, "id": "13-5", "title": "长寿风险：人活着，钱没了", "grade": "C", "tags": {"钱": "0", "时间": "0", "毅力": "否", "收益": "中", "口径": "金钱", "影响": "自己／家庭"}, "impact": "自己／家庭", "cost_money": "0", "cost_time": "0", "cost_will": "否", "benefit": "中", "scope": "金钱", "three_zero": true, "cost": "为「活太久」预留缓冲的克制。", "plain": "现在人越活越长，退休金按 20 年算会不够。要么多攒，要么买点「活到老领到老」的年金把尾巴风险切掉。", "gain": "国家卫健委《2023 年我国卫生健康事业发展统计公报》显示我国人均预期寿命已达 78.6 岁，2024 年进一步提高到 79 岁，且女性、城市人群更长；社科院郑秉文指出 2035 年 60 岁及以上人口将超 4 亿。若 60 岁退休、活到 90 岁，退休期长达 30 年，按\"4% 法则\"测算已逼近边界，活到 95 岁则需把提取率降到约 3.3%。这就是\"长寿风险\"：模型假设活 30 年，结果活了 35 年，后半段无钱可花。对冲方法有三：其一，按 30–35 年而非 20 年做储蓄倍数（年支出 ×25 倍只是下限）；其二，保留一部分社保、年金这类\"活多久领多久\"的现金流；其三，用可延迟领取的年金把尾部不确定性转嫁给保险公司。", "source": "国家卫生健康委 (2024). 2023年我国卫生健康事业发展统计公报（人均预期寿命78.6岁）. <https://big5.www.gov.cn/gate/big5/www.gov.cn/lianbo/bumen/202408/content_6971252.htm>；国家卫生健康委 (2025). 人均预期寿命达79岁（2024年）. <https://cpc.people.com.cn/n1/2025/0313/c64387-40437889.html>；郑秉文 (2024-04). 青年人应尽早准备养老（2035年60岁+人口超4亿）. <https://static.nfnews.com/content/202404/03/c8751084.html>", "note": "局限性：预期寿命为群体均值，个体差异大；定级 C 因属趋势性推演。交叉参考：第 2、6 条。"}, {"chapter": 13, "num": 6, "id": "13-6", "title": "年金把「寿命不确定」变成确定现金流", "grade": "B", "tags": {"钱": "少", "时间": "少", "毅力": "些", "收益": "中", "口径": "金钱", "影响": "自己"}, "impact": "自己", "cost_money": "少", "cost_time": "少", "cost_will": "些", "benefit": "中", "scope": "金钱", "three_zero": false, "cost": "一笔保费（或账户转换），流动性归零。", "plain": "年金本质是你把「活太久」的风险卖给保险公司。它不性感、收益不亮眼，但能保你不会 90 岁还在为吃饭发愁。适合作为养老组合里「保底那块」，不是全部。", "gain": "商业养老年金/终身年金的本质是\"长寿风险证券化\"：你一次性或分期交保费，保险公司按精算承诺此后每月固定给付、与寿命等长，专治\"怕活太久\"。对没有稳定养老金来源的普通人，它能消除最坏的尾部风险——只要活着就有钱。在个人养老金框架下，商业养老保险是被明确纳入的四大类产品之一（国办发〔2022〕7号），证监会《养老目标基金指引》也允许目标风险策略产品作为稳健拼图。需注意：年金流动性差、早期身故可能\"保本不回本\"（除非附带身故返还/保证领取条款），且固定给付不抗通胀，因此应只占养老组合的一部分（如 20%–40%），与社保、权益资产搭配，而非全部押上。", "source": "国务院办公厅 (2022). 关于推动个人养老金发展的意见（国办发〔2022〕7号，第四条：可投商业养老保险）. <https://www.gov.cn/zhengce/content/2022-04/21/content_5686402.htm>；中国证监会 (2018). 养老目标证券投资基金指引(试行)（证监会公告〔2018〕2号，第四条：目标风险策略）. <https://big5.www.gov.cn/gate/big5/www.gov.cn/gongbao/content/2018/content_5303451.htm>", "note": "局限性：早期身故损失、不抗通胀、流动性归零；定级 B 因产品条款差异大。交叉参考：第 5、7 条。"}, {"chapter": 13, "num": 7, "id": "13-7", "title": "长期护理是养老最大的不确定账单", "grade": "C", "tags": {"钱": "0", "时间": "0", "毅力": "否", "收益": "中", "口径": "金钱", "影响": "自己／家庭"}, "impact": "自己／家庭", "cost_money": "0", "cost_time": "0", "cost_will": "否", "benefit": "中", "scope": "金钱", "three_zero": true, "cost": "提前规划的意识。", "plain": "养老最烧钱的不是吃饭旅游，是失能后的护理。这笔钱社保补不了多少，要么买护理险，要么留一笔随时能取的活钱，别全锁死在房产里。", "gain": "第七次人口普查显示我国 60 岁及以上超 2.64 亿、失能半失能老人超 4000 万；2023 年该群体约 4500 万。失能后机构或居家护理月费常达数千元，且社保报销有限。国家自 2016 年在 15 城启动、2020 年扩至 49 城试点\"长期护理保险\"（第六险），覆盖超 1.8 亿人、累计超 235 万失能老人享受待遇，基金支付约占护理费用 70%；人民网披露重度失能者月护理自付可由 2100 元降到约 600 元。但长护险仍处试点、筹资与评估标准未全国统一，且只覆盖\"基本\"护理。普通人应对：参加长护险、中年时配一份商业护理/重疾险、并保留一笔高流动性活钱，别把养老钱全锁进房产或到期长的年金。", "source": "中国青年网 (2024-10). 长护险试点八年成效显著（覆盖1.8亿、235万享受待遇、基金支付约70%）. <https://news.youth.cn/hotnews_41880/202410/t20241028_15609485.htm>；人民网 (2016-11). 建立长期护理保险迫在眉睫（基金支付水平总体约70%、月自付由2100降至600）. <https://health.people.com.cn/n1/2016/1127/c408579-28899778.html>；中国日报网 (2021-11). \"第六险\"是什么（49城试点、失能半失能超4000万）. <https://qiye.chinadaily.com.cn/a/202111/02/WS61809cbaa3107be4979f6057.html>", "note": "局限性：长护险未全国定型、待遇与评估地区差异大；定级 C 因数据多为试点统计。交叉参考：第 6、12 条。"}, {"chapter": 13, "num": 8, "id": "13-8", "title": "退休年龄只会越来越晚", "grade": "A", "tags": {"钱": "0", "时间": "0", "毅力": "否", "收益": "中", "口径": "金钱", "影响": "自己"}, "impact": "自己", "cost_money": "0", "cost_time": "0", "cost_will": "否", "benefit": "中", "scope": "金钱", "three_zero": true, "cost": "接受延迟退休的趋势。", "plain": "别按「60 岁准时退休」算账。政策方向是往后延，你的储备计划得按更晚退休、更长退休期两边夹。", "gain": "2024 年 9 月 13 日全国人大常委会通过《关于实施渐进式延迟法定退休年龄的决定》，并批准《国务院关于渐进式延迟法定退休年龄的办法》，自 2025-01-01 施行：用 15 年把男职工从 60 延至 63、原 55 岁女职工延至 58、原 50 岁女职工延至 55（男职工及 55 岁女每 4 个月延 1 个月，50 岁女每 2 个月延 1 个月）；同时自 2030-01-01 起用 10 年将按月领养老金最低缴费年限由 15 年逐步提高至 20 年（每年加 6 个月，2025–2029 退休仍按 15 年）。配套弹性退休：达最低缴费年限可自愿提前不超 3 年（不低于原法定年龄），也可协商一致延迟不超 3 年。对个人的含义：领取年份推迟、缴费年份拉长，养老储备窗口被压实，按\"60 岁退休 + 30 年退休期\"算账会高估缺口、按更晚退休则需在岗期多积累。", "source": "全国人民代表大会 (2024). 关于实施渐进式延迟法定退休年龄的决定（2024-09-13通过，附国务院办法，2025-01-01施行）. <https://www.gov.cn/yaowen/liebiao/202409/content_6974294.htm>；全国人大网 (2024-09). 稳妥有序实施延迟法定退休年龄（人社部解读：男60→63、女55→58/50→55、最低缴费年限15→20）. <http://www.npc.gov.cn/c2/c30834/202409/t20240914_439685.html>", "note": "局限性：弹性退休需单位协商、特殊工种另有政策；定级 A 为法律效力文件。交叉参考：第 3、5 条。"}, {"chapter": 13, "num": 9, "id": "13-9", "title": "养老别全压在房子上", "grade": "C", "tags": {"钱": "0", "时间": "0", "毅力": "否", "收益": "中", "口径": "金钱", "影响": "自己"}, "impact": "自己", "cost_money": "0", "cost_time": "0", "cost_will": "否", "benefit": "中", "scope": "金钱", "three_zero": true, "cost": "分散配置的觉悟。", "plain": "一套房不能当养老金用——你没法按月「吃房子」。真到要用钱，卖房慢、还可能赶上低点。养老钱得分一部分在能随时取的地方。", "gain": "房产是\"纸面财富\"而非现金流：它难变现（交易周期以月计、有中介税费摩擦）、难分割（不能按月取 1/12 套）、且价格有周期，急需用钱时可能被迫贱卖。世界银行《Averting the Old Age Crisis》(1994) 强调养老要靠\"多支柱\"——公共养老金、强制储蓄、自愿储蓄/商业保险分层，恰恰反对把安全压在单一资产。对个人而言，养老现金流应至少有一部分在能按月取用的金融资产（存款、债券、养老目标基金、年金）上；房产可作为兜底净资产，但不该是唯一来源。尤其退休期若遇长护或医疗大额支出，房产的流动性短板会放大财务风险。合理做法是\"房产 + 金融资产 + 保险\"三元搭配，确保每月有可持续的现金流入。", "source": "World Bank (1994). Averting the Old Age Crisis（多支柱、反对单一资产依赖）. <https://www.ageing.ox.ac.uk/download/312>；国务院办公厅 (2022). 关于推动个人养老金发展的意见（国办发〔2022〕7号，第三支柱多支柱配置）. <https://www.gov.cn/zhengce/content/2022-04/21/content_5686402.htm>", "note": "局限性：核心地段优质房产流动性较好，结论为一般性规律；定级 C 因属配置原则。交叉参考：第 7、10 条。"}, {"chapter": 13, "num": 10, "id": "13-10", "title": "通胀是养老的隐形杀手，看真实回报", "grade": "B", "tags": {"钱": "0", "时间": "少", "毅力": "否", "收益": "中", "口径": "金钱", "影响": "自己"}, "impact": "自己", "cost_money": "0", "cost_time": "少", "cost_will": "否", "benefit": "中", "scope": "金钱", "three_zero": false, "cost": "记账时多算一步「扣通胀」。", "plain": "你以为存银行稳妥，30 年后那笔钱买不了同样的东西。养老钱不能全放存款，得留一部分能跟通胀走的。", "gain": "长期 2%–3% 的温和通胀，30 年就能让购买力腰斩：1 元按 2.5% 通胀 30 年后仅值约 0.47 元（1÷1.025³⁰≈0.47）。Bengen 的 4% 法则是\"实际（通胀调整后）\"提款，本身就承认通胀会持续啃食本金；若组合全压存款，名义保值但实际购买力年年缩水。历史数据显示，股票/宽基指数长期实际年化约 6%–7%，显著跑赢存款与通胀；国债、TIPS（通胀保值债券）也能部分对冲。中国 1990–2023 年 CPI 多数年份在 2%–3% 区间，养老组合必须含\"能跟通胀走\"的资产，否则 30 年退休期里前松后紧、晚年被迫缩衣节食。一句话：看真实回报，别只看账面。", "source": "Bengen, W. P. (1994). Determining Withdrawal Rates Using Historical Data（4% 为通胀调整后实际提款率）. <https://www.web.stanford.edu/~wfsharpe/retecon/4percent.pdf>；World Bank (1994). Averting the Old Age Crisis（通胀对老年安全的侵蚀）. <https://www.ageing.ox.ac.uk/download/312>", "note": "局限性：权益资产抗通胀但短期波动大，需与年龄匹配（见第 11 条）；定级 B 因长期规律明确但短期受扰动。交叉参考：第 4、11 条。"}, {"chapter": 13, "num": 11, "id": "13-11", "title": "越老越该降波动（下滑轨道）", "grade": "B", "tags": {"钱": "0", "时间": "少", "毅力": "些", "收益": "中", "口径": "金钱", "影响": "自己"}, "impact": "自己", "cost_money": "0", "cost_time": "少", "cost_will": "些", "benefit": "中", "scope": "金钱", "three_zero": false, "cost": "年轻时的一部分潜在高收益。", "plain": "25 岁满仓股票没问题，55 岁还满仓就赌命。年纪越大越要把「确定要花的钱」挪去稳的，这是用纪律换睡眠。", "gain": "随年龄增长自动下调股票比例（target-date / glide path），是经监管固化、学界验证的纪律。证监会《养老目标证券投资基金指引(试行)》（〔2018〕2号）第四条强制要求目标日期基金\"随所设定目标日期临近，逐步降低权益类资产配置比例、增加非权益类比例\"。原理在于\"顺序收益率风险\"：退休前 3–5 年若遇大跌，本金被低价卖出、之后反弹也难回血，破产概率陡升；而年轻时多配股、临近退休多配债，能把最致命的波动挪到有足够时间恢复的早年期。回测显示，临近退休降波动能显著降低\"退休即亏\"的概率。对不上基金的个人，可直接用\"年龄法则\"：权益比例 ≈ 100（或 110）减年龄，55 岁约 45%–55% 权益，65 岁降到 35%–45%。", "source": "中国证监会 (2018). 养老目标证券投资基金指引(试行)（证监会公告〔2018〕2号，第四条：目标日期下滑曲线强制降权益）. <https://big5.www.gov.cn/gate/big5/www.gov.cn/gongbao/content/2018/content_5303451.htm>；Bengen, W. P. (1994). Determining Withdrawal Rates Using Historical Data（组合随年龄调股债、降风险）. <https://www.web.stanford.edu/~wfsharpe/retecon/4percent.pdf>", "note": "局限性：过早上调债比例会牺牲复利；\"100−年龄\"只是粗略起点。交叉参考：第 4、10 条。"}, {"chapter": 13, "num": 12, "id": "13-12", "title": "给父母和自己先配医疗险，别先理财", "grade": "C", "tags": {"钱": "少", "时间": "少", "毅力": "些", "收益": "中", "口径": "金钱", "影响": "家庭"}, "impact": "家庭", "cost_money": "少", "cost_time": "少", "cost_will": "些", "benefit": "中", "scope": "金钱", "three_zero": false, "cost": "一年几千到上万的保费。", "plain": "父母一场病可能把你的养老本金掏空。先把医疗险这道防火墙立起来，剩下再谈增值。顺序错了，增值全是纸上富贵。", "gain": "一场大病自费部分常瞬间吞掉多年积蓄：基本医保有起付线、封顶线与自付比例，靶向药、质子重离子、ICU 等大量在目录外。长期护理更是养老最大不确定账单——我国失能半失能老人已约 4500 万，机构/居家护理月费数千元，而社保覆盖有限。国家长期护理保险（第六险）试点覆盖 1.8 亿人、累计 235 万失能老人享受待遇、基金支付约占护理费用 70%，但仍未全国定型。对家庭而言，先用百万医疗险/惠民保/防癌险把\"因病致贫\"尾部风险拦住，再考虑养老增值，顺序绝不能反：保障没做足前，任何\"复利增值\"都可能在一次住院账单前归零。", "source": "中国青年网 (2024-10). 长护险试点八年成效显著（覆盖1.8亿、235万享受待遇、支付约70%）. <https://news.youth.cn/hotnews_41880/202410/t20241028_15609485.htm>；人民网 (2016-11). 建立长期护理保险迫在眉睫（基金支付水平总体约70%、月自付由2100降至600）. <https://health.people.com.cn/n1/2016/1127/c408579-28899778.html>", "note": "局限性：健康险有健康告知与等待期，年长后难买；定级 C 因属风险原则而非统计。交叉参考：第 7 条。"}, {"chapter": 14, "num": 1, "id": "14-1", "title": "保险姓保：先保人，再保钱", "grade": "A", "tags": {"钱": "0", "时间": "少", "毅力": "否", "收益": "中", "口径": "金钱", "影响": "家庭"}, "impact": "家庭", "cost_money": "0", "cost_time": "少", "cost_will": "否", "benefit": "中", "scope": "金钱", "three_zero": false, "cost": "零成本，只是一项观念转变，不花钱。", "plain": "保险是盾不是矛。先想\"什么风险我扛不住\"，扛不住的（重病、意外、早逝）才用保险转出去；别本末倒置买成储蓄理财。", "gain": "保险的核心功能是\"转移你扛不住的尾部风险\"，而不是投资增值。监管自2014年\"新国十条\"起反复强调\"保险姓保\"——保险被明确定位为现代经济的重要产业和风险管理的基本手段（国发〔2014〕29号），在经济补偿、资金融通、社会管理三大功能中，普通家庭最该用的是第一项\"经济补偿\"。正确顺序是：先把重疾、意外、定寿等保障型预算做足，剩余的钱才拿去投指数基金、存款等真正生息的资产；若反用理财型保单挤占保障预算，等于用高溢价买了一份\"低保障+低收益\"的组合，两头不讨好。一个30岁健康男性，千元级年保费就能撬动百万级定寿杠杆，而同样预算买返还型，保额可能缩水一半以上。先保人、再保钱，顺序错了保障就出现缺口。", "source": "国务院 (2014). 关于加快发展现代保险服务业的若干意见（国发〔2014〕29号）（\"保险是现代经济的重要产业和风险管理的基本手段\"）. <https://www.gov.cn/zhengce/content/2014-08/13/content_8977.htm>; 国家金融监督管理总局 (2024). 关于健全人身保险产品定价机制的通知（金发〔2024〕18号）（第八条：不得将浮动收益误导为保证收益）. <https://www.nfra.gov.cn/chinese/OFFICE/PDF/1175200.pdf>", "note": "本条为总纲，证据等级定A依据的是国务院顶层设计与监管文件导向；具体产品对比见条 3、条 5。"}, {"chapter": 14, "num": 2, "id": "14-2", "title": "保障优先级：医疗＞意外＞重疾＞定寿＞年金", "grade": "C", "tags": {"钱": "少", "时间": "少", "毅力": "些", "收益": "中", "口径": "金钱", "影响": "家庭"}, "impact": "家庭", "cost_money": "少", "cost_time": "少", "cost_will": "些", "benefit": "中", "scope": "金钱", "three_zero": false, "cost": "不算额外成本，只是按这个顺序排预算。", "plain": "百万医疗一年几百块能顶几百万，比先买年金实在得多。先堵\"会让你一夜返贫\"的风险，再想增值。", "gain": "家庭保障应按\"发生频率×财务破坏力\"排序。第一层是百万医疗险+意外险：百万医疗年保费通常仅几百元（30岁左右约300–600元/年）即可获得数百万住院医疗报销额度，意外险年保费百元级保额可达百万，杠杆极高、几乎人人买得起，优先把\"高频小额+低频大额\"的医疗费与意外伤残兜底。第二层是重疾险：确诊约定病种一次性给付，补停工收入与康复费，30岁女性50万保额消费型年保费约数千元。第三层是定期寿险，专保家庭支柱早逝风险（见条 3）。最后才是年金/储蓄险——它不防风险只做现金流规划，且预定利率已降至普通型2.5%、分红型2.0%（金发〔2024〕18号），收益有限。顺序反了，钱花在刀刃外，真遇大病或意外反而保障缺口巨大。", "source": "国家金融监督管理总局 (2024). 关于健全人身保险产品定价机制的通知（金发〔2024〕18号）（第一条、第二条：普通型/分红型预定利率上限）. <https://www.nfra.gov.cn/chinese/OFFICE/PDF/1175200.pdf>; 中国银保监会办公厅 (2020). 关于使用重大疾病保险的疾病定义有关事项的通知（银保监办发〔2020〕90号）（保障病种框架）. <https://www.nfra.gov.cn/cn/view/pages/ItemDetail.html?docId=940130>", "note": "单身或无负债者优先级可微调（如定寿需求低）；本排序面向有房贷、有抚养责任的典型家庭。交叉参见条 3、条 4。"}, {"chapter": 14, "num": 3, "id": "14-3", "title": "定期寿险是杠杆最高的「爱的保险」", "grade": "B", "tags": {"钱": "少", "时间": "少", "毅力": "些", "收益": "中", "口径": "金钱", "影响": "家庭"}, "impact": "家庭", "cost_money": "少", "cost_time": "少", "cost_will": "些", "benefit": "中", "scope": "金钱", "three_zero": false, "cost": "年保费低（30岁健康男性，百万保额年缴常仅千元量级）。", "plain": "定寿是\"用最少的钱，买最重的责任兜底\"。年轻、负债多、家里靠你养——第一张该买的保单。别买成又贵又杂的返还型。", "gain": "定寿只在\"保障期内身故/全残\"赔付，因为去掉了储蓄与生存返还，纯风险保费极低：以30岁男性、保至60岁、100万保额为例，消费型定寿年保费常仅千元出头，杠杆可达数百倍，是杠杆率最高的人身险。它解决的是\"责任最重年纪（房贷+育儿+赡养老人）一旦顶梁柱倒下，家庭现金流断裂\"的极端风险——一笔赔付替你继续履行供养义务，防止房产被法拍、子女教育中断。务必指定受益人：依《保险法》第三十九条、第四十二条，未指定受益人的身故保险金将作为遗产按继承法分配，可能引发继承纠纷与债务清偿；指定配偶/子女为受益人则直接给付、债务隔离更清晰。投保人为与其有劳动关系的劳动者投保时，不得指定被保险人及其近亲属以外的人为受益人。", "source": "国家金融监督管理总局 (2015). 中华人民共和国保险法（2015年修正）（第三十九条、第四十条、第四十二条：受益人指定与未指定的法律后果）. <https://www.nfra.gov.cn/chinese/docfile/2025/ca8d8237bdf746e9a3bff26a3bf2af39.pdf>; 国家金融监督管理总局 (2024). 关于健全人身保险产品定价机制的通知（金发〔2024〕18号）（预定利率影响保费）. <https://www.nfra.gov.cn/chinese/OFFICE/PDF/1175200.pdf>", "note": "定寿对比返还型/终身寿的取舍见条 5、条 7；受益人规则同样适用于重疾、意外等含身故责任的保单。"}, {"chapter": 14, "num": 4, "id": "14-4", "title": "重疾险是「收入补偿」，医疗险是「报销」", "grade": "A", "tags": {"钱": "少", "时间": "少", "毅力": "些", "收益": "中", "口径": "金钱", "影响": "自己"}, "impact": "自己", "cost_money": "少", "cost_time": "少", "cost_will": "些", "benefit": "中", "scope": "金钱", "three_zero": false, "cost": "理解两者分工，分别配置。", "plain": "别以为有医疗险就够。得场大病可能一两年不能工作，房贷娃还得还——重疾险那笔钱就是给你续命的现金流。", "gain": "两者功能完全不同：医疗险凭发票报销治疗费（住院/手术/药品），是\"花多少报多少\"的费用补偿，且多为一年期、费率随年龄上涨、不保证续保；重疾险是\"确诊约定病种即一次性给付约定保额\"，钱怎么花你说了算——用来补停工收入、付康复费、养家，本质是收入损失补偿，它不报销。2020年重疾定义新规（银保监办发〔2020〕90号，2021年2月1日起全面施行）将核心病种扩展为28种重度+3种轻度疾病，并明确恶性肿瘤—轻度等轻症赔付比例上限30%，甲状腺癌按TNM分期分级赔付（I期按轻症）。这意味着买重疾险要关注\"是否含轻症、轻症赔多少、重疾定义是否按2020版\"。百万医疗解决\"治病的钱\"，重疾险解决\"养病期间活下去的钱\"，互补而非替代；预算有限先上医疗险，再加重疾。", "source": "中国银保监会办公厅 (2020). 关于使用重大疾病保险的疾病定义有关事项的通知（银保监办发〔2020〕90号）（第二条：2021年2月1日起停售旧定义产品；轻症赔付比例上限30%）. <https://www.nfra.gov.cn/cn/view/pages/ItemDetail.html?docId=940130>; 国家金融监督管理总局 (2015). 中华人民共和国保险法（2015年修正）（相关健康险合同框架）. <https://www.nfra.gov.cn/chinese/docfile/2025/ca8d8237bdf746e9a3bff26a3bf2af39.pdf>", "note": "重疾定义新规适用成年阶段重疾产品；轻症赔付比例上限仅针对规范定义的3种轻症，保险公司可自定其他轻症额度。交叉见条 2 优先级。"}, {"chapter": 14, "num": 5, "id": "14-5", "title": "理财型保险的真实回报，多数跑不赢通胀", "grade": "A", "tags": {"钱": "少", "时间": "少", "毅力": "些", "收益": "中", "口径": "金钱", "影响": "自己"}, "impact": "自己", "cost_money": "少", "cost_time": "少", "cost_will": "些", "benefit": "中", "scope": "金钱", "three_zero": false, "cost": "调整\"保费=投资\"的预期。", "plain": "业务员演示的\"复利4%\"多半是假设。真按合同现金价值算，长期IRR往往2–3个点，还锁死流动性。要增值去投指数基金，要确定的保底才考虑它。", "gain": "分红、万能、年金类保单的合同利益分\"保证\"与\"不保证\"两部分。监管已连续下调预定利率以控利差损：2023年窗口指导将普通型长期险预定利率上限从3.5%降至3.0%，2024年《关于健全人身保险产品定价机制的通知》（金发〔2024〕18号）进一步降至普通型2.5%、分红型2.0%、万能型最低保证1.5%（分别自2024年9月1日、10月1日起施行）。这意味着新产品保证收益天花板仅2.5%，按\"保证利益\"倒算IRR长期多在2%–3%区间，扣减近年实际通胀后真实购买力增长有限；而不保证的分红/万能演示利率只是假设，不代表实际。更关键的是早期现金价值极低，前几年退保本金都拿不回，流动性被长期锁死。它的正确定位是\"确定但低收益\"的资产配置底仓，不是高收益投资；真要增值，指数基金长期预期回报更高且流动性好。", "source": "国家金融监督管理总局 (2024). 关于健全人身保险产品定价机制的通知（金发〔2024〕18号）（第一条普通型2.5%、第二条分红2.0%/万能1.5%；第八条不得误导浮动收益为保证收益）. <https://www.nfra.gov.cn/chinese/OFFICE/PDF/1175200.pdf>; 新华网 (2024). 金融监管总局发文明确：9月起下调保险产品预定利率上限. <http://www.xinhuanet.com/money/20240820/b053d7c5110b4d44a3d88cd3a3b6c762/c.html>", "note": "IRR随产品、持有期、缴费方式差异大；预定利率≠客户实际收益率（还需扣除费用）。定级A依据为利率上限的明文规定，具体产品回报仍须看合同现金价值表。"}, {"chapter": 14, "num": 6, "id": "14-6", "title": "香港保险的三重坑：外汇、汇率、诉讼", "grade": "C", "tags": {"钱": "少", "时间": "中", "毅力": "多", "收益": "中", "口径": "金钱", "影响": "自己"}, "impact": "自己", "cost_money": "少", "cost_time": "中", "cost_will": "多", "benefit": "中", "scope": "金钱", "three_zero": false, "cost": "跨境投保的隐性成本与持续管理精力。", "plain": "香港保单演示收益好看，但钱进出不自由、汇率会反噬、打官司要跑香港。除非你本来就有美元配置需求，否则别为那点演示利差跨境折腾。", "gain": "香港保单常以美元/港元计价、演示IRR略高于内地，但三重隐性风险被低估：①资金跨境——续期保费与理赔金涉及外汇，受个人外汇额度与跨境资金合规约束，大额理赔金汇回手续繁、还可能面临外汇申报；②汇率——人民币升值时，美元保单折算回本币收益被吃掉，近年人民币汇率波动已让不少人\"赚了演示亏了汇兑\"；③管辖——保单受香港法律管辖，真出纠纷须在香港诉讼或仲裁，律师费、差旅、语言门槛极高，且内地法院对香港保单执行存在不确定性。此外香港重疾/医疗险的\"最高诚信\"健康告知要求更严，理赔尺度与内地不同。适合已有真实外币资产、需全球配置的人群；为\"高演示利差\"专程跨境投保，性价比与安全性都被高估。", "source": "国家金融监督管理总局 (2023). 保险销售行为管理办法（2023年第2号）（第二十一条适当性销售；第二十五条须提示保单利益不确定性）. <https://www.gov.cn/gongbao/2023/issue_10826/202311/content_6915815.html>; 国家金融监督管理总局 (2024). 关于健全人身保险产品定价机制的通知（金发〔2024〕18号）（第八条：不得将浮动收益误导为保证收益，适用于分红/万能演示）. <https://www.nfra.gov.cn/chinese/OFFICE/PDF/1175200.pdf>", "note": "外汇额度依据《个人外汇管理办法》（人民银行令〔2006〕第3号）等规定，具体以内地外汇管理部门最新要求为准；汇率与跨境管辖属实务常识，未逐条链接以避免引用失效URL。"}, {"chapter": 14, "num": 7, "id": "14-7", "title": "别把保险当投资，分开算账", "grade": "B", "tags": {"钱": "0", "时间": "少", "毅力": "否", "收益": "中", "口径": "金钱", "影响": "自己"}, "impact": "自己", "cost_money": "0", "cost_time": "少", "cost_will": "否", "benefit": "中", "scope": "金钱", "three_zero": false, "cost": "零成本，只是割裂\"保障\"与\"收益\"的思维。", "plain": "\"没出事还能返钱\"的保单，本质是你多交的钱被拿去投资再分你一点，保障还更薄。分开买，两边都更便宜。", "gain": "返还型、两全型、分红型保单的\"返本/分红\"，本质是投保人多交的保费被保险公司拿去投资，未来把一部分收益返还——你为\"储蓄\"部分额外支付了费用，导致同等保费下纯保障保额更低。监管将普通型、分红型、万能型产品预定利率上限分别压到2.5%、2.0%、1.5%（金发〔2024〕18号），意味着\"返\"的部分年化回报天花板很低，远不及你拿同等多交的钱去买指数基金或存款的可能回报，还要牺牲流动性。正确做法：保障归保障（买便宜的纯消费型重疾、医疗、定寿），投资归投资（指数基金、存款、国债），各自买最划算的。同一个人，把\"消费型+指数基金\"组合与\"返还型保单\"对比，长期前者保障更厚、资产更灵活、预期收益更高。", "source": "国家金融监督管理总局 (2024). 关于健全人身保险产品定价机制的通知（金发〔2024〕18号）（第一条、第二条预定利率上限）. <https://www.nfra.gov.cn/chinese/OFFICE/PDF/1175200.pdf>; 国家金融监督管理总局 (2023). 保险销售行为管理办法（2023年第2号）（第二十二条：新型产品须提示保单利益不确定性）. <https://www.gov.cn/gongbao/2023/issue_10826/202311/content_6915815.html>", "note": "年金/增额寿作为\"确定但低收益\"的传承或养老底仓并非完全不可取，关键是不应把它当高收益投资、更不应挤占保障预算。交叉见条 5、条 12。"}, {"chapter": 14, "num": 8, "id": "14-8", "title": "健康告知如实填，否则白买", "grade": "A", "tags": {"钱": "0", "时间": "少", "毅力": "些", "收益": "中", "口径": "金钱", "影响": "自己"}, "impact": "自己", "cost_money": "0", "cost_time": "少", "cost_will": "些", "benefit": "中", "scope": "金钱", "three_zero": false, "cost": "零成本，投保时多花十分钟核对病史。", "plain": "投保时瞒病史，省了十分钟，赔时丢全部。该填的填，别信业务员\"不用告\"的嘴。两年后也不绝对保险。", "gain": "保险法第十六条是理赔的\"生死线\"：订立合同时，保险公司就有关情况提出询问的，投保人应当如实告知；故意或重大过失未告知、足以影响承保或费率的，保险公司有权解除合同，对合同解除前发生的保险事故不承担赔偿责任，故意者还不退还保费。所谓\"两年不可抗辩\"（合同成立超二年保险人不得解除合同）并非万能挡箭牌——若属故意隐瞒重大病史，且事故与未告知事项相关，仍可能拒赔；司法解释也明确，投保人故意不实告知的，不可抗辩条款不保护骗保。此外免责条款（如既往症、等待期内出险、违法犯罪等）依保险法第十七条及《保险销售行为管理办法》第二十六条，保险人须在投保时作出足以引起注意的提示并明确说明，否则该条款不生效——但这不免除你的如实告知义务。投保时逐项核对病历、体检异常，宁多告勿少告。", "source": "国家金融监督管理总局 (2015). 中华人民共和国保险法（2015年修正）（第十六条如实告知与解除权；第十七条免责条款提示说明义务）. <https://www.nfra.gov.cn/chinese/docfile/2025/ca8d8237bdf746e9a3bf2af39.pdf>; 国家金融监督管理总局 (2023). 保险销售行为管理办法（2023年第2号）（第二十六条：免责条款须显著提示并明确说明；第二十七条：询问须有具体内容、不得用概括性条款）. <https://www.gov.cn/gongbao/2023/issue_10826/202311/content_6915815.html>", "note": "两年不可抗辩条款保护的是\"非恶意未告知\"，对故意骗保有例外；具体裁判尺度以《保险法司法解释（二）（三）》及个案为准。"}, {"chapter": 14, "num": 9, "id": "14-9", "title": "豁免条款是便宜的「双保险」", "grade": "C", "tags": {"钱": "少", "时间": "少", "毅力": "否", "收益": "中", "口径": "金钱", "影响": "家庭"}, "impact": "家庭", "cost_money": "少", "cost_time": "少", "cost_will": "否", "benefit": "中", "scope": "金钱", "three_zero": false, "cost": "附加豁免的少量保费。", "plain": "花一点钱，万一你倒下，家人的保单不用再缴费还继续有效。给娃或配偶投保时顺手勾上，性价比很高。", "gain": "保费豁免指投保人（或被保险人）发生约定事故（如重疾、中轻症、身故、全残）后，保险公司免收后续各期保费，合同保障继续有效。典型场景：父母给未成年子女投保重疾/教育金，若父母（投保人）不幸患重疾或身故，子女保单的剩余保费全免、孩子保障不受影响——等于用少量附加保费，给\"家庭收入中断\"上了一份隐形保险。夫妻互保（互相作为对方保单投保人并附加投保人豁免）可实现\"一方出事，双方保单都免缴\"。成本通常仅为年保费的百分之几到十几，杠杆可观。注意区分\"投保人豁免\"与\"被保险人豁免\"，并确认触发条件（是否含中症/轻症）、等待期与健告要求；给家人投保时优先勾选投保人豁免。", "source": "国家金融监督管理总局 (2015). 中华人民共和国保险法（2015年修正）（相关保险合同效力与投保人解除权框架）. <https://www.nfra.gov.cn/chinese/docfile/2025/ca8d8237bdf746e9a3bf2af39.pdf>; 国家金融监督管理总局 (2023). 保险销售行为管理办法（2023年第2号）（第十四条：保险产品说明须列明保障范围与免除/减轻责任条款）. <https://www.gov.cn/gongbao/2023/issue_10826/202311/content_6915815.html>", "note": "豁免是可选附加责任，非每款产品都含；触发条件与健告以具体条款为准，属产品层约定而非法律强制。"}, {"chapter": 14, "num": 10, "id": "14-10", "title": "先给家庭支柱买，不是先给孩子买", "grade": "C", "tags": {"钱": "0", "时间": "少", "毅力": "否", "收益": "中", "口径": "金钱", "影响": "家庭"}, "impact": "家庭", "cost_money": "0", "cost_time": "少", "cost_will": "否", "benefit": "中", "scope": "金钱", "three_zero": false, "cost": "零成本，纠正\"爱孩子先保孩子\"的直觉。", "plain": "很多家长第一张保单给孩子，错了。你才是娃的\"印钞机\"，你倒了全家断粮。先保赚钱的那个。", "gain": "家庭保障的顺序应以\"谁的收入中断对家庭财务冲击最大\"为准。孩子没有收入，失去孩子对家庭是情感损失而非现金流断裂；而赚钱的家长（家庭支柱）一旦早逝、重疾或失能，房贷、育儿、赡养立马失去来源，才是真正的财务崩盘点。因此预算有限时，应先给收入来源者配足定寿+重疾+医疗+意外（见条 2–4），再给依赖者（配偶、子女、父母）配置。给子女投保也应优先\"保疾病/意外\"的消费型少儿险，而非本末倒置先买教育金/年金。同时，给配偶或子女投保含身故责任险种时，记得指定受益人（保险法第三十九条），避免身故金落入遗产程序。爱孩子的最好方式，是先让自己\"倒下也有人接棒\"。", "source": "国家金融监督管理总局 (2015). 中华人民共和国保险法（2015年修正）（第三十九条：受益人由被保险人或投保人指定，投保人指定须经被保险人同意）. <https://www.nfra.gov.cn/chinese/docfile/2025/ca8d8237bdf746e9a3bf2af39.pdf>; 国家金融监督管理总局 (2023). 保险销售行为管理办法（2023年第2号）（第二十一条：了解投保人保险需求与保费承担能力、适当销售）. <https://www.gov.cn/gongbao/2023/issue_10826/202311/content_6915815.html>", "note": "若家庭已实现财务自由、无负债无抚养压力，优先级可下调定寿；本条针对典型\"上有老下有小\"家庭。"}, {"chapter": 14, "num": 11, "id": "14-11", "title": "别反复退保重买，摩擦吃掉本金", "grade": "B", "tags": {"钱": "少", "时间": "少", "毅力": "些", "收益": "中", "口径": "金钱", "影响": "自己"}, "impact": "自己", "cost_money": "少", "cost_time": "少", "cost_will": "些", "benefit": "中", "scope": "金钱", "three_zero": false, "cost": "少，克制\"以旧换新\"的冲动。", "plain": "听人忽悠\"旧的不如新的\"就退，前几年本金打水漂，重买还更贵。保险买定离手，别当短线炒。长期险有犹豫期，过了就只剩现金价值。", "gain": "长期人身险前期现金价值极低：保费中很大一块先扣了佣金与费用，早年退保拿回的现金价值常远低于已交保费，可能本金打水漂三四成以上；且年龄增长后重新投保，同保额年保费更高，健康变差还可能被加费或拒保——换产品的摩擦成本极高。监管给了\"后悔权\"：长期险通常设10–15天犹豫期（部分渠道/产品为15日），犹豫期内退保可拿回全部保费（仅扣不超10元工本费）；但犹豫期一过，退保只退现金价值。因此，除非原产品确有重大缺陷（如保障严重缺失、销售误导可维权），否则别听\"炒停售\"\"升级换代\"就退旧买新。买前用足犹豫期冷静核对条款，买定后长期持有、把保险当保障而非短线标的。", "source": "国家金融监督管理总局 (2023). 保险销售行为管理办法（2023年第2号）（第二十五条：订立合同时须提示犹豫期、现金价值、退保费用扣除）. <https://www.gov.cn/gongbao/2023/issue_10826/202311/content_6915815.html>; 国家金融监督管理总局 (2015). 中华人民共和国保险法（2015年修正）（第十五条投保人可解除合同；第三十七条效力中止与现金价值退还）. <https://www.nfra.gov.cn/chinese/docfile/2025/ca8d8237bdf746e9a3bf2af39.pdf>", "note": "犹豫期具体天数以产品条款与渠道规定为准（普遍10–15日）；现金价值曲线因产品差异极大，退保损失以合同现金价值表为准。"}, {"chapter": 14, "num": 12, "id": "14-12", "title": "警惕「保证收益」的保险话术", "grade": "A", "tags": {"钱": "0", "时间": "少", "毅力": "些", "收益": "中", "口径": "金钱", "影响": "自己"}, "impact": "自己", "cost_money": "0", "cost_time": "少", "cost_will": "些", "benefit": "中", "scope": "金钱", "three_zero": false, "cost": "零成本，对高演示收益保持戒心。", "plain": "业务员拿彩页上的高档演示当承诺，违法也坑你。翻合同看\"保证利益\"四个字，别的都是画饼。", "gain": "分红、万能、投连类产品的利益演示分\"保证\"与\"不保证\"两档（万能/分红还有低/中/高档演示），但只有\"保证利益\"或\"最低保证利率\"那栏是真保底的，中高档演示只是基于假设的投资情景，不代表未来实际。监管明文禁止混淆二者：金发〔2024〕18号第八条要求\"不得将浮动收益误导为保证收益\"，《保险销售行为管理办法》第二十二条要求销售新型产品时必须提示保单利益的不确定性。凡把演示利率当保证利率讲、把不保证分红说成确定回报、用\"复利滚存\"掩盖前期费用与退保损失的，都是红线话术。签约前只认合同\"保证利益/最低保证利率\"栏，并要求业务员书面说明演示假设；发现销售误导，可向金融监管总局消保渠道投诉维权。", "source": "国家金融监督管理总局 (2024). 关于健全人身保险产品定价机制的通知（金发〔2024〕18号）（第八条：不得将浮动收益误导为保证收益）. <https://www.nfra.gov.cn/chinese/OFFICE/PDF/1175200.pdf>; 国家金融监督管理总局 (2023). 保险销售行为管理办法（2023年第2号）（第二十二条：新型产品须提示保单利益不确定性；第十七条禁止虚假夸大宣传）. <https://www.gov.cn/gongbao/2023/issue_10826/202311/content_6915815.html>", "note": "预定利率≠客户实际收益率，演示利益≠保证利益；具体产品以合同条款与现金价值表为准。"}, {"chapter": 15, "num": 1, "id": "15-1", "title": "房贷利率是你买房的真实成本", "grade": "A", "tags": {"钱": "少", "时间": "少", "毅力": "些", "收益": "中", "口径": "金钱", "影响": "家庭"}, "impact": "家庭", "cost_money": "少", "cost_time": "少", "cost_will": "些", "benefit": "中", "scope": "金钱", "three_zero": false, "cost": "签约前花半天货比三家、谈\"加点\"的时间与口舌。", "plain": "你以为房价是成本，利息才是大头。100 万贷 30 年，利率差 1 个点总利息差二十多万。签约前砍加点，比砍房价容易也更值。", "gain": "房贷不是\"房价÷年限\"，而是\"本金 + 30 年利滚利\"。以 100 万、30 年等额本息为例：利率 3.5% 时月供约 4490 元、总利息约 61.7 万元；利率 4.5% 时月供约 5069 元、总利息约 82.5 万元——仅 1 个百分点之差，30 年总利息就差约 21 万元，相当于多付近两成。我国 2019 年 8 月改革 LPR 机制后，房贷利率 = 5 年期以上 LPR（2025-05-20 已降至 3.5%）+ 银行加点，加点由你资质、城市、银行政策决定，区间可达数十 BP。同一套房，A 行加 0、B 行加 30BP（0.3 个百分点），30 年利息又能差数万元。所以\"比价 + 谈加点\"是买房前性价比最高的一件事，且主要发生在签约前面签之后就只能等重定价日。", "source": "中国人民银行 (2019). 关于改革完善贷款市场报价利率（LPR）形成机制的公告（2019 年第 15 号）. <https://www.pbc.gov.cn/zhengcehuobisi/125207/125213/125440/3876551/3877436/index.html>; 中国人民银行授权全国银行间同业拆借中心 (2025). 贷款市场报价利率（LPR）公告（2025-05-20）. <https://www.gov.cn/lianbo/bumen/202505/content_7024431.htm>", "note": "利率随 LPR 重定价（通常每年 1 月 1 日或贷款发放日）波动，下行周期利好借款人；本条聚焦\"签约时加点\"这一可控变量，证据为机制性事实（A）。"}, {"chapter": 15, "num": 2, "id": "15-2", "title": "租售比低于房贷利率，租房可能更划算", "grade": "B", "tags": {"钱": "0", "时间": "少", "毅力": "否", "收益": "中", "口径": "金钱", "影响": "自己"}, "impact": "自己", "cost_money": "0", "cost_time": "少", "cost_will": "否", "benefit": "中", "scope": "金钱", "three_zero": false, "cost": "放下\"买房永远对\"的执念。", "plain": "买房不是天然正确。租售比 2%、贷款利率 4%，你租房把买房钱拿去投，只要年化超 2% 就不亏。别被\"没房不稳\"的情绪替你做决定。", "gain": "租售比 = 年租金 ÷ 房价。中指研究院监测显示，2024 年 12 月全国 50 个重点城市平均租售比仅 2.12%（即静态租金回报率 2.12%），其中厦门、深圳、北京不足 1.5%，广州、上海约 2%，仅重庆、长沙等逼近 3%、哈尔滨/长春/贵阳（3.23%）超过 3%。而同期首套房贷利率普遍在 3.0%–3.5% 区间。也就是说，在多数核心城市，\"买房持有成本\"（房贷利率）显著高于\"租房成本\"（租售比），差额资金若拿去投资且跑赢利差即为净赚。央行《2024 年第二季度中国货币政策执行报告》亦指出，静态租售比基础上租赁住房收益率有望提升至 3% 以上——换言之当前多数城市买房收租跑不赢贷款利息，需算清再决定。", "source": "中指研究院 (2025). 2024 年 12 月 50 个重点城市住宅租金房价比为 2.12%. <https://www.cih-index.com/news/2025-01-06/51934161.html>; 中国人民银行 (2024). 2024 年第二季度中国货币政策执行报告（\"支持住房租赁产业可持续发展\"专栏）. <https://www.cih-index.com/news/2024-12-19/51801279.html>", "note": "租售比城市与地段差异极大（同一城市核心区与远郊可差数倍），且未扣除空置、维修、税费；趋势判断（C 级成分）需结合本地最新数据复核，见第 11 条。"}, {"chapter": 15, "num": 3, "id": "15-3", "title": "提前还贷，省的是确定性利息", "grade": "B", "tags": {"钱": "少", "时间": "少", "毅力": "些", "收益": "中", "口径": "金钱", "影响": "家庭"}, "impact": "家庭", "cost_money": "少", "cost_time": "少", "cost_will": "些", "benefit": "中", "scope": "金钱", "three_zero": false, "cost": "一笔可动用的闲钱（且短期无更高确定性用途）。", "plain": "房贷利率 4–5%，你又找不到稳赚超这数的投资，提前还就是稳赚。别拿还贷的钱去赌基金，那叫用确定性换不确定性。", "gain": "判断要不要提前还，唯一硬指标是\"你的稳健投资年化收益\"能否稳定超过\"房贷利率\"。经济日报援引业内测算：2024 年存量房贷利率批量下调至 LPR-30BP（约 3.3%），而 2022 年前发放的房贷普遍在 5% 以上，利差达 1.7–2.5 个百分点，这正是当年大范围提前还贷的主因。当你没有稳定跑赢房贷利率的渠道时，提前还贷等于\"锁定\"了等于利率的无风险收益。另外，等额本息前期利息占比高，越早还省得越多；多数银行还款满 1 年后提前还款免违约金，1 年内可能收 1%–3% 不等（以合同为准），算清违约金与省息孰高再动手。注意 2024 年后多家银行出现预约排队、限额还款，需提前与贷款行确认。", "source": "新华社/经济日报 (2025). 提前还房贷划算吗. <https://www.news.cn/fortune/20250508/7f30da23b5534987a1a3ac66834c5d75/c.html>; 搜狗律师 (2024). 2024 提前还房贷划算吗（违约金与还款阶段）. <https://lvshi.sogou.com/article/detail/DSLTI43WMUL8.html>", "note": "\"稳健投资收益率\"指存款、国债、纯债等可预期收益，不含股票/基金的波动部分；若房贷为公积金低利率（见第 4 条）或享折扣，则通常不必急着还。"}, {"chapter": 15, "num": 4, "id": "15-4", "title": "公积金低息是福利，先用满", "grade": "A", "tags": {"钱": "0", "时间": "少", "毅力": "些", "收益": "中", "口径": "金钱", "影响": "家庭"}, "impact": "家庭", "cost_money": "0", "cost_time": "少", "cost_will": "些", "benefit": "中", "scope": "金钱", "three_zero": false, "cost": "办贷时多走一步手续、配合缴存与提取流程。", "plain": "公积金利率比商贷低一截，能贷满就贷满，别嫌麻烦用纯商贷。这是国家给的低息红包，不领白不领。", "gain": "中国人民银行 2025-05-07 通知，自 5 月 8 日起下调个人住房公积金贷款利率 0.25 个百分点：5 年以上首套由 2.85% 降至 2.6%，二套不低于 3.075%；5 年以下（含 5 年）首套 2.1%、二套不低于 2.525%。对比同期商贷首套约 3.0%–3.5%，100 万、30 年等额本息下，公积金首套（2.6%）月供约 4003 元、总利息约 44.1 万元，较商贷首套（约 3.05%）月供少约 240 元、总利息少约 8.6 万元；二套亦能省约 1.5 万元。能贷满额度就先贷满、不足部分用商贷做组合贷，闲置账户余额用于抵贷或年冲，比躺着贬值划算。", "source": "中国人民银行 (2025). 关于下调个人住房公积金贷款利率的通知（2025-05-07）. <https://big5.www.gov.cn/gate/big5/www.gov.cn/zhengce/zhengceku/202505/content_7022708.htm>; 六安市人民政府 (2025). 住房公积金利率下调，省更多！还更少！（100 万 30 年省息测算）. <https://www.luan.gov.cn/bmrl/10670333.html>", "note": "公积金贷款有缴存年限、额度上限与异地使用限制，各地政策不一；低利率本身意味着\"不急着提前还\"（见第 3 条）。"}, {"chapter": 15, "num": 5, "id": "15-5", "title": "房产流动性极差，急用钱卖不出", "grade": "B", "tags": {"钱": "0", "时间": "0", "毅力": "否", "收益": "中", "口径": "金钱", "影响": "家庭"}, "impact": "家庭", "cost_money": "0", "cost_time": "0", "cost_will": "否", "benefit": "中", "scope": "金钱", "three_zero": true, "cost": "留足非房产流动资产的觉悟与纪律。", "plain": "房子是\"纸面富贵\"，真急用钱它救不了你。应急金、能随时取的投资得另留一份，别全家身家锁在一套水泥里。", "gain": "房产从挂牌到成交常需数月，且受行情、学区政策、楼层朝向、邻里乃至挂牌量影响，远不如股票基金可当日变现。我爱我家 2024 年年度报告测算，国内存量房流通率（成交量 ÷ 存量总量）仅约 1%，而美国约 4%，相差四倍，说明我国住房\"想卖就能卖\"的程度本就偏低。2024 年房价与租金双双走弱、二手房挂牌量高企，买方市场下变现更慢、议价更被动。一旦急用钱，往往只能贱卖或借高息过桥，家庭应急金和流动性资产绝不能全绑在房上——经验上至少留 6–12 个月开支的随时可取资金。", "source": "我爱我家 (2025). 2024 年年度报告（国内存量房流通率约 1%，美国约 4%）. <https://www.cnfin.com/announ/detail/index.html?id=797557962274&code=000560&dannoun=lcdetail&announ=lc>", "note": "热门核心地段流动性相对好，但\"相对好\"仍是月级而非日级；流通率为机构测算（B 级），随周期波动。"}, {"chapter": 15, "num": 6, "id": "15-6", "title": "杠杆买房，下行时亏损被放大", "grade": "B", "tags": {"钱": "少", "时间": "少", "毅力": "些", "收益": "中", "口径": "金钱", "影响": "家庭"}, "impact": "家庭", "cost_money": "少", "cost_time": "少", "cost_will": "些", "benefit": "中", "scope": "金钱", "three_zero": false, "cost": "对\"加杠杆买房必赚\"的警惕。", "plain": "三成首付不是\"只亏三成\"。房价跌三成你本金就没了，再跌你倒欠银行。杠杆买房是双向放大镜，别只记着涨的时候。", "gain": "首付 30% 意味着你用 30 万撬动 100 万资产，杠杆约 3.3 倍。房价涨 10%（+10 万）你的本金回报率是 33%；但房价跌 30%（-30 万）你的 30 万本金直接归零，进入\"负资产\"；若此时被迫抛售，还需额外承担中介费、税费，亏损远超原始投入。2021 年后部分城市房价自高位回撤三成乃至更多（中指研究院监测重点城市房价持续调整），早期高杠杆接盘者即面临\"房子资不抵债、月供却不能停\"的困境。杠杆在下行周期把小波动变成灭顶之灾，下行市里低杠杆甚至全款才是护身符。", "source": "中指研究院 (2024). 2024 年中国住房租赁市场总结与展望（房价持续调整、租售比回升）. <https://www.cih-index.com/news/2024-12-19/51801279.html>; 央视网 (2024). 多项金融支持房地产政策落地（存量房贷与房价背景）. <https://news.cctv.com/2024/10/01/ARTIaj74omNQAv9tZJ9INpVk241001.shtml>", "note": "杠杆放大是数学必然（确定性强），但\"具体城市跌幅\"为历史区间（B 级），不构成对未来走势的预测。"}, {"chapter": 15, "num": 7, "id": "15-7", "title": "经营贷/消费贷违规流入楼市，是定时炸弹", "grade": "A", "tags": {"钱": "少", "时间": "中", "毅力": "中", "收益": "中", "口径": "金钱", "影响": "家庭"}, "impact": "家庭", "cost_money": "少", "cost_time": "中", "cost_will": "中", "benefit": "中", "scope": "金钱", "three_zero": false, "cost": "对\"低息过桥买房\"诱惑的克制。", "plain": "有人教你用经营贷低息替换房贷，听着省息，实为违规。银行一旦发现抽贷，你立马要还全款，普通人扛不住。别碰。", "gain": "经营贷、消费贷的合同用途明确限定于经营或消费，不得用于购房、结清房款或偿还按揭。银保监会、住建部、央行联合发文要求防范经营贷违规流入房地产，银行需加强借款人资质与贷款用途穿透审核。江苏银保监局明确提示\"转贷降息\"四类风险：一、违法违规——资金未按约定用途使用须承担违约责任，贷款可被提前收回并加收罚息，情节严重要追刑责；二、资金链断裂——经营贷期限多短于按揭，到期续贷利率/条件可变，无稳定还款来源即暴雷并损征信；三、高额中介费\"过桥\"成本可能高于原按揭；四、个人信息泄露。重庆银保监局亦提示违规用款面临提前还款、核减授信、纳入征信等惩戒。省下的一点利息，远抵不过抽贷时的灭顶风险。", "source": "中国银保监会办公厅、住房城乡建设部办公厅、中国人民银行办公厅 (2021). 关于防止经营用途贷款违规流入房地产领域的通知. <https://big5.nfra.gov.cn/cn/view/pages/ItemDetail.html?docId=973455>; 国家金融监督管理总局江苏监管局 (2023). 消费者风险提示：\"转贷降息\"套路深，隐藏风险需警惕. <https://www.nfra.gov.cn/branch/jiangsu/view/pages/common/ItemDetail.html?docId=1099698&itemId=1239>; 国家金融监督管理总局重庆监管局 (2021). 关于经营用途贷款流入房地产领域存在风险的提示（2021 年第 9 号）. <https://big5.nfra.gov.cn/branch/chongqing/view/pages/common/ItemDetail.html?docId=1009522&itemId=1985>", "note": "监管规定为硬约束（A）；个别中介宣称\"可做\"属欺诈，风险完全由借款人承担。"}, {"chapter": 15, "num": 8, "id": "15-8", "title": "月供别超家庭收入三成，留缓冲", "grade": "B", "tags": {"钱": "0", "时间": "0", "毅力": "否", "收益": "中", "口径": "金钱", "影响": "家庭"}, "impact": "家庭", "cost_money": "0", "cost_time": "0", "cost_will": "否", "benefit": "中", "scope": "金钱", "three_zero": true, "cost": "克制\"顶格贷款买大房\"的欲望。", "plain": "银行愿意贷你月供 50% 甚至更高，但那是它的风险不是你的。月供压到三成内，失业半年也不慌。别把杠杆用到极限。", "gain": "月供占收入比过高，一旦失业、降薪或生病就断供，轻则逾期上征信，重则被法拍、本金亏损（见第 6 条）。监管层面，江西银保监局《关于进一步加强个人贷款风险管理的通知》要求按揭业务\"严格首付款来源审查\"\"确保偿债收入比控制在合理区间\"，说明银行自身也盯住收入覆盖能力。国际金融界常用的\"28/36 规则\"建议：住房月供不超过税前收入 28%、含全部债务月供不超过 36%。结合我国收入波动与社保覆盖，经验上把房贷月供压在家庭总收入三分之一以内、保留三分之二覆盖生活与储蓄，抗冲击能力强得多。注意\"家庭总收入\"应扣除个税、社保与必要刚性支出后口径。", "source": "国家金融监督管理总局江西监管局. 关于进一步加强个人贷款风险管理的通知（偿债收入比管控、首付款来源审查）. <https://www.nfra.gov.cn/branch/jiangxi/view/pages/common/ItemDetail.html?docId=943038&itemId=1513>", "note": "\"三成\"为经验法则（C 级成分），具体比例因城市收入弹性、职业稳定性而异；监管文件提供\"合理区间\"原则而非固定数值。"}, {"chapter": 15, "num": 9, "id": "15-9", "title": "二手房交易税费摩擦高，别忽视", "grade": "A", "tags": {"钱": "少", "时间": "少", "毅力": "些", "收益": "中", "口径": "金钱", "影响": "自己"}, "impact": "自己", "cost_money": "少", "cost_time": "少", "cost_will": "些", "benefit": "中", "scope": "金钱", "three_zero": false, "cost": "买卖时把税费与中介费算进进项。", "plain": "房子\"买进价卖出价\"中间隔着税和中介，短期炒房这点摩擦就吞了你利润。真要换手，持有久一点把摩擦摊薄。", "gain": "2024 年 11 月三部门公告（2024 年第 16 号）大幅优化交易税负：契税方面，家庭唯一及第二套住房面积 ≤140㎡统一按 1%、>140㎡分别 1.5%/2%，北京、上海、广州、深圳二套亦适用，举例 500 万二套房原契税 3%（15 万）新政后 1%（5 万）省 10 万；增值税方面，个人销售已购 2 年以上（含 2 年）住房一律免征（原北上广深非普宅差额征收取消）；个人所得税\"满五唯一\"（购房满 5 年且家庭唯一住房）免征，否则按差额 20% 或核定 1% 征收；再加中介费通常 1%–3%、过户杂费。即便新政后，一套不满二、非满五唯一的二手房交易摩擦仍可达房款 5%–10%，短期买卖基本被摩擦吃光，持有越久、成本摊薄越划算。", "source": "财政部、税务总局、住房城乡建设部 (2024). 关于促进房地产市场平稳健康发展有关税收政策的公告（2024 年第 16 号）. <https://www.gov.cn/zhengce/202411/content_6986876.htm>; 上海市税务局 (2026). 上海个人居住用房买卖税费全梳理（增值税/契税/个税规则与公告号）. <https://www.shanghai.gov.cn/nw17239/20260423/db84274a588149309032977a3df7f916.html>", "note": "契税 1%–3%、增值税满 2 年免征、个税满五唯一免征为现行规则（A）；具体税率与免征认定以交易时当地税务口径为准。"}, {"chapter": 15, "num": 10, "id": "15-10", "title": "学区房溢价有政策风险", "grade": "A", "tags": {"钱": "少", "时间": "少", "毅力": "些", "收益": "中", "口径": "金钱", "影响": "家庭"}, "impact": "家庭", "cost_money": "少", "cost_time": "少", "cost_will": "些", "benefit": "中", "scope": "金钱", "three_zero": false, "cost": "为\"学位\"多付的溢价。", "plain": "花几百万溢价买学区房，赌的是政策不变。可政策正往\"多校划片\"走，学位一旦不锁定，溢价说没就没。别为不确定性付天价。", "gain": "教育部 2014 年即明确\"多校划片\"——热点学校分散划入多片、报名超计划时随机派位，2022 年《关于进一步做好普通中小学招生入学工作的通知》（教基厅〔2022〕1 号）要求教育资源不均衡地区\"积极稳妥推进多校划片\"，并全面推进\"公民同招\"、均衡编班。这意味着\"一套房锁定名校\"的确定性被持续削弱：片区可调整、入学靠派位，高溢价学区房可能因政策变动一夜贬值。用远超同地段非学区房的溢价去赌学位，本质是押注政策不扩容、不重划、不随机，而政策方向恰相反。购房决策应把\"学位溢价归零\"作为压力测试情景。", "source": "教育部 (2014). 关于进一步做好小学升入初中免试就近入学工作的实施意见（教基一〔2014〕1 号，多校划片）. <https://big5.www.gov.cn/gate/big5/www.gov.cn/gongbao/content/2014/content_2679352.htm>; 教育部办公厅 (2022). 关于进一步做好普通中小学招生入学工作的通知（教基厅〔2022〕1 号）. <https://www.moe.gov.cn/srcsite/A06/s3321/202204/t20220401_612689.html?xxgkhide=1>", "note": "政策落地节奏城市不一，\"溢价归零\"为情景假设（C 级成分）；文件本身为现行有效规定（A）。"}, {"chapter": 15, "num": 11, "id": "15-11", "title": "房租收入要扣空置与维护，别算毛租", "grade": "B", "tags": {"钱": "少", "时间": "少", "毅力": "些", "收益": "中", "口径": "金钱", "影响": "自己"}, "impact": "自己", "cost_money": "少", "cost_time": "少", "cost_will": "些", "benefit": "中", "scope": "金钱", "three_zero": false, "cost": "记账时扣掉隐性成本。", "plain": "中介说\"租金回报率 3%\"，那是毛的。扣掉空着的两月、修水管、物业、税，净的可能 1% 多点，跟存银行差不多还操心。", "gain": "真实租金回报 =（年租金 − 空置损失 − 维修 − 物业费 − 管理费 − 税费）÷ 房价。中指研究院 2024 年 12 月全国 50 城平均租售比（毛口径）仅 2.12%，央行亦指出静态租售比基础上收益率有望提升至 3% 以上——注意这是\"毛租金/房价\"且需长期租金上涨才达 3%。实际持有中：空置期（平均招租/换租空窗常 1–2 个月，相当于年化 8%–17% 租金损失）、维修养护、物业费、租赁税费与折旧叠加后，净回报率往往较毛值再打数折，不少城市净回报仅 1% 出头，并不比存款或国债强，还要承担房东的时间与纠纷成本。算投资回报务必用\"净租售比\"。", "source": "中指研究院 (2025). 2024 年 12 月 50 个重点城市住宅租金房价比为 2.12%. <https://www.cih-index.com/news/2025-01-06/51934161.html>; 中国人民银行 (2024). 2024 年第二季度中国货币政策执行报告（租赁住房收益率专栏）. <https://www.cih-index.com/news/2024-12-19/51801279.html>", "note": "2.12% 为毛租售比（B 级机构数据）；\"净回报再打数折\"为基于空置/维护的经验推算（C 级），具体视房源与城市。"}, {"chapter": 15, "num": 12, "id": "15-12", "title": "多头负债、以贷养贷，是破产前兆", "grade": "A", "tags": {"钱": "0", "时间": "少", "毅力": "些", "收益": "中", "口径": "金钱", "影响": "家庭"}, "impact": "家庭", "cost_money": "0", "cost_time": "少", "cost_will": "些", "benefit": "中", "scope": "金钱", "three_zero": false, "cost": "直面债务、停借的自律。", "plain": "以贷养贷不是解法，是坠崖前的加速。一旦要靠借新还旧过日子，马上停手盘点债务，别再借。这是家庭财务的红色警报。", "gain": "信用卡、网贷、消费贷互相填窟窿，利息复利滚雪球，最终收入覆盖不了最低还款。国家金融监督管理总局北京监管局风险提示明确指出\"不要选择'以贷养贷''多头借贷'，避免因无力偿还而导致债台高筑\"；银保监会消保局亦提示\"过度借贷往往导致资金断流，最终会使消费者个人甚至家庭陷入困境\"，严禁以贷养贷、多头借贷。一旦出现\"借新还旧\"，必须立刻止损：列出所有债务（本金、利率、到期日）、砍非必要支出、与银行协商展期或重组，而非再借一笔。这是家庭资产负债表恶化的红色警报，越早截断损失越小。", "source": "国家金融监督管理总局北京监管局. 风险提示：谨记\"五要\"\"五不要\" 个人贷款助力美好生活（不以贷养贷、不多头借贷）. <https://www.nfra.gov.cn/branch/beijing/view/pages/common/ItemDetail.html?docId=1070910&itemId=1850>; 国家金融监督管理总局. 消费者提示：警惕过度负债风险，合理合规使用个人消费信用贷款. <https://www.nfra.gov.cn/cn/view/pages/ItemDetail.html?docId=1033150>", "note": "监管提示为硬性要求（A）；\"复利滚雪球导致崩盘\"为机制性常识，出现即应触发止损动作。"}, {"chapter": 16, "num": 1, "id": "16-1", "title": "免费的建议，值你付的价", "grade": "A", "tags": {"钱": "0", "时间": "少", "毅力": "否", "收益": "中", "口径": "金钱", "影响": "自己"}, "impact
