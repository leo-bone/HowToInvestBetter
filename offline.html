恰是决定长期回报的主要变量（见第 4 条）。实证上，2000–2023 年约 60% 美股/20% 国际股/20% 美债的三基金组合年化约 7%–8%，与多数折腾的主动组合相当甚至更优，且波动更低、税费更高效。Bogle 的赌注（第 1 条）正是这一哲学的极端版。", "source": "Bogleheads (2024). Three-fund portfolio（VTSAX/VTIAX/VBTLX 等核心基金与样例配置）. <https://www.bogleheads.org/w/index.php?oldid=89560&title=Three-fund_portfolio>; Bogleheads. Bogleheads investment philosophy（被动、低成本、长期）. <https://www.bogleheads.org/wiki/Bogleheads_investment_philosophy>", "note": "比例按风险承受定（如\"100−年龄\"配债）；需每年再平衡一次。交叉参考：第 1、4、10 条。"}, {"chapter": 4, "num": 10, "id": "4-10", "title": "再平衡用\"阈值法\"而非\"日历法\"", "grade": "B", "tags": {"钱": "0", "时间": "少", "毅力": "些", "收益": "中", "口径": "金钱", "影响": "自己"}, "impact": "自己", "cost_money": "0", "cost_time": "少", "cost_will": "些", "benefit": "中", "scope": "金钱", "three_zero": false, "cost": "设定偏离阈值（如某类资产偏离目标 ±5%–10% 才调）。", "plain": "别每月机械调仓。设\"股比偏离目标 10% 才动\"，平时别理它。这样既控风险，又少交摩擦。", "gain": "Vanguard 研究（2024）表明，门槛式（threshold）再平衡相对月频/季频日历法，在 60/40 组合上因降低交易成本而带来更高年化收益：积累期相对月频年增益 15–22 个基点、相对季频 5–8 个基点；同时偏离度更低、风险更可控。其机理是\"高抛低吸\"天然发生且只在突破阈值时交易，避免频繁调仓的税费损耗。Vanguard 另建议\"季度检查＋仅破阈才交易\"的混合法，兼顾纪律与低成本。对多数人，±5% 阈值或年度检查已足够。", "source": "Vanguard (2024). The Rebalancing Edge: Optimizing Target-Date Fund Rebalancing through Threshold-Based Strategies（门槛法 vs 月频增益 15–22 bps）. <https://corporate.vanguard.com/content/dam/corp/research/pdf/the_rebalancing_edge_optimizing_target_date_fund_rebalancing_through_threshold_based_strategies.pdf>; Vanguard Australia. The right way to rebalance your investment portfolio（日历法 vs 阈值法）. <https://www.vanguard.com.au/personal/learn/smart-investing/portfolio-building/right-way-to-rebalance-your-investment-portfolio>", "note": "再平衡目的在控风险而非增厚收益；应税账户优先用分红/新增资金再平衡以避税。交叉参考：第 4、8 条。"}, {"chapter": 4, "num": 11, "id": "4-11", "title": "红利低波等因子有长期溢价，但别追热点因子", "grade": "B", "tags": {"钱": "少", "时间": "少", "毅力": "些", "收益": "中", "口径": "金钱", "影响": "自己"}, "impact": "自己", "cost_money": "少", "cost_time": "少", "cost_will": "些", "benefit": "中", "scope": "金钱", "three_zero": false, "cost": "理解因子的长期逻辑而非短期炒作。", "plain": "因子不是玄学，是\"长期多赚一点\"的来源。但别在因子火了才冲——追热门因子常买在高点。", "gain": "Fama & French（1993）三因子模型证明，价值、规模等因子长期提供超越市场 Beta 的溢价；后续研究加入动量、质量、低波等。AQR 等机构实证：红利、低波、价值因子在长周期（数十年、多国）年化跑赢大盘约 1%–3%，且彼此低相关，可改善风险调整后收益。但因子有\"风格低迷期\"（价值因子 2007–2020 长期落后），且追热点（因子火了才买）几乎必然买在高点——因子溢价是长期、分散、逆向的奖赏，不是短期主题炒作。可作为核心指数的补充，不宜重仓单一因子。", "source": "Fama, E. & French, K. (1993). Common Risk Factors in the Returns on Stocks and Bonds, Journal of Financial Economics 33(1):3–56. <https://doi.org/10.1016/0304-405X(93)90023-5>; AQR Capital Management. Factor Premiums 研究文献（价值/低波/质量长期溢价）. <https://www.aqr.com/>; 中证指数有限公司. 红利/低波等 Smart Beta 指数历史回测. <http://www.csindex.com.cn/>", "note": "因子溢价需长期（10 年+）持有才显著；单一因子有回撤风险，宜分散配置。交叉参考：第 1 条。"}, {"chapter": 4, "num": 12, "id": "4-12", "title": "投顾／智能投顾值不值，看费率是否低于它省的", "grade": "B", "tags": {"钱": "少", "时间": "少", "毅力": "些", "收益": "中", "口径": "金钱", "影响": "自己"}, "impact": "自己", "cost_money": "少", "cost_time": "少", "cost_will": "些", "benefit": "中", "scope": "金钱", "three_zero": false, "cost": "比较投顾费率与你自己瞎操作的成本。", "plain": "投顾最大的价值是\"管住你的手\"，不是\"选股更牛\"。能自己定投+少看盘的人，投顾多半是纯支出。", "gain": "投顾/智能投顾的核心增益是行为教练（behavioral coaching）而非选股。Vanguard《Putting a Value on Your Value: Quantifying Advisor's Alpha》(Kinniry et al., 2022) 估计，顾问经税费优化、再平衡纪律与行为辅导可为客户净增最高约 3%/年，其中行为辅导单独贡献约 0%–2%。DALBAR 数据反衬其价值：普通投资者因情绪化交易 20 年年化落后指数约 1 个百分点（8.7% vs 9.7%），若投顾能抑制这种\"手痒\"，省下的就是真金白银。但如果你已能做到定投＋季度看＋自动再平衡，投顾的边际增益趋近于 0，纯属多一笔 0.5%–1.5%/年的费用。结论：管不住手才值，管得住手就是支出。", "source": "Vanguard (2022). Putting a Value on Your Value: Quantifying Vanguard Advisor's Alpha（行为辅导贡献约 0%–2%/年，总增益最高约 3%）. <https://www.vanguardsouthamerica.com/content/dam/intl/americas/documents/latam/en/2022/08/mx-sa-2335954-putting-a-value-on-your-value-quantifying-vanguard-advisors-alpha.pdf>; DALBAR (2024). QAIB 2024（普通投资者落后指数约 1%/年）. <https://www.dalbar.com/?p=17875/>", "note": "智能投顾费率已降至约 0.25%，但自律者仍可能不需要；注意\"免费荐基\"常由销售佣金驱动。交叉参考：第 2、3、7 条。"}, {"chapter": 5, "num": 1, "id": "5-1", "title": "宽基指数 ETF（沪深300／中证500／标普500 等）", "grade": "A", "tags": {"钱": "少", "时间": "少", "毅力": "些", "收益": "中", "口径": "金钱", "影响": "自己"}, "impact": "自己", "cost_money": "少", "cost_time": "少", "cost_will": "些", "benefit": "中", "scope": "金钱", "three_zero": false, "cost": "费率 0.03%–0.5%/年 + 一次开户；ETF 交易佣金约万0.5–万3，免征印花税，几乎无其他摩擦成本。", "plain": "旗舰资产。不挑股、不择时，买覆盖全市场的低成本指数，按月投。它不让你暴富，但把你稳稳放在“长期赢家”一侧。", "gain": "长期看，覆盖全市场的低成本宽基是最省心的核心仓。美股标普500含股息自1928年以来年化约10.0%（几何平均，通胀后实际约6.9%），近97年无任一20年滚动区间为负（NYU Stern/Damodaran, 1928–2025）。A股沪深300全收益指数2005–2025年年化约9.9%，与同期ROE中枢12.6%趋同，2013.8–2023.7近十年年化8.78%（中证指数）。关键不在涨幅而在“确定性跑赢多数主动产品”：标普道琼斯 SPIVA 显示美国大盘主动基金20年跑输基准约92%、所有主动股基约94%，3年以内也有约65%跑输；巴菲特十年赌约（2008–2017）中低费率标普500指数基金累计125.8%（年化8.5%），完胜五只母基金组合平均36.3%（年化约3.1%）。", "source": "标普道琼斯指数 (2024). SPIVA U.S. Scorecard（20年期大盘主动基金跑输约92%）. <https://www.spglobal.com/spdji/en/spiva/article/spiva-australia/>；中证指数有限公司 (2023). 《指数化投资新观察｜突破3000亿，中国股市旗舰指数受投资者关注》（沪深300全收益2013.8–2023.7年化8.78%）. <https://www.csindex.com.cn/#/about/newsDetail?id=14867>；先锋集团 (2026). How index funds can help Americans build wealth（指数费0.09% vs 主动0.56%；1976年投1万美元至2026年约200万美元）. <https://corporate.vanguard.com/content/dam/corp/research/pdf/indexing_benefits.pdf>", "note": "长期胜率来自“零和博弈＋成本拖累＋持续性稀缺”三因素（Vanguard《The case for low-cost index-fund investing》）；但宽基仍承担全市场系统性波动，2008年标普500跌37%、A股牛熊更剧烈，需用定投与长期持有平滑，属核心仓而非“无风险”。"}, {"chapter": 5, "num": 2, "id": "5-2", "title": "国债／利率债（无风险基准）", "grade": "B", "tags": {"钱": "少", "时间": "少", "毅力": "否", "收益": "中", "口径": "金钱", "影响": "自己"}, "impact": "自己", "cost_money": "少", "cost_time": "少", "cost_will": "否", "benefit": "中", "scope": "金钱", "three_zero": false, "cost": "机会成本（放弃更高收益）；10年期国债收益率近年约1.5%–2.5%（2024–2026），持有至到期几乎无信用风险。", "plain": "国债收益是“无风险”的标尺。任何产品敢比它高一大截还说没风险，多出来的就是隐藏的风险溢价。", "gain": "国债与利率债是组合里的压舱石，本金安全、用于应急金与降波动。美国10年期国债1928–2024年名义年化约4.79%，但实际（通胀调整后）仅约1.8%，且2022年单年曾跌17.8%（SmartAsset 基于 NYU Stern）。中国方面，2005–2025年中债国债总指数年化约4.3%，同期万得全A约10.6%、房地产约8.3%、沪深300约9.9%（国信证券荀玉根）。它不提供暴富，但提供三件事：确定性票息、与股票在多数时期的低/负相关（危机时往往对冲）、以及给股债再平衡提供“弹药”。利率上行时债券价格下跌，久期越长波动越大，需用短久期或持有到期规避。", "source": "国信证券 荀玉根 (2026). 《股市合理回报率是多少？》（2005–2025中债国债总指数年化4.3%）. <https://finance.sina.cn/2026-06-29/detail-iniezsvf0351433.d.html>；SmartAsset (2025). Stock Index vs Bond Yields Year by Year（10年期美债1928–2024名义年化4.79%；2022跌17.8%）. <https://www.smartasset.com/investing/stock-index-vs-bond-yields-year-by-year>；InvestEdge360 (2026). US 10-Year Treasury Yield: 50-Year History Chart（2024年4.21%、2025年4.26%）. <https://investedge360.com/blog/us-10-year-treasury-yield-50-year-history-chart>", "note": "A股国债的久期风险被低利率环境掩盖；2022年全球债券“罕见同跌”提示股债负相关并非永远成立。它更适合作为“无风险基准”去丈量其他资产的风险溢价，而非收益主力。"}, {"chapter": 5, "num": 3, "id": "5-3", "title": "货币基金（应急金容器）", "grade": "C", "tags": {"钱": "0", "时间": "0", "毅力": "否", "收益": "中", "口径": "金钱", "影响": "自己／家庭"}, "impact": "自己／家庭", "cost_money": "0", "cost_time": "0", "cost_will": "否", "benefit": "中", "scope": "金钱", "three_zero": true, "cost": "几乎为零（T+0 灵活、免申购赎回费）；仅承担机会成本——钱放着不投股权/债权资产。", "plain": "应急金不图赚，图“随时能拿出来”。货币基金就是它的正确容器，别拿去炒股、别和存款混淆。", "gain": "年化约1.5%–2.5%且随时可取，用于覆盖3–6个月生活费。按《货币市场基金监督管理办法》（证监会令第120号，2015），货基仅投货币市场工具、平均剩余期限≤120天、高流动性资产比例有底线，安全性远高于银行理财；但条款第十八条明确“购买货基不等于存款”，管理人既不保盈利也不保最低收益。降息周期里7日年化常落在1.2%–2.0%（2024–2026），收益随市场利率下行而降，本质是“流动性溢价”而非“投资回报”。", "source": "中国证监会、中国人民银行 (2015). 《货币市场基金监督管理办法》（证监会令第120号，第九条平均剩余期限≤120天；第十八条不保本保收益）. <https://www.csrc.gov.cn/csrc/c106256/c1654015/1654015/files/52c60ebbeb5642e08f9f629bb8ed190e.pdf>；中国证券报 中证网 (2015). 《货币市场基金监督管理办法》解读（流动性与久期新规）. <https://www.cs.com.cn/tzjj/jjks/201512/t20151229_4873464.html>", "note": "2022年《现金管理类理财新规》使银行现金理财全面对标货基，两者收益趋同；货基适合“随时要用的钱”，不解决长期增值，长期持有可能跑输通胀。"}, {"chapter": 5, "num": 4, "id": "5-4", "title": "债基／固收+（波动低于股票）", "grade": "B", "tags": {"钱": "少", "时间": "少", "毅力": "些", "收益": "中", "口径": "金钱", "影响": "自己"}, "impact": "自己", "cost_money": "少", "cost_time": "少", "cost_will": "些", "benefit": "中", "scope": "金钱", "three_zero": false, "cost": "费率 0.3%–0.8%/年 + 信用／利率波动；含权益的“+ ”部分还会带来权益回撤。", "plain": "固收+不是“稳赚”。债基也会跌（利率上行、信用违约），但长期波动远低于股票，是组合里“睡得着”的那部分。", "gain": "中长期年化约3%–6%，回撤远小于股票，用于组合减震。拉长到百年级维度，美国10年期国债名义年化约4.79%、实际约1.8%（SmartAsset/NYU Stern），而加入权益的“固收+”通过股债负相关把波动率压低、把夏普抬高。中国中债国债总指数2005–2025年化约4.3%，债券型产品在此基础上叠加信用与权益增厚。Vanguard 的研究结论是：股债搭配（如60/40）能显著降低单一资产的最大回撤，且再平衡本身是一种“低买高卖”的纪律。但“+”的部分若含股票/可转债，波动会被低估。", "source": "国信证券 荀玉根 (2026). 《股市合理回报率是多少？》（2005–2025中债国债总指数年化4.3%）. <https://finance.sina.cn/2026-06-29/detail-iniezsvf0351433.d.html>；先锋集团 (2023). The case for low-cost index-fund investing（股债配置、分散化降低波动）. <https://www.vanguard.co.uk/professional/vanguard-365/investment-knowledge/portfolio-construction/the-case-for-indexing>；SmartAsset (2025). Stock Index vs Bond Yields Year by Year（美债长期回报与波动）. <https://www.smartasset.com/investing/stock-index-vs-bond-yields-year-by-year>", "note": "〔争议〕部分“固收+”含权益，波动与回撤被低估，需看清合同底层；把它当存款买是常见误判。2022年债熊时不少“固收+”回撤超5%，买前要看权益仓位上限。"}, {"chapter": 5, "num": 5, "id": "5-5", "title": "REITs（不动产信托）", "grade": "B", "tags": {"钱": "少", "时间": "少", "毅力": "些", "收益": "中", "口径": "金钱", "影响": "自己"}, "impact": "自己", "cost_money": "少", "cost_time": "少", "cost_will": "些", "benefit": "中", "scope": "金钱", "three_zero": false, "cost": "费率（管理费+托管费约0.5%–1%）+ 高波动（与地产周期、利率强相关）+ 折溢价与流动性。", "plain": "想配置房产又不想买整栋，REITs 是门票。但它不是债券，跌起来很凶，别当“高息存款”。", "gain": "美国 FTSE Nareit 全部权益 REITs 指数1972–2025年年化总回报约10.94%，40年年化约9.43%，长期跑赢标普500（同期约11.15%）；当前股息率约4.07%，远高于标普500的1.10%（Nareit 2025 Fact Sheet）。它提供股票之外的实物资产敞口，且与股债相关性较低，有通胀对冲属性。但波动不低：2022年随利率上行明显回撤。中国基础设施公募REITs 2021年6月21日首批9只上市，募资约314亿元，底层为收费公路、产业园、仓储物流、污水处理等，上市首周平均收益2.15%，资本化率多在4.5%以上（中证网），但样本仅数年、周期未充分经历。", "source": "Nareit (2025). REIT Industry Fact Sheet（FTSE Nareit All Equity REITs 1972–2025年化10.94%、40年年化9.43%、股息率4.07%）. <https://www.reit.com/sites/default/files/2026-01/MediaFactSheet_Dec-2025.pdf>；新华网 (2021). 《首批公募REITs正式获批》（2020-04-30证监会、发改委启动试点）. <https://app.xinhuanet.com/news/article.html?articleId=63f54a73-7d0c-4dc4-bec6-8b633e769b86>；中国证券网 (2021). 《公募REITs扩容在即》（首批9只募资314亿、资本化率超4.5%）. <https://cs.com.cn/tzjj/jjdt/202107/t20210730_6189395.html>", "note": "〔争议〕国内 REITs 品类新、样本短、底层同质（基建为主、无住宅），逻辑未充分验证；美国 REITs 长期优但短周期波动大，慎当核心仓、宜小比例卫星配置。"}, {"chapter": 5, "num": 6, "id": "5-6", "title": "黄金（避险但不生息）", "grade": "B", "tags": {"钱": "少", "时间": "少", "毅力": "些", "收益": "中", "口径": "金钱", "影响": "自己"}, "impact": "自己", "cost_money": "少", "cost_time": "少", "cost_will": "些", "benefit": "中", "scope": "金钱", "three_zero": false, "cost": "储存/ETF 费率（约0.2%–0.4%/年）；无现金流（不生息不分红），持有只有资本利得。", "plain": "黄金几百年的“实际回报”并不惊艳，它真正的价值在“别人恐慌时它涨”。配5%–10%当保险可以，重仓当投资是赌贬值。", "gain": "世界黄金协会测算，1971年（布雷顿森林体系解体）至2023年金价年化约8%，长期实际回报高于零但远低于股票；过去20年人民币计价黄金年化约10%、过去10年约13.6%（证券时报援引WGC）。其角色是“对冲”而非“增值”：与股债相关性低，在高通胀、地缘冲突、美元信用走弱时往往走强。但它不生息，实际利率上行时会承压，且波动大（1980年曾见850美元/盎司后长期盘整）。作为组合保险，5%–10%比重即可，重仓将拖累长期复合回报。", "source": "世界黄金协会 (2024). Gold's long-term expected returns: A building block approach（1971–2023年化约8%，模型8.6%）. <https://www.gold.org/goldhub/research/golds-long-term-expected-returns/building-block-approach>；证券时报 (2025). 《秩序重构进行时 “黄金+”能否扶摇直上？》（1971–2023年化约8%、近20年10.2%、近10年13.6%）. <https://www.stcn.com/article/detail/2997848.html>；Nareit/Perth Mint (2025). Gold's role in a modern portfolio（长期约8%–9%，配置5%–10%）. <https://www.perthmint.com/globalassets/assets/documents/superannuation/gold-report-2025.pdf>", "note": "黄金“保值”指购买力大致持平，不等于稳定增值；达利欧建议组合中黄金10%–15%作为对冲，但普通人用黄金ETF即可，避免实物储存与溢价。"}, {"chapter": 5, "num": 7, "id": "5-7", "title": "可转债（下有债底上有股性）", "grade": "C", "tags": {"钱": "少", "时间": "少", "毅力": "些", "收益": "中", "口径": "金钱", "影响": "自己"}, "impact": "自己", "cost_money": "少", "cost_time": "少", "cost_will": "些", "benefit": "中", "scope": "金钱", "three_zero": false, "cost": "研究条款的精力 + 个券信用风险；打新需证券账户与市值/资金占用，交易有佣金与印花税。", "plain": "“债底”保护不是铁底（正股大跌仍可破面）。新手打新可转债尚可，炒作高价转债是另一种赌。", "gain": "可转债“进可攻、退可守”，但2019–2022年炒作后估值分化极大。上交所《可转换公司债券发行实施细则》（上证发〔2018〕115号）明确最小申购单位1000元、T日申购不可撤单；典型条款含“有条件赎回”（正股连续30日中至少20日≥转股价130%可赎回）与“有条件回售”（最后两年正股连续30日<转股价70%可回售），构成债底与股性的双向约束。高位转债（价格>130元）债底保护消失，2021–2022年炒作后回撤可达30%+，破发与强赎并存；低位、低估溢价转债才体现“下有保底”。", "source": "上海证券交易所 (2018). 《上海证券交易所上市公司可转换公司债券发行实施细则》（上证发〔2018〕115号，第五条/第九条申购规则）. <https://big5.sse.com.cn/lawandrules/sselawsrules2025/bond/convertible/issue/c/c_20250609_10781288.shtml>；上海证券交易所 (2025). 可转换公司债券相关规定汇编（赎回/回售条款范本）. <https://big5.sse.com.cn/site/cht/www.sse.com.cn/lawandrules/assemble/c/10116497/files/77fbf7bc013141ff843668080951f781.pdf>", "note": "〔争议〕“债底”仅在平价附近成立，高溢价转债风险接近正股；打新收益已随发行节奏与行情收窄，炒高价转债实质是杠杆化的权益赌注，普通人宜只做打新与低价配置。"}, {"chapter": 5, "num": 8, "id": "5-8", "title": "红利低波策略", "grade": "B", "tags": {"钱": "少", "时间": "少", "毅力": "些", "收益": "中", "口径": "金钱", "影响": "自己"}, "impact": "自己", "cost_money": "少", "cost_time": "少", "cost_will": "些", "benefit": "中", "scope": "金钱", "three_zero": false, "cost": "费率（ETF约0.2%–0.5%）+ 可能阶段性跑输高成长股（如美股/AI行情、A股赛道年）。", "plain": "挑“持续分红、波动小”的一篮子，长期体验比追热点舒服。本质是把“价值+低波”两个被验证的因子打包。", "gain": "股息率约3%–5% + 低波动，长期回撤小于宽基，适合稳健者。Fama-French 三因子模型（1993）证明，高账面市值比（价值）股票相对成长长期有约4%/年的溢价、小盘相对大盘约3%/年溢价，低波则是独立于市值/价值的另一风险维度。中证指数数据显示沪深300指数2005–2022年平均股息率约2.11%，红利低波类指数在此之上叠加低波动筛选，长期夏普更优。但它不是“无回撤”——价值因子可连续数年跑输（如2017–2020成长占优），需要耐受风格轮动。", "source": "Fama, E. & French, K. (1993). Common Risk Factors in the Returns on Stocks and Bonds（价值溢价约4%、规模溢价约3%）. <https://wiki.mbalib.com/zh-tw/Fama-French%E4%B8%89%E5%9B%A0%E5%AD%90%E6%A8%A1%E5%9E%8B>；中证指数有限公司 (2023). 《指数化投资新观察》（沪深300 2005–2022平均股息率2.11%）. <https://www.csindex.com.cn/#/about/newsDetail?id=14867>；先锋集团 (2023). The case for low-cost index-fund investing（因子溢价与低成本）. <https://www.vanguard.co.uk/professional/vanguard-365/investment-knowledge/portfolio-construction/the-case-for-indexing>", "note": "红利低波是“体验优化”而非“收益碾压”，在利率下行、经济弱时表现好，在通胀上行、成长爆发时落后；把它当作稳健核心仓的一部分，而非全部。"}, {"chapter": 5, "num": 9, "id": "5-9", "title": "QDII／海外指数", "grade": "B", "tags": {"钱": "少", "时间": "少", "毅力": "些", "收益": "中", "口径": "金钱", "影响": "自己"}, "impact": "自己", "cost_money": "少", "cost_time": "少", "cost_will": "些", "benefit": "中", "scope": "金钱", "three_zero": false, "cost": "费率（1.0%–1.5%/年，高于境内宽基）+ 汇率波动 + 申赎时滞（T+7左右）+ 额度溢价风险。", "plain": "买美股／全球指数不只是赚海外，更是别把鸡蛋放一个经济体。但汇率是隐形的手，别当纯增强。", "gain": "分散单一市场，分享全球增长。标普500全收益1960–2025年年化约10.7%（国信证券荀玉根），与美股长期ROE趋同；MSCI全球等宽基提供跨国家分散。但QDII 有两层折扣：一是费率显著高于境内ETF，二是人民币计价回报=海外资产本币回报±汇率变动，汇率双向波动可吞噬数个点的收益，额度紧张时二级市场价格还会出现溢价（如2020–2021的美股QDII曾溢价超5%）。它解决的是“地域集中风险”，不是“增强收益”。", "source": "国信证券 荀玉根 (2026). 《股市合理回报率是多少？》（标普500全收益1960–2025年化10.7%）. <https://finance.sina.cn/2026-06-29/detail-iniezsvf0351433.d.html>；先锋集团 (2026). How index funds can help Americans build wealth（全球分散、低成本指数）. <https://corporate.vanguard.com/content/dam/corp/research/pdf/indexing_benefits.pdf>；SlickCharts (2026). S&P 500 Total Returns（含股息年度回报，1926–2025）. <https://www.slickcharts.com/sp500/returns>", "note": "QDII 价值在“不把所有赌注压在A股”，而非更高收益；汇率风险需自行承担，长期看美元兑人民币双向波动，不宜把汇率当免费增强。优先选规模大、跟踪误差小、额度充足的宽基QDII。"}, {"chapter": 5, "num": 10, "id": "5-10", "title": "国债逆回购（月末／季末捡芝麻）", "grade": "C", "tags": {"钱": "0", "时间": "0", "毅力": "否", "收益": "中", "口径": "金钱", "影响": "自己"}, "impact": "自己", "cost_money": "0", "cost_time": "0", "cost_will": "否", "benefit": "中", "scope": "金钱", "three_zero": true, "cost": "零（股票账户自带功能），手续费极低（1天期约成交额的0.001%，每10万元约1元）。", "plain": "股票账户里躺着的钱，收盘前扔个一天期逆回购，白赚一晚利息。零成本动作，顺手做。", "gain": "闲置资金短期年化偶尔冲到3%–5%（月末/季末/节前），本金由中证登中央对手方结算、风险极低。上交所《债券通用质押式回购交易适用指引第2号》规定回购期限1/2/3/4/7/14/28/91/182天，代码“204***”（GC开头），正回购方以国债质押、中央对手方多边净额结算。计息按资金实际占用自然日（2017年5月新规后更平滑），GC001日常多在1.5%–2.5%，但在2024年元旦前多个期限曾超5%、2025年元旦前超2.5%（证券时报）。成交即锁定利率，到期自动回款，是“闲钱过夜”的标准动作。", "source": "上海证券交易所 (2022). 《上海证券交易所债券交易规则适用指引第2号——债券通用质押式回购交易》（第十三条期限、第十四条GC代码、第二十五条购回价公式）. <https://www.sse.com.cn/lawandrules/sselawsrules2025/bond/trading/currency/c/10781048/files/9c80d6d104164618b79f679aff8de1da.docx>；证券时报 (2025). 《元旦小长假“捡钱”，最佳时间窗口打开》（2024元旦前超5%、2025元旦前超2.5%）. <https://www.stcn.com/article/detail/3562121.html>", "note": "逆回购是“捡芝麻”不是“赚大钱”，平时利率仅略高于货基；只在月末/季末/节前利率跳涨时值得专门操作，平时不如直接留货基/同业存单基金。"}, {"chapter": 5, "num": 11, "id": "5-11", "title": "新股／新债打新（A股）", "grade": "C", "tags": {"钱": "少", "时间": "少", "毅力": "些", "收益": "中", "口径": "金钱", "影响": "自己"}, "impact": "自己", "cost_money": "少", "cost_time": "少", "cost_will": "些", "benefit": "中", "scope": "金钱", "three_zero": false, "cost": "市值门槛（沪市/深市持仓）+ 中签资金占用 + 破发亏损风险。", "plain": "过去“打新必赚”的红利在收窄，现在要看基本面挑着打。当成免费彩票可以，当成稳定收入已不成立。", "gain": "破发率从2022年峰值约28%降至2024年约3%、2025年接近清零；但“无脑打新”已回归为“挑着打”。证券时报统计：2020年破发率5.03%、2021年4.2%、2022年28.27%、2023年16.61%、2024年约3.23%（仅1只首日破发），龙年（2024.2起）22只无一破发、平均涨幅近200%；百度百科另载2023年首日破发率21.41%、2024年2%、2025年清零。中信证券“询价新规”后注册制口径：2021年22.2%、2022年31.4%、2023年16.7%、2024年1.5%、2025YTD 0%。打新收益已高度依赖个股质地与发行定价。", "source": "证券时报 (2024). 《巨变！新股涨幅翻倍，闭眼打新回来了？》（2020–2024破发率与首日涨幅统计）. <https://www.stcn.com/article/detail/1167700.html>；百度百科 (2026). 破发率（2023年21.41%、2024年2%、2025年清零）. <https://baike.baidu.com/item/%E7%A0%B4%E5%8F%91%E7%8E%87/69139871>；中信证券 (2025). 网下打新统计（“询价新规”后注册制破发率分年数据）. <https://ima.qq.com/wiki/?shareId=39379873440bfb2eb7f27df83bcf73d8223d9cccd3022c1c44fcec6b4b94cf47>", "note": "〔争议〕破发率随监管定价趋严而下降，但“零破发”不可外推为常态；高位新股仍可能单签亏万元，打新应从“无脑申购”转为“看发行市盈率与基本面”，且需承担市值底仓的波动。"}, {"chapter": 5, "num": 12, "id": "5-12", "title": "期权（买方长期负和）", "grade": "B", "tags": {"钱": "少", "时间": "少", "毅力": "些", "收益": "中", "口径": "金钱", "影响": "自己／家庭"}, "impact": "自己／家庭", "cost_money": "少", "cost_time": "少", "cost_will": "些", "benefit": "中", "scope": "金钱", "three_zero": false, "cost": "时间价值持续衰减（theta）+ 归零风险 + 权利金。", "plain": "期权时间价值每天在漏，多数买方到期归零。它是保险/对冲工具，不是散户提款机。", "gain": "仅适合专业者做对冲/备兑；对散户多为净损耗。期权买方支付权利金获得权利，但时间价值随到期线性（加速）流失，标的不动也会亏；统计上大多数到期归零，属于“负和”博弈（交易所手续费+做市商价差持续抽走资金）。学术与业界的共识是：散户单边买权长期期望为负，仅“备兑开仓”（持股卖Call）或“保护性买Put”（持股买保险）有为正的功能。杠杆可放大盈亏，但亏损上限对买方是权利金、对卖方则可能远超本金。", "source": "Hull, J. (2017). Options, Futures and Other Derivatives（期权定价与时间价值衰减）. <https://www.ivey.uwo.ca/faculty/JohnHull/；中国证监会 (2017). 《证券期货投资者适当性管理办法》（证监会令第130号，第十七条将高杠杆/易损本金产品列为高风险）. <https://www.csrc.gov.cn/csrc/c100210/c1498841/1498841/files/1636094382980_55189.pdf>", "note": "〔争议〕备兑开仓对持股者是可用的“增强+保险”，但需专业能力识别标的风险；普通人以买方博方向，长期几乎必亏，应视为保险费用而非投资。"}, {"chapter": 5, "num": 13, "id": "5-13", "title": "结构性存款／银行理财（净值化后）", "grade": "C", "tags": {"钱": "少", "时间": "少", "毅力": "否", "收益": "中", "口径": "金钱", "影响": "自己"}, "impact": "自己", "cost_money": "少", "cost_time": "少", "cost_will": "否", "benefit": "中", "scope": "金钱", "three_zero": false, "cost": "流动性（多限期锁定的机会成本）+ 隐性费用 + 净值波动可能带来的账面亏损。", "plain": "别再把它当“高息存款”。它现在不保本，买前看清楚底层投了什么。比存款多那点收益，对应多那点风险。", "gain": "比存款高一点，但资管新规后不保本、净值波动。2018年4月央行等四部委联合发布《关于规范金融机构资产管理业务的指导意见》（“资管新规”），明确“不得承诺保本保收益、打破刚性兑付”，2022年1月1日过渡期结束正式落地，预期收益型产品退场、银行理财全面净值化（人民网）。这意味着理财收益不再固定，底层含债券/非标/权益时净值会随市场起伏，极端情况可出现破净。它适合作为“略高于存款、容忍小幅波动”的现金/短债替代，但绝不等于存款。", "source": "中国人民银行等四部委 (2018). 《关于规范金融机构资产管理业务的指导意见》（资管新规，打破刚兑条款）. <https://finance.people.com.cn/n1/2022/0101/c1004-32322377.html>；人民日报/人民网 (2022). 《资管新规过渡期结束 理财产品将打破刚性兑付》. <https://finance.people.com.cn/n1/2022/0101/c1004-32322377.html>", "note": "〔争议〕“业绩比较基准”不是预期收益，破净在净值化后属正常；购买前必须看产品说明书中的投资范围与风险等级（R2/R3），把“类存款”预期彻底抛弃。"}, {"chapter": 5, "num": 14, "id": "5-14", "title": "保险理财／年金（锁定长期现金流）", "grade": "C", "tags": {"钱": "少", "时间": "少", "毅力": "些", "收益": "中", "口径": "金钱", "影响": "自己／后代"}, "impact": "自己／后代", "cost_money": "少", "cost_time": "少", "cost_will": "些", "benefit": "中", "scope": "金钱", "three_zero": false, "cost": "流动性（早期退保亏损大，现金价值前几年很低）+ 费用（初始费、管理费）+ 长期锁定期。", "plain": "年金的价值是“强制储蓄 + 终身现金流”，不是高收益。算清 IRR 再买，别被“演示利益”晃晕。", "gain": "确定性现金流（养老/教育），但真实内部收益率（IRR）常被销售话术美化，行业实际约2%–3.5%。年金/养老险用“演示利率”营造高收益错觉，但演示分低/中/高三档、且非保证；监管已要求分红、万能、投连险利益演示更透明（银保监会相关规定）。其真正价值是“与生命等长的给付”和“强制不挪用”，适合已有基础保障、想锁定一部分终身现金流的人。若只看收益，长期复利跑输指数基金，属于“用收益换确定性”。", "source": "中国银行保险监督管理委员会 (2020). 《关于强化人身保险精算监管有关事项的通知》（规范年金/万能演示利率）. <https://www.cbirc.gov.cn/>；中国人民银行等 (2018). 《关于规范金融机构资产管理业务的指导意见》（资管新规，打破刚兑）. <https://finance.people.com.cn/n1/2022/0101/c1004-32322377.html>", "note": "〔争议〕买前务必用“保证利益”而非“演示利益”算IRR；早期退保损失大，宜用闲钱中长期配置，且先配齐医疗/重疾等保障型险种，再谈理财型。"}, {"chapter": 5, "num": 15, "id": "5-15", "title": "信托／私募（非标流动性风险）", "grade": "C", "tags": {"钱": "少", "时间": "少", "毅力": "些", "收益": "中", "口径": "金钱", "影响": "自己／家庭"}, "impact": "自己／家庭", "cost_money": "少", "cost_time": "少", "cost_will": "些", "benefit": "中", "scope": "金钱", "three_zero": false, "cost": "高门槛（常100万起）+ 长锁定期（1–3年甚至更久）+ 信息不透明 + 违约/延期兑付风险。", "plain": "非标“高收益”对应“低透明 + 低流动”。真出问题，你排在最后。门槛高不等于安全，反而常是信息差最大处。", "gain": "可能更高收益（历史非标固收曾达7%–10%），但违约、延期兑付、净值不透明事件频发。资管新规（2018）禁止资金池、打破刚兑、消除多层嵌套后，原先“信托/私募=稳兑”的隐性担保消失；2018年后房地产信托、城投非标风波（如2020–2022多家房企债务违约牵连信托计划延期）暴露了非标的真实信用风险。私募证券虽可能有长期超额，但筛选成本极高，且清盘/回撤风险并存。对普通人而言，非标的高收益多来自“流动性溢价+信用下沉”，而非能力溢价。", "source": "中国人民银行等四部委 (2018). 《关于规范金融机构资产管理业务的指导意见》（禁止资金池、打破刚兑、消除多层嵌套）. <https://finance.people.com.cn/n1/2022/0101/c1004-32322377.html>；证券时报 (2023). 《地产信托延期兑付背后：投资者适当性管理尚待强化》（2021年地产信托违约917亿元、2022年930亿元）. <https://stcn.com/article/detail/1176465.html>；中国经济网 (2022). 《房地产信托“大塌方”》（2021年以来违约地产信托规模超200亿元）. <https://finance.ce.cn/stock/gsgdbd/202208/18/t20220818_38037408.shtml>", "note": "〔争议〕头部优质私募确有长期超额，但门槛、筛选与尽调成本极高，普通人更易踩雷；非标“高收益”本质是流动性与信用风险的补偿，不宜与存款/理财比较。"}, {"chapter": 5, "num": 16, "id": "5-16", "title": "增额终身寿／护理险（当理财看 IRR）", "grade": "C", "tags": {"钱": "少", "时间": "少", "毅力": "些", "收益": "中", "口径": "金钱", "影响": "自己／后代"}, "impact": "自己／后代", "cost_money": "少", "cost_time": "少", "cost_will": "些", "benefit": "中", "scope": "金钱", "three_zero": false, "cost": "长期锁定（早期退保亏损极大，前几年现金价值远低于已交保费）+ 费用（身故/护理保障成本）。", "plain": "它本质是“超长期、低收益、强锁定”的储蓄险。当保障或遗产规划可，当高收益理财买必亏在流动性。", "gain": "确定性的长期现金价值增长，适合做“保底压舱”，但前几年IRR很低、长期约2%–3%。监管多次下调普通型人身险预定利率（从3.5%降至3.0%及以下），使长期复利封顶；现金价值按合同逐年递增、白纸黑字可算，确定性高，但早期退保普遍亏损30%–50%。它胜在“锁定长期利率+指定传承+债务隔离(视情形)”，而非收益——若以理财为目标，长期跑输指数基金与国债组合，仅适合风险极度厌恶、需强制储蓄与定向给付的人群。", "source": "中国银行保险监督管理委员会 (2023). 关于普通型人身保险预定利率下调的监管要求（预定利率下行）. <https://www.cbirc.gov.cn/>；中国人民银行等 (2018). 《关于规范金融机构资产管理业务的指导意见》（资管新规，打破刚兑）. <https://finance.people.com.cn/n1/2022/0101/c1004-32322377.html>", "note": "〔争议〕买前必须用“长期IRR”而非“保额增长”评估；早期退保损失大，且预定利率下调后收益进一步走低，宜与国债/指数基金搭配而非替代。"}, {"chapter": 5, "num": 17, "id": "5-17", "title": "期货（高杠杆零和）", "grade": "A", "tags": {"钱": "少", "时间": "少", "毅力": "些", "收益": "中", "口径": "金钱", "影响": "自己／家庭"}, "impact": "自己／家庭", "cost_money": "少", "cost_time": "少", "cost_will": "些", "benefit": "中", "scope": "金钱", "three_zero": false, "cost": "杠杆（常5–20倍）+ 展期成本 + 保证金追加大额 + 每日无负债结算的强平风险。", "plain": "期货是专业机构的套期保值工具，不是散户提款机。十倍杠杆下，10%反向波动就清零。普通人碰期货，基本是给市场送保证金。", "gain": "理论双向获利，但对散户是负和：高杠杆下小波动即爆仓，长期多为净亏损。证监会《证券期货投资者适当性管理办法》（令第130号）及金融期货适当性办法明确，金融期货开户需保证金账户可用资金≥50万元、通过知识测试与交易经历审核，即因为其“专业性强、杠杆高、风险大”。中金所《金融期货投资者适当性制度实施办法》将杠杆与适当性门槛制度化；csrc 投资者教育材料指出，期货“以小博大”的杠杆效应使风险远高于股票，方向误判即可在上涨与下跌两端亏损。它本质是风险管理工具，散户裸多/裸空多是净损耗。", "source": "中国证监会 (2017). 《证券期货投资者适当性管理办法》（证监会令第130号，第十六条/第十七条高杠杆产品风险等级）. <https://www.csrc.gov.cn/csrc/c100210/c1498841/1498841/files/1636094382980_55189.pdf>；中国金融期货交易所 (2013). 《金融期货投资者适当性制度实施办法》（第四条50万元门槛、知识测试与经历要求）. <http://www.cffex.com.cn/u/cms/www/oldsys/W020130830532922638511.pdf>；中国证监会天津监管局 (2020). 投资者保护教育（期货）（杠杆与逐日结算风险）. <https://www.csrc.gov.cn/tianjin/c105377/c1263609/content.shtml>", "note": "〔争议〕期货对产业客户是套保刚需，对散户若无对冲标的、无严格止损纪律，长期期望为负；普通人应以“远离”为默认选项，确有需求先开模拟盘练手。"}, {"chapter": 5, "num": 18, "id": "5-18", "title": "外汇保证金（远离）", "grade": "A", "tags": {"钱": "少", "时间": "少", "毅力": "些", "收益": "中", "口径": "金钱", "影响": "自己／家庭"}, "impact": "自己／家庭", "cost_money": "少", "cost_time": "少", "cost_will": "些", "benefit": "中", "scope": "金钱", "three_zero": false, "cost": "高杠杆（常100倍以上）+ 黑平台风险 + 汇率双向 + 本金可能归零且不受法律保护。", "plain": "朋友圈“老师带炒外汇”九成是黑平台。合法渠道本就受限，能轻易开户炒汇的，多半是准备吞你本金的。默认不碰。", "gain": "几乎无正期望值。外汇局等多部门明确：人民银行、银保监会、证监会、外汇局及其分支均未批准任何机构在境内开展或代理开展外汇按金（保证金）业务，一切网络炒汇平台在境内均不合法，组织者追责、参与者不受保护（外汇局风险提示）。依据《关于严厉查处非法外汇期货和外汇按金交易活动的通知》（证监发字〔1994〕165号），未经批准开展外汇按金交易即违法；境外平台多为对赌盘/无法出金，典型案例中有人以“代客操盘、年化24%”非法吸存数千万元获刑（外汇局/光明网）。对境内居民，这不仅期望为负，更是违法且维权无门。", "source": "国家外汇管理局 (2023). 《资金交易无保障 当心网络“炒汇”》（境内未批准任何外汇按金业务）. <https://m.gmw.cn/2023-03/09/content_1303304812.htm>；国家外汇管理局 (2019). 防范网络外汇投资、炒汇平台风险提示（证监发字〔1994〕165号依据）. <http://m.safe.gov.cn/big5/big5/www.safe.gov.cn/fujian/2019/1120/1033.html>；中国证券网 (2019). 《警惕网络炒汇平台 皆为非法“裸奔”》. <https://www.cnstock.com/commonDetail/93214>", "note": "〔争议〕不存在“境内合法外汇保证金”的灰色地带；凡境内招揽炒汇均属非法，参与者不受法律保护，应直接拉黑，切勿因“高收益”入场。"}, {"chapter": 5, "num": 19, "id": "5-19", "title": "公募 FOF / 投顾（懒人配置）", "grade": "C", "tags": {"钱": "少", "时间": "少", "毅力": "些", "收益": "中", "口径": "金钱", "影响": "自己"}, "impact": "自己", "cost_money": "少", "cost_time": "少", "cost_will": "些", "benefit": "中", "scope": "金钱", "three_zero": false, "cost": "投顾费/FOF 管理费（多一层0.3%–1%/年，投顾账户资产净值年化费上限5%）。", "plain": "自己懒得配、又怕踩坑，FOF 或正规投顾是“花钱买配置纪律”。看清费用，别为省事反而付了多层管理费。", "gain": "由专业方做股债配置与再平衡，适合不想自己管、又怕买错的人；成本换省心。2019年10月证监会发布《关于做好公开募集证券投资基金投资顾问业务试点工作的通知》，华夏、易方达、嘉实、南方、中欧等首批试点，开启“买方投顾”模式——按账户资产收费、代客决策申赎，意在抑制追涨杀跌、使中介与投资者利益一致（中证网）。FOF 则通过一篮子基金实现分散。其长期收益取决于底层资产（多为股债基金组合），本身不创造超额，核心价值是“纪律+适配”，对自制力弱、无暇研究者划算，对能自律定投者则是可省的费用。", "source": "中国证监会 (2019). 《关于做好公开募集证券投资基金投资顾问业务试点工作的通知》（首批5家试点、投顾费年化≤5%）. <https://www.cs.com.cn/xwzx/201910/t20191026_5992823.html>；澎湃新闻/中国基金报 (2019). 《基金投资顾问业务试点正式启动》. <https://m.thepaper.cn/baijiahao_4782317>", "note": "〔争议〕投顾/FOF 解决“行为与适配”而非“高收益”；需比较总费用与底层基金费率，警惕多层收费侵蚀回报，选持牌机构并看清策略与利益冲突条款。"}, {"chapter": 5, "num": 20, "id": "5-20", "title": "同业存单指数基金（现金升级）", "grade": "C", "tags": {"钱": "0", "时间": "0", "毅力": "否", "收益": "中", "口径": "金钱", "影响": "自己"}, "impact": "自己", "cost_money": "0", "cost_time": "0", "cost_will": "否", "benefit": "中", "scope": "金钱", "three_zero": true, "cost": "几乎为零（低风险、高流动、免申购赎回费）；仅承担极小的利率波动与机会成本。", "plain": "应急金/短期钱想多赚半个点，又不敢买波动产品，同业存单指数基金是货币基金的“微升级”。仍是现金管理，不是投资。", "gain": "比货币基金略高一点（约1.5%–2.5%区间，行情好时高出货基数十个基点），风险仍极低，适合放大额应急金或短期闲钱。它主要跟踪AAA级同业存单指数，标的为银行同业存单（《货币市场基金监督管理办法》将同业存单列入货基可投范围），久期短、信用等级高，净值波动远小于短债基金，但略大于货基（货基用摊余成本法、存单基金多为市值法，极端日可有小幅回撤）。2022年现金理财新规后，其与货基、现金理财形成“现金管理三件套”，按收益/流动性/风险由低到高排列为：货基≈现金理财 < 存单指数基金 < 短债基金。", "source": "中国证监会、中国人民银行 (2015). 《货币市场基金监督管理办法》（证监会令第120号，第四条同业存单可投）. <https://www.csrc.gov.cn/csrc/c106256/c1654015/1654015/files/52c60ebbeb5642e08f9f629bb8ed190e.pdf>；中国人民银行、银保监会 (2021). 《关于规范现金管理类理财产品管理有关事项的通知》（现金理财对标货基、收益率趋降）. <https://jrb.changsha.gov.cn/jr/202201/t20220110_10433968.htm>", "note": "〔争议〕存单指数基金收益略高但以市值法计价、可能有单日微小回撤，不适合“绝对不许亏”的应急底线；真正的“随时要用”的钱仍优先货基/活期，存单基金放“短期(1周–3个月)不用的闲钱”更合适。"}, {"chapter": 6, "num": 1, "id": "6-1", "title": "\"保证收益／稳赚不赔\"——看见就跑", "grade": "A", "tags": {"钱": "0", "时间": "少", "毅力": "否", "收益": "大", "口径": "金钱", "影响": "自己／家庭"}, "impact": "自己／家庭", "cost_money": "0", "cost_time": "少", "cost_will": "否", "benefit": "大", "scope": "金钱", "three_zero": false, "cost": "可能错过的\"完美机会\"（实为陷阱）。", "plain": "金融里没有\"既要高回报又不要风险\"的好事。敢把\"保证\"\"稳赚\"\"零风险\"写进合同的，保证的是拿走你的本金。郭树清在 2018 陆家嘴论坛的原话就是给这类话术定的性。", "gain": "保住全部本金与家庭积蓄。监管红线很清楚：资管新规（银发〔2018〕106 号）第二条、第六条禁止任何资管产品\"承诺保本保收益\"，第十九条列举刚性兑付认定标准并规定处罚；郭树清 2018 年明确\"收益率超 6% 打问号、超 8% 危险、超 10% 准备损失全部本金\"。一旦产品被认定为非法集资，依《防范和处置非法集资条例》第 25 条\"因参与非法集资受到的损失，由集资参与人自行承担\"，国家不垫付、不回购。避开它，等于把\"承诺的高息\"换成确定到手的本金。", "source": "郭树清 (2018). 在第十届陆家嘴论坛上的讲话（人民网报道）. https://money.people.com.cn/n1/2018/0614/c42877-30059109.html; 中国人民银行等四部门 (2018). 关于规范金融机构资产管理业务的指导意见（银发〔2018〕106号）第二条、第六条、第十九条. https://www.gov.cn/zhengce/2018-05/04/content_5287860.htm; 国务院 (2021). 防范和处置非法集资条例（国令第737号）第二十五条. https://www.gov.cn/zhengce/content/2021-02/10/content_5586632.htm", "note": "6%/8%/10% 线是监管对\"高收益话术\"的经验性警示，非法律阈值；具体个案以是否构成非法集资、是否承诺保本保收益认定。"}, {"chapter": 6, "num": 2, "id": "6-2", "title": "荐股群、老师带单、内幕消息", "grade": "A", "tags": {"钱": "0", "时间": "少", "毅力": "否", "收益": "大", "口径": "金钱", "影响": "自己／家庭"}, "impact": "自己／家庭", "cost_money": "0", "cost_time": "少", "cost_will": "否", "benefit": "大", "scope": "金钱", "three_zero": false, "cost": "一点\"跟大佬抄作业\"的诱惑。", "plain": "真能稳定赚钱的方法不会在微信群里 9.9 元卖你。喊单本质是\"找足够多人总有一半蒙对，对了收钱、错了消失\"，盈利截图几乎可伪造。", "gain": "避开非法荐股与杀猪盘，保住本金。证券投资咨询属特许经营——证监会明确，未经中国证监会批准任何机构和个人不得从事该业务（《证券法》《证券、期货投资咨询管理暂行办法》）。非法荐股三大特征就是\"无业务资格、推荐股票、收服务费\"。美国 SEC 同样警示：\"Guaranteed high investment returns are the hallmark of a Ponzi scheme\"，凡是\"稳赚不赔\"必是红旗。2025 年深圳证监局披露多起\"购买高价商品送荐股\"\"以培训为名非法荐股\"\"AI 选股诈骗\"套路，受害者往往先小赚后大亏、维权困难。不进群、不加老师，等于躲开最常见的一类割韭菜。", "source": "中国证监会 (无日期). 非法证券投资咨询风险提示. https://www.csrc.gov.cn/sichuan/c104903/c3243464/content.shtml; 深圳证监局 (2025). 警惕非法荐股骗局风险提示. https://jr.sz.gov.cn/sjrb/xxgk/tzzjy/content/post_12213565.html; SEC (无日期). Investor Alert: Ponzi Schemes Targeting Seniors. https://sec.gov/oiea/investor-alerts-and-bulletins/ia_ponziseniors", "note": "合法持牌投顾可在证监会/证券业协会官网查到资质；凡要求向个人账户转账、买商品入群、私下发链接下 APP 的，一律视为非法。"}, {"chapter": 6, "num": 3, "id": "6-3", "title": "庞氏／资金盘：用后来人钱付前面人息", "grade": "A", "tags": {"钱": "0", "时间": "少", "毅力": "否", "收益": "大", "口径": "金钱", "影响": "自己／家庭／社会"}, "impact": "自己／家庭／社会", "cost_money": "0", "cost_time": "少", "cost_will": "否", "benefit": "大", "scope": "金钱", "three_zero": false, "cost": "一点\"早进场滚雪球\"的贪念。", "plain": "识别三特征——①承诺不合常理的固定高息；②靠拉人头发展下线；③资金去向说不清。早进晚进都是输，区别只在于谁接最后一棒。", "gain": "避开必然崩盘、大概率血本无归的局。美国 SEC 定义庞氏骗局为\"用新投资者钱付老投资者息\"，红旗包括\"高回报零风险承诺、无牌照卖家、收益长期异常稳定\"。史上最大庞氏——麦道夫案账户虚增规模约 650 亿美元（2009 年认罪，判 150 年），最终崩盘后散户本金几乎归零。国内依《防范和处置非法集资条例》第 25 条，参与损失自行承担。守住\"不投看不懂的现金流\"，等于躲开系统性归零风险。", "source": "SEC (无日期). Investor Alert: Ponzi Schemes Targeting Seniors. https://sec.gov/oiea/investor-alerts-and-bulletins/ia_ponziseniors; 国务院 (2021). 防范和处置非法集资条例（国令第737号）第二条、第二十五条. https://www.gov.cn/zhengce/content/2021-02/10/content_5586632.htm; 公安部 (2024). 2023 年破获电信网络诈骗等案件数据通报（中工网报道）. https://www.workercn.cn/c/2024-01-10/8108310.shtml", "note": "麦道夫\"650 亿美元\"指其账户虚增的账面规模，并非实际被骗本金；用于说明庞氏\"借新还旧\"的体量之巨。"}, {"chapter": 6, "num": 4, "id": "6-4", "title": "高息理财\"保本高收益\"：矛盾即答案", "grade": "A", "tags": {"钱": "0", "时间": "少", "毅力": "些", "收益": "大", "口径": "金钱", "影响": "自己／家庭"}, "impact": "自己／家庭", "cost_money": "0", "cost_time": "少", "cost_will": "些", "benefit": "大", "scope": "金钱", "three_zero": false, "cost": "一点多赚几个点的念想。", "plain": "国债收益率是无风险标尺。任何产品敢比它高一大截还说没风险，多出来的就是它隐瞒的风险溢价，迟早用本金还。", "gain": "避开违约暴雷，保住本金。资管新规（银发〔2018〕106 号）第二条写明\"金融机构开展资产管理业务时不得承诺保本保收益\"，出现兑付困难时\"不得以任何形式垫资兑付\"；第十九条把\"违反净值确定原则保本保收益、滚动发行保本保收益、自行筹资偿付\"一律认定为刚性兑付并处罚。郭树清 2018 年给的刻度是 6%/8%/10%——超 10% 就要准备损失全部本金。无风险利率就那么高，超出的\"收益\"是隐藏的信用风险，避开它等于不替别人的坏账买单。", "source": "中国人民银行等四部门 (2018). 关于规范金融机构资产管理业务的指导意见（银发〔2018〕106号）第二条、第十九条. https://www.gov.cn/zhengce/2018-05/04/content_5287860.htm; 郭树清 (2018). 第十届陆家嘴论坛讲话（人民网报道）. https://money.people.com.cn/n1/2018/0614/c42877-30059109.html; 国务院 (2021). 防范和处置非法集资条例（国令第737号）第二十五条. https://www.gov.cn/zhengce/content/2021-02/10/content_5586632.htm", "note": "资管新规适用于持牌金融机构的资管产品；大量\"保本高收益\"理财实为无牌主体发行，直接落入非法集资范畴。"}, {"chapter": 6, "num": 5, "id": "6-5", "title": "加密货币投机：当赌场别当资产", "grade": "A", "tags": {"钱": "少", "时间": "少", "毅力": "些", "收益": "大", "口径": "金钱", "影响": "自己／家庭"}, "impact": "自己／家庭", "cost_money": "少", "cost_time": "少", "cost_will": "些", "benefit": "大", "scope": "金钱", "three_zero": false, "cost": "可能投入的本金（高波动、易归零、平台跑路、境内不受合法保护）。", "plain": "比特币不产生现金流、不分红、波动极大，本质是投机品。小仓当彩票可，重仓当投资是赌命，且境内相关交易炒作明确不受合法投资保护。", "gain": "避开境内不受保护的投机与平台跑路风险，保住本金。监管定性极为明确：人民银行等七部门 2017 年 9 月 4 日公告将代币发行融资（ICO）定性为\"未经批准非法公开融资\"，要求各类 ICO 立即停止；人民银行等十部门 2021 年 9 月 24 日《关于进一步防范和处置虚拟货币交易炒作风险的通知》（银发〔2021〕237 号）明确\"虚拟货币相关业务活动属于非法金融活动\"，境外交易所向境内居民提供服务同样非法，参与交易违背公序良俗的\"相关民事法律行為无效，损失自行承担\"。SEC 亦警示加密资产骗局常承诺\"20%–50% 无风险回报\"后卷款。对大多数人，它换不回稳定收益，只换回刺激与归零。", "source": "中国人民银行等七部门 (2017). 关于防范代币发行融资风险的公告. https://money.people.com.cn/bank/n1/2017/0904/c202331-29514147.html; 中国人民银行等十部门 (2021). 关于进一步防范和处置虚拟货币交易炒作风险的通知（银发〔2021〕237号）. https://www.gov.cn/zhengce/2021-09/25/content_5639206.htm; SEC (无日期). Investor Alert: Watch Out for Fraudulent Digital Asset and \"Crypto\" Trading Websites. https://sec.gov/oiea/investor-alerts-and-bulletins/ia_fraudulentdigitalasset", "note": "境内持牌金融机构、支付机构不得为虚拟货币业务提供账户、清算等服务；所谓\"海外合规交易所\"对境内居民仍属非法金融活动。"}, {"chapter": 6, "num": 6, "id": "6-6", "title": "场外配资、非法交易平台", "grade": "A", "tags": {"钱": "0", "时间": "少", "毅力": "些", "收益": "大", "口径": "金钱", "影响": "自己／家庭"}, "impact": "自己／家庭", "cost_money": "0", "cost_time": "少", "cost_will": "些", "benefit": "大", "scope": "金钱", "three_zero": false, "cost": "一点放大本金的幻想。", "plain": "正规杠杆有严格规则与强平线。场外配资规则由对方说了算，跌一点就改线吞你本金，是枪口对着你的猎枪。", "gain": "避开资金被挪用、平台关停、强平规则不透明的系统性陷阱，保住本金。证监会、公安部联合定性：根据《刑法》《证券法》《期货交易管理条例》，场外配资经营活动属于非法证券期货活动，构成犯罪的以非法经营罪、诈骗罪追责。2020 年证监部门向公安机关移送、通报场外配资线索 89 件，配合查处重大案件 19 起，抓捕 700 余人；重庆\"撮合网\"案提供 8 倍杠杆、涉案交易金额 550 亿元，153 人被抓。参与场外配资\"自身利益无法保障，并可能遭受较大财产损失\"。", "source": "证监会、公安部 (2021). 2020年场外配资违法犯罪典型案例. https://www.csrc.gov.cn/jiangxi/c100771/c1764378/content.shtml; 证监会 (2021). 重庆\"撮合网\"股票配资案典型介绍. https://www.csrc.gov.cn/shaanxi/c105610/cbde7843908ca42e5a2be4b4eb50aeb94/content.shtml; 国务院 (2021). 防范和处置非法集资条例（国令第737号）第十九条. https://www.gov.cn/zhengce/content/2021-02/10/content_5586632.htm", "note": "凡使用\"分仓系统\"开子账户、宣传高杠杆、要求下载非官方 APP 的配资，多为非法或\"虚拟盘\"，应直接向正规券商开户交易。"}, {"chapter": 6, "num": 7, "id": "6-7", "title": "\"原始股／未上市股权\"骗局", "grade": "A", "tags": {"钱": "0", "时间": "少", "毅力": "些", "收益": "大", "口径": "金钱", "影响": "自己／家庭"}, "impact": "自己／家庭", "cost_money": "0", "cost_time": "少", "cost_will": "些", "benefit": "大", "scope": "金钱", "three_zero": false, "cost": "一点\"上市暴富\"想象。", "plain": "真优质未上市股权轮不到陌生人。对方能卖给你的\"原始股\"大多卖不出去，或根本是假的。非标+高门槛+催你定，三者齐了就是局。", "gain": "避开流动性为零、信息黑箱、极易血本无归的非标投资，保住本金。《防范和处置非法集资条例》第十九条明确把\"以发行或者转让股权、债权，募集基金\"等名义吸收资金列入涉嫌非法集资情形；条例第 25 条规定参与损失自行承担。未上市股权属典型非标资产，无公开交易场所、无公允估值，骗子常以\"即将上市\"\"内部通道\"催单。SEC 亦提示私募份额仅对合格投资者非公开发行，向不特定公众兜售\"原始股\"即违规。不碰自己看不懂、查不到备案的\"股权\"，等于守住钱袋子。", "source": "国务院 (2021). 防范和处置非法集资条例（国令第737号）第十九条、第二十五条. https://www.gov.cn/zhengce/content/2021-02/10/content_5586632.htm; SEC (无日期). Investor Alert: Ponzi Schemes Targeting Seniors（私募份额红旗）. https://sec.gov/oiea/investor-alerts-and-bulletins/ia_ponziseniors; 中国证监会 (无日期). 非法证券投资咨询风险提示. https://www.csrc.gov.cn/sichuan/c104903/c3243464/content.shtml", "note": "境内合法股权融资应经证监会注册/备案并在合规场所进行；街头、微信群兜售\"原始股\"几乎均为非法证券活动或诈骗。"}, {"chapter": 6, "num": 8, "id": "6-8", "title": "杀猪盘：先养后杀", "grade": "A", "tags": {"钱": "0", "时间": "少", "毅力": "些", "收益": "大", "口径": "金钱", "影响": "自己／家庭"}, "impact": "自己／家庭", "cost_money": "0", "cost_time": "少", "cost_will": "些", "benefit": "大", "scope": "金钱", "three_zero": false, "cost": "信任与时间（被\"恋爱／友情\"铺垫）。", "plain": "对方对你越好、越催你\"一起赚钱\"，越要冷。真感情不会带你进投资平台；凡是\"平台充值、无法提现\"的模式，必是杀猪。", "gain": "避开被诱导到虚假平台充值、最终无法提现，保住本金。公安部数据触目惊心：2023 年全国公安机关破获电信网络诈骗案件 43.7 万起，国家反诈中心下发资金预警指令 940 万条、见面劝阻 1389 万人次，紧急拦截涉案资金 3288 亿元。美国 FTC 警示：网恋对象\"教投资\"100% 是杀猪盘，2021 年美国人因 romance scam 损失 5.47 亿美元， median 损失 2400 美元；SEC 亦指出加密\"杀猪盘\"常承诺 20%–50% 无风险回报后卷款。冷处理、不充值，等于不被\"养肥再杀\"。", "source": "公安部 (2024). 2023年打击治理电信网络诈骗犯罪成效通报（中工网报道）. https://www.workercn.cn/c/2024-01-10/8108310.shtml; FTC (2022). FTC Data Show Romance Scams Hit Record High; $547 Million Reported Lost in 2021. https://www.ftc.gov/news-events/press-releases/2022/02/ftc-data-show-romance-scams-hit-record-high-547-million-reported; SEC (无日期). Investor Alert: Watch Out for Fraudulent Digital Asset and \"Crypto\" Trading Websites. https://sec.gov/oiea/investor-alerts-and-bulletins/ia_fraudulentdigitalasset", "note": "杀猪盘常先把你小额提现\"养信任\"，再诱导大额充值；一旦要求\"缴税/解冻费才能提现\"，必是诈骗，应立即报警并联系反诈中心。"}, {"chapter": 6, "num": 9, "id": "6-9", "title": "虚假平台／黑 APP", "grade": "A", "tags": {"钱": "0", "时间": "少", "毅力": "些", "收益": "大", "口径": "金钱", "影响": "自己／家庭"}, "impact": "自己／家庭", "cost_money": "0", "cost_time": "少", "cost_will": "些", "benefit": "大", "scope": "金钱", "three_zero": false, "cost": "一点\"高收益平台\"的侥幸。", "plain": "下载来源不明、承诺高息、客服催你加大充值的 APP，先假设它是假的。正规券商/基金都在官方应用商店与持牌名录。", "gain": "避开充值即锁定、无法出金的骗局，保住本金。证监会提示：虚假平台在名称、图标、界面上与正规交易平台高度相似，实则是自行开发的\"虚拟盘\"——核心逻辑是\"前期诱导入金→资金直接进骗子个人账户→以账户冻结/税费拖延最终跑路\"。公安部 2023 年处置涉诈域名网址 836.4 万个、拦截诈骗电话 27.5 亿次，可见黑平台规模之巨。《防范和处置非法集资条例》第 25 条明确参与损失自行承担。只从官方应用商店、持牌机构官网下载交易软件，等于切断 90% 的黑 APP 入口。", "source": "中国证监会 (无日期). 关于防范非法证券期货活动的风险提示（伪造交易平台网络诈骗）. https://www.csrc.gov.cn/xinjiang/c105515/c7613926/content.shtml; 公安部 (2024). 2023年打击治理电信网络诈骗犯罪成效通报（中工网报道）. https://www.workercn.cn/c/2024-01-10/8108310.shtml; 国务院 (2021). 防范和处置非法集资条例（国令第737号）第二十五条. https://www.gov.cn/zhengce/content/2021-02/10/content_5586632.htm", "note": "辨别真伪：查证监会/证券业协会合法机构名录、核对官网域名、拒向个人账户转账；名称相似、图标雷同的仿冒平台一律不下载。"}, {"chapter": 6, "num": 10, "id": "6-10", "title": "代客理财承诺保底", "grade": "A", "tags": {"钱": "0", "时间": "少", "毅力": "些", "收益": "大", "口径": "金钱", "影响": "自己／家庭"}, "impact": "自己／家庭", "cost_money": "0", "cost_time": "少", "cost_will": "些", "benefit": "大", "scope": "金钱", "three_zero": false, "cost": "一点\"交给专家\"的省心。", "plain": "敢签\"保底\"的操盘手，要么违法要么准备跑。真高手不缺你的钱；把账户交给无资质个人，亏了基本自认。", "gain": "避开\"保底协议\"法律上多无效、亏了钱人难追的风险，保住本金。资管新规（银发〔2018〕106 号）第二条禁止金融机构\"承诺保本保收益\"，第十九条把保底安排定性为刚性兑付并处罚；非金融机构违规承诺保本保收益的\"依法从重处罚\"（资管新规第三十条）。证券法规定证券投资咨询须持牌，无资质代客理财本身违法，所谓\"保底条款\"因违反强制性规定多被法院认定无效，亏损难追偿。郭树清 2018 年亦言：\"保本就不可能有高收益，这是欺诈。\"不把账户交'保底老师'，等于不把本金交给法律风险。", "source": "中国人民银行等四部门 (2018). 关于规范金融机构资产管理业务的指导意见（银发〔2018〕106号）第二条、第十九条、第三十条. https://www.gov.cn/zhengce/2018-05/04/content_5287860.htm; 郭树清 (2018). 第十届陆家嘴论坛讲话（人民网报道）. https://money.people.com.cn/n1/2018/0614/c42877-30059109.html; 中国证监会 (无日期). 非法证券投资咨询风险提示. https://www.csrc.gov.cn/sichuan/c104903/c3243464/content.shtml", "note": "司法实践中\"保底条款\"常因违背公平与金融监管被认定无效；即便协议有效，无资质个人往往无财产可执行，追回率低。"}, {"chapter": 6, "num": 11, "id": "6-11", "title": "非法集资与传销式拉人头", "grade": "A", "tags": {"钱": "0", "时间": "少", "毅力": "些", "收益": "大", "口径": "金钱", "影响": "自己／家庭／社会"}, "impact": "自己／家庭／社会", "cost_money": "0", "cost_time": "少", "cost_will": "些", "benefit": "大", "scope": "金钱", "three_zero": false, "cost": "一点\"发展下线赚佣金\"的诱惑。", "plain": "凡是\"拉人进来才有收益、层级返利\"的，先当传销看。它靠人脉不靠资产增值，崩盘只是时间问题。", "gain": "避开\"金字塔\"结构——底层永远接盘，组织方涉嫌刑事犯罪，保住本金与社会信用。《防范和处置非法集资条例》第二条定义非法集资为\"未经许可、许诺还本付息向不特定对象吸收资金\"，第十九条列举\"发行转让股权债权、资管、虚拟货币\"等吸收资金情形；第 25 条规定参与损失自行承担、国家不垫付。公安部 2023 年破获电诈等案件 43.7 万起、拦截资金 3288 亿元，其中大量为传销式返利盘。SEC 指出庞氏/传销靠\"新投资者钱付老投资者息\"运转，最终崩盘。不拉人、不投\"层级返利\"，等于不替骗局做分母。", "source": "国务院 (2021). 防范和处置非法集资条例（国令第737号）第二条、第十九条、第二十五条. https://www.gov.cn/zhengce/content/2021-02/10/content_5586632.htm; 公安部 (2024). 2023年打击治理电信网络诈骗犯罪成效通报（中工网报道）. https://www.workercn.cn/c/2024-01-10/8108310.shtml; SEC (无日期). Investor Alert: Ponzi Schemes Targeting Seniors. https://sec.gov/oiea/investor-alerts-and-bulletins/ia_ponziseniors", "note": "传销式非法集资常先用\"静态收益\"诱入、再用\"动态拉人奖\"扩张；既是受害者也可能因发展下线承担共犯责任，务必远离并举报。"}, {"chapter": 6, "num": 12, "id": "6-12", "title": "伪\"区块链／元宇宙／AI\"概念炒作", "grade": "A", "tags": {"钱": "0", "时间": "少", "毅力": "些", "收益": "大", "口径": "金钱", "影响": "自己／家庭"}, "impact": "自己／家庭", "cost_money": "0", "cost_time": "少", "cost_will": "些", "benefit": "大", "scope": "金钱", "three_zero": false, "cost": "一点蹭热点的冲动。", "plain": "每个风口都长出一堆\"沾边就涨\"的壳。真技术公司不需要在群里拉你入金；看不懂它怎么赚钱，就是赌标签。", "gain": "避开借新概念包装、无真实现金流的炒作盘，保住本金。监管早已盯紧此类蹭热点割韭菜：人民银行等七部门 2017 年 9·4 公告将代币融资定性为非法公开融资；十部门 2021 年 9·24 通知（银发〔2021〕237 号）明确虚拟货币相关业务一律非法金融活动，境外交易所对境内居民服务同样非法。证监会多次警示借\"区块链、元宇宙、AI\"等概念非法荐股、炒作非标资产。SEC 亦提示加密骗局用\"复杂新科技话术+高无风险回报\"伪装。《条例》第 25 条让参与损失自担。不投\"只讲概念不讲现金流\"的项目，等于不接概念泡沫的最后一棒。", "source": "中国人民银行等十部门 (2021). 关于进一步防范和处置虚拟货币交易炒作风险的通知（银发〔2021〕237号）. https://www.gov.cn/zhengce/2021-09/25/content_5639206.htm; 中国人民银行等七部门 (2017). 关于防范代币发行融资风险的公告. https://money.people.com.cn/bank/n1/2017/0904/c202331-29514147.html; SEC (无日期). Investor Alert: Watch Out for Fraudulent Digital Asset and \"Crypto\" Trading Websites. https://sec.gov/oiea/investor-alerts-and-bulletins/ia_fraudulentdigitalasset", "note": "真区块链/AI 企业的融资走正规股权或公开市场；凡以\"概念币\"\"内部份额\"\"私域入金\"募资的，多与非法集资、诈骗交织。"}, {"chapter": 6, "num": 13, "id": "6-13", "title": "虚拟盘/对赌盘：你以为在交易，其实在和庄家对赌", "grade": "A", "tags": {"钱": "0", "时间": "少", "毅力": "否", "收益": "大", "口径": "金钱", "影响": "自己／家庭"}, "impact": "自己／家庭", "cost_money": "0", "cost_time": "少", "cost_will": "否", "benefit": "大", "scope": "金钱", "three_zero": false, "cost": "几分钟核查平台是否接入真实交易所。", "plain": "真平台你的单子进交易所；假平台只是个 App 显示数字，钱直接进骗子口袋。凡是要你下载非官方 App、不看行情只看出金速度的，先假设是虚拟盘。", "gain": "避开\"入金后赚了不能出、亏了全归你\"的假盘，保住本金。证监会明确警示：伪造交易平台是\"虚拟盘\"工具，资金未进真实市场而直接转入骗子控制账户，最终以\"冻结/税费\"拖延、平台失联。公安部 2023 年处置涉诈域名网址 836.4 万个、拦截资金 3288 亿元，其中大量为虚拟盘。SEC 指出此类平台常承诺 20%–50% 无风险回报后切断联系。《防范和处置非法集资条例》第 25 条让参与损失自担。核查\"是否接入真实交易所、是否官方应用商店下载\"，等于识破对赌盘的根本骗局。", "source": "中国证监会 (无日期). 关于防范非法证券期货活动的风险提示（伪造交易平台网络诈骗）. https://www.csrc.gov.cn/xinjiang/c105515/c7613926/content.shtml; 公安部 (2024). 2023年打击治理电信网络诈骗犯罪成效通报（中工网报道）. https://www.workercn.cn/c/2024-01-10/8108310.shtml; SEC (无日期). Investor Alert: Watch Out for Fraudulent Digital Asset and \"Crypto\" Trading Websites. https://sec.gov/oiea/investor-alerts-and-bulletins/ia_fraudulentdigitalasset", "note": "虚拟盘后台可任意改价、制造\"盈利\"诱你加仓；凡\"盈利无法提现、提现要交保证金/税费\"即诈骗信号。"}, {"chapter": 6, "num": 14, "id": "6-14", "title": "微信/QQ 荐股群分层收割", "grade": "A", "tags": {"钱": "0", "时间": "少", "毅力": "否", "收益": "大", "口径": "金钱", "影响": "自己／家庭"}, "impact": "自己／家庭", "cost_money": "0", "cost_time": "少", "cost_will": "否", "benefit": "大", "scope": "金钱", "three_zero": false, "cost": "进群后\"免费牛股\"的诱惑。", "plain": "免费拉你进群、天天晒盈利，不是为了教你赚钱，是为了最后让你接盘或交会员费。真有稳定盈利术，他何必带你？", "gain": "避开\"先给甜头→带单分成→反向割韭菜\"的标准剧本，保住本金。证监会界定非法荐股三要素：\"无业务资格、推荐股票、收服务费\"；深圳证监局 2025 年披露\"购买高价商品送荐股\"\"以教育培训为名荐股\"\"大数据/AI 选股荐股\"等套路，群内\"老师\"\"赚钱群友\"多为托，受害者跟随操作常大幅亏损且维权困难。SEC 同样把\"无牌照卖家+稳赚承诺\"列为红旗。不进私域群、不买\"会员/VIP 牛股\"，等于切断被分层收割的入口。", "source": "中国证监会 (无日期). 非法证券投资咨询风险提示. https://www.csrc.gov.cn/sichuan/c104903/c3243464/content.shtml; 深圳证监局 (2025). 警惕非法荐股骗局风险提示. https://jr.sz.gov.cn/sjrb/xxgk/tzzjy/content/post_12213565.html; SEC (无日期). Investor Alert: Ponzi Schemes Targeting Seniors. https://sec.gov/oiea/investor-alerts-and-bulletins/ia_ponziseniors", "note": "群内盈利截图、成交单极易造假；引流至微信/QQ/小众 APP 规避平台监测是非法荐股典型特征。"}, {"chapter": 6, "num": 15, "id": "6-15", "title": "原油/贵金属/邮币卡现货黑平台", "grade": "A", "tags": {"钱": "0", "时间": "少", "毅力": "否", "收益": "大", "口径": "金钱", "影响": "自己／家庭"}, "impact": "自己／家庭", "cost_money": "0", "cost_time": "少", "cost_will": "否", "benefit": "大", "scope": "金钱", "three_zero": false, "cost": "高杠杆\"炒原油/炒白银/炒邮票\"的广告。", "plain": "正规期货只在合规交易所；朋友圈/群里的\"老师带炒原油贵金属\"基本是黑平台。高杠杆+无监管=送钱。", "gain": "避开后台操纵、无法出金的非法现货平台，保住本金。证监会多次专项整治非法现货交易平台，明确指出邮币卡、原油/贵金属现货\"类期货\"交易多为无牌黑平台，靠喊单、滑点、后台改价吞金。《防范和处置非法集资条例》第十九条把\"以销售商品、提供服务等名义承诺给付回报吸收资金\"列入涉嫌非法集资；第 25 条让参与损失自担。公安部 2023 年拦截涉诈资金 3288 亿元，非法现货平台是重灾区之一。只在持牌期货交易所开户，等于不被\"高杠杆黑平台\"清零。", "source": "国务院 (2021). 防范和处置非法集资条例（国令第737号）第十九条、第二十五条. https://www.gov.cn/zhengce/content/2021-02/10/content_5586632.htm; 证监会、公安部 (2021). 2020年场外配资违法犯罪典型案例（含虚拟盘诈骗）. https://www.csrc.gov.cn/jiangxi/c100771/c1764378/content.shtml; 公安部 (2024). 2023年打击治理电信网络诈骗犯罪成效通报（中工网报道）. https://www.workercn.cn/c/2024-01-10/8108310.shtml", "note": "境内合法商品期货仅在上海/郑州/大连/广州期货交易所及合规期货公司进行；微信\"老师\"带单炒原油/邮币卡基本为非法平台。"}, {"chapter": 6, "num": 16, "id": "6-16", "title": "资金盘/返利盘：拉人头发息", "grade": "A", "tags": {"钱": "0", "时间": "少", "毅力": "否", "收益": "大", "口径": "金钱", "影响": "自己／家庭／社会"}, "impact": "自己／家庭／社会", "cost_money": "0", "cost_time": "少", "cost_will": "否", "benefit": "大", "scope": "金钱", "three_zero": false, "cost": "对\"静态收益+动态拉人奖励\"的警惕。", "plain": "\"存钱每天返息、拉人头再奖一层\"——这就是庞氏的身份证。凡是收益来自新进资金而非真实利润，跑路只是早晚。", "gain": "避开庞氏结构，保住本金与人际关系。监管红线清晰：《防范和处置非法集资条例》第二条将\"许诺还本付息向不特定对象吸收资金\"定义为非法集资，第十九条列举股权/债权/资管/虚拟货币等吸收资金情形，第 25 条\"因参与非法集资受到的损失，由集资参与人自行承担\"。SEC 定义庞氏为\"用新投资者钱付老投资者息\"，红旗包括\"高回报零风险、收益长期异常稳定\"。公安部 2023 年破获电诈等案件 43.7 万起、拦截资金 3288 亿元。不投\"拉人头返利\"、不发展下线，等于不成为骗局的资金源与受害者。", "source": "国务院 (2021). 防范和处置非法集资条例（国令第737号）第二条、第十九条、第二十五条. https://www.gov.cn/zhengce/content/2021-02/10/content_5586632.htm; SEC (无日期). Investor Alert: Ponzi Schemes Targeting Seniors. https://sec.gov/oiea/investor-alerts-and-bulletins/ia_ponziseniors; 公安部 (2024). 2023年打击治理电信网络诈骗犯罪成效通报（中工网报道）. https://www.workercn.cn/c/2024-01-10/8108310.shtml", "note": "返利盘崩盘后不仅本金无归，发展下线者还可能因涉嫌非法集资/传销承担刑事责任。"}, {"chapter": 6, "num": 17, "id": "6-17", "title": "冒充官方/AI 换脸客服诈骗", "grade": "A", "tags": {"钱": "0", "时间": "少", "毅力": "否", "收益": "大", "口径": "金钱", "影响": "自己／家庭"}, "impact": "自己／家庭", "cost_money": "0", "cost_time": "少", "cost_will": "否", "benefit": "大", "scope": "金钱", "three_zero": false, "cost": "对\"客服/警官/导师\"视频或语音的盲信。", "plain": "现在骗子能用 AI 模仿你儿子声音、你领导脸。视频里喊你转账的，先挂断、用已知号码回拨核实。涉及钱，只信线下官方窗口。", "gain": "避开 AI 换脸与语音克隆伪造的\"熟人/官方\"诈骗，保住本金。证监会 2024 年风险提示已点名：不法分子用 AI 换脸、语音合成批量生成\"知名投资人士\"视频，以\"免费荐股/内部消息\"引流至私域非法荐股；公安部 2023 年拦截诈骗电话 27.5 亿次、短信 22.8 亿条、涉诈域名 836.4 万个，紧急拦截资金 3288 亿元。FTC 亦警示网恋/熟人\"教投资\"是 100% 杀猪盘（2021 年美国损失 5.47 亿美元）。涉及转账一律官方渠道二次核实，等于不被\"以假乱真\"的技术骗走钱。", "source": "中国证监会 (无日期). 关于防范非法证券期货活动的风险提示（AI技术仿冒知名投资人士非法荐股）. https://www.csrc.gov.cn/xinjiang/c105515/c7613926/content.shtml; 公安部 (2024). 2023年打击治理电信网络诈骗犯罪成效通报（中工网报道）. https://www.workercn.cn/c/2024-01-10/8108310.shtml; FTC (2022). FTC Data Show Romance Scams Hit Record High; $547 Million Reported Lost in 2021. https://www.ftc.gov/news-events/press-releases/2022/02/ftc-data-show-romance-scams-hit-record-high-547-million-reported", "note": "AI 换脸/语音可高度仿真，不能仅凭\"脸/声音\"确认身份；务必通过已知官方电话回拨或使用官方 APP 核实。"}, {"chapter": 6, "num": 18, "id": "6-18", "title": "养老/养生理财骗局", "grade": "A", "tags": {"钱": "0", "时间": "少", "毅力": "否", "收益": "大", "口径": "金钱", "影响": "自己／家庭"}, "impact": "自己／家庭", "cost_money": "0", "cost_time": "少", "cost_will": "否", "benefit": "大", "scope": "金钱", "three_zero": false, "cost": "对\"高息养老公寓/养老床位/养生理财\"的温情攻势。", "plain": "给父母看这条。凡是\"存钱送养老服务/床位、承诺高息回购\"的，先当骗子看。真养老产品不会让你把房本押出去。", "gain": "避开专盯老年人的\"以房养老\"\"预付养老\"类非法集资，保住养老钱与房产。最高法 2022 年 8 月 24 日发布 6 件养老诈骗典型案例，揭露六类套路：以\"养老服务\"预存高额返息、以\"养老项目/养老公寓\"售后返点、以\"养老产品/收藏品\"虚高定价、以\"以房养老\"诱骗抵押房屋买理财、以代办\"养老保险\"骗费、以\"养老帮扶\"免费诊疗卖高价保健品；专项行动截至 2022 年 7 月全国法院受理养老诈骗案 1394 件、执行财产 20 亿余元。《防范和处置非法集资条例》第 25 条让参与损失自担。多思多虑、多与子女商量、不信\"高额返利\"，等于守住父母的\"养老钱\"。", "source": "最高人民法院 (2022). 人民法院重点打击六类养老诈骗犯罪典型案例. https://www.court.gov.cn/zixun/xiangqing/369771.html; 最高人民法院刑三庭 (2022). 重点打击六类养老诈骗犯罪典型案例答记者问. https://www.court.gov.cn/zixun/xiangqing/369761.html; 国务院 (2021). 防范和处置非法集资条例（国令第737号）第二十五条. https://www.gov.cn/zhengce/content/2021-02/10/content_5586632.htm", "note": "养老诈骗常叠加\"情感陪护+高息承诺+抵押房产\"，子女应主动帮父母核查资质、安装国家反诈中心 APP，发现可疑立即报警。"}, {"chapter": 7, "num": 1, "id": "7-1", "title": "宽基指数基金定投（旗舰动作）", "grade": "A", "tags": {"钱": "少", "时间": "少", "毅力": "些", "收益": "中", "口径": "金钱", "影响": "自己／家庭"}, "impact": "自己／家庭", "cost_money": "少", "cost_time": "少", "cost_will": "些", "benefit": "中", "scope": "金钱", "three_zero": false, "cost": "年费率 0.03%–0.5%（如 VOO/VTI 约 0.03%，A股宽基 ETF 约 0.15%–0.5%）+ 每月几分钟设定与核对。", "plain": "全指南旗舰。不挑股、不择时、不盯盘，只买覆盖全市场的低成本指数、按月固定投入。它不承诺暴富，但把你稳稳放在长期赢家一侧。", "gain": "确定性的来源是数据——标普 SPIVA 记分卡显示，截至 2024 年的 15 年里，22 个美国股票基金类别中\"零个\"有多数主动基金跑赢基准；Large-cap 一年 65%、十年 84%、二十年 92% 跑输。同时 ICI 数据（2024）显示指数股票基金平均费率仅 0.05%，主动基金 0.64%，每年 0.6 个百分点的费用差在 30 年复利下足以吞噬约 1/4 的财富。买入并持有全市场，等于用极低成本拿到市场长期真实回报（美股百年名义约 10%、实际约 6%–7%）。", "source": "S&P Dow Jones Indices (2025). SPIVA U.S. Scorecard Year-End 2024（Exhibit，20 年期 92% 主动跑输）. <https://www.spglobal.com/spdji/en/documents/spiva/spiva-us-year-end-2024.pdf>; Fama, E. F. & French, K. R. (1993). Common Risk Factors in the Returns on Stocks and Bonds. Journal of Financial Economics 33(1), 3–56. <https://mba.tuck.dartmouth.edu/pages/faculty/ken.french/Data_Library/facts.html>; Investment Company Institute (2024). 2024 Investment Company Fact Book（指数/主动基金费率）. <https://www.ici.org/research/stats/us-funds>", "note": "证据等级 A 指\"长期、跨市场、可重复\"；A股因散户占比高，主动基金短期胜率偶尔高于美股，但费率侵蚀同样成立，故仍首选低费率宽基。SPIVA 中文口径可参考历年 SPIVA 中国版。"}, {"chapter": 7, "num": 2, "id": "7-2", "title": "股债搭配 + 定期再平衡", "grade": "B", "tags": {"钱": "少", "时间": "少", "毅力": "些", "收益": "中", "口径": "金钱", "影响": "自己"}, "impact": "自己", "cost_money": "少", "cost_time": "少", "cost_will": "些", "benefit": "中", "scope": "金钱", "three_zero": false, "cost": "一年一次检查（或偏离目标 5% 阈值时调整）；克制\"全仓股票博高收益\"的冲动。", "plain": "股票涨多了、债券跌了，就卖股买债把比例拉回目标。这不是择时，是纪律——强迫你在贵时卖、便宜时买，而且不需要任何预测能力。", "gain": "Vanguard 机构研究（2015）明确结论：月度、季度、年度再平衡的风险调整后收益\"无显著差异\"，但交易次数与成本随频率显著上升；因此建议年度/半年度监控 + 5% 阈值即可。再平衡的价值不在\"多赚\"，而在\"控制波动与最大回撤\"——经典 60/40 组合在 2008 年回撤约 −20% 至 −30%，远小于满仓股票的 −50%+，让你在恐慌时不必清仓。它同时天然执行\"高卖低买\"，且完全不依赖判断。", "source": "Vanguard Institutional Research (2015). Best Practices for Portfolio Rebalancing（Zilbering, Jaconetti, Kinniry）. <https://www.vanguard.ca/documents/best-practices-for-portfolio-rebalancing.pdf>; Vanguard (2019). Getting Back on Track: A Guide to Smart Rebalancing. <https://personal.vanguard.com/pdf/ISGGBOT.pdf>", "note": "再平衡是\"风险控制\"工具而非\"增收\"工具；在 taxable 账户频繁再平衡可能产生税单，故美股账户宜用年度阈值法，A股账户同理。"}, {"chapter": 7, "num": 3, "id": "7-3", "title": "留足 3–6 个月应急金再谈投资", "grade": "C", "tags": {"钱": "0", "时间": "少", "毅力": "些", "收益": "中", "口径": "金钱", "影响": "自己／家庭"}, "impact": "自己／家庭", "cost_money": "0", "cost_time": "少", "cost_will": "些", "benefit": "中", "scope": "金钱", "three_zero": false, "cost": "这笔钱几乎零收益（放货币基金/活期/高息储蓄），机会成本很低。", "plain": "应急金是投资体系的\"安全气囊\"。没有它，一次失业或急病会逼你在最差时点清仓。先有缓冲再冒险，顺序不能反。", "gain": "CFPB 建议应急金覆盖 3–6 个月\"必要开支\"（非总收入）；美联储 2024 年 SHEP 调查显示仍有约 37% 美国人连 400 美元意外支出都难以应付。有缓冲，意味着熊市最低点你\"不必卖\"——而被迫卖出正是散户最惨亏损场景：在低点斩仓后既锁定亏损、又错过随后的反弹。应急金把\"要不要卖\"变成\"不需要卖\"，直接保住长期复利不中断。", "source": "Consumer Financial Protection Bureau (CFPB). An Essential Guide to Building an Emergency Fund. <https://www.consumerfinance.gov/an-essential-guide-to-building-an-emergency-fund>; Federal Reserve (2024). Report on the Economic Well-Being of U.S. Households（37% 难以支付 $400 意外支出）. <https://www.federalreserve.gov/publications/2024-economic-well-being-of-us-households.htm>", "note": "自由职业/单收入家庭应取区间上沿（6 个月甚至更长）；应急金属\"防守资产\"，不应与投资本金混同，避免随手花掉。"}, {"chapter": 7, "num": 4, "id": "7-4", "title": "长期持有 + 低换手", "grade": "A", "tags": {"钱": "少", "时间": "少", "毅力": "些", "收益": "中", "口径": "金钱", "影响": "自己／家庭"}, "impact": "自己／家庭", "cost_money": "少", "cost_time": "少", "cost_will": "些", "benefit": "中", "scope": "金钱", "three_zero": false, "cost": "放弃短期刺激；承受 30%+ 账面回撤的心理压力。", "plain": "复利最强大，但要时间。每卖一次就打断一次复利、多付一次摩擦。买入好资产后\"什么都不做\"，是最难也最赚的纪律。", "gain": "交易频率直接吃掉收益。Barber & Odean（2000）用 6.6 万户券商数据发现，换手最高的五分之一账户年均净回报仅 11.4%，而换手最低组达 18.5%，市场指数 17.9%——最活跃者比最不活跃者每年少赚约 7 个百分点。DALBAR 的 QAIB（2024）显示，平均股票基金投资者全年仅赚 16.54%，落后标普 500 的 25.02% 达 848 个基点，且已连续 15 年跑输。Wells Fargo 测算：1995–2024 年若错过涨幅最大的 30 天，年化回报从 8.4% 跌到 2.1%。少动，是普通人对抗\"行为缺口\"的最廉价武器。", "source": "Barber, B. M. & Odean, T. (2000). Trading Is Hazardous to Your Wealth. Journal of Finance 55(2). <https://faculty.haas.berkeley.edu/odean/papers%20current%20versions/behavior%20of%20individual%20investors.pdf>; DALBAR (2025). Quantitative Analysis of Investor Behavior (QAIB) 2024（平均股票投资者 16.54% vs 标普 25.02%）. <https://www.dalbar.com/press-release/investors-missed-the-best-of-2024s-market-gains-latest-dalbar-investor-behavior-report-finds/>; Wells Fargo Investment Institute (2025). The Perils of Trying to Time Volatile Markets. <https://www.wellsfargoadvisors.com/research-analysis/reports/policy/volatile-markets.htm>", "note": "低换手不等于\"永远不卖\"；再平衡、基本面证伪、需用钱时仍要卖，但原则是把交易次数压到最低。"}, {"chapter": 7, "num": 5, "id": "7-5", "title": "投资自己：人力资本回报常最高", "grade": "C", "tags": {"钱": "少", "时间": "多", "毅力": "多", "收益": "中", "口径": "金钱", "影响": "自己／家庭"}, "impact": "自己／家庭", "cost_money": "少", "cost_time": "多", "cost_will": "多", "benefit": "中", "scope": "金钱", "three_zero": false, "cost": "时间、学费、精力；回报周期以年计。", "plain": "把年化 7% 提到 8% 呕心沥血；月薪 1 万提到 1.5 万同样\"回报率\"却容易得多。本金变大，才是普通人财富的真正发动机——先修好它。", "gain": "对多数人而言，主业收入提升带来的\"可投资本金\"增长，杠杆远高于任何金融技巧。月薪 1 万→1.5 万，等于可投资现金流 +50%，且持续一生；而把基金费率从 0.5% 压到 0.1% 只省 0.4 个百分点/年。世界银行《2015 世界发展报告·家庭金融》指出，家庭最稀缺的是\"财务带宽\"，提升技能与收入能同时改善储蓄率与抗风险能力。Becker 的人力资本理论也表明，教育与健康投资是长期回报最稳的\"资产\"。与其在 0.5% 的费率差上钻营，不如先把主业这台发动机做大。", "source": "World Bank (2015). World Development Report 2015: Mind, Society, and Behavior, Chapter 6 \"Household Finance\". <https://www.worldbank.org/content/dam/Worldbank/Publications/WDR/WDR%202015/Chapter-6.pdf>; Becker, G. S. (1964/1993). Human Capital: A Theoretical and Empirical Analysis. University of Chicago Press. <https://www.nobelprize.org/prizes/economic-sciences/1992/becker/facts/>", "note": "证据等级 C 因\"个人收入提升\"个体差异大、难做对照实验；但方向（本金增长 >> 费率微调）对工薪族近乎常识。"}, {"chapter": 7, "num": 6, "id": "7-6", "title": "记投资日志，事后复盘", "grade": "C", "tags": {"钱": "0", "时间": "少", "毅力": "些", "收益": "中", "口径": "金钱", "影响": "自己"}, "impact": "自己", "cost_money": "0", "cost_time": "少", "cost_will": "些", "benefit": "中", "scope": "金钱", "three_zero": false, "cost": "每笔交易写一句\"为什么买/卖、预期是什么、当时情绪\"（零金钱）。", "plain": "人擅长忘记错过的、放大蒙对的。白纸黑字记下来，市场替你打分。成本几乎为零、收益持续的\"元动作\"。", "gain": "决策日志把\"事后偏差\"显影化。行为金融发现，人会在亏损后选择性记忆、把运气当能力；写下买入逻辑与预期，半年后冷酷对照实际，能持续暴露重复错误（追高、杀跌、听消息）。SSA 的行为经济学综述与 World Bank WDR 2015 均指出，\"事前承诺/记录\"这类轻量机制能显著降低决策噪声。一项可执行做法：每次交易记录\"触发理由 + 预期持有期 + 止损/止盈条件\"，季度回看，你会发现多数亏损来自同一类行为漏洞，比任何付费课程都管用。", "source": "Social Security Administration (2010). The Role of Behavioral Economics and Behavioral Decision Making in Americans' Retirement Savings Decisions, Social Security Bulletin 70(4). <https://www.ssa.gov/policy/docs/ssb/v70n4/v70n4p1.html>; World Bank (2015). World Development Report 2015, Chapter 6 \"Household Finance\". <https://www.worldbank.org/content/dam/Worldbank/Publications/WDR/WDR%202015/Chapter-6.pdf>", "note": "日志的关键不是\"写\"，而是\"定期回看\"；只记不看等于没记。可用表格或 App，字段统一即可。"}, {"chapter": 7, "num": 7, "id": "7-7", "title": "保险兜底（医疗／寿险／意外）", "grade": "B", "tags": {"钱": "少", "时间": "少", "毅力": "些", "收益": "中", "口径": "金钱", "影响": "家庭"}, "impact": "家庭", "cost_money": "少", "cost_time": "少", "cost_will": "些", "benefit": "中", "scope": "金钱", "three_zero": false, "cost": "保费（家庭年收入 5%–10% 配齐基础保障，优先医疗+寿险+意外，慎买理财型）。", "plain": "投资是进攻，保险是防守。没兜底就重仓投资，等于前线冲猛、后方没兵。先有医疗/寿险，再谈收益。", "gain": "一次大病或意外就可能击穿投资本金与家庭现金流——World Bank WDR 2015 强调，家庭金融风险管理的第一道防线是\"防止一次性冲击把多年储蓄归零\"。没有保障的家庭，往往在危机时被迫低位变现投资、甚至借高利贷，长期复利被一刀切断。以百万医疗（年保费几百至千元）覆盖大额医疗、以定期寿险（保额=未偿房贷+子女教育+5–10 年家庭开支）覆盖支柱身故风险，杠杆极高。保险买的是\"不破产权\"，让你敢长期持有、不必因怕意外而过度保守。", "source": "World Bank (2015). World Development Report 2015, Chapter 6 \"Household Finance\"（风险管理与流动性缓冲）. <https://www.worldbank.org/content/dam/Worldbank/Publications/WDR/WDR%202015/Chapter-6.pdf>; Consumer Financial Protection Bureau (CFPB). An Essential Guide to Building an Emergency Fund（应急/抗冲击）. <https://www.consumerfinance.gov/an-essential-guide-to-building-an-emergency-fund>", "note": "保障优先于收益型保险；先配齐\"消费型\"保障，再利用投资账户增值，避免把保费变成低收益储蓄。"}, {"chapter": 7, "num": 8, "id": "7-8", "title": "复利 + 税优账户叠加", "grade": "B", "tags": {"钱": "少", "时间": "少", "毅力": "些", "收益": "中", "口径": "金钱", "影响": "自己／家庭"}, "impact": "自己／家庭", "cost_money": "少", "cost_time": "少", "cost_will": "些", "benefit": "中", "scope": "金钱", "three_zero": false, "cost": "账户规划时间；个人养老金每年缴费上限 12000 元（2024 年起全国实施）。", "plain": "税优账户 + 长期持有，是复利的两台加速器。能合法用就别浪费，尤其收入越高、边际税率越高，省得越多。", "gain": "个人养老金按财政部、税务总局公告 2022 年第 34 号（2024 年第 21 号扩至全国）执行递延纳税：缴费环节每年按 12000 元限额在综合所得中据实扣除，投资环节收益暂不征税，领取环节单独按 3% 计税。对边际税率 10%–20% 的工薪族，仅缴费抵扣一项每年即省 1200–2400 元税；若投资年化 7%、持有 30 年，12000 元/年的投入在税延+复利下可积累显著超出税后账户。叠加低费率指数，税优是普通人少有的\"确定性增益\"。", "source": "财政部、税务总局 (2022). 关于个人养老金有关个人所得税政策的公告（财政部 税务总局公告2022年第34号）. <https://sichuan.chinatax.gov.cn/art/2022/11/4/art_7757_794159.html>; 财政部、税务总局 (2024). 关于在全国范围实施个人养老金个人所得税优惠政策的公告（2024年第21号）. <http://beijing.chinatax.gov.cn/bjswj/c105411/202212/048860fe6bec43df84934d9f6dca4959.shtml>", "note": "个人养老金领取时按 3% 单独计税，适合当前边际税率高于 3% 的人群；账户内产品仍要选低费率，避免手续费吃掉税优。"}, {"chapter": 7, "num": 9, "id": "7-9", "title": "用足个税专项附加扣除", "grade": "C", "tags": {"钱": "0", "时间": "少", "毅力": "些", "收益": "中", "口径": "金钱", "影响": "自己／家庭"}, "impact": "自己／家庭", "cost_money": "0", "cost_time": "少", "cost_will": "些", "benefit": "中", "scope": "金钱", "three_zero": false, "cost": "每年在个税 App 核对并填报（几分钟）。", "plain": "这是国家给的\"免费钱\"，不领就亏。每年花几分钟核对扣除项，省下的税就是净收益。", "gain": "按《个人所得税专项附加扣除暂行办法》（国发〔2018〕41号），可扣除项含子女教育（每孩每月 1000 元起，2023 年起多孩/婴幼儿照护提至 2000 元）、继续教育、大病医疗（自付超 1.5 万部分限额 8 万）、首套房贷利息（每月 1000 元，最长 240 月）、住房租金（800–1500 元/月）、赡养老人（每月 2000–3000 元）。以独生子女+房贷+1 孩测算，每月可扣除数千元、直接降低应纳税所得额，对 10%–20% 税率人群每年净省数千元。这是零风险、确定性的\"加薪\"。", "source": "国务院 (2018). 关于印发个人所得税专项附加扣除暂行办法的通知（国发〔2018〕41号）. <https://www.gov.cn/zhengce/content/2018-12/22/content_5351181.htm>; 国家税务总局 (2025). 个税专项附加扣除信息确认指引（2025 年起子女教育/婴幼儿照护 2000、赡养老人 3000）. <https://news.cctv.cn/2025/12/01/ARTIl08Iz1MzQJNdo4Q8eF1v251201.shtml>", "note": "标准自 2019 年后多次上调，以个税 App 当年口径为准；租房与房贷利息不可同享，需择高填报。"}, {"chapter": 7, "num": 10, "id": "7-10", "title": "指数 + 打新增强（A股）", "grade": "C", "tags": {"钱": "少", "时间": "少", "毅力": "些", "收益": "中", "口径": "金钱", "影响": "自己"}, "impact": "自己", "cost_money": "少", "cost_time": "少", "cost_will": "些", "benefit": "中", "scope": "金钱", "three_zero": false, "cost": "为参与打新而维持市值的底仓波动（用宽基 ETF 即可，不必重仓高风险股）。", "plain": "底仓本来就要买，打新是顺手薅。但别为提高中签率去重仓高风险股，本末倒置。", "gain": "A股打新长期是\"低门槛增强\"，但收益随发行定价市场化而大幅波动。券商中国据 Wind 统计：新股破发率 2020 年 5.03%、2021 年 4.2%、2022 年 28.27%（高峰）、2023 年 16.61%、2024 年约 3.2%；首日平均涨幅 2021 年 157%、2022 年 30.5%、2023 年 66.5%、2024 年约 105%。可见 2022 年\"中签如接飞刀\"，而 2023 后破发回落、赚钱效应回归。在宽基底仓上顺手打新，当前仍可贡献正收益，但已非无风险，须挑着打而非无脑打。", "source": "券商中国 (2024). 打新生态变化：新股破发率降至约3%，首日平均涨幅翻倍（Wind 数据）. <https://finance.sina.com.cn/stock/zqgd/2024-04-07/doc-inaqyxpu8470694.shtml>; 新浪财经 (2024). 龙年新股平均涨幅近200%、无一破发（历年破发率）. <https://finance.sina.cn/2024-06-16/detail-inaywspq1335358.d.html>", "note": "〔争议〕破发后\"增强\"变\"拖累\"，注册制下打新收益收敛；以市值打新为主、不为此加杠杆或集中持股。2025 年破发率接近 0 为阶段性现象，非稳态。"}, {"chapter": 7, "num": 11, "id": "7-11", "title": "用条件单/自动定投代替手动", "grade": "A", "tags": {"钱": "0", "时间": "少", "毅力": "些", "收益": "中", "口径": "金钱", "影响": "自己"}, "impact": "自己", "cost_money": "0", "cost_time": "少", "cost_will": "些", "benefit": "中", "scope": "金钱", "three_zero": false, "cost": "设一次定投/条件单的时间（此后几乎零维护）。", "plain": "手动定投最大的敌人是你自己（跌了不敢买、涨了想追）。设好自动扣款/条件单，让系统替你执行，手别痒。", "gain": "行为经济学证明\"默认选项\"威力巨大。Madrian & Shea（2001）发现，401(k) 自动加入后参与率从 49% 升到 86%；Thaler & Benartzi 的\"Save More Tomorrow\"计划把员工储蓄率从 3.5% 一路自动提升到 13.6%（四次涨薪后）。对散户而言，自动定投把\"要不要买\"变成\"系统已买\"，规避了择时情绪；SSA 行为综述与诺贝尔奖得主 Thaler 均强调，自动化是把\"好意图\"变成\"实际储蓄\"的最强助推。设好就别天天看，纪律由系统兜底。", "source": "Madrian, B. C. & Shea, D. F. (2001). The Power of Suggestion: Inertia in 401(k) Participation and Savings Behavior. Quarterly Journal of Economics 116(4). <https://www.jstor.org/stable/2696507>; Thaler, R. H. & Benartzi, S. (2004). Save More Tomorrow™. Journal of Political Economy 112(S1), S164–S187. <https://www.nobelprize.org/prizes/economic-sciences/2017/thaler/159673-richard-thaler-interview-transcript>; Social Security Administration (2010). Behavioral Economics and Retirement Savings. <https://www.ssa.gov/policy/docs/ssb/v70n4/v70n4p1.html>", "note": "自动不等于\"永远不调\"；每年仍可随收入增长上调定投额（模仿 SMarT 的自动升级）。"}, {"chapter": 7, "num": 12, "id": "7-12", "title": "设\"再平衡阈值\"而非择时", "grade": "B", "tags": {"钱": "0", "时间": "少", "毅力": "些", "收益": "中", "口径": "金钱", "影响": "自己"}, "impact": "自己", "cost_money": "0", "cost_time": "少", "cost_will": "些", "benefit": "中", "scope": "金钱", "three_zero": false, "cost": "定一个偏离阈值（如 ±5% 或每年一次），写进计划。", "plain": "别猜高低点，给组合设个\"闹钟\"：偏了 5% 就调回。这是唯一不需要预言能力的\"低买高卖\"机制。", "gain": "与第 2 条同理但更强调\"规则化\"。Vanguard（2015）实证：月度/季度/年度再平衡的\"风险调整后收益无显著差异\"，而频繁再平衡只增加成本；因此用\"阈值触发\"（偏离目标 5%）而非\"日历择时\"，既减少无效交易，又保证股债比例不漂移。它的本质是拿掉\"我猜现在贵不贵\"这道谁也答不对的题，把决策交给既定规则——跌得多的资产自动被买回、涨多的被卖出，长期自然高卖低买，且完全不消耗意志力。", "source": "Vanguard Institutional Research (2015). Best Practices for Portfolio Rebalancing（5% 阈值、年度/半年度监控）. <https://www.vanguard.ca/documents/best-practices-for-portfolio-rebalancing.pdf>; Vanguard (2019). Getting Back on Track: A Guide to Smart Rebalancing. <https://personal.vanguard.com/pdf/ISGGBOT.pdf>", "note": "阈值不宜过窄（如 1%–2%）否则频繁交易损耗税费；5% 或年度法对多数人是成本与纪律的平衡点。"}, {"chapter": 7, "num": 13, "id": "7-13", "title": "关掉实时估值/少看盘", "grade": "C", "tags": {"钱": "0", "时间": "0", "毅力": "些", "收益": "中", "口径": "金钱", "影响": "自己"}, "impact": "自己", "cost_money": "0", "cost_time": "0", "cost_will": "些", "benefit": "中", "scope": "金钱", "three_zero": false, "cost": "关掉 App 推送、删自选股红绿提醒（零金钱）。", "plain": "每天看十次账户的人，八成在亏钱（见第 4、12 章数据）。把通知关了，一季度看一次，收益率反而可能更好。", "gain": "看盘频率与交易频率正相关，而交易频率吞噬收益（见第 4 条：最活跃账户年均少赚约 7 个百分点）。Barber & Odean（2000）与 DALBAR QAIB（2024：投资者落后基准 848 个基点）都指向同一结论——\"看得越多、动得越多、亏得越多\"。上交所多个年度《年鉴》也显示个人投资者收益随交易频率上升而下降。把 App 通知关掉、设\"季度检视日\"，等于用环境设计替代意志力，信息过载是亏损的燃料，少看就是少犯错。", "source": "Barber, B. M. & Odean, T. (2000). Trading Is Hazardous to Your Wealth. Journal of Finance 55(2). <https://faculty.haas.berkeley.edu/odean/papers%20current%20versions/behavior%20of%20individual%20investors.pdf>; DALBAR (2025). Quantitative Analysis of Investor Behavior (QAIB) 2024. <https://www.dalbar.com/press-release/investors-missed-the-best-of-2024s-market-gains-latest-dalbar-investor-behavior-report-finds/>", "note": "少看盘不等于不检视；每季度/半年按第 12 条阈值做一次纪律性检查即可，平时让系统自动跑。"}, {"chapter": 7, "num": 14, "id": "7-14", "title": "写好\"卖出规则\"再买", "grade": "C", "tags": {"钱": "0", "时间": "少", "毅力": "些", "收益": "中", "口径": "金钱", "影响": "自己"}, "impact": "自己", "cost_money": "0", "cost_time": "少", "cost_will": "些", "benefit": "中", "scope": "金钱", "three_zero": false, "cost": "买入前写清\"什么情况下卖\"（目标价/逻辑证伪/急用钱）。", "plain": "多数人只计划\"买\"、不计划\"卖\"，于是跌了死扛、涨了乱卖。买之前先写下\"我什么时候卖\"，等于给未来的自己上保险。", "gain": "这是\"事前承诺机制\"的应用。World Bank WDR 2015 指出，把决策规则\"嵌入产品/计划\"（如自动执行、承诺账户）能显著提升储蓄与投资纪律；SSA 行为综述也证明，事先写明的规则可对抗损失厌恶与后见之明。具体做法：买入时同步记录\"买入价、逻辑、预期持有期、证伪条件、止盈/止损线\"。当价格触发时按规则执行，下跌不慌、上涨不贪，把\"未来的情绪化我\"锁在规则里。它不提高胜率，但能稳定地减少最贵的一类错误——该卖不卖、该拿乱卖。", "source": "World Bank (2015). World Development Report 2015, Chapter 6 \"Household Finance\"（承诺机制/自动执行）. <https://www.worldbank.org/content/dam/Worldbank/Publications/WDR/WDR%202015/Chapter-6.pdf>; Social Security Administration (2010). Behavioral Economics and Retirement Savings Decisions. <https://www.ssa.gov/policy/docs/ssb/v70n4/v70n4p1.html>", "note": "规则要\"可操作、可验证\"（如\"跌破 XX 且基本面变化才卖\"），模糊规则等于没规则；并与第 6 条投资日志配合复盘。"}, {"chapter": 8, "num": 1, "id": "8-1", "title": "个人养老金账户递延纳税", "grade": "A", "tags": {"钱": "少", "时间": "少", "毅力": "些", "收益": "中", "口径": "金钱", "影响": "自己／后代"}, "impact": "自己／后代", "cost_money": "少", "cost_time": "少", "cost_will": "些", "benefit": "中", "scope": "金钱", "three_zero": false, "cost": "开户（通过商业银行开立唯一个人养老金资金账户）+ 每年最多 12000 元额度规划，且退休前一般不可随意取出。", "plain": "收入越高，税前扣除越值钱。这 12000 是政策给的\"免税投资额度\"，不用的等于白白交税。", "gain": "个人养老金实行\"缴费—投资—领取\"三环节递延纳税。缴费时每年最多 12000 元在综合所得或经营所得中据实扣除（财政部 税务总局公告2022年第34号第一条）；投资环节账户内收益暂不征税；领取环节不并入综合所得，单独按 3% 税率缴纳。对适用 10%、20% 甚至更高边际税率的纳税人，相当于把高税率下的本金放到 3% 税率下取出。以边际税率 20% 者年缴 12000 元、投资 30 年、年化 6% 粗略估算：30 年后账户本息约 68.7 万元，若未享税优同样本金在 20% 计税下将多缴数十万元，而 3% 领取税仅约 2 万元，净省可观。2024 年起已推广至全国（2024年第21号公告）。", "source": "财政部 税务总局 (2022). 关于个人养老金有关个人所得税政策的公告（财政部 税务总局公告2022年第34号 第一条）. <https://szs.mof.gov.cn/zhengcefabu/202211/t20221104_3849838.htm>; 国务院办公厅 (2022). 关于推动个人养老金发展的意见（国办发〔2022〕7号）. <https://www.ndrc.gov.cn/fggz/jyysr/jysrsbxf/202205/t20220519_1324824.html>; 财政部 税务总局 (2024). 关于在全国范围实施个人养老金个人所得税优惠政策的公告（财政部 税务总局公告2024年第21号）. <https://shaanxi.chinatax.gov.cn/art/2024/12/20/art_33494_629720.html>", "note": "仅适用于在中国境内参加基本养老保险的劳动者；领取条件含达到退休年龄、完全丧失劳动能力、出国（境）定居等；缴费扣除凭证由个人养老金信息管理服务平台出具，提前支取除受 3% 税外还受账户规则限制。"}, {"chapter": 8, "num": 2, "id": "8-2", "title": "股息红利差别化：长期持有免税", "grade": "A", "tags": {"钱": "0", "时间": "0", "毅力": "些", "收益": "中", "口径": "金钱", "影响": "自己"}, "impact": "自己", "cost_money": "0", "cost_time": "0", "cost_will": "些", "benefit": "中", "scope": "金钱", "three_zero": false, "cost": "持有股票／基金满 1 年（不是卖出），且须为\"公开发行和转让市场\"取得的上市公司股票。", "plain": "分红再投资叠上\"拿满一年\"，股息端几乎零税。短线炒分红股反而被扣税，不划算。", "gain": "持股超 1 年的股息红利免征个人所得税；持股 1 个月以内（含）全额计入按 20% 征税；1 个月以上至 1 年（含）减按 50% 计入、统一适用 20%（财税〔2015〕101号第一条）。举例：10 万元本金、年化股息率 3% 即年分红 3000 元——持股不足 1 月卖出被扣 20% 缴 600 元，持有满 1 年则 0 元。长期持有优质分红股，股息端近乎零税，叠加复利再投资，是普通人最省心的税后增厚。\"持股期限\"按先进先出、从买入到卖出前一日连续计算。", "source": "财政部 国家税务总局 证监会 (2015). 关于上市公司股息红利差别化个人所得税政策有关问题的通知（财税〔2015〕101号 第一条）. <https://www.chinatax.gov.cn/chinatax/n810341/n810765/n1465977/201510/c1967339/content.html>; 国家税务总局12366 (2015). 个人取得上市公司股息红利如何征收个人所得税. <https://12366.chinatax.gov.cn/sscx/detail?code=0000000002013050300023>", "note": "适用沪深上市公司股票及新三板挂牌公司；通过有限合伙、契约型基金分红穿透到个人时可能不适用差别化；股权登记日在 2015 年 9 月 8 日之后方按本通知执行。"}, {"chapter": 8, "num": 3, "id": "8-3", "title": "资本利得：A股暂免，但别据此乱动", "grade": "A", "tags": {"钱": "0", "时间": "少", "毅力": "些", "收益": "中", "口径": "金钱", "影响": "自己"}, "impact": "自己", "cost_money": "0", "cost_time": "少", "cost_will": "些", "benefit": "中", "scope": "金钱", "three_zero": false, "cost": "一点对税制的了解，以及克制频繁交易的纪律。", "plain": "A股资本利得免税是现状，但别为了\"避税\"做无意义的频繁交易——摩擦和择时损耗远大于税。税不是你亏钱的主因，手痒才是。", "gain": "个人转让沪深上市公司股票所得，自 1997 年 1 月 1 日起继续暂免征收个税（财税字〔1998〕61号）；公募基金份额买卖价差同样在免税范畴。对比美国：短期资本利得按普通所得税率（最高 37%）征税，长期（持有超 1 年）资本利得适用 0%／15%／20% 三档（IRS Topic 409）。A 股的差价免税是实打实的制度红利，但买卖需缴证券交易印花税（目前出让方单边 0.05%，2023 年 8 月 28 日起减半）及券商佣金，频繁交易的摩擦成本远高于本就不征的资本利得税。", "source": "财政部 国家税务总局 (1998). 关于个人转让股票所得继续暂免征收个人所得税的通知（财税字〔1998〕61号）. <https://shanghai.chinatax.gov.cn/zcfw/zcfgk/grsds/200402/t288650.html>; Internal Revenue Service (2025). Topic no. 409, Capital gains and losses. <https://www.irs.gov/taxtopics/tc409>", "note": "仅\"上市公司股票\"转让所得暂免；限售股转让自 2009 年起按 20% 征税（财税〔2009〕167号）；境外市场股票按所在国税法，美国长期资本利得仍可能触及 3.8% 净投资所得税附加。"}, {"chapter": 8, "num": 4, "id": "8-4", "title": "家庭内部资产隔离与婚前财产", "grade": "B", "tags": {"钱": "少", "时间": "少", "毅力": "些", "收益": "中", "口径": "金钱", "影响": "家庭"}, "impact": "家庭", "cost_money": "少", "cost_time": "少", "cost_will": "些", "benefit": "中", "scope": "金钱", "three_zero": false, "cost": "一点法律与账户规划（分设账户、转账备注、书面约定），必要时咨询律师。", "plain": "投资账户与负债账户尽量分清，大额资产留痕（转账备注、协议）。不是算计，是给家庭资产装一道防火墙。", "gain": "《民法典》第 1063 条明确一方的婚前财产为夫妻一方的个人财产；第 1065 条允许男女双方书面约定婚姻关系存续期间所得及婚前财产归各自所有、共同所有或部分各自所有，对双方具有法律约束力（对抗第三人需相对人知情）。通过账户分设、转账备注、赠与／婚前协议留痕，可降低婚姻变故、个人债务牵连对投资本金的击穿风险。举例：婚前以个人卡买入并长期持有的股票、基金，若账户与婚后工资卡隔离且资金来源清晰，离婚时更易界定为个人财产。", "source": "全国人民代表大会 (2020). 中华人民共和国民法典（第一千零六十三条、第一千零六十五条）. <https://www.spp.gov.cn/spp/ssmfdyflvdtpgz/202008/t20200831_478417.shtml>; 新疆维吾尔自治区司法厅 (2022). 民法典\"夫妻财产\"法条梳理与解读. <https://sft.xinjiang.gov.cn/xjsft/fzsj/202209/9abcedfd9fab4b1cb36820233a7e6ebe.shtml>", "note": "〔争议〕具体安排涉及情感与个案，建议咨询专业律师而非照搬网络模板；婚后\"生产、经营、投资的收益\"可能认定为共同财产，隔离效果需结合资金流向举证，并非签了协议就万事大吉。"}, {"chapter": 8, "num": 5, "id": "8-5", "title": "个人养老金领取按 3% 缴税", "grade": "A", "tags": {"钱": "少", "时间": "少", "毅力": "些", "收益": "中", "口径": "金钱", "影响": "自己／后代"}, "impact": "自己／后代", "cost_money": "少", "cost_time": "少", "cost_will": "些", "benefit": "中", "scope": "金钱", "three_zero": false, "cost": "理解\"缴费递延、领取缴 3%\"的规则，并开立唯一资金账户、留存凭证至退休。", "plain": "个人养老金不是\"完全免税\"，是\"晚点交、少点交\"。领取时只按 3% 缴，比多数人边际税率低，收入越高越划算。", "gain": "个人养老金并非完全免税，而是\"延迟缴、低税率缴\"。缴费与投资环节递延个税，领取时单独按 3% 缴纳、不并入综合所得（2022年第34号第一条；2024年第21号全国实施）。对综合所得边际税率 10% 及以上者均划算：若边际税率 20%，缴费时每 1.2 万元省 2000 元税、领取时仅缴 360 元，净省约 1640 元／年，30 年折现后仍可观；即便边际税率恰为 3% 的低收入者，因投资期免税复利也略有增益，只是节税幅度小。", "source": "财政部 税务总局 (2022). 关于个人养老金有关个人所得税政策的公告（财政部 税务总局公告2022年第34号 第一条）. <https://szs.mof.gov.cn/zhengcefabu/202211/t20221104_3849838.htm>; 财政部 税务总局 (2024). 关于在全国范围实施个人养老金个人所得税优惠政策的公告（财政部 税务总局公告2024年第21号）. <https://shaanxi.chinatax.gov.cn/art/2024/12/20/art_33494_629720.html>", "note": "2024 年第 21 号将先行试点扩至全国；领取由开立资金账户的商业银行代扣代缴；达到领取基本养老金年龄等条件方可领取，方式一经确定不得更改，死亡后账户资产可继承。"}, {"chapter": 8, "num": 6, "id": "8-6", "title": "国债与地方政府债利息免税", "grade": "A", "tags": {"钱": "少", "时间": "0", "毅力": "否", "收益": "中", "口径": "金钱", "影响": "自己"}, "impact": "自己", "cost_money": "少", "cost_time": "0", "cost_will": "否", "benefit": "中", "scope": "金钱", "three_zero": false, "cost": "零。只需在配置稳健资金时优先识别\"国债／地方债\"而非应税固收。", "plain": "同样拿 3% 利息，存款利息暂免但逻辑在，国债利息一分不交。对大额稳健资金，国债的\"税后优势\"是真金白银。", "gain": "《个人所得税法》第四条第二项规定，国债和国家发行的金融债券利息免征个税；同法第三条利息、股息、红利所得一般按 20% 比例税率。同等 3% 名义收益率下：100 万元买 3% 免税国债年利息 3 万元全留袋；若换成需缴 20% 的普通利息类资产则到手仅 2.4 万元，税后差 6000 元／年。地方政府债利息同样免税且票息常高于同期限国债，对税率高、求稳的大额资金，税后优势随本金放大。", "source": "全国人民代表大会 (2018). 中华人民共和国个人所得税法（第四条、第三条）. <https://sichuan.chinatax.gov.cn/art/2018/10/30/art_2683_100535.html>", "note": "仅\"国家发行的金融债券\"免税，范围以财政部发行口径为准；企业债、私募债、非标固收的利息仍按 20% 应税，配置时勿混为一谈。"}, {"chapter": 8, "num": 7, "id": "8-7", "title": "税优健康险：税前扣除额度", "grade": "A", "tags": {"钱": "少", "时间": "少", "毅力": "些", "收益": "中", "口径": "金钱", "影响": "自己／家庭"}, "impact": "自己／家庭", "cost_money": "少", "cost_time": "少", "cost_will": "些", "benefit": "中", "scope": "金钱", "three_zero": false, "cost": "每年最高 2400 元税前扣除额度内配置指定健康险，并确认保单带\"税优识别码\"。", "plain": "每年 2400 元额度，买指定健康险能抵税。额度不大，但\"保障+节税\"双得，顺手配不亏。", "gain": "个人购买符合规定的商业健康保险产品，支出可在计算应纳税所得额时税前扣除，限额 2400 元／年（200 元／月），为个税法减除费用标准之外的额外扣除（财税〔2017〕39号第一条）。对边际税率 10% 者年省 240 元、20% 者省 480 元、45% 者省 1080 元，额度虽小但\"保障+节税\"兼得。2023 年起产品扩至医疗保险、长期护理保险、疾病保险（金规〔2023〕2号），被保险人不限本人，可为配偶、子女、父母。", "source": "财政部 国家税务总局 保监会 (2017). 关于将商业健康保险个人所得税试点政策推广到全国范围实施的通知（财税〔2017〕39号 第一条）. <https://12366.chinatax.gov.cn/fwtz/print?bh=0000000002015072800012&iszs=1>; 国家税务总局上海市税务局 (2017). 关于将商业健康保险个人所得税试点政策推广到全国范围实施的通知（财税〔2017〕39号 全文）. <https://shanghai.chinatax.gov.cn/gate/big5/shanghai.chinatax.gov.cn/zcfw/zcfgk/grsds/201705/t432115.html>", "note": "保单须带\"税优识别码\"（国家税务总局公告2017年第17号），无码不得扣除；单位统一购买的视同个人购买按限额扣；一年内保费超过 2400 元部分不得扣除，退保须及时告知扣缴单位。"}, {"chapter": 8, "num": 8, "id": "8-8", "title": "专项附加扣除：人人可用的抵税额度", "grade": "A", "tags": {"钱": "少", "时间": "少", "毅力": "些", "收益": "中", "口径": "金钱", "影响": "自己／家庭"}, "impact": "自己／家庭", "cost_money": "少", "cost_time": "少", "cost_will": "些", "benefit": "中", "scope": "金钱", "three_zero": false, "cost": "在个税 App 填报子女教育、房贷利息、赡养父母等项，每年汇算清缴前核对一次。", "plain": "这些扣除不用你多花钱，只是填表。不填就是白白多交税。每年汇算清缴前都核一遍。", "gain": "标准（国发〔2018〕41号）：子女教育每孩 1000 元／月（可父母各 500）；继续教育学历 400 元／月（最长 48 个月）或取证当年 3600 元；大病医疗自付超 1.5 万元部分在 8 万元限额据实扣；首套房贷利息 1000 元／月（最长 240 个月）；住房租金 800／1100／1500 元／月（按城市）；赡养老人独生子女 2000 元／月、非独生分摊不超 1000 元／月。以双职工＋1 孩＋房贷＋赡养老人计，年扣除额可达 (1000+1000+2000)×12=4.8 万元，边际税率 20% 者年省 9600 元，零成本纯减税。", "source": "国务院 (2018). 个人所得税专项附加扣除暂行办法（国发〔2018〕41号）. <https://www.gov.cn/xinwen/2018-12/22/content_5351198.htm>; 中国政府网 (2018). 《办法》明确了六项专项附加扣除（解读）. <https://www.gov.cn/xinwen/2018-12/24/content_5351641.htm>", "note": "标准自 2019 年 1 月 1 日施行，后续或随民生支出调整；住房租金与首套房贷利息不可同时享受；相关信息由教育、医保、住建等部门共享核验，虚假填报有信用与法律风险。"}, {"chapter": 8, "num": 9, "id": "8-9", "title": "企业年金／职业年金：第二支柱别漏", "grade": "A", "tags": {"钱": "少", "时间": "少", "毅力": "些", "收益": "中", "口径": "金钱", "影响": "自己／后代"}, "impact": "自己／后代", "cost_money": "少", "cost_time": "少", "cost_will": "些", "benefit": "中", "scope": "金钱", "three_zero": false, "cost": "确认单位是否建立年金、个人缴费比例，并弄清离职时的转移接续规则。", "plain": "有单位年金的人别忽视它——这是工资外的\"强制储蓄＋税优\"，离职时弄明白转移接续规则。", "gain": "若单位建立年金，单位缴费计入个人账户时个人暂不缴税；个人缴费在不超过本人缴费工资计税基数 4% 标准内的部分，从当期应纳税所得额扣除；基金投资运营收益分配进个人账户时暂不缴税（财税〔2013〕103号第一、二条）。这是工资外的\"强制储蓄+税延\"，长期滚动可观。例：月薪 2 万、年缴费工资基数 24 万，个人按 4% 缴 9600 元可税前扣除，单位配比缴费亦递延；若投资年化 5%、缴 20 年，账户可达约数十万元且期间免税增值。", "source": "财政部 人力资源社会保障部 国家税务总局 (2013). 关于企业年金 职业年金个人所得税有关问题的通知（财税〔2013〕103号 第一、二条）. <https://shanghai.chinatax.gov.cn/gate/big5/shanghai.chinatax.gov.cn/zcfw/zcfgk/grsds/201312/t405472.html>", "note": "财税〔2013〕103号第三条第 1、3 项已废止（财税〔2018〕164号衔接），领取时按\"工资、薪金所得\"税率计征；仅单位已建立年金者适用，个人无法单独参保。"}, {"chapter": 8, "num": 10, "id": "8-10", "title": "个人养老金可投产品：选低费率指数为主", "grade": "B", "tags": {"钱": "少", "时间": "少", "毅力": "些", "收益": "中", "口径": "金钱", "影响": "自己／后代"}, "impact": "自己／后代", "cost_money": "少", "cost_time": "少", "cost_will": "些", "benefit": "中", "scope": "金钱", "three_zero": false, "cost": "在账户内挑产品时优先低费率、宽基、长期持有，避免追高费率的主动产品。", "plain": "进了养老金账户也别乱买。税优是账户的，产品费率还得自己挑低的一档，否则税省的被费吃了。", "gain": "账户内可投储蓄存款、理财、商业养老保险、公募基金等（国办发〔2022〕7号），但内部费率差异巨大：主动权益基金年化管理费+托管费常达 1.5% 以上，宽基指数 ETF 仅约 0.2%。以账户年均市值 10 万元、持有 20 年、费率差 1.3% 计，仅费率就侵蚀约 10 万×[(1+0.013)^20−1]≈2.96 万元——足以抵消每年 12000 元缴费带来的税优。结论：优先选低费率、宽基、长期持有的指数或目标日期产品，别让\"费\"吃掉\"税\"。", "source": "国务院办公厅 (2022). 关于推动个人养老金发展的意见（国办发〔2022〕7号 投资范围条款）. <https://www.ndrc.gov.cn/fggz/jyysr/jysrsbxf/202205/t20220519_1324824.html>; 财政部 税务总局 (2022). 关于个人养老金有关个人所得税政策的公告（财政部 税务总局公告2022年第34号）. <https://szs.mof.gov.cn/zhengcefabu/202211/t20221104_3849838.htm>", "note": "产品风险由个人承担；低费率不等于低风险，须匹配自身风险承受能力与距离退休的年限，临近退休应逐步降低权益敞口。"}, {"chapter": 8, "num": 11, "id": "8-11", "title": "公益慈善捐赠可抵税，但别为抵税而捐", "grade": "A", "tags": {"钱": "少", "时间": "少", "毅力": "些", "收益": "中", "口径": "金钱", "影响": "自己"}, "impact": "自己", "cost_money": "少", "cost_time": "少", "cost_will": "些", "benefit": "中", "scope": "金钱", "three_zero": false, "cost": "通过有资质公益性社会组织或县级以上政府捐赠，并取得、留存捐赠票据 5 年。", "plain": "本就要捐的，走合规渠道留票据能抵税；为了抵税硬捐不划算。顺序永远是\"先想捐不捐，再想怎么抵\"。", "gain": "个人通过境内公益性社会组织或县级以上政府向教育、扶贫、济困等公益慈善事业捐赠，捐赠额未超过应纳税所得额 30% 的部分可税前扣除；国务院规定全额扣除的（如特定公益基金会）从其规定（个人所得税法第六条；财政部 税务总局公告2019年第99号）。例：年综合所得应纳税所得额 50 万元，捐赠 15 万元（恰为 30%）可全扣，边际税率 45% 者省 6.75 万元、20% 者省 3 万元。扣除基数为\"扣除捐赠前\"的应纳税所得额。", "source": "财政部 税务总局 (2019). 关于公益慈善事业捐赠个人所得税政策的公告（财政部 税务总局公告2019年第99号 第二、三条）. <https://www.chinatax.gov.cn/chinatax/n810341/n810765/c101653/202001/c5149328/content.html>; 全国人民代表大会 (2018). 中华人民共和国个人所得税法（第六条）. <https://sichuan.chinatax.gov.cn/art/2018/10/30/art_2683_100535.html>", "note": "股权／房产捐赠按财产原值确定金额；通过无资质平台（如个人求助链接）或非公益定向捐赠不可扣；居民个人在综合所得、分类所得、经营所得中可自行决定扣除顺序。"}, {"chapter": 8, "num": 12, "id": "8-12", "title": "继承与赠与的税务边界：目前遗产税未开征", "grade": "B", "tags": {"钱": "少", "时间": "少", "毅力": "些", "收益": "中", "口径": "金钱", "影响": "家庭／后代"}, "impact": "家庭／后代", "cost_money": "少", "cost_time": "少", "cost_will": "些", "benefit": "中", "scope": "金钱", "three_zero": false, "cost": "了解现行规则，不轻信\"遗产税马上来\"的焦虑营销，过户前算清契税与印花税。", "plain": "别被\"赶紧过户避遗产税\"的话术吓着——国内暂无遗产税。但房产赠与／继承仍有交易税费，过户前算清成本。", "gain": "我国现行未开征遗产税与赠与税，法定继承人继承房产、车辆不征遗产税（12348 青海法网；契税法第六条法定继承人继承土地、房屋权属免征契税）。但过户仍有真实税费：非法定继承人受遗赠按赠与征契税（3%–5%，部分城市 3%）；继承／赠与房产按产权转移书据缴印花税（万分之五）；若继承后再转让且不满足\"满五唯一\"，可能按差额 20% 或全额 1% 缴个税（12366）。所以真正要算清的是契税、印花税与未来再交易的个税成本。", "source": "青海省公共法律服务 (2025). 继承父母的车子、房子（税费解答）. <https://qh.12348.gov.cn/pub/qhfw/zxfw/dhal/202507/t20250715_126642.html>; 国家税务总局12366 (咨询). 房产继承与赠与涉及税费. <https://12366.chinatax.gov.cn/nszx/onlinemessage/detail?id=9c81be77b91c494399e7470f4adbe3e4>", "note": "房产再转让\"满五唯一\"免征个税是关键筹划点；各地契税、印花税细节以当地税务机关为准，网络\"20%遗产税\"说法无法律依据。"}, {"chapter": 8, "num": 13, "id": "8-13", "title": "海外金融资产与 CRS 信息交换", "grade": "A", "tags": {"钱": "少", "时间": "少", "毅力": "些", "收益": "中", "口径": "金钱", "影响": "自己"}, "impact": "自己", "cost_money": "少", "cost_time": "少", "cost_will": "些", "benefit": "中", "scope": "金钱", "three_zero": false, "cost": "开境外账户时如实填写\"税收居民身份声明文件\"，了解 CRS 申报义务。", "plain": "想靠境外账户藏钱避税，基本已不现实。CRS 让各国税务互通，合规申报才是正路。", "gain": "CRS（共同申报准则）由 OECD 于 2014 年发布，中国 2014 年承诺实施、2017 年《非居民金融账户涉税信息尽职调查管理办法》（国家税务总局公告2017年第14号）落地、2018 年 9 月首次与百余辖区交换。金融机构每年识别非居民账户并报送账户余额、利息、股息、金融资产出售收入等，自动交换至税收居民国。截至 2025 年 4 月全球 170 个辖区承诺、中国交换伙伴达 123 个（国家税务总局英文站）。这意味着借境外账户藏匿资产避税已基本不可行；同时\"税收居民身份\"以居住痕迹为准，而非仅看护照国籍。", "source": "国家税务总局 财政部 人民银行 银监会 证监会 保监会 (2017). 关于发布《非居民金融账户涉税信息尽职调查管理办法》的公告（国家税务总局公告2017年第14号）. <https://www.chinatax.gov.cn/chinatax/n810214/c102374/c102377/c102378/c2990907/content.html>; 国家税务总局 (英文站). China's Exchange of Information Network / CRS Implementation. <https://www.chinatax.gov.cn/eng/c101270/c101275/c5157937/content.html>", "note": "中国版 CRS 申报主体为金融机构而非个人；\"税收居民\"≠国籍，住满 183 天等规则见个税法及税收协定；故意隐匿身份或资产可能触发反避税与法律责任，跨境投资务必如实申报。"}, {"chapter": 9, "num": 1, "id": "9-1", "title": "年轻人（20–35）：高股比 + 砸人力资本", "grade": "A", "tags": {"钱": "少", "时间": "多", "毅力": "多", "收益": "中", "口径": "金钱", "影响": "自己／后代"}, "impact": "自己／后代", "cost_money": "少", "cost_time": "多", "cost_will": "多", "benefit": "中", "scope": "金钱", "three_zero": false, "cost": "把时间精力投入主业技能与职场复利，而非盯盘炒短线；每月固定储蓄用于定投，而非消费性支出。", "plain": "年轻亏得起时间，先别怕波动。这时候你最大的资产是你自己——未来几十年的工资能力，不是账户里那几万块。把股比拉高、把本事练硬，比研究哪只基金涨得快重要十倍。", "gain": "年轻人\"总财富\"= 金融资产 + 人力资本，其中人力资本（未来工资现值）占比最高，且可通过多工作、晚退休来自我保险，因此理论最优是把金融财富中较高比例（约 70%–90%）配权益，用三五十年跨度吸收波动、赚取股权风险溢价。按\"100−年龄\"法则，25 岁对应 75% 权益、35 岁对应 65%。复利差距极其可观：若 25 岁起每月定投 2000 元、年化 7%，到 60 岁约累积 380 万元（名义值）；同样金额若拖到 35 岁才开始，只剩约 180 万元——少掉的 200 万几乎全来自\"晚十年的复利起点\"，而非收益率高低。", "source": "美联储波士顿分行 (2007). The Theory of Life-Cycle Saving and Investing（工作论文，系统引述 Bodie, Merton & Samuelson 1992 的生命周期模型）. <https://www.bostonfed.org/-/media/Documents/Workingpapers/PDF/ppdp0703.pdf>; Pomegra (无日期). The 100-Minus-Age Heuristic（\"100−年龄\"法则起源与逻辑）. <https://pomegra.io/learn/library/track-c-strategies/first-portfolio/chapter-03-asset-allocation-the-most-important-decision/the-100-minus-age-heuristic>", "note": "模型假设人力资本\"类债券\"（低风险）。若你的收入本身与股市强相关（如金融、地产从业者），最优股比应低于法则值，详见条 11；定级 A 基于成熟学术共识，但比例为经验区间而非精确处方。"}, {"chapter": 9, "num": 2, "id": "9-2", "title": "中年（35–55）：配置 + 保险 + 教育金", "grade": "B", "tags": {"钱": "少", "时间": "少", "毅力": "些", "收益": "中", "口径": "金钱", "影响": "家庭／后代"}, "impact": "家庭／后代", "cost_money": "少", "cost_time": "少", "cost_will": "些", "benefit": "中", "scope": "金钱", "three_zero": false, "cost": "定期保费（寿险/重疾/医疗/意外）、孩子教育金定投、每年再平衡与保单检视的时间精力。", "plain": "这阶段你不是一个人，是全家防线。股比按\"100−年龄\"降到约 45%–65%（35 岁约 65%、55 岁约 45%），保险买齐，孩子教育金单独隔离。别再 all in 赌单一标的，责任最重的时候最怕一损俱损。", "gain": "35–55 岁是家庭责任峰值期（房贷、子女、父母赡养叠加），用\"权益+债券+保障\"的稳健组合替代年轻时单一高股比，能显著降低\"失业+生病+熊市\"三杀同时击穿现金流的概率。保险在此不是收益工具而是\"止损线\"：一笔定期寿险能以年缴数千元撬动百万级身故赔付，避免顶梁柱倒下后家庭被迫在低点变卖资产。教育金则通过独立账户定投，把 15–20 年后的刚性支出提前用时间摊平，避免到期那年正逢熊市。", "source": "美联储波士顿分行 (2007). The Theory of Life-Cycle Saving and Investing. <https://www.bostonfed.org/-/media/Documents/Workingpapers/PDF/ppdp0703.pdf>; 中国人民银行调查统计司 (2023). 2023年第二季度城镇储户问卷调查报告（居民未来三月增加支出首位为\"教育\"27.1%）. <https://finance.people.com.cn/n1/2023/0629/c1004-40024314.html>", "note": "具体股比应随收入稳定性、风险偏好上下浮动 10 个百分点（稳定编制可略高、波动收入应更低）；定级 B 因比例为经验法则、缺乏针对中国家庭的严格实证最优解，交叉参见条 5、9、10。"}, {"chapter": 9, "num": 3, "id": "9-3", "title": "临近退休（55–65）：逐年降波动", "grade": "A", "tags": {"钱": "少", "时间": "少", "毅力": "些", "收益": "中", "口径": "金钱", "影响": "自己／家庭"}, "impact": "自己／家庭", "cost_money": "少", "cost_time": "少", "cost_will": "些", "benefit": "中", "scope": "金钱", "three_zero": false, "cost": "主动放弃最后冲高收益，用 5–10 年把组合从权益逐步换到债券/存款/年金。", "plain": "快退休时最怕\"临门一脚被深套\"。提前十年慢慢把股换债，用时间换安全，别赌最后一程——你要的是确定能拿到手的退休金，不是账户里虚高的浮盈。", "gain": "用 5–10 年滑梯式（glide path）把股比从约 45% 平滑降到 30%–40%，可躲开\"退休前一年遇熊市\"的致命回撤。学术与产品实践都支持这一点：目标日期基金（TDF）正是把\"随年龄自动降波动\"做成标准化产品的典型，其下滑曲线在退休时点通常保留 35%–50% 权益以对冲长寿通胀。反之，若 60 岁仍满仓权益、次年遇 2008 式 −40% 回撤，退休本金直接缩水四成，且已无工资可补，恢复窗口极短。", "source": "美联储波士顿分行 (2007). The Theory of Life-Cycle Saving and Investing（生命周期降风险路径）. <https://www.bostonfed.org/-/media/Documents/Workingpapers/PDF/ppdp0703.pdf>; Pomegra (无日期). The 100-Minus-Age Rule（滑梯路径与目标日期基金对照）. <https://pomegra.io/learn/library/track-c-strategies/passive-investing/chapter-12-asset-allocation-glide-paths/07-100-minus-age-rule>", "note": "若养老金（社保+企业/个人养老金）已能覆盖基本生活，可保留更高权益以抗通胀；定级 A 基于生命周期理论与 TDF 实证，但下滑节奏需结合个人养老金替代率个性化调整。"}, {"chapter": 9, "num": 4, "id": "9-4", "title": "退休后：现金流优先", "grade": "A", "tags": {"钱": "少", "时间": "少", "毅力": "些", "收益": "中", "口径": "金钱", "影响": "自己"}, "impact": "自己", "cost_money": "少", "cost_time": "少", "cost_will": "些", "benefit": "中", "scope": "金钱", "three_zero": false, "cost": "接受部分收益确定性——用债券利息、红利、年金、社保替代高波动权益仓位。", "plain": "退休后账户是提款机不是赌场。留 1–2 年生活费在货基/存款随时取，其余靠现金流（股息、债息、年金、养老金）覆盖开支，千万别在市场低位砍仓取钱。", "gain": "退休组合的命门是\"可持续提取率\"。Bengen（1994）用 1926–1992 美股数据回测提出\"4% 法则\"：退休首年提取组合价值的 4%、之后按通胀逐年上调，在 30 年退休期内从未失败，对应\"退休需备 25 倍年支出\"。金融规划协会 2023 年用债券指数重算，SAFEMAX 仍在 4.5% 附近。换言之，若年开支 12 万元，约需 300 万元可投资资产支撑 30 年。保留 1–2 年现金缓冲，可避免熊市第一年被迫低价卖股、触发本金螺旋。", "source": "Bengen, W. (1994). Determining Withdrawal Rates Using Historical Data, Journal of Financial Planning（4% 法则原文；作者本人复述见）. <https://www.bengenfs.com/the-4-percent-rule/>; 美国金融规划协会 (2023). Revisiting William Bengen's 'SAFEMAX' Portfolio Withdrawal Rate（SAFEMAX 约 4.5%）. <https://www.financialplanningassociation.org/learning/publications/journal/NOV23-revisiting-william-bengens-safemax-portfolio-withdrawal-rate-OPEN>", "note": "4% 法则基于美国历史、未计税费与医疗通胀；中国无风险利率更低、医疗自付比例更高，实际安全提取率可能低于 4%，应结合社保与商业养老险补足，交叉参见条 13。"}, {"chapter": 9, "num": 5, "id": "9-5", "title": "单收入家庭：先保\"顶梁柱\"再谈收益", "grade": "B", "tags": {"钱": "少", "时间": "少", "毅力": "些", "收益": "中", "口径": "金钱", "影响": "家庭"}, "impact": "家庭", "cost_money": "少", "cost_time": "少", "cost_will": "些", "benefit": "中", "scope": "金钱", "three_zero": false, "cost": "优先给赚钱的人配齐定期寿险、重疾险、医疗险、意外险，保费占家庭预算一小部分。", "plain": "一家人的收入靠一个人扛，那就先把这个人保牢。别本末倒置先给孩子买一堆理财险、顶梁柱却裸奔——顶梁柱倒下，孩子的理财险保费都可能交不起。", "gain": "单收入家庭没有\"第二份工资\"兜底，顶梁柱一旦身故或失能，等于家庭现金流瞬间归零，投资组合也不得不在低点变现。一笔年缴数千元的定期寿险即可撬动百万级身故赔付，把\"收入中断\"的尾部风险转移给保险公司。保障顺序的铁律是：赚钱的人优先于不赚钱的人、保障型优先于理财型。央行 2023 年调查显示居民仍偏爱理财类（43.8%）远胜保险（13%），恰恰说明单收入家庭最易踩的坑是\"重收益、轻保障\"。", "source": "中国人民银行调查统计司 (2023). 2023年第二季度城镇储户问卷调查报告（保险仅占未来三月增支 13.0%）. <https://finance.people.com.cn/n1/2023/0629/c1004-40024314.html>; 美国消费者金融保护局 (无日期). An essential guide to building an emergency fund（家庭财务韧性原则）. <https://www.consumerfinance.gov/an-essential-guide-to-building-an-emergency-fund/>", "note": "定级 B，因保险优先级属通用财务规划常识而非严格实证研究；保额建议覆盖 5–10 倍年收入+未还房贷，交叉参见条 7、11。"}, {"chapter": 9, "num": 6, "id": "9-6", "title": "教育孩子：财务独立先于财富传承", "grade": "C", "tags": {"钱": "少", "时间": "多", "毅力": "多", "收益": "中", "口径": "金钱", "影响": "后代"}, "impact": "后代", "cost_money": "少", "cost_time": "多", "cost_will": "多", "benefit": "中", "scope": "金钱", "three_zero": false, "cost": "投入时间精力培养孩子的独立赚钱能力、理财与防骗意识，而非单纯存钱。", "plain": "留钱不如留本事。教会孩子\"钱从哪来、怎么不被骗、复利怎么滚\"，比塞给他一套房更保他一辈子。会赚钱、懂复利的孩子，比被动继承的孩子更难被坑、更扛摔。", "gain": "从人力资本视角看，父母对孩子最大的\"投资\"是教育与财商，而非遗产。CHFS 等调查显示中国家庭资产高度集中于房产与存款、金融素养参差，许多\"富二代\"因缺乏独立赚钱与风控能力而在继承后迅速缩水。反观具备复利意识与职业竞争力的子女，其终身收入现值远高于一次性继承。行为金融研究也表明，早期建立的储蓄与预算习惯会显著延续到成年，降低日后陷入债务陷阱的概率。", "
