<script>window.BOOK_DATA = {"updated": "2026-10-07", "chapters": [{"num": 1, "label": "认知外", "title": "一、不要亏在认知外", "intro": ["这一章只讲一件事：在你看不懂、算不清、情绪会被放大的地方下注，亏的概率天然站在对手那边。投资里绝大多数永久性损失，不是市场太狠，而是你自己迈过了能力圈的边界——买了说不清钱从哪来的东西、把身家压在一只股票上、用杠杆把波动变成死亡、拿明年要用的钱去赌长期、跟着熟人消息追涨杀跌。", "本章给出的每一条，本质都是\"不做什么\"的纪律。它们的共同点是：成本极低（几分钱、十几分钟、一点克制），回报是\"不归零、不被永久出局\"。证据等级高的（A）多来自法律条文和监管规则；证据等级偏低的（C）多是常识和经验判断，本书会如实标注，不夸大。涉及具体标的的，都不构成投资建议。", "本章条目按主题分成下面几块，括号里是条号。", "**看清钱从哪来（底层）**：不买说不清\"钱从哪来\"的东西（第 1 条），不熟不投、非标资产默认不碰（第 5 条），复杂结构化产品默认不碰（第 8 条），用\"可解释测试\"卡掉每笔投资（第 9 条）。", "**仓位与杠杆（保命）**：单一标的集中持仓等于邀请永久性损失（第 2 条），杠杆先放大\"出局\"概率（第 3 条），用短期要用的钱做长期投资是定时炸弹（第 4 条），自己不懂的衍生品不开户（第 6 条）。", "**别和概率作对（宏观与对手）**：不预测宏观、不赌单边方向（第 7 条），先搞清楚\"我是谁的交易对手\"（第 14 条），把\"名人／大 V 持仓\"当背书默认无效（第 15 条）。", "**信息环境与红线（行为）**：熟人荐股你天然在信息劣势侧（第 10 条），卖方研报／评级自带立场（第 12 条），付费荐股群／直播带单是监管红线（第 13 条），内幕交易是刑事红线（第 11 条）。"], "file": "book/01-认知外.md", "count": 15, "type": "entries"}, {"num": 2, "label": "费用税收", "title": "二、不要被费用和税收吃掉", "intro": ["费用和税收是投资里你唯一能在下单前就 100% 算清的扣减项。市场涨跌不可预知，但印花税比例、基金管理费率、申购赎回费、所得税边际税率，都是写进法规与合同的确定数字。本章算的是“确定性账”：每少付一个基点，它就永远留在你口袋里并按复利生长；每多付一个基点，就是先把一笔确定的钱送给税务局、券商和基金公司。把这条线压到最低，比预测哪只基金明年涨更靠谱——因为它不靠运气，只靠你愿不愿意看清合同和法条。", "证据口径上，费用与净收益的负相关是被全球反复验证的：晨星（Morningstar）在 2026 年提交美国国会的证词中明确，成本是“未来基金表现最可靠的预测变量”，最低费率五分位基金跑赢最高费率五分位；Carhart（1997）与 SPIVA 长期数据亦显示，费率每高一点，主动基金跑赢基准的难度就大一分。税收端则完全由政策决定——中国 A 股印花税 2023 年 8 月从 0.1% 减半到 0.05%（单边），股息红利差别化使持股超 1 年免税，个人养老金账户递延纳税且领取仅 3%。本章所有数字均标注年份、国家与法条原文，便于你核对，估算部分亦已标明。", "下面这些条目，按主题分成几块（括号里是条号），方便你按需取用。", "**费率的确定性伤害与复利侵蚀**：条目1（第 1 条），条目10（第 10 条）。", "**交易摩擦成本（佣金·印花税·申赎费）**：条目2（第 2 条）。", "**税收效率（税优账户·分红再投·长期税效）**：条目3（第 3 条），条目4（第 4 条）。", "**工具成本对比（ETF vs 场外·QDII 汇率）**：条目5（第 5 条），条目6（第 6 条）。", "**隐性费用与销售导向陷阱**：条目7（第 7 条），条目9（第 9 条），条目11（第 11 条）。", "**基金运作中的隐性损耗（转换·清盘·尾随·折溢价）**：条目8（第 8 条），条目12（第 12 条），条目13（第 13 条），条目14（第 14 条）。", "**分红的认知误区**：条目15（第 15 条）。"], "file": "book/02-费用税收.md", "count": 15, "type": "entries"}, {"num": 3, "label": "行为偏差", "title": "三、不要被自己坑（行为偏差）", "intro": ["行为金融学用几十年的账户级数据告诉我们：长期跑输市场的，很少是“市场太狠”，更多是“自己太勤”。这一章列的，都是有论文背书的、会稳定亏钱的人性反应——从过度交易、择时、追涨杀跌，到损失厌恶、确认偏误、心理账户。它们不是道德缺陷，而是写在大脑里的出厂设置：在前景理论里，亏的痛约等于赚的乐的两倍；在处置效应里，人天然想卖盈持亏。好消息是，这些偏差可以被“规则”对冲——定投、再平衡、指数化、写死计划，本质上都是用系统替代情绪。本章把二十种最致命的偏差逐一拆开，每条都给出真实研究中的数字、来源与可操作的对抗方法。", "读这一章的正确姿势：先认领自己中了几条（几乎人人中招），再挑 2–3 条最贵的去改。证据等级 A 的（频繁交易、择时、处置效应、损失厌恶、过度自信）是已经被数万户真实账户证实的“确定性亏损源”，优先级最高；C 级的多是实验室内稳健、但市场上难以单独量化的偏差，同样值得警惕。所有条目共享一个底层结论：你以为自己在“做决策”，其实大多是被本能替你“做决定”。", "本节 20 条按主题分成下面几块（括号里是条号）："], "file": "book/03-行为偏差.md", "count": 20, "type": "entries"}, {"num": 4, "label": "被动省心", "title": "四、不要浪费时间与精力（被动省心）", "intro": ["投资里最贵的资源不是钱，是你的注意力。把决策交给低成本规则，省下的精力去赚本金、陪家人、磨手艺，性价比远高于天天盯盘找\"下一个牛股\"。本章讲的\"被动省心\"，不是躺平，而是用一套可复制的规则，把\"择时、选股、盯盘\"这些最易亏钱的动作最小化，把复利与\"在场权\"留给自己。", "本章所有结论都有硬数据支撑：SPIVA 美国年终 2024 显示大盘主动基金 20 年有 92% 跑输标普 500；巴菲特十年赌约（2008–2017）指数基金 125.8% 对对冲基金组合 36.3%；JPMorgan 测算 2004–2023 错过仅 10 个最佳交易日年化便从 9.7% 跌到 5.5%；DALBAR 显示高换手投资者 20 年年化落后指数约 1 个百分点。这些数字共同指向一件事——少做动作，多做时间的朋友。", "下面这些条目，按主题分成几块（括号里是条号），方便你按需取用。", "**被动指数与核心工具（买什么）**：条目1（第 1 条），条目9（第 9 条），条目8（第 8 条），条目11（第 11 条）。", "**弱化择时（何时买）**：条目2（第 2 条）。", "**降低交易频率与盯盘（少操作）**：条目3（第 3 条），条目7（第 7 条），条目6（第 6 条）。", "**资产配置与再平衡（配多少）**：条目4（第 4 条），条目5（第 5 条），条目10（第 10 条）。", "**是否外包给投顾**：条目12（第 12 条）。"], "file": "book/04-被动省心.md", "count": 12, "type": "entries"}, {"num": 5, "label": "资产速查", "title": "五、资产类别速查", "intro": ["本章是一份**纯事实速查表**，只收录历史可验证的数据与权威机构已发布的结论（长期回报、波动、规则、风险揭示），不代表任何买卖建议。每条都按“花掉什么／换回什么／证据多硬”拆解，目的是先建立对各类资产收益与风险的**量级感**，再决定配不配、配多少。市场回报随利率、估值、通胀环境而变，历史平均不等于未来承诺；所有数字均标注来源年份与口径，便于你自行复核。", "写这条时我们刻意回避“现在该买什么”的时机判断。资产配置的第一课，是把资产的长期属性（股权≈高增长高波动、债券≈低增长低波动、黄金≈保值对冲、现金≈流动性）装进脑子，再用自己的风险承受力与期限去拼组合，而不是追逐某一年的冠军品种。", "---", "**本节条目按主题分成下面几块（括号里是条号）：**", "---"], "file": "book/05-资产速查.md", "count": 20, "type": "entries"}, {"num": 6, "label": "骗局红线", "title": "六、不要踩骗局与红线", "intro": ["监管者的原话听得进去，能少交几十年学费。原银保监会主席郭树清在 2018 年陆家嘴论坛上讲得直白：\"收益率超过 6% 的就要打问号，超过 8% 的就很危险，10% 以上就要准备损失全部本金。\"这不是吓唬——它是监管对非法集资套路的公开定性。同一逻辑写进了制度：2018 年《关于规范金融机构资产管理业务的指导意见》（资管新规，银发〔2018〕106 号）第二条、第六条明确\"金融机构开展资产管理业务时不得承诺保本保收益\"，彻底打破刚性兑付；2021 年国务院《防范和处置非法集资条例》（国令第 737 号）第二十五条更冷酷地写明\"因参与非法集资受到的损失，由集资参与人自行承担\"——也就是说，踩进非吸，亏的钱国家不垫付、不回购。", "这一章每一条本质同一句：凡是\"高收益、低风险、还稳\"，凡是\"立刻、保密、别告诉别人\"，几乎必然是局。下面所有条目，都是官方明文警示过的危险信号，不是我编的\"经验之谈\"。", "怎么用这一章：把它当成你的\"负面清单\"。任何一笔投资机会，先拿下面 18 条逐一对号；只要命中任意一条，无论对方背景多光鲜、收益多诱人，默认它就是骗局，先撤退再核实。宁可错过，不可踩雷——因为骗局里你失去的不仅是收益，而是本金本身。", "本节条目按主题分成下面几块（括号里是条号）："], "file": "book/06-骗局红线.md", "count": 18, "type": "entries"}, {"num": 7, "label": "划算动作", "title": "七、真正划算的动作（高性价比清单）", "intro": ["投资里真正\"划算\"的动作，往往不是那些听起来刺激的技巧，而是少数成本低、确定性高、且能长期复利的事。本章按性价比从高到低，列出普通人最该先做的清单——它们大多不靠预测市场，而靠\"少做错事\"和\"让系统替你执行\"。", "这些动作可分成三类逻辑：一是压低成本与摩擦（低费率、长期持有、少看盘），二是改善行为（自动扣款、再平衡阈值、卖出规则、投资日志），三是用足制度红利（应急金、保险、社保与税优账户、专项扣除）。三者叠加，效果远大于任何单次\"神操作\"。", "注意：前面几条（1–4）是全书的核心引擎，做不到位时，后面再精妙的动作也只是锦上添花。先把自己能确定控制的部分做好——成本、纪律、时间——市场自会把长期回报交给你。", "本节条目按主题分成下面几块（括号里是条号）："], "file": "book/07-划算动作.md", "count": 14, "type": "entries"}, {"num": 8, "label": "税务账户", "title": "八、税务与账户优化", "intro": ["合法省下的税就是净赚。这一章只讲政策明确、人人可用的账户与税优动作，不碰灰色地带。税的本质是把你的钱在不同环节、以不同税率重新切分：能在\"税率低\"的环节持有、在\"税前扣除\"的额度里布局，长期复利的雪球就会被少切走一大块。对普通人而言，税务优化的第一原则不是钻研漏洞，而是把国家明文给的优惠用足——它们往往零成本、低风险，只是需要你\"知道并行动\"。", "需要提前说清一个边界：本章所有结论都基于中国现行税法及已签署的国际税收协定，且以\"居民个人\"为主要视角。涉及婚姻、继承、跨境身份等事项时，个案差异很大，文中标注〔争议〕的条目建议以专业律师或主管税务机关口径为准，切忌照搬网络模板。税务政策也会随年度调整（如专项附加扣除标准、个人养老金试点范围），请养成每年汇算清缴前核对一次的习惯。", "本节条目按主题分成下面几块（括号里是条号）：递延纳税型养老账户（1、5、9、10）；股票与资本利得（2、3）；利息与各项税前扣除（6、7、8）；家庭资产隔离与传承（4、11、12）；跨境涉税信息交换（13）。"], "file": "book/08-税务账户.md", "count": 13, "type": "entries"}, {"num": 9, "label": "人生阶段", "title": "九、人生阶段配置", "intro": ["投资不是\"一刀切\"的配方，而是一条随年龄、责任与现金流变化的路线。一个人在 25 岁和 55 岁时能承受的风险天差地别：年轻时最大资产是未来几十年的工资现值（人力资本），时间足以熨平市场波动，理应多配权益；年长后人力资本耗尽、临近或已进入提款期，就该把波动慢慢换成确定性。学术界把这套思路称为\"生命周期投资\"（life-cycle investing），实践中最流行的简版就是\"100−年龄\"法则——用 100 减去你的年龄，得到投资组合里权益类资产的大致比例。", "但年龄只是第一条轴。真正的家庭财务韧性还取决于\"责任结构\"：你是单收入还是双收入、有没有娃、是不是自雇、是否处于再婚重组。责任越重、收入越不稳，应急金要越厚、保险要越齐、教育金要越早隔离。无论处在哪个人生阶段，有一个顺序永远不能反——先兜底（应急金、保障、无风险缓冲），再进攻（权益、长期复利）。本指南把\"先兜底、再进攻\"作为所有条目的底层逻辑。", "中国家庭的现实也给这条路线打了补丁。中国人民银行 2023 年城镇储户问卷调查显示，居民偏爱的投资方式前三位仍是\"银行/证券/保险公司理财产品\"（43.8%）、\"基金信托\"（20.4%）和\"股票\"（15.2%）；社科院测算 2023 年居民金融资产中货币与存款占比约 62%、股票仅约 9.4%。换句话说，多数家庭不是\"股比太高\"，而是权益与养老金储备普遍不足、房产与存款过重。因此本章在引用国际经验法则的同时，反复提醒：对大多数中国家庭，真正要补的是\"长期权益+私人养老金\"这一短板，而不是盲目加杠杆追收益。", "本节条目按主题分成下面几块（括号里是条号）：年龄阶段线（条 1–4：20–35 岁、35–55 岁、55–65 岁、退休后）；家庭结构变体（条 5、8–12：单收入、单身无娃、有娃、双收入、自雇、再婚重组）；跨阶段主题（条 6、7、13：财商传承、应急金、长寿风险）。"], "file": "book/09-人生阶段.md", "count": 13, "type": "entries"}, {"num": 10, "label": "反面清单", "title": "十、反面清单（直接不做）", "intro": ["原书叫\"先做减法\"。下面这些动作性价比为负，出现一个划掉一个。它们不是建议，是禁令。每一条都对应前面某章的具体论证，括号里是条号，方便你回查为什么。"], "file": "book/10-反面清单.md", "count": 20, "type": "list"}, {"num": 11, "label": "A股实操", "title": "十一、中国 A 股实操（交易制度·费率·税收·打新·退市·两融·跨市场）", "intro": ["这一章只讲 A 股场上\"规则层面的钱\"——交易制度、税、费、打新、退市、杠杆、跨市场通道。它们不性感，但每一条都是确定性极高的\"胜率调节钮\"，且全部锚定官方文件与交易所规则。很多人以为炒股亏在\"选错票\"，但上交所历年《上海证券市场统计年鉴》显示，散户（自然人投资者）在牛熊循环中整体呈净流出、而机构整体呈净流入，其重要原因之一就是频繁交易累积的税费摩擦、追涨杀跌与对规则（涨跌停、退市、杠杆）的误用。把本章的\"确定性规则\"吃透，不保证你赚钱，但能先把\"确定会亏的钱\"少亏掉一大半。", "动手下单前，先建立 A 股交易制度的全景坐标：①交收与回转——A 股实行 T+1（当日买入次日才可卖），但港股通标的为 T+0 回转、T+2 交收；②涨跌停——主板（沪市/深市主板）涨跌幅 ±10%，风险警示板（ST/*ST）仅 ±5%，科创板、创业板 ±20% 且新股上市前 5 个交易日不设涨跌幅限制，北交所 ±30%、新股首日无限制；③板块门槛——科创板与北交所要求\"前 20 个交易日日均资产 50 万元 + 2 年交易经验\"，创业板为\"10 万元 + 2 年\"，均不含两融融入资金；④龙虎榜——交易所每日公布异动股买卖前 5 营业部（主板涨跌幅偏离 ±7%、换手 ≥20%、振幅 ≥15% 上榜，双创门槛更高），它是观察主力资金的窗口，但仅披露前 5 席位、数据滞后，盲目\"跟风榜\"反而易被游资分仓诱多。这些制度决定了你\"能买什么、怎么波动、何时出局\"。", "本章条目按\"成本—说人话—收益—证据—来源—备注\"六字段展开，收益部分尽量写得厚（含具体数字、制度年份与条款），来源均给出可核验的官方或权威媒体链接，证据等级 A/B/C 标注了可信度。请把它当成一本\"规则省钱手册\"：能改的（佣金免五、基金分红方式、A/C 类选哪类）立刻去改；不能改的（印花税、过户费、退市红线）就用来约束自己的行为。下面先把十二条按主题归类，方便你按需取用。", "本节条目按主题分成下面几块（括号里是条号）："], "file": "book/11-A股实操.md", "count": 12, "type": "entries"}, {"num": 12, "label": "冷计算器", "title": "十二、冷计算器·反直觉数字", "intro": ["本章只做算术，不谈观点。下面每一条都是用可复核的公式和公开的历史数据堆出来的量级，目的是给你一把\"基准尺\"——当别人用故事、情怀、K线图劝你操作时，你可以用这些冷冰冰的数字先反问一句：\"算过账吗？\"所有收益数字都标明了出处；凡是本书自己套公式算出来的，一律明确标注\"本书估算\"，绝不冒充原始数据。本章不构成任何投资建议，费率、通胀、税收、样本期等假设稍有变动，结论就会偏移，请自行代入自己的参数。", "需要提醒的是，这些数字大多来自美国或中国特定年份的统计，存在样本期偏差、幸存者偏差与国别差异。它们告诉你的是\"大概率\"和\"量级\"，而不是\"必然\"。真正经得起时间检验的护城河只有两条：把成本压到最低、把持有期拉到最长。其余的，多半是噪声。", "本节条目按主题分成下面几块（括号里是条号）："], "file": "book/12-冷计算器.md", "count": 15, "type": "entries"}, {"num": 13, "label": "养老退休", "title": "十三、养老与退休配置", "intro": ["养老是投资里周期最长、确定性最差、却最不能赌的一类目标。它的核心矛盾是：退休后没有工资现金流，却要覆盖可能长达 30 年的支出，而这段时间里你会同时面对通胀侵蚀、市场波动、失能护理和\"活得太久\"四类风险。本章不卖任何产品，只帮你把\"要攒多少、靠什么攒、怎么不中途翻车\"这三件事算清。制度层面，中国已搭起\"三支柱\"：第一支柱基本养老保险（兜底，但替代率仅约 40%）、第二支柱企业/职业年金（覆盖窄）、第三支柱个人养老金（2022 年 36 城试点、2024 年 12 月全国铺开，年缴上限 1.2 万、领取按 3% 征税）。工具层面，目标日期基金、养老储蓄、商业养老年金、长期护理险是四块拼图。把社保当底线而非靠山，用税优账户和权益资产补缺口，用年金和护理险切掉尾部风险，才是普通人的稳妥解。", "证据口径：本章数字均标注年份、出处与条款。替代率、预期寿命、基金收支来自人社部/卫健委/社科院公开统计；税优与延迟退休来自国务院、财政部、税务总局、证监会、全国人大常委会的正式文件；4% 法则来自 Bengen(1994) 及 Trinity 研究；美国对照采用 IRS 2024 限额。凡是区间或学术估算，已在备注中说明，绝不冒充原始统计。", "本节条目按主题分成下面几块（括号里是条号）："], "file": "book/13-养老退休.md", "count": 12, "type": "entries"}, {"num": 14, "label": "保险配置", "title": "十四、保险配置", "intro": ["保险是家庭财务的\"地基\"，不是\"楼上的装修\"。它的本质只有一句话：用一笔确定的、可承受的小钱，把你和家庭扛不住的尾部风险（重病、意外、早逝、长寿）转移给保险公司。但这恰恰是最容易被做反的一块——销售话术把保险包装成\"既能保又能赚\"的理财，于是很多人先买了返还型、分红型、年金型，保障却薄得像纸，真出事赔不到、不理财又跑不赢通胀。", "本章坚持\"保险姓保\"的监管导向（国发〔2014〕29号、金融监管总局多次风险提示），先讲配置顺序与方法论，再逐条拆解具体险种与避坑点。记住三条铁律：①先把\"保人\"做足，再谈\"保钱\"；②保障归保障、投资归投资，分开算账；③条款比宣传册重要，健康告知、免责、犹豫期、受益人这些\"不起眼\"的地方，往往决定赔不赔得到。", "本节条目按主题分成下面几块（括号里是条号）："], "file": "book/14-保险配置.md", "count": 12, "type": "entries"}, {"num": 15, "label": "房产负债", "title": "十五、房产与负债", "intro": ["对绝大多数中国家庭来说，房子既是资产，更是负债。央行数据显示，2024 年末我国个人住房贷款余额仍超 38 万亿元，房产占城镇居民家庭资产的比重长期在六成以上。但\"有房\"不等于\"有钱\"——房产背面的房贷、税费、流动性和政策风险，才是真正决定家庭财务安全的东西。这一章不劝你买或不买，而是把\"买房 + 负债\"这台机器拆开：利率怎么定、持有成本是多少、杠杆在下行时怎么反噬、哪些操作是监管红线。", "读这一章的正确姿势：先算清自己的\"真实资金成本\"（利率、税费、空置、维护），再对照\"安全边界\"（月供占比、流动性、负债集中度）。证据等级 A 的多是机制性事实（LPR 定价、税费规则、监管规定），确定性最高；B 级来自权威机构测算与个案数据；C 级为经验法则与趋势判断，需结合自身城市与时段校准。所有数字均标注来源与年份，便于你按当下最新政策复核。", "本节 12 条按主题分成下面几块（括号里是条号）："], "file": "book/15-房产负债.md", "count": 12, "type": "entries"}, {"num": 16, "label": "信息防忽悠", "title": "十六、信息源与防忽悠", "intro": ["投资的头号敌人往往不是市场本身，而是噪音与骗局。信息越廉价、越喧嚣，越要先怀疑它的动机。本章想给你的不是\"看穿每一个具体骗局\"的清单（那不可能穷尽），而是一套低成本、可复用的\"防忽悠操作系统\"：先问\"谁在说话、他赚谁的钱\"，再看证据、找反例，最后用自身的硬本领替代对他人的依赖。", "这套系统的必要性并非危言耸听。公安部 2024 年通报，2023 年全国公安机关破获电信网络诈骗案件 43.7 万起，国家反诈中心紧急拦截涉案资金 3288 亿元；仅\"杀猪盘\"一类，美国联邦贸易委员会（FTC）2023 年记录的相关损失就达 11.4 亿美元。骗局规模之大说明：防忽悠不是杞人忧天，而是现代投资者的必修课。下面 12 条，条条都对应一个你每天都会遇到的陷阱。", "本节条目按主题分成下面几块（括号里是条号）：一、利益冲突滤网——先问\"他赚谁的钱\"（条 1、2、12）；二、戳破\"权威 / 业绩\"光环（条 3、4、6）；三、媒体、噪声与小道消息（条 5、9、10）；四、修炼自己的判断力（条 7、8、11）。"], "file": "book/16-信息防忽悠.md", "count": 12, "type": "entries"}, {"num": 17, "label": "宏观周期", "title": "十七、宏观经济与周期", "intro": ["宏观周期是资产定价的\"天气\"：利率、通胀、汇率和经济景气，决定了几乎所有资产折现率的走向。理解这套机制，能帮你看懂财经新闻背后的真信号，而不是被\"放水必涨\"\"衰退将至\"之类的叙事带着跑。", "但本章真正想交付的纪律是：理解机制 ≠ 预测拐点。利率的大方向你可以判断，但具体哪个月加息、哪次衰退、哪天见底，连拿着高薪的首席经济学家和号称能择时的基金经理都系统性地做不到（见条目4、10）。更扎心的是，连著名的\"美林投资时钟\"这类宏观配置模型，在样本外也频频失效。", "所以请把宏观当作\"约束条件\"和\"风险预算\"，而不是买卖指令：用它来决定你的久期、现金比例、海外敞口和对冲，而不是用来赌方向。配置有韧性，比预测准一次重要得多。", "本节条目按主题分成下面几块（括号里是条号）：利率机制与债券价格（1、7）；收益率曲线与经济周期信号（2、6、12）；通胀、黄金与货币宽松（3、8、11）；宏观预测与择时的不可靠性（4、10）；汇率对海外回报的乘数效应（5、9）。"], "file": "book/17-宏观周期.md", "count": 12, "type": "entries"}, {"num": 18, "label": "人力资本", "title": "十八、人力资本：你最大的资产与本金来源", "intro": ["人力资本（Human Capital）是舒尔茨、贝克尔提出的经典概念：你体内能创造未来收入的知识、技能、健康与经验，本身就是一项资产。对普通人而言，它在年轻时的家庭资产负债表里占比接近 100%——远比那点存款和基金更值钱。遗憾的是，多数人把\"投资\"窄化为买股票基金，却对自己这件最大资产疏于经营。中央财经大学《中国人力资本报告2025》测算，2023 年中国人力资本总量达 4375.63 万亿元、人均 402.22 万元；世界银行人力资本指数（HCI）中国 2020 年为 0.7。这些数字提醒我们：你\"值多少钱\"，才是理财的起点。", "本章的逻辑主线只有一条：主业收入是你一切投资本金的唯一来源。在人力资本上的每一分投入（教育、技能、健康、谈薪、赛道选择），回报率常常高于你反复研究的基金；而职业中断、技能过时、健康崩塌，则是确定性极高的\"资产减值\"。把\"自己\"当一家小公司经营，先做大人力资本这块资产，再谈配置金融资本，顺序不能反——否则就是拿一个漏桶去接水。", "下面 12 条覆盖认知框架、主业本金、深耕与跳槽、职业中断、持续学习、健康地基与避坑，全部基于可验证的实证研究与中国本土数据。阅读时请始终带着\"个人资产负债表\"的视角：你的工资是营收，技能与健康是资产，贷款是负债，而社保是隐性的股东出资。", "本节条目按主题分成下面几块（括号里是条号）：认知框架——把\"自己\"当成一项需要经营的核心资产（1、5）；主业收入是第一桶金——谈薪与隐性薪酬（2、12）；主业深耕、行业选择与跳槽节奏（3、6、7、11）；职业中断的真实代价（4）；技能半衰期与持续学习（8）；健康：人力资本的折旧与保险（9）；避坑：别为\"投资自己\"交智商税（10）。"], "file": "book/18-人力资本.md", "count": 12, "type": "entries"}, {"num": 19, "label": "消费记账", "title": "十九、消费与记账", "intro": ["投资赚的是\"增量\"，而消费记账管的是\"存量漏损\"。对本金还不厚的普通人来说，省下 100 元比冒着波动去赚 100 元更确定——不用本金、不担风险、还免税。这一章不讲\"怎么买基金\"，而是讲\"怎么先别把钱漏掉\"：先建立储蓄率的基本盘，再用记账看清钱去哪了，最后用几条低成本的规则（冷静期、时薪换算、三栏归类）把冲动和非理性支出拦在门外。底层逻辑几乎全部来自行为经济学与家庭财务的硬数据，而不是\"省钱光荣\"的口号。", "先看一组国情数字：中国人民银行 2023 年四个季度的城镇储户问卷调查显示，倾向于\"更多储蓄\"的居民占比分别为 58.0%、58.0%、62%、61%，明显高于 2020–2022 年 53% 的均值；国家统计局同期数据显示，2023 年居民人均可支配收入 39218 元（同比 +6.3%），人均消费支出 26796 元（同比 +9.2%），消费增速反超收入增速，居民储蓄率（人均口径）已降至 31.7%。这说明\"想存钱\"和\"真存下钱\"之间，隔着一整套消费习惯的缺口——而这一章要填的，正是这个缺口。更关键的是，行为金融学证明储蓄可以被\"设计\"出来：Thaler 的 Save More Tomorrow 计划让参与者储蓄率从 3.5% 升到 13.6%，英国自动加入养老金后签约率超过 90%。省钱不是靠自律硬扛，而是靠好规则。", "本节条目按主题分成下面几块（括号里是条号）：储蓄与节流的基本盘（为什么要省、储蓄率国情）——条目 1、条目 2；看清钱去哪了（记账与订阅漏洞）——条目 4、条目 5；大额与冲动消费的控制（冷静期、时薪换算、三栏归类）——条目 3、条目 9、条目 12；把钱花在更值的地方（体验优于实物、买对不买贵、避开炫耀性消费）——条目 6、条目 7、条目 8；别为\"安心\"和\"面子\"倒贴（延保、债务）——条目 10、条目 11。"], "file": "book/19-消费记账.md", "count": 12, "type": "entries"}, {"num": 20, "label": "极端情形", "title": "二十、极端情形与黑天鹅", "intro": ["投资的大多数时间风平浪静，真正的差距往往在少数极端日子里拉开：一次股灾、一周熔断、一场失业、一笔意外医疗，就足以把\"账面浮亏\"变成\"永久本金损失\"，把\"长期复利\"打成\"推倒重来\"。本章不教你预判黑天鹅——没人能稳定预测 2008、2015、2020——而是教你提前把\"活下去\"的能力建好：留够现金垫、不碰杠杆、在暴跌里管住手、把最坏情形写进计划。极端行情考的不是智商，是事前准备与纪律。", "历史反复证明，危机的杀伤力不在于跌幅本身，而在于它恰好发生在你\"没钱、欠债、又要用钱\"的时刻。2008 年标普 500 自高点回撤约 57%、2009 年 3 月才见底；2020 年新冠崩盘仅 23 个交易日就跌 33.9%、还四度熔断；2015 年 A 股 58 个交易日里出现 16 个\"千股跌停\"、流动性一度降到股灾前的 1/10 以下。能在这些时刻不爆雷的人，靠的不是神准抄底，而是危机前就留好的现金、没背的杠杆、和一份写好的预案。", "下面 12 条按\"地基—纪律—收入冲击—法律—杠杆\"的组织，逐条给出可操作的成本、收益与证据。请记住一条总纲：极端情形下的第一目标不是赚钱，是\"不永久出局\"，只要还在桌上，时间就会替你修复大部分暂时损失。", "本节条目按主题分成下面几块（括号里是条号）：现金与应急垫（1、2、8、11）；暴跌中的行为纪律（3、9、10、12）；收入中断与失业冲击（4、5）；法律与传承安排（6）；杠杆的归零风险（7）。"], "file": "book/20-极端情形.md", "count": 12, "type": "entries"}, {"num": 21, "label": "基金选择实操", "title": "二十一、基金选择实操（把“买什么基”拆细）", "intro": ["选基金的本质，不是挑“哪只过去涨得多”，而是挑一个“费用低、风格稳、不会突然消失”的容器。上一章讲资产配置（买多少股、多少债），这一章落到“具体买哪只”——把选择标准拆成可操作、可验证的硬指标。绝大多数人亏在选基时只看历史收益率和明星光环，而忽略费率、规模、折溢价这些“确定性更高”的变量。", "为什么是这些变量？因为学术界与监管机构的研究结论高度一致：成本是预测基金未来表现最可靠的单一指标。晨星 2026 年向美国国会作证时明确称“费用是预测基金未来表现最可靠的变量”，其数据显示最低费率五分位的主动基金 10 年跑赢同类被动基准的比例（31%）远高于最高费率五分位（17%）（Morningstar, 2026）；而 SPIVA 长期追踪表明，美国大盘主动基金 10 年跑输标普 500 的比例达 85.59%、20 年达 92.89%（S&P Dow Jones Indices, 2026）。这意味着“少付费用、避开主动管理的系统性劣势”是普通投资者最易把握的胜率来源。", "本节条目按主题分成下面几块（括号里是条号）：一、成本与费率——选基第一关：1（指数基金三看：费率、规模、跟踪误差）、3（A 类 vs C 类：持有期决定谁更省）、4（ETF 溢价买入＝先亏一道）、5（QDII 额度紧时溢价可高达 5%–20%）、9（FOF：双层收费，慎选）；二、规模与存续风险：2（基金规模的两个极端都要躲）、11（定期报告披露的“实际持仓”比宣传靠谱）；三、主动管理基金的隐性风险：6（基金经理变更是隐性风险）、7（基金风格漂移：看持仓别看名字）、8（打新／套利基金收益不可持续）；四、产品识别与债基：10（债券基金也分三六九等）。"], "file": "book/21-基金选择实操.md", "count": 11, "type": "entries"}, {"num": 22, "label": "固定收益细节", "title": "二十二、固定收益细节（钱的安全垫怎么放）", "intro": ["固定收益不等于\"固定赚钱\"。它的真正含义是：现金流和到期安排比股票更\"固定\"，但价格仍会波动、发行人仍可能违约、利率变动仍会让你账面浮亏。这一章不把固收当成一类产品，而是按\"风险从低到高、从透明到复杂\"逐层拆开，帮你弄清楚每一块钱到底承担了什么风险、换来了什么补偿。", "核心心法只有一句：先看风险，再看收益。任何一类固收，先问三个问题——钱借给了谁（信用）、锁多久（久期/流动性）、保本吗（法律地位）。把这三个问题答清楚，\"安全垫\"才真正安全。", "需要特别警惕两种错觉：一是把理财、货基、债基当成\"存款平替\"（2022年11月债市波动让大量持有者上了一课）；二是被高出的那截利息迷惑，却没看见它对应的违约风险。下面按主题把条目分类，便于你按自己的需求跳读。", "本节条目按主题分成下面几块（括号里是条号）：一、无风险/准无风险的\"收益锚\"与保本边界——国债免税与无风险利率（1）、存款保险50万上限（2）、货币基金非存款不保本（3）、地方债与国债税后差异（10）；二、净值会波动的固收——债券基金不是稳赚（4）、永续债/优先股条款复杂（8）、债券回购加杠杆是机构玩法（9）；三、风险定价与敏感度工具——高收益债的信用利差不是白给的（6）、久期衡量利率敏感度（7）、可转债下有债底上不封顶但非保本（5）。"], "file": "book/22-固定收益细节.md", "count": 10, "type": "entries"}, {"num": 23, "label": "全球与ETF配置", "title": "二十三、全球与 ETF 配置（把你从单一市场里松绑）", "intro": ["只投本国一个市场，等于把命运押在单一经济体、单一货币、单一监管周期上。这一章不教你去\"炒遍全球\"，而是教你怎么用 ETF 这种低成本、高透明、可小额定投的工具，把自己的资产从\"单一市场依赖\"里松绑——用一两只宽基，就能买到全世界最主要的上市公司，代价只是每年万分之几的管理费。全球配置的核心不是\"更刺激\"，而是\"更抗揍\"：当 A 股跌、美股涨，或美元强、本币弱时，彼此能对冲一部分风险。", "但\"全球化\"也有它自己的坑：时差带来的跨境 ETF 高溢价、汇率的双向磨损、VIX 这类\"看起来能对冲实则长期必亏\"的产品、以及港股通 50 万门槛与制度差异。这一章把\"为什么配、配什么、怎么买不踩坑\"一次讲清，所有结论都尽量给出可核查的机构来源与具体数字。", "本节条目按主题分成下面几块（括号里是条号）：美股与单一市场的风险认知（1、2、7）；汇率与税务（3）；各类资产的真实角色——黄金、REITs、新兴市场、VIX（4、5、6、8）；工具与执行——跨境 ETF 陷阱与宽基选择（9、10）。"], "file": "book/23-全球与ETF配置.md", "count": 10, "type": "entries"}, {"num": 24, "label": "衍生品杠杆风险", "title": "二十四、衍生品与杠杆工具风险（普通人最该绕开的坑）", "intro": ["这一章专讲\"看起来能放大收益\"的工具：期权、融资融券、股指期货、雪球、结构化产品、分级基金、杠杆 ETF、备兑/保护性期权。结论先行——对普通人，绝大多数衍生品与杠杆是净负期望，它们把\"小波动\"放大成\"本金归零\"，还叠加时间损耗、强平、条款陷阱三重风险。本章逐条拆解每种工具的机制与真实亏损数字，核心原则只有一句：看不懂杠杆结构、拿不住补保证金、算不清时间价值的，一律不碰。", "证据口径上，衍生品与杠杆的风险并非\"理论风险\"，而是被监管文件、交易所规则与真实爆仓案例反复验证的确定性伤害。美国 SEC 投资者公告明确警告杠杆/反向 ETF \"每日重置、长期表现可显著偏离倍数\"、保证金账户\"你可能损失超过存入的资金\"；中国证监会《衍生品交易监督管理办法》将雪球类\"自动敲入敲出期权\"纳入规制；中国金融期货交易所《风险控制管理办法》以 12% 最低保证金把股指期货杠杆锁在约 8 倍并设强行平仓制度；期货业协会《期货经纪合同》指引直陈\"损失总额可能超过全部初始及追加保证金\"。本章所有数字均标注年份、机构与原文出处，便于核对。", "下面这些条目，按主题分成几块（括号里是条号），方便你按需取用。", "**时间价值的隐形税收（期权买方）**：条目1（第 1 条）。", "**借来的钱与强平（融资融券/保证金）**：条目2（第 2 条）。", "**期货杠杆与贴水（股指期货）**：条目3（第 3 条）。", "**收益封顶、风险敞口巨大的结构化赌局（雪球/结构化产品/分级基金）**：条目4（第 4 条），条目5（第 5 条），条目6（第 6 条）。", "**路径损耗与专业策略陷阱（杠杆 ETF/备兑认沽）**：条目7（第 7 条），条目8（第 8 条）。"], "file": "book/24-衍生品杠杆风险.md", "count": 8, "type": "entries"}], "entries": [{"chapter": 1, "num": 1, "id": "1-1", "title": "不买说不清\"钱从哪来\"的东西", "grade": "A", "tags": {"钱": "0", "时间": "少", "毅力": "否", "收益": "中", "口径": "金钱", "影响": "自己"}, "impact": "自己", "cost_money": "0", "cost_time": "少", "cost_will": "否", "benefit": "中", "scope": "金钱", "three_zero": false, "cost": "不花钱。每准备投出一笔钱，花几分钟想清楚\"它靠什么生钱\"。", "plain": "你投出去的每一块钱，都要答得上\"它靠什么生钱\"。是公司的盈利分红？是债券的利息？是房子的租金？还是有人愿意用更高的价格从你手里接走？答不上来的，大概率是\"别人的收益来自你的本金\"——也就是庞氏或接盘。成本近乎为零，回报是\"不归零\"。", "gain": "避开绝大多数骗局与归零标的。任何可持续的回报，都必须来自真实的价值创造（企业盈利、利息、租金、分红），而不是后来者的本金。一句话能写清\"钱从谁口袋来、我比市场多知道什么\"的，才值得投；写不出的，就是赌。把这条当成下单前的第一道闸门，能挡掉绝大多数\"听消息、凭感觉、追热点\"的交易。", "source": "美国证券交易委员会 (无年份). Investor.gov《Ask Questions》投资者教育页（\"任何投资都要能回答钱从哪来、风险是什么\"）. <https://www.investor.gov/introduction-investing/investing-basics/ask-questions>；中国证券监督管理委员会 (2017). 《证券期货投资者适当性管理办法》（证监会令第 130 号，第三条、第四条：经营机构应当向投资者充分揭示风险，投资者应当在了解产品、听取适当性意见基础上自主决策）. <https://www.gov.cn/gongbao/content/2017/content_5227821.htm>", "note": "这条是\"常识门槛\"而非法律条文，定 A 是因为它直接对应监管对\"适当性\"和\"风险揭示\"的强制要求。它卡不掉合法但你看不懂的复杂产品——那种情况见第 8 条（复杂结构化产品）。交叉参考：第 5 条（非标）、第 9 条（可解释测试）是它的具体执行动作。"}, {"chapter": 1, "num": 2, "id": "1-2", "title": "单一标的集中持仓＝邀请永久性损失", "grade": "B", "tags": {"钱": "0", "时间": "少", "毅力": "些", "收益": "中", "口径": "金钱", "影响": "自己／家庭"}, "impact": "自己／家庭", "cost_money": "0", "cost_time": "少", "cost_will": "些", "benefit": "中", "scope": "金钱", "three_zero": false, "cost": "不花钱。代价是放弃\"全仓一只牛股\"的暴富想象（机会成本），并要花一点精力做分散。", "plain": "分散不能让你赚得更多（它不提高期望回报），但它保命。一家公司的股票可能因为造假、退市、倒闭而归零，但一个由很多家公司组成的市场，长期不会整体消失。把身家压在一只股票上，是用\"永久性损失\"去赌\"超额收益\"，赔率极差。", "gain": "把单点黑天鹅（退市、造假、倒闭）对总资产的杀伤，从\"可能归零\"降到可承受。经典研究 Evans 与 Archer (1968) 在《Journal of Finance》发表的《Diversification and the Reduction of Dispersion》发现，持有约 10 只随机股票就能消除大部分个股特有的（非系统性）风险；业界通行的经验法则是持有 20–30 只不同行业、低相关的标的，可消除约 90% 的个股特有风险，剩下的才是谁也躲不掉的市场风险。意思是：分散到这个程度，你就不再会被\"一只票出事\"打死。", "source": "Markowitz H (1952). Portfolio Selection. Journal of Finance 7(1):77-91（现代投资组合理论奠基，获 1990 年诺贝尔经济学奖）. <https://doi.org/10.2307/2975974>；Evans J, Archer S (1968). Diversification and the Reduction of Dispersion: An Empirical Analysis. Journal of Finance 23(5):761-767. <https://doi.org/10.1111/j.1540-6261.1968.tb03092.x>", "note": "B 级是因为\"20–30 只消除约 90%\"是经验法则和多次回测的近似结论，不是精确到个位的定律；行业过于集中（都买银行、都买白酒）时分散效果会打折，还需跨行业、跨资产类别。交叉参考：第 4 条（短钱长投）、第 14 条（交易对手）。"}, {"chapter": 1, "num": 3, "id": "1-3", "title": "杠杆先放大\"出局\"概率", "grade": "A", "tags": {"钱": "0", "时间": "少", "毅力": "些", "收益": "中", "口径": "金钱", "影响": "自己／家庭"}, "impact": "自己／家庭", "cost_money": "0", "cost_time": "少", "cost_will": "些", "benefit": "中", "scope": "金钱", "three_zero": false, "cost": "不花钱。代价是放弃\"借钱放大收益\"的想象，并要忍受不碰融资融券、不碰保证金交易的克制。", "plain": "没有杠杆时，你的股票跌 50%，你还在牌桌上，涨回来只需要 +100%；加了杠杆，跌到一定程度券商会强制平仓（margin call），你可能在最低点被扫地出门，连回本的机会都没有。杠杆不提高你的胜率，只把\"波动\"变成\"死亡\"。", "gain": "理论上网杠杆放大收益，但实证上散户用杠杆多为净亏损。美国 FINRA 的保证金规则（Regulation T 与 FINRA Rule 4210）规定初始保证金至少 50%、维持保证金约 25%，一旦账户权益跌破维持线，券商有权不经你同意强制卖出。Barber 与 Odean 对散户的研究显示，\"高频交易 + 杠杆\"的组合是散户最致命的亏损来源之一：杠杆在底部强平后，本金永久性出局，市场随后的反弹与你再无关系。对普通人来说，不用杠杆本身就是一道保命阀。", "source": "美国金融业监管局 (FINRA). Regulation T 与 FINRA Rule 4210（保证金要求：初始保证金不低于 50%，维持保证金要求）. <https://www.finra.org/rules-guidance/rulebooks/finra-rules/4210>；Barber B, Odean T (2000). Trading Is Hazardous to Your Wealth. Journal of Finance 55(2):773-806. <https://doi.org/10.1111/0022-1082.00226>", "note": "A 级因为保证金强平是明确的监管规则，亏损机制清楚。但它不否定杠杆对专业机构／对冲基金的合理用途，只是对普通人净负。交叉参考：第 2 条（集中持仓）、第 6 条（衍生品）、第 24 章（衍生品与杠杆风险）整章。"}, {"chapter": 1, "num": 4, "id": "1-4", "title": "用短期要用的钱做长期投资＝定时炸弹", "grade": "B", "tags": {"钱": "0", "时间": "少", "毅力": "些", "收益": "中", "口径": "金钱", "影响": "自己／家庭"}, "impact": "自己／家庭", "cost_money": "0", "cost_time": "少", "cost_will": "些", "benefit": "中", "scope": "金钱", "three_zero": false, "cost": "不花钱。代价是先把应急金和 1–3 年内要用的钱（买房首付、学费、看病）单独留出来，只拿\"亏了也不影响生活\"的钱去投资。", "plain": "明年后年要用的钱，不该放在股市里。市场不会配合你的用钱时间表——你偏偏在熊市最低点需要用钱时，就只能在最低点被迫卖出。强行\"短钱长投\"，等于把\"何时卖\"交给运气和熊市。", "gain": "避免在熊市最低点被迫卖出，这正是\"散户实际回报远低于市场\"的核心原因之一。DALBAR 自 1994 年起每年发布的《Quantitative Analysis of Investor Behavior (QAIB)》显示：2023 年美股平均股票基金投资者的收益率是 20.79%，而标普 500 指数回报是 26.29%，差距达 5.5 个百分点；拉长到 20 年，平均投资者年化约 8.7%，而标普 500 年化约 9.7%。缺口主要不是选错标的，而是\"在错误的时间买入卖出\"——而短钱长投正是被迫在错误时间卖出的头号原因。把用钱时间表和投资期限对齐，就能把这个行为损耗降到最低。", "source": "DALBAR (2024). Quantitative Analysis of Investor Behavior 2024（第 30 版，2023 年数据：平均股票投资者 20.79% vs 标普 500 26.29%）. <https://www.qaib.com/public/media/30thQAIBPressRelease.pdf>；DALBAR (历年). QAIB 报告（长期口径：20 年平均投资者年化 8.7% vs 标普 500 9.7%）. <https://www.dalbar.com/>", "note": "B 级是因为 QAIB 的精确数字因版本略有差异，且报告本身为付费，公开渠道多为其新闻稿的二次转引；但\"投资者因择时跑输指数\"的方向在所有版本和 Morningstar 的独立方法中都成立。交叉参考：第 2 条（分散保命）、第 13 章（养老退休，期限匹配）。"}, {"chapter": 1, "num": 5, "id": "1-5", "title": "不熟不投，非标资产默认不碰", "grade": "C", "tags": {"钱": "0", "时间": "0", "毅力": "否", "收益": "中", "口径": "金钱", "影响": "自己"}, "impact": "自己", "cost_money": "0", "cost_time": "0", "cost_will": "否", "benefit": "中", "scope": "金钱", "three_zero": true, "cost": "不花钱。代价是放弃\"听来的高收益机会\"（私募瑕疵份额、艺术品、邮币卡、非标理财、某些海外\"保本\"产品）。", "plain": "非标＝没有公开价格、难变现、信息黑箱。你图它 8% 的高息，它图你的本金。这类东西往往在你最需要钱的时候卖不掉、价格说不清、合同里藏着对你不利的条款。成本为零，回报是\"不踩雷\"。", "gain": "避开流动性为零、信息不透明的非标坑。非标产品在监管口径里多属于\"私募\"或\"非公开募集\"，面向合格投资者，信息不对等极大；一旦底层资产出问题（如底层是问题地产、问题债券），投资者往往既拿不到钱也卖不掉份额。美国 SEC 对私募的风险披露明确要求：私募证券流动性差、信息披露有限、风险显著高于公开交易证券。对普通人而言，看不见价格的东西，默认不买，是最省心的防雷线。", "source": "美国证券交易委员会 (无年份). Investor Bulletin《Private Placements》（私募配售风险：流动性差、信息披露有限、风险高）. <https://www.sec.gov/oiea/investor-alerts-and-bulletins/ib_privateplacements>；中国证券监督管理委员会 (历年). 防范非标理财／场外配资风险提示（投资者保护栏目）. <https://www.csrc.gov.cn/>", "note": "C 级是因为\"非标一定坑人\"是概率和经验判断，并非所有非标都违约；合格投资者在严格尽调下参与是另一回事。本条只针对普通人和\"听来的机会\"。交叉参考：第 1 条（钱从哪来）、第 6 条（衍生品）、第 8 条（结构化产品）。"}, {"chapter": 1, "num": 6, "id": "1-6", "title": "自己不懂的衍生品（期权／期货／雪球）不开户", "grade": "B", "tags": {"钱": "0", "时间": "少", "毅力": "些", "收益": "中", "口径": "金钱", "影响": "自己／家庭"}, "impact": "自己／家庭", "cost_money": "0", "cost_time": "少", "cost_will": "些", "benefit": "中", "scope": "金钱", "three_zero": false, "cost": "不花钱。代价是放弃\"高杠杆、T+0、双向赚钱\"的想象，以及不开通期权、期货、收益凭证账户。", "plain": "衍生品是专业机构的对冲工具，不是散户的提款机。期权买方每天都在流失\"时间价值\"，你以为在抄底，机构在收你的时间价值；期货带杠杆，反向波动就爆仓；\"雪球\"产品在敲入时亏损没有下限。普通人拿它当彩票玩，长期是负和博弈。", "gain": "避开负和博弈。期权的时间价值随到期日临近持续衰减，多数买方长期亏损（这是期权定价的基本属性，见 Hull 经典教材）；\"雪球\"（自动赎回结构化票据）在 2022–2024 年市场下行中多次大面积敲入，部分投资者本金亏损 30%–70%，而销售时往往只强调\"年化票息\"不强调\"敲入即本金亏损\"。监管已多次对雪球类高风险结构化产品发出适当性警示，要求向普通投资者充分揭示风险。对看不懂第 7 层嵌套和收益结构的，默认不开户，就避开了这套最容易被包装成\"稳健\"的陷阱。", "source": "Hull J (历年). Options, Futures and Other Derivatives（期权、期货及其他衍生品，关于时间价值衰减 theta 的标准论述）. <https://www.pearson.com/en-us/subject-catalog/p/options-futures-and-other-derivatives/P200000003063>；中国证券业协会／监管机构 (2022–2024). 关于雪球类产品投资者适当性与风险揭示的多次提示（行业通报）. <https://www.sac.net.cn/>", "note": "B 级因为时间价值衰减是有数学定论的（A 级逻辑），但\"雪球敲入亏损 30%–70%\"是区间估计、因产品结构和入场时点而异。极少数策略（备兑开仓、保护性认沽）对专业持股者有用，但对普通人净负且需持续管理。交叉参考：第 3 条（杠杆）、第 8 条（结构化产品）、第 24 章。"}, {"chapter": 1, "num": 7, "id": "1-7", "title": "不预测宏观、不赌单边方向", "grade": "C", "tags": {"钱": "0", "时间": "少", "毅力": "些", "收益": "中", "口径": "金钱", "影响": "自己"}, "impact": "自己", "cost_money": "0", "cost_time": "少", "cost_will": "些", "benefit": "中", "scope": "金钱", "three_zero": false, "cost": "不花钱。代价是放弃\"满仓押涨跌\"的刺激，改做\"无论哪种环境都有配置应对\"的钝感组合。", "plain": "连央行都预测不准利率，凭什么你能赌对方向？把\"赌单边\"改成\"全天候\"——上涨有仓位、下跌有现金、通胀有实物、衰退有债券——是把胜负手交还给概率，而不是交给你的预测。", "gain": "避免在错的方向上加错仓位。大量回测显示，主流机构对经济指标（CPI、GDP、利率）的点预测，长期误差显著、方向准确率接近随机；以\"华尔街年度标普 500 目标点位\"为例，历年实际值与预测的偏离经常以千点计。宏观预测对资产配置的指导价值，远低于\"先做好分散、再定期再平衡\"这条笨办法。把精力从\"猜方向\"转移到\"控风险\"，对普通人回报更高。", "source": "多家机构宏观预测准确性回测研究（如对 CPI/GDP 预测误差的汇总文献，长期方向准确率接近随机，此处为综合结论）；CXO Advisory Group 对华尔街策略师标普 500 年度预测的多年追踪（预测与实际偏差显著）. <https://cxoadvisory.com/>", "note": "C 级因为\"预测接近随机\"是多项研究的综合结论，没有单一的、可直接引用的法律或论文条款；具体数字因统计区间不同而变化。本书不主张完全不看宏观，而是主张\"不押单边\"。交叉参考：第 17 章（宏观周期）。"}, {"chapter": 1, "num": 8, "id": "1-8", "title": "复杂结构化产品默认不碰", "grade": "C", "tags": {"钱": "0", "时间": "少", "毅力": "否", "收益": "中", "口径": "金钱", "影响": "自己／家庭"}, "impact": "自己／家庭", "cost_money": "0", "cost_time": "少", "cost_will": "否", "benefit": "中", "scope": "金钱", "three_zero": false, "cost": "不花钱。代价是放弃\"带杠杆的高收益\"包装（如某些雪球、收益凭证、分级、结构性存款的复杂档位）。", "plain": "产品越复杂，越利于卖方在你看不懂的地方藏一条对你不利的规则。看不懂第 7 层嵌套、写不清\"最坏情况我最多亏多少\"的，默认不买。复杂本身常常就是卖方用来制造信息差的武器。", "gain": "避开条款嵌套、收益上限封死、风险敞口说不清的产品。这类产品的真实风险往往不在\"预期收益\"那一列，而在\"触发条件\"\"观察日\"\"敲入线\"\"提前终止\"这些细则里。监管的适当性管理与风险揭示规则，正是要求卖方把复杂产品的风险讲清楚；但对普通人来说，最省力的合规动作不是\"努力读懂\"，而是\"读不懂就默认不买\"——把判断成本转嫁给卖方，反而更安全。", "source": "中国证券监督管理委员会 (2017). 《证券期货投资者适当性管理办法》（证监会令第 130 号，第二十二条：经营机构应当告知产品或服务的潜在风险）. <https://www.gov.cn/gongbao/content/2017/content_5227821.htm>；美国证券交易委员会 (无年份). Investor Bulletin《Structured Notes》（结构化票据风险提示：条款复杂、流动性差、收益有上限）. <https://www.sec.gov/oiea/investor-alerts-and-bulletins/ib_structured_notes>", "note": "C 级因为\"复杂＝不利\"是经验法则，不是所有结构化产品都坏（部分结构性存款对保守者有用）；关键是普通人是否有能力读懂并承担其最坏情形。交叉参考：第 5 条（非标）、第 6 条（衍生品）。"}, {"chapter": 1, "num": 9, "id": "1-9", "title": "用\"可解释测试\"卡掉每笔投资", "grade": "C", "tags": {"钱": "0", "时间": "少", "毅力": "否", "收益": "中", "口径": "金钱", "影响": "自己"}, "impact": "自己", "cost_money": "0", "cost_time": "少", "cost_will": "否", "benefit": "中", "scope": "金钱", "three_zero": false, "cost": "不花钱。代价是下单前多写（或想）一句话：\"我凭什么觉得能赚，钱从谁的口袋来，我比市场多知道什么\"。", "plain": "能在一张纸上写清\"买它赚的钱从谁口袋来、我比市场多知道什么\"的，才值得投。写不出来的，就是赌。这条是前面所有纪律的总开关。", "gain": "把\"听消息、凭感觉、追热点\"挡在门外，只留下能写出逻辑链的标的。行为金融里，\"事前检验清单（pre-mortem / checklist）\"被反复证明能降低决策错误：逼自己把理由说清楚，会暴露出\"其实我什么都没多知道\"的真相。对普通人，一个最简单的可执行版本是：任何一笔投资，先写下\"我为什么买、最坏情况亏多少、我比卖家多知道什么\"，写不满三行就别买。", "source": "Kahneman D (2011). Thinking, Fast and Slow（关于 pre-mortem 与决策偏差的论述，普利策奖著作）. <https://www.penguinrandomhouse.com/books/183796/thinking-fast-and-slow-by-daniel-kahneman/>；Thaler R, Sunstein C (2008). Nudge（关于默认选项与决策脚手架的论述）. <https://www.penguinrandomhouse.com/books/305785/nudge-by-richard-h-thaler-and-cass-r-sunstein/>", "note": "C 级因为\"写清楚就少亏\"是行为学原理和常识，缺少针对\"投资可解释测试\"的单一统计数字；但原理扎实、成本低、无副作用。交叉参考：第 1 条（钱从哪来）、第 12 条（研报立场）。"}, {"chapter": 1, "num": 10, "id": "1-10", "title": "朋友／熟人荐股：你天然在信息劣势侧", "grade": "B", "tags": {"钱": "0", "时间": "少", "毅力": "些", "收益": "中", "口径": "金钱", "影响": "自己"}, "impact": "自己", "cost_money": "0", "cost_time": "少", "cost_will": "些", "benefit": "中", "scope": "金钱", "three_zero": false, "cost": "不花钱。代价是放弃\"内部消息\"和\"朋友带我一把\"的诱惑，对来路不明的\"机会\"一律当接盘预警。", "plain": "真有稳赚的消息，对方凭什么告诉你而不是自己重仓？你听到的\"机会\"，往往正是别人要找下家接盘的时点。熟人背书不是安全垫，反而常是最后一棒的信号。", "gain": "避开接盘。A 股实证极其扎心：施东辉（上交所）、张晓燕（清华五道口）与哥伦比亚大学 Charles Jones 基于上交所 2016 年 1 月至 2019 年 6 月约 5340 万个账户完整交易数据的研究显示，账户市值 10 万元以下的散户平均亏损 20.53%，而机构投资者平均盈利 11.22%；散户贡献了约 85% 的交易量却整体净亏损。同一批数据还显示，10 万元以下账户平均每年亏损 2457 元，其中选股亏 1532 元、择时亏 774 元、交易费用 151 元。频繁交易与听消息，是散户亏损的两大主因；朋友荐股恰好同时踩中这两点。", "source": "Shi D, Zhang X, Jones C (2021). 基于上交所账户数据的研究（散户与机构收益分化），发表于 Journal of Financial and Quantitative Analysis（JFQA）. 转引自中央财经大学绿色金融国际研究院 (2025). 《不充分有效市场中的普通投资者应该采取什么样的投资策略？》. <https://iigf.cufe.edu.cn/info/1012/11794.htm>；上海证券交易所资本市场研究所 (历年). 《上海证券交易所统计年鉴》投资者结构数据（散户交易量占比约 85%）. <https://www.sse.com.cn/>", "note": "B 级因为该研究基于真实全样本账户数据、发表于顶刊，结论可信；但\"亏损 20.53%\"是 2016–2019 特定区间结果，不代表每一年。交叉参考：第 2 条（分散）、第 3 条（杠杆）、第 12 条（研报）。"}, {"chapter": 1, "num": 11, "id": "1-11", "title": "内幕交易是刑事红线，不是\"小聪明\"", "grade": "A", "tags": {"钱": "0", "时间": "少", "毅力": "些", "收益": "中", "口径": "金钱", "影响": "自己／家庭"}, "impact": "自己／家庭", "cost_money": "0", "cost_time": "少", "cost_will": "些", "benefit": "中", "scope": "金钱", "three_zero": false, "cost": "不花钱。代价是放弃\"提前知道消息\"的捷径，以及任何基于未公开重大信息的交易。", "plain": "靠消息炒股，赚的是刀口钱。一旦立案，本金没收、罚款翻倍、还可能坐牢。这笔\"收益\"的代价，是确定性坐实的风险——不是\"可能出事\"，而是\"出事就全完\"。", "gain": "避免\"没收违法所得 + 1–10 倍罚款\"，情节严重追究刑责。中国《证券法》第 53 条明确禁止内幕交易，第 191 条规定：没收违法所得，并处以违法所得一倍以上十倍以下的罚款；《刑法》第 180 条（内幕交易、泄露内幕信息罪）规定，情节严重的处五年以下有期徒刑或拘役，情节特别严重的处五年以上十年以下有期徒刑，并处罚金。对普通人，碰这条不仅亏钱，还可能留下案底、影响子女政审与生活。把它当成绝对红线，回报是\"不踏入不可逆的法律风险\"。", "source": "全国人民代表大会常务委员会 (2019 修订). 《中华人民共和国证券法》第五十三条（禁止内幕交易）、第一百九十一条（处罚：没收违法所得，并处一倍以上十倍以下罚款）. <https://www.gov.cn/gongbao/content/2019/content_5465494.htm>；全国人民代表大会常务委员会 (2020 修正). 《中华人民共和国刑法》第一百八十条（内幕交易、泄露内幕信息罪：情节严重处五年以下，特别严重处五年以上十年以下）. <https://www.gov.cn/gongbao/content/202101/content_2582454.htm>", "note": "A 级为法律明文规定，无例外空间。但\"违法所得\"的认定、罚款倍数由执法机关裁量。交叉参考：第 13 条（付费荐股）、第 16 章（信息防忽悠）。"}, {"chapter": 1, "num": 12, "id": "1-12", "title": "卖方研报／评级自带立场，当情报而非结论", "grade": "B", "tags": {"钱": "0", "时间": "少", "毅力": "些", "收益": "中", "口径": "金钱", "影响": "自己"}, "impact": "自己", "cost_money": "0", "cost_time": "少", "cost_will": "些", "benefit": "中", "scope": "金钱", "three_zero": false, "cost": "不花钱。代价是保留一点独立判断，绝不一看到\"买入\"评级就下单。", "plain": "研报给你的是\"为什么涨\"的逻辑素材，不是\"该买\"的指令。卖方靠分仓佣金和承销收入活着，天然偏多——它推荐的股票，可能正是它要帮人出货的。把它当情报，不当指令。", "gain": "避开\"买在推荐高点\"。卖方分析师存在系统性乐观偏差：美国 SEC 的 Regulation AC（分析师认证规则）正是为约束这种利益冲突而设；大量学术研究发现，分析师一致\"强烈推荐\"后，标的后续超额收益往往为负，推荐更像反向指标。对普通人，正确用法是\"借它的研究框架和数据，自己下结论\"，而不是\"抄它的评级\"。", "source": "美国证券交易委员会 (2002/2003). Regulation AC（分析师认证规则，要求分析师对其评级与预测真实性认证，约束利益冲突）. <https://www.sec.gov/rules/final/34-47270.htm>；多项\"分析师推荐后超额收益为负\"实证研究（如对数千家美股评级的元分析，卖方推荐存在系统性乐观偏差）.", "note": "B 级因为\"分析师偏多、推荐后易跌\"有扎实统计支持，但单只股票不必然；用好研报的关键是区分\"事实数据\"与\"观点评级\"。交叉参考：第 9 条（可解释测试）、第 10 条（熟人荐股）。"}, {"chapter": 1, "num": 13, "id": "1-13", "title": "付费荐股群／直播带单是监管红线", "grade": "A", "tags": {"钱": "0", "时间": "少", "毅力": "些", "收益": "中", "口径": "金钱", "影响": "自己"}, "impact": "自己", "cost_money": "0", "cost_time": "少", "cost_will": "些", "benefit": "中", "scope": "金钱", "three_zero": false, "cost": "不花钱。代价是放弃\"跟着老师赚\"的幻想，对\"交会员费、承诺收益、带单操作\"一律拉黑。", "plain": "真能稳定赚钱的人，不会拉群收你那点会员费。收费带单＝先收你的钱，再拿你当流动性（你买它卖）。承诺\"稳赚\"\"保底\"本身在中国就是违法宣传。", "gain": "避开非法荐股与杀猪盘。中国《证券法》第 120 条规定，经营证券业务必须经国务院证券监督管理机构批准；第 160 条规定，证券投资咨询业务须经核准。未经许可荐股、承诺收益，均属违法；证监会历年开展非法荐股专项整治，相关参与者本金常血本无归，组织者还可能构成非法经营罪或诈骗。把\"先交钱再带单\"当成诈骗的前置信号，回报是\"不进入资金被卷走的局\"。", "source": "全国人民代表大会常务委员会 (2019 修订). 《中华人民共和国证券法》第一百二十条（证券业务须批准）、第一百六十条（投资咨询须核准）. <https://www.gov.cn/gongbao/content/2019/content_5465494.htm>；中国证券监督管理委员会 (历年). 非法荐股专项整治与风险提示（投资者保护栏目）. <https://www.csrc.gov.cn/>", "note": "A 级为法律明文。但现实中\"老师\"常包装成\"知识付费\"\"社群交流\"规避措辞，识别要点是\"是否无牌照+是否承诺收益+是否让你跟单操作\"。交叉参考：第 11 条（内幕）、第 16 章（信息防忽悠）。"}, {"chapter": 1, "num": 14, "id": "1-14", "title": "先搞清楚\"我是谁的交易对手\"", "grade": "C", "tags": {"钱": "0", "时间": "少", "毅力": "些", "收益": "中", "口径": "金钱", "影响": "自己"}, "impact": "自己", "cost_money": "0", "cost_time": "少", "cost_will": "些", "benefit": "中", "scope": "金钱", "three_zero": false, "cost": "不花钱。代价是下单前想一秒：\"我对面是谁，他为什么愿意卖给我\"。", "plain": "你买的，是别人卖的。问一句\"对方为什么愿意卖给我\"，答不上来就别买。在二级市场，你大多是在和机构、量化、内幕资金做对手盘，他们在信息、成本、速度上三重占优。", "gain": "识别自己在赌谁犯错。市场微观结构研究一致表明，散户在多数交易中处于信息劣势：你的对手可能是知情交易者、做市商或高频算法。承认这一点，就不会再把\"我比市场聪明\"当成默认假设，从而减少冲动交易和逆势博反弹。对普通人，最务实的结论是：既然大概率在信息链末端，就别去和职业玩家拼短线，转做长期、被动、分散的配置。", "source": "市场微观结构研究（如 Glosten-Milgrom 信息模型，关于知情交易与买卖价差）. <https://en.wikipedia.org/wiki/Glosten%E2%80%93Milgrom_model>；O'Hara M (1995). Market Microstructure Theory（市场微观结构理论，关于信息不对称的经典论述）.", "note": "C 级因为\"散户处于信息劣势\"是理论共识而非单一可量化法条；但它解释了为什么第 2、3、10 条的纪律如此重要。交叉参考：第 2 条（分散）、第 10 条（熟人荐股）。"}, {"chapter": 1, "num": 15, "id": "1-15", "title": "把\"名人／大 V 持仓\"当背书默认无效", "grade": "C", "tags": {"钱": "0", "时间": "少", "毅力": "些", "收益": "中", "口径": "金钱", "影响": "自己"}, "impact": "自己", "cost_money": "0", "cost_time": "少", "cost_will": "些", "benefit": "中", "scope": "金钱", "three_zero": false, "cost": "不花钱。代价是放弃\"抄大佬作业\"的捷径，不因为谁买了就跟着买。", "plain": "你看到大 V 的持仓时，他可能已经在减仓；就算他还拿着，他的成本、仓位、久期你全不知道。抄作业抄的是别人的历史，不是未来。", "gain": "避开滞后接盘与\"抬轿\"。美国 13F 持仓披露要求机构每季度结束后 45 天内上报，信息公开时早已滞后一个多月，且只披露多头、不披露空头和对冲；等散户看到再去买，往往买在阶段性高位。行为金融的\"权威偏差（authority bias）\"又让人天然高估名人的胜率。把\"大 V 也买了\"当成无效信息，回报是\"不替别人的成本站岗\"。", "source": "美国证券交易委员会 (无年份). Form 13F 申报要求（机构季度持仓在季度结束后 45 天内披露，存在时滞且仅披露多头）. <https://www.sec.gov/divisions/investment/13flists.htm>；行为金融\"权威偏差\"研究综述（对专家/名人过度信赖的决策偏差）.", "note": "C 级因为\"抄作业亏\"是经验与行为学结论，缺乏单一统计数字；但 13F 的时滞是明文规则。交叉参考：第 10 条（熟人荐股）、第 12 条（研报立场）。"}, {"chapter": 2, "num": 1, "id": "2-1", "title": "基金费率是确定性最高的“负回报”", "grade": "A", "tags": {"钱": "少", "时间": "0", "毅力": "些", "收益": "中", "口径": "金钱", "影响": "自己／家庭"}, "impact": "自己／家庭", "cost_money": "少", "cost_time": "0", "cost_will": "些", "benefit": "中", "scope": "金钱", "three_zero": false, "cost": "每年直接计提的管理费＋托管费。主动偏股基金常见 1.0%–1.5%/年，指数基金约 0.1%–0.5%/年，宽基 ETF 可低至 0.03%–0.15%/年。", "plain": "费率是你买入前就 100% 确定的“负收益”。市场涨跌你猜不准，但费率是写进合同的。先把它压到最低，比研究哪只基金牛靠谱得多。", "gain": "费率与未来净业绩显著负相关，且这是少数“提前可知”的变量。晨星 2026 年国会证词原文指出，“cost is the most reliable predictor of future fund performance（成本是对未来基金表现最可靠的预测变量）”，其最低费率五分位基金成功率显著高于最高费率五分位。复利算例：在 7% 年化毛收益假设下，1% 年费率 30 年吃掉约 25% 终值，2% 费率吃掉约 43%；中国主动基金平均费率约 1.2%–1.5% 对比指数基金 0.1%–0.5%，仅费率差一项 20 年就可拉开约 20% 以上的终值差距。每省下的基点都留在你账户里复利。", "source": "Morningstar (2026). Morningstar to Congress: Investor Success Hinges on Lower Costs, Greater Transparency（证词原文 “cost is the most reliable predictor”）. <https://www.morningstar.com/funds/morningstar-congress-investor-success-hinges-lower-costs-greater-transparency>; Carhart, M. (1997). On Persistence in Mutual Fund Performance, Journal of Finance 52(1):57–82. <https://doi.org/10.1111/j.1540-6261.1997.tb03808.x>; 晨星 (2026). 2026 US Fund Fee Study（资产加权平均费率 2025 年降至 0.32%）. <https://www.morningstar.com/funds/morningstar-congress-investor-success-hinges-lower-costs-greater-transparency>", "note": "局限性：低费率不保证高收益，只提高同策略下的胜率；主动管理在部分低效率市场（如固收、新兴市场）可能创造超额。交叉参考：第 5、10、13 条。"}, {"chapter": 2, "num": 2, "id": "2-2", "title": "佣金、印花税、申赎费：复利杀手", "grade": "B", "tags": {"钱": "少", "时间": "少", "毅力": "些", "收益": "中", "口径": "金钱", "影响": "自己"}, "impact": "自己", "cost_money": "少", "cost_time": "少", "cost_will": "些", "benefit": "中", "scope": "金钱", "three_zero": false, "cost": "每次买卖的显性摩擦。A 股卖出方印花税自 2023-08-28 起减半至成交金额 0.05%（单边），券商佣金普遍约万 2.5（0.025%）且另含约万 0.1 经手费；ETF 免印花税、免过户费。", "plain": "每月买卖几次，摩擦一年吞 1%–3%，二十年累积差距巨大。你给券商和税务局打工的比例，跟换手率成正比。", "gain": "频繁交易是散户净收益的“隐形抽水机”。Barber & Odean（2000）经典研究发现，交易最频繁的散户群体年化净收益显著落后于市场与低频交易者。以 A 股为例：假设每月全仓换手一次，单边成本约 0.05% 印花税＋0.025% 佣金≈0.075%，一年 12 次约 0.9%，加上买卖价差与冲击成本实际常达 1%–3%；若把摩擦从每年 1.5% 压到 0.1%，在 7% 年化、30 年下终值相差可达约 30%。ETF 因免印花税、可场内低成本买卖，是降低摩擦的直接工具。", "source": "财政部 税务总局 (2023). 关于减半征收证券交易印花税的公告（财政部 税务总局公告2023年第39号，自2023年8月28日起实施减半征收）. <https://fgk.chinatax.gov.cn/zcfgk/c102416/c5211343/content.html>; Barber, B. & Odean, T. (2000). Trading Is Hazardous to Your Wealth, Journal of Finance 55(2):773–806. <https://doi.org/10.1111/j.1540-6261.2000.tb03224.x>; 国家税务总局 (2023). 近期印花税相关热点问题解答（单边 0.5‰ 对出让方征收）. <https://shanghai.chinatax.gov.cn/gate/big5/shanghai.chinatax.gov.cn/zcfw/rdwd/202309/t468612.html>", "note": "不确定性：印花税为政策变量，未来仍可能调整；ETF 免印花税的优惠以当前规则为准。交叉参考：第 5 条（ETF 免印花税）。"}, {"chapter": 2, "num": 3, "id": "2-3", "title": "先把钱放进税优／免税账户", "grade": "B", "tags": {"钱": "少", "时间": "少", "毅力": "些", "收益": "中", "口径": "金钱", "影响": "自己／家庭"}, "impact": "自己／家庭", "cost_money": "少", "cost_time": "少", "cost_will": "些", "benefit": "中", "scope": "金钱", "three_zero": false, "cost": "一点开户与额度规划精力；中国个人养老金每年限额 12000 元，资金一般锁定至退休（极少数特殊情形可领）。", "plain": "同样年化，税后和税前差一截。能合法递延的税就是免费复利加速器；且养老账户“取出来麻烦”，正好管住手。", "gain": "财政部 税务总局公告 2022 年第 34 号规定，个人养老金在缴费环节按 12000 元/年限额在综合所得或经营所得中据实扣除，投资环节计入账户的投资收益暂不征收个税，领取环节单独按 3% 税率缴税（原税延养老保险实际税负由 7.5% 降为 3%）。对个税边际税率 10% 及以上者，仅缴费抵扣一项每年最多省 1200 元所得税，而投资期内的“免税复利”放大效应随年限递增；账户“长钱”属性还反向抑制频繁交易（见第 2 条）。2024 年第 21 号公告已将该政策扩至全国。", "source": "财政部 税务总局 (2022). 关于个人养老金有关个人所得税政策的公告（财政部 税务总局公告2022年第34号，第一条递延纳税、3% 领取税率）. <https://sichuan.chinatax.gov.cn/art/2022/11/4/art_7757_794159.html>; 财政部 税务总局 (2024). 关于在全国范围实施个人养老金个人所得税优惠政策的公告（2024年第21号）. <https://zhejiang.chinatax.gov.cn/art/2026/3/9/art_24107_650245.html>; IRS (2025). Topic No. 451, Individual Retirement Arrangements (IRAs)（美国传统 IRA/401(k) 税前缴费、投资期免税、领取按普通所得税；应税账户长期资本利得另适用 0%/15%/20%，见 Topic No. 409）. <https://www.irs.gov/taxtopics/tc451>", "note": "局限性：额度小（年 1.2 万）、领取锁定，省税力度与边际税率正相关；境外参考美国传统 IRA/401(k) 同理，但应税账户长期资本利得仅 0%/15%/20%（IRS 2025，单身应税所得超 $533,400 为 20%，另加 3.8% NIIT）。交叉参考：第 2、4 条。"}, {"chapter": 2, "num": 4, "id": "2-4", "title": "分红再投资，别拿现金", "grade": "C", "tags": {"钱": "0", "时间": "0", "毅力": "否", "收益": "中", "口径": "金钱", "影响": "自己"}, "impact": "自己", "cost_money": "0", "cost_time": "0", "cost_will": "否", "benefit": "中", "scope": "金钱", "three_zero": true, "cost": "勾选一个选项（零成本）。", "plain": "分红是资产一部分，拿现金等于自动减仓放弃后续上涨。除非靠股息生活，默认“红利再投资”。", "gain": "财税〔2015〕101 号规定，个人从公开市场取得上市公司股票，持股期限超过 1 年的股息红利所得暂免征收个税；持股 1 个月以上至 1 年（含）减按 50% 计入应纳税所得额（即实际税负 10%），1 个月以内（含）全额按 20% 计征。A 股长期持有免税，更该复投以继续滚复利。以 10 万元持仓、年化股息率 3% 计，若分红免税且全额复投于年化 6% 的组合，10 年免税红利及其再投资约可多积累数万元（估算，取决于净值增长）。美股账户内 DRIP 同样避免频繁小额买卖的摩擦（见第 2 条）。", "source": "财政部 国家税务总局 证监会 (2015). 关于上市公司股息红利差别化个人所得税政策有关问题的通知（财税〔2015〕101号，第一条持股超 1 年暂免）. <https://www.chinatax.gov.cn/chinatax/n810341/n810765/n1465977/201510/c1967339/content.html>; 国家税务总局 12366 (2024). 股息红利个税解答（差别化税率适用）. <https://12366.chinatax.gov.cn/nszx/onlinemessage/detail?id=30479c1fc89c4a419852b2f2da5e4f55>", "note": "局限性：若需现金流养老另当别论；复投收益为估算口径。交叉参考：第 15 条（分红不增值）。"}, {"chapter": 2, "num": 5, "id": "2-5", "title": "ETF 优于场外申赎基金（同策略下）", "grade": "B", "tags": {"钱": "少", "时间": "少", "毅力": "些", "收益": "中", "口径": "金钱", "影响": "自己"}, "impact": "自己", "cost_money": "少", "cost_time": "少", "cost_will": "些", "benefit": "中", "scope": "金钱", "three_zero": false, "cost": "需要一个证券账户（一次性），此后场内买卖。", "plain": "同样买沪深300，场内 ETF 费率常是场外基金的三分之一到一半，且免印花税。长期差出来的就是你的净收益。", "gain": "宽基 ETF 年化管理费＋托管费常 0.03%–0.5%（如沪深300ETF 约 0.15%/年），而主动场外偏股基金约 1.0%–1.5%/年；且 ETF 场内交易免印花税（见第 2 条）、透明度高、跟踪误差小（主流宽基 ETF 跟踪误差多在 0.1%–0.5%/年，见第 14 条）。以 100 万元、20 年 7% 年化计，1.2% 费率 vs 0.15% 费率，终值相差约 22%（高费率方仅拿到低费率方的约 78%）。晨星 2026 数据显示美国资产加权平均费率已降至 0.32%，同策略下 ETF 是压低持有成本最直接的工具。", "source": "晨星 (2026). 2026 US Fund Fee Study（资产加权平均费率 2025 年 0.32%，较二十年前 0.80% 减半）. <https://www.morningstar.com/funds/morningstar-congress-investor-success-hinges-lower-costs-greater-transparency>; 中国证监会 (2014). 公开募集证券投资基金运作管理办法（ETF 运作与披露）. <https://www.csrc.gov.cn/csrc/c106256/c1653978/content.shtml>; 上海证券交易所. ETF 业务实施细则（场内交易、免印花税机制）. <https://www.sse.com.cn/>", "note": "局限性：ETF 存在折溢价与跟踪误差（见第 14 条）；场外基金在定投自动扣款等场景更便利。交叉参考：第 2、14 条。"}, {"chapter": 2, "num": 6, "id": "2-6", "title": "QDII／海外资产的汇率与额度成本", "grade": "B", "tags": {"钱": "少", "时间": "少", "毅力": "些", "收益": "中", "口径": "金钱", "影响": "自己"}, "impact": "自己", "cost_money": "少", "cost_time": "少", "cost_will": "些", "benefit": "中", "scope": "金钱", "three_zero": false, "cost": "汇率摩擦＋申赎时间长（T+数日甚至更久）＋额度紧时溢价。", "plain": "买美股基金不只为赚美股，也为对冲人民币风险；但汇率双向，别把它当纯增强。", "gain": "QDII 基金申购赎回多为 T+企业日（通常 T+7 至 T+10 确认），资金占用与机会成本高于境内 ETF；额度紧张时（如 2020–2021 部分 QDII-ETF 溢价 5%–20%）场内出现高溢价，溢价买入等于先亏一道。汇率方面，人民币升值时境外收益被侵蚀、贬值时放大——不是免费午餐，而是双向暴露。适度配置可分散单一货币/经济体风险，但应忽略短期汇率波动、长期持有，避免把“汇率择时”变成另一重摩擦。", "source": "国家外汇管理局. QDII 额度审批与境外投资相关规定（额度紧时溢价机制）. <https://www.safe.gov.cn/>; 中国人民银行. 人民币汇率风险相关研究（双向风险）. <http://www.pbc.gov.cn/>; 晨星. QDII 基金折溢价案例（2020–2021 额度紧时部分产品溢价 5%–20%）. <https://www.morningstar.com/>", "note": "争议：配置价值真实，但择时汇率纯属赌；溢价买入属可避免的显性损耗。交叉参考：第 14 条（折溢价）。"}, {"chapter": 2, "num": 7, "id": "2-7", "title": "隐性费用比显性费用更贵", "grade": "C", "tags": {"钱": "少", "时间": "少", "毅力": "些", "收益": "中", "口径": "金钱", "影响": "自己"}, "impact": "自己", "cost_money": "少", "cost_time": "少", "cost_will": "些", "benefit": "中", "scope": "金钱", "three_zero": false, "cost": "读合同／招募说明书“费用”一节的一点精力。", "plain": "显性的管理费你看得见，隐性的“各种服务费”才咬人。费率表里每一行小字，都是你未来的负收益。", "gain": "SEC 投资者公告指出，基金费用除管理费外还包括 12b-1（分销/服务费，FINRA 规定分销部分上限 0.75%/年、服务部分上限 0.25%/年）、赎回费（SEC 上限 2%）、账户费等；其中 12b-1 与销售服务费直接从净值计提、投资者不易察觉。自动投顾（robo-advisor）还叠加一层投顾管理费（常 0.25%–0.50%/年）。这些隐性层叠加后，标称 0.5% 的基金实际持有成本可达 1% 以上。逐项读出费用表，是避开隐性抽成的前提。", "source": "SEC (投资者公告). Mutual Fund and ETF Fees and Expenses（12b-1、赎回费、账户费披露）. <https://sec.gov/answers/mfcal.htm>; SEC (PDF). Mutual Fund Fees and Expenses – Investor Bulletin（FINRA 对 12b-1 分销 0.75%、服务 0.25% 上限）. <https://www.investor.gov/sites/default/files/ib_mutualfundfees.pdf>; 中国证监会. 基金信息披露编报规则（费用列示要求）. <https://www.csrc.gov.cn/>", "note": "交叉参考：第 10、11、13 条（真实费率=各项之和）。"}, {"chapter": 2, "num": 8, "id": "2-8", "title": "基金转换与赎回费的隐性损耗", "grade": "C", "tags": {"钱": "少", "时间": "少", "毅力": "些", "收益": "中", "口径": "金钱", "影响": "自己"}, "impact": "自己", "cost_money": "少", "cost_time": "少", "cost_will": "些", "benefit": "中", "scope": "金钱", "three_zero": false, "cost": "频繁在基金间“转换”时被收的赎回费＋新申购费。", "plain": "很多平台把“转换”包装得零成本，实际可能收赎回费＋新申购费。看清算总成本再动。", "gain": "部分基金“转换”实为“先赎回再申购”，会触发赎回费（SEC 上限 2%，国内多 0.5% 以内且短期持有更高）与新份额申购费；且频繁转换往往由短期排名驱动，属行为金融的“追逐业绩”——SPIVA 显示多数主动基金长期跑输基准，反复横跳既付费用又择错时。把“用脚投票”的成本压下来，方能不被排名诱导反复横跳，保住复利连续性。", "source": "中国证监会 (2014). 公开募集证券投资基金运作管理办法（赎回/转换费用规则）. <https://www.csrc.gov.cn/csrc/c106256/c1653978/content.shtml>; SEC (投资者公告). Mutual Fund and ETF Fees and Expenses（赎回费上限 2%）. <https://sec.gov/answers/mfcal.htm>; S&P Dow Jones Indices. SPIVA Scorecard（主动基金长期跑输基准）. <https://www.spglobal.com/spdji/en/research-insights/spiva/>", "note": "交叉参考：第 2、13 条（赎回费与销售服务费）。"}, {"chapter": 2, "num": 9, "id": "2-9", "title": "警惕“基金超市”里的销售导向陷阱", "grade": "C", "tags": {"钱": "0", "时间": "少", "毅力": "些", "收益": "中", "口径": "金钱", "影响": "自己"}, "impact": "自己", "cost_money": "0", "cost_time": "少", "cost_will": "些", "benefit": "中", "scope": "金钱", "three_zero": false, "cost": "一点独立判断，不盲信平台“热销／推荐”标签。", "plain": "平台“为你推荐”的第一动机是它自己的佣金，不是你的收益。排序权在自己手里。", "gain": "SEC 指出销售渠道存在利益冲突：推荐位常由尾随佣金/分销费（见第 13 条）驱动，而非投资者利益。国内基金销售机构受《公开募集证券投资基金销售机构监督管理办法》适当性约束，但“热销榜”“爆款”仍多为流量与佣金产物。被推到眼前的产品往往费率偏高或风格漂移。养成“先看费率表、再看业绩”的习惯，避开销售导向陷阱，零成本却可能省下每年 0.5%–1% 的隐性让利。", "source": "SEC (投资者公告). Mutual Fund and ETF Fees and Expenses（12b-1 与销售激励冲突）. <https://sec.gov/answers/mfcal.htm>; 中国证监会. 公开募集证券投资基金销售机构监督管理办法（适当性与销售规范）. <https://www.csrc.gov.cn/>; 晨星. 费用与销售激励研究（推荐位与费用结构）. <https://www.morningstar.com/>", "note": "交叉参考：第 7、11、13 条（隐性费用与尾随佣金）。"}, {"chapter": 2, "num": 10, "id": "2-10", "title": "真费率是“管理费＋托管费＋销售服务费”之和", "grade": "A", "tags": {"钱": "少", "时间": "少", "毅力": "些", "收益": "中", "口径": "金钱", "影响": "自己／家庭"}, "impact": "自己／家庭", "cost_money": "少", "cost_time": "少", "cost_will": "些", "benefit": "中", "scope": "金钱", "three_zero": false, "cost": "读一眼招募说明书的“费用”一节。", "plain": "费率表有三行小字，加起来才是你每年实付。别只看醒目的“0.15% 管理费”，后面可能还藏着销售服务费。", "gain": "真实持有成本＝管理费＋托管费＋销售服务费（C 类常见 0.2%–0.8%/年）＋其他费用之和，即“总运作费用率（expense ratio）”。晨星研究：最低费率四分位基金成功率显著高于最高费率四分位（如全球大盘股组 60% vs 23%）。复利算例：1% 年费在 30 年 7% 年化下吃掉约 25% 终值、2% 吃掉约 43%；费率差 1%≈终值差近 1/4。看清三行小字之和，是压低成本的第一步，也是晨星所谓“最可靠预测变量”的落地动作。", "source": "晨星(澳) (2024). Future Focus: The three factors that will increase your returns（原文 “a fund's annual fee is the most proven predictor of future fund returns”，最低四分位成功率 60% vs 23%）. <https://www.morningstar.com.au/personal-finance/future-focus-three-factors-that-will-increase-your-returns>; Morningstar (2026). 国会证词（cost is the most reliable predictor）. <https://www.morningstar.com/funds/morningstar-congress-investor-success-hinges-lower-costs-greater-transparency>; Carhart, M. (1997). On Persistence in Mutual Fund Performance. <https://doi.org/10.1111/j.1540-6261.1997.tb03808.x>", "note": "交叉参考：第 1、7、13 条（费率拆解与尾随佣金）。"}, {"chapter": 2, "num": 11, "id": "2-11", "title": "申购费“打一折”仍可能为销售让利", "grade": "C", "tags": {"钱": "少", "时间": "少", "毅力": "些", "收益": "中", "口径": "金钱", "影响": "自己"}, "impact": "自己", "cost_money": "少", "cost_time": "少", "cost_will": "些", "benefit": "中", "scope": "金钱", "three_zero": false, "cost": "比较不同渠道的申购费与尾随佣金。", "plain": "1 折申购费看着香，但平台仍从你每年资产里抽尾随佣金。长期看，低管理费＋免销售服务费才是真省。", "gain": "尾随佣金（客户维护费）按资产年化从净值计提，即便申购费打 1 折，平台仍持续抽成（常见于 C 类销售服务费 0.2%–0.8%/年，见第 13 条）。以 100 万元持仓、0.4% 尾随/年计，10 年累计抽走约 4.7 万元（未计复利），远超一次性申购费打折省下的几千元。选“免销售服务费＋低管理费”的 A 类或 ETF，长期显著更省。SEC 亦警示费用结构对净收益的持续侵蚀。", "source": "中国证监会. 公开募集证券投资基金销售费用管理规定（客户维护费/尾随佣金计提）. <https://www.csrc.gov.cn/>; SEC (投资者公告). Mutual Fund and ETF Fees and Expenses（12b-1/分销费持续计提）. <https://sec.gov/answers/mfcal.htm>; 晨星. 费用结构研究（尾随佣金侵蚀净收益）. <https://www.morningstar.com/>", "note": "交叉参考：第 7、9、13 条（隐性费用与销售服务费）。"}, {"chapter": 2, "num": 12, "id": "2-12", "title": "规模过小基金有清盘风险", "grade": "B", "tags": {"钱": "少", "时间": "少", "毅力": "些", "收益": "中", "口径": "金钱", "影响": "自己"}, "impact": "自己", "cost_money": "少", "cost_time": "少", "cost_will": "些", "benefit": "中", "scope": "金钱", "three_zero": false, "cost": "避开规模低于清盘线的迷你基。", "plain": "买基金先看规模，低于 2 亿要警惕、逼近 5000 万红线更要躲。清盘不是亏多少的问题，是被迫在不想要的时间点离场。", "gain": "《公开募集证券投资基金运作管理办法》第 41 条规定：开放式基金基金合同生效后，连续 20 个工作日出现基金份额持有人数量不满 200 人或者基金资产净值低于 5000 万元情形的，应在定期报告中予以披露；连续 60 个工作日出现前述情形的，基金管理人应向证监会报告并提出解决方案（转换运作方式、与其他基金合并或者终止基金合同等），并召开基金份额持有人大会表决。清盘以最后一日净值返还，相当于强制赎回，可能把你“锁在亏损里”或打断复利。买前看规模与持有人数，是避免被迫离场的基本功。", "source": "中国证监会 (2014). 公开募集证券投资基金运作管理办法 第41条（200人/5000万元清盘红线）. <https://www.csrc.gov.cn/csrc/c106256/c1653978/content.shtml>; 中国政府网. 公开募集证券投资基金运作管理办法（含第41条全文）. <https://big5.www.gov.cn/gate/big5/www.gov.cn/zhengce/2021-12/16/content_5724611.htm>; 中国证券报/证券时报 (2024). 迷你基金清盘常态化与自动终止条款修改报道. <https://www.cs.com.cn/tzjj/jjdt/202407/t20240711_6423774.html>", "note": "局限性：清盘非必然发生（有 60 工作日缓冲与持有人大会程序）；发起式基金另有三年存续规则。交叉参考：第 14 条（流动性与折溢价）。"}, {"chapter": 2, "num": 13, "id": "2-13", "title": "尾随佣金（客户维护费）从你资产里持续抽", "grade": "B", "tags": {"钱": "少", "时间": "少", "毅力": "些", "收益": "中", "口径": "金钱", "影响": "自己"}, "impact": "自己", "cost_money": "少", "cost_time": "少", "cost_will": "些", "benefit": "中", "scope": "金钱", "three_zero": false, "cost": "选不收或少收销售服务费的份额。", "plain": "A/C 类不是“哪个好”，是费用结构不同。短期持有 C 类免申购费或许划算，长期持有 A 类（免销售服务费）更省。", "gain": "C 类份额销售服务费常 0.2%–0.8%/年，从净值持续计提支付给销售渠道；A 类收一次性申购费但免销售服务费。以 100 万元、持有 10 年、C 类 0.4%/年服务费计，累计被抽约 4.7 万元（未计复利），而 A 类一次性申购费打 1 折仅约 0.1 万–0.15 万元。临界点约 1–2 年：短于它选 C，长于它选 A。FINRA 对 12b-1 分销费设 0.75%/年上限，但销售服务费仍可观，长期持有务必比较总费用率。", "source": "中国证监会. 公开募集证券投资基金销售费用管理规定（客户维护费/尾随佣金）. <https://www.csrc.gov.cn/>; SEC (投资者公告). Mutual Fund and ETF Fees and Expenses（12b-1 费用上限）. <https://sec.gov/answers/mfcal.htm>; FINRA. Rule 2341（12b-1 分销费 0.75%、服务费率 0.25% 上限）. <https://www.finra.org/rules-guidance/rulebooks/finra-rules/2341>", "note": "交叉参考：第 7、9、10、11 条（隐性费用与真实费率）。"}, {"chapter": 2, "num": 14, "id": "2-14", "title": "ETF 折溢价与跟踪误差是隐藏成本", "grade": "B", "tags": {"钱": "少", "时间": "少", "毅力": "些", "收益": "中", "口径": "金钱", "影响": "自己"}, "impact": "自己", "cost_money": "少", "cost_time": "少", "cost_will": "些", "benefit": "中", "scope": "金钱", "three_zero": false, "cost": "看一眼 ETF 的折溢价与跟踪误差。", "plain": "ETF 价格是市场交易价，可能高于（溢价）或低于（折价）净值。溢价时买等于先亏一道；长期看跟踪误差小的才贴基准。", "gain": "ETF 交易价格围绕 IOPV（参考净值）波动，流动性差或情绪驱动时溢价可达 1%–5% 甚至更高（QDII-ETF 在 2020–2021 额度紧时溢价 5%–20%，见第 6 条），溢价买入立即浮亏。跟踪误差方面，主流宽基 ETF 年化跟踪误差多在 0.1%–0.5%，但部分行业/主题 ETF 可达 1% 以上，长期偏离基准。选高流动性、低跟踪误差的 ETF，并在溢价时避免追买，是隐藏成本控制点；折价的存在也提示“市价≠净值”需核对。", "source": "上海证券交易所. ETF 业务实施细则（IOPV 与申赎机制）. <https://www.sse.com.cn/>; 中国证监会 (2014). 公开募集证券投资基金运作管理办法（跟踪误差披露）. <https://www.csrc.gov.cn/csrc/c106256/c1653978/content.shtml>; 晨星. ETF 跟踪误差数据（宽基 0.1%–0.5%/年）. <https://www.morningstar.com/>", "note": "交叉参考：第 5、6 条（ETF 费率与 QDII 溢价）。"}, {"chapter": 2, "num": 15, "id": "2-15", "title": "基金分红是“左口袋到右口袋”，不增值", "grade": "C", "tags": {"钱": "0", "时间": "0", "毅力": "否", "收益": "中", "口径": "金钱", "影响": "自己"}, "impact": "自己", "cost_money": "0", "cost_time": "0", "cost_will": "否", "benefit": "中", "scope": "金钱", "three_zero": true, "cost": "零。", "plain": "基金分红不是发钱给你，是把你账户里的钱从左兜挪到右兜、净值降一截。营销爱拿“分红次数多”当卖点，别上当。", "gain": "基金分红后单位净值同额下降，总市值不变（除息机制），既不增值也不天然免税（除非满足股息红利差别化持有期，见第 4 条）。部分基金以“高分红”制造稳健假象，甚至为分红被迫卖出持仓、产生交易成本与税。默认选“红利再投资”（见第 4 条）才不会因分红自动减仓。监管要求在定期报告中披露分红，但营销常夸大其词；认清分红不创造收益，可避免被“分红噱头”诱导买入高费率产品。", "source": "中国证监会 (2014). 公开募集证券投资基金运作管理办法（收益分配与披露）. <https://www.csrc.gov.cn/csrc/c106256/c1653978/content.shtml>; 财政部 国家税务总局 证监会 (2015). 关于上市公司股息红利差别化个人所得税政策有关问题的通知（财税〔2015〕101号，分红税务口径）. <https://www.chinatax.gov.cn/chinatax/n810341/n810765/n1465977/201510/c1967339/content.html>", "note": "交叉参考：第 4 条（分红再投资才滚复利）。"}, {"chapter": 3, "num": 1, "id": "3-1", "title": "频繁交易：散户亏损头号内因", "grade": "A", "tags": {"钱": "少", "时间": "少", "毅力": "些", "收益": "中", "口径": "金钱", "影响": "自己"}, "impact": "自己", "cost_money": "少", "cost_time": "少", "cost_will": "些", "benefit": "中", "scope": "金钱", "three_zero": false, "cost": "交易佣金、印花税、买卖价差，以及“手痒就要操作”的冲动成本。", "plain": "Barber 与 Odean 跟踪了美国一家大型折扣券商 1991—1996 年间的 66,465 个真实账户。结论冷酷：买卖越勤，收益越差。你以为在“把握机会”，数据说你在“稳定失血”。最活跃的那批人，年化净收益只有 11.4%，而市场同期年化 17.9%——光是交易就吃掉了 6.5 个百分点。", "gain": "Barber & Odean (2000) 用 66,465 个美国家庭账户（1991—1996）证明，平均账户年化净收益 16.4%、年换手率高达 75%；而交易最频繁的顶层五分位，扣除成本后年化仅 11.4%，较市场 17.9% 低 6.5 个百分点，其毛收益约 18.7% 几乎全被交易成本与择股失误吃掉。换言之，越操作越亏，且亏损全部来自“动作”本身而非市场。若把 11.4% 与 17.9% 的差距复利 10 年，最活跃者的最终财富比躺平者少约 40%。", "source": "Barber, B. M. & Odean, T. (2000). \"Trading Is Hazardous to Your Wealth: The Common Stock Investment Performance of Individual Investors.\" Journal of Finance, 55(2), 773–806. <https://doi.org/10.1111/0022-1082.00226>; Barber, B. M. & Odean, T. (2001). \"Boys Will Be Boys: Gender, Overconfidence, and Common Stock Investment.\" Quarterly Journal of Economics, 116(1), 261–292. <https://doi.org/10.1162/003355301556400>", "note": "样本为美国折扣券商客户、集中于 1990 年代，但结论在芬兰、台湾、中国等市场反复重现。定级 A 因样本量巨大、账户级真实交易、且被后续研究大量复制。对抗方法见第 18 条（双曲贴现）与“定投克服择时”。交叉参考：第 6 条过度自信是频繁交易的根本动因。"}, {"chapter": 3, "num": 2, "id": "3-2", "title": "择时：长期持续跑赢几乎不可能", "grade": "A", "tags": {"钱": "0", "时间": "少", "毅力": "些", "收益": "中", "口径": "金钱", "影响": "自己"}, "impact": "自己", "cost_money": "0", "cost_time": "少", "cost_will": "些", "benefit": "中", "scope": "金钱", "three_zero": false, "cost": "判断顶底的时间、焦虑，以及因“空仓等待”而错过的上涨。", "plain": "最贵的错过，是市场涨最好的那几天你不在场。择时的代价，是“躲过下跌”的同时几乎必然“错过上涨”。DALBAR 连续 30 年追踪美国共同基金投资者的真实行为，结论一致：普通人靠择时年年跑输指数。", "gain": "DALBAR《2025 量化投资者行为报告（QAIB）》显示，2024 年普通股基金投资者年化仅 16.54%，而标普 500 涨了 25.02%，差距 848 个基点（8.48 个百分点），为十余年来第二差；且普通股票投资者已连续 15 年跑输标普 500。更长期的“行为缺口”同样触目：SPIVA 数据表明，截至 2024 年底的 10 年期，84.3% 的大型主动基金跑输标普 500，15 年期更是“22 个股票类别中无一有过半主动基金跑赢”。择时与选股双重失败，是行为缺口的主因。", "source": "DALBAR (2025). \"2025 Quantitative Analysis of Investor Behavior (QAIB).\" <https://www.dalbar.com/press-release/investors-missed-the-best-of-2024s-market-gains-latest-dalbar-investor-behavior-report-finds>; S&P Dow Jones Indices (2025). \"SPIVA U.S. Scorecard Year-End 2024.\" <https://www.spglobal.com/spdji/en/documents/spiva/spiva-us-year-end-2024.pdf>", "note": "QAIB 用“资金流入流出”反推投资者实际到手收益，天然包含择时错误；SPIVA 衡量主动基金且含幸存者偏差修正。定级 A 因数据跨度超 30 年、样本覆盖全市场共同基金。对抗方法：放弃择时，用定期定额把“买入”机械化。交叉参考：第 1 条（频繁交易）、第 18 条（双曲贴现）。"}, {"chapter": 3, "num": 3, "id": "3-3", "title": "追涨杀跌：在人性最弱点下单", "grade": "B", "tags": {"钱": "少", "时间": "少", "毅力": "些", "收益": "中", "口径": "金钱", "影响": "自己"}, "impact": "自己", "cost_money": "少", "cost_time": "少", "cost_will": "些", "benefit": "中", "scope": "金钱", "three_zero": false, "cost": "追高的高价 + 杀跌的低价，双向磨损。", "plain": "涨了怕错过、跌了怕更惨，于是高点冲、低点割。Barber & Odean (2008) 用券商数据证明，散户净买入最多的，恰恰是过去大涨、媒体最热的股票——把“注意力”直接翻译成亏损。反着做才正收益，但反人性，所以靠计划不靠感觉。", "gain": "Barber & Odean (2008) 发现，个人与机构都显著“追涨”：投资者净买入的股票，是前一周／前一个月涨幅最高、被新闻曝光最多的那批；这种注意力驱动的买入，后续收益显著跑输他们卖出的股票。在中国，上交所对数千万账户的统计也显示，散户在牛市最狂热时集中放量涌入、在熊市低点恐慌杀跌，牛熊转换中净亏损远高于机构。把“高买低卖”还给市场、改为纪律化“低买高卖”，是少数能稳定贡献正收益的动作。", "source": "Barber, B. M. & Odean, T. (2008). \"All That Glitters: The Effect of Attention and News on the Buying Behavior of Individual and Institutional Investors.\" Review of Financial Studies, 21(2), 785–818. <https://doi.org/10.1093/rfs/hhm079>; 上海证券交易所 (2020). 《上海证券交易所统计年鉴》. <https://www.sse.com.cn/>", "note": "上交所数据已在本书其他章节（散户 5340 万账户研究）详引，此处交叉参考。定级 B：追涨的“注意力假说”有强账户证据，但“杀跌”在 A 股样本中难以与择时错误完全分离。对抗方法：定投 + 再平衡，把买卖与情绪脱钩。交叉参考：第 9 条（羊群效应）、第 17 条（社会比较）。"}, {"chapter": 3, "num": 4, "id": "3-4", "title": "损失厌恶：亏的痛 ≈ 赚的乐的 2 倍", "grade": "A", "tags": {"钱": "0", "时间": "少", "毅力": "些", "收益": "中", "口径": "金钱", "影响": "自己"}, "impact": "自己", "cost_money": "0", "cost_time": "少", "cost_will": "些", "benefit": "中", "scope": "金钱", "three_zero": false, "cost": "承认“割肉”的不适，以及为回避这种不适而付出的机会成本。", "plain": "亏 100 的难受，约等于赚 200 的开心。于是亏了不肯卖、赚了急着卖——这套本能是投资负资产，得用规则压着。Kahneman 与 Tversky 的前景理论把这件事量化了：价值函数在损失区更陡。", "gain": "Kahneman & Tversky (1979) 的前景理论给出损失厌恶系数 λ≈2.0–2.5：亏 100 元带来的负效用，约等于赚 200–250 元的正效用，这一结论在数十国、多种实验中反复重现。在投资上，它直接制造两个亏损动作——死扛亏损标的、过早卖出盈利标的——并放大“短视损失厌恶”：Benartzi & Thaler (1995) 证明，越是频繁查看账户（日频 vs 年频），投资者越觉得股票风险高、越拿不住，从而要求过高的股权风险溢价。损失厌恶叠加频繁盯盘，是长期低配股票、错过复利的主因之一。", "source": "Kahneman, D. & Tversky, A. (1979). \"Prospect Theory: An Analysis of Decision under Risk.\" Econometrica, 47(2), 263–291. <https://doi.org/10.2307/1914185>; Benartzi, S. & Thaler, R. H. (1995). \"Myopic Loss Aversion and the Equity Premium Puzzle.\" Quarterly Journal of Economics, 110(1), 73–92. <https://doi.org/10.2307/2118511>", "note": "λ 在不同研究中介于 1.5 到 3.0，但始终显著大于 1。定级 A：前景理论是经济学史上被引最多的论文之一，且有多项实地实验支撑。对抗方法：减少看盘频率、用定投与再平衡代替主观止损止盈。交叉参考：第 8 条（处置效应）、第 11 条（后悔厌恶）。"}, {"chapter": 3, "num": 5, "id": "3-5", "title": "确认偏误与“听消息”", "grade": "B", "tags": {"钱": "0", "时间": "少", "毅力": "些", "收益": "中", "口径": "金钱", "影响": "自己"}, "impact": "自己", "cost_money": "0", "cost_time": "少", "cost_will": "些", "benefit": "中", "scope": "金钱", "three_zero": false, "cost": "一点主动找反例、证伪自己观点的精力。", "plain": "你看好一只股，就自动收集利好、忽略利空。消息越“内部”越紧急，越该反向警惕——真稳赚的信息轮不到群里免费发给你。SEC 多次警示：社交媒体上的“牛股推荐”常与拉高抛售（pump-and-dump）骗局相伴。", "gain": "Nickerson (1998) 系统综述确认偏误：人会主动寻找、解读、回忆支持既有信念的信息，而忽略反证，这一偏差在投资中表现为“只信利好、回避利空”，从而在高估值时继续加仓、在逻辑证伪后仍死守。SEC 投资者警示指出，社交媒体上的“热门股”推荐常被庄家用于制造买入狂热、拉高后出货，散户接盘即深套；所谓“内部消息”几乎必然是骗局或已公开多年的旧闻。跳出确认偏误，至少能避开群内“内部消息”、大 V 喊单的一次性收割。", "source": "Nickerson, R. S. (1998). \"Confirmation Bias: A Ubiquitous Phenomenon in Many Guises.\" Review of General Psychology, 2(2), 175–220. <https://doi.org/10.1037/1089-2680.2.2.175>; U.S. SEC (2021). \"Investor Alert: Thinking About Investing in the Latest Hot Stock?\" <https://www.sec.gov/resources-for-investors/investor-alerts-bulletins/thinking-about-investing-latest-hot-stock>", "note": "确认偏误本身是心理学稳健结论（定级 B 因投资场景多为推断而非单一大规模实证）。对抗方法：强制写“看空理由清单”、只用可验证的公开财报数据。交叉参考：第 20 条（叙事谬误）。"}, {"chapter": 3, "num": 6, "id": "3-6", "title": "过度自信：账户越多交易越频越觉得自己能赢", "grade": "B", "tags": {"钱": "0", "时间": "少", "毅力": "些", "收益": "中", "口径": "金钱", "影响": "自己"}, "impact": "自己", "cost_money": "0", "cost_time": "少", "cost_will": "些", "benefit": "中", "scope": "金钱", "three_zero": false, "cost": "一点“我可能没那么神”的自我怀疑。", "plain": "牛市里人人股神，潮水退前看不出。把运气当能力，是下一轮亏损起点。Barber & Odean 用性别拆穿了它：男交易多、收益差，差异恰来自更高的过度自信。", "gain": "Barber & Odean (2001) 用超 35,000 个账户（1991—1997）发现，男性交易频率比女性高 45%；而交易对男性年化净收益的损伤达 2.65 个百分点，女性为 1.72 个百分点——男性因更过度自信而多亏了约 0.94 个百分点／年。心理学基础是：人普遍高估自己预测与选股的能力（约 90% 的司机觉得自己高于平均）。把精力从“挑下一只牛股”转向“控成本与仓位”这类真正可控的事，才是理性选择。", "source": "Barber, B. M. & Odean, T. (2001). \"Boys Will Be Boys: Gender, Overconfidence, and Common Stock Investment.\" Quarterly Journal of Economics, 116(1), 261–292. <https://doi.org/10.1162/003355301556400>; Barber, B. M. & Odean, T. (2000). \"Trading Is Hazardous to Your Wealth...\" Journal of Finance, 55(2), 773–806. <https://doi.org/10.1111/0022-1082.00226>", "note": "女性样本也过度交易，只是程度较轻，结论非“性别优劣”而是“过度自信梯度”。定级 B：账户证据强，但性别结论存在文化与代际差异的讨论。对抗方法：假设自己跑不赢指数，直接买宽基。交叉参考：第 1 条（频繁交易）。"}, {"chapter": 3, "num": 7, "id": "3-7", "title": "锚定效应：被“买入价”钉死", "grade": "C", "tags": {"钱": "0", "时间": "少", "毅力": "些", "收益": "中", "口径": "金钱", "影响": "自己"}, "impact": "自己", "cost_money": "0", "cost_time": "少", "cost_will": "些", "benefit": "中", "scope": "金钱", "three_zero": false, "cost": "放下“回本才卖”的执念。", "plain": "“我 10 块买的，现在 7 块卖了就是亏”——错。7 块时它的价值就是 7 块，跟 10 块无关。决策只看未来，不看已花成本。Tversky 与 Kahneman 的锚定实验表明，人会被最先接触到的数字钉死。", "gain": "Tversky & Kahneman (1974) 在《Science》提出锚定启发式：人在估计时会被一个无关的初始数字系统性地拉偏。投资中，买入价、历史高点、“回本线”都成为锚——投资者因“还没回本”而拒绝卖出已无基本面的股票，或因“已经赚了”而过早兑现。行为金融进一步发现，锚定使投资者对账面盈亏而非组合未来风险做决策，导致再平衡滞后、集中持套。打破锚定的办法是：每次决策都问“以今天的价格，我还会买入吗？”", "source": "Tversky, A. & Kahneman, D. (1974). \"Judgment under Uncertainty: Heuristics and Biases.\" Science, 185(4157), 1124–1131. <https://doi.org/10.1126/science.185.4157.1124>; Kahneman, D. & Tversky, A. (1979). \"Prospect Theory...\" Econometrica, 47(2), 263–291. <https://doi.org/10.2307/1914185>", "note": "锚定在实验室极稳健，但在真实账户中常与其他偏差（损失厌恶、处置效应）叠加，难以单独量化，故定级 C。对抗方法：用估值与基本面替代成本价做决策。交叉参考：第 8 条（处置效应）、第 10 条（禀赋效应）。"}, {"chapter": 3, "num": 8, "id": "3-8", "title": "处置效应：卖盈持亏", "grade": "A", "tags": {"钱": "0", "时间": "少", "毅力": "些", "收益": "中", "口径": "金钱", "影响": "自己"}, "impact": "自己", "cost_money": "0", "cost_time": "少", "cost_will": "些", "benefit": "中", "scope": "金钱", "three_zero": false, "cost": "按逻辑止损／止盈的纪律（反本能）。", "plain": "人爱卖赚钱的（落袋为安）、留亏钱的（等回本）。结果组合里全是被套的。正确做法常常相反：让赢家跑、认错砍败者。Odean 用一万个账户把这件事量化得明明白白。", "gain": "Odean (1998) 分析某大型折扣券商 1987—1993 年 10,000 个账户，定义“实现盈利比例 PGR”与“实现亏损比例 PLR”：全年 PGR=14.8% 而 PLR=9.8%——盈利股被卖出的概率比亏损股高约 50%（12 月税筹卖亏除外）。更致命的是，被卖出的赢家在未来一年平均比被持有的输家多涨 3.4%，说明“卖盈持亏”不是避税或再平衡，纯粹在砍好票、留烂票。组合因此持续劣化：留下跌的、砍掉涨的，长期质量必然下降。", "source": "Odean, T. (1998). \"Are Investors Reluctant to Realize Their Losses? An Analysis of Daily Equity Transactions.\" Journal of Finance, 53(5), 1775–1798. <https://doi.org/10.1111/0022-1082.00072>; Kahneman, D. & Tversky, A. (1979). \"Prospect Theory...\" Econometrica, 47(2), 263–291. <https://doi.org/10.2307/1914185>", "note": "原条目标 B，但本研究基于 10,000 真实账户、被芬兰／台湾／中国等市场反复复制，上调为 A。损失厌恶（前景理论）是其主要解释。对抗方法：用再平衡规则强制卖出部分赢家、止损部分输家。交叉参考：第 4 条（损失厌恶）、第 11 条（后悔厌恶）。"}, {"chapter": 3, "num": 9, "id": "3-9", "title": "羊群效应：别人买我也买", "grade": "C", "tags": {"钱": "0", "时间": "少", "毅力": "些", "收益": "中", "口径": "金钱", "影响": "自己／家庭"}, "impact": "自己／家庭", "cost_money": "0", "cost_time": "少", "cost_will": "些", "benefit": "中", "scope": "金钱", "three_zero": false, "cost": "一点独立判断的勇气。", "plain": "当扫地阿姨都来问买哪只股，往往是最危险的时候。crowd 不是智慧，是踩踏的前奏。信息级联理论说明：别人买我也买，会让价格偏离基本面越来越远。", "gain": "Bikhchandani, Hirshleifer & Welch (1992) 的“信息级联”模型证明，当后来者只观察前人行动、不共享私人信息时，会理性地跟随人群，最终价格严重偏离真实价值、形成泡沫与踩踏。在 A 股，上交所对数千万账户的统计显示，散户在指数高位集中放量涌入、在低位恐慌撤离，牛市最狂热时新增开户与成交骤增，随后回撤接盘。跟风的代价，是系统性买在别人想卖时、卖在别人想买时。", "source": "Bikhchandani, S., Hirshleifer, D. & Welch, I. (1992). \"A Theory of Fads, Fashion, Custom, and Cultural Change as Informational Cascades.\" Quarterly Journal of Economics, 107(4), 992–1026. <https://doi.org/10.2307/2118375>; 上海证券交易所 (2020). 《上海证券交易所统计年鉴》. <https://www.sse.com.cn/>", "note": "上交所散户数据见本书其他章节（5340 万账户研究）交叉参考。定级 C：级联理论为模型推演，A 股证据为统计相关，难以做因果隔离。对抗方法：把“别人在买”当作反向温度计而非信号。交叉参考：第 3 条（追涨杀跌）、第 17 条（社会比较）。"}, {"chapter": 3, "num": 10, "id": "3-10", "title": "禀赋效应：手里的就格外舍不得卖", "grade": "C", "tags": {"钱": "0", "时间": "少", "毅力": "些", "收益": "中", "口径": "金钱", "影响": "自己"}, "impact": "自己", "cost_money": "0", "cost_time": "少", "cost_will": "些", "benefit": "中", "scope": "金钱", "three_zero": false, "cost": "客观评估持仓的冷酷。", "plain": "同一只股票，买之前觉得一般，买之后就觉得它是宝。这是心理溢价，不是真实价值。定期问：“如果现在空仓，我还会买它吗？”", "gain": "Kahneman, Knetsch & Thaler (1990) 用实验证明禀赋效应：人们给“自己已拥有”的东西开出的卖价，显著高于给“未拥有”同物开的买价（经典马克杯实验中差价可达 2 倍）。在投资上，一旦买入，标的就在心理账户里被贴上“我的”标签，于是拒绝按市价止损、拒绝再平衡、对亏损持仓格外宽容。结果是个股过度集中、组合风险漂移而不自知。", "source": "Kahneman, D., Knetsch, J. L. & Thaler, R. H. (1990). \"Experimental Tests of the Endowment Effect and the Coase Theorem.\" Journal of Political Economy, 98(6), 1325–1348. <https://doi.org/10.1086/261737>; Thaler, R. H. (1980). \"Toward a Positive Theory of Consumer Choice.\" Marketing Science, 4(3), 199–214. <https://doi.org/10.1287/mksc.4.3.199>", "note": "原条目引 Thaler (1980)，此处补全为 1990 经典实验并保留 1980 作思想源头。定级 C：实验室极稳健，但投资场景多为推断。对抗方法：假设自己是“空仓旁观者”重新评估每笔持仓。交叉参考：第 13 条（心理账户）。"}, {"chapter": 3, "num": 11, "id": "3-11", "title": "后悔厌恶：因怕后悔而停滞", "grade": "C", "tags": {"钱": "0", "时间": "少", "毅力": "些", "收益": "中", "口径": "金钱", "影响": "自己"}, "impact": "自己", "cost_money": "0", "cost_time": "少", "cost_will": "些", "benefit": "中", "scope": "金钱", "three_zero": false, "cost": "承认“之前买贵了”的心理成本。", "plain": "很多人不卖，是因为怕“卖了马上涨、更后悔”。但死扛的代价是实打实的，后悔只是情绪。用规则替你做决定，把自己摘出去。", "gain": "Loomes & Sugden (1982) 的“后悔理论”指出，人在决策时会预先计算“如果结果不好，我会多后悔”，并因此回避可能导致后悔的选项——在投资中表现为：宁可死扛烂票也不止损（怕“卖了就涨”），宁可追高也不错过（怕“没上车”）。这种对“行动后悔”与“不行动后悔”的非对称恐惧，使投资者长期偏离最优组合。把卖出／买入交给既定规则（如再平衡阈值、定投日历），能有效把“后悔”从决策回路中移除。", "source": "Loomes, G. & Sugden, R. (1982). \"Regret Theory: An Alternative Theory of Rational Choice Under Uncertainty.\" Economic Journal, 92(368), 805–824. <https://doi.org/10.2307/2232669>; Kahneman, D. & Tversky, A. (1979). \"Prospect Theory...\" Econometrica, 47(2), 263–291. <https://doi.org/10.2307/1914185>", "note": "后悔厌恶与损失厌恶、处置效应高度重叠，常被并称为“处置效应”的心理基础。定级 C：理论成熟但投资中单独量化较难。对抗方法：写死交易规则、用自动化执行代替临场判断。交叉参考：第 4、8 条。"}, {"chapter": 3, "num": 12, "id": "3-12", "title": "近因偏差：只看最近涨跌", "grade": "C", "tags": {"钱": "0", "时间": "少", "毅力": "些", "收益": "中", "口径": "金钱", "影响": "自己"}, "impact": "自己", "cost_money": "0", "cost_time": "少", "cost_will": "些", "benefit": "中", "scope": "金钱", "three_zero": false, "cost": "一点拉长时间看的耐心。", "plain": "大脑对刚发生的事权重过高。昨天大跌就觉得要崩、上周连涨就觉得永涨。把窗口拉到年甚至十年，噪声就小了。", "gain": "Tversky & Kahneman (1974) 指出，人在判断趋势时会被“最近可得”的样本主导（代表性启发式的一种表现），对刚发生的大涨大跌赋予过高权重，从而把噪声当信号。Benartzi & Thaler (1995) 进一步证明，投资者评估组合的频率越高（日频 vs 年频），越容易被短期波动吓退、要求越高的风险补偿，这就是“短视损失厌恶”。近因偏差让你在暴跌后恐慌割肉、在连涨后冲动追高，恰好把“低卖高买”执行到底。", "source": "Tversky, A. & Kahneman, D. (1974). \"Judgment under Uncertainty: Heuristics and Biases.\" Science, 185(4157), 1124–1131. <https://doi.org/10.1126/science.185.4157.1124>; Benartzi, S. & Thaler, R. H. (1995). \"Myopic Loss Aversion and the Equity Premium Puzzle.\" Quarterly Journal of Economics, 110(1), 73–92. <https://doi.org/10.2307/2118511>", "note": "与第 4、18 条同源，定级 C：实验室稳健、市场单独量化难。对抗方法：降低看盘频率、用长期视角与定投平滑短期噪声。交叉参考：第 18 条。"}, {"chapter": 3, "num": 13, "id": "3-13", "title": "心理账户：把钱分进不同“罐子”", "grade": "C", "tags": {"钱": "0", "时间": "少", "毅力": "些", "收益": "中", "口径": "金钱", "影响": "自己"}, "impact": "自己", "cost_money": "0", "cost_time": "少", "cost_will": "些", "benefit": "中", "scope": "金钱", "three_zero": false, "cost": "把“投资亏的钱”和“吃饭的钱”分开记账的直觉。", "plain": "你股票赚了 1 万敢去吃大餐，基金亏了 1 万却死拿着不卖——其实是同一笔钱。打破“这笔是旅游钱、那笔是养老金”的错觉，决策才清醒。", "gain": "Thaler (1985, 1999) 的心理账户理论指出，人会把钱按来源、用途分割进不同“罐子”，并对不同罐子采用不同风险态度——于是用“赢来的钱”去赌博、对“本金账户”过度保守、对“亏损账户”死扛不放。在投资上，这导致：(1) 不同账户间不统筹，整体资产配置失衡；(2) 把浮亏账户当作“还没输”而拒绝再平衡；(3) 用税后收益补贴消费，侵蚀复利。钱没有标签，统一看总资产与风险预算才是正确框架。", "source": "Thaler, R. H. (1985). \"Mental Accounting and Consumer Choice.\" Marketing Science, 4(3), 199–214. <https://doi.org/10.1287/mksc.4.3.199>; Thaler, R. H. (1999). \"Mental Accounting Matters.\" Journal of Behavioral Decision Making, 12(3), 183–206. <https://doi.org/10.1002/(SICI)1099-0771(199909)12:3<183::AID-BDM318>3.0.CO;2-F>", "note": "Thaler 凭行为经济学获 2017 年诺贝尔经济学奖，心理账户是核心贡献。定级 C：理论扎实，但“账户错配”的市场损失难以单独剥离。对抗方法：建立统一的总资产视图与全局再平衡纪律。交叉参考：第 10 条（禀赋效应）。"}, {"chapter": 3, "num": 14, "id": "3-14", "title": "控制错觉：以为自己能影响随机结果", "grade": "C", "tags": {"钱": "0", "时间": "少", "毅力": "些", "收益": "中", "口径": "金钱", "影响": "自己"}, "impact": "自己", "cost_money": "0", "cost_time": "少", "cost_will": "些", "benefit": "中", "scope": "金钱", "three_zero": false, "cost": "相信“我操作更及时／我选股更准”的错觉。", "plain": "每天盯盘、频繁买卖，让你“感觉在控制”，但市场不认你的勤奋。越觉得自己能掌控，越容易被手续费和情绪收割。Langer 的实验早就证明：人对“无关自己的随机结果”也会产生控制感。", "gain": "Langer (1975) 的“控制错觉”实验显示，即便结果纯属随机，人也会因“自己参与了选择／操作”而高估对结果的控制力（如赌局中自选号码者更惜售）。在投资中，这表现为：每天择时、频繁调仓、迷恋“操作感”，误把随机波动当成自己能驾驭的信号。大量账户研究（见第 1 条 Barber & Odean 2000）表明，投资者的“控制感”与真实收益无关，反而因增加交易频次推高成本、放大情绪损耗，长期显著拖累回报。", "source": "Langer, E. J. (1975). \"The Illusion of Control.\" Journal of Personality and Social Psychology, 32(2), 311–328. <https://doi.org/10.1037/h0076498>; Barber, B. M. & Odean, T. (2000). \"Trading Is Hazardous to Your Wealth...\" Journal of Finance, 55(2), 773–806. <https://doi.org/10.1111/0022-1082.00226>", "note": "控制错觉是频繁交易（第 1 条）的心理燃料。定级 C：实验稳健、市场层面与交易频次研究呼应。对抗方法：承认市场短期不可控，用指数化与定投把“控制欲”降到最低。交叉参考：第 1 条。"}, {"chapter": 3, "num": 15, "id": "3-15", "title": "赌徒谬误：连跌后觉得“该涨了”", "grade": "C", "tags": {"钱": "0", "时间": "少", "毅力": "些", "收益": "中", "口径": "金钱", "影响": "自己"}, "impact": "自己", "cost_money": "0", "cost_time": "少", "cost_will": "些", "benefit": "中", "scope": "金钱", "three_zero": false, "cost": "相信“已经跌这么多了，反弹是迟早的”。", "plain": "“连跌五天，第六天必涨”——这是赌徒逻辑，不是投资逻辑。跌透了的票可以继续跌透，别用“该反弹了”给自己壮胆。", "gain": "Tversky & Kahneman (1971) 的“小数定律”与代表性启发式揭示：人误以为小样本应“看起来像”大样本，于是相信连跌之后“该涨了”、连涨之后“该跌了”。但股价短期近似随机游走，过去涨跌对未来无预测力。实验与实地数据一致显示，抱持赌徒谬误的投资者倾向于在下跌中“抄底”垃圾股、在连续上涨后恐高卖出，两侧都亏。理性做法是把每笔决策视为独立事件，用估值与基本面而非“连跌次数”判断。", "source": "Tversky, A. & Kahneman, D. (1971). \"Belief in the Law of Small Numbers.\" Psychological Bulletin, 76(2), 105–110. <https://doi.org/10.1037/h0031322>; Tversky, A. & Kahneman, D. (1974). \"Judgment under Uncertainty: Heuristics and Biases.\" Science, 185(4157), 1124–1131. <https://doi.org/10.1126/science.185.4157.1124>", "note": "与第 12 条（近因偏差）同源，定级 C。对抗方法：放弃“抄底计数”，用分批定投与估值阈值替代直觉。交叉参考：第 12 条。"}, {"chapter": 3, "num": 16, "id": "3-16", "title": "幸存者偏差：只看见活下来／赚到的人", "grade": "C", "tags": {"钱": "0", "时间": "少", "毅力": "些", "收益": "中", "口径": "金钱", "影响": "自己"}, "impact": "自己", "cost_money": "0", "cost_time": "少", "cost_will": "些", "benefit": "中", "scope": "金钱", "three_zero": false, "cost": "被“谁谁炒股财务自由”的故事带节奏。", "plain": "饭局上吹炒股赚了的很多，跳楼的和销户的不会出声。用“我认识谁赚了”做决策，等于只看了中奖者名单。", "gain": "Malkiel (1995) 用 1971—1991 年“全部”美股共同基金数据证明，幸存者偏差严重夸大基金业绩：若只统计存活基金，年化回报约 17.1%，但纳入已清盘／合并的“失败者”后，全体基金年化仅 15.7%，且平均 alpha 不显著异于零——所谓“基金能跑赢”很大程度是“死掉的基金不说话”造出来的。投资中同理：你看到的“炒股暴富”样本，被沉默的亏损者系统性污染，据此估算的成功率远高于真实值，据此决策必然高估自己的胜率。", "source": "Malkiel, B. G. (1995). \"Returns from Investing in Equity Mutual Funds 1971 to 1991.\" Journal of Finance, 50(2), 549–572. <https://doi.org/10.1111/j.1540-6261.1995.tb04795.x>; Thaler, R. H. (1999). \"Mental Accounting Matters.\" Journal of Behavioral Decision Making, 12(3), 183–206. <https://doi.org/10.1002/(SICI)1099-0771(199909)12:3<183::AID-BDM318>3.0.CO;2-F>", "note": "经典案例为二战 Wald 对返航战机中弹分布的统计纠正（见抽样偏差文献）。定级 C：金融实证强，但作为“认知偏差”条目其投资损失难以单独计量。对抗方法：只看包含所有样本的统计，不信孤例。交叉参考：第 5 条。"}, {"chapter": 3, "num": 17, "id": "3-17", "title": "社会比较／嫉妒：别人赚了我就难受", "grade": "C", "tags": {"钱": "0", "时间": "少", "毅力": "些", "收益": "中", "口径": "金钱", "影响": "自己"}, "impact": "自己", "cost_money": "0", "cost_time": "少", "cost_will": "些", "benefit": "中", "scope": "金钱", "three_zero": false, "cost": "被朋友圈／群里别人的收益刺激，乱加仓。", "plain": "别人晒收益你焦虑，于是高位冲进去——恰好接了别人的盘。别人的账户与你无关，盯自己的计划。", "gain": "行为金融将“社会偏好与攀比”视为追涨杀跌的情绪燃料：当同伴收益高于自己，投资者会产生相对剥夺感，进而提高风险承担、在高位加仓以“追上别人”（Bikhchandani 等的信息级联与注意力效应也佐证了这一点）。实证上，Barber & Odean (2008) 显示散户净买入集中于“别人都在谈”的热门股，而这类注意力驱动的买入长期跑输。社交平台放大了这种攀比，使人在市场顶部最焦虑、最冲动。", "source": "Barber, B. M. & Odean, T. (2008). \"All That Glitters...\" Review of Financial Studies, 21(2), 785–818. <https://doi.org/10.1093/rfs/hhm079>; Bikhchandani, S., Hirshleifer, D. & Welch, I. (1992). \"A Theory of Fads... as Informational Cascades.\" Quarterly Journal of Economics, 107(4), 992–1026. <https://doi.org/10.2307/2118375>", "note": "与第 3、9 条同源。定级 C：情绪机制有实验与账户证据，但“嫉妒→亏损”的因果链偏推断。对抗方法：不看收益榜、关掉晒单群、只守自己的再平衡计划。交叉参考：第 9 条。"}, {"chapter": 3, "num": 18, "id": "3-18", "title": "双曲贴现／即时倾向：现在的小奖胜过未来的大奖", "grade": "C", "tags": {"钱": "0", "时间": "少", "毅力": "些", "收益": "中", "口径": "金钱", "影响": "自己"}, "impact": "自己", "cost_money": "0", "cost_time": "少", "cost_will": "些", "benefit": "中", "scope": "金钱", "three_zero": false, "cost": "偏好“马上能花的钱／马上能爽的交易”，轻视长期复利。", "plain": "人天然高估眼前、低估未来。这就是为什么大多数人拿不住——复利是“未来的大奖”，但眼前的小波动更抓人。用规则替自己锁定长期。", "gain": "Laibson (1997) 的“双曲线贴现”模型表明，人对近期奖励赋予不成比例的高权重、对远期奖励急速贬值，解释了为何投资者难以坚持定投与长期持有。Frederick, Loewenstein & O'Donoghue (2002) 综述显示，这种“即时倾向”使人频繁查看账户、被短期波动劫持（见第 4 条短视损失厌恶），从而在高点因“怕错过”追入、在低点因“怕更惨”割肉。把长期持有变成“不难受”的默认项——自动定投、少看盘——正是对抗人性短视最便宜的武器。", "source": "Laibson, D. (1997). \"Golden Eggs and Hyperbolic Discounting.\" Quarterly Journal of Economics, 112(2), 443–477. <https://doi.org/10.1162/j.1997.112.2.443>; Frederick, S., Loewenstein, G. & O'Donoghue, T. (2002). \"Time Discounting and Time Preference: A Critical Review.\" Journal of Economic Literature, 40(2), 351–401. <https://doi.org/10.1257/002205102320161311>", "note": "本条目与“定投克服择时”直接对应——定投用机械化买入把即时决策成本降到零。定级 C：模型与实验稳健，长期收益提升属推断但方向明确。交叉参考：第 1、2、4 条。"}, {"chapter": 3, "num": 19, "id": "3-19", "title": "模糊厌恶：回避看不懂的、追熟悉的", "grade": "C", "tags": {"钱": "0", "时间": "少", "毅力": "些", "收益": "中", "口径": "金钱", "影响": "自己"}, "impact": "自己", "cost_money": "0", "cost_time": "少", "cost_will": "些", "benefit": "中", "scope": "金钱", "three_zero": false, "cost": "只买“听过的名字／热搜上的概念”。", "plain": "你敢买熟知的白酒股，不敢买不懂的医药 ETF——但“熟悉”常是信息差的反面。用宽基指数代替“我觉得熟”，反而更稳。", "gain": "Ellsberg (1961) 用“Ellsberg 悖论”证明，人系统性偏好“概率已知的风险”而非“概率未知的不确定”（模糊厌恶），即便两者期望相同。投资中表现为“本土偏好”与“熟悉股偏好”：投资者重仓自己听过、身边人都在谈的股票与行业，回避陌生但更分散、更便宜的指数产品。结果是个股与行业过度集中、 unknowingly 承担非系统性风险，而用宽基指数覆盖全市场，反而用“放弃模糊判断”换来了更稳的暴露。", "source": "Ellsberg, D. (1961). \"Risk, Ambiguity, and the Savage Axioms.\" Quarterly Journal of Economics, 75(4), 643–669. <https://doi.org/10.2307/1926465>; Kahneman, D. & Tversky, A. (1979). \"Prospect Theory...\" Econometrica, 47(2), 263–291. <https://doi.org/10.2307/1914185>", "note": "与“本土偏好”“过度集中”高度相关。定级 C：实验极稳健，市场损失多为推断。对抗方法：用宽基指数替代“我觉得熟”的个股下注。交叉参考：第 13 条。"}, {"chapter": 3, "num": 20, "id": "3-20", "title": "叙事谬误：好故事压过坏数据", "grade": "C", "tags": {"钱": "0", "时间": "少", "毅力": "些", "收益": "中", "口径": "金钱", "影响": "自己"}, "impact": "自己", "cost_money": "0", "cost_time": "少", "cost_will": "些", "benefit": "中", "scope": "金钱", "three_zero": false, "cost": "被“改变世界的赛道”“十年十倍逻辑”这类好故事打动。", "plain": "好故事让人忽视贵估值和高风险。故事讲得越动听，越要问一句：它靠什么真的赚钱？讲不清的，就是赌。", "gain": "Shiller (2017, 诺贝尔经济学奖得主) 提出“叙事经济学”：能“病毒式传播”的好故事会驱动资产价格泡沫（如 1929、2008 均与流行叙事相伴）。Taleb (2007) 的“叙事谬误”则指出，人习惯用简洁因果故事解释随机结果，于是把“赛道叙事”当护城河、忽视估值与现金流。实证中，被故事推高的资产往往估值透支、回撤惨烈；投资者因沉迷叙事而高位接盘、忽略“钱从哪来、估值多少、我能验证什么”的硬问题。", "source": "Shiller, R. J. (2017). \"Narrative Economics.\" American Economic Review, 107(4), 967–1004. <https://www.aeaweb.org/articles?id=10.1257/aer.107.4.967>; Taleb, N. N. (2007). \"The Black Swan: The Impact of the Highly Improbable.\" Random House. <https://www.amazon.com/Black-Swan-Improbable-Robustness-Fragility/dp/1400063515>", "note": "叙事常与第 5 条（确认偏误）、第 3 条（追涨杀跌）协同放大泡沫。定级 C：叙事对价格的因果难以精确量化。对抗方法：任何买入先写清“盈利模式 + 估值锚 + 可证伪条件”。交叉参考：第 5 条。"}, {"chapter": 4, "num": 1, "id": "4-1", "title": "被动指数基金：长期跑赢大多数主动", "grade": "A", "tags": {"钱": "少", "时间": "少", "毅力": "些", "收益": "中", "口径": "金钱", "影响": "自己／家庭"}, "impact": "自己／家庭", "cost_money": "少", "cost_time": "少", "cost_will": "些", "benefit": "中", "scope": "金钱", "three_zero": false, "cost": "放弃战胜市场的幻想；费率约 0.03%–0.5%/年（宽基 ETF 可低至 0.03%）。", "plain": "专业基金经理拿最好的人才和数据，十之八九跑不赢指数。买最低费率的全市场指数，长期排进前 10%–20%，你凭什么觉得自己能稳定挑中那少数赢家？", "gain": "拿到市场平均，就已经赢过大多数折腾的人。S&P Dow Jones Indices 的 SPIVA 美国年终 2024 显示，大盘主动基金跑输标普 500 的比例随年限递增：1 年 65.2%、5 年 76.3%、10 年 84.3%、15 年 89.5%、20 年 92.0%（已计入清盘与合并、修正存活者偏差）。换言之，持有 20 年，每 10 个职业经理人有 9 个以上输给\"只买指数、几乎零操作\"的免费策略。巴菲特百万美元赌约（2008–2017）是同一结论的活标本：Vanguard 标普 500 指数基金累计回报 125.8%（年化 8.5%），而对冲基金组合仅 36.3%（年化 3.1%），5 只无一胜出。对普通人，最低费率宽基指数就是性价比最高的\"默认选项\"。", "source": "S&P Dow Jones Indices (2025). SPIVA U.S. Scorecard Year-End 2024（Report 1a：All Large-Cap Funds vs. S&P 500；10 年期 84.3%、20 年期 92.0% 跑输）. <https://www.spglobal.com/spdji/en/documents/spiva/spiva-us-year-end-2024.pdf>; Buffett, W. (2018). Berkshire Hathaway 2017 Annual Letter（十年赌约：指数基金 125.8% vs 对冲基金组合 36.3%）. <https://www.berkshirehathaway.com/letters/2017ltr.pdf>; S&P Dow Jones Indices (2025). SPIVA U.S. Persistence Scorecard Year-End 2024（顶级基金次年留存率近零）. <https://www.spglobal.com/spdji/en/documents/spiva/persistence-scorecard-year-end-2024.pdf>", "note": "局限性：主动管理在低效市场（小盘、新兴）偶尔占优，少数明星可长期胜出但事前极难识别；指数基金承担市场全部回撤，不解决\"买在高位\"的问题。交叉参考：第 2、9、11 条。"}, {"chapter": 4, "num": 2, "id": "4-2", "title": "定投：不赌\"现在是不是底\"", "grade": "B", "tags": {"钱": "少", "时间": "少", "毅力": "些", "收益": "中", "口径": "金钱", "影响": "自己"}, "impact": "自己", "cost_money": "少", "cost_time": "少", "cost_will": "些", "benefit": "中", "scope": "金钱", "three_zero": false, "cost": "每月操作琐碎；在单边长牛市中可能略低于一次性投入（Vanguard 研究：一次性投入约 2/3 概率胜定投）。", "plain": "没人知道底在哪。每月固定投，涨了份额少、跌了份额多，长期自动\"低买多高买少\"。它是后悔最小化工具，不是收益最大化工具。", "gain": "Vanguard 研报《Dollar-Cost Averaging Just Means Taking Risk Later》(2012) 用美、英、澳 1976–2022 的滚动数据比较：在 1 年持有期内，一次性投入（LSI）胜定投（DCA）的概率在 61.6%–73.7% 之间，且股票占比越高差距越大——100% 股票组合一次性平均多赚约 2.2%。但定投的真正价值不在\"收益最大化\"，而在把\"何时买\"这个最难的决策自动化，规避择时错误与后悔。对每月领薪的普通人，定投把市场波动从\"风险\"变成\"摊薄成本的朋友\"；而 JPMorgan 数据显示错过少数最佳交易日对回报打击巨大（见第 3、6 条），定投强制你\"一直在场\"，从源头消除择时冲动。", "source": "Shtekhman A., Tasopoulos C., Wimmer B. (2012). Dollar-Cost Averaging Just Means Taking Risk Later, Vanguard Research（LSI 胜 DCA 约 2/3，12 个月窗口）. <https://personal.vanguard.com/pdf/s315.pdf>; Vanguard (2023). Lump-Sum Investing Versus Cost Averaging: Which Is Better?. <https://investor.vanguard.com/investor-resources-education/news/lump-sum-investing-versus-cost-averaging-which-is-better>; J.P. Morgan Asset Management (2024). Guide to the Markets – U.S.（错过最佳交易日研究）. <https://mcusercontent.com/b20d9ee981aee111cf724f1f0/files/2aee21c7-8c0e-a728-a02c-73605d211090/Avoiding_the_Cash_Trap_JPM.02.pdf>", "note": "〔争议〕长期上涨市里一次性投入数学上更优，但定投胜在心理与风险，对普通人更稳；定投期拉得越长（如 36 个月），一次性的优势越大。交叉参考：第 6 条。"}, {"chapter": 4, "num": 3, "id": "4-3", "title": "少看盘：看得越多动得越多亏得越多", "grade": "A", "tags": {"钱": "0", "时间": "0", "毅力": "些", "收益": "中", "口径": "金钱", "影响": "自己"}, "impact": "自己", "cost_money": "0", "cost_time": "0", "cost_will": "些", "benefit": "中", "scope": "金钱", "three_zero": false, "cost": "一点\"我在盯盘\"的存在感（零金钱成本）。", "plain": "打开 App 就想操作，操作了就容易错。设成\"季度看一次\"，收益曲线大概率更好看。最好的投资者，往往是忘了密码的人。", "gain": "盯盘频率与交易频率强正相关，而频繁交易是散户净收益的\"抽水机\"。Barber & Odean（2000）发现交易最频繁的散户年化净收益显著落后于低频者；DALBAR 2024 版 QAIB 显示，普通股票基金投资者 20 年年化仅 8.7%，落后标普 500 的 9.7% 整整 1 个百分点——主要源于恐慌卖出与错过反弹。JPMorgan（2024）更指出：2004–2023 全程持有标普 500 年化 9.7%，若错过仅 10 个最佳交易日便降至 5.5%、错过 20 天降至 2.8%；而最佳日往往紧随最差日（波动聚集），频繁看盘者恰在最恐慌时离场，系统性错过反弹。少看盘＝强制在场＝保住收益。", "source": "Barber, B. & Odean, T. (2000). Trading Is Hazardous to Your Wealth, Journal of Finance 55(2):773–806. <https://doi.org/10.1111/j.1540-6261.2000.tb03224.x>; DALBAR (2024). Quantitative Analysis of Investor Behavior (QAIB) 2024（20 年年化 8.7% vs S&P 500 9.7%）. <https://www.dalbar.com/?p=17875/>; J.P. Morgan Asset Management (2024). Guide to Retirement / Guide to the Markets（错过最佳 10 日年化 9.7%→5.5%）. <https://mcusercontent.com/b20d9ee981aee111cf724f1f0/files/2aee21c7-8c0e-a728-a02c-73605d211090/Avoiding_the_Cash_Trap_JPM.02.pdf>", "note": "Fidelity 内部统计亦显示绩效最好的账户属于已故或忘记密码的持有人（行为惰性效应）。交叉参考：第 6、7 条。"}, {"chapter": 4, "num": 4, "id": "4-4", "title": "资产配置：决定回报波动的绝大部分", "grade": "B", "tags": {"钱": "少", "时间": "少", "毅力": "些", "收益": "中", "口径": "金钱", "影响": "自己"}, "impact": "自己", "cost_money": "少", "cost_time": "少", "cost_will": "些", "benefit": "中", "scope": "金钱", "three_zero": false, "cost": "一点规划精力（股／债／现金比例）。", "plain": "选哪只基金的影响远小于\"股债各占多少\"。先定大类比例（稳健者股 30–50%、债 40–60%），再挑低成本工具。比例错，挑再牛的标的也救不回。", "gain": "Brinson、Hood 与 Beebower（1986）研究 91 只美国大型养老金（1974–1983），发现资产配置政策（股债现金长期权重）平均解释了组合总回报变动的 93.6%，市场时机与个股选择仅分别把解释度额外推到 95.3% 与 97.8%；主动管理平均每年拖累约 1.1%。Ibbotson & Kaplan（2000）进一步确认：资产配置解释跨期回报波动约 90%、组合间长期差异约 40%。换言之，普通人把精力花在\"定比例\"上，性价比远高于挑基金、择时。大类比例定错，后面选什么标的都难力挽。", "source": "Brinson, G., Hood, L.R. & Beebower, G.L. (1986). Determinants of Portfolio Performance, Financial Analysts Journal 42(4):39–44（R²=93.6%）. <https://archive.agb.org/trusteeship-article/your-most-important-endowment-decision/>; Ibbotson, R. & Kaplan, P. (2000). Does Asset Allocation Policy Explain 40, 90, or 100 Percent of Performance?, Financial Analysts Journal 56(1):26–33. <https://archive.agb.org/trusteeship-article/your-most-important-endowment-decision/>", "note": "注意经典结论说的是\"回报波动的 90% 由配置解释\"，并非\"总回报的 90%\"；组合间相对排名差异只有约 40% 由配置决定。交叉参考：第 5、10 条。"}, {"chapter": 4, "num": 5, "id": "4-5", "title": "分散到不同资产／地域", "grade": "B", "tags": {"钱": "少", "时间": "少", "毅力": "些", "收益": "中", "口径": "金钱", "影响": "自己"}, "impact": "自己", "cost_money": "少", "cost_time": "少", "cost_will": "些", "benefit": "中", "scope": "金钱", "three_zero": false, "cost": "放弃押中单一牛股。", "plain": "你不需要知道哪只涨。买一篮子（指数就是现成篮子），把\"这家公司会不会出事\"的风险分散掉，只留\"市场整体会成长\"这条愿赌的。", "gain": "Markowitz（1952）现代组合理论证明，分散可降低非系统性风险而不牺牲预期收益；实证上约 20–30 只不同行业标的即可消除大部分个股特有风险，剩下的主要是市场系统性风险。跨市场、跨资产进一步降低单一经济体冲击：SPIVA 2024 显示国际（非美）与新兴市场主动基金 10 年跑输基准分别达 85.3% 与 87.4%，说明即便在海外，买广基指数也优于押个股。宽基指数基金天然提供这种分散，且费率极低（0.03%–0.5%）。分散降的是\"可避免的个股风险\"，不会消除市场整体回撤，需与长期持有配合。", "source": "Markowitz, H. (1952). Portfolio Selection, Journal of Finance 7(1):77–91. <https://doi.org/10.1111/j.1540-6261.1952.tb01525.x>; S&P Dow Jones Indices (2025). SPIVA U.S. Scorecard Year-End 2024（国际/新兴 10 年跑输 85.3%/87.4%）. <https://www.spglobal.com/spdji/en/documents/spiva/spiva-us-year-end-2024.pdf>; 中证指数有限公司 (2024). 中证全指等宽基指数编制方案（分散化样本）. <http://www.csindex.com.cn/>", "note": "分散不能消除系统性风险（市场整体下跌），须与股债配置、长期持有结合。交叉参考：第 1、4 条。"}, {"chapter": 4, "num": 6, "id": "4-6", "title": "长期持有 + 低换手：把复利留给自己", "grade": "A", "tags": {"钱": "少", "时间": "少", "毅力": "些", "收益": "中", "口径": "金钱", "影响": "自己／家庭"}, "impact": "自己／家庭", "cost_money": "少", "cost_time": "少", "cost_will": "些", "benefit": "中", "scope": "金钱", "three_zero": false, "cost": "放弃短期刺激；承受期间 30%+ 账面回撤的心理。", "plain": "复利最强大，但需要时间。每卖出一次就打断一次复利、多付一次摩擦。买入好资产然后\"什么都不做\"，是最难也最赚的纪律。", "gain": "复利在数学上随年限指数增长，而每次交易都产生摩擦（佣金、印花税、买卖价差）并打断复利。以 A 股为例，印花税自 2023-08 起单边 0.05%、佣金约万 2.5，月换手一次年化摩擦约 1%–3%，20 年复利差距可达约 30%（见第二章）。JPMorgan（2024）量化\"在场\"的价值：2004–2023 全程持有标普 500 年化 9.7%（$1 万→约 $6.4 万），错过 10 个最佳交易日降至 5.5%（$2.9 万）——最佳日多在最差日两周内出现，唯有长期持有才能不错过。DALBAR 显示高换手投资者 20 年年化落后指数约 1 个百分点。买入并持有＝把复利与\"在场权\"都留给自己。", "source": "J.P. Morgan Asset Management (2024). Guide to the Markets – U.S.（全程 9.7% vs 错过 10 最佳日 5.5%）. <https://mcusercontent.com/b20d9ee981aee111cf724f1f0/files/2aee21c7-8c0e-a728-a02c-73605d211090/Avoiding_the_Cash_Trap_JPM.02.pdf>; DALBAR (2024). QAIB 2024（高换手落后指数约 1%/年）. <https://www.dalbar.com/?p=17875/>; 财政部 税务总局 (2023). 关于减半征收证券交易印花税的公告（财政部 税务总局公告2023年第39号）. <https://fgk.chinatax.gov.cn/zcfgk/c102416/c5211343/content.html>", "note": "长期持有不等于永不调整——股债比例严重偏离目标时仍需再平衡（见第 10 条）。交叉参考：第 2、3 条。"}, {"chapter": 4, "num": 7, "id": "4-7", "title": "降低查看频率，设自动提醒", "grade": "B", "tags": {"钱": "0", "时间": "0", "毅力": "些", "收益": "中", "口径": "金钱", "影响": "自己"}, "impact": "自己", "cost_money": "0", "cost_time": "0", "cost_will": "些", "benefit": "中", "scope": "金钱", "three_zero": false, "cost": "关掉行情推送（零成本）。", "plain": "把 App 行情推送关了，每季度看一次报表。你不会因为少看而亏钱，却常因为多看而多操作而亏钱。", "gain": "行为金融学的核心结论：查看频率↑→交易频率↑→净收益↓。Barber & Odean 多项研究一致显示，散户交易越频繁年化净收益越差（最活跃群体落后市场数个百分点）；Odean（1999）与 Statman 引用的跨国数据亦显示，频繁交易者年均落后买入持有者约 1.5 个百分点。把看盘改为\"季度看报表＋自动定投＋自动再平衡\"，等于把决策交给定时规则，绕开损失厌恶与过度自信。零成本、立即可行，是性价比最高的\"自律外包\"。", "source": "Barber, B. & Odean, T. (2000). Trading Is Hazardous to Your Wealth, Journal of Finance 55(2):773–806. <https://doi.org/10.1111/j.1540-6261.2000.tb03224.x>; Odean, T. (1999). Do Investors Trade Too Much?, American Economic Review 89(5):1279–1298. <https://doi.org/10.1257/aer.89.5.1279>", "note": "与第 3 条同源，本条侧重可操作动作（关推送/季度看报表）。交叉参考：第 3、10 条。"}, {"chapter": 4, "num": 8, "id": "4-8", "title": "目标日期基金：一键随年龄降险", "grade": "B", "tags": {"钱": "少", "时间": "少", "毅力": "些", "收益": "中", "口径": "金钱", "影响": "自己／家庭"}, "impact": "自己／家庭", "cost_money": "少", "cost_time": "少", "cost_will": "些", "benefit": "中", "scope": "金钱", "three_zero": false, "cost": "选一个\"目标退休年份\"的基金。", "plain": "如果你懒得管比例，买\"20XX 目标日期基金\"就行——它替你按年龄自动把股换债，到退休自然变稳健。", "gain": "目标日期基金（TDF）内置\"滑梯路径\"（glide path）：随退休临近自动降低股票权重、提高债券，省去个人再平衡。美国 401(k) 与 IRA 广泛采用，被动型 TDF 已成为许多计划的默认选项。Vanguard 研究（2024《The Rebalancing Edge》）显示其门槛式再平衡相对月频再平衡，在积累期为投资者带来每年 15–22 个基点的净增益（相对季频 5–8 个基点）。对\"懒人\"而言，TDF 用一层管理费（通常 0.1%–0.5%/年）买断配置、再平衡与降险全程，避免自己因恐惧在底部卖出。", "source": "Vanguard (2024). The Rebalancing Edge: Optimizing Target-Date Fund Rebalancing through Threshold-Based Strategies（积累期年增益 15–22 bps vs 月频）. <https://corporate.vanguard.com/content/dam/corp/research/pdf/the_rebalancing_edge_optimizing_target_date_fund_rebalancing_through_threshold_based_strategies.pdf>; Vanguard Institutional. Vanguard's Approach to Target-Date Fund Rebalancing. <https://institutional.vanguard.com/insights-and-research/perspective/vanguards-approach-to-target-date-fund-rebalancing.html>", "note": "TDF 的股债比例由发行方决定，未必匹配个人风险偏好；可比较不同公司的滑梯路径与费率。交叉参考：第 4、10 条。"}, {"chapter": 4, "num": 9, "id": "4-9", "title": "懒人\"三基金\"组合足够打底", "grade": "B", "tags": {"钱": "少", "时间": "少", "毅力": "些", "收益": "中", "口径": "金钱", "影响": "自己"}, "impact": "自己", "cost_money": "少", "cost_time": "少", "cost_will": "些", "benefit": "中", "scope": "金钱", "three_zero": false, "cost": "配一只宽基股基＋一只全债基＋一只海外指基。", "plain": "别被几百只基金晃花眼。一只全市场股基＋一只全债基＋一只国际股基，足够多数人用。", "gain": "\"三基金组合\"由 Bogleheads 社区总结（源自 Jack Bogle\"简约的庄严\"）：用三只低成本全市场指数基金覆盖国内股票、国际股票、债券三大基本资产，ETF 口径费率可低至 0.03%–0.17%。它舍弃择股与择时，仅保留\"资产类别配置＋再平衡\"两条杠杆——而这
